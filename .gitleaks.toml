title = "HomeLab gitleaks configuration"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Homelab-specific rules. The default ruleset is tuned for cloud provider keys
# and misses the credentials that actually matter here.
# ---------------------------------------------------------------------------

# gitleaks compiles with RE2, which has no lookahead. Both rules below exclude
# ${PLACEHOLDER} values by requiring the first character of the value to be
# something other than '$', rather than by using a negative lookahead.

[[rules]]
id = "snmp-community-plaintext"
description = "SNMP community string committed in plaintext"
regex = '''(?i)community\s*:\s*["']?[^\s"'#$][^\s"'#]{3,}'''
path = '''.*\.(ya?ml)$'''
tags = ["snmp", "credential"]

[[rules]]
id = "grafana-inline-password"
description = "Grafana admin password set inline instead of from the environment"
regex = '''GF_SECURITY_ADMIN_PASSWORD\s*[:=]\s*[^\s$]+'''
tags = ["grafana", "credential"]

[[rules]]
id = "private-key-block"
description = "PEM private key"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'''
tags = ["key"]

[[rules]]
id = "age-secret-key"
description = "age private key"
regex = '''AGE-SECRET-KEY-1[0-9A-Z]{50,}'''
tags = ["age", "key"]

# Unencrypted OpenTofu/Terraform state or plan JSON (ADR-0076). Keyed on content,
# not on a file name, so it fires on a plaintext state under any name: renamed,
# pasted into a doc, or written by a tofu/ whose encryption.tf was broken.
#
# It does NOT fire on the state tofu/ actually writes. OpenTofu's encrypted
# state is a JSON wrapper of `meta`, `encrypted_data` and `encryption_version`,
# and `terraform_version` is inside the ciphertext. So the encrypted file in
# phoenix's checkout scans clean without an allowlist entry, and this rule going
# red there means encryption is off. scripts/check-tofu-state-encryption.sh
# --self-test proves both halves against states it writes.
[[rules]]
id = "tfstate-plaintext"
description = "Unencrypted OpenTofu/Terraform state"
regex = '''"terraform_version"\s*:\s*"[0-9]'''
keywords = ["terraform_version"]
tags = ["tfstate", "credential"]

# ---------------------------------------------------------------------------
# Allowlist
# ---------------------------------------------------------------------------
[allowlist]
description = "Templates, placeholders and encrypted files"

paths = [
  # Encrypted at rest — the ciphertext is meant to be committed.
  '''secrets/.*\.sops\.yaml$''',
  # Documents required key names and deliberately carries change-me values.
  '''secrets/.*\.example\.yaml$''',
  # Nothing gitignored is allowlisted HERE. This file is what the full-history
  # scan reads (scripts/gitleaks-history.sh), and a path allowlist applies to
  # every commit a history scan walks, not only to the working tree: with
  # `certificates/` listed here, the purged CA key of SECURITY.md would never
  # be reported if it reappeared, and docs/security.md's "a history scan that
  # passes is the evidence the purge worked" would be true of a scan that
  # could not see it. The paths that hold real secrets on a deployed host —
  # .rendered/, certificates/, .env, the installed Ansible collections — are
  # allowlisted in .gitleaks-worktree.toml, which extends this file and is
  # what the working-tree scans read. None of them may ever be a tracked
  # file, which scripts/check-tracked-artefacts.sh asserts; so in history they
  # are findings, and in the working tree they are the deploy.
]

regexes = [
  # ${PLACEHOLDER} substitution targets are not secrets.
  '''\$\{[A-Z_]+\}''',
  '''change-me[a-z-]*''',
  '''REPLACE_WITH_[A-Z]+_AGE_PUBLIC_KEY''',
  '''example\.invalid''',
  '''validation-only''',
  # age *public* keys are safe to commit; only the secret key matters.
  '''age1[a-z0-9]{58}''',
  # What scripts/purge-history.sh leaves behind where a secret used to be.
  # Without this, every redacted line still matches the rule that found the
  # original — the history scan would stay red after a successful purge, and a
  # purge you cannot prove worked is worth very little.
  '''REDACTED-ROTATED-CREDENTIAL''',
]
