---
# The sensor stack: Zeek on a mirror of the lab bridge, and the Alloy that
# carries its logs to the lab's Loki (#437).
#
# Deployed on: fenrir (10.0.30.90, VLAN 30 / ImaginationLAN) — a guest on
#              `Saruman`, VMID 190. NOT BUILT YET. Authored ahead of the guest
#              the way stacks/soc was ahead of odin. The build, and the reboot
#              proof that closes #437, is docs/runbooks/build-the-sensor-guest.md.
# Decided by:  docs/adr/0068-mirror-the-lab-bridge-to-zeek-with-tc-not-open-vswitch.md
#              — why a `tc` mirror on the Linux bridge rather than Open vSwitch,
#              why a guest of its own, and why the check that the mirror is up
#              lives on the hypervisor and not here.
# Deploy with: NOT `make up STACK=sensor`. That target renders a secrets file,
#              and this stack has none — no service here takes a credential.
#              On fenrir, from the repository root:
#                cp stacks/sensor/.env.example stacks/sensor/.env
#                docker compose -f stacks/sensor/compose.yaml up -d
#              stacks/media is the other stack deployed this way, for a
#              different reason (#528); README.md has the procedure.
#
# WHAT THIS SEES AND WHY. `fenrir` has two NICs. `net0` is on vmbr0 like every
# other guest and carries this stack's own traffic to alexander. `net1` sits
# alone on the port-less `vmbr1` and receives nothing but the copies the
# hypervisor's `tc` mirror sends it: the ingress of every vmbr0 port, which is
# every frame on the lab bridge exactly once (ADR-0068). That includes the
# domain's east-west traffic — LLMNR, NBT-NS, SMB, Kerberos, LDAP, ARP — which
# crosses no router and which Suricata on morpheus therefore never sees
# (ADR-0006, ADR-0014).
#
# WHAT SAYS IT STOPPED. Not anything here. The lab's Loki has no ruler
# (ADR-0020), so "Zeek went quiet" cannot be alerted where its logs land (#441).
# homelab_zeek_mirror_active on the hypervisor is the check, and it proves the
# mirror delivers packets to this guest — not that Zeek is reading them. A
# crashed Zeek in a running guest shows as `restart: unless-stopped` doing its
# job, or as the zeek log streams going flat in the lab's Grafana.
#
# ---------------------------------------------------------------------------
# On the comments in this file
# ---------------------------------------------------------------------------
# The settings shared with stacks/observability and stacks/soc — `init: true`,
# `pids_limit`, the logging driver — are argued in those files and not here.
# What is written out is where this stack differs.

name: sensor

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Zeek — a protocol logger, not a second Suricata. conn, dns, http, ssl,
  # x509, files, smb, kerberos, ntlm, dce_rpc, ldap: what happened, not whether
  # it matched a signature.
  #
  # DIFFERENCE: host networking and two capabilities, the only service in the
  # repository with either. It captures from a NIC of the guest, which a
  # container network cannot reach; NET_RAW opens the packet socket and
  # NET_ADMIN puts the interface in promiscuous mode. Everything else is
  # dropped. The interface has no address and sits on a bridge with nothing
  # else on it, so host networking reaches nothing it would not already.
  #
  # -C because the mirror copies frames before the NIC would have filled in
  # offloaded checksums; without it Zeek discards them as corrupt. The BPF
  # filter drops this guest's own traffic, half of which the mirror sees
  # (alexander's replies to it enter vmbr0 on alexander's tap).
  # ---------------------------------------------------------------------------
  zeek:
    image: zeek/zeek:9.0.0@sha256:70733f4e540ba1608e37e00c6a93d009f79734262c9ec2ba09d90aa9abc16de5
    container_name: sensor-zeek
    restart: unless-stopped
    logging: *default-logging
    init: true
    pids_limit: 256
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # A bound, not a measurement: re-derive from container_memory_rss in the
    # lab's Prometheus after a fortnight, as stacks/soc says of its own.
    mem_limit: 4096m
    memswap_limit: 4096m
    working_dir: /zeek/logs
    command:
      - zeek
      - -C
      - -i
      - "${ZEEK_INTERFACE:-ens19}"
      - -f
      - "not host ${SENSOR_ADDR:-10.0.30.90}"
      - local
      - /zeek/site/local.zeek
    volumes:
      - ./zeek/local.zeek:/zeek/site/local.zeek:ro
      # FoxIO's ja4-zeek-scripts, vendored at a commit by scripts/vendor-ja4.sh
      # (ADR-0069). Read-only beside local.zeek, which loads it. Not MIT:
      # zeek/ja4/NOTICE says what licenses it.
      - ./zeek/ja4:/zeek/site/ja4:ro
      - zeek-logs:/zeek/logs
    # stats.log is written every five minutes by misc/stats, which the image's
    # own `local` loads, and reopened in /zeek/logs on each hourly rotation. A
    # fresh one says the event loop is turning, which a live PID does not. It
    # does not say packets arrive: homelab_zeek_mirror_active on the
    # hypervisor is that check (#845). Eleven minutes is two intervals and a
    # minute of slack.
    healthcheck:
      test: ["CMD-SHELL", "find /zeek/logs/stats.log -mmin -11 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 6m

  # ---------------------------------------------------------------------------
  # Docker socket proxy (#836). The estate's docker-socket-proxy (#193); its
  # comment in stacks/observability/compose.yaml is the reasoning. `:ro` on
  # the socket does not stop POST /containers/create, so a collector holding the
  # socket holds root on the host.
  # Alloy now reaches the API here, GET-only, and the socket stops at this
  # container. Not published.
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    restart: unless-stopped
    logging: *default-logging
    init: true
    networks: [sensor]
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: sensor-docker-socket-proxy
    environment:
      # The estate's allowlist exactly: what docker.alloy's three components
      # were measured to need (#193). NETWORKS is the one that is not obvious;
      # without it discovery.docker fails and container logs stop while the
      # agent stays healthy.
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      NETWORKS: 1
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    mem_limit: 64m
    memswap_limit: 64m
    # Not read_only, for the estate's measured reason: the entrypoint writes
    # haproxy.cfg from the environment at every start.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The estate's probe (#845); stacks/observability/compose.yaml's
      # docker-socket-proxy has the reasoning.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  # ---------------------------------------------------------------------------
  # Alloy — this guest's collector, and the thing that ships Zeek's logs.
  #
  # config.alloy and docker.alloy are mounted from stacks/observability/alloy/
  # unchanged, as stacks/soc does and for its reason. zeek.alloy is this
  # stack's own and lives HERE: the estate's Alloy mounts that whole directory,
  # and a copy there would tail a /zeek that does not exist on VLAN 99.
  #
  # LOG_READ_GID and ALLOY_HOSTNAME keep defaults here: LOG_READ_GID is 4,
  # `adm` on Ubuntu, which owns /var/log/syslog, and ALLOY_HOSTNAME is fenrir,
  # since this stack has exactly one host. They date from when the stack had no
  # `make render`. Since #834 it has one, for INGEST_TOKEN below, and render
  # writes both values anyway; the defaults are kept so a `docker compose`
  # typed by hand still labels the host correctly.
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: sensor-alloy
    restart: unless-stopped
    logging: *default-logging
    init: true
    pids_limit: 1024
    # A bound, not a measurement: re-derive from process_resident_memory_bytes
    # {job="fenrir-alloy"} in the lab's Prometheus after a fortnight, as zeek's
    # says. (Per-container container_memory_rss is not kept there: the lab's
    # cAdvisor series are the root cgroup only.) 293 MiB was the peak over
    # the 6.2 days fenrir had run on 2026-10-07, median 280 — flat, with no
    # excursion yet — and 1024m is the estate's ~3.5x on top (#114).
    # The neighbour is zeek's 4096m on an 8 GiB guest (#845).
    mem_limit: 1024m
    memswap_limit: 1024m
    networks: [sensor]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${LOG_READ_GID:-4}"
      - "473"
    cgroup: host
    environment:
      # alexander, the lab's own stores. Nothing here points at 10.0.99.20,
      # and nothing may (ADR-0007).
      LOKI_URL: http://${LAB_HOST:-10.0.30.40}:${LAB_LOKI_PORT:-3100}/loki/api/v1/push
      PROMETHEUS_REMOTE_WRITE_URL: http://${LAB_HOST:-10.0.30.40}:${LAB_PROMETHEUS_PORT:-9090}/api/v1/write
      ALLOY_HOSTNAME: ${ALLOY_HOSTNAME:-fenrir}
      # Read by docker.alloy's three components; the socket is not mounted (#836).
      DOCKER_API: tcp://docker-socket-proxy:2375
      # fenrir's token for the lab's ingest proxy (#834), and the reason this
      # stack now has a secrets file and a `make up`. Its other copy is
      # INGEST_TOKEN_FENRIR in secrets/lab.sops.yaml.
      INGEST_TOKEN: ${INGEST_TOKEN:?set in secrets/sensor.sops.yaml}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../observability/alloy/docker.alloy:/etc/alloy/docker.alloy:ro
      - ./alloy/zeek.alloy:/etc/alloy/zeek.alloy:ro
      - zeek-logs:/zeek/logs:ro
      - alloy-data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      - /:/rootfs:ro
    # /rootfs/run masked: stacks/lab/compose.yaml's alloy has the reason.
    tmpfs:
      - /rootfs/run:size=64k,mode=0755
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    healthcheck:
      # The estate's probe (#845); stacks/observability/compose.yaml's alloy
      # has the reasoning.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345
          && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3
          && head -n1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  sensor:
    driver: bridge

volumes:
  # Zeek's logs live on fenrir's second disk, not the OS volume, the way
  # odin's indexer does (#439): a mirror of a busy segment writes steadily, and
  # a separate filesystem is somewhere for that arithmetic to be wrong safely.
  # build-the-sensor-guest.md makes the empty mountpoint immutable, so with the
  # disk unmounted `up` fails instead of filling the OS disk.
  zeek-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SENSOR_DATA_DIR:-/srv/sensor-data}/zeek
  alloy-data:
