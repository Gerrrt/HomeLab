---
# Unit tests for lab.rules.yaml.
#
# The pairing is the point, and it is the argument #63 produced: a case that
# only ever expects silence would pass against a rule that can never fire.
# `ContainerHighMemory` divided by a limit nothing set, guarded on it being
# non-zero, and was therefore unfireable for any input — while `promtool check
# rules` passed it every time, because that parses PromQL and never asks
# whether an expression can be true. So each rule below gets a firing case AND
# a quiet case: the first proves the expression produces an alert for a real
# input, the second proves it does not produce one for the input production
# actually supplies.
#
# All nineteen rules in lab.rules.yaml are covered here. That is a deliberate
# difference from the estate's tests, where four of the nine stack rules are
# syntax-checked only: this file is small enough that "test the ones that were
# hard" has no advantage over testing all of them, and a new stack has no
# operational history to lean on when deciding which ones were hard.
#
# Three of the cases below are about ADR-0029's domain, and two of them exist
# for a reason worth naming: they prove a rule stays quiet for a state that is
# CORRECT rather than merely absent. An endpoint that is switched off is doing
# what ADR-0029 says it should, and a purchased licence with no grace period
# reads zero days remaining for the opposite of the reason the alert is about.
# Both would fire against a rule written without its label selector, and both
# would fire forever, which is the failure mode ADR-0017 refuses by name.
rule_files:
  - ../rules/lab.rules.yaml

evaluation_interval: 1m

tests:
  # --- InstanceDown --------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'up{instance="loki:3100",job="loki"}'
        values: "1+0x5 0+0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              alertname: InstanceDown
              instance: loki:3100
              job: loki
              component: lab
              severity: critical
              category: availability
            exp_annotations:
              summary: "loki target loki:3100 is down in the lab stack"
              description: >-
                The lab's Prometheus has failed to scrape loki:3100 (loki) for
                5 minutes. ADR-0028 lets the estate see that a guest stopped,
                never that something inside one did, so for a container this
                alert is the only thing that reports it.
      # Quiet while the target is up, including inside the `for:` window.
      - eval_time: 4m
        alertname: InstanceDown
        exp_alerts: []

  # --- PrometheusConfigReloadFailed ----------------------------------------
  - interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{instance="localhost:9090",job="prometheus"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              alertname: PrometheusConfigReloadFailed
              instance: localhost:9090
              job: prometheus
              component: lab
              severity: critical
              category: correctness
            exp_annotations:
              summary: "The lab's Prometheus rejected its own config reload"
              description: >-
                It is still serving the config it last parsed successfully, so
                the change you deployed is not the one running.

  - interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{instance="localhost:9090",job="prometheus"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []

  # --- PrometheusSizeRetentionActive ---------------------------------------
  # The counter is flat until the size ceiling starts evicting, then steps.
  - interval: 1m
    input_series:
      - series: 'prometheus_tsdb_size_retentions_total{instance="localhost:9090",job="prometheus"}'
        values: "0+0x40 1+0x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: PrometheusSizeRetentionActive
        exp_alerts:
          - exp_labels:
              alertname: PrometheusSizeRetentionActive
              instance: localhost:9090
              job: prometheus
              component: lab
              severity: warning
              category: correctness
            exp_annotations:
              summary: "The lab's size ceiling is evicting blocks — retention is shorter than 15 days"
              description: >-
                Re-derive the retention figures against the spindles rather
                than raising the ceiling blind; compose.yaml carries the
                queries.
      # A store that has never evicted is the normal case and must stay quiet.
      - eval_time: 30m
        alertname: PrometheusSizeRetentionActive
        exp_alerts: []

  # --- LokiIngestionStalled ------------------------------------------------
  # A flat counter is a zero rate: lines are arriving nowhere.
  - interval: 1m
    input_series:
      - series: 'loki_distributor_lines_received_total{instance="loki:3100",job="loki"}'
        values: "1000+0x90"
    alert_rule_test:
      - eval_time: 70m
        alertname: LokiIngestionStalled
        exp_alerts:
          - exp_labels:
              alertname: LokiIngestionStalled
              component: lab
              severity: warning
              category: availability
            exp_annotations:
              summary: "The lab's Loki has received no log lines for 30 minutes"
              description: >-
                Either the lab's Alloy is down or the push endpoint is
                unreachable. A running agent retries a failed push for a few
                minutes, then drops the batch: those lines are lost. A stopped
                agent's file and Docker sources resume from their saved
                positions when it starts, unless the logs rotated away
                meanwhile. Its journal source resumes only after an outage
                under 24 hours (its max_age); after a longer one, those journal
                lines are skipped. Loki refuses any line older than 168 hours.

  - interval: 1m
    input_series:
      - series: 'loki_distributor_lines_received_total{instance="loki:3100",job="loki"}'
        values: "1000+120x90"
    alert_rule_test:
      - eval_time: 70m
        alertname: LokiIngestionStalled
        exp_alerts: []

  # --- InstanceDown, for a guest that is off on purpose ---------------------
  # ADR-0029 runs the endpoints per session. An endpoint reading `up == 0` is
  # not an outage, and a rule that says it is would fire more or less forever.
  - interval: 1m
    input_series:
      - series: 'up{instance="carbuncle",job="windows",role="endpoint"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: InstanceDown
        exp_alerts: []

  # And the same rule must still fire for a server, which is what proves the
  # selector narrowed the rule rather than disabling it.
  - interval: 1m
    input_series:
      - series: 'up{instance="bahamut",job="windows",role="dc"}'
        values: "1+0x5 0+0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              alertname: InstanceDown
              instance: bahamut
              job: windows
              role: dc
              component: lab
              severity: critical
              category: availability
            exp_annotations:
              summary: "windows target bahamut is down in the lab stack"
              description: >-
                The lab's Prometheus has failed to scrape bahamut (windows) for
                5 minutes. ADR-0028 lets the estate see that a guest stopped,
                never that something inside one did, so for a container this
                alert is the only thing that reports it.

  # --- DomainControllerClockDrifting ---------------------------------------
  # Negative on purpose: a clock that is two minutes SLOW breaks Kerberos
  # exactly as well as one two minutes fast, and this is what proves the abs()
  # is doing work rather than decorating the expression.
  - interval: 1m
    input_series:
      - series: 'windows_time_computed_time_offset_seconds{instance="bahamut",job="windows",role="dc"}'
        values: "0+0x10 -120+0x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: DomainControllerClockDrifting
        exp_alerts:
          - exp_labels:
              alertname: DomainControllerClockDrifting
              instance: bahamut
              job: windows
              role: dc
              component: domain
              severity: critical
              category: correctness
            exp_annotations:
              summary: "bahamut's clock is more than 60s out"
              description: >-
                Kerberos tolerates five minutes. Past that every symptom in the
                domain points at credentials and none of them point at time.
      # A synchronised clock is the normal case and must stay quiet.
      - eval_time: 5m
        alertname: DomainControllerClockDrifting
        exp_alerts: []

  # --- DomainControllerTimeSourceIsLocalClock ------------------------------
  # The failure the rule above cannot see: w32time has given up on its peer and
  # is synchronised with itself, so the offset reads zero and looks healthy.
  - interval: 1m
    input_series:
      - series: 'windows_time_clock_sync_source{instance="bahamut",job="windows",role="dc",type="Local CMOS Clock"}'
        values: "1+0x40"
      - series: 'windows_time_computed_time_offset_seconds{instance="bahamut",job="windows",role="dc"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: DomainControllerTimeSourceIsLocalClock
        exp_alerts:
          - exp_labels:
              alertname: DomainControllerTimeSourceIsLocalClock
              instance: bahamut
              job: windows
              role: dc
              type: Local CMOS Clock
              component: domain
              severity: critical
              category: correctness
            exp_annotations:
              summary: "bahamut has fallen back to its own CMOS clock"
              description: >-
                w32time has given up on 10.0.30.1 and is now synchronised with
                itself, so the drift alert cannot fire. Check that morpheus
                still serves NTP on the ImaginationLAN interface.
      # The drift rule is silent for this input, which is the whole point of
      # there being two rules. If this expectation ever fails, one of them has
      # become redundant and the pair should be revisited.
      - eval_time: 30m
        alertname: DomainControllerClockDrifting
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'windows_time_clock_sync_source{instance="bahamut",job="windows",role="dc",type="Local CMOS Clock"}'
        values: "0+0x40"
      - series: 'windows_time_clock_sync_source{instance="bahamut",job="windows",role="dc",type="NTP"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: DomainControllerTimeSourceIsLocalClock
        exp_alerts: []

  # --- LabWindowsEvaluationExpiring ----------------------------------------
  - interval: 1m
    input_series:
      - series: 'windows_eval_grace_days_remaining{instance="titan",job="windows",role="member"}'
        values: "25+0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: LabWindowsEvaluationExpiring
        exp_alerts:
          - exp_labels:
              alertname: LabWindowsEvaluationExpiring
              instance: titan
              job: windows
              role: member
              component: domain
              severity: warning
              category: availability
            exp_annotations:
              summary: "titan's evaluation licence has under 30 days left"
              description: >-
                At expiry the machine stops being usable rather than degrading.
                Rearm it, or rebuild it from the runbook — and record the
                remaining rearm count, because no published figure agrees with
                another.

  # A server with most of its evaluation left, and an ENDPOINT reading zero.
  # The endpoint holds a purchased Pro licence, so GracePeriodRemaining is zero
  # because there is no grace period — the opposite of the condition this rule
  # is about. Unscoped, it would fire against both endpoints permanently.
  - interval: 1m
    input_series:
      - series: 'windows_eval_grace_days_remaining{instance="titan",job="windows",role="member"}'
        values: "150+0x120"
      - series: 'windows_eval_grace_days_remaining{instance="carbuncle",job="windows",role="endpoint"}'
        values: "0+0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: LabWindowsEvaluationExpiring
        exp_alerts: []

  # --- HostDiskCritical ------------------------------------------------------
  # odin's root as it was found on 2026-10-01: 622 MB free of 30 GB. Fires after
  # its 15 minutes. The data disk beside it, 78 GB free of 94, stays quiet, and
  # so does an overlay mount reading full, which the selector excludes.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="odin",device="/dev/mapper/ubuntu--vg-ubuntu--lv",mountpoint="/",fstype="ext4"}'
        values: "622000000+0x30"
      - series: 'node_filesystem_size_bytes{instance="odin",device="/dev/mapper/ubuntu--vg-ubuntu--lv",mountpoint="/",fstype="ext4"}'
        values: "30000000000+0x30"
      - series: 'node_filesystem_avail_bytes{instance="odin",device="/dev/sdb1",mountpoint="/srv/soc-data",fstype="ext4"}'
        values: "78000000000+0x30"
      - series: 'node_filesystem_size_bytes{instance="odin",device="/dev/sdb1",mountpoint="/srv/soc-data",fstype="ext4"}'
        values: "94000000000+0x30"
      - series: 'node_filesystem_avail_bytes{instance="odin",device="overlay",mountpoint="/var/lib/docker/overlay2/x/merged",fstype="overlay"}'
        values: "0+0x30"
      - series: 'node_filesystem_size_bytes{instance="odin",device="overlay",mountpoint="/var/lib/docker/overlay2/x/merged",fstype="overlay"}'
        values: "30000000000+0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: HostDiskCritical
        exp_alerts: []
      - eval_time: 20m
        alertname: HostDiskCritical
        exp_alerts:
          - exp_labels:
              instance: odin
              device: /dev/mapper/ubuntu--vg-ubuntu--lv
              mountpoint: /
              fstype: ext4
              component: host
              severity: critical
              category: capacity
            exp_annotations:
              summary: "odin:/ below 10% free"

  # --- HostDiskWillFillIn24h -------------------------------------------------
  # Losing 10 MB a minute: 14.4 GB a day. From 8 GB free of 30 that is below 30%
  # free and on course for zero, so it fires once its hour has passed. The same
  # rate from 20 GB free is still above 30%, and a disk with room to absorb a
  # trend is not paged for it, however steep.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="odin",device="/dev/sda2",mountpoint="/",fstype="ext4"}'
        values: "8000000000-10000000x150"
      - series: 'node_filesystem_size_bytes{instance="odin",device="/dev/sda2",mountpoint="/",fstype="ext4"}'
        values: "30000000000+0x150"
      - series: 'node_filesystem_avail_bytes{instance="alexander",device="/dev/sda2",mountpoint="/",fstype="ext4"}'
        values: "20000000000-10000000x150"
      - series: 'node_filesystem_size_bytes{instance="alexander",device="/dev/sda2",mountpoint="/",fstype="ext4"}'
        values: "30000000000+0x150"
    alert_rule_test:
      - eval_time: 30m
        alertname: HostDiskWillFillIn24h
        exp_alerts: []
      - eval_time: 2h
        alertname: HostDiskWillFillIn24h
        exp_alerts:
          - exp_labels:
              instance: odin
              device: /dev/sda2
              mountpoint: /
              fstype: ext4
              component: host
              severity: warning
              category: capacity
            exp_annotations:
              summary: "odin:/ fills within 24h"
              description: >-
                / on odin (/dev/sda2)
                is below 30% free and, extrapolating the last 6 hours, reaches zero
                within a day. On a Docker host, `docker system df` first: superseded
                images are what filled odin.

  # --- golem's backups (ADR-0053, #485) -----------------------------------
  # The series as golem's agent delivers them: the collector's own labels,
  # plus the instance and job Alloy gives every series from golem. The quiet
  # cases are golem's real state on 2026-10-04, the morning after its first
  # nightly run, with the clock moved to promtool's.

  # --- PbsJobFailed ----------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'homelab_pbs_job_last_run_ok{instance="golem",job="golem-metrics",host="golem",store="erebor",kind="verify",pbs_job="weekly"}'
        values: "0x20"
      - series: 'homelab_pbs_job_last_run_ok{instance="golem",job="golem-metrics",host="golem",store="erebor",kind="prune",pbs_job="daily"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: PbsJobFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: PbsJobFailed
        exp_alerts:
          - exp_labels:
              instance: golem
              job: golem-metrics
              host: golem
              store: erebor
              kind: verify
              pbs_job: weekly
              component: backup
              severity: warning
              category: correctness
            exp_annotations:
              summary: "golem's verify job weekly did not finish OK"
              description: >-
                Read the task log in golem's web UI (Administration, Tasks) or
                `proxmox-backup-manager task list --all` on golem. A failed verify
                names the snapshot; a failed garbage collection on this NFS
                datastore is worth reading build-the-backup-guest.md §11 for
                before the next one runs.

  # A job that has never run writes no _ok series at all, so a fresh garbage
  # collection is silence, not a failure.
  - interval: 1m
    input_series:
      - series: 'homelab_pbs_job_last_run_ok{instance="golem",job="golem-metrics",host="golem",store="erebor",kind="verify",pbs_job="weekly"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PbsJobFailed
        exp_alerts: []

  # --- PbsVerifyOverdue ------------------------------------------------------
  # Last verify ended at t=0; promtool's clock starts there too. Quiet at 13
  # days, firing at 15. A gc that has never run (end 0) is not a verify and
  # stays out of it.
  - interval: 1m
    input_series:
      - series: 'homelab_pbs_job_last_run_end_timestamp_seconds{instance="golem",job="golem-metrics",host="golem",store="erebor",kind="verify",pbs_job="weekly"}'
        values: "0x21700"
      - series: 'homelab_pbs_job_last_run_end_timestamp_seconds{instance="golem",job="golem-metrics",host="golem",store="erebor",kind="gc",pbs_job="erebor"}'
        values: "0x21700"
    alert_rule_test:
      - eval_time: 13d
        alertname: PbsVerifyOverdue
        exp_alerts: []
      - eval_time: 15d
        alertname: PbsVerifyOverdue
        exp_alerts:
          - exp_labels:
              instance: golem
              job: golem-metrics
              host: golem
              store: erebor
              kind: verify
              pbs_job: weekly
              component: backup
              severity: warning
              category: correctness
            exp_annotations:
              summary: "golem's verify job weekly has not finished in 14 days"
              description: >-
                Its last run ended 15d 0h 0m 0s ago. Backups not
                re-read are backups not known to be readable. Check the job's
                schedule on golem (Datastore, Verify Jobs) and its task log.

  # A verify that runs weekly keeps it quiet indefinitely: the end time moves
  # to t=7d and t=14d.
  - interval: 1m
    input_series:
      - series: 'homelab_pbs_job_last_run_end_timestamp_seconds{instance="golem",job="golem-metrics",host="golem",store="erebor",kind="verify",pbs_job="weekly"}'
        values: "0x10079 604800x10079 1209600x10080"
    alert_rule_test:
      - eval_time: 20d
        alertname: PbsVerifyOverdue
        exp_alerts: []

  # --- PbsNoVerifyJob --------------------------------------------------------
  # The verify job is deleted at t=10m: the count drops to 0 and, an hour
  # later, fires. Prune and gc jobs still existing do not keep it quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_pbs_jobs{instance="golem",job="golem-metrics",host="golem",store="erebor",kind="verify"}'
        values: "1x9 0x120"
      - series: 'homelab_pbs_jobs{instance="golem",job="golem-metrics",host="golem",store="erebor",kind="prune"}'
        values: "1x130"
    alert_rule_test:
      - eval_time: 30m
        alertname: PbsNoVerifyJob
        exp_alerts: []
      - eval_time: 80m
        alertname: PbsNoVerifyJob
        exp_alerts:
          - exp_labels:
              instance: golem
              job: golem-metrics
              host: golem
              store: erebor
              kind: verify
              component: backup
              severity: warning
              category: correctness
            exp_annotations:
              summary: "golem's erebor has no verify job"
              description: >-
                Nothing re-reads its backups, so nothing finds a damaged one
                before a restore does. Recreate it as build-the-backup-guest.md
                §6 makes it: weekly, Sunday 03:00, re-verify after 30 days.

  # golem as it is: one verify job.
  - interval: 1m
    input_series:
      - series: 'homelab_pbs_jobs{instance="golem",job="golem-metrics",host="golem",store="erebor",kind="verify"}'
        values: "1x130"
    alert_rule_test:
      - eval_time: 2h
        alertname: PbsNoVerifyJob
        exp_alerts: []

  # --- PbsSnapshotVerifyFailed -----------------------------------------------
  - interval: 1m
    input_series:
      - series: 'homelab_pbs_snapshots{instance="golem",job="golem-metrics",host="golem",store="erebor",verify="ok"}'
        values: "7x20"
      - series: 'homelab_pbs_snapshots{instance="golem",job="golem-metrics",host="golem",store="erebor",verify="none"}'
        values: "0x20"
      - series: 'homelab_pbs_snapshots{instance="golem",job="golem-metrics",host="golem",store="erebor",verify="failed"}'
        values: "0x5 1x15"
    alert_rule_test:
      - eval_time: 5m
        alertname: PbsSnapshotVerifyFailed
        exp_alerts: []
      - eval_time: 15m
        alertname: PbsSnapshotVerifyFailed
        exp_alerts:
          - exp_labels:
              instance: golem
              job: golem-metrics
              host: golem
              store: erebor
              verify: failed
              component: backup
              severity: critical
              category: correctness
            exp_annotations:
              summary: "1 snapshot(s) on golem's erebor failed verification"
              description: >-
                A restore from one of them may fail. Find it in golem's web UI
                (Datastore, Content, the red mark). Missing chunks after a garbage
                collection are §11's atime case; roll erebor/pbs back to the
                newest TrueNAS snapshot from before that run.

  # --- PbsBackupStale --------------------------------------------------------
  # Newest backup at t=0. Quiet a day later, firing two days later. A nightly
  # job moving it forward keeps it quiet.
  - interval: 1m
    input_series:
      - series: 'homelab_pbs_snapshot_newest_timestamp_seconds{instance="golem",job="golem-metrics",host="golem",store="erebor"}'
        values: "0x2900"
    alert_rule_test:
      - eval_time: 24h
        alertname: PbsBackupStale
        exp_alerts: []
      - eval_time: 48h
        alertname: PbsBackupStale
        exp_alerts:
          - exp_labels:
              instance: golem
              job: golem-metrics
              host: golem
              store: erebor
              component: backup
              severity: warning
              category: availability
            exp_annotations:
              summary: "golem's erebor has no backup newer than 2d 0h 0m 0s"
              description: >-
                Saruman's golem-nightly job did not run or did not reach golem.
                Check the job's last run on Saruman (Datacenter, Backup; or
                /var/log/vzdump/), `pvesm status` for golem, and the 2049 pass to
                smaug if golem's datastore is unmounted.

  - interval: 1m
    input_series:
      - series: 'homelab_pbs_snapshot_newest_timestamp_seconds{instance="golem",job="golem-metrics",host="golem",store="erebor"}'
        values: "0x1439 86400x1439 172800x1439 259200x1439 345600x10"
    alert_rule_test:
      - eval_time: 4d
        alertname: PbsBackupStale
        exp_alerts: []

  # --- PbsSnapshotUnencrypted ------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'homelab_pbs_snapshots_unencrypted{instance="golem",job="golem-metrics",host="golem",store="erebor"}'
        values: "0x5 2x15"
    alert_rule_test:
      - eval_time: 5m
        alertname: PbsSnapshotUnencrypted
        exp_alerts: []
      - eval_time: 15m
        alertname: PbsSnapshotUnencrypted
        exp_alerts:
          - exp_labels:
              instance: golem
              job: golem-metrics
              host: golem
              store: erebor
              component: backup
              severity: critical
              category: security
            exp_annotations:
              summary: "2 unencrypted snapshot(s) on golem's erebor"
              description: >-
                Check that Saruman's golem storage still has its encryption-key
                line in /etc/pve/storage.cfg, and which job wrote the snapshot.
                Delete the unencrypted snapshots on golem once a good backup
                exists.

  # --- PbsTaskStateStale -----------------------------------------------------
  # Written hourly, then the timer stops at t=2h. Quiet while it runs, firing
  # once the file is over three hours old and has stayed so for ten minutes.
  - interval: 1m
    input_series:
      - series: 'node_textfile_mtime_seconds{instance="golem",job="golem-metrics",file="/var/lib/node_exporter/textfile_collector/pbs-task-state.prom"}'
        values: "0x59 3600x59 7200x300"
    alert_rule_test:
      - eval_time: 3h
        alertname: PbsTaskStateStale
        exp_alerts: []
      - eval_time: 6h
        alertname: PbsTaskStateStale
        exp_alerts:
          - exp_labels:
              instance: golem
              job: golem-metrics
              file: /var/lib/node_exporter/textfile_collector/pbs-task-state.prom
              component: backup
              severity: warning
              category: correctness
            exp_annotations:
              summary: "golem has not rewritten its PBS task state for 4h 0m 0s"
              description: >-
                The backup alerts are reading an old answer. Check
                homelab-pbs-task-state.timer on golem and
                `journalctl -u homelab-pbs-task-state`, which says what PBS
                answered.

  # --- ScheduledJobFailed ----------------------------------------------------
  # fenrir's prune exits 0, then 1 from t=30m. Quiet while it succeeds, firing
  # once the failure has held for ten minutes.
  - interval: 1m
    input_series:
      - series: 'homelab_job_last_exit_code{instance="fenrir",job="fenrir-metrics",host="fenrir",homelab_job="zeek-archive-prune"}'
        values: "0x29 1x60"
    alert_rule_test:
      - eval_time: 25m
        alertname: ScheduledJobFailed
        exp_alerts: []
      - eval_time: 50m
        alertname: ScheduledJobFailed
        exp_alerts:
          - exp_labels:
              instance: fenrir
              job: fenrir-metrics
              host: fenrir
              homelab_job: zeek-archive-prune
              component: sensor
              severity: warning
              category: correctness
            exp_annotations:
              summary: "zeek-archive-prune on fenrir exited 1"
              description: >-
                The last run failed. `journalctl -u homelab-zeek-archive-prune.service -n 100`
                on the host has the output. Exit 75 means it never started because
                another job held its lock.

  # --- ScheduledJobStale -----------------------------------------------------
  # Last success at t=0, never again. Quiet at two days, firing past three
  # days plus the hour's `for`.
  - interval: 1m
    input_series:
      - series: 'homelab_job_last_success_timestamp_seconds{instance="fenrir",job="fenrir-metrics",host="fenrir",homelab_job="zeek-archive-prune"}'
        values: "0x4500"
    alert_rule_test:
      - eval_time: 48h
        alertname: ScheduledJobStale
        exp_alerts: []
      - eval_time: 74h
        alertname: ScheduledJobStale
        exp_alerts:
          - exp_labels:
              instance: fenrir
              job: fenrir-metrics
              host: fenrir
              homelab_job: zeek-archive-prune
              component: sensor
              severity: warning
              category: correctness
            exp_annotations:
              summary: "zeek-archive-prune on fenrir: no success for 3d 2h 0m 0s"
              description: >-
                Zeek's archive is not being pruned and /srv/sensor-data will fill.
                Check `systemctl list-timers homelab-zeek-archive-prune.timer` and
                `journalctl -u homelab-zeek-archive-prune` on fenrir —
                docs/runbooks/build-the-sensor-guest.md §4.

  # --- ScheduledJobNeverRan --------------------------------------------------
  # Quiet: the job's series exists. Firing: only another job's series exists,
  # which is what a fenrir without the timer looks like.
  - interval: 1m
    input_series:
      - series: 'homelab_job_last_run_timestamp_seconds{instance="fenrir",job="fenrir-metrics",host="fenrir",homelab_job="zeek-archive-prune"}'
        values: "0x480"
    alert_rule_test:
      - eval_time: 8h
        alertname: ScheduledJobNeverRan
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'homelab_job_last_run_timestamp_seconds{instance="fenrir",job="fenrir-metrics",host="fenrir",homelab_job="something-else"}'
        values: "0x480"
    alert_rule_test:
      - eval_time: 8h
        alertname: ScheduledJobNeverRan
        exp_alerts:
          - exp_labels:
              homelab_job: zeek-archive-prune
              component: sensor
              severity: warning
              category: correctness
            exp_annotations:
              summary: "zeek-archive-prune is scheduled but has never recorded a run"
              description: >-
                No outcome from fenrir's Zeek archive prune in six hours. Install
                it from the checkout on Hicks with
                `make install-agent-collectors AGENT=atreus@10.0.30.90 ARGS='--only zeek-archive-prune'`
                (docs/runbooks/build-the-sensor-guest.md §4), and check that
                /var/lib/node_exporter/textfile_collector exists on fenrir.
