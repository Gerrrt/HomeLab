---
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    site: matrix.elysium
    # The estate's says `winterfell`. This one names the segment it serves, so
    # that a series copied into a paste, a screenshot or a bug report says which
    # of the two stacks it came from without anyone having to remember there are
    # two. They are deliberately never joined, so the label is the only thing
    # that would ever tell them apart.
    monitor: imaginationlan

rule_files:
  - /etc/prometheus/rules/*.rules.yaml

# No `alerting:` block, because there is no Alertmanager in this stack —
# ADR-0020 decided that, and the reasoning is there. Rules below still evaluate;
# a firing alert is visible in this Prometheus's own /alerts and through
# Grafana. Nothing pages, and nothing is meant to.
#
# What that leaves uncovered is #257: the estate's RemoteWriteJobStale keys on
# jobs arriving on VLAN 99, so it can never see this stack, and a lab that has
# died looks exactly like a lab nobody is using. Adding an alertmanagers: block
# pointed at 10.0.99.20 would "fix" that by opening the remote-write path
# ADR-0007 exists to refuse. Whatever #257 settles goes outside this file.
#
# ADR-0028 settled it, and outside this file is exactly where it landed: the
# estate reads guest RUN STATE from `qm` on the hypervisor, so it now sees this
# guest stop. It still cannot see this Prometheus stop while the guest runs,
# which is the half that keeps the paragraph above true.

scrape_configs:
  # ---------------------------------------------------------------------------
  # The stack monitoring itself. Service names resolve on the compose network,
  # so nothing here carries this guest's address.
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # This is also loki's readiness check. The image is distroless and can carry
  # no compose healthcheck, so `up{job="loki"}` is the only thing that observes
  # it — the same arrangement, and the same reasoning, as the estate's.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Verified properly rather than with insecure_skip_verify: the lab CA is
  # mounted into this container, and the leaf carries `grafana` as a SAN
  # alongside its FQDN precisely so this scrape can check the name it dials.
  - job_name: grafana
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      server_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

# No `snmp` or `blackbox` jobs: this stack runs neither exporter. The devices
# on this segment that answer SNMP — `shiva`, the iLO of this guest's own host
# — are polled by the estate's stack over the exception ADR-0013 records, and
# polling them from here as well would be two stacks scraping one device and
# two answers to "when did it last respond".
#
# ---------------------------------------------------------------------------
# ADR-0029's domain. Uncomment the block below once the six guests exist and
# windows_exporter is installed on them — build-the-lab-domain.md §8 is the
# step, and §9 is the check that it is collecting rather than merely running.
#
# It lands commented rather than live because a scrape job pointed at six
# machines that do not exist yields `up == 0` on every one of them, and
# InstanceDown would fire permanently from the moment this file deployed. That
# is the shape ADR-0017 refuses by name — "every rule watching it would be
# permanently firing or permanently silenced" — and it is why the RULES in
# rules/lab.rules.yaml land live while this does not: promtool proves a rule can
# fire against synthetic series without needing a machine to exist.
#
#   - job_name: windows
#     static_configs:
#       - targets: ["10.0.30.50:9182"]
#         labels: {instance: bahamut, role: dc}
#       - targets: ["10.0.30.51:9182"]
#         labels: {instance: leviathan, role: dc}
#       - targets: ["10.0.30.52:9182"]
#         labels: {instance: titan, role: member}
#       - targets: ["10.0.30.53:9182"]
#         labels: {instance: ramuh, role: member}
#       - targets: ["10.0.30.54:9182"]
#         labels: {instance: carbuncle, role: endpoint}
#       - targets: ["10.0.30.55:9182"]
#         labels: {instance: siren, role: endpoint}
#
# `instance` is set explicitly because the default is the address, and an alert
# reading "10.0.30.53:9182 has fallen back to its own CMOS clock" is one more
# lookup than a person mid-incident should have to do.
#
# `role` is not decoration. It is what lets InstanceDown exclude the endpoints,
# which ADR-0029 runs PER SESSION and which are therefore correctly off most of
# the time; and what scopes the two clock rules to the domain controllers, where
# members reading NT5DS are behaving properly. Written as a hostname regex
# instead, all three rules would need editing to add a third DC.
#
# ---------------------------------------------------------------------------
# Scraped, and NOT pushed — which reverses what this file used to say.
# ---------------------------------------------------------------------------
#
# The previous version of this comment said the domain's agents would push, and
# that #265 "needs the ports: block in compose.yaml opened first". ADR-0029
# decided the other way, for four reasons:
#
#   1. A published remote-write receiver on VLAN 30 is unauthenticated, on the
#      segment ADR-0014 deliberately fills with attackers. security.md already
#      calls the estate's published ingest ports a real residual — but there
#      "anything that can reach them" is a host inside Winterfell, and here it
#      is a Kali VM sharing the broadcast domain, handed a delete-series API
#      pointed at the lab's own evidence. The direction the connection travels
#      is the control.
#   2. The property architecture.md cites for preferring remote-write does not
#      hold here. There is no target list to maintain — it is six addresses
#      fixed by an ADR — and no firewall hole to avoid, because this guest and
#      the domain share a segment.
#   3. config.alloy does not port to Windows. It uses prometheus.exporter.unix,
#      loki.source.journal and file tails of /var/log/auth.log and
#      /var/log/syslog. ADR-0007's "reused unchanged" is true for this guest and
#      cannot be true there, so an Alloy path means a third agent config for
#      machines whose security telemetry is #266's job anyway.
#   4. Loki's push endpoint stays closed for the same reasons. Windows Event Log
#      belongs to #266, and if some of it should also land here, that is #266's
#      port to open and #266's argument to write.

# ---------------------------------------------------------------------------
# ADR-0030's SOC guest, `odin`. Two things arrive from it and only one is a
# scrape. Its Alloy PUSHES — that guest's node and container telemetry, and
# the Wazuh indexer's health from stacks/soc/alloy/opensearch.alloy — through
# the remote-write receiver above, which is why compose.yaml's `ports:` block
# opens on the day odin does. The rules that read those series are in
# rules/soc.rules.yaml. The scrape is Velociraptor's metrics listener, and it
# lands commented for the reason the windows job does: a target that does not
# exist yet is InstanceDown firing from the moment this deploys.
# build-the-soc-guest.md §9 uncomments it.
#
#   - job_name: velociraptor
#     static_configs:
#       - targets: ["10.0.30.60:8003"]
#         labels: {instance: odin, role: soc}
