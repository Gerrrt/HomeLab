---
# The SOC's indexer, watched from the lab (ADR-0030).
#
# These rules live HERE, in the lab's Prometheus on alexander, and not in
# stacks/soc: the series they read are produced by odin's Alloy
# (stacks/soc/alloy/opensearch.alloy) and remote-written to this Prometheus,
# which is the only thing on the segment that evaluates rules. Six rules, and
# the reason there are six rather than the estate's forty-odd is the same as
# lab.rules.yaml's: an alert nobody is paged for is only useful to someone
# already looking, so these are scoped to "the SIEM is not doing its one job"
# — the #62/#63 shape, a store that quietly stops — and to the two numbers
# ADR-0030 says will run out first, heap and shards.
#
# NOTHING HERE PAGES. Same limit as lab.rules.yaml, same reason (ADR-0020).
#
# What this does NOT cover, and cannot: odin going away. Every series here
# arrives by push, so a guest that stops pushing simply goes stale — no rule
# reads absence, because before odin exists absence is the correct state and
# an absent() rule would fire permanently from the day this file deploys, the
# shape ADR-0017 refuses by name. ADR-0028 gives the estate odin's RUN STATE
# from the hypervisor, which is what reports the guest itself stopping.
#
# Every label these key on is set by opensearch.alloy: `job="wazuh-indexer"`
# is fixed there deliberately, so a rebuilt guest under another hostname does
# not silently orphan these rules.
#
# Since #1038 the file also holds two more groups, below the indexer's: the
# manager's own state (soc-manager), and Zeek's conn stream (sensor). Their
# series arrive the same way, by push, so the same limit on absence applies.
groups:
  - name: soc
    interval: 60s
    rules:
      # The exporter is running on odin and cannot reach the indexer. The
      # exporter emits nothing else about a cluster it cannot reach, so this
      # is the only one of these that sees "the indexer is down"; the rest
      # read a metric the indexer emits about its own working, which requires
      # it to be working enough to emit. The collector retries every five
      # minutes, hence the window.
      - alert: WazuhIndexerUnreachable
        expr: elasticsearch_clusterinfo_up{job="wazuh-indexer"} == 0
        for: 10m
        labels:
          component: soc
          severity: critical
          category: availability
        annotations:
          summary: "odin's Alloy cannot reach the Wazuh indexer"
          description: >-
            The exporter on odin has failed to reach https://wazuh.indexer:9200
            for 10 minutes. The manager's filebeat is failing the same way, so
            alerts are queuing on the manager rather than being recorded.

      # Red means a primary shard is unassigned: the index that holds today's
      # alerts may be the one that cannot be written.
      - alert: WazuhIndexerClusterRed
        expr: elasticsearch_cluster_health_status{job="wazuh-indexer",color="red"} == 1
        for: 5m
        labels:
          component: soc
          severity: critical
          category: availability
        annotations:
          summary: "The Wazuh indexer's cluster health is red"
          description: >-
            A primary shard is unassigned. Check disk first — opensearch.yml
            disables the disk watermark, so a full volume arrives here rather
            than as a read-only index.

      # Yellow is a signal here PRECISELY BECAUSE the settings make it one.
      # With number_of_replicas 0 on every index, a single node is green; a
      # yellow cluster means an index was created with a replica the template
      # did not reach — ADR-0030's "a health signal that is always yellow is
      # not a health signal", turned into the alert that says the settings
      # stopped applying. The window is long because a fresh index goes
      # through yellow for seconds on creation.
      - alert: WazuhIndexerClusterYellow
        expr: elasticsearch_cluster_health_status{job="wazuh-indexer",color="yellow"} == 1
        for: 30m
        labels:
          component: soc
          severity: warning
          category: correctness
        annotations:
          summary: "The Wazuh indexer has an unassigned replica shard"
          description: >-
            Every index here is meant to carry no replica, so yellow means one
            was created outside the settings in
            stacks/soc/wazuh/indexer/template-wazuh-alerts.json. Find it with
            _cat/indices?v&h=index,pri,rep and fix the template it came from.

      # Heap is what runs out first (ADR-0030): 25 shards per GiB, 2 GiB
      # configured. Sustained occupancy above 85% is the JVM failing to free
      # after collection, which precedes the circuit breaker tripping on the
      # bulk indexing path — at which point ingestion stops with the cluster
      # still green. The `area` label is the exporter's; the two series carry
      # the same label set, so the division needs no matching clause.
      - alert: WazuhIndexerHeapPressure
        expr: |
          elasticsearch_jvm_memory_used_bytes{job="wazuh-indexer",area="heap"}
            / elasticsearch_jvm_memory_max_bytes{job="wazuh-indexer",area="heap"} > 0.85
        for: 15m
        labels:
          component: soc
          severity: warning
          category: capacity
        annotations:
          summary: "The Wazuh indexer's JVM heap is over 85% for 15 minutes"
          description: >-
            The retention bound in ADR-0030 is heap-per-shard. Count the shards
            (_cat/shards) before raising the heap: the fix for too many small
            shards is rollover indices, not a bigger JVM.

      # The shard budget is ~50 at 2 GiB of heap (ADR-0030). Thirty daily alert
      # indices plus the monitoring, statistics, vulnerability and inventory
      # families are meant to sit near 45; above it the ISM delete policy is
      # not firing, or something is creating indices the arithmetic did not
      # count. _plugins/_ism/explain/wazuh-alerts-* says which.
      - alert: WazuhIndexerShardBudgetNearlySpent
        expr: elasticsearch_cluster_health_active_shards{job="wazuh-indexer"} > 45
        for: 1h
        labels:
          component: soc
          severity: warning
          category: capacity
        annotations:
          summary: "The Wazuh indexer holds more than 45 shards"
          description: >-
            The 2 GiB heap buys about 50. Check that the 30-day ISM policy in
            stacks/soc/wazuh/indexer/ism-wazuh-alerts.json is attached and
            deleting; if it is, the fix is rollover indices, not a larger
            number in the policy.

      # The one the whole crossing exists for. Wazuh indexes continuously
      # while the four servers run — agent status into wazuh-monitoring every
      # fifteen minutes, statistics on a schedule, and the servers' own
      # events — so an hour with no index calls is the SIEM having stopped
      # ingesting while everything about it still reports healthy. The
      # window is an hour rather than the lab Loki's thirty minutes because
      # the endpoints run per session and a quiet domain is quieter than a
      # quiet guest.
      - alert: WazuhIngestionStalled
        expr: |
          sum by (cluster) (increase(elasticsearch_indices_indexing_index_total{job="wazuh-indexer"}[1h])) == 0
        for: 1h
        labels:
          component: soc
          severity: warning
          category: availability
        annotations:
          summary: "The Wazuh indexer has indexed nothing for an hour"
          description: >-
            The cluster answers and its health is fine; it is simply not being
            written to. Check the manager first — filebeat on it is what
            writes — then whether any agent is connected at all.

  # --- The manager, read off its own state (#1038) ------------------------
  #
  # scripts/collect-wazuh-manager-state.sh on odin reads the manager's
  # analysisd and remoted state files and `agent_control -l -j`, by `docker
  # exec`, into a textfile odin's Alloy pushes here (job odin-metrics). The
  # indexer rules above see a SIEM that stops being written to; these say why,
  # one layer earlier. Same limit: nothing here pages (ADR-0020). Whether the
  # manager is RUNNING at all is the estate's GuestServiceUnhealthy (#858).
  - name: soc-manager
    interval: 60s
    rules:
      # A lab guest is up and its Wazuh agent is not reporting. The domain
      # guests are on-demand (ADR-0079), so "agents disconnected" alone would
      # fire every evening. Counting the guests whose windows_exporter answers
      # against the agents the manager calls Active is what stays quiet when
      # the guests are off and fires when one is on and silent to the SOC.
      # Thirty minutes covers a booting guest's agent catching up.
      #
      # The difference is computed first and compared with zero, so $value is
      # the number of guests without an agent. A bare `a > b` returns a, the
      # count of guests up, which read "4 more" for one missing agent.
      - alert: WazuhAgentsNotConnected
        expr: |
          (count(up{job="windows"} == 1) - sum(homelab_wazuh_agents{status="active"})) > 0
        for: 30m
        labels:
          component: soc
          severity: warning
          category: availability
        annotations:
          summary: "{{ $value }} running lab guest(s) without a connected Wazuh agent"
          description: >-
            windows_exporter answers on more domain guests than the manager has
            Active agents, so at least one running guest is invisible to the
            SOC. On odin: `docker exec soc-wazuh-manager
            /var/ossec/bin/agent_control -l` names the Disconnected ones; on
            the guest, `Get-Service WazuhSvc`.

      # A queue inside analysisd nearly full. The value is a 0..1 fraction
      # (queue_op.c: elements / (size - 1)). A full queue drops events, which
      # the next rule counts; this is the warning before it.
      - alert: WazuhAnalysisdQueueFilling
        expr: |
          max by (queue) (homelab_wazuh_analysisd_queue_usage_ratio) > 0.9
        for: 15m
        labels:
          component: soc
          severity: warning
          category: capacity
        annotations:
          summary: "Wazuh analysisd's {{ $labels.queue }} queue is {{ $value | humanizePercentage }} full"
          description: >-
            analysisd is falling behind on {{ $labels.queue }} events. Usually
            an event storm from one agent or a slow indexer behind filebeat;
            WazuhIngestionStalled says whether the indexer is still taking
            writes.

      # Events the manager received and threw away. A counter that resets
      # when the manager restarts, which increase() allows for.
      - alert: WazuhEventsDropped
        expr: |
          increase(homelab_wazuh_analysisd_events_dropped_total[30m]) > 0
        labels:
          component: soc
          severity: warning
          category: correctness
        annotations:
          summary: "Wazuh analysisd dropped {{ $value | printf \"%.0f\" }} events in 30 minutes"
          description: >-
            Those events never reached a rule or the indexer, so the SOC did
            not see them. WazuhAnalysisdQueueFilling usually fires first.

      # A source the collector could not read. Both state files say "THIS
      # FILE WILL BE DEPRECATED IN FUTURE VERSIONS", so the day an upgrade
      # removes one is this alert, not a quiet absence of series.
      - alert: WazuhManagerStateUnreadable
        expr: |
          homelab_wazuh_manager_source_ok == 0
        for: 30m
        labels:
          component: soc
          severity: warning
          category: correctness
        annotations:
          summary: "The Wazuh manager's {{ $labels.source }} state could not be read"
          description: >-
            scripts/collect-wazuh-manager-state.sh --print on odin shows what
            it got. After a Wazuh upgrade, check whether the state file still
            exists, or whether `agent_control -l -j` changed its shape.

      # The collector stopped writing: its timer died, or the manager is not
      # running (it writes nothing rather than a row of false zeros).
      - alert: WazuhManagerStateStale
        expr: |
          time() - node_textfile_mtime_seconds{file=~".*wazuh-manager-state\\.prom"} > 1800
        for: 15m
        labels:
          component: soc
          severity: warning
          category: correctness
        annotations:
          summary: "odin has not rewritten the Wazuh manager's state in half an hour"
          description: >-
            The file is {{ $value | humanizeDuration }} old. `journalctl -u
            homelab-wazuh-manager-state` on odin says why; "is not running" in
            it means the manager is down, which the estate's
            GuestServiceUnhealthy reports too.

  # --- Zeek's conn stream (#1038) -----------------------------------------
  #
  # The estate's GuestServiceUnhealthy says Zeek's event loop is turning
  # (stats.log is fresh). It does not say Zeek is still logging traffic.
  # fenrir's Alloy tails every Zeek log as its own file, and its self-metrics
  # arrive here by push, so the bytes it reads from each are already in this
  # Prometheus. conn.log is the one that is never legitimately quiet: alexander,
  # odin and fenrir talk across the mirrored segment whether or not a domain
  # guest is on. Keyed on Alloy's component and path, not on the job, so a
  # rebuilt sensor under another hostname does not orphan it.
  #
  # AND ON THE SERIES GOING AWAY. Despite its name, Alloy v1.20.1's
  # loki_source_file_read_bytes_total is a gauge holding the file's read
  # offset (rotation makes it drop, which increase() reads as a reset), and
  # the tailer DELETES it when it stops (tailer.go, DeleteLabelValues). So if
  # conn.log stops existing (Zeek gone around an hourly rotation, its log
  # volume recreated) the series disappears, `increase(...) == 0` returns
  # nothing, and the first half below can never fire. absent_over_time is
  # the second half, over the same 30m, so either way it fires 45 minutes
  # after the last byte. It also fires if fenrir's Alloy stops pushing at all,
  # which is a loss of Zeek's view too.
  - name: sensor
    interval: 60s
    rules:
      - alert: ZeekConnLogStopped
        expr: |
          increase(
            loki_source_file_read_bytes_total{
              component_id="loki.source.file.zeek", path="/zeek/logs/conn.log"
            }[30m]
          ) == 0
          or
          absent_over_time(
            loki_source_file_read_bytes_total{
              component_id="loki.source.file.zeek", path="/zeek/logs/conn.log"
            }[30m]
          )
        for: 15m
        labels:
          component: sensor
          severity: warning
          category: availability
        annotations:
          summary: "Zeek has written nothing to conn.log for 45 minutes"
          description: >-
            Zeek's event loop may still be turning while it logs no
            connections: the mirror is up and carrying nothing it can parse,
            or the capture interface changed. The estate's ZeekMirrorInactive
            says whether packets reach fenrir. On fenrir, `docker logs
            sensor-zeek` and the newest lines of conn.log.
