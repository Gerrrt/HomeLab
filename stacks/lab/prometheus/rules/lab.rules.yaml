---
# The lab stack watching itself.
#
# Twenty-five rules, and the number is still the point. The estate has 48;
# ADR-0007 names giving up "Loki, the dashboards and 40 alert rules" as the
# price of keeping lab telemetry out of the estate, and this file does not
# pretend to replace them. Five cover this stack's own working, its agents'
# log shipping included — the things that would make every other signal here
# silently wrong. Two cover the disks of the guests that
# push here, in the detail only their own node_exporter has; the estate pages on
# the same disks, read another way (ADR-0070). Three cover the domain ADR-0029 sized,
# and they are here rather than in a stack of their own because this Prometheus
# is the only thing on the segment that scrapes it. Seven cover golem's backups
# (ADR-0053), because a verify nobody watches is a green check with nothing
# behind it, and this is where the lab looks. Three cover fenrir's Zeek archive
# prune (#850), the one run-scheduled.sh job whose outcome lands here. Three
# cover the guests' patch state, which their own patch-state timers write and
# which no estate rule can see, because these guests push here and not there.
# Two cover whether fenrir is still the appliance its runbook leaves (#1577),
# which nothing else checks at all.
#
# NOTHING HERE PAGES. There is no Alertmanager in this stack (ADR-0020), so a
# firing alert is visible in Prometheus's /alerts and in Grafana and nowhere
# else. That is a deliberate limit, not an oversight, and it is why these are
# scoped to "the collector is broken" rather than to anything about the estate
# being defended: an alert nobody is notified of is only useful to someone who
# is already looking, and someone already looking is looking at the lab.
#
# The names deliberately match the estate's rules for the same conditions.
# `external_labels: monitor: imaginationlan` in prometheus.yaml is what
# distinguishes them, and it travels with every series; two different names for
# one condition would not survive a screenshot pasted into an issue.
#
# What this does NOT cover, and cannot: this Prometheus going down. `up == 0`
# is evaluated by the thing that would have stopped. The estate answers that
# for itself with a watcher on `oracle` (ADR-0015) and a heartbeat receiver;
# the lab has neither available to it.
#
# ADR-0028 narrowed that gap without closing it, and the difference is worth
# holding on to. A guest's RUN STATE now crosses to the estate, read from `qm`
# on the hypervisor — so `alexander` being powered off is seen on VLAN 99. This
# Prometheus crashing inside a guest that is still running is not, and neither
# is anything else in this file.
groups:
  - name: lab
    interval: 60s
    rules:
      # Covers every target in prometheus.yaml — itself, loki, grafana, alloy,
      # and since ADR-0029 the domain's servers. `up` is the only one of these
      # that sees a component which has stopped publishing altogether; the
      # others read a metric the component emits about its own working, which
      # requires it to be working enough to emit.
      #
      # `role!="endpoint"` is load-bearing and is not a way of ignoring the
      # workstations. ADR-0029 runs `carbuncle` and `siren` PER SESSION, so they
      # are off far more often than they are on, and off is their correct state.
      # A bare `up == 0` would fire against them continuously — the permanently
      # firing shape ADR-0017 refuses on `gandalf`, arriving here instead — and an
      # alert that is always firing is one nobody reads when it means something.
      # The label is absent on this stack's own four services, and an absent
      # label matches `!=`, so their behaviour is unchanged.
      #
      # What this gives up, stated rather than hidden: nothing notices an
      # endpoint that fails to come back when you start it. That is a session
      # you are sitting in front of, which is the one case where a human is
      # already looking.
      - alert: InstanceDown
        expr: up{role!="endpoint"} == 0
        for: 5m
        labels:
          component: lab
          severity: critical
          category: availability
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down in the lab stack"
          description: >-
            The lab's Prometheus has failed to scrape {{ $labels.instance }}
            ({{ $labels.job }}) for 5 minutes. ADR-0028 lets the estate see that
            a guest stopped, never that something inside one did, so for a
            container this alert is the only thing that reports it.

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          component: lab
          severity: critical
          category: correctness
        annotations:
          summary: "The lab's Prometheus rejected its own config reload"
          description: >-
            It is still serving the config it last parsed successfully, so the
            change you deployed is not the one running.

      # The rule this stack most needs, because its retention figures are a
      # bound rather than a measurement — compose.yaml says so at length. If
      # 4 GiB turns out to be too small, retention quietly becomes shorter than
      # the 15 days configured, the store keeps working and the dashboards keep
      # drawing. This counter is the only thing that distinguishes "the ceiling
      # engaged" from "old data aged out normally": do not substitute
      # prometheus_tsdb_time_retentions_total, which increments by design.
      - alert: PrometheusSizeRetentionActive
        expr: increase(prometheus_tsdb_size_retentions_total[1h]) > 0
        for: 5m
        labels:
          component: lab
          severity: warning
          category: correctness
        annotations:
          summary: "The lab's size ceiling is evicting blocks — retention is shorter than 15 days"
          description: >-
            Re-derive the retention figures against the spindles rather than
            raising the ceiling blind; compose.yaml carries the queries.

      - alert: LokiIngestionStalled
        expr: |
          sum(rate(loki_distributor_lines_received_total[30m])) == 0
        for: 30m
        labels:
          component: lab
          severity: warning
          category: availability
        annotations:
          summary: "The lab's Loki has received no log lines for 30 minutes"
          description: >-
            Either the lab's Alloy is down or the push endpoint is unreachable.
            A running agent retries a failed push for a few minutes, then drops
            the batch: those lines are lost. A stopped agent's file and Docker
            sources resume from their saved positions when it starts, unless
            the logs rotated away meanwhile. Its journal source resumes only
            after an outage under 24 hours (its max_age); after a longer one,
            those journal lines are skipped. Loki refuses any line older than
            168 hours.

      # The estate's rule of the same name, carried here (#1552). Every guest's
      # Alloy pushes its own internals here as job="<host>-alloy" (config.alloy's
      # selfmetrics), so the expression needs no change. Until this rule, a
      # lab guest losing log lines said so only in its own Alloy's log: fenrir
      # dropped a re-sent Zeek line every ten minutes from 2026-11-16, when the
      # line turned seven days old, with nothing firing anywhere.
      # LokiIngestionStalled cannot see that, because the other lines kept
      # arriving.
      #
      # `for: 1h` for the estate's reason: an Alloy restart replays history and
      # Loki refuses the old part of it in one burst, which rate() over 15m
      # carries for fifteen minutes and no longer. stack.rules.yaml has the
      # measurements (#341). Loss that keeps happening outlasts the hour.
      - alert: LogEntriesDropped
        expr: |
          sum by (job, reason) (rate(loki_write_dropped_entries_total[15m])) > 0
        for: 1h
        labels:
          component: lab
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.job }} has been losing log lines to {{ $labels.reason }} for an hour"
          description: >-
            The lab's Loki has been rejecting these entries for an hour, so this
            is not the burst an agent restart produces. Ask Loki which limit it
            is applying with `sum by (reason) (loki_discarded_samples_total)`.
            An entry older than 168 hours means an agent is re-sending old
            lines: a Docker log follow that keeps reconnecting does that (#1552).

      # The guests' own disks: `alexander`, and `odin`, whose Alloy pushes here
      # (stacks/soc). The estate's HostDisk* rules cannot see either, because
      # neither pushes to VLAN 99 (ADR-0007). So until 2026-10-01 nothing
      # watched them at all, and odin's 30 GB root reached 98% unnoticed:
      # 7.8 GB of it was superseded Docker images, which nothing on an agent
      # host removed (homelab-prune-images on the agents does now).
      #
      # Same names and same expressions as the estate's pair, per the header.
      # The forecast is the one that would have caught odin, filling slowly
      # for weeks; the threshold is the backstop. Neither pages (ADR-0020).
      # What pages is the estate's GuestDiskCritical and GuestDiskWillFillIn24h,
      # on the same disks read by Saruman through each guest's agent
      # (ADR-0070, #778). These stay as the lab's own view, with the detail
      # only node_exporter inside the guest has.
      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
          and on (instance, device)
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.30
        for: 1h
        labels:
          component: host
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} fills within 24h"
          description: >-
            {{ $labels.mountpoint }} on {{ $labels.instance }} ({{ $labels.device }})
            is below 30% free and, extrapolating the last 6 hours, reaches zero
            within a day. On a Docker host, `docker system df` first: superseded
            images are what filled odin.

      - alert: HostDiskCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 15m
        labels:
          component: host
          severity: critical
          category: capacity
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} below 10% free"

      # -----------------------------------------------------------------------
      # The guests' patch state. homelab-patch-state writes
      # apt-patch-state.prom daily on odin (and on any lab guest that installs
      # it), and its Alloy ships the textfile directory here. The estate has
      # these three rules in stacks/observability's host.rules.yaml, but they
      # never see a lab guest: odin and alexander push to this Prometheus, not
      # to that one. Until 2026-11-16 the series arrived and nothing read them,
      # so odin carried a pending reboot from a libc6 upgrade with nothing
      # saying so. The names, windows and reasoning are the estate's; read that
      # file for the argument behind each `for`.
      # -----------------------------------------------------------------------

      # Unattended-upgrades applies security updates itself, so a week of
      # them still pending means they did not apply: held, phased, or waiting
      # on a reboot.
      - alert: SecurityUpdatesPending
        expr: homelab_apt_security_upgrades_pending > 0
        for: 7d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has had {{ $value }} security update(s) pending for a week"
          description: >-
            Unattended-upgrades should have applied these. A week of them
            sitting there means they are held, phased, or waiting on a reboot.
            Check with `apt list --upgradable` and
            `systemctl status unattended-upgrades.service`.

      # A package asked for a reboot and nothing has done it. Nothing on these
      # guests reboots by itself: unattended-upgrades installs, and
      # Automatic-Reboot is left at its default of off. Three days, as the
      # estate's, because a reboot of odin is a window without the SIEM.
      - alert: RebootRequired
        expr: homelab_reboot_required == 1
        for: 3d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has needed a reboot for three days"
          description: >-
            /var/run/reboot-required.pkgs names the packages that asked. Pick a
            window: rebooting odin stops the SIEM for a few minutes, and the
            agents queue meanwhile. Afterwards check the stack with
            docs/runbooks/build-the-soc-guest.md §10.

      # A guest that was reporting patch state and has stopped. Without it, a
      # dead collector silences both rules above in the way that looks
      # healthiest. Two ways to stop, so two branches:
      #
      # - The series vanished: Alloy or the textfile directory went. Stopped,
      #   not missing, so a guest without the timer is not an alert. Fourteen
      #   days of memory, not one, inside this Prometheus's 15d retention: with
      #   [1d] the alert cleared itself about 30h after the last sample, with
      #   nothing recovered (review of ApplianceStateStopped, #1580). A guest
      #   retired on purpose fires for two weeks. This stack has no
      #   Alertmanager (ADR-0020), so there is nothing to silence: it shows in
      #   this Prometheus's /alerts and in Grafana until it ages out, and is
      #   expected there.
      # - The file stopped being rewritten. A collector that dies leaves
      #   apt-patch-state.prom in place and Alloy re-serves its last values on
      #   every scrape, so the series never goes absent and the first branch
      #   cannot see it. Two days, the window schedule-maintenance.md gives the
      #   daily timer, covers one missed run and its jitter. The mtime series
      #   carries `instance`, not `host`, so label_replace copies one into the
      #   other. Raised in review on #1544.
      #
      # ON-DEMAND GUESTS ARE LEFT OUT WHILE THEY ARE OFF, which is ADR-0079's
      # decision for HypervisorGuestStopped brought to this rule. `eden` is off
      # between sessions, and an off guest pushes nothing, so without this the
      # first branch fires six hours after every session ends. The lab cannot
      # read Saruman's `on-demand` tag, so the guests are named here, as
      # `role="endpoint"` names the domain's in prometheus.yaml: add a Linux
      # guest here when it gets the tag and the collector. "Off" is "none of
      # its node metrics have arrived in an hour", read from
      # node_boot_time_seconds, which every guest's Alloy pushes; a window, not
      # an instant, so a late push does not count as a shutdown, and an hour
      # is well inside the six hours the branch waits anyway. While the guest is up it is treated like any
      # other, so a dead collector on a running `eden` still fires. Only the
      # first branch needs this: an off guest's mtime series goes with it, and
      # at boot Persistent=true collects within the timer's 15 minutes of jitter,
      # inside `for: 30m`.
      - alert: PatchStateStopped
        expr: >-
          (
            count by (host) (present_over_time(homelab_apt_upgrades_pending[14d] offset 6h))
            unless
            count by (host) (present_over_time(homelab_apt_upgrades_pending[6h]))
            unless on (host)
            (
              count by (host) (present_over_time(homelab_apt_upgrades_pending{host=~"eden"}[14d] offset 6h))
              unless
              count by (host) (present_over_time(node_boot_time_seconds{host=~"eden"}[1h]))
            )
          )
          or
          count by (host) (
            label_replace(
              time() - node_textfile_mtime_seconds{file=~".*apt-patch-state\\.prom"} > 2 * 86400,
              "host", "$1", "instance", "(.*)"
            )
          )
        for: 30m
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has stopped reporting patch state"
          description: >-
            Its patch state has gone absent, or apt-patch-state.prom has not
            been rewritten in two days, so SecurityUpdatesPending and
            RebootRequired are reading stale or no data for it. Check
            `systemctl status homelab-patch-state.timer` on the guest, and that
            /var/lib/node_exporter/textfile_collector/apt-patch-state.prom is
            being written and is world-readable.

      # -----------------------------------------------------------------------
      # The domain (ADR-0029). Scraped, never pushed — publishing a remote-write
      # receiver on the segment that exists to hold attackers would hand it a
      # delete-series API pointed at the lab's own evidence.
      # -----------------------------------------------------------------------

      # ADR-0014 named this failure and did not fix it: "a domain controller
      # syncing time from time.windows.com drifts once 123/udp is blocked, and
      # the symptom is Kerberos failing estate-wide five minutes later, with
      # nothing in the firewall log but w32time events on the DC."
      #
      # 60s is derived, not picked. Kerberos' default MaxTolerance is five
      # minutes, so this is above anything a virtualised clock produces as noise
      # and four minutes clear of the point at which authentication starts
      # failing — it fires while the domain still works, which is the whole of
      # ADR-0014's complaint against the option it rejected.
      - alert: DomainControllerClockDrifting
        expr: abs(windows_time_computed_time_offset_seconds{role="dc"}) > 60
        for: 10m
        labels:
          component: domain
          severity: critical
          category: correctness
        annotations:
          summary: "{{ $labels.instance }}'s clock is more than 60s out"
          description: >-
            Kerberos tolerates five minutes. Past that every symptom in the
            domain points at credentials and none of them point at time.

      # The rule the one above cannot replace, and the reason there are two.
      #
      # windows_time_computed_time_offset_seconds is the offset against WHICHEVER
      # SOURCE w32time has chosen. When the configured peer becomes unreachable
      # and w32time falls back to the local CMOS clock, it is perfectly
      # synchronised with itself: the offset reads ~0, the rule above stays
      # quiet, and the domain drifts toward Kerberos failure with nothing
      # complaining. A single-rule design would reproduce the quiet failure
      # inside its own detector — which is #62 and #63, and is why this reads the
      # source instead.
      #
      # The `type` label is the collector's own, and its values are AllSync,
      # Local CMOS Clock, NT5DS, NTP and NoSync. The DCs must read NTP; members
      # read NT5DS and are deliberately not covered here, because a member
      # following the domain hierarchy is the correct state.
      - alert: DomainControllerTimeSourceIsLocalClock
        expr: windows_time_clock_sync_source{role="dc",type="Local CMOS Clock"} == 1
        for: 15m
        labels:
          component: domain
          severity: critical
          category: correctness
        annotations:
          summary: "{{ $labels.instance }} has fallen back to its own CMOS clock"
          description: >-
            w32time has given up on 10.0.30.1 and is now synchronised with
            itself, so the drift alert cannot fire. Check that morpheus still
            serves NTP on the ImaginationLAN interface.

      # The four servers run evaluation media, and ADR-0029's answer to "an
      # estate that has to be rebuilt every 180 days is one that will not be
      # rebuilt" is to stop the clock being invisible. The gauge comes from a
      # weekly scheduled task writing into windows_exporter's textfile
      # directory, the same mechanism collect-patch-state.sh already uses.
      #
      # Scoped to the servers on purpose: the two endpoints hold purchased Pro
      # licences, where GracePeriodRemaining reads 0 because there is no grace
      # period rather than because it has run out. Unscoped, this rule would fire
      # against them permanently and mean nothing.
      - alert: LabWindowsEvaluationExpiring
        expr: windows_eval_grace_days_remaining{role=~"dc|member"} < 30
        for: 1h
        labels:
          component: domain
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.instance }}'s evaluation licence has under 30 days left"
          description: >-
            At expiry the machine stops being usable rather than degrading.
            Rebuild it from a freshly built template (build-the-lab-domain.md
            §7). Rearming is not an option: a clone of a generalised image has
            no rearm left.

      # --- golem's backups (ADR-0053, #485) ------------------------------------
      #
      # ADR-0053 and ADR-0027 require a verify job's outcome to reach where the
      # lab already looks; PBS keeps it in its own task log on golem.
      # scripts/collect-pbs-task-state.py publishes it hourly from golem's
      # textfile directory, and these seven read it. Like everything in this
      # file they page nobody: they are in /alerts and Grafana for whoever is
      # looking at the lab.

      # Any verify, prune or garbage collection whose last run did not end
      # `OK`, `WARNINGS: n` included. The state stays until the job's next
      # run, so this holds for a week after a failed verify unless someone
      # re-runs it, which is the point.
      - alert: PbsJobFailed
        expr: homelab_pbs_job_last_run_ok == 0
        for: 5m
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.host }}'s {{ $labels.kind }} job {{ $labels.pbs_job }} did not finish OK"
          description: >-
            Read the task log in golem's web UI (Administration, Tasks) or
            `proxmox-backup-manager task list --all` on golem. A failed verify
            names the snapshot; a failed garbage collection on this NFS
            datastore is worth reading build-the-backup-guest.md §11 for
            before the next one runs.

      # The verify job's last run is more than a fortnight old, or it has never
      # run (the collector writes 0). Weekly is the schedule, so two missed
      # Sundays: golem down over a weekend, a schedule edited away, or a verify
      # that has hung for a week.
      - alert: PbsVerifyOverdue
        expr: time() - homelab_pbs_job_last_run_end_timestamp_seconds{kind="verify"} > 14 * 86400
        for: 1h
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.host }}'s verify job {{ $labels.pbs_job }} has not finished in 14 days"
          description: >-
            Its last run ended {{ $value | humanizeDuration }} ago. Backups not
            re-read are backups not known to be readable. Check the job's
            schedule on golem (Datastore, Verify Jobs) and its task log.

      # The verify job is gone: deleted, or never made on a rebuilt golem.
      # PbsVerifyOverdue cannot see that, because a job that does not exist
      # leaves no last-run series to be old, so the collector counts each
      # datastore's verify jobs, 0 included, and this reads the 0.
      - alert: PbsNoVerifyJob
        expr: homelab_pbs_jobs{kind="verify"} == 0
        for: 1h
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.host }}'s {{ $labels.store }} has no verify job"
          description: >-
            Nothing re-reads its backups, so nothing finds a damaged one
            before a restore does. Recreate it as build-the-backup-guest.md
            §6 makes it: weekly, Sunday 03:00, re-verify after 30 days.

      # A snapshot PBS has re-read and found damaged. Verify-job failures say
      # the same once; this says it for as long as the snapshot exists, and
      # also for a verify run by hand.
      - alert: PbsSnapshotVerifyFailed
        expr: homelab_pbs_snapshots{verify="failed"} > 0
        for: 5m
        labels:
          component: backup
          severity: critical
          category: correctness
        annotations:
          summary: "{{ $value }} snapshot(s) on {{ $labels.host }}'s {{ $labels.store }} failed verification"
          description: >-
            A restore from one of them may fail. Find it in golem's web UI
            (Datastore, Content, the red mark). Missing chunks after a garbage
            collection are §11's atime case; roll erebor/pbs back to the
            newest TrueNAS snapshot from before that run.

      # Nothing has been backed up for a day and a half. The job runs nightly
      # at 21:00, so this is one missed night plus margin. An empty datastore
      # reads 0 and fires too, which is correct: it is not being backed up.
      - alert: PbsBackupStale
        expr: time() - homelab_pbs_snapshot_newest_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          component: backup
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.host }}'s {{ $labels.store }} has no backup newer than {{ $value | humanizeDuration }}"
          description: >-
            Saruman's golem-nightly job did not run or did not reach golem.
            Check the job's last run on Saruman (Datacenter, Backup; or
            /var/log/vzdump/), `pvesm status` for golem, and the 2049 pass to
            smaug if golem's datastore is unmounted.

      # A snapshot with a data archive not in `encrypt` mode: stored in the
      # clear, or `sign-only`, which carries the key's fingerprint and leaves
      # the data readable. ADR-0053 encrypts everything on Saruman before it
      # leaves, so this is a storage or job set up without the key, and its
      # data sits on smaug in the clear.
      - alert: PbsSnapshotUnencrypted
        expr: homelab_pbs_snapshots_unencrypted > 0
        for: 5m
        labels:
          component: backup
          severity: critical
          category: security
        annotations:
          summary: "{{ $value }} unencrypted snapshot(s) on {{ $labels.host }}'s {{ $labels.store }}"
          description: >-
            Check that Saruman's golem storage still has its encryption-key
            line in /etc/pve/storage.cfg, and which job wrote the snapshot.
            Delete the unencrypted snapshots on golem once a good backup
            exists.

      # The collector stopped, which is not PBS being fine: every rule above
      # reads its last answer and cannot fire on a new failure. Three hours is
      # three missed hourly runs. A collector that cannot read PBS writes
      # nothing on purpose, so this is also "PBS's API stopped answering".
      - alert: PbsTaskStateStale
        expr: time() - node_textfile_mtime_seconds{file=~".*pbs-task-state\\.prom"} > 3 * 3600
        for: 10m
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.instance }} has not rewritten its PBS task state for {{ $value | humanizeDuration }}"
          description: >-
            The backup alerts are reading an old answer. Check
            homelab-pbs-task-state.timer on golem and
            `journalctl -u homelab-pbs-task-state`, which says what PBS
            answered.

      # fenrir's Zeek archive prune (#850), the one scheduled job whose outcome
      # lands here. It runs through run-scheduled.sh like the estate's jobs, so
      # it writes the same homelab_job_* series, and these three carry the
      # estate's names for the same conditions. What they cannot carry is the
      # estate's threshold table: homelab_job_max_age_seconds is written by
      # install-timers.sh on oracle, and nothing writes it on fenrir, so the
      # threshold is stated inline, as PbsVerifyOverdue states its fortnight.
      #
      # The prune matters because nothing else bounds the archive: a prune that
      # stops is found by /srv/sensor-data filling, and that is found only here.

      # The last run failed. Within ten minutes rather than after Stale's three
      # days, so a broken prune is visible the morning it breaks.
      - alert: ScheduledJobFailed
        expr: homelab_job_last_exit_code != 0
        for: 10m
        labels:
          component: sensor
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.homelab_job }} on {{ $labels.instance }} exited {{ $value }}"
          description: >-
            The last run failed. `journalctl -u homelab-{{ $labels.homelab_job }}.service -n 100`
            on the host has the output. Exit 75 means it never started because
            another job held its lock.

      # No success for three days. The prune is daily, so this is three missed
      # nights: the timer stopped, fenrir has been off, or it fails every night
      # (run-scheduled.sh carries the last success forward across a failure, so
      # a nightly failure ages out here on schedule).
      - alert: ScheduledJobStale
        expr: |
          time() - homelab_job_last_success_timestamp_seconds{homelab_job="zeek-archive-prune"}
            > 3 * 86400
        for: 1h
        labels:
          component: sensor
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.homelab_job }} on {{ $labels.instance }}: no success for {{ $value | humanizeDuration }}"
          description: >-
            Zeek's archive is not being pruned and /srv/sensor-data will fill.
            Check `systemctl list-timers homelab-zeek-archive-prune.timer` and
            `journalctl -u homelab-zeek-archive-prune` on fenrir —
            docs/runbooks/build-the-sensor-guest.md §4.

      # No run recorded at all: the timer was never installed (a rebuilt fenrir
      # where nobody ran the installer), its .prom was removed, or fenrir's
      # Alloy is not shipping the textfile directory. Stale cannot see any of
      # those, because a job that never ran leaves no series to be old.
      - alert: ScheduledJobNeverRan
        expr: absent_over_time(homelab_job_last_run_timestamp_seconds{homelab_job="zeek-archive-prune"}[6h])
        for: 1h
        labels:
          component: sensor
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.homelab_job }} is scheduled but has never recorded a run"
          description: >-
            No outcome from fenrir's Zeek archive prune in six hours. Install
            it from the checkout on Hicks with
            `make install-agent-collectors AGENT=atreus@10.0.30.90 ARGS='--only zeek-archive-prune'`
            (docs/runbooks/build-the-sensor-guest.md §4), and check that
            /var/lib/node_exporter/textfile_collector exists on fenrir.

      # -----------------------------------------------------------------------
      # Whether fenrir is still the appliance build-the-sensor-guest.md §0
      # decides it is (#1577). homelab-appliance-state writes one 0-or-1 per
      # check to appliance-state.prom hourly. The audit of 2026-11-13 found the
      # guest had been a workstation for weeks with nothing saying so; these
      # two are what says so now, to whoever looks here.
      #
      # What they do not cover, and the collector's header says it at length:
      # whoever has root on fenrir can make every check read 1. These catch
      # drift by accident, not a guest someone has taken.
      # -----------------------------------------------------------------------

      # A check has read 0 across two hourly runs. One bad run stays exported
      # until the next replaces it: an hour, up to 5m more from each run's
      # RandomizedDelaySec, and a scrape, so about 67m at most. Two bad runs
      # read 0 for at least 110m. 75m sits between, so a run that failed once
      # and was put right does not fire (review on #1580: 1h did). The label
      # names the check, and `journalctl -u homelab-appliance-state` on fenrir
      # names what failed; the value of what was found never leaves the guest.
      - alert: ApplianceCheckFailed
        expr: homelab_appliance_check == 0
        for: 75m
        labels:
          component: sensor
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} is no longer the appliance its runbook leaves: {{ $labels.check }}"
          description: >-
            The `{{ $labels.check }}` check has failed on two hourly runs. Read
            `journalctl -u homelab-appliance-state -n 20` on the guest, then
            put it back as docs/runbooks/build-the-sensor-guest.md §3 and §4
            leave it. If the change was meant, change the runbook and
            scripts/collect-appliance-state.sh in one PR.

      # The checks have stopped reporting, which reads exactly like a guest
      # that passes them all. Two branches: the series is gone, or the file
      # stopped being rewritten while Alloy keeps serving its last values.
      # Three hours is two missed hourly runs and their jitter.
      #
      # The first branch names fenrir rather than asking "was it reporting a
      # day ago", as PatchStateStopped does. That form clears itself about 27h
      # after the series goes, once the last sample leaves its window, and if
      # Alloy stopped too the mtime branch has nothing to read either (review
      # on #1580). This collector belongs on fenrir and nowhere else, so its
      # absence there is the condition, for as long as it lasts. A rebuilt
      # fenrir that never had the installer run fires it too, which is right.
      - alert: ApplianceStateStopped
        expr: >-
          absent_over_time(homelab_appliance_check{host="fenrir"}[3h])
          or
          count by (host) (
            label_replace(
              time() - node_textfile_mtime_seconds{file=~".*appliance-state\\.prom"} > 3 * 3600,
              "host", "$1", "instance", "(.*)"
            )
          )
        for: 30m
        labels:
          component: sensor
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has stopped reporting its appliance checks"
          description: >-
            Its appliance checks have gone absent, or appliance-state.prom has
            not been rewritten in three hours, so ApplianceCheckFailed is
            reading stale or no data for it. Check
            `systemctl status homelab-appliance-state.timer` on the guest. A
            stopped timer on a guest that was passing is itself worth a look.
