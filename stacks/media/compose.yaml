---
# The media tier: ADR-0008's media server, placed with the screens it serves.
#
# Deployed on: smaug (10.0.40.30, VLAN 40 / CasaBonita) — the ThinkServer TS150
#              of #413, running TrueNAS per ADR-0040. DEPLOYED 2026-09-19, from
#              a copy of this directory's two files at /mnt/erebor/apps/stack,
#              under TrueNAS's own Docker — docs/runbooks/build-the-nas.md §6.
#              Authored on 2026-09-16, before the pool existed, as
#              stacks/sensitive was authored before trinity was built.
# Deploy with:  NOT `make up STACK=media`. That target renders a secrets file
#              this stack does not have — by decision, #528 and
#              docs/security.md § Secrets — on a box with neither make nor sops.
#              A change here reaches smaug by re-fetching compose.yaml and
#              .env.example from main into that folder and running
#              `docker compose up -d` there, by hand — nothing on smaug pulls
#              from main on its own. README.md has the procedure. A third
#              file sits beside those two since ADR-0047:
#              scripts/collect-smart-state.sh, fetched the same way and run
#              by TrueNAS's cron rather than by this file (§6.4).
#
# ---------------------------------------------------------------------------
# Why this stack is two media services
# ---------------------------------------------------------------------------
# ADR-0016 decided Jellyfin alone, and Plex only if a screen on 40 turns out to
# have no working Jellyfin client — a deferral against a test nobody has run,
# not a rejection. Navidrome (#141) joined it on 2026-09-22 for music, which
# is the weakest thing Jellyfin does. Audiobookshelf (#140) lands here later,
# in the same shape.
#
# ---------------------------------------------------------------------------
# Why there is no reverse proxy here, and why that is not an oversight
# ---------------------------------------------------------------------------
# stacks/sensitive puts everything behind Caddy and publishes one port, because
# that tier holds the data whose loss hurts. This tier does not. Its clients are
# televisions, and a television is not a browser: it speaks to Jellyfin on 8096
# directly, on the same broadcast domain, with no firewall rule involved at all.
# That is the whole of what ADR-0008 bought by placing the server WITH its
# clients rather than punching a hole through a terminal segment to reach it.
#
# A proxy in front of that would add a hop, a certificate the televisions would
# have to trust, and a second thing to be down — for a service whose threat
# model is already "the segment with the game consoles on it".
#
# ---------------------------------------------------------------------------
# On the comments in this file
# ---------------------------------------------------------------------------
# The settings shared with stacks/observability and stacks/sensitive — why
# `init: true`, why `pids_limit`, the healthcheck shape, the `${VAR:?}` guards
# that double as the required-key list — are argued at length in those files and
# are NOT repeated here. What IS written out is what was MEASURED on the pinned
# image, because those are the lines a reader cannot get from a sibling file or
# from upstream's documentation.

name: media

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [media]
  init: true
  pids_limit: 512

services:
  # ---------------------------------------------------------------------------
  # Jellyfin — the media server the televisions reach directly (#138, ADR-0016)
  # ---------------------------------------------------------------------------
  # MEASURED 2026-09-16 on the pinned image, and each of these is a line
  # someone would otherwise have to guess at:
  #
  #   1. The image declares NO user, so it runs as root unless told otherwise.
  #      Every other service in this estate runs as a numeric non-root user and
  #      so does this one.
  #
  #   2. `/config` and `/cache` are `0:0` mode **777** in the pinned image:
  #
  #        docker run --rm --entrypoint stat <the jellyfin image> \
  #          -c '%n %u:%g %a' /config /cache
  #
  #      The placeholder is deliberate: scripts/pin-digests.sh rewrites every
  #      image reference in this file, comments included, so a literal one here
  #      would grow a digest on every bump. stacks/sensitive uses `<caddy
  #      image>` in the same place for the same reason.
  #
  #      World-writable means a non-root user can write them on first use, so
  #      this service needs none of the chown dance stacks/sensitive documents
  #      for Caddy. Verify the premise, not the argument, when the image moves:
  #      if that ever prints something other than 777, revisit the `user:` line.
  #
  #   3. `curl` is present; `wget`, `busybox` and `nc` are NOT. That decides the
  #      healthcheck, which elsewhere in this repository uses busybox wget.
  #
  #   4. It boots read-only as uid 65534 with only /tmp and /run as tmpfs, and
  #      answers on 8096 within about two seconds.
  #
  #   5. Idle RSS on a first boot with no library: **65 MiB**.
  jellyfin:
    <<: *service-defaults
    image: jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    container_name: media-jellyfin
    user: "${JELLYFIN_UID:?}:${JELLYFIN_GID:?}"
    # The render group on the HOST, which owns /dev/dri/renderD128 — this is
    # what lets a non-root container use Quick Sync. It is a host fact and not
    # an image one, so .env.example says how to find it rather than guessing a
    # number; getting it wrong is the difference between hardware transcoding
    # and one 4K stream saturating the box.
    group_add:
      - "${RENDER_GID:?}"
    # The Intel HD P630 in the E3-1225 v6. ADR-0040 made a live iGPU the
    # HARDWARE half of its reopen condition and said explicitly that a P630 the
    # host can see and a P630 a container can use are different claims — this
    # device line is where the second claim is made. build-the-nas.md §6.1 is
    # where it was tested, on 2026-09-19, and it passed: the node is listed
    # inside the container, `id` there carries the render group, and a forced
    # transcode ran through VAAPI and h264_qsv at about five times real time.
    devices:
      - /dev/dri:/dev/dri
    # A ceiling to catch a leak, not a measurement — the same position
    # stacks/sensitive takes, and #114's method replaces it once this tier has
    # run for a fortnight. The number it is a ceiling OVER is 65 MiB idle; the
    # headroom is for a library scan and for transcode buffers, which is the
    # work this service exists to do and the only work that will move it.
    mem_limit: 2g
    memswap_limit: 2g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /run:size=16m
    volumes:
      # Jellyfin's own state: the database, the users, the watch history, the
      # resume positions and — by default — the downloaded metadata and artwork.
      # This is the half of this tier that IS backed up, and the reason the
      # split exists: ADR-0008 ruled the library replaceable, but re-acquiring
      # a series does not restore which episode anyone was on.
      #
      # A BIND MOUNT ON erebor/apps, not a named volume, and that is the whole
      # of ADR-0045's second decision. As a named volume this lived on
      # erebor/ix-apps/docker — the dataset TrueNAS gives its Docker — while
      # build-the-nas.md §4 called erebor/apps the dataset that is backed up,
      # so the dataset the table named held nothing Jellyfin writes (#484).
      # A path under erebor/apps makes that table true, and it is a path a
      # ZFS snapshot can name: scripts/backup-nas.sh, on the monitoring host,
      # reads this directory out of the dataset's newest periodic snapshot
      # over the 99 → 40:22 pass and encrypts what arrives THERE. Jellyfin is
      # never stopped for it; the snapshot is the quiesce. The directory is
      # created 0755 65534:65534 before first start (§6) — a bind mount does
      # not inherit the image's world-writable /config the way a fresh volume
      # would, so the user: line above has to own it.
      - ${JELLYFIN_CONFIG_PATH:?}:/config
      # Transcode scratch and image caches. Regenerated on demand, so this is
      # the volume whose loss costs CPU rather than anything. Still a named
      # volume, still on ix-apps, still not backed up — DISPOSABLE by name in
      # scripts/backup-volumes.sh.
      - jellyfin-cache:/cache
      # READ-ONLY, deliberately. Jellyfin keeps metadata in /config by default,
      # so it has no need to write into the library — and mounting the library
      # read-only means a compromised media server on the segment with the game
      # consoles cannot delete the thing it serves. If a future decision wants
      # .nfo files written alongside the media, that is a decision to record and
      # this line to change, not a default to drift past.
      - ${MEDIA_PATH:?}:/media:ro
    # PUBLISHED, and this is the one service in the estate where publishing to
    # the whole segment is the POINT rather than a hole. ADR-0012 asks for a
    # named off-host consumer; here it is every television on CasaBonita, which
    # reaches this port on the same broadcast domain without the firewall ever
    # seeing the packet. The Hicks rule in build-the-nas.md §0.5 adds one more
    # consumer — a workstation — and nothing else on the estate may reach it.
    ports:
      - "${JELLYFIN_BIND_ADDR:?}:8096:8096"
    healthcheck:
      # curl, because the image has it and has no wget — see MEASURED (3).
      #
      # THIS KEYS ON THE STATUS CODE AND DELIBERATELY IGNORES THE BODY. A fresh
      # instance answers `/health` with **200 OK** and a body reading
      # `Degraded`, measured on the pinned image before the setup wizard has
      # ever been run. A check that required the body to read `Healthy` would
      # therefore mark the container unhealthy from first boot until somebody
      # completed the wizard — a bootstrap deadlock, and on `restart:
      # unless-stopped` a restart loop. So this proves the listener is up and
      # answering, which is what a container healthcheck can honestly claim;
      # whether Jellyfin is WELL is a question for the alert rules, once #256
      # settles how this host is scraped at all.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # It answered in about two seconds on a first boot with no library. This
      # figure covers a start that has one to read.
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Navidrome — the music server the phones reach, over Subsonic (#141)
  # ---------------------------------------------------------------------------
  # Jellyfin can serve music and does it worst of everything it does. Navidrome
  # speaks the Subsonic API, so the client problem is solved by a dozen mature
  # apps this repository will never have to maintain. It reads the same pool
  # Jellyfin does, from its own subdirectory, read-only.
  #
  # MEASURED 2026-09-22 on the pinned image — the lines below that differ from
  # Jellyfin's differ because of these:
  #
  #   1. The image declares NO user, like Jellyfin, so it would run as root.
  #      Its `/data` and `/music` are `0:0` mode **755**, unlike Jellyfin's
  #      777 — which does not matter for /data, a bind mount created 65534-owned
  #      before first start (build-the-nas.md §6), and does not matter for
  #      /music, which is only read.
  #
  #   2. The image has NO /cache, and that is fatal as a named volume: Docker
  #      creates the mount point root 0755, Navidrome as 65534 cannot create
  #      `/cache/plugins`, and the process ABORTS a second after reporting
  #      ready. Hence the uid-owned tmpfs below rather than a volume.
  #
  #   3. `curl`, `wget`, `busybox` and `nc` are all present — Alpine. The
  #      healthcheck uses busybox-style wget, the repository's default shape.
  #
  #   4. `/ping` answers **200** from first boot, BEFORE any admin exists — so
  #      there is no bootstrap deadlock of the kind Jellyfin's /health has.
  #
  #   5. It boots read-only as uid 65534 with /tmp and /cache as tmpfs,
  #      scans a library and answers within about two seconds.
  #
  #   6. Idle RSS after a first scan: **49 MiB** of anon memory.
  #
  #   7. Until an admin exists, the first visitor to 4533 gets to CREATE it —
  #      every console on this segment and every workstation on Hicks. §6
  #      closes that window from the TrueNAS shell, immediately after `up`,
  #      with `navidrome user create --admin`; after that the web route answers
  #      403. Nothing is handed in from the environment, which is why this
  #      stack still has no secrets file (#528).
  navidrome:
    <<: *service-defaults
    image: deluan/navidrome:0.64.1@sha256:df22d661b8d0322c33754d999b567150df9e131a47ae53be71fed0154bf8cef5
    container_name: media-navidrome
    user: "${NAVIDROME_UID:?}:${NAVIDROME_GID:?}"
    environment:
      # The image sets ND_MUSICFOLDER=/music and ND_DATAFOLDER=/data itself;
      # they are repeated so the mounts below and the paths the process uses
      # are written in one place rather than one here and one in a Dockerfile.
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      # Off /data, so the backup pull does not carry a transcode cache — see
      # MEASURED (2) for why it is a tmpfs.
      ND_CACHEFOLDER: /cache
      # Anonymous usage reporting to insights.navidrome.org. CasaBonita has
      # internet, and a household music server has no reason to use it for
      # this. The log reads `Insight Collector is DISABLED`.
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      # WASM plugins, which nothing here uses. Off, it stops Navidrome
      # creating a 0700 /data/plugins — a directory the backup user would
      # have to be proven able to read — and a wazero compile cache.
      ND_PLUGINS_ENABLED: "false"
    # A ceiling to catch a leak, not a measurement, on the same terms as
    # Jellyfin's. Over 49 MiB idle, with room for a full scan of a real library
    # and for the /cache tmpfs below, whose pages are charged to this limit.
    mem_limit: 1g
    memswap_limit: 1g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
      # Transcodes, resized artwork and background images: Navidrome caps
      # each at 100 MB by default, and all of it regenerates. A tmpfs rather
      # than a volume because of MEASURED (2), and owned by the user: line
      # because a tmpfs is root's otherwise.
      - /cache:size=384m,uid=65534,gid=65534,mode=0700
    volumes:
      # Navidrome's own state: its SQLite database — users, playlists,
      # favourites, play counts — and extracted artwork. Jellyfin's watch
      # history for music, and backed up the same way: a bind mount on
      # erebor/apps that scripts/backup-nas.sh reads out of the dataset's
      # newest snapshot (ADR-0045). Created 0755 65534:65534 before first
      # start (§6).
      - ${NAVIDROME_DATA_PATH:?}:/data
      # READ-ONLY, for Jellyfin's reason: a server on the segment with the game
      # consoles should not be able to delete what it serves. Navidrome never
      # writes to the library unless told to, and the watcher it starts on
      # /music works through a read-only mount — measured.
      - ${MUSIC_PATH:?}:/music:ro
    # PUBLISHED, with a named off-host consumer as ADR-0012 asks: the Subsonic
    # apps on the phones, which live on Hicks, through the fifth pass in
    # build-the-nas.md §0.5 (`50 → 10.0.40.30:4533`). Everything on CasaBonita
    # reaches it natively, as it reaches 8096.
    ports:
      - "${NAVIDROME_BIND_ADDR:?}:4533:4533"
    healthcheck:
      # `/ping` and the status code, which is 200 before and after the admin
      # exists — see MEASURED (4).
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      # About two seconds on a first boot. A start with a large library to
      # scan still answers /ping first; the scan runs behind it.
      start_period: 30s

  # ---------------------------------------------------------------------------
  # node_exporter — how this host is monitored at all (#256, ADR-0016)
  # ---------------------------------------------------------------------------
  # THIS IS THE HALF OF THE ESTATE'S MONITORING THAT RUNS BACKWARDS. Every other
  # host runs Alloy and pushes; CasaBonita is terminal-outward, so nothing here
  # may initiate upward and Prometheus reaches in and scrapes instead. ADR-0016
  # chose `node_exporter` on 9100 for that, #256 confirmed it against TrueNAS's
  # own endpoint, and the argument is written out in the observability stack's
  # prometheus/targets/node.yaml rather than repeated here.
  #
  # ADR-0016 assumed a distribution package. TrueNAS has no package manager and
  # an immutable root, so on this host the exporter is a container — which is
  # what keeps it inside Dependabot, the digest pins and `make validate`, the
  # argument ADR-0040 decision 2 made for keeping this stack in the repository.
  #
  # MEASURED 2026-09-17 on the pinned image, and each is a line someone would
  # otherwise guess at:
  #
  #   1. The image DOES declare a user — `nobody` — which is the opposite of
  #      Jellyfin above. The `user:` line below is still written out, because
  #      an image's default is a thing that can change under a Dependabot bump
  #      and every other service in this estate names its uid.
  #
  #   2. `wget`, `nc` and `busybox` are present; `curl` is NOT — again the
  #      opposite of Jellyfin, which decides the healthcheck the other way.
  #
  #   3. `/-/healthy` DOES NOT EXIST HERE. It answers **404**:
  #
  #        docker run --rm -d --name ne <node-exporter image>
  #        docker exec ne wget --spider -q http://localhost:9100/-/healthy
  #
  #      Prometheus, Alertmanager, snmp-exporter and blackbox-exporter all
  #      serve it and are all healthchecked that way in stacks/observability.
  #      node_exporter is not one of them, and a healthcheck copied from a
  #      sibling file would mark this container unhealthy forever on
  #      `restart: unless-stopped` — a restart loop, for a typo in a path.
  #
  #   4. It boots read-only as uid 65534 with `cap_drop: [ALL]` and no tmpfs at
  #      all: it writes nothing.
  #
  #   5. Idle RSS: **3.4 MiB**, rising to 5.3 MiB once it has served a scrape.
  node-exporter:
    <<: *service-defaults
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: media-node-exporter
    user: "65534:65534"
    command:
      # The host's filesystem, process table and sysfs, read through the mount
      # below rather than the container's own. Without these three the metrics
      # describe the container and `up` still reads 1 — the failure that looks
      # exactly like success. targets/node.yaml's header carries the one-line
      # check that catches it.
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.listen-address=:9100
      # SMART, by textfile (#483, ADR-0047). This container cannot read a
      # drive — uid 65534, cap_drop ALL, no smartctl in the image — and the
      # estate's collector needs root, so on this host it runs as a cron job in
      # TrueNAS's own UI and writes smart-state-smaug.prom into the directory
      # mounted below. node_exporter serves whatever .prom is there on the
      # scrape that already exists: the container gains a read-only directory
      # and nothing else. A missing or unreadable directory shows as
      # node_textfile_scrape_error 1, and a file that stops being rewritten as
      # SmartStateStale in host.rules.yaml — a dead cron does not delete its
      # last output, so presence alone would look healthy forever.
      - --collector.textfile.directory=/textfile
      # NO NETWORK METRICS FROM THIS HOST, deliberately, and this is the one
      # line in the file worth reading twice.
      #
      # `/proc/net` is a symlink to `/proc/self/net` and resolves in the
      # READING process's network namespace. A bridged container reading a
      # bind-mounted host `/proc` therefore reports its own veth: measured
      # 2026-09-17, `node_network_receive_bytes_total` named `eth0` and `lo`
      # and nothing else, on a host with real NICs.
      #
      # That is worse than a gap. The Host Overview's throughput panels filter
      # `device!~"lo|veth.*|docker.*|br-.*"`, which `eth0` passes — so the
      # container's loopback-quiet veth would be charted as this NAS's network
      # throughput, plausibly and silently, on the one host in the estate whose
      # job is moving bytes over a network. Reporting nothing is honest;
      # reporting a believable wrong number is not.
      #
      # The alternative is `network_mode: host`, and it costs more than it
      # buys: the anchor above carries `networks:`, which compose refuses
      # alongside `network_mode`, so this service would drop out of
      # x-service-defaults and lose `restart`, `logging`, `init` and
      # `pids_limit`; and `ports:` is silently ignored under host networking,
      # so the bind address below — ADR-0012's discipline — would stop meaning
      # anything while still reading as though it did.
      - --no-collector.netdev
      - --no-collector.netclass
      - --no-collector.netstat
      - --no-collector.arp
      - --no-collector.sockstat
    # A ceiling to catch a leak, not a measurement — the same position Jellyfin
    # above and stacks/sensitive take. The number it is a ceiling OVER is
    # 3.4 MiB idle, so this is two orders of magnitude of headroom; a
    # node_exporter that reaches it has stopped being a node_exporter.
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      # The whole root, read-only. This is what node_filesystem_* reads, which
      # is how the estate learns `erebor` is filling — HostDiskCritical and
      # HostDiskWillFillIn24h in the observability stack are written against
      # those series and cover this host the day it answers, with nothing added.
      #
      # The trade is real and belongs here rather than in a commit message:
      # every path on this host that uid 65534 can read is readable from inside
      # this container. It earns that by being the only way the one host with no
      # logs (ADR-0016, #255) says anything about itself at all.
      #
      # rslave so datasets mounted after the container starts — which is every
      # dataset on erebor, on every boot — are visible without a restart.
      - /:/host:ro,rslave
      # The SMART textfile directory, read-only — see the command flag above.
      # A mount of its own rather than a path under /host, so the contract is
      # one host fact in .env like every other path this stack takes, and not
      # coupled to the whole-root mount's propagation. Root writes it (the
      # cron job, mode 0644 by the script); this container only reads it.
      # Docker would create a missing source as root 0755 — the same premise
      # Jellyfin's bind mount relies on — but build-the-nas.md §6.4 creates it
      # first so the first scrape after `up` has a file to serve.
      - ${SMART_TEXTFILE_PATH:?}:/textfile:ro
    # PUBLISHED, with a named off-host consumer as ADR-0012 asks: Prometheus at
    # 10.0.99.20, through the `99 → 40:9100` pass created and verified in
    # position on 2026-09-16 (build-the-nas.md §0.5). That pass is what makes
    # this the estate's first scraped host.
    #
    # The bind address does NOT make this private. Everything on CasaBonita —
    # the televisions, the game consoles — shares this broadcast domain and
    # reaches 9100 without the firewall seeing a packet, exactly as they reach
    # Jellyfin's 8096 above. node_exporter has no write API, so the residual is
    # disclosure of this host's shape; docs/security.md records it.
    ports:
      - "${NODE_EXPORTER_BIND_ADDR:?}:9100:9100"
    healthcheck:
      # `/` and not `/-/healthy`, which 404s here — see MEASURED (3). And not
      # `/metrics` either: that path runs every enabled collector, so polling it
      # every 30 seconds would spend real work proving a listener is up. `/` is
      # the landing page and answers 200 without collecting anything.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  media:
    driver: bridge
    ipam:
      config:
        # 172.28.<vlan>.0/24, the scheme stacks/sensitive uses on 172.28.99.0/24
        # — inside Docker's default private space, outside every subnet the
        # estate routes, and outside the 172.30.30.0/24 ADR-0017 keeps unrouted
        # on ifrit. A 172.28.40.x source in a firewall log means the same kind
        # of thing a 172.28.99.x one does.
        - subnet: 172.28.40.0/24

volumes:
  # ONE volume, and it is the one that is not backed up. Jellyfin's state and
  # Navidrome's are bind mounts above, on erebor/apps, so that they can be
  # snapshotted and pulled — see the mount comments and ADR-0045. Navidrome's
  # cache is a tmpfs, not a volume, for the reason its MEASURED (2) gives. What is declared here is
  # transcode scratch and regenerable image caches, and scripts/backup-volumes.sh
  # lists it as DISPOSABLE by name, for the reason stacks/sensitive gives for
  # immich-model-cache; `STACK=media backup-volumes.sh --inventory` therefore
  # reports nothing to archive, which is the true answer on this host.
  jellyfin-cache:
