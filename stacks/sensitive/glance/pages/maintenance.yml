# Maintenance: what needs doing, in one place — scheduled jobs
# and backups, open security issues, pending updates and reboots,
# certificates, and new upstream releases. All read-only: Prometheus, and
# GitHub's public API.
- name: Maintenance
  width: wide
  columns:
    # ---------------------------------------------------------------------
    - size: full
      widgets:
        # Every scheduled job the estate declares, judged the way the alert rules in
        # prometheus/rules/backup.rules.yaml judge it, so the panel and the alerts
        # agree:
        #
        # - The list is the DECLARATIONS (homelab_job_max_age_seconds, one per job
        #   per machine), not the outcomes, so a job with no success series is shown
        #   as "never run" and counted, as ScheduledJobNeverRan counts it, rather
        #   than vanishing from the list.
        # - A job is overdue when its last success is older than its declared limit
        #   (ScheduledJobStale), and flagged when its last run failed.
        # - verify-key-backup and verify-ca-key-backup are not read from the generic
        #   success time. One proof refreshes that for every key, so it can be green
        #   while one key rots. They are judged per age recipient
        #   (homelab_key_recipient_last_proof_timestamp_seconds) and per current CA
        #   key (homelab_ca_key_backup_last_proof_timestamp_seconds) against the same
        #   limit, as SecretsKeyBackupUnproven and CaKeyBackupUnproven do. A proof
        #   recorded as 0 reads "never proved".
        #
        # Everything is joined on `instance`, the machine label the rules join on.
        # Needing attention comes first; the rest follow.
        - type: custom-api
          title: Scheduled jobs
          cache: 5m
          <<: *prometheus
          parameters:
            query: homelab_job_max_age_seconds
          subrequests:
            success:
              <<: *prometheus
              parameters:
                query: time() - homelab_job_last_success_timestamp_seconds
            failed:
              <<: *prometheus
              parameters:
                query: homelab_job_last_exit_code != 0
            keys:
              <<: *prometheus
              parameters:
                query: time() - homelab_key_recipient_last_proof_timestamp_seconds
            ca:
              <<: *prometheus
              parameters:
                query: time() - homelab_ca_key_backup_last_proof_timestamp_seconds
          template: |
            {{ $decl := sortByString "metric.homelab_job" "asc" (.JSON.Array "data.result") }}
            {{ $success := (.Subrequest "success").JSON.Array "data.result" }}
            {{ $failed := (.Subrequest "failed").JSON.Array "data.result" }}
            {{ $keys := (.Subrequest "keys").JSON.Array "data.result" }}
            {{ $ca := (.Subrequest "ca").JSON.Array "data.result" }}
            {{ if or (ne .Response.StatusCode 200) (eq (len $decl) 0) }}
              <p class="color-negative">No data: Prometheus returned no job declarations.</p>
            {{ else }}
              {{/* Pass 0 counts, pass 1 lists what needs attention, pass 2 the rest.
                   Ages come from Prometheus (time() - …), so nothing here reads a
                   clock; a proof recorded as 0 is an age of decades: "never proved". */}}
              {{ $bad := 0 }}{{ $all := 0 }}
              {{ range $pass := 3 }}
                {{ if eq $pass 1 }}
                  <p class="margin-bottom-10">
                    {{ if gt $bad 0 }}<span class="color-negative">{{ $bad }} of {{ $all }} need attention</span>
                    {{ else }}<span class="color-positive">All {{ $all }} on schedule</span>{{ end }}
                  </p>
                  <ul class="list list-gap-10 collapsible-container" data-collapse-after="10">
                {{ end }}
                {{ range $decl }}
                  {{ $j := .String "metric.homelab_job" }}{{ $i := .String "metric.instance" }}
                  {{ $limit := .Float "value.1" }}
                  {{ if or (eq $j "verify-key-backup") (eq $j "verify-ca-key-backup") }}
                    {{ $proofs := $keys }}{{ $label := "recipient" }}
                    {{ if eq $j "verify-ca-key-backup" }}{{ $proofs = $ca }}{{ $label = "ca" }}{{ end }}
                    {{ range $proofs }}
                      {{ if eq (.String "metric.instance") $i }}
                        {{ $age := .Float "value.1" }}{{ $never := gt $age 1e9 }}
                        {{ $isBad := or $never (gt $age $limit) }}
                        {{ if eq $pass 0 }}
                          {{ $all = add $all 1 }}{{ if $isBad }}{{ $bad = add $bad 1 }}{{ end }}
                        {{ else if eq $isBad (eq $pass 1) }}
                          <li class="flex justify-between">
                            <span class="{{ if $isBad }}color-negative{{ else }}color-highlight{{ end }}">
                              {{ $j }}
                              <span class="size-h6">
                                {{ printf "%.14s" (.String (concat "metric." $label)) }}… on {{ $i }}
                              </span>
                            </span>
                            <span class="size-h6">
                              {{ if $never }}never proved
                              {{ else }}{{ printf "%.0fd ago" (div $age 86400) }}
                                {{ if $isBad }} · overdue{{ end }}
                              {{ end }}
                            </span>
                          </li>
                        {{ end }}
                      {{ end }}
                    {{ end }}
                  {{ else }}
                    {{ $age := -1.0 }}{{ $isFailed := false }}
                    {{ range $success }}
                      {{ if and (eq (.String "metric.homelab_job") $j) (eq (.String "metric.instance") $i) }}
                        {{ $age = .Float "value.1" }}
                      {{ end }}
                    {{ end }}
                    {{ range $failed }}
                      {{ if and (eq (.String "metric.homelab_job") $j) (eq (.String "metric.instance") $i) }}
                        {{ $isFailed = true }}
                      {{ end }}
                    {{ end }}
                    {{ $never := lt $age 0.0 }}
                    {{ $isBad := or $never $isFailed (gt $age $limit) }}
                    {{ if eq $pass 0 }}
                      {{ $all = add $all 1 }}{{ if $isBad }}{{ $bad = add $bad 1 }}{{ end }}
                    {{ else if eq $isBad (eq $pass 1) }}
                      {{ $hours := div $age 3600 }}
                      <li class="flex justify-between">
                        <span class="{{ if $isBad }}color-negative{{ else }}color-highlight{{ end }}">
                          {{ $j }} <span class="size-h6">on {{ $i }}</span>
                        </span>
                        <span class="size-h6">
                          {{ if $never }}never run
                          {{ else }}
                            {{ if gt $hours 48.0 }}{{ printf "%.0fd" (div $hours 24) }}
                            {{ else }}{{ printf "%.1fh" $hours }}{{ end }} ago
                            {{ if $isFailed }}· last run failed{{ else if gt $age $limit }}· overdue{{ end }}
                          {{ end }}
                        </span>
                      </li>
                    {{ end }}
                  {{ end }}
                {{ end }}
              {{ end }}
              </ul>
            {{ end }}

        # Open issues labelled `security` in this repository: the weekly CVE scan's
        # one-per-image issues (cve-scan.yml) and the findings filed by hand. The
        # repository is public, so GitHub's search API answers without a key, and
        # this asks once an hour.
        - type: custom-api
          title: Security issues
          title-url: https://github.com/Gerrrt/HomeLab/issues?q=is%3Aissue+is%3Aopen+label%3Asecurity
          cache: 1h
          url: https://api.github.com/search/issues?q=repo:Gerrrt/HomeLab+label:security+state:open+is:issue&sort=updated&per_page=12
          headers:
            Accept: application/vnd.github+json
          template: |
            {{ if ne .Response.StatusCode 200 }}
              <p class="color-negative">GitHub answered {{ .Response.StatusCode }}</p>
            {{ else }}
              <p class="margin-bottom-10">
                <span class="{{ if gt (.JSON.Int "total_count") 0 }}color-negative{{ else }}color-positive{{ end }}">
                  {{ .JSON.Int "total_count" }} open</span>, most recently updated first
              </p>
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="6">
              {{ range .JSON.Array "items" }}
                <li>
                  <a class="color-highlight" href="{{ .String "html_url" }}" target="_blank" rel="noreferrer">
                    #{{ .Int "number" }} {{ .String "title" }}</a>
                  <div class="size-h6" {{ .String "updated_at" | parseRelativeTime "rfc3339" }}></div>
                </li>
              {{ end }}
              </ul>
            {{ end }}

    # ---------------------------------------------------------------------
    - size: small
      widgets:
        # Pending upgrades and reboots, from the patch-state collector. Only the
        # hosts that run it report; a host missing here is not up to date, it is
        # unmeasured.
        - type: custom-api
          title: Updates
          cache: 15m
          <<: *prometheus
          parameters:
            query: homelab_apt_upgrades_pending
          subrequests:
            security:
              <<: *prometheus
              parameters:
                query: homelab_apt_security_upgrades_pending
            reboot:
              <<: *prometheus
              parameters:
                query: homelab_reboot_required
          template: |
            {{ $sec := (.Subrequest "security").JSON.Array "data.result" }}
            {{ $rb := (.Subrequest "reboot").JSON.Array "data.result" }}
            {{ $hosts := sortByString "metric.host" "asc" (.JSON.Array "data.result") }}
            {{ if eq (len $hosts) 0 }}
              <p class="color-negative">No data: no host reports its packages.</p>
            {{ else }}
              <ul class="list list-gap-10">
              {{ range $hosts }}
                {{ $h := .String "metric.host" }}{{ $n := .Int "value.1" }}{{ $s := 0 }}{{ $r := 0 }}
                {{ range $sec }}{{ if eq (.String "metric.host") $h }}{{ $s = .Int "value.1" }}{{ end }}{{ end }}
                {{ range $rb }}{{ if eq (.String "metric.host") $h }}{{ $r = .Int "value.1" }}{{ end }}{{ end }}
                <li class="flex justify-between">
                  <span class="color-highlight">{{ $h }}</span>
                  <span class="size-h6">
                    <span class="{{ if gt $s 0 }}color-negative{{ end }}">{{ $n }} pending, {{ $s }} security</span>
                    {{ if gt $r 0 }}· <span class="color-negative">reboot</span>{{ end }}
                  </span>
                </li>
              {{ end }}
              </ul>
            {{ end }}

        # Certificates by days left. The tier's step-ca leaves renew themselves
        # every few days (renewal="acme"), so they are summarised: what matters is
        # that none is close to running out. The rest are renewed by hand and are
        # listed: the blackbox probes' view, and the management consoles'
        # collector (homelab_cert_expiry_timestamp_seconds).
        - type: custom-api
          title: Certificates
          cache: 15m
          <<: *prometheus
          parameters:
            query: min by (name, renewal) (probe_ssl_earliest_cert_expiry) - time()
          subrequests:
            consoles:
              <<: *prometheus
              parameters:
                query: homelab_cert_expiry_timestamp_seconds - time()
          template: |
            {{ $all := sortByFloat "value.1" "asc" (.JSON.Array "data.result") }}
            {{ $auto := 0 }}{{ $soonest := 0.0 }}{{ $first := true }}
            {{ range $all }}
              {{ if eq (.String "metric.renewal") "acme" }}
                {{ $auto = add $auto 1 }}
                {{ if $first }}{{ $soonest = div (.Float "value.1") 86400 }}{{ $first = false }}{{ end }}
              {{ end }}
            {{ end }}
            {{ if gt $auto 0 }}
              <p class="margin-bottom-10">
                <span class="{{ if lt $soonest 1.0 }}color-negative{{ else }}color-positive{{ end }}">
                  {{ $auto }} auto-renewing</span>,
                soonest in {{ printf "%.1f" $soonest }} days
              </p>
            {{ end }}
            <ul class="list list-gap-10">
            {{ range $all }}
              {{ if ne (.String "metric.renewal") "acme" }}
                {{ $d := div (.Float "value.1") 86400 }}
                <li class="flex justify-between">
                  <span>{{ .String "metric.name" }}</span>
                  <span class="size-h6 {{ if lt $d 30.0 }}color-negative{{ end }}">{{ printf "%.0f" $d }} days</span>
                </li>
              {{ end }}
            {{ end }}
            {{ range (.Subrequest "consoles").JSON.Array "data.result" }}
              {{ $d := div (.Float "value.1") 86400 }}
              <li class="flex justify-between">
                <span>{{ .String "metric.endpoint" }}</span>
                <span class="size-h6 {{ if lt $d 30.0 }}color-negative{{ end }}">{{ printf "%.0f" $d }} days</span>
              </li>
            {{ end }}
            </ul>

        # New releases of the software this estate pins. Dependabot opens the
        # PR; this is the heads-up. Unauthenticated GitHub API, once per six
        # hours per repository.
        - type: releases
          cache: 6h
          show-source-icon: false
          collapse-after: 6
          repositories:
            - home-assistant/core
            - immich-app/immich
            - paperless-ngx/paperless-ngx
            - dani-garcia/vaultwarden
            - jellyfin/jellyfin
            - miniflux/v2
            - glanceapp/glance
            - caddyserver/caddy
            - prometheus/prometheus
            - grafana/grafana
            - grafana/loki
