# Sports & Markets. The tickers are GLANCE_MARKETS, shown here in full with
# their charts. The teams the operator follows are GLANCE_TEAMS and come
# first, then the tables they sit in; under them, the league scoreboards, one
# widget per league sharing the first one's template. The sports are ESPN's
# public API, no key. Logos are left out: they would be the browser fetching
# from ESPN's CDN. The TSP fund is not on Yahoo, so it is its own widget, read
# from a Google Sheet.
- name: Sports & Markets
  slug: sports
  width: wide
  columns:
    # ---------------------------------------------------------------------
    - size: full
      widgets:
        # One line per followed team: its record, the last result and the
        # next game, or the score while one is on. GLANCE_TEAMS lists them as
        # {"name","path","id"}, where path is ESPN's sport/league and id its
        # team id or abbreviation (secrets/sensitive.example.yaml has the
        # shape). A soccer team's path is soccer/all, which spans every
        # competition, and ESPN gives its results and its fixtures as two
        # schedules, so it asks twice; every other team's one schedule holds
        # the whole season. Kickoff is UTC here: the page head's script
        # writes it in the browser's own time zone.
        - type: custom-api
          title: My teams
          cache: 5m
          options:
            teams: ${GLANCE_TEAMS}
          template: |
            {{ $base := "https://site.api.espn.com/apis/site/v2/sports/" }}
            <ul class="list list-gap-14 collapsible-container" data-collapse-after="12">
            {{ range index .Options "teams" }}
              {{ $url := concat $base .path "/teams/" .id "/schedule" }}
              {{ $s := newRequest $url | getResponse }}
              {{ $f := $s }}
              {{ if findMatch "^soccer/" .path }}
                {{ $f = newRequest (concat $url "?fixture=true") | getResponse }}
              {{ end }}
              {{ $tid := $s.JSON.String "team.id" }}
              {{ $last := "" }}{{ $next := "" }}
              {{ range $s.JSON.Array "events" }}
                {{ if eq (.String "competitions.0.status.type.state") "post" }}
                  {{ if or (not $last) (gt (.String "date") ($last.String "date")) }}{{ $last = . }}{{ end }}
                {{ end }}
              {{ end }}
              {{ range $f.JSON.Array "events" }}
                {{ $st := .String "competitions.0.status.type.state" }}
                {{ if eq $st "in" }}
                  {{ $next = . }}
                {{ else if eq $st "pre" }}
                  {{ if not $next }}{{ $next = . }}
                  {{ else if and (ne ($next.String "competitions.0.status.type.state") "in")
                                 (lt (.String "date") ($next.String "date")) }}{{ $next = . }}{{ end }}
                {{ end }}
              {{ end }}
              <li>
                <div class="flex justify-between items-baseline">
                  <span class="size-h4 color-highlight">{{ .name }}</span>
                  <span class="size-h6">{{ $s.JSON.String "team.recordSummary" }}</span>
                </div>
                {{ if ne $s.Response.StatusCode 200 }}
                  <p class="size-h6 color-negative">ESPN answered {{ $s.Response.StatusCode }}</p>
                {{ else }}
                <ul class="list-horizontal-text size-h6">
                  {{ if $last }}
                    {{ $me := "" }}{{ $them := "" }}
                    {{ range $last.Array "competitions.0.competitors" }}
                      {{ if eq (.String "id") $tid }}{{ $me = . }}{{ else }}{{ $them = . }}{{ end }}
                    {{ end }}
                    {{ if and $me $them }}
                    <li>
                      {{ if $me.Bool "winner" }}<span class="color-positive">W</span>
                      {{ else if $them.Bool "winner" }}<span class="color-negative">L</span>
                      {{ else }}D{{ end }}
                      {{ $me.String "score.displayValue" }}–{{ $them.String "score.displayValue" }}
                      {{ if eq ($me.String "homeAway") "home" }}vs{{ else }}at{{ end }}
                      {{ $them.String "team.abbreviation" }}
                    </li>
                    {{ end }}
                  {{ end }}
                  {{ if $next }}
                    {{ $me := "" }}{{ $them := "" }}
                    {{ range $next.Array "competitions.0.competitors" }}
                      {{ if eq (.String "id") $tid }}{{ $me = . }}{{ else }}{{ $them = . }}{{ end }}
                    {{ end }}
                    {{ if and $me $them }}
                    <li>
                      {{ if eq ($next.String "competitions.0.status.type.state") "in" }}
                        <span class="color-primary">Live</span>
                        {{ $me.String "score.displayValue" }}–{{ $them.String "score.displayValue" }}
                        · {{ $next.String "competitions.0.status.type.shortDetail" }}
                      {{ else }}
                        Next {{ if eq ($me.String "homeAway") "home" }}vs{{ else }}at{{ end }}
                        {{ $them.String "team.abbreviation" }}
                        · <span data-kickoff="{{ $next.String "date" }}">{{ $next.String "date" }}</span>
                      {{ end }}
                    </li>
                    {{ end }}
                  {{ end }}
                  {{ if not (or $last $next) }}<li>No games scheduled</li>{{ end }}
                </ul>
                {{ end }}
              </li>
            {{ end }}
            </ul>

        # The table each followed team sits in, folded to one line until it is
        # opened. A team gets one only if its GLANCE_TEAMS entry names
        # "standings", ESPN's sport/league for the table; a club whose
        # schedule path is soccer/all names its league here (soccer/eng.1).
        # "level": 3 asks for divisions rather than conferences. The team is
        # found by id or abbreviation in the deepest group that holds it, and
        # rows are ordered by ESPN's rank (soccer) or playoff seed (the rest).
        - type: custom-api
          title: Standings
          cache: 1h
          options:
            teams: ${GLANCE_TEAMS}
          template: |
            {{ $base := "https://site.api.espn.com/apis/v2/sports/" }}
            {{ $any := false }}
            <ul class="list list-gap-10">
            {{ range $t := index .Options "teams" }}
            {{ if $t.standings }}
              {{ $any = true }}
              {{ $req := newRequest (concat $base $t.standings "/standings") }}
              {{ if $t.level }}{{ $req = $req | withParameter "level" (printf "%v" $t.level) }}{{ end }}
              {{ $r := $req | getResponse }}
              {{ $pat := concat "(?i)^(" $t.id ")$" }}
              {{ $g := "" }}{{ $mine := "" }}
              {{ range $r.JSON.Array "children" }}
                {{ $c := . }}
                {{ range .Array "standings.entries" }}
                  {{ if or (eq (.String "team.id") $t.id) (findMatch $pat (.String "team.abbreviation")) }}
                    {{ $g = $c }}{{ $mine = .String "team.id" }}{{ end }}
                {{ end }}
                {{ range .Array "children" }}
                  {{ $d := . }}
                  {{ range .Array "standings.entries" }}
                    {{ if or (eq (.String "team.id") $t.id) (findMatch $pat (.String "team.abbreviation")) }}
                      {{ $g = $d }}{{ $mine = .String "team.id" }}{{ end }}
                  {{ end }}
                {{ end }}
              {{ end }}
              <li>
              {{ if ne $r.Response.StatusCode 200 }}
                <span class="color-highlight">{{ $t.name }}</span>
                <span class="size-h6 color-negative">· ESPN answered {{ $r.Response.StatusCode }}</span>
              {{ else if not $g }}
                <span class="color-highlight">{{ $t.name }}</span>
                <span class="size-h6">· not in ESPN's table</span>
              {{ else }}
                {{ $soccer := $g.Exists `standings.entries.0.stats.#(name=="rank")` }}
                {{ $key := `stats.#(name=="playoffSeed").value` }}
                {{ if $soccer }}{{ $key = `stats.#(name=="rank").value` }}{{ end }}
                {{ $rows := sortByFloat $key "asc" ($g.Array "standings.entries") }}
                {{ $pos := 0 }}
                {{ range $i, $e := $rows }}{{ if eq ($e.String "team.id") $mine }}{{ $pos = add $i 1 }}{{ end }}{{ end }}
                <details>
                  <summary style="cursor: pointer;">
                    <span class="color-highlight">{{ $t.name }}</span>
                    <span class="size-h6">· {{ $pos }} of {{ len $rows }} in {{ $g.String "name" }}</span>
                  </summary>
                  <ul class="list list-gap-2 size-h6 margin-top-5">
                  {{ range $i, $e := $rows }}
                    <li class="flex justify-between {{ if eq ($e.String "team.id") $mine }}color-highlight{{ end }}">
                      <span>{{ add $i 1 }}. {{ $e.String "team.displayName" }}</span>
                      <span>{{ $e.String `stats.#(name=="overall").displayValue` }}
                      {{ if $soccer }}· {{ $e.String `stats.#(name=="points").displayValue` }} pts{{ end }}</span>
                    </li>
                  {{ end }}
                  </ul>
                </details>
              {{ end }}
              </li>
            {{ end }}
            {{ end }}
            </ul>
            {{ if not $any }}<p>No team in GLANCE_TEAMS names "standings".</p>{{ end }}

        - type: split-column
          max-columns: 2
          widgets:
            - &scoreboard
              type: custom-api
              title: NBA today
              cache: 2m
              url: https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard
              template: |
                {{ $events := .JSON.Array "events" }}
                {{ if eq (len $events) 0 }}
                  <p>No games today.</p>
                {{ else }}
                  <ul class="list list-gap-14 collapsible-container" data-collapse-after="6">
                  {{ range $events }}
                    {{ $state := .String "status.type.state" }}
                    {{ $comps := .Array "competitions.0.competitors" }}
                    {{ $home := index $comps 0 }}{{ $away := index $comps 0 }}
                    {{ range $comps }}
                      {{ if eq (.String "homeAway") "home" }}{{ $home = . }}{{ else }}{{ $away = . }}{{ end }}
                    {{ end }}
                    <li class="flex justify-between items-center">
                      <div>
                        <div class="size-h4 color-highlight">{{ $away.String "team.abbreviation" }}</div>
                        <div class="size-h6">{{ $away.String "records.0.summary" }}</div>
                      </div>
                      <div class="text-center">
                        {{ if ne $state "pre" }}
                          <span class="size-h3 {{ if and (eq $state "post")
                             (gt ($away.Int "score") ($home.Int "score")) }}
                          color-highlight{{ end }}">{{ $away.String "score" }}</span>
                          <span class="size-h6"> · {{ .String "status.type.shortDetail" }} · </span>
                          <span class="size-h3 {{ if and (eq $state "post")
                             (gt ($home.Int "score") ($away.Int "score")) }}
                          color-highlight{{ end }}">{{ $home.String "score" }}</span>
                        {{ else }}
                          <span class="size-h6">{{ .String "status.type.shortDetail" }}</span>
                        {{ end }}
                      </div>
                      <div class="text-right">
                        <div class="size-h4 color-highlight">{{ $home.String "team.abbreviation" }}</div>
                        <div class="size-h6">{{ $home.String "records.0.summary" }}</div>
                      </div>
                    </li>
                  {{ end }}
                  </ul>
                {{ end }}
            - <<: *scoreboard
              title: NFL
              url: https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard

            - <<: *scoreboard
              title: MLB
              url: https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard

            - <<: *scoreboard
              title: NHL
              url: https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard
    # ---------------------------------------------------------------------
    - size: small
      widgets:
        - type: markets
          cache: 15m
          markets: ${GLANCE_MARKETS}

        # TSP L 2060: Yahoo has no TSP fund, and the TSP's own price download
        # refuses a script (403, 2026-11-25). The operator's sheet already
        # imports a year of daily prices from TSP Talk; a second sheet, shared
        # by link and holding only the date and this fund's price, is read
        # through the Sheets API with a key that can read nothing else. Both
        # are in SOPS: secrets/sensitive.example.yaml has the steps. Rows come
        # newest first. The sparkline is drawn here as inline SVG, so the
        # browser fetches nothing for it. TSP prices once a day: 6h is plenty.
        - type: custom-api
          title: TSP L 2060
          cache: 6h
          url: https://sheets.googleapis.com/v4/spreadsheets/${GLANCE_TSP_SHEET_ID}/values/A1:B400
          headers:
            X-Goog-Api-Key: ${GLANCE_GOOGLE_API_KEY}
          parameters:
            valueRenderOption: UNFORMATTED_VALUE
            dateTimeRenderOption: FORMATTED_STRING
          template: |
            {{ $rows := .JSON.Array "values" }}
            {{ $n := len $rows }}
            {{ if or (ne .Response.StatusCode 200) (lt $n 2) }}
              <p class="color-negative">No prices: the sheet answered {{ .Response.StatusCode }} with {{ $n }} rows.</p>
            {{ else }}
              {{ $p := (index $rows 0).Float "1" }}
              {{ $q := (index $rows 1).Float "1" }}
              {{ $y0 := (index $rows (sub $n 1)).Float "1" }}
              {{ $min := $p }}{{ $max := $p }}
              {{ range $rows }}
                {{ $v := .Float "1" }}
                {{ if lt $v $min }}{{ $min = $v }}{{ end }}
                {{ if gt $v $max }}{{ $max = $v }}{{ end }}
              {{ end }}
              {{ $span := sub $max $min }}{{ if le $span 0.0 }}{{ $span = 1.0 }}{{ end }}
              {{ $step := div 300.0 (toFloat (sub $n 1)) }}
              {{ $pts := "" }}
              {{ range $i, $r := $rows }}
                {{ $x := sub 300.0 (mul (toFloat $i) $step) }}
                {{ $y := sub 58.0 (mul (div (sub ($r.Float "1") $min) $span) 56.0) }}
                {{ $pts = printf "%s %.1f,%.1f" $pts $x $y }}
              {{ end }}
              {{ $day := mul (div (sub $p $q) $q) 100.0 }}
              {{ $year := mul (div (sub $p $y0) $y0) 100.0 }}
              <div class="flex justify-between items-end">
                <div>
                  <div class="size-h3 color-highlight">{{ printf "$%.4f" $p }}</div>
                  <div class="size-h6">{{ (index $rows 0).String "0" }}</div>
                </div>
                <div class="text-right size-h6">
                  <div class="{{ if lt $day 0.0 }}color-negative{{ else }}color-positive{{ end }}">
                    {{ printf "%+.2f" $day }}% day</div>
                  <div class="{{ if lt $year 0.0 }}color-negative{{ else }}color-positive{{ end }}">
                    {{ printf "%+.2f" $year }}% over {{ $n }} days</div>
                </div>
              </div>
              <svg viewBox="0 0 300 60" preserveAspectRatio="none" class="margin-top-10"
                   style="width: 100%; height: 60px;">
                <polyline fill="none" stroke="var(--color-primary)" stroke-width="1.5"
                          vector-effect="non-scaling-stroke" points="{{ $pts }}"/>
              </svg>
            {{ end }}
