---
# Glance — the operator's browser start page (ADR-0098). Mounted read-only,
# so an edit here is live at the next `make up STACK=sensitive`, which
# recreates the container when the mounted bytes differ (#355). `git log` on
# this directory is the history of what the page shows.
#
# https://github.com/glanceapp/glance/blob/main/docs/configuration.md
#
# Seven pages, one file each under pages/ (ADR-0100): Home, the
# start page; Read; Watch; Sports & Markets; Homelab; Network & Storage; and
# Maintenance. This file holds what they share: the server, the theme and the
# widget anchors they merge in.
#
# WHAT IS NOT IN THESE FILES, ON PURPOSE. This repository is public, and the
# operator's own lists — tickers, bookmarks, YouTube channels, subreddits —
# say more about a person than about a homelab. They are one-line JSON values
# in secrets/sensitive.sops.yaml (GLANCE_MARKETS, GLANCE_BOOKMARKS,
# GLANCE_VIDEO_TABS, GLANCE_REDDIT_TABS), and Glance substitutes them as
# ${…}. Followed feeds live in Miniflux under its user `glance`. The stack
# README says how to edit both.
#
# Every fetch is SERVER-SIDE, from trinity over Winterfell's existing *Allow
# internet* egress (docs/network.md), except two the browser makes: the
# search box, which sends a query only on Enter, and YouTube thumbnails from
# i.ytimg.com (ADR-0100). Icons are served from glance/assets.

server:
  host: 0.0.0.0
  port: 8080
  # Behind Caddy, which sets X-Forwarded-*.
  proxied: true
  # The vendored icons (assets/icons/NOTICE), served at /assets/.
  assets-path: /app/config/assets

document:
  # Glance fetches each widget's content ONCE, when the page loads; `cache` on
  # a widget only says how old an answer may be when that load asks for it.
  # So a tab left open would keep the status it opened with. This reloads the
  # page once it is five minutes old, but only while the tab is visible and
  # nothing is being typed into, and at once when a stale tab is shown again.
  # Inline, so the browser still fetches nothing but this page.
  head: |
    <meta name="robots" content="noindex, nofollow">
    <script>
      (() => {
        const maxAge = 5 * 60 * 1000;
        const loadedAt = Date.now();
        const reloadIfStale = () => {
          if (document.hidden || Date.now() - loadedAt < maxAge) return;
          const focused = document.activeElement;
          if (focused && focused.matches("input, textarea")) return;
          location.reload();
        };
        document.addEventListener("visibilitychange", reloadIfStale);
        setInterval(reloadIfStale, 30 * 1000);
      })();
    </script>

branding:
  hide-footer: true

# Tokyo Night (night), as homepage/custom.css. Glance takes HSL; these are
# the same bg, blue, green and red converted.
theme:
  background-color: 235 19 13
  primary-color: 221 89 72
  positive-color: 89 51 61
  negative-color: 349 89 72
  contrast-multiplier: 1.1
  disable-picker: true

# Reusable widget definitions. `x-widgets` is not a Glance property; it only
# holds the YAML anchors the pages below merge in, the way compose.yaml uses
# x-service-defaults.
x-widgets:
  # The Prometheus reader proxy on `prometheus` (ADR-0067, ADR-0086). The
  # reader token can query and nothing else; it is the one Homepage and Home
  # Assistant already send. TLS is verified against the estate CA through
  # SSL_CERT_DIR (compose.yaml).
  - &prometheus
    url: https://10.0.99.20:9090/api/v1/query
    headers:
      Authorization: Bearer ${GLANCE_PROMETHEUS_TOKEN}

  # Miniflux, through the Fever API of its user `glance` — not the REST API,
  # which ADR-0057 keeps off because it takes the admin's password. Fever is
  # per user and its key is that user's alone; ADR-0057 pre-authorises one on
  # its three conditions, and the stack README records this one. The key goes
  # in the POST body, never the query string, so it is not in Caddy's access
  # log. A wrong key is not an HTTP error: Fever answers 200 with `auth: 0`.
  - &fever
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
    body-type: string
    body: api_key=${GLANCE_MINIFLUX_FEVER_KEY}

  # Per-host load from node_exporter, as Prometheus holds it: CPU, memory,
  # root filesystem, uptime and running containers. Memory leaves out ZFS's
  # ARC where there is one: on smaug it is cache that ZFS gives back under
  # pressure, and counting it showed the NAS at 90%. Keyed by `instance`,
  # which is the host's name for every pushed agent and for smaug. A host
  # that stops reporting drops off the list; the Estate panel's alerts are
  # what say so.
  - &hosts
    type: custom-api
    cache: 1m
    url: https://10.0.99.20:9090/api/v1/query
    headers:
      Authorization: Bearer ${GLANCE_PROMETHEUS_TOKEN}
    parameters:
      query: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))
    subrequests:
      mem:
        url: https://10.0.99.20:9090/api/v1/query
        headers:
          Authorization: Bearer ${GLANCE_PROMETHEUS_TOKEN}
        parameters:
          query: >-
            100 * (
              sum by (instance) (node_memory_MemTotal_bytes)
              - sum by (instance) (node_memory_MemAvailable_bytes)
              - (sum by (instance) (node_zfs_arc_size) or 0 * sum by (instance) (node_memory_MemTotal_bytes))
            ) / sum by (instance) (node_memory_MemTotal_bytes)
      disk:
        url: https://10.0.99.20:9090/api/v1/query
        headers:
          Authorization: Bearer ${GLANCE_PROMETHEUS_TOKEN}
        parameters:
          query: >-
            100 * (1 - sum by (instance) (node_filesystem_avail_bytes{mountpoint="/"})
            / sum by (instance) (node_filesystem_size_bytes{mountpoint="/"}))
      uptime:
        url: https://10.0.99.20:9090/api/v1/query
        headers:
          Authorization: Bearer ${GLANCE_PROMETHEUS_TOKEN}
        parameters:
          query: time() - max by (instance) (node_boot_time_seconds)
      containers:
        url: https://10.0.99.20:9090/api/v1/query
        headers:
          Authorization: Bearer ${GLANCE_PROMETHEUS_TOKEN}
        parameters:
          query: >-
            count by (instance) (time() - container_last_seen{name!=""} < 120)
            or sum by (instance) (homelab_container_running)
    template: |
      {{ $mem := (.Subrequest "mem").JSON.Array "data.result" }}
      {{ $disk := (.Subrequest "disk").JSON.Array "data.result" }}
      {{ $upt := (.Subrequest "uptime").JSON.Array "data.result" }}
      {{ $ctr := (.Subrequest "containers").JSON.Array "data.result" }}
      {{ $hosts := sortByString "metric.instance" "asc" (.JSON.Array "data.result") }}
      {{ if eq (len $hosts) 0 }}
        <p class="color-negative">No data: Prometheus returned no hosts.</p>
      {{ else }}
        <ul class="list list-gap-14">
        {{ range $hosts }}
          {{ $h := .String "metric.instance" }}
          {{ $cpu := .Float "value.1" }}{{ $m := 0.0 }}{{ $d := 0.0 }}{{ $days := 0.0 }}{{ $c := "–" }}
          {{ range $mem }}{{ if eq (.String "metric.instance") $h }}{{ $m = .Float "value.1" }}{{ end }}{{ end }}
          {{ range $disk }}{{ if eq (.String "metric.instance") $h }}{{ $d = .Float "value.1" }}{{ end }}{{ end }}
          {{ range $upt }}{{ if eq (.String "metric.instance") $h }}{{ $days = div (.Float "value.1") 86400 }}{{ end }}
          {{ end }}
          {{ range $ctr }}{{ if eq (.String "metric.instance") $h }}{{ $c = .String "value.1" }}{{ end }}{{ end }}
          <li>
            <div class="flex justify-between">
              <span class="color-highlight">{{ $h }}</span>
              <span class="size-h6">{{ printf "%.0f" $days }}d up · {{ $c }} containers</span>
            </div>
            <div class="flex justify-between gap-10 size-h6 margin-top-5">
              <div style="flex: 1;">CPU {{ printf "%.0f" $cpu }}%
                <div style="height: 4px; background: var(--color-widget-background-highlight);">
                <div style="height: 4px; width: {{ printf "%.0f" $cpu }}%;
                background: {{ if gt $cpu 85.0 }}var(--color-negative){{ else }}var(--color-primary){{ end }};">
                </div></div>
              </div>
              <div style="flex: 1;">RAM {{ printf "%.0f" $m }}%
                <div style="height: 4px; background: var(--color-widget-background-highlight);">
                <div style="height: 4px; width: {{ printf "%.0f" $m }}%;
                background: {{ if gt $m 90.0 }}var(--color-negative){{ else }}var(--color-primary){{ end }};">
                </div></div>
              </div>
              <div style="flex: 1;">DISK {{ printf "%.0f" $d }}%
                <div style="height: 4px; background: var(--color-widget-background-highlight);">
                <div style="height: 4px; width: {{ printf "%.0f" $d }}%;
                background: {{ if gt $d 85.0 }}var(--color-negative){{ else }}var(--color-primary){{ end }};">
                </div></div>
              </div>
            </div>
          </li>
        {{ end }}
        </ul>
      {{ end }}

# Each page file is a one-item list: $include replaces its whole line, the
# list marker included, so the marker lives in the included file.
# Glance reads the rest of an $include line as the path, so the yamllint
# exception for the repeated key cannot be an inline comment.
pages:
  # yamllint disable rule:key-duplicates
  $include: pages/home.yml
  $include: pages/read.yml
  $include: pages/watch.yml
  $include: pages/sports.yml
  $include: pages/homelab.yml
  $include: pages/network.yml
  $include: pages/maintenance.yml
  # yamllint enable rule:key-duplicates
