---
# The sensitive tier: ADR-0008's household services, behind one reverse proxy.
#
# Deployed on: trinity (10.0.99.40, VLAN 99 / Winterfell) — the ProDesk 600 G4
#              of ADR-0034, after the firewall restore has been rehearsed on it.
#              NOT BUILT YET. #404 is the build; this file is what it deploys.
#              Authored before the host exists, as stacks/lab was: #264 landed
#              the stack a day before #262 built the guest it runs on.
# Deploy with:  make up STACK=sensitive      (from the repository root)
#
# ---------------------------------------------------------------------------
# What is here, and what is not
# ---------------------------------------------------------------------------
# Five services, two of them the foundation. Caddy (#129) is the only thing on
# the tier that publishes a port, and the whole containment argument in
# ADR-0008 — "containers sit on private bridge networks with only the reverse
# proxy publishing a port" — is a property of this file or it is a sentence in
# an ADR. step-ca (#130) issues the certificates behind it. Paperless-ngx
# (#133) is the first household service behind them, with the Postgres and
# Valkey it needs; Vaultwarden, Immich, Home Assistant, AdGuard Home, ntfy and
# Homepage (#131, #132, #134–#137) land the same way, each with `expose:` and
# no `ports:`.
#
# ---------------------------------------------------------------------------
# On the comments in this file
# ---------------------------------------------------------------------------
# The settings shared with `stacks/observability/compose.yaml` — why `init:
# true`, why `pids_limit`, the healthcheck shape, the `${VAR:?}` guards that
# double as the SOPS required-key list — are argued at length there and are
# NOT repeated here; two copies of an argument drift the same way two copies
# of a config do. What IS written out here is every place this stack differs
# from that one, because those are the only lines a reader cannot get from
# the sibling file. There are six such places, each marked DIFFERENCE.

name: sensitive

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [sensitive]
  init: true
  pids_limit: 512

services:
  # ---------------------------------------------------------------------------
  # Caddy — the one published port (#129)
  # ---------------------------------------------------------------------------
  # DIFFERENCE 1: memory limits from day one, where stacks/lab set none. #129
  # is explicit — "#114 is blocked on data for the existing six services; a
  # brand-new stack has no such excuse" — and the lab's argument, that copying
  # the estate's numbers would be a limit derived from a machine this one is
  # not, does not apply to a proxy whose working set is measured in tens of
  # megabytes on any machine. 128m is roughly ten times what Caddy holds
  # serving a handful of upstreams; it exists to bound a leak, not to size.
  #
  # DIFFERENCE 2: this container runs as root, with every capability dropped
  # but one. Every other service in the estate runs as a numeric non-root
  # user, and the reason this one does not is measured, not assumed: in the
  # pinned image `/data` and `/config` are owned by root, mode 755, and a named
  # volume mounted there inherits that ownership on first use — so a non-root
  # Caddy cannot write its own certificate store. The alternatives are an init
  # step that chowns the volume (a hand-run command nothing converges) or a
  # sidecar to do it (a third container for a permissions bit). Root with
  # `cap_drop: [ALL]` and `no-new-privileges` can bind 443, write the two
  # directories it owns, and nothing else it could not do as uid 65534 —
  # DAC applies to root once CAP_DAC_OVERRIDE is gone. NET_BIND_SERVICE is the
  # one capability kept, because 443 inside the container is what lets the
  # Caddyfile say `https://` without a port and the published mapping stay
  # 443:443. Verify the premise, not the argument, when the image moves:
  #
  #   docker run --rm --entrypoint stat <caddy image> -c '%u:%g %a' /data
  #
  # If that ever prints something other than 0:0 755, revisit the user line.
  #
  # `admin off` in the Caddyfile means no admin API on 2019 and no `caddy
  # reload`; a Caddyfile change is `make up STACK=sensitive`, which recreates
  # the container. On a tier with a handful of upstreams that is the honest
  # cost of not running an unauthenticated control socket, and the socket
  # would have been reachable by every other container on this network.
  caddy:
    <<: *service-defaults
    image: caddy:2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    container_name: sensitive-caddy
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # The leaf comes from scripts/gen-certs.sh until step-ca issues it
      # (#129: "initially, replaced by step-ca issuance once that lands"):
      #   make certs ARGS="--host trinity.matrix.elysium --ip 10.0.99.40 --dns trinity"
      # Issued on the monitoring host, where the CA key lives and stays; the
      # three files travel the way the lab's did (build-the-lab-guest.md §5).
      # render-config.sh refuses to render while any of these is missing, so
      # `make up` cannot start a Caddy that would fail its first TLS handshake.
      - ../../certificates/trinity.matrix.elysium.pem:/etc/caddy/tls/cert.pem:ro
      - ../../certificates/trinity.matrix.elysium-key.pem:/etc/caddy/tls/key.pem:ro
      - ../../certificates/ca.pem:/etc/caddy/tls/ca.pem:ro
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    depends_on:
      step-ca:
        condition: service_healthy
    healthcheck:
      # busybox wget in this image speaks HTTPS (checked against a real
      # endpoint before this was written); the certificate is for trinity,
      # not localhost, hence --no-check-certificate on the container's own
      # loopback — the same shape as Grafana's check in the estate's stack.
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://localhost:443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # step-ca — the tier's certificate authority (#130)
  # ---------------------------------------------------------------------------
  # An INTERMEDIATE beneath the lab CA, not a new root — decided on #130 and
  # recorded here: everything that already trusts certificates/ca.pem keeps
  # trusting what this issues, nothing is re-pointed, and the root key never
  # leaves the monitoring host. The intermediate is minted there:
  #
  #   step ca init --root certificates/ca.pem --key certificates/ca-key.pem ...
  #
  # and the resulting tree (config/, certs/, secrets/, db/) is what populates
  # the step-ca-data volume on trinity — the procedure is #404's runbook. The
  # image's entrypoint refuses to start without config/ca.json and would
  # otherwise mint a fresh root of its own on first boot; a populated volume
  # is what stops that, and DOCKER_STEPCA_INIT_* is deliberately never set.
  #
  # DIFFERENCE 3: the key password comes from SOPS by way of the environment
  # and a tmpfs file. step-ca wants a --password-file; the estate's rule is
  # that a credential lives in secrets/*.sops.yaml and nowhere else. The
  # entrypoint below writes ${STEPCA_PASSWORD} to a 0600 file on a 1 MiB
  # private tmpfs and execs step-ca against it — the same class of exposure
  # as GRAFANA_ADMIN_PASSWORD in the sibling stack (`docker inspect` can read
  # the environment of either), and nothing on disk. `$$` is compose's
  # escape: the container sees `${STEPCA_PASSWORD}`, not this file's value.
  #
  # Nothing publishes 9000. Caddy reaches it on this network for ACME once
  # #130's provisioner is configured; a browser never needs it.
  step-ca:
    <<: *service-defaults
    image: smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    container_name: sensitive-step-ca
    mem_limit: 256m
    memswap_limit: 256m
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run/step:size=1m,uid=1000,gid=1000,mode=0700
      - /tmp:size=16m
    environment:
      STEPCA_PASSWORD: ${STEPCA_PASSWORD:?set in secrets/sensitive.sops.yaml}
    command:
      - /bin/bash
      - -c
      - >-
        umask 077 && printf '%s' "$${STEPCA_PASSWORD}" > /run/step/password
        && exec step-ca --password-file /run/step/password /home/step/config/ca.json
    volumes:
      - step-ca-data:/home/step
    expose:
      - "9000"
    healthcheck:
      # `step ca health` is the CA asking itself, over TLS, against its own
      # root — which is the lab CA's root once the tree is populated. The
      # `step` binary ships in the image; check_compose_health.py --probe
      # proves that on every run rather than trusting this comment.
      test:
        - CMD
        - step
        - ca
        - health
        - --ca-url
        - https://localhost:9000
        - --root
        - /home/step/certs/root_ca.crt
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Paperless-ngx — the document archive (#133)
  # ---------------------------------------------------------------------------
  # Tax returns, insurance, medical records, passports and payslips: on this
  # tier by content rather than by size, and the service ADR-0023 classes as
  # DURABLE — an OCR index can be rebuilt from the originals, and the originals
  # cannot be rebuilt from anything. Three containers: the application, a
  # Postgres of its own and a Valkey broker. Not shared with Immich's (#132),
  # which needs the vector extension and therefore a different image — and one
  # database per service is what lets backup-volumes.sh attribute every volume
  # to the one service that owns it, and stop only that.
  #
  # Reached as https://paperless.matrix.elysium through Caddy, on the existing
  # 50→99 pass for 443 and no new rule. Two things outside this file have to be
  # true first, and both belong to #404's build rather than to this file: the
  # name needs a host override on morpheus (ADR-0010 counts six; this is a
  # seventh, to 10.0.99.40), and until step-ca's ACME provisioner issues a
  # leaf per service, the hand-issued one needs the name as a SAN:
  #
  #   make certs ARGS="--host trinity.matrix.elysium --ip 10.0.99.40 --dns trinity --dns paperless.matrix.elysium"
  #
  # ROOTLESS, as the operator. The image is s6-overlay over Django and
  # ordinarily starts as root, maps to uid 1000 through USERMAP_UID and drops
  # privilege per process. Upstream also supports `user:` outright — "the
  # container process starts directly as that user with no internal privilege
  # remapping" — and that is the form here, with every capability dropped
  # because nothing is left that would use one. The uid is ${RENDER_UID}, the
  # choice alertmanager and snmp-exporter make in the sibling stack, for the
  # same reason turned around: they READ files render-config.sh wrote, this
  # DELETES files the operator wrote. ./consume below is a bind mount owned by
  # whoever ran `make up`; a scan dropped there by that user over SSH is
  # readable, and removable once consumed, only if the consumer runs as them.
  #
  # DIFFERENCE 5: a CPU ceiling, the first in the estate. #133 is explicit —
  # OCR "will use everything it is given for minutes at a time" — and a backlog
  # scan is the one workload on this box that saturates rather than leaks.
  # `cpus: 4` of the i5-8500T's six is the enforcement; TASK_WORKERS and
  # THREADS_PER_WORKER in .env.example are what Paperless is asked to use, and
  # their product (3) sits under the ceiling so the webserver, the scheduler
  # and Postgres are not throttled by a consumer that is. Throttling is not
  # silent: ContainerCpuThrottled reads the same cgroup counters.
  #
  # DIFFERENCE 6: NOT read_only, where every other long-running container in
  # the estate is. OCR is scratch-heavy — ocrmypdf renders every page to an
  # image under PAPERLESS_SCRATCH_DIR, /tmp by default, and the working set
  # scales with the document — and a tmpfs there is charged to this cgroup's
  # memory.max, so a long scan would arrive as an OOM kill rather than as a
  # slow consume. The writable layer costs nothing to keep, and read_only
  # would have bought a property the memory limit then takes back. Booted from
  # the pinned image as ${RENDER_UID} with cap_drop before this was written;
  # the README carries what that run showed.
  #
  # Memory: 3072m, unmeasured on the hardware and stated as such. The estate
  # sizes from fourteen days of RSS; this box does not exist. Upstream's floor
  # is 2 GB for the whole install; this is that plus room for one document's
  # OCR, on a box with 32 GB. Re-derive from container_memory_rss once trinity
  # has run a month, the way stacks/observability did for its seven.
  #
  # The healthcheck is the image's own (curl against 8000, which ALLOWED_HOSTS
  # always admits for localhost), written out so check_compose_health.py
  # --probe proves curl is still in the image after a Dependabot bump.
  # start_period covers the migrations and the `document_index reindex
  # --if-needed` the container runs before the webserver listens.
  paperless:
    <<: *service-defaults
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3@sha256:aa810a36942c63d4ee70d00eda7236cd3d6acfb7eb3f7987fb568ed14df8817a
    container_name: sensitive-paperless
    # The one service in either stack that turns the shared `init: true` OFF.
    # The estate's reason for a real init as PID 1 is an image whose PID 1
    # never calls wait() (grafana, #71); this image's PID 1 is s6-overlay,
    # which is an init and does. It also refuses to be anything else — booted
    # with the default, the container exits at once with "s6-overlay-suexec:
    # fatal: can only run as pid 1", because docker-init has taken the slot.
    init: false
    user: "${RENDER_UID:?run make render}:${RENDER_GID:?run make render}"
    mem_limit: 3072m
    memswap_limit: 3072m
    cpus: 4
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      # The same SOPS value paperless-db reads as POSTGRES_PASSWORD, so the
      # two cannot drift.
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS:?set in secrets/sensitive.sops.yaml}
      # Signs sessions and tokens; rotating it logs everyone out and nothing
      # worse. Paperless refuses to start without it, and the guard turns
      # that refusal into a message naming the file.
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set in secrets/sensitive.sops.yaml}
      # The superuser, created on first start and never touched again by
      # this variable — the GRAFANA_ADMIN_* shape, with the same exposure
      # (`docker inspect` reads it) accepted for the same reason: the
      # alternative is a hand-run createsuperuser nothing converges. TOTP on
      # this account at first login is ADR-0022's floor; the README has the
      # step.
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?set in secrets/sensitive.sops.yaml}
      # Behind Caddy. The URL sets ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS in
      # one go, and the two proxy settings let Django see https and the
      # browser's Host rather than the proxy's — without them every form POST
      # is a CSRF 403. Caddy sets the X-Forwarded-* headers unasked.
      PAPERLESS_URL: ${PAPERLESS_URL:-https://paperless.matrix.elysium}
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE:-America/Los_Angeles}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}
      PAPERLESS_TASK_WORKERS: ${PAPERLESS_TASK_WORKERS:-1}
      PAPERLESS_THREADS_PER_WORKER: ${PAPERLESS_THREADS_PER_WORKER:-3}
    volumes:
      # data: the search index, the classifier, the logs — rebuildable. media:
      # the originals, the archived PDF/A copies and the thumbnails — not.
      # Separate volumes so the backup verifies each by its own sentinel and
      # a restore can bring back the one that matters without the other.
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      # Two directories the repository does not track and render-config.sh
      # creates, owned by the operator: consume is the ingest path — a file
      # dropped here is imported and then deleted — and export is where
      # document_exporter writes the version-portable copy the README's
      # backup section describes. Docker would create both as root if render
      # did not, and a consumer running as ${RENDER_UID} could then delete
      # nothing it consumed.
      - ./consume:/usr/src/paperless/consume
      - ./export:/usr/src/paperless/export
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "-L", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Postgres for Paperless-ngx
  # ---------------------------------------------------------------------------
  # Postgres 18, the major upstream's own compose pins, and the one that moved
  # the data directory: it is /var/lib/postgresql/18/docker now, under a
  # volume mounted one level up at /var/lib/postgresql — so a major-version
  # upgrade gets a sibling directory and pg_upgrade has somewhere to write.
  # Mount the parent, as upstream does; mounting .../data is the pre-18 layout
  # and the image warns about it. backup-volumes.sh's sentinel for this volume
  # carries the major version in its path for that reason, and a bump to 19
  # has to move it — loudly, since the script refuses to write an archive it
  # cannot verify.
  #
  # Runs as 999 — the image's postgres user — from the start, not through the
  # entrypoint's root-then-gosu step, so `cap_drop: [ALL]` has nothing left to
  # take away. A fresh named volume inherits the image's ownership of
  # /var/lib/postgresql (999:999), which is what makes the non-root start
  # work; the two tmpfs mounts are the socket directory and sort scratch, the
  # only places it writes outside the volume. read_only booted and proven on
  # the pinned image, the way the sibling stack's were.
  #
  # 512m for a database whose whole content is metadata about documents — the
  # documents are files under media, not rows. Unmeasured, like the
  # application's: shared_buffers defaults to 128 MB and this is four times it.
  paperless-db:
    <<: *service-defaults
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: sensitive-paperless-db
    user: "999:999"
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0755
      - /tmp:size=64m
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?set in secrets/sensitive.sops.yaml}
    volumes:
      - paperless-db-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paperless", "-d", "paperless"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Valkey for Paperless-ngx — the task broker
  # ---------------------------------------------------------------------------
  # Valkey rather than Redis because upstream's compose moved to it; the
  # variable is still PAPERLESS_REDIS and the protocol is the same. It carries
  # the Celery queue and the cache and nothing else, so it is the one volume in
  # this stack whose loss costs nothing — a consume that was queued is found
  # again on the next start, because the consumer re-scans its directory.
  # `--save 60 1` keeps an RDB anyway, so that SIGTERM — which is what a
  # quiesced backup sends — leaves a dump.rdb for the archive's sentinel.
  #
  # 999 is the image's valkey user; the entrypoint would drop to it from root
  # regardless, so `user:` only makes the drop unnecessary.
  paperless-broker:
    <<: *service-defaults
    image: valkey/valkey:9.1.2-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    container_name: sensitive-paperless-broker
    # Off for the same reason as paperless above, one step removed: the
    # image's entrypoint is `tini -- docker-entrypoint.sh`, an init of its
    # own, and under docker-init it runs as PID 2 and logs on every start
    # that zombies "will not be re-parented to Tini". One init is enough.
    init: false
    user: "999:999"
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - paperless-broker-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# DIFFERENCE 4: one network, and it is the point. Every later service joins
# `sensitive` with `expose:` only; Caddy is the sole member with `ports:`.
# A service that adds `ports:` here is undoing ADR-0008's containment, and
# the review question for every PR against this file is that one line.
networks:
  sensitive:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  step-ca-data:
  paperless-data:
  paperless-media:
  paperless-db-data:
  paperless-broker-data:
