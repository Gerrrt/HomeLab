---
# The sensitive tier: ADR-0008's household services, behind one reverse proxy.
#
# Deployed on: trinity (10.0.99.40, VLAN 99 / Winterfell) — the ProDesk 600 G4
#              of ADR-0034. Deployed 2026-09-28 (#404); authored before the
#              host existed, as stacks/lab was.
# Deploy with:  make up STACK=sensitive      (from the repository root)
#
# ---------------------------------------------------------------------------
# What is here, and what is not
# ---------------------------------------------------------------------------
# The foundation, and the first household services on it. Caddy (#129)
# is the reverse proxy that publishes the tier's HTTPS port, and the whole
# containment argument in ADR-0008 — "containers sit on private bridge
# networks with only the reverse proxy publishing a port" — is a property of
# this file or it is a sentence in an ADR. step-ca (#130) issues the
# certificates behind it over ACME, from a root of the tier's own (ADR-0037).
# Home Assistant (#134) is the first service behind them, and the shape every
# later one takes: `expose:` and no `ports:`, a site block of its own in the
# Caddyfile, and its name as an alias on Caddy.
# AdGuard Home (#135) is the second, and the one service that, by design,
# publishes a port of its own — argued at DIFFERENCE 7 below. Immich (#132)
# is the third, as four services — server, machine learning, Postgres,
# Valkey — each in Home Assistant's shape, Paperless-ngx (#133) the fourth,
# as three, and Vaultwarden (#131) the fifth — the one whose volume is the
# vault, and the reason scripts/backup-volumes.sh learned this stack.
# Homepage (#137) is the sixth, and the household's page of links to the other
# five. ntfy (#136) is the seventh, and where the estate's alerts now arrive.
# Miniflux (#147) is the eighth, and the first beyond ADR-0008's nine —
# ADR-0057 decided it before it was written here. Memos (#145) is the ninth,
# decided by ADR-0059, and Mealie (#146) the tenth, decided by ADR-0060.
# linkding (#144) is the eleventh, and the fourth beyond those nine; ADR-0061
# is why it is here, and why it is behind one factor.
# Actual (#142) is the twelfth, and the fifth beyond those nine, decided the
# same way (ADR-0062).
# Stirling-PDF (#143) is the thirteenth, and the sixth beyond those nine:
# ADR-0063 is its decision, and DIFFERENCE 13 the one new thing it does.
#
# ---------------------------------------------------------------------------
# On the comments in this file
# ---------------------------------------------------------------------------
# The settings shared with `stacks/observability/compose.yaml` — why `init:
# true`, why `pids_limit`, the healthcheck shape, the `${VAR:?}` guards that
# double as the SOPS required-key list — are argued at length there and are
# NOT repeated here; two copies of an argument drift the same way two copies
# of a config do. What IS written out here is every place this stack differs
# from that one, because those are the only lines a reader cannot get from
# the sibling file. There are thirteen such places, each marked DIFFERENCE.

name: sensitive

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [sensitive]
  init: true
  pids_limit: 512

services:
  # ---------------------------------------------------------------------------
  # Caddy — the one published port (#129)
  # ---------------------------------------------------------------------------
  # DIFFERENCE 1: memory limits from day one, where stacks/lab set none. #129
  # is explicit — "#114 is blocked on data for the existing six services; a
  # brand-new stack has no such excuse" — and the lab's argument, that copying
  # the estate's numbers would be a limit derived from a machine this one is
  # not, does not apply to a proxy whose working set is measured in tens of
  # megabytes on any machine. 128m is roughly ten times what Caddy holds
  # serving a handful of upstreams; it exists to bound a leak, not to size.
  #
  # DIFFERENCE 2: this container runs as root, with every capability dropped
  # but one. Every other service in the estate runs as a numeric non-root
  # user, and the reason this one does not is measured, not assumed: in the
  # pinned image `/data` and `/config` are owned by root, mode 755, and a named
  # volume mounted there inherits that ownership on first use — so a non-root
  # Caddy cannot write its own certificate store. The alternatives are an init
  # step that chowns the volume (a hand-run command nothing converges) or a
  # sidecar to do it (a third container for a permissions bit). Root with
  # `cap_drop: [ALL]` and `no-new-privileges` can bind 443, write the two
  # directories it owns, and nothing else it could not do as uid 65534 —
  # DAC applies to root once CAP_DAC_OVERRIDE is gone. NET_BIND_SERVICE is the
  # one capability kept, because 443 inside the container is what lets the
  # Caddyfile say `https://` without a port and the published mapping stay
  # 443:443. Verify the premise, not the argument, when the image moves:
  #
  #   docker run --rm --entrypoint stat <caddy image> -c '%u:%g %a' /data
  #
  # If that ever prints something other than 0:0 755, revisit the user line.
  #
  # `admin off` in the Caddyfile means no admin API on 2019 and no `caddy
  # reload`; a Caddyfile change is `make up STACK=sensitive`, which recreates
  # the container. On a tier with a handful of upstreams that is the honest
  # cost of not running an unauthenticated control socket, and the socket
  # would have been reachable by every other container on this network.
  caddy:
    <<: *service-defaults
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    container_name: sensitive-caddy
    # A fixed address, for one reader: Home Assistant's `trusted_proxies`
    # names the proxy it will believe X-Forwarded-For from, and "whatever
    # Docker handed Caddy this boot" is not a name. The mapping form replaces
    # the anchor's `networks: [sensitive]`; the subnet is declared at the
    # bottom of this file. `.1` is the bridge's own address, so `.2` is the
    # first a container can hold.
    #
    # And the aliases, for another reader: the compose network's resolver
    # answers a name with a container's address only if the container carries
    # that name. step-ca validates Caddy's tls-alpn-01 challenge by dialling
    # the requested NAME on 443 from inside this network, so every name the
    # Caddyfile serves is listed here too — a name served without an alias
    # fails its first issuance with a DNS error at the CA, loudly. One alias
    # per service, added in the same commit as its Caddyfile block (ADR-0037).
    networks:
      sensitive:
        ipv4_address: 172.28.99.2
        aliases:
          - trinity.matrix.elysium
          - homeassistant.matrix.elysium
          - adguard.matrix.elysium
          - immich.matrix.elysium
          - paperless.matrix.elysium
          - vaultwarden.matrix.elysium
          - memos.matrix.elysium
          - home.matrix.elysium
          - ntfy.matrix.elysium
          - miniflux.matrix.elysium
          - recipes.matrix.elysium
          - links.matrix.elysium
          - actual.matrix.elysium
          - pdf.matrix.elysium
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # The operator's gid as a supplementary group, the way the estate's Grafana
    # gets it. gen-certs.sh writes the leaf's key 0640, owned by whoever ran
    # it, on purpose — its comment says why — and root in this container is
    # not exempt from that mode: with CAP_DAC_OVERRIDE dropped, uid 0 is
    # subject to the permission bits like any other uid. Without this line the
    # first start on trinity ends in `open /etc/caddy/tls/key.pem: permission
    # denied`, measured against the pinned image and a 0640 key before the
    # line was added (#131). RENDER_GID is written by render-config.sh from
    # `id -g` for every stack, so it is set wherever `make up` runs.
    group_add:
      - "${RENDER_GID:?run make render}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ACME account and every issued leaf live here; disposable, because
      # each leaf is re-issued within a week anyway (ADR-0037).
      - caddy-data:/data
      - caddy-config:/config
      # No leaf and no key are mounted: Caddy obtains both from step-ca over
      # ACME (the Caddyfile's cert_issuer block). What it needs from disk is
      # the TIER'S root certificate — not the estate's ca.pem, which is a
      # different CA (ADR-0037) — to verify the ACME directory it dials.
      # `make tier-ca ARGS="--install …"` writes this file on trinity from the
      # bundle; render-config.sh refuses to render while it is missing, and
      # its message says so rather than naming `make certs`, which on this host
      # would mint a third CA nobody asked for.
      - ../../certificates/tier-ca.pem:/etc/caddy/tls/ca.pem:ro
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    depends_on:
      step-ca:
        condition: service_healthy
    healthcheck:
      # busybox wget in this image speaks HTTPS (checked against a real
      # endpoint before this was written); the certificate is for trinity,
      # not localhost, hence --no-check-certificate on the container's own
      # loopback — the same shape as Grafana's check in the estate's stack.
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://localhost:443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # step-ca — the tier's certificate authority (#130)
  # ---------------------------------------------------------------------------
  # A ROOT OF THE TIER'S OWN, with an intermediate beneath it — ADR-0037. This
  # comment used to say "an intermediate beneath the lab CA, so nothing is
  # re-pointed", and that was written before anyone read the lab root: it is
  # minted with pathlen:0, so a leaf beneath any intermediate of it fails
  # "path length constraint exceeded" in every Go client this estate runs. The
  # ADR has the measurement and the cost of the alternative.
  #
  # Both are minted on the monitoring host, in this image, by
  #
  #   make tier-ca ARGS=--mint                (scripts/tier-ca.sh)
  #
  # which writes the tree step-ca runs from (config/, certs/, secrets/, db/)
  # under certificates/ there, and a bundle of it WITHOUT the root key. The
  # bundle is what populates the step-ca-data volume on trinity, with
  # `make tier-ca ARGS="--install …"` — docs/runbooks/build-the-tier-ca.md.
  # The root key stays on the monitoring host, cold: ca.json never references
  # it (checked by the script), so this service has no use for it. The image's
  # entrypoint refuses to start without config/ca.json and would otherwise
  # mint a fresh root of its own on first boot; a populated volume is what
  # stops that, and DOCKER_STEPCA_INIT_* is deliberately never set.
  #
  # The ACME provisioner in that ca.json accepts tls-alpn-01 only, on 443 —
  # so 80 stays unpublished (ADR-0012) — and issues seven-day leaves. The
  # lifetime is the outage budget between this container failing and the
  # tier's handshakes failing; ADR-0037 §3 says why it is not the 24h default.
  #
  # DIFFERENCE 3: the key password comes from SOPS by way of the environment
  # and a tmpfs file. step-ca wants a --password-file; the estate's rule is
  # that a credential lives in secrets/*.sops.yaml and nowhere else. The
  # entrypoint below writes ${STEPCA_PASSWORD} to a 0600 file on a 1 MiB
  # private tmpfs and execs step-ca against it — the same class of exposure
  # as GRAFANA_ADMIN_PASSWORD in the sibling stack (`docker inspect` can read
  # the environment of either), and nothing on disk. `$$` is compose's
  # escape: the container sees `${STEPCA_PASSWORD}`, not this file's value.
  #
  # Nothing publishes 9000. Caddy reaches it on this network for ACME; a
  # browser never needs it. The day the estate's Grafana renews from here
  # (ADR-0037's reopen) is the day it gets an off-host consumer and ADR-0012
  # says to publish it — not before.
  step-ca:
    <<: *service-defaults
    image: smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    container_name: sensitive-step-ca
    mem_limit: 256m
    memswap_limit: 256m
    user: "1000:1000"
    cap_drop: [ALL]
    # Measured on the first boot, which the foundation commit never had: with
    # every capability dropped, `exec /usr/local/bin/step-ca` fails with
    # "operation not permitted" before main() runs. The image ships the binary
    # with the NET_BIND_SERVICE file capability set (so it can bind 443 as a
    # non-root user), and the kernel refuses to exec a file whose effective
    # capability is outside the process's bounding set rather than running it
    # unprivileged. Keeping that one capability in the bounding set is what
    # makes the exec succeed; the process binds 9000 and would not need it.
    # Same single capability Caddy keeps, for a different reason.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run/step:size=1m,uid=1000,gid=1000,mode=0700
      - /tmp:size=16m
    environment:
      STEPCA_PASSWORD: ${STEPCA_PASSWORD:?set in secrets/sensitive.sops.yaml}
    command:
      - /bin/bash
      - -c
      - >-
        umask 077 && printf '%s' "$${STEPCA_PASSWORD}" > /run/step/password
        && exec step-ca --password-file /run/step/password /home/step/config/ca.json
    volumes:
      - step-ca-data:/home/step
    expose:
      - "9000"
    healthcheck:
      # `step ca health` is the CA asking itself, over TLS, against its own
      # root — the tier's, out of the installed tree. `localhost` is in the
      # serving certificate's SANs because tier-ca.sh puts it there at init;
      # without it this check fails on hostname mismatch against a CA that is
      # serving fine. The `step` binary ships in the image;
      # check_compose_health.py --probe proves that on every run rather than
      # trusting this comment.
      test:
        - CMD
        - step
        - ca
        - health
        - --ca-url
        - https://localhost:9000
        - --root
        - /home/step/certs/root_ca.crt
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Home Assistant — the automation hub, and what the 99 → 20 rule is for (#134)
  # ---------------------------------------------------------------------------
  # Home Assistant CONTAINER, not Supervised and not OS: no Supervisor, so no
  # add-ons — and that is the point rather than the price. An add-on is a
  # second package manager operating outside this file and outside digest
  # pinning, the objection roadmap.md records against Nextcloud's app store.
  # Anything an add-on would have supplied — an MQTT broker, a Zigbee bridge —
  # arrives as its own pinned service in this file, on the day a device needs
  # it. None does today: Ring is cloud, the Hue bridge is its own radio, the
  # speakers are Wi-Fi (roadmap.md, "Everything still to buy"). So there is no
  # `devices:` line, no USB coordinator, and where trinity physically sits is
  # not constrained by this service — the question ADR-0034 left to #404,
  # answered for #134's part: a rack in a closet is fine.
  #
  # Upstream's compose example is `network_mode: host` and `privileged: true`.
  # Neither is here, and this estate is the one place refusing them costs
  # nothing. Host networking exists for discovery — mDNS and SSDP — and
  # discovery is link-local: every device this controls is on Skids (VLAN 20),
  # a broadcast domain away, so nothing on 20 would be found from 99 however
  # the container were networked. Devices are added by address, through the
  # one pass ADR-0035 scopes. `privileged` exists for USB radios and Bluetooth,
  # and there are none. So this is an ordinary member of the `sensitive`
  # network with `expose:` and no `ports:`, behind Caddy like everything else,
  # and ADR-0008's containment sentence stays true of it.
  #
  # DIFFERENCE 5: `init: false`. The image's entrypoint is s6-overlay v3, an
  # init in its own right, and it refuses to be anything but PID 1 — measured
  # on the pinned image, not read: with `init: true` the container exits at
  # once on `s6-overlay-suexec: fatal: can only run as pid 1`. Every other
  # service here takes tini from x-service-defaults; this one brings its own.
  #
  # DIFFERENCE 6: root, like Caddy, and for a worse reason — the image has no
  # other mode. s6 starts as root and runs Home Assistant as root; there is no
  # PUID, and a `user:` line breaks the supervision tree before it starts. What
  # bounds that is the same set as Caddy's, minus the capability: everything
  # dropped, no-new-privileges, a read-only root with two tmpfs mounts (s6
  # needs /run and Home Assistant needs /tmp; S6_READ_ONLY_ROOT tells stage 2
  # to stage its scripts under /run instead of /etc), and one writable path,
  # the config volume. Booted exactly so on the monitoring host on 2026-09-09
  # from the pinned digest, on an internal Docker network with no route out:
  # onboarding served in about twenty seconds, zero read-only errors, CapEff 0
  # for PID 1 and for the Home Assistant process. Root with no capabilities and
  # a read-only root writes /config and nothing else. Two things that boot
  # taught, both kept: /run has to be mounted `exec` — Docker's tmpfs default
  # is noexec and s6 stages its own binaries there, so without it stage 0 dies
  # on `Permission denied` — and one error line is logged on every start,
  # `aiodhcpwatcher: Cannot watch for dhcp packets: Operation not permitted`.
  # That is default_config's `dhcp` discovery wanting CAP_NET_RAW to sniff
  # for devices; on a bridge network a VLAN away from every device it would
  # sniff nothing, so the capability stays dropped and the line is expected.
  #
  # WHERE THE CREDENTIALS ARE, because this service accumulates more of them
  # than anything else on the tier and the estate's rule is `secrets/*.sops.yaml`
  # or nowhere. Home Assistant does not take device credentials from the
  # environment or from any file this repository could render: the Hue
  # application key, the Ring refresh token and everything else a config flow
  # produces is written by Home Assistant into /config/.storage/ — in the
  # volume, on trinity's disk, in the volume archive. So the rule holds for
  # what this file can hold, and the deviation is written down rather than
  # papered over: the tier's most numerous credentials live in an application
  # store, protected by #404's disk-encryption decision and by the volume
  # backup, not by SOPS. ADR-0035 records that. A long-lived access token
  # minted in the UI for another service to use is that service's secret and
  # goes in ITS SOPS file. None exists yet, and ADR-0019 declined #98's
  # would-be consumer.
  #
  # What this file does hold is one credential: HA_PROMETHEUS_AUTHORIZATION,
  # the estate's Prometheus reader token for the rack-power sensor in
  # packages/homelab_rack.yaml (#182). It is the first YAML-configured
  # integration here that needs one. It arrives as an environment variable,
  # read with `!env_var`, rather than in a /config/secrets.yaml rendered from
  # SOPS, which is what this comment used to plan. The environment is how
  # Homepage and AdGuard beside it take theirs, it needs no rendered file or
  # mount, and `!env_var` is Home Assistant's own YAML tag for it. If a
  # second credential ever arrives, the secrets.yaml plan becomes worth its
  # mount.
  #
  # REQUESTS_CA_BUNDLE is how that sensor verifies the proxy, which serves
  # https under the estate CA (#764, ADR-0086). Home Assistant builds every
  # client SSL context from it when set, certifi otherwise, and it replaces
  # certifi rather than adding to it, so the bundle is the host's public roots
  # plus the estate CA. scripts/render-trust-bundles.sh writes it and has the
  # reasoning.
  home-assistant:
    <<: *service-defaults
    image: ghcr.io/home-assistant/home-assistant:2026.10.0@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4
    container_name: sensitive-home-assistant
    init: false
    # A ceiling to catch a leak, not a measurement: #114's method — median and
    # peak over a fortnight of real use — replaces it once the tier runs. The
    # only number there is: 316 MiB RSS at the end of a first boot on the
    # pinned image, with default_config loaded and no devices, and 35
    # tasks against the anchor's pids_limit of 512. Python threads count as
    # tasks and Home Assistant is thread-heavy — its executor alone may hold
    # 64 — so the margin under 512 is stated rather than assumed.
    mem_limit: 1g
    memswap_limit: 1g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /run:size=16m,exec
    environment:
      S6_READ_ONLY_ROOT: "1"
      REQUESTS_CA_BUNDLE: /etc/home-assistant/ca-bundle.pem
      HA_PROMETHEUS_AUTHORIZATION: ${HA_PROMETHEUS_AUTHORIZATION:?set in secrets/sensitive.sops.yaml}
    volumes:
      - home-assistant-config:/config
      # The config is the repository's; the volume is the application's. A
      # single-file mount over a volume works — Docker mounts the deeper path
      # last — and it is pinned to an inode like every other single-file mount
      # here, so `make up` runs check_mounted_config.py --fix for it (#355).
      - ./home-assistant/configuration.yaml:/config/configuration.yaml:ro
      - ./home-assistant/packages:/config/packages:ro
      - ./.rendered/home-assistant-ca.pem:/etc/home-assistant/ca-bundle.pem:ro
    expose:
      - "8123"
    # The recorder flushes on shutdown; cut it off at compose's default 10s
    # and the next start replays or repairs the database. Upstream's example
    # sets the same figure.
    stop_grace_period: 60s
    healthcheck:
      # /manifest.json answers 200 with no session. `/` answers 302 — to
      # onboarding, then to the login page — which --spider would also pass,
      # but a redirect is a weaker claim than a document. busybox wget, as in
      # Caddy's check; --probe proves the binary is there.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/manifest.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      # A first boot on the i5-8500T is well under this; the figure covers a
      # recorder repair after an unclean stop, which is the slow start that
      # matters.
      start_period: 90s

  # ---------------------------------------------------------------------------
  # AdGuard Home — the DNS filter Unbound forwards to (#135, ADR-0010)
  # ---------------------------------------------------------------------------
  # Not a client-facing resolver. Every DHCP scope keeps handing out pfSense;
  # Unbound on morpheus forwards to this address with the public upstreams
  # listed beside it, so a dead AdGuard costs filtering and never connectivity.
  # docs/runbooks/forward-dns-to-adguard.md is the change on morpheus, and it
  # is the entire client-side change — one config file, no DHCP edit, no lease
  # TTL to wait out, which is what makes ADR-0010 cheap to reverse.
  #
  # DIFFERENCE 7: this service publishes a port, and it is the only one
  # besides Caddy that ever should. ADR-0012's test is a named off-host
  # consumer, and this one has two: Unbound on morpheus, which is what the
  # service exists for, and the blackbox exporter on prometheus, which probes
  # 53 directly because a probe through the normal path always passes (#126).
  # Caddy cannot carry it — DNS is not HTTP and the stock image has no
  # layer-4 proxy — so the containment argument in the header holds for HTTP
  # and this is the one hole cut in it, sized to a port and an address:
  # published on trinity's own address rather than 0.0.0.0 (.env.example says
  # why), and answered for two source addresses only (adguard/AdGuardHome.yaml
  # `allowed_clients`). The client VLANs never reach it at all; default deny
  # sees to that, and the Hicks named list (ADR-0031) does not include it.
  #
  # Runs as `nobody`, which the image's own files are owned by, with every
  # capability dropped but NET_BIND_SERVICE — and that one is in the bounding
  # set only. The binary carries `cap_net_bind_service=eip` as a file
  # capability (getcap in the pinned image, 2026-09-09), which is what lets a
  # non-root process bind 53 and 80; the container's own CapEff reads 0. The
  # image refuses a FIRST launch as non-root ("you must run it as
  # administrator") because the setup wizard wants to write its config; with
  # the config already present, as below, it never runs the wizard.
  #
  # The config is adguard/AdGuardHome.yaml, tracked, and copied into a tmpfs
  # on every start with the admin hash substituted from the environment — so
  # what runs is what the repository says, and a change made in the UI lasts
  # until the next restart. The hash passes through the environment rather
  # than a rendered file for a permissions reason worth writing down: a file
  # render-config.sh writes is 0600 to the rendering user, and the one
  # process that could read it — a container running as that user — cannot
  # write the `work` volume, which inherits `nobody` from the image. Same
  # exposure class as STEPCA_PASSWORD above, and it is a bcrypt hash rather
  # than a password. awk with index()/substr() rather than sed or gsub(): a
  # bcrypt hash is `$`, `.`, `/` and alphanumerics, and every one of the
  # obvious substitution tools treats at least one of those specially.
  #
  # `work` is where the downloaded blocklists, the query log and the
  # statistics live — a volume, so a restart does not need the internet to
  # filter again. Nothing else is writable.
  adguard:
    <<: *service-defaults
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: sensitive-adguard
    # Was 512m: 5x the measured 95 MiB RSS with two blocklists (433k rules,
    # 2026-09-09). The threat-intelligence list adds 1.56M rules. Measured on
    # the pinned image, 2026-10-09, cgroup memory.peak:
    #   fresh boot, three lists downloaded and loaded      ~440 MiB
    #   boot on day-old lists, then the refresh replacing
    #   all three while the old copies still serve          772 MiB
    # The second is the daily refresh, and the number to size for. Production
    # ran ~53 MiB above a fresh boot's peak with two lists (207 against 154
    # MiB, cache and query log), so ~830 MiB is the expected worst case.
    # 1.5g is ~1.8x that: the bound is for a leak, not a budget, this is the
    # house's only forwarder, and trinity has 32 GB.
    mem_limit: 1536m
    memswap_limit: 1536m
    user: "65534:65534"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /opt/adguardhome/conf:size=1m,uid=65534,gid=65534,mode=0700
    environment:
      ADGUARD_ADMIN_PASSWORD_HASH: ${ADGUARD_ADMIN_PASSWORD_HASH:?make hash-password, then secrets-edit STACK=sensitive}
    # `$$` is compose's escape, as for step-ca: the container sees `$0` and
    # `${ADGUARD_ADMIN_PASSWORD_HASH}`, not this file's values. The chmod
    # quietens AdGuard's own permission check on the volume, which Docker
    # creates 0755; the directory is ours to tighten.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 && chmod 700 /opt/adguardhome/work
        && awk -v hash="$${ADGUARD_ADMIN_PASSWORD_HASH}"
        '{ i = index($$0, "__ADGUARD_ADMIN_PASSWORD_HASH__");
        if (i) $$0 = substr($$0, 1, i - 1) hash substr($$0, i + 31);
        print }'
        /opt/adguardhome/template/AdGuardHome.yaml
        > /opt/adguardhome/conf/AdGuardHome.yaml
        && exec /opt/adguardhome/AdGuardHome --no-check-update
        -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work
    volumes:
      - ./adguard/AdGuardHome.yaml:/opt/adguardhome/template/AdGuardHome.yaml:ro
      - adguard-work:/opt/adguardhome/work
    ports:
      - "${DNS_BIND_ADDR:-10.0.99.40}:53:53/udp"
      - "${DNS_BIND_ADDR:-10.0.99.40}:53:53/tcp"
    # The UI, for Caddy only.
    expose:
      - "80"
    healthcheck:
      # The login page, unauthenticated: 302 then 200, which busybox wget
      # follows. HTTP rather than a DNS query on purpose — a query from inside
      # the container arrives from 127.0.0.1, which `allowed_clients` drops,
      # and a healthcheck that depended on the upstreams would mark the
      # container unhealthy for a WAN fault. Whether it ANSWERS is the
      # blackbox probe's question, asked from where the firewall asks it.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Vaultwarden — the household's password manager (#131)
  # ---------------------------------------------------------------------------
  # Behind Caddy like Home Assistant, in the shape every later service copies:
  # `expose:` and no `ports:`, so a browser on Hicks reaches it only through
  # the one published 443, by name, at https://vaultwarden.matrix.elysium.
  # Bitwarden's own clients and browser extensions are pointed at that URL
  # unchanged, which is the whole reason #131 chose it over upstream Bitwarden.
  #
  # Runs as root with EVERY capability dropped — DIFFERENCE 2's argument, and
  # the same measurement: in the pinned image /data is 0:0 755, a named volume
  # mounted there inherits that, and a non-root Vaultwarden cannot create its
  # own database. Unlike Caddy it keeps nothing: ROCKET_PORT is 8080 rather
  # than the image's 80, so there is no privileged bind and no NET_BIND_SERVICE
  # to keep. Root without CAP_DAC_OVERRIDE writes the one directory it owns and
  # nothing else. Checked before this was written, on the pinned image with
  # exactly these options: it came up healthy, answered /alive and /admin, and
  # `docker diff` showed nothing of its own written outside /data. Re-check
  # the premise when the image moves, as for Caddy:
  #
  #   docker run --rm --entrypoint stat <vaultwarden image> -c '%u:%g %a' /data
  #
  # SIGNUPS_ALLOWED is false from the FIRST start, not "after the two accounts
  # exist" as #131 wrote it. There is no window: the two accounts are created
  # by invitation from /admin, and with no SMTP configured an invited address
  # simply registers itself at the vault — Vaultwarden's documented path for
  # exactly this. So no SMTP credential to hold, and not a minute in which
  # anything on Hicks could open an account of its own.
  #
  # ADMIN_TOKEN is an Argon2id PHC string, never the token itself — generated
  # by `vaultwarden hash` (the README has the command) and pasted into SOPS.
  # `docker inspect` on this container then shows a hash, where on Grafana it
  # shows the password. The string is five `$`-delimited fields, and compose
  # reads a `$` in .env as a variable reference and quietly hollows the value
  # out; render-config.sh doubles them on the way in, and this is why.
  #
  # IP_HEADER: Caddy sets X-Forwarded-For, not the X-Real-IP the image defaults
  # to. Nothing but Caddy can reach 8080, so the header is trusted — it is what
  # lets the login rate limit and the admin log see the client on Hicks rather
  # than the proxy's address on the bridge.
  #
  # No `depends_on` from Caddy to this service, deliberately: a proxy that
  # waits for every upstream is a proxy that stays down while one of them is
  # broken. Caddy answers 502 for a vault that is not up yet, which is true.
  #
  # 256m: the process idles under 10 MiB RSS on the pinned image, and checking
  # the admin token at an /admin login costs the Argon2 memory parameter once
  # — 19 MiB with the OWASP preset, 64 MiB with Bitwarden's. Four times the
  # larger, to bound a leak rather than to size.
  vaultwarden:
    <<: *service-defaults
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: sensitive-vaultwarden
    mem_limit: 256m
    memswap_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      DOMAIN: https://vaultwarden.matrix.elysium
      ROCKET_PORT: "8080"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      SHOW_PASSWORD_HINT: "false"
      IP_HEADER: X-Forwarded-For
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?set in secrets/sensitive.sops.yaml}
    volumes:
      - vaultwarden-data:/data
    expose:
      - "8080"
    healthcheck:
      # The image's own script: curl against its own ROCKET_PORT and the base
      # path DOMAIN implies, which here is /alive. curl ships in the image, and
      # check_compose_health.py --probe proves that on every run.
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Memos — the household's notes (#145, ADR-0059)
  # ---------------------------------------------------------------------------
  # The second service beyond ADR-0008's nine, and in Vaultwarden's shape:
  # `expose:` and no `ports:`, reached from Hicks by name through Caddy's 443
  # at https://memos.matrix.elysium, which the existing 50→99 pass already
  # allows. Notes, not documentation: docs/ stays the estate's record
  # (ADR-0059 says why that is a boundary and not a preference).
  #
  # NOT root, unlike Vaultwarden. Measured on the pinned image on 2026-09-29:
  # /var/opt/memos is 10001:10001 2755 in the image, and a named volume mounted
  # there inherits it, so the process can start as that uid directly. The
  # image's entrypoint starts as root to chown the directory and su-exec down;
  # started as 10001 it skips that block and execs the binary, so it needs no
  # capability at all. Booted with exactly these options it came up healthy,
  # created its database, took a user, and stored an upload.
  #
  # What the volume holds, read off that boot: memos_prod.db in WAL mode —
  # while it runs, a fresh database is 4 KB with everything in the -wal beside
  # it, and a clean stop checkpoints it back — and ./assets, where the default
  # LOCAL storage writes every attachment. So it is one database and a
  # directory of files, not the one file #145 hoped.
  #
  # No secret. Sign-up is an instance setting stored in the database, not an
  # environment variable: the first account becomes the admin, and the README
  # has the step that turns registration off behind it.
  #
  # MEMOS_INSTANCE_URL is the canonical external URL, used for links it
  # generates. MEMOS_TRUSTED_PROXIES is the image's default ("private") made
  # explicit: only Caddy on the bridge can reach 5230, so X-Forwarded-For is
  # believed, and the rate limit sees the client on Hicks.
  #
  # 128m: 15 MiB RSS idle on the pinned image, and the same after an upload.
  # Eight times that, to bound a leak rather than to size.
  memos:
    <<: *service-defaults
    image: neosmemo/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
    container_name: sensitive-memos
    user: "10001:10001"
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      MEMOS_PORT: "5230"
      MEMOS_INSTANCE_URL: https://memos.matrix.elysium
      MEMOS_TRUSTED_PROXIES: private
    volumes:
      - memos-data:/var/opt/memos
    expose:
      - "5230"
    healthcheck:
      # /healthz answers once the database is open. wget is busybox's, in the
      # Alpine base; check_compose_health.py --probe proves it on every run.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5230/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # ntfy — where the estate's alerts are delivered (#136)
  # ---------------------------------------------------------------------------
  # Alertmanager on prometheus posts here, over Caddy's 443 on the same VLAN,
  # and the phones subscribe here. The urgent and security channels ALSO keep
  # their ntfy.sh topic, as a second webhook in alertmanager.yaml, because a
  # phone off the home network cannot reach this service: nothing is exposed,
  # and the WireGuard path (ADR-0042) goes to the lab, not here. The heartbeat
  # is not here and never may be (#408): a watcher inside the house fails with
  # the house. docs/runbooks/verify-the-alert-path.md has the whole picture.
  #
  # DIFFERENCE 12: auth is declared in the environment, and the environment is
  # authoritative. `auth-default-access: deny-all` in ntfy/server.yml means an
  # open relay is not one setting away, and the users, their ACLs and
  # Alertmanager's token arrive as NTFY_AUTH_USERS / _ACCESS / _TOKENS, built
  # below from SOPS. ntfy re-provisions its user.db from these on every start
  # — measured on the pinned image: a changed hash and a rotated token each
  # made the old credential answer 401 after a restart, and an ACL entry
  # removed from the list answered 403. So rotation is `make secrets-edit` and
  # `make up`, and the volume holds nothing that is not re-derived from here,
  # which is why scripts/backup-volumes.sh skips it by name.
  #
  # Two users, each able to do one thing. `alertmanager` may WRITE the three
  # topics and nothing else, by token; `phone` may READ them and nothing else,
  # by password — its bcrypt hash is what SOPS holds (`make hash-password`).
  # Measured with this exact list: anonymous publish and read 403, the token
  # publishing 200 and reading 403, `phone` reading 200 and publishing 403,
  # either against a topic outside the list 403, sign-up refused.
  #
  # The topic names come from SOPS too. With auth on, a name is not a
  # credential the way it is on ntfy.sh (docs/security.md, the rotation of
  # 2026-08-20), but #136 asked that they be treated as one, and a name
  # guessable from this file is one less thing an attacker has to learn.
  #
  # upstream-base-url is ntfy.sh, for the iPhone. iOS delivers only through
  # APNs, which only ntfy.sh can reach, so this server posts a content-free
  # poll request there — the SHA-256 of the topic's URL and nothing else,
  # read off the pinned image's own log — and the phone then fetches the
  # message from here. The alert text never leaves the house; the fact and
  # time of a message does. The Pixel keeps its own connection and needs none
  # of it.
  #
  # Root with every capability dropped, as Vaultwarden (DIFFERENCE 2's
  # argument): the pinned image has no /var/lib/ntfy at all, so the named
  # volume is created root-owned and a non-root ntfy cannot open its own
  # database. `docker diff` on the boot above showed nothing written outside
  # it. Re-check when the image moves:
  #
  #   docker run --rm --entrypoint ls <ntfy image> -ld /var/lib/ntfy
  #
  # 128m: 14 MiB and ten tasks on that boot. Ten times, to bound a leak.
  ntfy:
    <<: *service-defaults
    image: binwiederhier/ntfy:v2.29.0@sha256:4c599cf0818965782f93f652bd843e92714992e84d6b88ad17713dc0951cda1f
    container_name: sensitive-ntfy
    command: ["serve"]
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # Folded scalars, one entry per line: YAML joins them with ", " and ntfy
    # trims the space after each comma (checked on the pinned image). The
    # `alertmanager` user's hash is of a password nobody keeps — ntfy requires
    # one per user, and that user authenticates by token alone.
    environment:
      NTFY_AUTH_USERS: >-
        alertmanager:${NTFY_ALERTMANAGER_PASSWORD_HASH:?set in secrets/sensitive.sops.yaml}:user,
        phone:${NTFY_PHONE_PASSWORD_HASH:?set in secrets/sensitive.sops.yaml}:user
      NTFY_AUTH_ACCESS: >-
        alertmanager:${NTFY_TOPIC_ALERTS:?set in secrets/sensitive.sops.yaml}:wo,
        alertmanager:${NTFY_TOPIC_URGENT:?set in secrets/sensitive.sops.yaml}:wo,
        alertmanager:${NTFY_TOPIC_SECURITY:?set in secrets/sensitive.sops.yaml}:wo,
        phone:${NTFY_TOPIC_ALERTS}:ro,
        phone:${NTFY_TOPIC_URGENT}:ro,
        phone:${NTFY_TOPIC_SECURITY}:ro
      NTFY_AUTH_TOKENS: >-
        alertmanager:${NTFY_ALERTMANAGER_TOKEN:?set in secrets/sensitive.sops.yaml}:alertmanager
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      # ntfy's default template-dir. homelab.yml there is what turns an
      # Alertmanager payload into a title and a line; a directory mount, so
      # check_mounted_config.py's single-file inode concern does not apply.
      - ./ntfy/templates:/etc/ntfy/templates:ro
      - ntfy-data:/var/lib/ntfy
    expose:
      - "8080"
    healthcheck:
      # Answers {"healthy":true} with no credential, deny-all notwithstanding.
      # busybox wget; --probe proves it is in the image.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Immich — the service ADR-0008 named as the cost of the decision (#132)
  # ---------------------------------------------------------------------------
  # "A large, rapidly-moving codebase with an upload endpoint" on the segment
  # where compromise is total. ADR-0008 accepted that on four conditions, and
  # each of them is a line in this block rather than a sentence in the ADR:
  # nothing is exposed to the internet (no `ports:` on any of the four
  # services — Caddy above is the one door); the realistic threat is a
  # supply-chain compromise in an image, which the tag-and-digest pins bound
  # (Dependabot moves them, CI validates them, and Immich ships roughly
  # monthly, so this is the stack where the pin earns its keep); the
  # containers sit on a private bridge; and a memory limit on every one of
  # them, because the machine learning is the most memory-hungry thing that
  # will run in the estate and #114 exists because nothing used to bound a
  # leak.
  #
  # Four services because that is what Immich is: a Node server that is both
  # the API and the job workers, a Python inference service it calls over
  # HTTP, a Postgres with the VectorChord extension, and a Redis-compatible
  # queue. Upstream's own compose file is the reference for the shape; every
  # departure from it below is a hardening step this estate applies to
  # everything, and each was booted and exercised on the monitoring host on
  # 2026-09-09 before it was written down — an admin created, an upload made,
  # thumbnails generated, the ML models fetched — because a read-only root
  # filesystem is a crash loop that `restart: unless-stopped` retries
  # forever, and the two places these images write outside their volumes
  # were found by running, not by reading.
  #
  # DIFFERENCE 8: two of these services turn `init: true` back off, as Home
  # Assistant does (DIFFERENCE 5) and for the same shape of reason. Both
  # Immich images ship tini as their entrypoint, and under docker-init tini
  # starts as PID 2 and warns on every boot that it will not reap. docker-init
  # reaps regardless, so nothing was broken — but a warning at every start is
  # a log line nobody reads twice, and the image's own init is the init.
  #
  # DIFFERENCE 9: the library is a bind mount, not a named volume. A phone
  # library is tens to hundreds of gigabytes and grows without asking, so it
  # lives on the 2 TB USB disk docs/hardware.md assigns to it, not on the
  # 512 GB SSD beside the database. That has a consequence for
  # scripts/backup-volumes.sh, which archives NAMED volumes and would not fit
  # this one on the SSD if it did: the library is protected by ADR-0023's
  # off-estate copy and by nothing on this host. Immich writes its own nightly
  # database dump into the library tree (`backups/`, fourteen kept), so the
  # disk carries the metadata beside the originals and the off-estate copy of
  # the disk is a copy of both. The `immich-db` volume is the second route to
  # the metadata, for `make backup STACK=sensitive` once that script has
  # sentinels for this stack's volumes and picks the tier's recipient (#428).
  #
  # ON THE MEMORY LIMITS. Ceilings, not measurements — the same standing as
  # Caddy's 128m above and unlike the estate's, which #114 derived from a
  # fortnight of RSS. What was measured is the floor: on the monitoring host,
  # 2026-09-09, docker stats through first boot, one upload and the ML model
  # fetch — server 413–699 MiB, Postgres 134–313 MiB, machine learning 235–340
  # MiB idle and 1.02 GiB with CLIP and the face model both loaded, Valkey
  # under 8 MiB. The ceilings sit well above those and below anything that
  # would let one container take the 32 GB host down; they exist to turn a
  # leak into an OOM kill of one service, which ContainerOomKilled then
  # names. Re-derive them the way #114
  # did once trinity has run a fortnight with real uploads and a transcode or
  # two — `max_over_time(container_memory_rss{name=~"sensitive-immich.*"}[14d])`
  # — and move the number and this paragraph together.
  immich-server:
    <<: *service-defaults
    image: ghcr.io/immich-app/immich-server:v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
    container_name: sensitive-immich-server
    init: false
    # 3 GiB: the server transcodes video with ffmpeg inside this container,
    # and a 4K clip is the largest single working set anything here will have.
    mem_limit: 3072m
    memswap_limit: 3072m
    # The deploying user, as Alertmanager and snmp-exporter run in the
    # estate's stack: the library on the USB disk is owned by whoever
    # formatted it, and the container writes there as that uid and nowhere
    # else. The image runs as root by default and needs none of root's
    # capabilities — 2283 is unprivileged — so the whole set is dropped.
    user: "${RENDER_UID:?run make render}:${RENDER_GID:?run make render}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Read-only root proved by `docker diff` after an upload: nothing outside
    # /data and /tmp. /tmp is where Node puts its temporaries; uploads stream
    # straight to /data/upload and transcodes to /data/encoded-video, so 256m
    # is headroom rather than a working figure.
    read_only: true
    tmpfs:
      - /tmp:size=256m
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?set in secrets/sensitive.sops.yaml}
      REDIS_HOSTNAME: immich-valkey
      # Caddy's fixed address (see its `networks:` block), so the client
      # address Immich records against a session is the phone's and not the
      # proxy's. The same reader Home Assistant's `trusted_proxies` has.
      IMMICH_TRUSTED_PROXIES: 172.28.99.2
    volumes:
      # Long form so that `create_host_path: false` can be said: a missing
      # source directory refuses the deploy instead of becoming an empty
      # directory on the SSD that a whole library then lands in. See
      # .env.example for the mount point and for the case this cannot catch.
      - type: bind
        source: ${IMMICH_UPLOAD_LOCATION:-/srv/immich}
        target: /data
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "2283"
    depends_on:
      immich-db:
        condition: service_healthy
      immich-valkey:
        condition: service_healthy
    healthcheck:
      # The image's own HEALTHCHECK, written out so check_compose_health.py
      # --probe can exec it: a bash script on the image's PATH that curls
      # /api/server/ping on the API worker.
      test: ["CMD", "immich-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot imports ~228k geodata rows before the API answers — 35 s on
      # the monitoring host, comfortably inside this.
      start_period: 120s

  immich-machine-learning:
    <<: *service-defaults
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.1@sha256:513c831cfb010ad319341a0c86b42c575a0d5b688d3e8cae346ee624074a58ed
    container_name: sensitive-immich-machine-learning
    # Behind a profile so that .env.example's COMPOSE_PROFILES line is the
    # switch (#132: "consider disabling the machine-learning container
    # initially"). It is ON by default: ADR-0034 chose the ProDesk because
    # 32 GB fits this, and the limit below is what makes running it
    # acceptable before there is data on what it costs.
    profiles: ["ml"]
    init: false
    # 4 GiB: CLIP and the face-recognition model load to roughly a gigabyte
    # each and unload after five idle minutes; a batch of both at once, with
    # the ONNX arenas, is the ceiling this is set against.
    mem_limit: 4096m
    memswap_limit: 4096m
    # Root, with every capability dropped — the Caddy argument (DIFFERENCE 2,
    # and Home Assistant's DIFFERENCE 6) for the same measured reason: the
    # image has no /cache directory, so the named volume mounted there is
    # created root-owned, mode 755, and a non-root process cannot fetch a
    # model into it. Re-check when the image moves:
    #
    #   docker run --rm --entrypoint stat <ml image> -c '%u:%g %a' /cache
    #
    # "No such file or directory" is the answer that keeps this as root.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Read-only root, and the two writes outside /cache it needed redirected
    # (both found by running): huggingface_hub's xet download cache and its
    # logs go under $HF_HOME, which defaults to /root/.cache/huggingface and
    # is what made every model fetch fail with EROFS; matplotlib wants a
    # config directory under $HOME and warns on every start without one.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    environment:
      HF_HOME: /cache/huggingface
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - immich-model-cache:/cache
    expose:
      - "3003"
    healthcheck:
      # The image's own HEALTHCHECK: healthcheck.py in the WORKDIR, GETting
      # /ping. python3 is the venv's, on PATH.
      test: ["CMD", "python3", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  immich-db:
    <<: *service-defaults
    # Upstream's image — Postgres with VectorChord preloaded and its own
    # entrypoint choosing an SSD or HDD tuning profile. Major 17 rather than
    # the 14 upstream's compose still defaults to: 14 leaves support in
    # November 2026, upstream states >= 14 and < 20 all work, and a library
    # born on a major that needs a dump-and-restore within months would be
    # choosing the migration on purpose. The tag carries the extension
    # version, so Dependabot bumps both halves together.
    image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3@sha256:79b95b795f0911e95ffa4d092a2162c4d81a984d5629bc8f786afe0bc0657671
    container_name: sensitive-immich-db
    # 2 GiB: upstream's stated floor for a Postgres under a container limit.
    mem_limit: 2048m
    memswap_limit: 2048m
    # postgres, by uid. The image's data directory is 999:999 and a named
    # volume inherits that, so the entrypoint's root-then-drop dance is not
    # needed and no capability is either.
    user: "999:999"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Postgres's shared memory. Docker's default /dev/shm is 64 MiB, which
    # parallel query workers exhaust; upstream sets this and so does this.
    shm_size: 128m
    # Read-only root. The entrypoint copies its tuning profile to
    # /etc/postgresql at every start — the one write outside the data
    # directory, and the reason for the second tmpfs. The socket directory
    # is the first; the healthcheck connects through it.
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=4m,uid=999,gid=999,mode=0700
      - /etc/postgresql:size=1m,uid=999,gid=999,mode=0700
      - /tmp:size=64m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?set in secrets/sensitive.sops.yaml}
      # Page checksums from the first initdb: this is the one database in the
      # estate whose corruption would be noticed years later, by someone
      # looking for a photograph.
      POSTGRES_INITDB_ARGS: --data-checksums
      # The database is on the internal SSD, which is the default profile;
      # written out so that moving it to the spinning disk is a one-line
      # change that reads as a decision.
      DB_STORAGE_TYPE: SSD
    volumes:
      - immich-db:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "--dbname=immich", "--username=postgres"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  immich-valkey:
    <<: *service-defaults
    # Immich's job queue, and nothing else: BullMQ state that is rebuilt from
    # the database on restart, which is why upstream gives it no volume and
    # why /data here is a tmpfs. A full semver tag where upstream pins the
    # major alone, so that Dependabot has something to move.
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    container_name: sensitive-immich-valkey
    mem_limit: 256m
    memswap_limit: 256m
    user: "999:999"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data:size=64m,uid=999,gid=999
      - /tmp:size=16m
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Paperless-ngx — the document archive (#133)
  # ---------------------------------------------------------------------------
  # Tax returns, insurance, medical records, passports and payslips: on this
  # tier by content rather than by size, and the service ADR-0023 classes as
  # DURABLE — an OCR index can be rebuilt from the originals, and the originals
  # cannot be rebuilt from anything. Three containers: the application, a
  # Postgres of its own and a Valkey broker. Not shared with Immich's (#132),
  # which needs the vector extension and therefore a different image — and one
  # database per service is what lets backup-volumes.sh attribute every volume
  # to the one service that owns it, and stop only that.
  #
  # Reached as https://paperless.matrix.elysium through Caddy, on the existing
  # 50→99 pass for 443 and no new rule. One thing outside this file has to be
  # true first, and it belongs to #404's build rather than to this file: the
  # name needs a host override on morpheus (docs/runbooks/add-a-host-override.md).
  # The certificate is step-ca's, obtained over ACME for the site block of
  # this name in the Caddyfile; the alias on Caddy's network block above is
  # what lets the CA validate it.
  #
  # ROOTLESS, as the operator. The image is s6-overlay over Django and
  # ordinarily starts as root, maps to uid 1000 through USERMAP_UID and drops
  # privilege per process. Upstream also supports `user:` outright — "the
  # container process starts directly as that user with no internal privilege
  # remapping" — and that is the form here, with every capability dropped
  # because nothing is left that would use one. The uid is ${RENDER_UID}, the
  # choice alertmanager and snmp-exporter make in the sibling stack, for the
  # same reason turned around: they READ files render-config.sh wrote, this
  # DELETES files the operator wrote. ./consume below is a bind mount owned by
  # whoever ran `make up`; a scan dropped there by that user over SSH is
  # readable, and removable once consumed, only if the consumer runs as them.
  #
  # DIFFERENCE 10: a CPU ceiling, the first in the estate. #133 is explicit —
  # OCR "will use everything it is given for minutes at a time" — and a backlog
  # scan is the one workload on this box that saturates rather than leaks.
  # `cpus: 4` of the i5-8500T's six is the enforcement; TASK_WORKERS and
  # THREADS_PER_WORKER in .env.example are what Paperless is asked to use, and
  # their product (3) sits under the ceiling so the webserver, the scheduler
  # and Postgres are not throttled by a consumer that is. Throttling is not
  # silent: ContainerCpuThrottled reads the same cgroup counters. Measured on
  # trinity on 2026-09-28 under a synthetic 50-page 300 dpi backlog: 3.0
  # cores at the busiest minute, 9 throttled periods in 4 minutes (0.2 s),
  # and Vaultwarden through Caddy never slower than 19 ms. The product of 3
  # is doing the limiting, and the ceiling is the backstop it was meant to be.
  #
  # DIFFERENCE 11: NOT read_only, where every other long-running container in
  # the estate is. OCR is scratch-heavy — ocrmypdf renders every page to an
  # image under PAPERLESS_SCRATCH_DIR, /tmp by default, and the working set
  # scales with the document — and a tmpfs there is charged to this cgroup's
  # memory.max, so a long scan would arrive as an OOM kill rather than as a
  # slow consume. The writable layer costs nothing to keep, and read_only
  # would have bought a property the memory limit then takes back. Booted from
  # the pinned image as ${RENDER_UID} with cap_drop before this was written;
  # the README carries what that run showed.
  #
  # Memory: 3072m, set before the box existed from upstream's 2 GB floor for
  # the whole install plus room for one document's OCR. Measured on trinity on
  # 2026-09-28: memory.peak 1716 MiB across five one-page scans and a 50-page
  # 300 dpi backlog, no oom_kill — 56 % of the limit, kept rather than cut on
  # one sample, since a longer or denser scan grows the working set. The
  # estate sizes from fourteen days of RSS; re-derive from
  # container_memory_rss once trinity has run a month, the way
  # stacks/observability did for its seven.
  #
  # The healthcheck is the image's own (curl against 8000, which ALLOWED_HOSTS
  # always admits for localhost), written out so check_compose_health.py
  # --probe proves curl is still in the image after a Dependabot bump.
  # start_period covers the migrations and the `document_index reindex
  # --if-needed` the container runs before the webserver listens.
  paperless:
    <<: *service-defaults
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.0@sha256:6b94799bc769a063b3340cc5847402e626d4d91d29a295a8e747f8e9bead4207
    container_name: sensitive-paperless
    # DIFFERENCE 5 again: s6-overlay as PID 1, and the same measured refusal
    # as home-assistant's — booted with the shared default, the container
    # exits at once with "s6-overlay-suexec: fatal: can only run as pid 1".
    init: false
    user: "${RENDER_UID:?run make render}:${RENDER_GID:?run make render}"
    mem_limit: 3072m
    memswap_limit: 3072m
    cpus: 4
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      # The same SOPS value paperless-db reads as POSTGRES_PASSWORD, so the
      # two cannot drift.
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS:?set in secrets/sensitive.sops.yaml}
      # Signs sessions and tokens; rotating it logs everyone out and nothing
      # worse. Paperless refuses to start without it, and the guard turns
      # that refusal into a message naming the file.
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set in secrets/sensitive.sops.yaml}
      # The superuser, created on first start and never touched again by
      # this variable — the GRAFANA_ADMIN_* shape, with the same exposure
      # (`docker inspect` reads it) accepted for the same reason: the
      # alternative is a hand-run createsuperuser nothing converges. TOTP on
      # this account at first login is ADR-0022's floor; the README has the
      # step.
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?set in secrets/sensitive.sops.yaml}
      # Behind Caddy. The URL sets ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS in
      # one go, and the two proxy settings let Django see https and the
      # browser's Host rather than the proxy's — without them every form POST
      # is a CSRF 403. Caddy sets the X-Forwarded-* headers unasked.
      PAPERLESS_URL: ${PAPERLESS_URL:-https://paperless.matrix.elysium}
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE:-America/Los_Angeles}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}
      PAPERLESS_TASK_WORKERS: ${PAPERLESS_TASK_WORKERS:-1}
      PAPERLESS_THREADS_PER_WORKER: ${PAPERLESS_THREADS_PER_WORKER:-3}
    volumes:
      # data: the search index, the classifier, the logs — rebuildable. media:
      # the originals, the archived PDF/A copies and the thumbnails — not.
      # Separate volumes so the backup verifies each by its own sentinel and
      # a restore can bring back the one that matters without the other.
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      # Two directories the repository does not track and render-config.sh
      # creates, owned by the operator: consume is the ingest path — a file
      # dropped here is imported and then deleted — and export is where
      # document_exporter writes the version-portable copy the README's
      # backup section describes. Docker would create both as root if render
      # did not, and a consumer running as ${RENDER_UID} could then delete
      # nothing it consumed.
      - ./consume:/usr/src/paperless/consume
      - ./export:/usr/src/paperless/export
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "-L", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Postgres for Paperless-ngx
  # ---------------------------------------------------------------------------
  # Postgres 18, the major upstream's own compose pins, and the one that moved
  # the data directory: it is /var/lib/postgresql/18/docker now, under a
  # volume mounted one level up at /var/lib/postgresql — so a major-version
  # upgrade gets a sibling directory and pg_upgrade has somewhere to write.
  # Mount the parent, as upstream does; mounting .../data is the pre-18 layout
  # and the image warns about it. backup-volumes.sh's sentinel for this volume
  # carries the major version in its path for that reason, and a bump to 19
  # has to move it — loudly, since the script refuses to write an archive it
  # cannot verify.
  #
  # Runs as 999 — the image's postgres user — from the start, not through the
  # entrypoint's root-then-gosu step, so `cap_drop: [ALL]` has nothing left to
  # take away. A fresh named volume inherits the image's ownership of
  # /var/lib/postgresql (999:999), which is what makes the non-root start
  # work; the two tmpfs mounts are the socket directory and sort scratch, the
  # only places it writes outside the volume. read_only booted and proven on
  # the pinned image, the way the sibling stack's were.
  #
  # 512m for a database whose whole content is metadata about documents — the
  # documents are files under media, not rows. Unmeasured, like the
  # application's: shared_buffers defaults to 128 MB and this is four times it.
  paperless-db:
    <<: *service-defaults
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: sensitive-paperless-db
    user: "999:999"
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0755
      - /tmp:size=64m
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?set in secrets/sensitive.sops.yaml}
    volumes:
      - paperless-db-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paperless", "-d", "paperless"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Valkey for Paperless-ngx — the task broker
  # ---------------------------------------------------------------------------
  # Valkey rather than Redis because upstream's compose moved to it; the
  # variable is still PAPERLESS_REDIS and the protocol is the same. It carries
  # the Celery queue and the cache and nothing else, so it is the one volume in
  # this stack whose loss costs nothing — a consume that was queued is found
  # again on the next start, because the consumer re-scans its directory.
  # `--save 60 1` keeps an RDB anyway, so that SIGTERM — which is what a
  # quiesced backup sends — leaves a dump.rdb for the archive's sentinel.
  #
  # 999 is the image's valkey user; the entrypoint would drop to it from root
  # regardless, so `user:` only makes the drop unnecessary.
  paperless-broker:
    <<: *service-defaults
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: sensitive-paperless-broker
    # DIFFERENCE 5 and 8 again: the image's entrypoint is `tini --
    # docker-entrypoint.sh`, an init of its own, and under docker-init it runs
    # as PID 2 and logs on every start that zombies "will not be re-parented
    # to Tini". One init is enough.
    init: false
    user: "999:999"
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - paperless-broker-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Stirling-PDF — the household's PDF editor (#143, ADR-0063)
  # ---------------------------------------------------------------------------
  # Merge, split, rotate, convert, OCR, sign, compress: what otherwise goes to
  # whichever free PDF website ranks first that week. Paperless keeps
  # documents; this edits them and keeps nothing, and the settings below are
  # how "keeps nothing" is made true rather than hoped.
  #
  # DIFFERENCE 13: the documents are held in memory on purpose. Every upload,
  # every intermediate and every result lives under /tmp, and /tmp is a tmpfs
  # charged to this container's memory.max — so a half-processed P60 is never
  # on a disk, and a restart erases whatever a crashed job left. This is the
  # trade DIFFERENCE 11 refused for Paperless, taken the other way for a
  # different workload: Paperless OCRs a backlog unattended and must not be
  # OOM-killed halfway through it; this OCRs one document while someone
  # watches, and the worst case is that they see an error and try again. The
  # ceiling below is sized for a full tmpfs on top of the measured peak.
  #
  # `exec` on that tmpfs, where Docker's default is noexec, and not by choice.
  # The PDF engine (jpdfium, pdfium over Panama) unpacks its shared libraries
  # into java.io.tmpdir at first use, and the entrypoint pins that to
  # /tmp/stirling-pdf on the java command line, where nothing else can
  # override it. Under noexec the container boots healthy and then every
  # pdfium-backed tool — merge first — answers 500 with "failed to map
  # segment from shared object". Found by running the tools, not the
  # healthcheck, on 2026-09-29. The root filesystem stays read-only, so what
  # exec adds is a place a compromised process could write and run a binary
  # for as long as the container lives, with no capabilities, as uid 1001.
  #
  # Nothing calls home: analytics, PostHog, Scarf and the update check are
  # all off, which the running app confirmed from /api/v1/config/app-config
  # on the same boot, and that boot was on an internal network with no route
  # out. The heap dump the image enables on OOM is turned off too, because a
  # dump of this JVM would contain the document it ran out of memory on,
  # written to /configs, which is a disk.
  #
  # Runs as the image's stirlingpdfuser (1001) from the start. The entrypoint
  # would drop to it from root with setpriv, which needs CAP_SETUID and
  # CAP_SETGID; `user:` makes that drop unnecessary, and the entrypoint takes
  # its non-root branch as written. The one thing that branch gives up is a
  # separate uid for LibreOffice. The Landlock and seccomp sandbox around it
  # still applies without root, and STIRLING_LO_SANDBOX=required makes a
  # kernel that cannot provide it refuse conversions rather than run them
  # unconfined. On the test boot it reported "landlock ABI 8, seccomp active".
  #
  # Memory, measured 2026-09-29 on the pinned image with these options: 790 MiB
  # idle, 1342–1454 MiB peak across a 20- and a 40-page 300 dpi OCR, an RTF
  # conversion through LibreOffice, merge, rotate, split and compress, no
  # oom_kill. The heap is capped at 40 % (about 1.2 GiB), down from the 70 %
  # the entrypoint picks, so the heap, the JVM's off-heap, LibreOffice,
  # tesseract and a full 1 GiB /tmp all fit under 3072m together.
  # Re-derive from container_memory_rss after a month, as for the rest. `cpus: 2`
  # is DIFFERENCE 10 again: an OCR here must not take cores Paperless's
  # ceiling of four is counting on.
  stirling-pdf:
    <<: *service-defaults
    image: stirlingtools/stirling-pdf:3.1.0@sha256:b5b9e400c086e5334a4947a0d7cd589808f743f29267d7f41c18200cf4bc48b4
    container_name: sensitive-stirling-pdf
    # DIFFERENCE 5 and 8 again: the image's entrypoint is `tini --
    # /scripts/init.sh`, an init of its own.
    init: false
    user: "1001:1001"
    mem_limit: 3072m
    memswap_limit: 3072m
    cpus: 2
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # DIFFERENCE 13: the documents.
      - /tmp:size=1g,exec,uid=1001,gid=1001,mode=1777
      # The LibreOffice profile, rebuilt on every start.
      - /home/stirlingpdfuser:size=64m,uid=1001,gid=1001,mode=0700
      # Its own log files. The same lines go to stdout, which is where they
      # are read.
      - /logs:size=64m,uid=1001,gid=1001,mode=0700
      # Three directories the entrypoint insists it can write, and Spring
      # writes default pipeline configs into the first at start, which is fatal
      # on a read-only root. Server-side storage and watched folders are off,
      # so nothing else is ever written to them.
      - /pipeline:size=4m,uid=1001,gid=1001,mode=0700
      - /customFiles:size=4m,uid=1001,gid=1001,mode=0700
      - /storage:size=4m,uid=1001,gid=1001,mode=0700
    environment:
      # The admin, created on the first start against an empty volume and
      # never touched by these variables again, as for PAPERLESS_ADMIN_*. TOTP
      # on this account at first login is ADR-0022's floor. The README has the
      # step.
      SECURITY_ENABLELOGIN: "true"
      SECURITY_INITIALLOGIN_USERNAME: ${STIRLING_ADMIN_USER:-admin}
      SECURITY_INITIALLOGIN_PASSWORD: ${STIRLING_ADMIN_PASSWORD:?set in secrets/sensitive.sops.yaml}
      # Nothing calls home, and nothing phones a URL on a user's behalf.
      SYSTEM_ENABLEANALYTICS: "false"
      SYSTEM_ENABLEPOSTHOG: "false"
      SYSTEM_ENABLESCARF: "false"
      SYSTEM_SHOWUPDATE: "false"
      SYSTEM_ENABLEURLTOPDF: "false"
      SYSTEM_GOOGLEVISIBILITY: "false"
      AIENGINE_ENABLED: "false"
      # The phone-upload QR codes would point a phone at this name, and the
      # phones that could resolve it are the ones that can already open the
      # page. Off rather than half-working.
      SYSTEM_ENABLEMOBILESCANNER: "false"
      SYSTEM_ENABLEMOBILESIGNATURE: "false"
      # An empty CORS list means every origin, with credentials, and not "CORS
      # off". Pinned to the one name. A preflight from any other origin
      # answered 403 on the test boot.
      SYSTEM_FRONTENDURL: https://pdf.matrix.elysium
      SYSTEM_CORSALLOWEDORIGINS: https://pdf.matrix.elysium
      # Stirling deletes a job's files when the job finishes; this is the sweep
      # for the ones a failed job leaves. An hour rather than a day, every ten
      # minutes rather than thirty, and on every start.
      SYSTEM_TEMPFILEMANAGEMENT_MAXAGEHOURS: "1"
      SYSTEM_TEMPFILEMANAGEMENT_CLEANUPINTERVALMINUTES: "10"
      SYSTEM_TEMPFILEMANAGEMENT_STARTUPCLEANUP: "true"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      STIRLING_LO_SANDBOX: required
      # Appended after the image's own JVM flags, and HotSpot takes the last of
      # a repeated flag: no heap dump, and 40 % where the entrypoint would say
      # 70. Both were read back from the running JVM's environment.
      #
      # jpdfium.native.cacheDir (3.0.2, #952): Stirling's PDF engine now unpacks
      # libpdfium.so into ~/.cache and loads it from there. The home tmpfs
      # above is noexec, Docker's default, so the load failed with "failed to
      # map segment from shared object" and the app never started. /tmp is the
      # one tmpfs that is exec on purpose (DIFFERENCE 13), so the library goes
      # there and the home directory stays non-executable.
      JAVA_CUSTOM_OPTS: >-
        -XX:-HeapDumpOnOutOfMemoryError -XX:MaxRAMPercentage=40
        -Djpdfium.native.cacheDir=/tmp/jpdfium
    volumes:
      - stirling-pdf-configs:/configs
      # The entrypoint symlinks this script into /usr/local/bin under
      # `set -e`, which is fatal on a read-only root. It only links the file
      # if it is executable, and /dev/null is not, so the diagnostics
      # shortcuts are skipped and nothing else changes. /usr/local/bin cannot
      # be a tmpfs instead, because gs and unoserver live there.
      - /dev/null:/scripts/stirling-diagnostics.sh:ro
    expose:
      - "8080"
    healthcheck:
      # The image's own, in exec form: curl against the unauthenticated
      # status endpoint. --probe proves curl is still in the image after a
      # bump. Healthy 42 s after start on the test boot, and start_period is
      # the image's own 120 s for a slower first JVM start on trinity.
      test: ["CMD", "curl", "-fs", "--max-time", "10", "http://localhost:8080/api/v1/info/status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Homepage — the household's front page (#137)
  # ---------------------------------------------------------------------------
  # What exists on this tier and where it lives, at https://home.matrix.elysium
  # — the entry point for the people who live here, as
  # docs/runbooks/successor-handover.md is for whoever runs it next. A
  # directory, not a status page: homepage/settings.yaml says why there are no
  # status dots, and homepage/services.yaml which tiles read live numbers and
  # why the rest are links. The four YAML files are the whole configuration,
  # in the repository and mounted read-only; nothing about the page lives in a
  # database or a volume, so there is nothing to back up and no sentinel.
  #
  # NO DOCKER SOCKET, although upstream's example mounts one for its container
  # integration. A read-only mount of docker.sock is still the full Docker API
  # — root on trinity, and every volume on this tier — handed to a page with
  # no login at all (ADR-0022 re-accepts the SSO deferral for it on exactly
  # that basis). Container state is what the Alloy agent already reports.
  #
  # As the operator, like Paperless: the mounted files are the checkout's,
  # readable by whoever ran `make up`. With `user:` set the entrypoint's
  # PUID/PGID branch is never taken — it chowns nothing and execs node as
  # given — so nothing needs a capability and all are dropped.
  #
  # Read-only root, and the two places the image writes, both found by running
  # the pinned image with exactly these options on trinity (2026-09-28):
  # /app/config, which does not exist in the image — the entrypoint would
  # `ln -s /config /app/config` on the root filesystem if it were missing,
  # and Homepage copies its sample of any config file that is missing into it,
  # some at start and the rest on the first page load — and Next.js's cache
  # under /app/.next. Both tmpfs; the five config files that render are
  # single-file mounts over the first, and bookmarks.yaml is among them for a
  # reason the first deploy found: without it the sample was served, three
  # links to GitHub, Reddit and YouTube on the household's page. custom.css is
  # the Tokyo Night theme, mounted for the same reason. The samples still
  # copied — custom.js (empty), docker, kubernetes, proxmox — configure
  # integrations this page does not use, and render nothing. `make up` pins
  # the mounts' inodes through check_mounted_config.py like every other one
  # (#355). LOG_TARGETS
  # keeps logs on stdout, where every other container's are, rather than in a
  # logs/ directory under the tmpfs. `docker diff` after serving the page and
  # every widget showed nothing written but those mount points; CapEff 0.
  #
  # The widget credentials are three SOPS values handed in as HOMEPAGE_VAR_*,
  # the prefix Homepage substitutes into services.yaml as {{HOMEPAGE_VAR_…}},
  # and each is scoped read-only at the service that issued it
  # (secrets/sensitive.example.yaml has the steps). The widgets call the
  # tier's public names, which resolve to Caddy on this network through its
  # aliases; NODE_EXTRA_CA_CERTS is the tier's root, the same file Caddy
  # mounts, so Node trusts step-ca's leaves. Since #764 it is a bundle of that
  # root and the estate CA, which the ingest proxy's leaf chains to, because
  # Node reads one file; render-config.sh writes it. Measured the same day: with
  # placeholder tokens Immich and Paperless each answered 401 through Caddy —
  # name, TLS and Host all good — and Prometheus answered from 10.0.99.20:9090,
  # the /24 this host shares with it. Since #182 that port is the estate's
  # ingest proxy, and the Prometheus widgets send the reader token; since #764
  # they ask it over https, verified by the bundle below.
  #
  # HOMEPAGE_ALLOWED_HOSTS is the Host check on Homepage's API; any other Host
  # gets a 400. Loopback on 3000 is always admitted, which is what the
  # healthcheck below relies on.
  #
  # 256m: 101 MiB and 12 tasks after serving the page and all three widgets.
  # A ceiling for a leak, not a size. No depends_on, for Vaultwarden's reason.
  homepage:
    <<: *service-defaults
    image: ghcr.io/gethomepage/homepage:v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
    container_name: sensitive-homepage
    user: "${RENDER_UID:?run make render}:${RENDER_GID:?run make render}"
    mem_limit: 256m
    memswap_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /app/config:size=4m,uid=${RENDER_UID:?run make render},gid=${RENDER_GID:?run make render},mode=0700
      - /app/.next/cache:size=64m,uid=${RENDER_UID:?run make render},gid=${RENDER_GID:?run make render}
      - /tmp:size=16m
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.matrix.elysium
      LOG_TARGETS: stdout
      NODE_EXTRA_CA_CERTS: /etc/homepage/ca-bundle.pem
      HOMEPAGE_VAR_IMMICH_API_KEY: ${HOMEPAGE_IMMICH_API_KEY:?set in secrets/sensitive.sops.yaml}
      HOMEPAGE_VAR_PAPERLESS_TOKEN: ${HOMEPAGE_PAPERLESS_TOKEN:?set in secrets/sensitive.sops.yaml}
      # The estate's Prometheus reader token (#182). services.yaml sends it
      # from the five widgets that read 10.0.99.20:9090.
      HOMEPAGE_VAR_PROMETHEUS_TOKEN: ${HOMEPAGE_PROMETHEUS_TOKEN:?set in secrets/sensitive.sops.yaml}
    volumes:
      - ./homepage/settings.yaml:/app/config/settings.yaml:ro
      - ./homepage/services.yaml:/app/config/services.yaml:ro
      - ./homepage/widgets.yaml:/app/config/widgets.yaml:ro
      - ./homepage/bookmarks.yaml:/app/config/bookmarks.yaml:ro
      - ./homepage/custom.css:/app/config/custom.css:ro
      - ./.rendered/homepage-ca.pem:/etc/homepage/ca-bundle.pem:ro
    expose:
      - "3000"
    healthcheck:
      # The image's own HEALTHCHECK, written out with the port literal where
      # the image's uses $PORT in a shell form. busybox wget; --probe proves
      # it is in the image.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Miniflux — the feed reader (#147), the first of the tier extras
  # ---------------------------------------------------------------------------
  # Beyond ADR-0008's nine, so decided before it was authored: ADR-0057 has
  # the placement, the steady outbound traffic this puts on VLAN 99, and why
  # the admin account carries no second factor. Everything below was measured
  # on the pinned image on 2026-09-29, booted with exactly these options
  # against the pinned Postgres.
  #
  # The image's own user, 65534, and no `user:` line: it is a static Go
  # binary in a distroless-shaped image that writes nothing to disk. Read-only
  # root with no tmpfs at all — `docker diff` after migrations, admin creation
  # and a restart showed only docker-init's mount point. 13 MiB idle; 256m is
  # room for WORKER_POOL_SIZE's sixteen fetches in flight, and a ceiling for
  # a leak rather than a size.
  #
  # The healthcheck is the binary's own `-healthcheck auto`, which calls
  # /healthcheck on LISTEN_ADDR; the image has no shell, curl or wget, and
  # --probe proves the flag is still there after a Dependabot bump.
  miniflux:
    <<: *service-defaults
    image: miniflux/miniflux:2.3.3@sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb
    container_name: sensitive-miniflux
    mem_limit: 256m
    memswap_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    depends_on:
      miniflux-db:
        condition: service_healthy
    environment:
      # The same SOPS value miniflux-db reads as POSTGRES_PASSWORD, so the two
      # cannot drift. libpq's keyword form rather than a postgres:// URL, so
      # it folds under yamllint's line length; either way the password is
      # spliced into a connection string, which is why the example file says
      # `make gen-secret` and never a typed value — its output is
      # alphanumeric, and a space or a quote would change what the string
      # says rather than what the password is.
      DATABASE_URL: >-
        host=miniflux-db dbname=miniflux user=miniflux sslmode=disable
        password=${MINIFLUX_DBPASS:?set in secrets/sensitive.sops.yaml}
      RUN_MIGRATIONS: "1"
      # The admin, created on first start and skipped on every start after
      # ("Skipping admin user creation because it already exists", measured):
      # the PAPERLESS_ADMIN_* shape, with the same `docker inspect` exposure
      # accepted for the same reason. Rotating the SOPS value does NOT change
      # the password — the README has the command that does.
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:?set in secrets/sensitive.sops.yaml}
      BASE_URL: ${MINIFLUX_URL:-https://miniflux.matrix.elysium}
      LISTEN_ADDR: 0.0.0.0:8080
      # The REST API authenticates with the admin's own password over basic
      # auth — measured: /v1/me answered 200 to it — so it is a second door
      # to the same account that nothing here uses. Off, it answers a redirect
      # to the login page. The Fever and Google Reader APIs are separate,
      # per-user, off until someone turns them on in Settings › Integrations,
      # and ADR-0057 decision 5 is what turning them on means.
      DISABLE_API: "1"
      # Stated rather than defaulted, because it is the property ADR-0057
      # decision 4 rests on: the fetcher refuses any address in a private,
      # loopback or link-local range, checked at dial time after DNS —
      # measured against miniflux-db by name and against localhost, both
      # refused. On VLAN 99 that is the gateway, step-ca and every host on
      # Winterfell that a feed URL cannot be pointed at.
      FETCHER_ALLOW_PRIVATE_NETWORKS: "0"
      INTEGRATION_ALLOW_PRIVATE_NETWORKS: "0"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Postgres for Miniflux
  # ---------------------------------------------------------------------------
  # paperless-db's shape line for line, for its reasons: the image's own
  # postgres user, read-only root with the socket directory and sort scratch
  # on tmpfs, and the PG18 layout under /var/lib/postgresql. Its own
  # container rather than a database in Paperless's, so that a restore of one
  # service never has to reason about the other (ADR-0057). Miniflux does not
  # support SQLite; this is its one dependency.
  #
  # One departure from paperless-db: PGDATA names the cluster directory
  # ./18/miniflux rather than the image's ./18/docker. The two volumes were
  # otherwise laid out identically, so backup-volumes.sh could not tell one
  # archive from the other and refused to run at all (its sentinel table
  # forbids a shared sentinel). Set before the volume was ever created on
  # trinity, so nothing moves. Measured on the pinned image on 2026-09-29,
  # under exactly these options: initdb writes ./18/miniflux/PG_VERSION, the
  # server reports that data_directory, and pg_isready answers. A move to 19
  # is a sibling ./19/miniflux, the way ./19/docker would be.
  #
  # 512m, paperless-db's number: 42 MiB after migrations, and shared_buffers
  # defaults to 128 MB. The content is every stored entry, which the image's
  # cleanup job archives after 60 days read and 180 unread.
  miniflux-db:
    <<: *service-defaults
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: sensitive-miniflux-db
    user: "999:999"
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0755
      - /tmp:size=64m
    environment:
      POSTGRES_DB: miniflux
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${MINIFLUX_DBPASS:?set in secrets/sensitive.sops.yaml}
      PGDATA: /var/lib/postgresql/18/miniflux
    volumes:
      - miniflux-db-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux", "-d", "miniflux"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Mealie — the household's recipes (#146, ADR-0060)
  # ---------------------------------------------------------------------------
  # Beyond ADR-0008's nine, so decided before it was authored, and a service
  # people other than the operator open on purpose, from a phone in the kitchen. Hence
  # a name that says what it is for, https://recipes.matrix.elysium, the way
  # Homepage's is `home` rather than `homepage`. Vaultwarden's shape otherwise:
  # `expose:` and no `ports:`, reached from Hicks only through Caddy's 443.
  #
  # Root with EVERY capability dropped, for DIFFERENCE 2's measured reason: in
  # the pinned image /app/data is 0:0 755, so a named volume mounted there is
  # root's, and a non-root Mealie cannot create its own database. The
  # entrypoint (/app/run.sh) would otherwise usermod, `chown -R /app` and gosu
  # to 911 — three capabilities' worth of work. PUID=0 and PGID=0 match the
  # uid it is already running as, which is the script's own branch for "no
  # switch needed", so none of that runs and no capability is asked for.
  # Measured on the pinned image with exactly these options on 2026-09-29: it
  # came up healthy, created the database, answered a login and imported
  # three recipes by URL, and `docker diff` showed nothing written outside
  # /app/data. Re-check the premise when the image moves:
  #
  #   docker run --rm --entrypoint stat <mealie image> -c '%u:%g %a' /app/data
  #
  # SQLite, not Postgres: one household's recipes are a few megabytes, and a
  # database container would be a second thing to back up for no gain. The
  # database is in rollback-journal mode (`PRAGMA journal_mode` reads
  # `delete`), so there is no -wal whose absence would lose the last writes.
  #
  # No SOPS secret. The token-signing secrets (.secret, .session_secret) are
  # generated into /app/data on the first start and travel with the volume's
  # backup; the admin password is a bcrypt hash in the database, set at the
  # first login (build-the-sensitive-tier-host.md §10). The way back in
  # without it is the image's own script, run against the live container —
  # proved on a scratch boot, the old password answering 401 afterwards:
  #
  #   docker exec -it sensitive-mealie python3 \
  #     /opt/mealie/lib/python3.14/site-packages/mealie/scripts/change_password.py
  #
  # ALLOW_SIGNUP is false from the first start: POST /api/users/register then
  # answers 403 "User Registration is Disabled", measured. Household accounts
  # are made by the admin, or by invitation link from the admin's group. No
  # second factor exists to enrol — ADR-0060 names Mealie beside Immich and
  # AdGuard under ADR-0022's floor. SMTP, LDAP, OIDC and OpenAI stay unset.
  #
  # URL import reaches out: the server fetches the page the user pasted, over
  # Winterfell's existing egress (ADR-0060). It never reaches in. Every fetch
  # goes through Mealie's safehttp transport, which resolves the name and
  # refuses private, loopback, link-local, reserved and CGNAT addresses at
  # connect time. Measured: an import of a recipe page served from this
  # network, by name and by address, and of 127.0.0.1, 10.0.99.1,
  # 10.0.99.20:9090 and 169.254.169.254, each failed `InvalidDomainError`
  # with no request arriving. The same page imported once its host was on
  # HTTP_ALLOW_LIST. That list is the only thing between a pasted URL and the
  # rest of Winterfell, so it is written out empty below rather than
  # defaulted, as Miniflux's FETCHER_ALLOW_PRIVATE_NETWORKS is.
  #
  # 1024m: 224 MiB idle on the pinned image, 396 MiB at the peak of three URL
  # imports back to back. Two and a half times the peak, to bound a leak
  # rather than to size. No depends_on, for Vaultwarden's reason.
  mealie:
    <<: *service-defaults
    image: ghcr.io/mealie-recipes/mealie:v3.28.0@sha256:8b02290f4d1806f02acac6f25f6d48a3c965612fda1f8e914d5af533276f8688
    container_name: sensitive-mealie
    mem_limit: 1024m
    memswap_limit: 1024m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    environment:
      PUID: "0"
      PGID: "0"
      BASE_URL: https://recipes.matrix.elysium
      ALLOW_SIGNUP: "false"
      DB_ENGINE: sqlite
      HTTP_ALLOW_LIST: ""
      TZ: ${MEALIE_TZ:-America/Los_Angeles}
    volumes:
      - mealie-data:/app/data
    expose:
      - "9000"
    healthcheck:
      # The image's own script: curl against /api/app/about on its own port.
      # curl ships in the image, and check_compose_health.py --probe proves it.
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # linkding — the household's bookmarks (#144, ADR-0061)
  # ---------------------------------------------------------------------------
  # One process and one SQLite file. Beyond ADR-0008's list, and placed here
  # by that ADR's own test: a bookmark collection is a browsing history by
  # another name. The plain image, not `-plus`: that variant adds Chromium to
  # archive pages, which ADR-0061 leaves to a different service if it is ever
  # wanted.
  #
  # Root with four capabilities, and then not root at all. The image's
  # bootstrap.sh runs as root: it creates the data tree, runs the migrations,
  # creates the superuser, `chown -R www-data:` the volume, and execs uwsgi,
  # whose uwsgi.ini drops to www-data (33). Every process that serves a
  # request runs as 33 with CapEff 0, read from /proc on the pinned image. The
  # four are what the root half needs, each measured by taking it away:
  #
  #   SETUID, SETGID   uwsgi's drop to 33. Without them: "setgid(): Operation
  #                    not permitted", exit 1.
  #   CHOWN            the chown of the volume. /etc/linkding/data is 0:0 755
  #                    in the image, so a fresh named volume is root's.
  #   DAC_OVERRIDE     the SECOND start. Once the tree is 33's, root without it
  #                    cannot write db.sqlite3, and `migrate` fails with
  #                    "attempt to write a readonly database" — and bootstrap.sh
  #                    has no `set -e`, so uwsgi starts anyway and the
  #                    healthcheck passes over a migration that never ran. The
  #                    first image bump that shipped one would have gone green.
  #
  # `user: 33` from the start needs none of them and boots clean, but only on a
  # volume that is already 33's; a fresh one is root's, and a seed step that
  # chowns it is the hand-run command DIFFERENCE 2 turns down. Re-check the
  # premise when the image moves:
  #
  #   docker run --rm --entrypoint stat <linkding image> -c '%u:%g %a' /etc/linkding/data
  #
  # LD_DISABLE_BACKGROUND_TASKS: the task runner exists to fetch favicons and
  # preview images, which is a request from trinity to a third party for every
  # site bookmarked — the list this tier is holding back from the network,
  # handed out one hostname at a time. Off, and the list shows no icons.
  # Adding a bookmark still fetches that page's title and description, from
  # the site itself, which the browser adding it has just visited.
  #
  # No LD_CSRF_TRUSTED_ORIGINS. Measured: a login POST with Origin
  # https://links.matrix.elysium and the X-Forwarded-Proto Caddy sets is
  # accepted without it.
  #
  # 512m: 77 MiB idle, 188 MiB peak importing 3,000 bookmarks from a Netscape
  # file. Bounds a leak rather than sizing. No depends_on, for Vaultwarden's
  # reason.
  linkding:
    <<: *service-defaults
    image: sissbruecker/linkding:1.47.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
    container_name: sensitive-linkding
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # uwsgi's pidfile, and nothing else: `docker diff` after two boots
      # showed no write outside the volume.
      - /tmp:size=16m
    environment:
      LD_DISABLE_BACKGROUND_TASKS: "True"
      # The superuser, created on first start and never touched again by
      # these variables — Paperless's shape, with the same `docker inspect`
      # exposure accepted. linkding has no second factor; ADR-0061 says what
      # stands in for one.
      LD_SUPERUSER_NAME: ${LINKDING_SUPERUSER_NAME:-admin}
      LD_SUPERUSER_PASSWORD: ${LINKDING_SUPERUSER_PASSWORD:?set in secrets/sensitive.sops.yaml}
    volumes:
      - linkding-data:/etc/linkding/data
    expose:
      - "9090"
    healthcheck:
      # The image's own, with the port literal: curl against /health.
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Actual — the household's budget (#142, ADR-0062)
  # ---------------------------------------------------------------------------
  # The fifth service here beyond ADR-0008's nine, after Miniflux, Memos,
  # Mealie and linkding, and decided by ADR-0062.
  # Actual is local-first: every client holds the whole budget and this is
  # the sync target between them, so the server being down stops syncing
  # and nothing else. It is still the one copy that is backed up.
  #
  # As the image's own `actual` user, 1001:1001. The image declares no USER
  # and would run node as root, but it ships that user and /data is owned by
  # it (1001:1001 755), so a named volume mounted there inherits that on first
  # use. The user is set here rather than left as root with capabilities
  # dropped, which is what Vaultwarden does because its image offers no user.
  #
  # Read off 26.9.0-alpine on 2026-09-29 with exactly these options:
  #   - read-only root, no capabilities, as 1001: it came up healthy, and
  #     `docker diff` showed nothing at all written outside /data. So there
  #     is no tmpfs beyond the anchor's /tmp.
  #   - /data holds server-files/account.sqlite (the password hash and
  #     sessions) and user-files/ (one encrypted-or-not blob per budget, plus
  #     its sync messages). account.sqlite is in rollback-journal mode, not
  #     WAL: the header's journal bytes read 1 1.
  #   - It booted and answered /health with `--network none`, so nothing is
  #     fetched at start.
  #
  # Re-check the premise when the image moves:
  #
  #   docker run --rm --entrypoint stat <actual image> -c '%u:%g %a' /data
  #
  # If that prints something other than 1001:1001 755, revisit the user line.
  #
  # There is NO password setting. A fresh server is unclaimed until the first
  # client sets one. scripts/seed-actual-password.sh claims it from SOPS with
  # `--network none` before the first start, and `make up` runs it every time.
  # The value is not in this file or in .env: the service never reads it.
  #
  # Password login and nothing else. The image allows password, header and
  # OpenID. Header login takes the password in an x-actual-password header
  # from any "trusted proxy", and that list defaults to all of 10/8,
  # 172.16/12 and 192.168/16. It is unreachable while the only auth row is
  # the password's, and a header attempt was refused with 400 on the pinned
  # image. The two lines make that a setting rather than a property of the
  # database. OpenID is a decision for ADR-0022, not a variable.
  #
  # ACTUAL_TRUSTED_PROXIES is Caddy's fixed address alone, which is the second
  # reader of the pin DIFFERENCE 4 argues. /account/login and /bootstrap
  # allow five failures per client per fifteen minutes (measured: the sixth
  # got 429). With the proxy named, "client" is the phone on Hicks, not Caddy.
  #
  # Bank sync is off by what is absent: GoCardless and SimpleFIN need
  # credentials entered in the app, and without them the server reaches out
  # to no one. Turning it on is a decision (ADR-0062 §4), not a setting.
  #
  # The healthcheck is the image's own script, which the image ships but
  # does not declare as a HEALTHCHECK. It fetches /health on the configured
  # port and exits 1 unless the status is UP. --probe proves node is in the
  # image; that the script is there and passes is what CI's hardened boot
  # proves.
  #
  # 1g: 279 MiB idle RSS, and a high-water mark of 329 MiB after taking a
  # 20 MiB budget upload. Most of it is the web app the server also serves.
  # About three times the peak: a ceiling for a leak, not a size. No
  # depends_on, for Vaultwarden's reason.
  actual:
    <<: *service-defaults
    image: actualbudget/actual-server:26.10.0-alpine@sha256:67b1b5e9584e3e143b4f5c41e52b4506ed9cdd1072392d5ab5369f2d4fd0bffd
    container_name: sensitive-actual
    user: "1001:1001"
    mem_limit: 1g
    memswap_limit: 1g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      ACTUAL_LOGIN_METHOD: password
      ACTUAL_ALLOWED_LOGIN_METHODS: password
      ACTUAL_TRUSTED_PROXIES: 172.28.99.2/32
    volumes:
      - actual-data:/data
    expose:
      - "5006"
    healthcheck:
      test: ["CMD", "node", "src/scripts/health-check.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# DIFFERENCE 4: one network, and it is the point. Every later service joins
# `sensitive` with `expose:` only. Two members have `ports:` — Caddy, and
# AdGuard for the reason DIFFERENCE 7 gives — and a third is undoing
# ADR-0008's containment. The review question for every PR against this file
# is that one line.
#
# The subnet is fixed so that one address on it can be: Caddy's, which Home
# Assistant's `trusted_proxies` names. 172.28.99.0/24 is inside Docker's
# default 172.16/12 pool, so nothing else on trinity changes; outside the two
# subnets the estate routes; and outside the 172.30.30.0/24 ADR-0017 keeps
# unrouted on ifrit, so a 172.28.99.x source in a firewall log still means
# what that ADR says a 172.30.30.x one means — a leak reporting itself.
#
# A fixed subnet alone does not keep Caddy's address free. Docker hands out
# the subnet's addresses from the bottom to whichever container attaches first,
# and Caddy attaches last, because it waits on step-ca's health. On trinity's
# first `make up` (2026-09-28) Vaultwarden had already taken .2, and Caddy failed
# with "Address already in use". The monitoring-host rehearsal passed only
# because it happened to start in a different order. `ip_range` confines
# Docker's own assignments to the top half, so the one pinned address below
# .128 cannot be taken, whatever order the containers start in.
networks:
  sensitive:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.99.0/24
          ip_range: 172.28.99.128/25

volumes:
  caddy-data:
  caddy-config:
  step-ca-data:
  home-assistant-config:
  adguard-work:
  # Immich's metadata: every album, face, tag and the path of every original.
  # The originals are on the USB disk (DIFFERENCE 9); this is the SSD half.
  immich-db:
  # Downloaded ML models and huggingface_hub's chunk cache, about a gigabyte
  # once CLIP and the face model have been fetched. Re-downloadable, so it is
  # the one volume here whose loss costs a few minutes and an internet
  # connection rather than anything — and the one scripts/backup-volumes.sh
  # skips by name, for that reason.
  immich-model-cache:
  paperless-data:
  paperless-media:
  paperless-db-data:
  paperless-broker-data:
  # The database, the RSA key that signs every session token, attachments,
  # Sends and the icon cache. With home-assistant-config, immich-db and
  # paperless-media, one of the volumes here whose loss is a loss of function
  # rather than of a record — docs/runbooks/restore-the-sensitive-tier.md.
  vaultwarden-data:
  # Memos' database, its -wal, and ./assets, every attachment (ADR-0059).
  memos-data:
  # ntfy's user.db and twelve hours of message cache. The first is rebuilt from
  # the environment on every start (DIFFERENCE 12) and the second has already
  # been delivered, so scripts/backup-volumes.sh skips it by name.
  ntfy-data:
  # Every subscription, category, read state and star, and the entries not
  # yet archived. The OPML export in the README is the portable half; this is
  # the whole of it.
  miniflux-db-data:

  # ---------------------------------------------------------------------------
  # Mealie's SQLite database, its two generated token-signing secrets,
  # recipe images and user avatars — everything it has (ADR-0060).
  mealie-data:
  # linkding's database, in WAL mode, and the secretkey.txt that signs its
  # sessions. Favicons and previews would live here too; with background tasks
  # off, those directories stay empty.
  linkding-data:
  # Actual's account.sqlite (the password hash and sessions) and every
  # budget's file and sync messages. Every client holds a copy of the budget,
  # which survives losing this volume but not a bad sync, and so is not a
  # backup of it (ADR-0062).
  actual-data:
  # Stirling-PDF's accounts (an H2 database, TOTP enrolments with it), its
  # generated settings.yml and keys, and the nightly SQL dump it takes of its
  # own database. No document ever lands here — those are DIFFERENCE 13's
  # tmpfs — and everything in it is rebuilt from the environment on an empty
  # volume, so scripts/backup-volumes.sh skips it by name (ADR-0063).
  stirling-pdf-configs:
