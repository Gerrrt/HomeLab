# Mosquitto for the Ring Alarm (ADR-0104). compose.yaml has the reasoning.
#
# One listener, on the internal `mqtt` network only. Every client signs in;
# the password file is built from SOPS on each start, in a tmpfs.
listener 1883
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/config/acl

# Nothing on disk. ring-mqtt republishes discovery and state when Home
# Assistant's birth message arrives, so a restart loses nothing that matters.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
