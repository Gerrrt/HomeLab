---
# Home Assistant's core configuration (#134).
#
# Mounted read-only at /config/configuration.yaml, over the volume that holds
# everything Home Assistant writes for itself — .storage/, the recorder
# database, ip_bans.yaml, .HA_VERSION. So this file is the config that runs,
# reviewed and checked like every other config here, and the volume is state.
#
# What is deliberately NOT here — the container's shape, where the credentials
# live, why there is no `automation: !include automations.yaml` — is argued in
# compose.yaml beside the service, not repeated.

# The standard set: onboarding, the frontend, the automation and script
# engines, the recorder, history, logbook, mobile_app, and the rest.
default_config:

homeassistant:
  # Everything beyond this file lives in packages/, a directory mounted
  # read-only beside it. An empty directory loads as nothing, which is why the
  # split is packages rather than `!include automations.yaml`: that include
  # fails hard when its file is missing, and the file is one Home Assistant
  # writes for its own editor, not one this repository ships. Automations are
  # YAML in that directory, in git, or they do not exist — the UI editor is
  # not used here, for the reason the README gives.
  packages: !include_dir_named packages

# No `http:` block, on purpose. Since 2026.9, Home Assistant keeps its HTTP
# settings in /config/.storage/http and reads this block only once, as a
# pending import it reverts unless promoted within five minutes. From 2027.2 it
# does not read it at all. The settings, above all that Caddy (172.28.99.2) is
# the one proxy it believes, are written straight into that store by
# scripts/seed-ha-http.sh, which `make up STACK=sensitive` runs before any
# container starts.
