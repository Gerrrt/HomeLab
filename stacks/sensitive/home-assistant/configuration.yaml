---
# Home Assistant's core configuration (#134).
#
# Mounted read-only at /config/configuration.yaml, over the volume that holds
# everything Home Assistant writes for itself — .storage/, the recorder
# database, ip_bans.yaml, .HA_VERSION. So this file is the config that runs,
# reviewed and checked like every other config here, and the volume is state.
#
# What is deliberately NOT here — the container's shape, where the credentials
# live, why there is no `automation: !include automations.yaml` — is argued in
# compose.yaml beside the service, not repeated.

# The standard set: onboarding, the frontend, the automation and script
# engines, the recorder, history, logbook, mobile_app, and the rest.
default_config:

homeassistant:
  # Everything beyond this file lives in packages/, a directory mounted
  # read-only beside it. An empty directory loads as nothing, which is why the
  # split is packages rather than `!include automations.yaml`: that include
  # fails hard when its file is missing, and the file is one Home Assistant
  # writes for its own editor, not one this repository ships. Automations are
  # YAML in that directory, in git, or they do not exist — the UI editor is
  # not used here, for the reason the README gives.
  packages: !include_dir_named packages

http:
  # Home Assistant refuses proxied requests unless told who the proxy is —
  # "A request from a reverse proxy was received from …, but your HTTP
  # integration is not set-up for reverse proxies". Caddy is the only thing
  # that reaches 8123 (`expose:`, no `ports:`), and compose.yaml gives it a
  # fixed address on the `sensitive` network for exactly this line. One
  # address rather than the network's subnet, so a sibling container cannot
  # forge X-Forwarded-For and have Home Assistant believe it.
  #
  # Since 2026.9 this block is read ONCE, on the first start against an empty
  # volume. After that, .storage/http in the volume is the config that runs.
  # Home Assistant imports it as a *pending* config and reverts to built-in
  # defaults, with no proxy trusted, unless an admin confirms it within five
  # minutes. After that it ignores this block for good, and it stops reading
  # it entirely in 2027.2. On trinity's first start (2026-09-28) nobody could
  # confirm it in time, so every request through Caddy got a 400. The
  # README's Home Assistant bullets hold the fix, and the fix is the same on
  # any fresh or restored-empty volume. This block stays so that a fresh
  # volume imports these values rather than the defaults.
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.28.99.2
  # Five failed logins from one address bans it. The ban list is written to
  # /config/ip_bans.yaml, in the volume; lifting one is editing that file.
  ip_ban_enabled: true
  login_attempts_threshold: 5
