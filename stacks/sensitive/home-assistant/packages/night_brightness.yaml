---
# Late-night brightness cap: from 20:00 to 06:00, a Hue light that a person
# turns on is held to a low brightness, so a light switched on at 2 a.m. does
# not come on at full.
#
# The idea is CCOSTAN's late_night_brightness_guard
# (github.com/CCOSTAN/Home-AssistantConfig), reworked so no light is named
# here. docs/security.md keeps owner-linked rooms and a child's room out of
# the repository, so the automation watches every Hue light rather than a
# list.
#
# "A person" means the change did not come from an automation or a script.
# Two checks, because the bulbs alone cannot say. A change Home Assistant
# makes on its own behalf carries a parent context; one from the Hue app, a
# Hue switch or the dashboard does not. But when an automation lights a Hue
# room or recalls a scene, only the room or scene entity carries that
# context; the bulbs report their own change from the bridge with none. So a
# bulb is also left alone if any light or scene changed with a parent context
# in the last five seconds, the window in which Home Assistant attaches a
# service call's context to an entity's state. The sunset lights, the
# bedtime script and movie mode are therefore never capped, and this
# automation's own change is never capped again.
#
# The cap is 25%, set here. A helper would start at its minimum on a fresh
# volume, not at 25%.
#
# Only turn-ons are capped. Someone who turns a light on and then raises it
# gets what they asked for.

input_boolean:
  # On pauses the cap, for a late night that wants full light. It is not
  # turned back off automatically.
  night_brightness_cap_paused:
    name: Night brightness cap paused
    icon: mdi:brightness-auto

automation:
  - id: night_brightness_cap
    alias: Night brightness cap
    description: Holds a Hue light a person turns on between 20:00 and 06:00 to the cap.
    # Several lights come on together when a room is switched on.
    mode: parallel
    max: 25
    # Every state change is offered to this automation, because a trigger
    # cannot name "every Hue light" without naming them. The conditions are
    # ordered cheapest first, and almost every event fails the first.
    triggers:
      - trigger: event
        event_type: state_changed
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.entity_id.startswith('light.')
             and trigger.event.data.old_state is not none
             and trigger.event.data.new_state is not none
             and trigger.event.data.old_state.state == 'off'
             and trigger.event.data.new_state.state == 'on' }}
      - condition: template
        value_template: "{{ trigger.event.data.new_state.context.parent_id is none }}"
      - condition: template
        value_template: >-
          {% set recent = now() - timedelta(seconds=5) %}
          {{ (states.light | list + states.scene | list)
             | selectattr('last_updated', '>=', recent)
             | selectattr('context.parent_id', 'ne', none)
             | list | count == 0 }}
      - condition: time
        after: "20:00:00"
        before: "06:00:00"
      - condition: state
        entity_id: input_boolean.night_brightness_cap_paused
        state: "off"
      # A Hue room group is skipped: its member lights change too, and each
      # is capped on its own. A light with no brightness (a smart plug) has
      # no brightness attribute and is skipped too.
      - condition: template
        value_template: >-
          {% set e = trigger.event.data.entity_id %}
          {{ e in integration_entities('hue')
             and not state_attr(e, 'is_hue_group')
             and (trigger.event.data.new_state.attributes.brightness | default(0) | int(0)) > 64 }}
    actions:
      - action: light.turn_on
        target:
          entity_id: "{{ trigger.event.data.entity_id }}"
        data:
          brightness_pct: 25
