---
# When the dogs were last walked and fed, for the office wall's context card
# (ADR-0119). No device knows this, so someone records it, either way:
#
#   - the two buttons below, on a dashboard, for anyone in the house;
#   - an NFC tag, by the leash hook or the food bin, tapped with a phone that
#     has the companion app. Each tag is an entity (`tag.*`) whose state is
#     when it was last scanned; label it `wall_dog_walk` or `wall_dog_feed` in
#     the UI and it counts. The label picks the tags, so none is named here.
#
# The newest of a button press and a labelled tag's scan wins. How long is too
# long is set in the UI, in hours; 0, the default, means not tracked, so the
# wall stays quiet until it is set.
#
# What reaches the wall: two times and two thresholds. Not who pressed or
# scanned, and not the dogs' names.

input_button:
  dogs_walked:
    name: Dogs walked
    icon: mdi:dog-side
  dogs_fed:
    name: Dogs fed
    icon: mdi:bowl-mix

input_number:
  dogs_walk_every_hours:
    name: Walk the dogs every (hours, 0 = not tracked)
    icon: mdi:dog-side
    min: 0
    max: 24
    step: 0.5
    mode: box
  dogs_feed_every_hours:
    name: Feed the dogs every (hours, 0 = not tracked)
    icon: mdi:bowl-mix
    min: 0
    max: 24
    step: 0.5
    mode: box

template:
  - sensor:
      # State: how many of the two are overdue. now() makes it re-evaluate
      # each minute. The wall works out the ages itself from the attributes.
      - name: Wall dogs
        unique_id: wall_dogs
        default_entity_id: sensor.wall_dogs
        icon: mdi:dog
        availability: >-
          {{ states('input_number.dogs_walk_every_hours') | float(0) > 0
             or states('input_number.dogs_feed_every_hours') | float(0) > 0 }}
        state: >-
          {% set ns = namespace(n=0) %}
          {% for button, label, every in [
               ('input_button.dogs_walked', 'wall_dog_walk', 'input_number.dogs_walk_every_hours'),
               ('input_button.dogs_fed', 'wall_dog_feed', 'input_number.dogs_feed_every_hours')] %}
            {% set hours = states(every) | float(0) %}
            {% set last = ([button] + label_entities(label)) | map('states')
                 | map('as_datetime', none) | reject('none') | list %}
            {% if hours > 0 and (not last or now() - (last | max) > timedelta(hours=hours)) %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          walked: >-
            {% set last = (['input_button.dogs_walked'] + label_entities('wall_dog_walk')) | map('states')
                 | map('as_datetime', none) | reject('none') | list %}
            {{ (last | max).isoformat() if last else none }}
          fed: >-
            {% set last = (['input_button.dogs_fed'] + label_entities('wall_dog_feed')) | map('states')
                 | map('as_datetime', none) | reject('none') | list %}
            {{ (last | max).isoformat() if last else none }}
          walk_hours: "{{ states('input_number.dogs_walk_every_hours') | float(0) }}"
          feed_hours: "{{ states('input_number.dogs_feed_every_hours') | float(0) }}"
