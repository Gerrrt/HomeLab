---
# Bedtime, for the adults: the shared rooms go dark and the bedroom drops to a
# warm glow.
#
# A script rather than a scene, because a scene sets states all at once and
# cannot fade. Run it from the dashboard or the phone, or let the timer below
# run it.
#
# The script uses light.evening_lights from lighting.yaml. It leaves the
# connected white-noise machine alone: that one is the child's, and
# kid_bedtime.yaml runs it. The bedroom's own white-noise machine has no
# connection.

script:
  bedtime:
    alias: Bedtime
    icon: mdi:weather-night
    mode: single
    sequence:
      - action: light.turn_off
        target:
          entity_id: light.evening_lights
        data:
          transition: 30
      - action: light.turn_on
        target:
          entity_id: light.bedroom_bedroom
        data:
          brightness_pct: 15
          color_temp_kelvin: 2200
          transition: 30

# The time and the on/off switch for the timer are the household's to set in
# the UI, not in a review. Neither has an `initial`, so Home Assistant
# restores whatever was last set across a restart. On a fresh volume the
# switch starts off, so the timer does nothing until someone turns it on.
input_boolean:
  bedtime_timer:
    name: Bedtime on a timer
    icon: mdi:timer-outline

input_datetime:
  bedtime:
    name: Bedtime
    has_date: false
    has_time: true

automation:
  - id: bedtime_on_a_timer
    alias: Bedtime on a timer
    description: Runs the bedtime script at the set time, while the timer switch is on.
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.bedtime
    conditions:
      - condition: state
        entity_id: input_boolean.bedtime_timer
        state: "on"
    actions:
      - action: script.bedtime
