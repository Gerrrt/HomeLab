---
# Presence: what the house does as the adults come and go.
#
# zone.home counts the people whose phones are home (the two `person`
# entities, each tracked by a phone with the Companion app). Three things
# follow it:
#
#   - Indoor cameras: their Ring motion detection is off while anyone is
#     home and back on once nobody is, so the house is not filmed and
#     alerted on while people are living in it. The doorbell and outdoor
#     cameras are untouched.
#   - Everyone's left (ten minutes after the last phone leaves): the lights
#     go off and the thermostat goes to away.
#   - First one home: the thermostat goes back to its schedule, and after
#     dark the shared rooms' lights come on.
#
# The cameras are reached through the label `indoor_camera_motion`, on the
# indoor cameras' motion-detection switches, set in the UI.
# docs/security.md keeps which camera covers which room out of the
# repository.
#
# Phones are not people. If someone without a tracked phone is home (a
# babysitter with the child, a guest), "Someone else is home" stops the
# everyone's-left and first-home actions. It does not change the cameras:
# with the adults out, motion alerts are often what they want. It is not
# turned back off automatically.
#
# The thermostat's away is the Honeywell integration's: a permanent hold at
# the away temperatures set in the integration's options (61 °F heat by
# default). On a heat pump a large setback costs more to recover than it
# saves, so the away heat temperature should sit only a few degrees under
# the schedule's, set in the UI. The schedule itself is untouched, and
# leaving away returns to it.

input_boolean:
  someone_else_home:
    name: Someone else is home
    icon: mdi:account-child

automation:
  - id: indoor_cameras_follow_presence
    alias: Indoor cameras follow presence
    description: Indoor cameras' Ring motion detection is off while anyone is home, on once nobody is.
    mode: restart
    triggers:
      - trigger: state
        entity_id: zone.home
      # Reconcile after a restart, and when the label is first assigned the
      # next count change catches it.
      - trigger: homeassistant
        event: start
    conditions:
      - "{{ states('zone.home') | is_number }}"
    actions:
      - action: "switch.turn_{{ 'off' if states('zone.home') | int > 0 else 'on' }}"
        continue_on_error: true
        target:
          label_id: indoor_camera_motion

  - id: everyone_left
    alias: Everyone left
    description: Ten minutes after the last phone leaves, lights off and the thermostat to away.
    mode: single
    triggers:
      # Ten minutes, so a phone that drops its location for a moment does not
      # empty the house.
      - trigger: numeric_state
        entity_id: zone.home
        below: 1
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_boolean.someone_else_home
        state: "off"
    actions:
      # Every Hue light that dims, so the Hue smart plugs (lights with on/off
      # only) keep whatever they power. Rooms are turned off through their
      # groups and bulbs alike, which is harmless.
      - action: light.turn_off
        target:
          entity_id: >-
            {{ integration_entities('hue')
               | select('match', 'light\.')
               | reject('is_state_attr', 'supported_color_modes', ['onoff'])
               | list }}
        data:
          transition: 10
      - action: climate.set_preset_mode
        continue_on_error: true
        target:
          entity_id: climate.thermostat
        data:
          preset_mode: away
      - if:
          - condition: state
            entity_id: media_player.tv_room_lg_webos_tv_oled
            state: "on"
        then:
          - action: media_player.turn_off
            continue_on_error: true
            target:
              entity_id: media_player.tv_room_lg_webos_tv_oled

  - id: first_one_home
    alias: First one home
    description: The thermostat back to its schedule, and after dark the shared rooms' lights on.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: zone.home
        above: 0
    conditions:
      # Only an arrival into an empty house, not the second person.
      - "{{ trigger.from_state is not none and trigger.from_state.state == '0' }}"
      - condition: state
        entity_id: input_boolean.someone_else_home
        state: "off"
    actions:
      - if:
          - condition: state
            entity_id: climate.thermostat
            attribute: preset_mode
            state: away
        then:
          - action: climate.set_preset_mode
            continue_on_error: true
            target:
              entity_id: climate.thermostat
            data:
              preset_mode: none
      - if:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        then:
          - action: light.turn_on
            target:
              entity_id: light.evening_lights
            data:
              brightness_pct: 60
              color_temp_kelvin: 2700
              transition: 10
