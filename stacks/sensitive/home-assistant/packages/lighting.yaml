---
# The shared rooms' Hue lights follow the sun: on a little before sunset,
# off at sunrise.
#
# The entity ids are the Hue bridge's room groups, as the hue integration
# named them when the bridge was paired on 2026-09-28. Only the shared rooms
# are named here. docs/security.md keeps owner-linked names and a child's
# room out of the repository, so lights in those rooms are left to the Hue
# app or the UI.

light:
  # One name for "the shared rooms", so bedtime.yaml turns off the same set
  # this file turns on, and a room added later is added once.
  - platform: group
    name: Evening lights
    unique_id: evening_lights
    entities:
      - light.living_room_living_room
      - light.dining_room_dining_room
      - light.tv_room_tv_room

automation:
  # No presence condition. person.* tracks one phone, so "nobody home" would
  # mean "that phone is out", and the rest of the house would sit in the dark.
  - id: evening_lights_on_at_sunset
    alias: Evening lights on at sunset
    description: The shared rooms come on warm and dim, fifteen minutes before sunset.
    mode: single
    triggers:
      - trigger: sun
        event: sunset
        offset: "-00:15:00"
    actions:
      # The TV room is skipped while the TV is on or movie mode holds the
      # room, so a summer sunset after show time does not overwrite its Mood
      # scene. The other shared rooms come on as usual.
      - action: light.turn_on
        target:
          entity_id: >-
            {{ ['light.living_room_living_room', 'light.dining_room_dining_room']
               if is_state('media_player.tv_room_lg_webos_tv_oled', 'on')
               or is_state('input_boolean.movie_mode', 'on')
               else ['light.evening_lights'] }}
        data:
          brightness_pct: 60
          color_temp_kelvin: 2700
          transition: 60

  - id: evening_lights_off_at_sunrise
    alias: Evening lights off at sunrise
    description: Whatever is still on in the shared rooms goes off at sunrise.
    mode: single
    triggers:
      - trigger: sun
        event: sunrise
    actions:
      - action: light.turn_off
        target:
          entity_id: light.evening_lights
        data:
          transition: 60
