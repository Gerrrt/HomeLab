---
# Unit tests for dns.rules.yaml.
#
# AdGuardNotFiltering is the rule these exist for. It carries an `and on (name)`
# join between two probes of the same service, and a join that matches nothing
# is invisible to `promtool check rules` — it parses, loads, reports healthy and
# can never fire. That is #63, and blackbox.test.yaml was written for the same
# hazard in EndpointNameNotResolving.
#
# The four cases below are the four states measured against a real AdGuard Home
# on 2026-09-04, before either rule was written:
#
#                                     liveness   filtering   expected alert
#   healthy, default blocking mode        1           1       none
#   blocklists not loaded                 1           0       AdGuardNotFiltering
#   blocking mode changed to NXDOMAIN     1           0       AdGuardNotFiltering
#   AdGuard stopped                       0           0       AdGuardNotAnswering
#
# The last row is the one the join is for: both probes fail, and only the
# liveness alert may fire. A test that only asserted firing would have passed
# against a rule with no join at all.
#
# `instance` here is 10.0.99.40:53, matching the live targets in
# targets/blackbox-dns.yaml (trinity, since 2026-09-28). They are written the
# same way so that changing one and not the other shows up as a diff rather
# than as two files quietly disagreeing.
rule_files:
  - ../rules/dns.rules.yaml

evaluation_interval: 1m

tests:
  # --- AdGuard stopped -----------------------------------------------------
  # Both probes fail. AdGuardNotAnswering fires; AdGuardNotFiltering must NOT,
  # because the service is not up and "it stopped blocking" is not the repair.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-dns", instance="10.0.99.40:53",
                 name="adguard", check="liveness", role="dns-filter"}'
        values: "0+0x45"
      - series: 'probe_success{job="blackbox-dns", instance="10.0.99.40:53",
                 name="adguard", check="filtering", role="dns-filter"}'
        values: "0+0x45"
    alert_rule_test:
      # `for: 5m` — still pending at four minutes. This asserts the window is
      # there. It was 15m while Unbound fell back to public resolvers; since
      # ADR-0055 there is no fallback, and the rule is critical.
      - eval_time: 4m
        alertname: AdGuardNotAnswering
        exp_alerts: []

      - eval_time: 20m
        alertname: AdGuardNotAnswering
        exp_alerts:
          - exp_labels:
              alertname: AdGuardNotAnswering
              job: blackbox-dns
              instance: "10.0.99.40:53"
              name: adguard
              check: liveness
              role: dns-filter
              component: dns
              severity: critical
              category: availability
            exp_annotations:
              summary: "adguard is not answering DNS — the house cannot resolve outside names"
              description: >-
                Asked directly at 10.0.99.40:53 for five minutes and got no
                valid answer. AdGuard is the only forwarder behind Unbound on
                morpheus (ADR-0055), so outside names are failing for every device
                in the house. Internal matrix.elysium names still resolve from the
                host overrides. Check the container on trinity (make ps
                STACK=sensitive), then re-probe from the exporter. To restore DNS
                before fixing AdGuard, add 1.1.1.1 back under System > General Setup
                > DNS Servers on morpheus, and remove it again afterwards.

      # Silent, and this is the assertion that matters. Asserted well past the
      # 30m `for`, so a missing join could not hide behind a short evaluation.
      - eval_time: 40m
        alertname: AdGuardNotFiltering
        exp_alerts: []

  # --- Alive, and filtering nothing ----------------------------------------
  # The join under test, and the failure the second probe exists for: the
  # blocklists stopped loading, or the blocking mode changed, and every
  # process-level check in the estate stays green. If `and on (name)` ever
  # stops matching, this case goes silent and nothing else in CI notices.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-dns", instance="10.0.99.40:53",
                 name="adguard", check="liveness", role="dns-filter"}'
        values: "1+0x45"
      - series: 'probe_success{job="blackbox-dns", instance="10.0.99.40:53",
                 name="adguard", check="filtering", role="dns-filter"}'
        values: "0+0x45"
    alert_rule_test:
      - eval_time: 20m
        alertname: AdGuardNotFiltering
        exp_alerts: []

      - eval_time: 40m
        alertname: AdGuardNotFiltering
        exp_alerts:
          - exp_labels:
              alertname: AdGuardNotFiltering
              job: blackbox-dns
              instance: "10.0.99.40:53"
              name: adguard
              check: filtering
              role: dns-filter
              component: dns
              severity: warning
              category: availability
            exp_annotations:
              summary: "adguard is answering DNS but no longer blocking anything"
              description: >-
                The service is up — it resolved a real name on the same probe cycle
                — and the canary domain in blackbox/blackbox.yaml came back with a
                real address instead of 0.0.0.0. So the blocklists are not loaded,
                or the blocking mode is no longer Null IP. Check Filters → DNS
                blocklists for a list that has stopped updating. If the canary has
                simply fallen off the list it is on, replace the canary in
                blackbox/blackbox.yaml — do not disable the probe, which is the one
                thing standing between this and three weeks of quiet.

      # The service answers, so the liveness rule has nothing to say. Without
      # this, a rule that fired on either probe would still pass the case above.
      - eval_time: 40m
        alertname: AdGuardNotAnswering
        exp_alerts: []

  # --- Healthy -------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-dns", instance="10.0.99.40:53",
                 name="adguard", check="liveness", role="dns-filter"}'
        values: "1+0x45"
      - series: 'probe_success{job="blackbox-dns", instance="10.0.99.40:53",
                 name="adguard", check="filtering", role="dns-filter"}'
        values: "1+0x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: AdGuardNotAnswering
        exp_alerts: []
      - eval_time: 40m
        alertname: AdGuardNotFiltering
        exp_alerts: []


  # --- UnboundNotAnswering (#841) ---------------------------------------------
  #
  # Unbound down, AdGuard up: Unbound's fault, and only Unbound's rule fires.
  # AdGuardNotAnswering must stay quiet even though Unbound's probe is also
  # check="liveness" in the same job; that is what its name="adguard" is for.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.99.1:53",job="blackbox-dns",module="dns_answers",name="unbound",check="liveness",role="resolver",host="morpheus"}'
        values: "0x20"
      - series: 'probe_success{instance="10.0.99.40:53",job="blackbox-dns",module="dns_answers",name="adguard",check="liveness",role="dns-filter",host="trinity"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: UnboundNotAnswering
        exp_alerts: []
      - eval_time: 7m
        alertname: UnboundNotAnswering
        exp_alerts:
          - exp_labels:
              alertname: UnboundNotAnswering
              instance: 10.0.99.1:53
              job: blackbox-dns
              module: dns_answers
              name: unbound
              check: liveness
              role: resolver
              host: morpheus
              component: dns
              severity: critical
              category: availability
            exp_annotations:
              summary: "Unbound on morpheus is not answering DNS"
              description: >-
                Asked at 10.0.99.1:53 for example.com for five minutes and got no
                valid answer, and AdGuard is not failing its own probe. So the fault
                is the firewall's resolver: Unbound stopped, its forwarding to
                10.0.99.40 broken, or a rule now blocking it. Every device in the
                house resolves through it. Status > Services on morpheus shows
                unbound; Diagnostics > DNS Lookup asks it directly.
      - eval_time: 7m
        alertname: AdGuardNotAnswering
        exp_alerts: []

  # Both down: AdGuard is the cause, Unbound only its symptom. One page, AdGuard's.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.99.1:53",job="blackbox-dns",module="dns_answers",name="unbound",check="liveness",role="resolver",host="morpheus"}'
        values: "0x20"
      - series: 'probe_success{instance="10.0.99.40:53",job="blackbox-dns",module="dns_answers",name="adguard",check="liveness",role="dns-filter",host="trinity"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: UnboundNotAnswering
        exp_alerts: []
      - eval_time: 10m
        alertname: AdGuardNotAnswering
        exp_alerts:
          - exp_labels:
              alertname: AdGuardNotAnswering
              instance: 10.0.99.40:53
              job: blackbox-dns
              module: dns_answers
              name: adguard
              check: liveness
              role: dns-filter
              host: trinity
              component: dns
              severity: critical
              category: availability
            exp_annotations:
              summary: "adguard is not answering DNS \u2014 the house cannot resolve outside names"
              description: >-
                Asked directly at 10.0.99.40:53 for five minutes and got no valid
                answer. AdGuard is the only forwarder behind Unbound on morpheus
                (ADR-0055), so outside names are failing for every device in the
                house. Internal matrix.elysium names still resolve from the host
                overrides. Check the container on trinity (make ps STACK=sensitive),
                then re-probe from the exporter. To restore DNS before fixing AdGuard,
                add 1.1.1.1 back under System > General Setup > DNS Servers on
                morpheus, and remove it again afterwards.

  # AdGuard's probe absent altogether: nothing else would page for the resolver
  # the house uses, so Unbound's rule must fire. The suppression needs AdGuard
  # explicitly failing (`== 0`), and an absent series is not that (#873 review).
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.99.1:53",job="blackbox-dns",module="dns_answers",name="unbound",check="liveness",role="resolver",host="morpheus"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 7m
        alertname: UnboundNotAnswering
        exp_alerts:
          - exp_labels:
              alertname: UnboundNotAnswering
              instance: 10.0.99.1:53
              job: blackbox-dns
              module: dns_answers
              name: unbound
              check: liveness
              role: resolver
              host: morpheus
              component: dns
              severity: critical
              category: availability
            exp_annotations:
              summary: "Unbound on morpheus is not answering DNS"
              description: >-
                Asked at 10.0.99.1:53 for example.com for five minutes and got no
                valid answer, and AdGuard is not failing its own probe. So the fault
                is the firewall's resolver: Unbound stopped, its forwarding to
                10.0.99.40 broken, or a rule now blocking it. Every device in the
                house resolves through it. Status > Services on morpheus shows
                unbound; Diagnostics > DNS Lookup asks it directly.

  # Both healthy: nothing.
  - interval: 1m
    input_series:
      - series: 'probe_success{instance="10.0.99.1:53",job="blackbox-dns",module="dns_answers",name="unbound",check="liveness",role="resolver",host="morpheus"}'
        values: "1x20"
      - series: 'probe_success{instance="10.0.99.40:53",job="blackbox-dns",module="dns_answers",name="adguard",check="liveness",role="dns-filter",host="trinity"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: UnboundNotAnswering
        exp_alerts: []
