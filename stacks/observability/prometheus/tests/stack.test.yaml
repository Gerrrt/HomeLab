---
# Unit tests for stack.rules.yaml.
#
# These two cases moved out of containers.test.yaml with the rule they cover,
# when #81 split the stack rules onto `component: stack`. They are unchanged
# apart from that label — the fixtures, the eval times and the expected
# annotations are what they were, so a green run here means the same thing it
# meant there.
#
# The pairing is the point, and it is the same argument containers.test.yaml
# makes at length: a case that only ever expects silence would pass against a
# rule that can never fire. The firing case proves the expression produces an
# alert for a real input; the quiet case proves it does not produce one for the
# input production actually supplies.
#
# What these do NOT prove: four rules in stack.rules.yaml have no unit test.
# PrometheusConfigReloadFailed, PrometheusRuleEvaluationFailures,
# AlertmanagerNotificationsFailing and LokiIngestionStalled are validated for
# syntax only, which is exactly the standing #63 had.
#
# RemoteWriteJobStale is tested below and needs to be, because the obvious way
# to write it cannot fire for any input. `time() - timestamp(up) > 300` reads
# correctly and is unfireable: an instant selector stops returning a sample
# after the lookback delta, so the difference never reaches the threshold. The
# firing case here is the proof that the form actually shipped does fire, and
# the two quiet cases are the proof that it has not simply been made to fire
# for everything.
rule_files:
  - ../rules/stack.rules.yaml

evaluation_interval: 1m

tests:
  # --- PrometheusSizeRetentionActive: fires when the ceiling engages --------
  # The counter is flat until the size ceiling starts evicting blocks, then it
  # increments once per eviction. One step inside the hour is the whole signal.
  - interval: 1m
    input_series:
      - series: 'prometheus_tsdb_size_retentions_total{instance="localhost:9090",job="prometheus"}'
        values: "0+0x40 1+0x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: PrometheusSizeRetentionActive
        exp_alerts:
          - exp_labels:
              alertname: PrometheusSizeRetentionActive
              instance: localhost:9090
              job: prometheus
              component: stack
              severity: warning
              category: capacity
            exp_annotations:
              summary: "Prometheus is evicting blocks to stay under its size ceiling"
              description: >-
                Retention is now bounded by PROMETHEUS_RETENTION_SIZE rather
                than PROMETHEUS_RETENTION, so history is shorter than 30 days.

  # --- PrometheusSizeRetentionActive: quiet while the ceiling is not bound --
  # This is the production state and the one the rule must not alert on: the
  # counter exists and reads 0 forever. Without this case the rule would pass
  # its test while being wired to a metric that is always absent.
  - interval: 1m
    input_series:
      - series: 'prometheus_tsdb_size_retentions_total{instance="localhost:9090",job="prometheus"}'
        values: "0x70"
      # Time-based eviction runs constantly and by design. If the expression is
      # ever "simplified" onto this counter instead, the rule fires every hour
      # forever, and this case is what catches that.
      - series: 'prometheus_tsdb_time_retentions_total{instance="localhost:9090",job="prometheus"}'
        values: "0+1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: PrometheusSizeRetentionActive
        exp_alerts: []

  # --- RemoteWriteJobStale: fires when a pushing agent goes silent -----------
  # The series arrives every minute for half an hour and then stops, which is
  # what a dead agent looks like from here — not a target reporting 0, just
  # nothing. Five minutes after the last sample the instant selector stops
  # resolving it while count_over_time still sees it in the range, and that
  # difference is the alert. Held past for: 15m, it fires by 50m.
  - interval: 1m
    input_series:
      - series: 'up{job="oracle-metrics",instance="oracle"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: RemoteWriteJobStale
        exp_alerts:
          - exp_labels:
              alertname: RemoteWriteJobStale
              instance: oracle
              job: oracle-metrics
              component: stack
              severity: warning
              category: availability
            exp_annotations:
              summary: "oracle-metrics on oracle has stopped reporting"
              description: >-
                This job arrives by remote_write, so nothing scrapes it and
                InstanceDown cannot see it — it has simply stopped pushing.
                Either the Alloy agent on oracle is down or it cannot reach this
                host. Metrics from it are being lost, not queued.

  # --- RemoteWriteJobStale: quiet while the agent is pushing ----------------
  # The production state. Without this case the rule would pass its test while
  # firing for every healthy agent in the estate.
  - interval: 1m
    input_series:
      - series: 'up{job="oracle-metrics",instance="oracle"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: RemoteWriteJobStale
        exp_alerts: []

  # --- RemoteWriteJobStale: quiet for a pushed target reporting 0 -----------
  # An agent that is alive but whose own scrape of cAdvisor is failing pushes
  # up=0. The series is present, so this rule must stay silent and InstanceDown
  # (up == 0) must be the one that fires — the two rules partition the failure,
  # they do not overlap. Written as a 0 held for the whole range rather than a
  # gap, because it is the presence of the series and not its value that this
  # rule keys on, and a test that used a gap here would pass either way.
  - interval: 1m
    input_series:
      - series: 'up{job="integrations/cadvisor",instance="oracle"}'
        values: "0x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: RemoteWriteJobStale
        exp_alerts: []

  # --- LogEntriesDropped: fires on loss that keeps happening ---------------
  # A counter climbing steadily for well over the hour. That is loss that is
  # still going on, which is the only thing this rule is for.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="oracle-alloy",reason="rate_limited"}'
        values: "0+1x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: LogEntriesDropped
        exp_alerts:
          - exp_labels:
              job: oracle-alloy
              reason: rate_limited
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              summary: "oracle-alloy has been losing log lines to rate_limited for an hour"
              description: >-
                Loki has been rejecting these entries for an hour, so this is not
                the burst an agent restart produces — that lasts minutes and
                clears. Ask Loki which limit it is applying with `sum by (reason)
                (loki_discarded_samples_total)`. An entry older than
                reject_old_samples_max_age or a stream too far behind means an
                agent is replaying rather than tailing; rate_limited means the
                estate is producing more than the ingester accepts.

  # --- LogEntriesDropped: quiet for an agent-restart burst ------------------
  # THE CASE THIS RULE WAS RESHAPED AROUND (#341). A restart replay is ONE step
  # in the counter — 33,231 entries in a single jump, measured on 09-04 — after
  # which the counter is flat. rate() over 15m is positive for fifteen minutes
  # and no longer, so `for: 1h` cannot be satisfied by it.
  #
  # The fixture is a single large jump followed by three hours of flat, which is
  # exactly the shape the live counter had. An earlier version of this rule used
  # `for: 15m` and excluded too_far_behind by name; that silenced one flavour of
  # this event and left the other two to page after every deploy.
  #
  # THE FIXTURE CLIMBS OVER SIX MINUTES RATHER THAN JUMPING ONCE, and that
  # detail is what makes this a real test. A replay is not instantaneous: the
  # agent pushes for as long as it takes to drain the backlog, so the counter
  # rises across several scrapes. rate()[15m] is then positive for the climb
  # plus fifteen minutes — about twenty here — which IS enough to satisfy
  # `for: 15m` and is nowhere near an hour.
  #
  # A single-step fixture proves nothing, and the first draft of this case was
  # one: the rate from one step is positive for exactly the window length, one
  # minute short of `for: 15m`, so it passed under both forms.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="oracle-alloy",reason="greater_than_max_sample_age"}'
        values: "0x5 0+6646x5 33231x170"
    alert_rule_test:
      - eval_time: 25m
        alertname: LogEntriesDropped
        exp_alerts: []
      # And still quiet once the burst has aged out, which is the steady state
      # after any redeploy.
      - eval_time: 170m
        alertname: LogEntriesDropped
        exp_alerts: []

  # --- LogEntriesDropped: quiet on a flat counter --------------------------
  # The production state. The counter EXISTS for every agent — five reasons per
  # loki.write component, all at zero — so a rule keyed on presence rather than
  # on movement would fire permanently for a healthy estate.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="oracle-alloy",reason="rate_limited"}'
        values: "0x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: LogEntriesDropped
        exp_alerts: []

  # --- JournalSourceStopped: fires on a reader that has stopped -------------
  # A counter that advanced and then went flat, which is the failure #194 was
  # filed about: the agent is up, the component is healthy, and no journal
  # entry is being read. The counter must be non-flat first, because a series
  # that was never anything but flat is indistinguishable from an agent that has
  # only just started.
  - interval: 1m
    input_series:
      - series: 'loki_source_journal_target_lines_total{job="prometheus-alloy",component_id="loki.source.journal.journal"}'
        values: "0+2x60 120x240"
    alert_rule_test:
      - eval_time: 300m
        alertname: JournalSourceStopped
        exp_alerts:
          - exp_labels:
              job: prometheus-alloy
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              summary: "prometheus-alloy has read no journal entries for two hours"
              description: >-
                The agent is up and publishing metrics, so this is not an outage
                — its journal reader has stopped. The quietest host in the estate
                still produces about three entries an hour, so zero is a fault
                rather than a quiet night. Check the reader's position file in
                the alloy-data volume and whether /var/log/journal is still
                mounted.

  # --- JournalSourceStopped: quiet for the quietest host in the estate -------
  # `Saruman` reads about 3 entries an hour, which over a 1h rate window is a
  # number very close to zero without being zero. This is the case that decides
  # whether the threshold is honest: a rule written as `< 1` or `< 5` per hour
  # would fire for a host that is working correctly, which is why the expression
  # asserts `== 0` and this fixture is deliberately as slow as the real thing.
  - interval: 1m
    input_series:
      - series: 'loki_source_journal_target_lines_total{job="Saruman-alloy",component_id="loki.source.journal.journal"}'
        values: "0+1x300"
    alert_rule_test:
      - eval_time: 290m
        alertname: JournalSourceStopped
        exp_alerts: []
