---
# Unit tests for stack.rules.yaml.
#
# These two cases moved out of containers.test.yaml with the rule they cover,
# when #81 split the stack rules onto `component: stack`. They are unchanged
# apart from that label — the fixtures, the eval times and the expected
# annotations are what they were, so a green run here means the same thing it
# meant there.
#
# The pairing is the point, and it is the same argument containers.test.yaml
# makes at length: a case that only ever expects silence would pass against a
# rule that can never fire. The firing case proves the expression produces an
# alert for a real input; the quiet case proves it does not produce one for the
# input production actually supplies.
#
# What these do NOT prove: three rules in stack.rules.yaml have no unit test.
# PrometheusConfigReloadFailed, PrometheusRuleEvaluationFailures and
# LokiIngestionStalled are validated for syntax only, which is exactly the
# standing #63 had. AlertmanagerNotificationsFailing gained its test the day
# after it fired for real with a reason nobody had expected (#407).
#
# RemoteWriteJobStale is tested below and needs to be, because the obvious way
# to write it cannot fire for any input. `time() - timestamp(up) > 300` reads
# correctly and is unfireable: an instant selector stops returning a sample
# after the lookback delta, so the difference never reaches the threshold. The
# firing case here is the proof that the form actually shipped does fire, and
# the two quiet cases are the proof that it has not simply been made to fire
# for everything.
#
# ScrapeTargetDisappeared was added by #256 and is the mirror of that rule for
# the one host this estate PULLS. Its four cases were mutation-tested on
# 2026-09-17, against a copy of the rules, each mutation asserted to apply
# before being run — #189's trap is a mutation that silently fails and looks
# exactly like a rule that cannot be broken. All four were killed:
#
#   ScrapeTargetDisappeared  unless -> and;  [24h] -> [5m];
#                            drop the job="node" selector;  for: 15m -> 0m
#
# The last one SURVIVED on the first attempt, and that is worth recording rather
# than quietly fixing. Three cases and a firing assertion at 60m cannot tell
# `for: 15m` from `for: 0m` — by 60m the alert has been firing for 25 minutes
# either way. The `eval_time: 40m` pairing under the firing case is what kills
# it: the series ends at 30m, ages out of the instant selector at 35m, and is
# pending until 50m. A green run without that assertion was proving less than it
# appeared to.
#
# The silence cases at the end (#575) are the expiry shape blackbox.test.yaml
# uses: time() in a test is seconds since the start of the test, so a
# timestamp is written as an absolute small number chosen to come out whole
# at the eval time — 266400 is "three days from 2h", and a negative startsAt
# is simply "before the epoch", twenty days before it for the silence that has
# stood long enough to earn its notice. The 59m evaluation is the `for: 1h`
# pin; without it a `for: 0m` mutation would survive. The fixture with no
# `issue` label at all is how `{issue=""}` is exercised, because Prometheus
# drops an empty label and a fixture written as issue="" would test a series
# that cannot exist.

rule_files:
  - ../rules/stack.rules.yaml

evaluation_interval: 1m

tests:
  # --- PrometheusSizeRetentionActive: fires when the ceiling engages --------
  # The counter is flat until the size ceiling starts evicting blocks, then it
  # increments once per eviction. One step inside the hour is the whole signal.
  - interval: 1m
    input_series:
      - series: 'prometheus_tsdb_size_retentions_total{instance="localhost:9090",job="prometheus"}'
        values: "0+0x40 1+0x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: PrometheusSizeRetentionActive
        exp_alerts:
          - exp_labels:
              alertname: PrometheusSizeRetentionActive
              instance: localhost:9090
              job: prometheus
              component: stack
              severity: warning
              category: capacity
            exp_annotations:
              summary: "Prometheus is evicting blocks to stay under its size ceiling"
              description: >-
                Retention is now bounded by PROMETHEUS_RETENTION_SIZE rather
                than PROMETHEUS_RETENTION, so history is shorter than 30 days.

  # --- AlertmanagerNotificationsFailing: fires, and names the reason ---------
  # The fixture is the 2026-09-08 incident: the webhook integration reachable
  # and refusing with 429 for the day's quota. The point of the case is the
  # rendered summary — `reason` must come through, because it is the label
  # that told the two failure modes apart on the night and nothing else did.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{instance="alertmanager:9093",job="alertmanager",integration="webhook",reason="rateLimited"}'
        values: "0+0x10 1+1x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              alertname: AlertmanagerNotificationsFailing
              instance: alertmanager:9093
              job: alertmanager
              integration: webhook
              reason: rateLimited
              component: stack
              severity: critical
              category: correctness
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#reading-the-failure"
              summary: "Alertmanager cannot deliver via webhook: rateLimited"
              description: >-
                Alerts are firing but not reaching anyone — this makes every other
                rule in this repository silently useless. Read the reason before
                the URL: rateLimited means the destination answered and refused
                (ntfy.sh's daily quota, #407), clientError or serverError means it
                answered with an error, and contextDeadlineExceeded means it did
                not answer at all. This alert travels the same path it reports on,
                so if it reached you, at least one receiver still works — and being
                critical it goes to `urgent`, whose ntfy.sh copy reaches a phone
                even when the in-house ntfy is the thing failing (#136).

  # --- AlertmanagerNotificationsFailing: quiet on a flat counter ------------
  # Alertmanager exports this counter for every integration it knows, at zero,
  # forever. A rule written as `> 0` on the counter itself rather than on its
  # increase would be fine here and wrong the first time any receiver ever
  # failed once, months ago; this case is what pins the increase() form.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{instance="alertmanager:9093",job="alertmanager",integration="webhook",reason="rateLimited"}'
        values: "3x40"
      - series: 'alertmanager_notifications_failed_total{instance="alertmanager:9093",job="alertmanager",integration="email",reason="other"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  # --- PrometheusSizeRetentionActive: quiet while the ceiling is not bound --
  # This is the production state and the one the rule must not alert on: the
  # counter exists and reads 0 forever. Without this case the rule would pass
  # its test while being wired to a metric that is always absent.
  - interval: 1m
    input_series:
      - series: 'prometheus_tsdb_size_retentions_total{instance="localhost:9090",job="prometheus"}'
        values: "0x70"
      # Time-based eviction runs constantly and by design. If the expression is
      # ever "simplified" onto this counter instead, the rule fires every hour
      # forever, and this case is what catches that.
      - series: 'prometheus_tsdb_time_retentions_total{instance="localhost:9090",job="prometheus"}'
        values: "0+1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: PrometheusSizeRetentionActive
        exp_alerts: []

  # --- RemoteWriteJobStale: fires when a pushing agent goes silent -----------
  # The series arrives every minute for half an hour and then stops, which is
  # what a dead agent looks like from here — not a target reporting 0, just
  # nothing. Five minutes after the last sample the instant selector stops
  # resolving it while count_over_time still sees it in the range, and that
  # difference is the alert. Held past for: 15m, it fires by 50m.
  - interval: 1m
    input_series:
      - series: 'up{job="oracle-metrics",instance="oracle"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: RemoteWriteJobStale
        exp_alerts:
          - exp_labels:
              alertname: RemoteWriteJobStale
              instance: oracle
              job: oracle-metrics
              component: stack
              severity: warning
              category: availability
            exp_annotations:
              summary: "oracle-metrics on oracle has stopped reporting"
              description: >-
                This job arrives by remote_write, so nothing scrapes it and
                InstanceDown cannot see it — it has simply stopped pushing.
                Either the Alloy agent on oracle is down, and nothing is being
                collected, or it cannot reach this host, and its metrics wait
                in its write-ahead log and are sent when it can, for a bounded
                time.

  # --- RemoteWriteJobStale: quiet while the agent is pushing ----------------
  # The production state. Without this case the rule would pass its test while
  # firing for every healthy agent in the estate.
  - interval: 1m
    input_series:
      - series: 'up{job="oracle-metrics",instance="oracle"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: RemoteWriteJobStale
        exp_alerts: []

  # --- RemoteWriteJobStale: quiet for a pushed target reporting 0 -----------
  # An agent that is alive but whose own scrape of cAdvisor is failing pushes
  # up=0. The series is present, so this rule must stay silent and InstanceDown
  # (up == 0) must be the one that fires — the two rules partition the failure,
  # they do not overlap. Written as a 0 held for the whole range rather than a
  # gap, because it is the presence of the series and not its value that this
  # rule keys on, and a test that used a gap here would pass either way.
  - interval: 1m
    input_series:
      - series: 'up{job="integrations/cadvisor",instance="oracle"}'
        values: "0x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: RemoteWriteJobStale
        exp_alerts: []

  # --- AlloyDown: fires when a host's agent stops pushing -------------------
  # The 2026-10-07 shape: all three of the host's jobs stop together. The
  # series end at 30m and age out of the instant selector at 35m, after which
  # the alert is pending until 45m. The 40m assertion pins `for: 10m`: without
  # it a `for: 0m` mutation survives, the trap ScrapeTargetDisappeared's
  # header records. Only the self-scrape job is in the result, one alert per
  # host, however many jobs the host was pushing.
  - interval: 1m
    input_series:
      - series: 'up{job="trinity-alloy",instance="trinity"}'
        values: "1x30"
      - series: 'up{job="trinity-metrics",instance="trinity"}'
        values: "1x30"
      - series: 'up{job="integrations/cadvisor",instance="trinity"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 40m
        alertname: AlloyDown
        exp_alerts: []
      - eval_time: 60m
        alertname: AlloyDown
        exp_alerts:
          - exp_labels:
              alertname: AlloyDown
              instance: trinity
              component: stack
              severity: warning
              category: availability
            exp_annotations:
              summary: "Alloy on trinity has stopped reporting"
              description: >-
                Nothing from trinity has arrived for over ten minutes: its
                metrics, its container and journal logs, and on the
                monitoring host the network syslog too. On trinity, run
                `docker ps -a --filter name=alloy`. Exited, with no restart,
                means something stopped it, and nothing is being collected
                while it stays down. Check `docker inspect alloy` for
                FinishedAt and OOMKilled, then `docker start alloy` and confirm
                `/-/ready` on :12345. If it is running, it cannot reach the
                ingest proxy on the monitoring host. Its metrics wait in its
                write-ahead log and are sent when it can, for a bounded time.
                If the host is off, nothing is wrong with Alloy.

  # --- AlloyDown: quiet while the agent is pushing --------------------------
  - interval: 1m
    input_series:
      - series: 'up{job="trinity-alloy",instance="trinity"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: AlloyDown
        exp_alerts: []

  # --- AlloyDown: quiet when one collected job stops and Alloy does not ------
  # A broken cAdvisor or node exporter collector while the agent keeps pushing
  # its own self-scrape is RemoteWriteJobStale's alone. This case is what stops
  # the rule being aggregated per job, which would fire for the cAdvisor job
  # here and duplicate RemoteWriteJobStale. Widening the selector to every
  # pushed job is NOT caught, and need not be: aggregated by instance, any job
  # still reporting keeps the host present, so it is equivalent unless the
  # self-scrape alone stops, which Alloy has no way to do.
  - interval: 1m
    input_series:
      - series: 'up{job="trinity-alloy",instance="trinity"}'
        values: "1x70"
      - series: 'up{job="integrations/cadvisor",instance="trinity"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: AlloyDown
        exp_alerts: []

  # --- ScrapeTargetDisappeared: fires when the target stops being a target --
  # The mirror of the RemoteWriteJobStale case above, and the same fixture
  # shape for the same reason: the series arrives every minute and then stops.
  # What differs is the cause, and it is the whole point of the rule — a pushed
  # job stops because the agent died, a scraped job stops because the TARGET
  # WAS REMOVED. From the series there is no telling those apart, which is why
  # the selector and not the shape is what separates the two rules.
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="smaug"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: ScrapeTargetDisappeared
        exp_alerts:
          - exp_labels:
              alertname: ScrapeTargetDisappeared
              instance: smaug
              job: node
              component: stack
              severity: warning
              category: availability
            exp_annotations:
              summary: "scraped target smaug has disappeared from service discovery"
              description: >-
                Prometheus was scraping smaug within the last day and no longer
                has it as a target at all. This is not a host that is down —
                that is InstanceDown's, and it would need the target to still
                exist. Check that prometheus/targets/node.yaml still lists it
                and still parses: Status → Service Discovery, and
                prometheus_sd_file_read_errors_total.

      # Gone, but not for long enough yet. The last sample is at 30m and the
      # instant selector stops resolving it five minutes later, so the alert is
      # pending from 35m and firing from 50m. This is the case that makes
      # `for: 15m` load-bearing: without it the rule fires here, and mutating
      # the `for` to 0m would otherwise have left every test in this file green.
      - eval_time: 40m
        alertname: ScrapeTargetDisappeared
        exp_alerts: []

  # --- ScrapeTargetDisappeared: quiet while the target is being scraped -----
  # The production state, once smaug answers. Without this case the rule would
  # pass its test while firing continuously for a target that is perfectly fine.
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="smaug"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ScrapeTargetDisappeared
        exp_alerts: []

  # --- ScrapeTargetDisappeared: quiet for a target that is present and down --
  # smaug powered off, or the firewall pass moved below the deny. The target
  # still EXISTS, so up is 0 rather than absent — this rule must stay silent and
  # InstanceDown must be the one that fires. The two partition the failure and
  # do not overlap, which is the same claim the cAdvisor case above makes for
  # the pushed half. Held at 0 for the whole range rather than written as a gap,
  # because it is the presence of the series and not its value that this rule
  # keys on.
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="smaug"}'
        values: "0x70"
    alert_rule_test:
      - eval_time: 60m
        alertname: ScrapeTargetDisappeared
        exp_alerts: []

  # --- ScrapeTargetDisappeared: quiet for a PUSHED job that goes silent -----
  # This is the case that pins the selector rather than the expression. The
  # fixture is byte-for-byte the firing case of RemoteWriteJobStale above, and
  # that rule is expected to fire on it — this one must not, because widening
  # `job="node"` to every job would cover remote_write jobs twice and page for
  # the same outage under two names. Without this case the selector could be
  # dropped entirely and every other test here would still pass.
  - interval: 1m
    input_series:
      - series: 'up{job="oracle-metrics",instance="oracle"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: ScrapeTargetDisappeared
        exp_alerts: []

  # --- LogEntriesDropped: fires on loss that keeps happening ---------------
  # A counter climbing steadily for well over the hour. That is loss that is
  # still going on, which is the only thing this rule is for.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="oracle-alloy",reason="rate_limited"}'
        values: "0+1x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: LogEntriesDropped
        exp_alerts:
          - exp_labels:
              job: oracle-alloy
              reason: rate_limited
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              summary: "oracle-alloy has been losing log lines to rate_limited for an hour"
              description: >-
                Loki has been rejecting these entries for an hour, so this is not
                the burst an agent restart produces — that lasts minutes and
                clears. Ask Loki which limit it is applying with `sum by (reason)
                (loki_discarded_samples_total)`. An entry older than
                reject_old_samples_max_age or a stream too far behind means an
                agent is replaying rather than tailing; rate_limited means the
                estate is producing more than the ingester accepts.

  # --- LogEntriesDropped: quiet for an agent-restart burst ------------------
  # THE CASE THIS RULE WAS RESHAPED AROUND (#341). A restart replay is ONE step
  # in the counter — 33,231 entries in a single jump, measured on 09-04 — after
  # which the counter is flat. rate() over 15m is positive for fifteen minutes
  # and no longer, so `for: 1h` cannot be satisfied by it.
  #
  # The fixture is a single large jump followed by three hours of flat, which is
  # exactly the shape the live counter had. An earlier version of this rule used
  # `for: 15m` and excluded too_far_behind by name; that silenced one flavour of
  # this event and left the other two to page after every deploy.
  #
  # THE FIXTURE CLIMBS OVER SIX MINUTES RATHER THAN JUMPING ONCE, and that
  # detail is what makes this a real test. A replay is not instantaneous: the
  # agent pushes for as long as it takes to drain the backlog, so the counter
  # rises across several scrapes. rate()[15m] is then positive for the climb
  # plus fifteen minutes — about twenty here — which IS enough to satisfy
  # `for: 15m` and is nowhere near an hour.
  #
  # A single-step fixture proves nothing, and the first draft of this case was
  # one: the rate from one step is positive for exactly the window length, one
  # minute short of `for: 15m`, so it passed under both forms.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="oracle-alloy",reason="greater_than_max_sample_age"}'
        values: "0x5 0+6646x5 33231x170"
    alert_rule_test:
      - eval_time: 25m
        alertname: LogEntriesDropped
        exp_alerts: []
      # And still quiet once the burst has aged out, which is the steady state
      # after any redeploy.
      - eval_time: 170m
        alertname: LogEntriesDropped
        exp_alerts: []

  # --- LogEntriesDropped: quiet on a flat counter --------------------------
  # The production state. The counter EXISTS for every agent — five reasons per
  # loki.write component, all at zero — so a rule keyed on presence rather than
  # on movement would fire permanently for a healthy estate.
  - interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="oracle-alloy",reason="rate_limited"}'
        values: "0x180"
    alert_rule_test:
      - eval_time: 150m
        alertname: LogEntriesDropped
        exp_alerts: []

  # --- JournalSourceStopped: fires on a reader that has stopped -------------
  # A counter that advanced and then went flat, which is the failure #194 was
  # filed about: the agent is up, the component is healthy, and no journal
  # entry is being read. The counter must be non-flat first, because a series
  # that was never anything but flat is indistinguishable from an agent that has
  # only just started.
  - interval: 1m
    input_series:
      - series: 'loki_source_journal_target_lines_total{job="prometheus-alloy",component_id="loki.source.journal.journal"}'
        values: "0+2x60 120x240"
    alert_rule_test:
      - eval_time: 300m
        alertname: JournalSourceStopped
        exp_alerts:
          - exp_labels:
              job: prometheus-alloy
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              summary: "prometheus-alloy has read no journal entries for two hours"
              description: >-
                The agent is up and publishing metrics, so this is not an outage
                — its journal reader has stopped. The quietest host in the estate
                still produces about three entries an hour, so zero is a fault
                rather than a quiet night. Check the reader's position file in
                the alloy-data volume and whether /var/log/journal is still
                mounted.

  # --- JournalSourceStopped: quiet for the quietest host in the estate -------
  # `Saruman` reads about 3 entries an hour, which over a 1h rate window is a
  # number very close to zero without being zero. This is the case that decides
  # whether the threshold is honest: a rule written as `< 1` or `< 5` per hour
  # would fire for a host that is working correctly, which is why the expression
  # asserts `== 0` and this fixture is deliberately as slow as the real thing.
  - interval: 1m
    input_series:
      - series: 'loki_source_journal_target_lines_total{job="Saruman-alloy",component_id="loki.source.journal.journal"}'
        values: "0+1x300"
    alert_rule_test:
      - eval_time: 290m
        alertname: JournalSourceStopped
        exp_alerts: []

  # --- SilenceExpiresSoon: three days left on a silence that stood 20 days --
  # Exactly the live shape on 2026-09-20: #531's silence, created 2026-09-17,
  # ending 2026-10-08. At 2h, time() is 7200: 266400 is three days out and
  # -1720800 is twenty days back. Fires, with the days in the summary. The
  # same series carries issue="531", so SilenceWithoutIssue must stay quiet —
  # the pairing that proves the two rules partition rather than overlap.
  - interval: 1m
    input_series:
      - series: 'homelab_silence_expires_timestamp_seconds{alert="HostBatteryHealthLow",issue="531",id="01cb81d7-5e19-4e6d-b386-f5c8c843032b",instance="prometheus",job="prometheus-metrics"}'
        values: "266400+0x180"
      - series: 'homelab_silence_starts_timestamp_seconds{alert="HostBatteryHealthLow",issue="531",id="01cb81d7-5e19-4e6d-b386-f5c8c843032b",instance="prometheus",job="prometheus-metrics"}'
        values: "-1720800+0x180"
    alert_rule_test:
      - eval_time: 2h
        alertname: SilenceExpiresSoon
        exp_alerts:
          - exp_labels:
              alertname: SilenceExpiresSoon
              alert: HostBatteryHealthLow
              issue: "531"
              id: 01cb81d7-5e19-4e6d-b386-f5c8c843032b
              instance: prometheus
              job: prometheus-metrics
              component: stack
              severity: warning
              category: monitoring
            exp_annotations:
              summary: "silence on HostBatteryHealthLow expires in 3 days"
              description: >-
                Silence 01cb81d7-5e19-4e6d-b386-f5c8c843032b has stood for more
                than a week and lapses within one. When it lapses the alert it
                covers notifies again as if new, at whatever hour, with nothing
                to say why it was quiet. Extend it from the issue that owns it,
                or delete it now because the work is done —
                docs/observability.md, Silences, has the convention.
      # The `for: 1h` pin: true from the first evaluation, pending until 60m.
      - eval_time: 59m
        alertname: SilenceExpiresSoon
        exp_alerts: []
      - eval_time: 2h
        alertname: SilenceWithoutIssue
        exp_alerts: []

  # --- SilenceExpiresSoon: quiet for a short silence and a distant one -----
  # Three silences that must not fire. The first is the recommended kind:
  # three days left because it was created two days ago with five to live —
  # a rack-job silence, and a warning the moment it is created would teach
  # you to ignore the rule. The second has stood thirty days and has ten
  # left. The third is pending — it starts tomorrow — so its age is negative
  # and the guard keeps it quiet however soon it ends.
  - interval: 1m
    input_series:
      - series: 'homelab_silence_expires_timestamp_seconds{alert="IloHardwareDegraded",issue="418",id="short",instance="prometheus",job="prometheus-metrics"}'
        values: "266400+0x180"
      - series: 'homelab_silence_starts_timestamp_seconds{alert="IloHardwareDegraded",issue="418",id="short",instance="prometheus",job="prometheus-metrics"}'
        values: "-165600+0x180"
      - series: 'homelab_silence_expires_timestamp_seconds{alert="UpsSelfTestFailed",issue="93",id="distant",instance="prometheus",job="prometheus-metrics"}'
        values: "871200+0x180"
      - series: 'homelab_silence_starts_timestamp_seconds{alert="UpsSelfTestFailed",issue="93",id="distant",instance="prometheus",job="prometheus-metrics"}'
        values: "-2584800+0x180"
      - series: 'homelab_silence_expires_timestamp_seconds{alert="IloHardwareDegraded",issue="418",id="pending",instance="prometheus",job="prometheus-metrics"}'
        values: "266400+0x180"
      - series: 'homelab_silence_starts_timestamp_seconds{alert="IloHardwareDegraded",issue="418",id="pending",instance="prometheus",job="prometheus-metrics"}'
        values: "93600+0x180"
    alert_rule_test:
      - eval_time: 2h
        alertname: SilenceExpiresSoon
        exp_alerts: []
      - eval_time: 2h
        alertname: SilenceWithoutIssue
        exp_alerts: []

  # --- SilenceWithoutIssue: a silence whose comment names no owner ----------
  # The series has no `issue` label, which is what the collector writes for a
  # comment that does not begin with #NNN — and what Prometheus would store
  # even if it had written issue="". Fires after `for: 5m`; the 4m evaluation
  # is the pin. A no-`alert` label case is deliberately not here: the summary
  # handles it, but the alert with no alertname matcher is a silence on
  # everything, and that is a different finding for a different day.
  - interval: 1m
    input_series:
      - series: 'homelab_silence_expires_timestamp_seconds{alert="SmartDriveBadSectors",id="b06d032c-8150-47c1-8f46-ed7a8ed52b2e",instance="prometheus",job="prometheus-metrics"}'
        values: "266400+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: SilenceWithoutIssue
        exp_alerts:
          - exp_labels:
              alertname: SilenceWithoutIssue
              alert: SmartDriveBadSectors
              id: b06d032c-8150-47c1-8f46-ed7a8ed52b2e
              instance: prometheus
              job: prometheus-metrics
              component: stack
              severity: warning
              category: monitoring
            exp_annotations:
              summary: "silence on SmartDriveBadSectors names no owning issue"
              description: >-
                Silence b06d032c-8150-47c1-8f46-ed7a8ed52b2e's comment does not
                begin with the number of the open issue that owns its expiry,
                so nothing records why it exists or when it can go. Re-post it
                with the same id, matchers and startsAt and a comment that
                starts with #NNN — the UUID survives — or delete it.
                docs/observability.md, Silences, has the convention.
      - eval_time: 4m
        alertname: SilenceWithoutIssue
        exp_alerts: []

  # --- The Loki ruler (#837): failing, delivering nothing, and gone ---------
  #
  # LokiRuleEvaluationFailures: one group failing fires per group; a flat
  # counter beside it must not.
  - interval: 1m
    input_series:
      - series: 'loki_prometheus_rule_evaluation_failures_total{rule_group="/etc/loki/rules/fake/security.rules.yaml;authentication",user="fake"}'
        values: "0+1x40"
      - series: 'loki_prometheus_rule_evaluation_failures_total{rule_group="/etc/loki/rules/fake/watchdog.rules.yaml;ruler-watchdog",user="fake"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: LokiRuleEvaluationFailures
        exp_alerts: []
      - eval_time: 25m
        alertname: LokiRuleEvaluationFailures
        exp_alerts:
          - exp_labels:
              alertname: LokiRuleEvaluationFailures
              rule_group: /etc/loki/rules/fake/security.rules.yaml;authentication
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              summary: "Loki rule group /etc/loki/rules/fake/security.rules.yaml;authentication is failing to evaluate"
              description: >-
                Every alert in that group is silent while this fires. `docker logs loki
                2>&1 | grep -i ruler` names the rule and the error. Most of loki/rules/
                is security alerting, so read it as a security gap, not a cosmetic one.

  # LokiRulerNotificationsFailing: errors fire; drops fire on their own; a
  # healthy ruler (sent climbing, no errors, no drops) is silent.
  - interval: 1m
    input_series:
      - series: 'loki_prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts",user="fake"}'
        values: "0+1x40"
      - series: 'loki_prometheus_notifications_dropped_total{user="fake"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: LokiRulerNotificationsFailing
        exp_alerts:
          - exp_labels:
              alertname: LokiRulerNotificationsFailing
              component: stack
              severity: critical
              category: correctness
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#the-rulers-half"
              summary: "The Loki ruler cannot deliver alerts to Alertmanager"
              description: >-
                Log-based alerts, the security ones among them, are firing and being
                lost between Loki and Alertmanager. Check that alertmanager:9093 is up
                and that loki-config.yaml's alertmanager_url still names it.
  - interval: 1m
    input_series:
      - series: 'loki_prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts",user="fake"}'
        values: "0+0x40"
      - series: 'loki_prometheus_notifications_dropped_total{user="fake"}'
        values: "0+2x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: LokiRulerNotificationsFailing
        exp_alerts:
          - exp_labels:
              alertname: LokiRulerNotificationsFailing
              component: stack
              severity: critical
              category: correctness
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#the-rulers-half"
              summary: "The Loki ruler cannot deliver alerts to Alertmanager"
              description: >-
                Log-based alerts, the security ones among them, are firing and being
                lost between Loki and Alertmanager. Check that alertmanager:9093 is up
                and that loki-config.yaml's alertmanager_url still names it.
  - interval: 1m
    input_series:
      - series: 'loki_prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts",user="fake"}'
        values: "0+0x40"
      - series: 'loki_prometheus_notifications_dropped_total{user="fake"}'
        values: "0+0x40"
      - series: 'loki_prometheus_notifications_sent_total{alertmanager="http://alertmanager:9093/api/v2/alerts",user="fake"}'
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: LokiRulerNotificationsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: LokiRulerSilent
        exp_alerts: []

  # LokiRulerSilent: the counter stops at 10m. Still inside its window at 20m,
  # pending at 27m, firing at 31m. A rule written `< 1` or without the `for`
  # fails one of the two quiet checks.
  - interval: 1m
    input_series:
      - series: 'loki_prometheus_notifications_sent_total{alertmanager="http://alertmanager:9093/api/v2/alerts",user="fake"}'
        values: "0+1x10 10+0x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: LokiRulerSilent
        exp_alerts: []
      - eval_time: 27m
        alertname: LokiRulerSilent
        exp_alerts: []
      - eval_time: 31m
        alertname: LokiRulerSilent
        exp_alerts:
          - exp_labels:
              alertname: LokiRulerSilent
              component: stack
              severity: critical
              category: correctness
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#the-rulers-half"
              summary: "The Loki ruler has sent nothing to Alertmanager for 20 minutes"
              description: >-
                Every log-based alert, the security ones among them, is silent: the
                ruler's own always-firing LokiRulerWatchdog has stopped reaching
                Alertmanager. Look at `docker logs loki 2>&1 | grep -i ruler`, then at
                the ruler's view of its rules: `curl -s
                localhost:3100/prometheus/api/v1/rules` on the monitoring host. If
                loki_prometheus_notifications_sent_total is absent rather than flat,
                check whether a Loki upgrade renamed it.

  # And the metric gone entirely, which is how a rename would look: absent()
  # fires, so the rule cannot quietly become one that never does.
  - interval: 1m
    input_series:
      - series: 'up{job="loki",instance="loki:3100"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: LokiRulerSilent
        exp_alerts:
          - exp_labels:
              alertname: LokiRulerSilent
              component: stack
              severity: critical
              category: correctness
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#the-rulers-half"
              summary: "The Loki ruler has sent nothing to Alertmanager for 20 minutes"
              description: >-
                Every log-based alert, the security ones among them, is silent: the
                ruler's own always-firing LokiRulerWatchdog has stopped reaching
                Alertmanager. Look at `docker logs loki 2>&1 | grep -i ruler`, then at
                the ruler's view of its rules: `curl -s
                localhost:3100/prometheus/api/v1/rules` on the monitoring host. If
                loki_prometheus_notifications_sent_total is absent rather than flat,
                check whether a Loki upgrade renamed it.

  # --- #840: the rest of the stack watching itself ---------------------------
  #
  # AlertmanagerConfigReloadFailed: a rejected reload fires after its `for`; a
  # successful one beside it does not.
  - interval: 1m
    input_series:
      - series: 'alertmanager_config_last_reload_successful{instance="alertmanager:9093",job="alertmanager"}'
        values: "1x5 0x20"
    alert_rule_test:
      - eval_time: 8m
        alertname: AlertmanagerConfigReloadFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: AlertmanagerConfigReloadFailed
        exp_alerts:
          - exp_labels:
              alertname: AlertmanagerConfigReloadFailed
              instance: alertmanager:9093
              job: alertmanager
              component: stack
              severity: critical
              category: correctness
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/deploy-stack.md#troubleshooting"
              dashboard: "Observability Stack (/d/homelab-stack) › Alertmanager › Silences and config reloads"
              summary: "Alertmanager rejected its config reload on alertmanager:9093"
              description: >-
                It is still routing with the tree it last accepted, so whatever the
                edit changed (a receiver, a route, a silence's target) is not in
                effect. `docker logs alertmanager 2>&1 | grep -i config` names the
                error; `make validate` (amtool check-config) catches it before a
                deploy.

  # PrometheusNotificationsFailing: errors fire; drops fire on their own; flat
  # counters are quiet.
  - interval: 1m
    input_series:
      - series: 'prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts",instance="localhost:9090",job="prometheus"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: PrometheusNotificationsFailing
        exp_alerts:
          - exp_labels:
              alertname: PrometheusNotificationsFailing
              component: stack
              severity: critical
              category: correctness
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#reading-the-failure"
              dashboard: "Observability Stack (/d/homelab-stack) › Prometheus › Alert hand-off to Alertmanager"
              summary: "Prometheus is failing to hand alerts to Alertmanager"
              description: >-
                Some alerts that fired in the last 15 minutes never reached
                Alertmanager, so nobody was told. Check the dashboard's notification
                panels and `docker logs prometheus 2>&1 | grep -i notif`.
  - interval: 1m
    input_series:
      - series: 'prometheus_notifications_dropped_total{instance="localhost:9090",job="prometheus"}'
        values: "0+5x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: PrometheusNotificationsFailing
        exp_alerts:
          - exp_labels:
              alertname: PrometheusNotificationsFailing
              component: stack
              severity: critical
              category: correctness
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#reading-the-failure"
              dashboard: "Observability Stack (/d/homelab-stack) › Prometheus › Alert hand-off to Alertmanager"
              summary: "Prometheus is failing to hand alerts to Alertmanager"
              description: >-
                Some alerts that fired in the last 15 minutes never reached
                Alertmanager, so nobody was told. Check the dashboard's notification
                panels and `docker logs prometheus 2>&1 | grep -i notif`.
  - interval: 1m
    input_series:
      - series: 'prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts",instance="localhost:9090",job="prometheus"}'
        values: "0+0x30"
      - series: 'prometheus_notifications_dropped_total{instance="localhost:9090",job="prometheus"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []

  # PrometheusTsdbFailures: each counter is reported under its own `failure`
  # label, so the alert says which one moved; flat counters are quiet.
  - interval: 1m
    input_series:
      - series: 'prometheus_tsdb_compactions_failed_total{instance="localhost:9090",job="prometheus"}'
        values: "0x10 1x50"
      - series: 'prometheus_tsdb_wal_corruptions_total{instance="localhost:9090",job="prometheus"}'
        values: "0x20 1x40"
      - series: 'prometheus_tsdb_reloads_failures_total{instance="localhost:9090",job="prometheus"}'
        values: "0x60"
      - series: 'prometheus_tsdb_head_truncations_failed_total{instance="localhost:9090",job="prometheus"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 5m
        alertname: PrometheusTsdbFailures
        exp_alerts: []
      - eval_time: 30m
        alertname: PrometheusTsdbFailures
        exp_alerts:
          - exp_labels:
              alertname: PrometheusTsdbFailures
              failure: compaction
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              dashboard: "Observability Stack (/d/homelab-stack) › Prometheus › TSDB failures"
              summary: "Prometheus TSDB compaction failed in the last hour"
              description: >-
                `docker logs prometheus 2>&1 | grep -iE 'compact|wal|reload|truncat'`
                says why. A WAL corruption means some recent samples will not survive
                a restart; repeated compaction failures mean the head, and the disk,
                keep growing. Neither fixes itself.
          - exp_labels:
              alertname: PrometheusTsdbFailures
              failure: wal-corruption
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              dashboard: "Observability Stack (/d/homelab-stack) › Prometheus › TSDB failures"
              summary: "Prometheus TSDB wal-corruption failed in the last hour"
              description: >-
                `docker logs prometheus 2>&1 | grep -iE 'compact|wal|reload|truncat'`
                says why. A WAL corruption means some recent samples will not survive
                a restart; repeated compaction failures mean the head, and the disk,
                keep growing. Neither fixes itself.

  # AlloyRemoteWriteFailing: oracle's agent is refusing some samples and fires.
  # The local agent's failures arrive twice, once from the direct scrape
  # (job="alloy", instance="alloy:12345") and once by its own push
  # (job="prometheus-alloy"). It must alert ONCE, as instance="prometheus". A rule
  # matching both jobs would add a second alert and fail this test. trinity's is
  # healthy.
  - interval: 1m
    input_series:
      - series: 'prometheus_remote_storage_samples_failed_total{instance="oracle",job="oracle-alloy",url="http://10.0.99.20:9090/api/v1/write"}'
        values: "0+3x40"
      - series: 'prometheus_remote_storage_samples_failed_total{instance="prometheus",job="prometheus-alloy",url="http://prometheus:9090/api/v1/write"}'
        values: "0+2x40"
      - series: 'prometheus_remote_storage_samples_failed_total{instance="alloy:12345",job="alloy",url="http://prometheus:9090/api/v1/write"}'
        values: "0+2x40"
      - series: 'prometheus_remote_storage_samples_failed_total{instance="trinity",job="trinity-alloy",url="http://10.0.99.20:9090/api/v1/write"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 12m
        alertname: AlloyRemoteWriteFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: AlloyRemoteWriteFailing
        exp_alerts:
          - exp_labels:
              alertname: AlloyRemoteWriteFailing
              instance: oracle
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              dashboard: "Observability Stack (/d/homelab-stack) › Alloy › Remote-write throughput"
              summary: "Alloy on oracle is failing to remote-write some samples"
              description: >-
                Metrics from oracle are being lost, not queued:
                this counts samples the receiver refused outright, which
                remote_write does not retry. (Failures it can recover from are
                retried and do not count here.) On the host, `docker
                logs alloy 2>&1 | grep -i 'remote_write\|non-recoverable'` (or
                `journalctl -u alloy` for a native agent) gives the status the
                receiver returned: 401 is the ingest token, 400 out-of-order or too
                old is the clock or a replay.
          - exp_labels:
              alertname: AlloyRemoteWriteFailing
              instance: prometheus
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              dashboard: "Observability Stack (/d/homelab-stack) › Alloy › Remote-write throughput"
              summary: "Alloy on prometheus is failing to remote-write some samples"
              description: >-
                Metrics from prometheus are being lost, not queued:
                this counts samples the receiver refused outright, which
                remote_write does not retry. (Failures it can recover from are
                retried and do not count here.) On the host,
                `docker logs alloy 2>&1 | grep -i 'remote_write\|non-recoverable'` (or
                `journalctl -u alloy` for a native agent) gives the status the
                receiver returned: 401 is the ingest token, 400 out-of-order or too
                old is the clock or a replay.

  # AlloyComponentUnhealthy: one unhealthy component on oracle fires, under the
  # self-scraped job only; the healthy count beside it, and the same unhealthy
  # count under the direct-scrape job, add nothing.
  - interval: 1m
    input_series:
      - series: 'alloy_component_controller_running_components{health_type="unhealthy",instance="oracle",job="oracle-alloy"}'
        values: "0x5 1x30"
      - series: 'alloy_component_controller_running_components{health_type="healthy",instance="oracle",job="oracle-alloy"}'
        values: "31x35"
      - series: 'alloy_component_controller_running_components{health_type="unhealthy",instance="alloy:12345",job="alloy"}'
        values: "1x35"
    alert_rule_test:
      - eval_time: 15m
        alertname: AlloyComponentUnhealthy
        exp_alerts: []
      - eval_time: 25m
        alertname: AlloyComponentUnhealthy
        exp_alerts:
          - exp_labels:
              alertname: AlloyComponentUnhealthy
              instance: oracle
              health_type: unhealthy
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              dashboard: "Observability Stack (/d/homelab-stack) › Alloy › Component health"
              summary: "Alloy on oracle has 1 unhealthy component(s)"
              description: >-
                Part of what that agent collects has stopped while the agent stays up.
                Its debug UI on 127.0.0.1:12345 (an SSH tunnel away) lists each
                component with its health and last error.

  # --- The three stack rules untested until #843 ---------------------------

  # PrometheusConfigReloadFailed: a rejected reload (0) fires after its 5m `for`.
  - interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus",instance="localhost:9090"}'
        values: "1x3 0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              alertname: PrometheusConfigReloadFailed
              job: prometheus
              instance: localhost:9090
              component: stack
              severity: critical
              category: correctness
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/deploy-stack.md#troubleshooting"
              summary: "Prometheus rejected its own config reload on localhost:9090"

  # PrometheusRuleEvaluationFailures: one failure a minute is 15 over the 15m
  # window and fires after 5m; a flat counter in the next case does not.
  - interval: 1m
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="localhost:9090",rule_group="host"}'
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 3m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts: []
      - eval_time: 25m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts:
          - exp_labels:
              alertname: PrometheusRuleEvaluationFailures
              job: prometheus
              instance: localhost:9090
              rule_group: host
              component: stack
              severity: warning
              category: correctness
            exp_annotations:
              summary: "15 rule evaluation failures in the last 15 minutes"

  # PrometheusRuleEvaluationFailures: a flat counter is quiet.
  - interval: 1m
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="localhost:9090",rule_group="host"}'
        values: "4+0x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts: []

  # LokiIngestionStalled: lines stop at 20m. The 30m rate reaches 0 at 50m and the
  # 30m `for` runs to 80m. Quiet at 70m (pending), firing at 85m.
  - interval: 1m
    input_series:
      - series: 'loki_distributor_lines_received_total{job="loki",instance="loki:3100",tenant="fake"}'
        values: "0+100x20 2000x80"
    alert_rule_test:
      - eval_time: 70m
        alertname: LokiIngestionStalled
        exp_alerts: []
      - eval_time: 85m
        alertname: LokiIngestionStalled
        exp_alerts:
          - exp_labels:
              alertname: LokiIngestionStalled
              component: stack
              severity: warning
              category: availability
            exp_annotations:
              summary: "Loki has received no log lines for 30 minutes"
              description: >-
                Either every Alloy agent is down or the push endpoint is
                unreachable. A running agent retries a failed push for a few
                minutes, then drops the batch: those lines are lost. A stopped
                agent's file, journal and Docker sources resume from their saved
                positions when it starts, unless the logs rotated away meanwhile.
                Network syslog sent while it is down is gone.

  # LokiIngestionStalled: lines still arriving is quiet.
  - interval: 1m
    input_series:
      - series: 'loki_distributor_lines_received_total{job="loki",instance="loki:3100",tenant="fake"}'
        values: "0+100x100"
    alert_rule_test:
      - eval_time: 90m
        alertname: LokiIngestionStalled
        exp_alerts: []
