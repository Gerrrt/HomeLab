---
# Unit tests for the iLO rules in network.rules.yaml.
#
# These exist because of #76. IloBatteryCondition fired continuously for the
# entire retention window and was correct to, and it still could not be acted
# on: it read cpqHeSysBackupBatteryCondition, a scalar with no index labels, so
# it said "the battery sub-system is degraded" and stopped. Which pack, why, and
# what to order were all in a table the rule did not touch. `promtool check
# rules` had nothing to say about that — the expression was valid and the rule
# was firing. This is the #63 lesson one turn on: a rule that fires and cannot
# be acted on is its own failure mode.
#
# So the assertions that matter here are about the JOIN and the THRESHOLDS. The
# join is what carries the spare part number into the annotation, and a join
# that matches nothing is invisible to `check rules`. The thresholds are what
# keep one hardware fault from becoming four notifications.
#
# Every firing case is paired with a quiet one, per containers.test.yaml. The
# fixtures are shiva as it actually read on 2026-08-31, so a green run means
# these fire against production data rather than against a fixture shaped to
# suit them. The healthy-pack quiet case is shiva again, as it read on
# 2026-09-02 after the pack was replaced — so both sides of that pair are
# measured.
#
# Scope: IloBatteryCondition, IloWriteCacheDisabled and IloHardwareDegraded.
# The pf, switch and snmp rules in the same file are still syntax-only, which
# is the standing they had before this file existed.
#
# What these do NOT prove: nothing here notices if the iLO stops exporting
# these OIDs or if snmp-exporter renames a label. They guard the expressions,
# not the data feeding them.
rule_files:
  - ../rules/network.rules.yaml

evaluation_interval: 1m

tests:
  # --- IloBatteryCondition: fires, and names the part -----------------------
  # The asserted value is 13 and not 4: the status is the diagnosis, the
  # condition only says something is wrong, and that is the defect being fixed.
  #
  # cpqHeSysBackupBatteryCondition is in the fixture at 3 on purpose. That is
  # the series the OLD expression read and it is still scraped, so a silent
  # revert to it would still pass a test that left it out.
  - interval: 1m
    input_series:
      - series: 'cpqHeSysBatteryCondition{cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "4x40"
      - series: 'cpqHeSysBatteryStatus{cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "13x40"
      - series: 'cpqHeSysBatterySparePartNum{cpqHeSysBatterySparePartNum="815983-001",cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "1x40"
      - series: 'cpqHeSysBackupBatteryCondition{device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "3x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: IloBatteryCondition
        exp_alerts:
          - exp_labels:
              alertname: IloBatteryCondition
              cpqHeSysBatteryChassis: "0"
              cpqHeSysBatteryIndex: "1"
              cpqHeSysBatterySparePartNum: "815983-001"
              device: shiva
              instance: 10.0.30.10
              job: snmp
              role: hypervisor-bmc
              vlan: "30"
              component: network
              severity: warning
              category: hardware
            exp_annotations:
              summary: "Backup battery 1 on shiva is degraded or failed"
              description: >-
                cpqHeSysBatteryStatus = 13, spare part 815983-001. 13 is
                shutdownPermanentFailure — the pack is dead and reseating it
                will not clear the code; 15 is predictiveFailure; 1 is noError.
                On a Gen9 this pack also backs the Smart Array write cache, so
                expect IloWriteCacheDisabled alongside it. Runbook:
                docs/runbooks/replace-the-smart-storage-battery.md

      # Not held long enough — for: 30m has not elapsed at 20m.
      - eval_time: 20m
        alertname: IloBatteryCondition
        exp_alerts: []

  # --- IloBatteryCondition: quiet on a healthy pack -------------------------
  # Condition 2 (ok), status 1 (noError), everything else identical including
  # the spare part string. The only thing that changed is the condition. This
  # is what shiva read from 2026-09-02 23:02 UTC, the first scrape after the
  # replacement pack went in.
  - interval: 1m
    input_series:
      - series: 'cpqHeSysBatteryCondition{cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "2x40"
      - series: 'cpqHeSysBatteryStatus{cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "1x40"
      - series: 'cpqHeSysBatterySparePartNum{cpqHeSysBatterySparePartNum="815983-001",cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: IloBatteryCondition
        exp_alerts: []

  # --- IloBatteryCondition: two packs, one bad ------------------------------
  # This is the case that makes the join real. With one battery the match is
  # 1:1 and a join keyed on instance alone would pass; with two it is
  # many-to-one on the right and Prometheus refuses to evaluate it. It also
  # proves the alert names battery 1 rather than the chassis.
  - interval: 1m
    input_series:
      - series: 'cpqHeSysBatteryCondition{cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "4x40"
      - series: 'cpqHeSysBatteryStatus{cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "13x40"
      - series: 'cpqHeSysBatterySparePartNum{cpqHeSysBatterySparePartNum="815983-001",cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "1x40"
      - series: 'cpqHeSysBatteryCondition{cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="2",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "2x40"
      - series: 'cpqHeSysBatteryStatus{cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="2",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "1x40"
      - series: 'cpqHeSysBatterySparePartNum{cpqHeSysBatterySparePartNum="815983-001",cpqHeSysBatteryChassis="0",cpqHeSysBatteryIndex="2",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: IloBatteryCondition
        exp_alerts:
          - exp_labels:
              alertname: IloBatteryCondition
              cpqHeSysBatteryChassis: "0"
              cpqHeSysBatteryIndex: "1"
              cpqHeSysBatterySparePartNum: "815983-001"
              device: shiva
              instance: 10.0.30.10
              job: snmp
              role: hypervisor-bmc
              vlan: "30"
              component: network
              severity: warning
              category: hardware
            exp_annotations:
              summary: "Backup battery 1 on shiva is degraded or failed"
              description: >-
                cpqHeSysBatteryStatus = 13, spare part 815983-001. 13 is
                shutdownPermanentFailure — the pack is dead and reseating it
                will not clear the code; 15 is predictiveFailure; 1 is noError.
                On a Gen9 this pack also backs the Smart Array write cache, so
                expect IloWriteCacheDisabled alongside it. Runbook:
                docs/runbooks/replace-the-smart-storage-battery.md

  # --- IloWriteCacheDisabled: fires at 5, and at 4 --------------------------
  # Controller 0 is shiva as it stands: permDisabled, running write-through.
  # Controller 1 at 4 (tmpDisabled) brackets the bottom of the firing range
  # against the quiet case below, and proves the rule is per-controller.
  #
  # cpqDaAccelBadData is in the fixture at 2 (none) because that is what shiva
  # really reports — no dirty cache was lost, and a rule keyed on that instead
  # would be silent on a fault that is real.
  - interval: 1m
    input_series:
      - series: 'cpqDaAccelStatus{cpqDaAccelCntlrIndex="0",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "5x70"
      - series: 'cpqDaAccelBadData{cpqDaAccelCntlrIndex="0",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "2x70"
      - series: 'cpqDaAccelStatus{cpqDaAccelCntlrIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "4x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: IloWriteCacheDisabled
        exp_alerts:
          - exp_labels:
              alertname: IloWriteCacheDisabled
              cpqDaAccelCntlrIndex: "0"
              device: shiva
              instance: 10.0.30.10
              job: snmp
              role: hypervisor-bmc
              vlan: "30"
              component: network
              severity: warning
              category: hardware
            exp_annotations:
              summary: "Smart Array cache on shiva is not caching writes"
              description: >-
                cpqDaAccelStatus = 5 — 4 is tmpDisabled, 5 permDisabled, 6 to 9
                are cache-module faults. The controller is running
                write-through: slower, and not less durable. cpqDaAccelErrCode
                names the cause (25 = noCapacitorAttached is a dead backup
                battery), and cpqDaAccelBadData = 3 is the one that matters for
                the array — it means dirty cache was lost.
          - exp_labels:
              alertname: IloWriteCacheDisabled
              cpqDaAccelCntlrIndex: "1"
              device: shiva
              instance: 10.0.30.10
              job: snmp
              role: hypervisor-bmc
              vlan: "30"
              component: network
              severity: warning
              category: hardware
            exp_annotations:
              summary: "Smart Array cache on shiva is not caching writes"
              description: >-
                cpqDaAccelStatus = 4 — 4 is tmpDisabled, 5 permDisabled, 6 to 9
                are cache-module faults. The controller is running
                write-through: slower, and not less durable. cpqDaAccelErrCode
                names the cause (25 = noCapacitorAttached is a dead backup
                battery), and cpqDaAccelBadData = 3 is the one that matters for
                the array — it means dirty cache was lost.

      # A pack recharging after a power cut sits in write-through legitimately.
      # for: 1h is what makes that a non-event, and this is the assertion.
      - eval_time: 45m
        alertname: IloWriteCacheDisabled
        exp_alerts: []

  # --- IloWriteCacheDisabled: quiet at 3, and quiet at 2 --------------------
  # 3 (enabled) is a healthy array. 2 (invalid) is what a controller with no
  # cache module reports, and is why the expression is > 3 rather than != 3 —
  # a controller must not page about a cache it does not have.
  - interval: 1m
    input_series:
      - series: 'cpqDaAccelStatus{cpqDaAccelCntlrIndex="0",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "3x70"
      - series: 'cpqDaAccelStatus{cpqDaAccelCntlrIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "2x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: IloWriteCacheDisabled
        exp_alerts: []

  # --- IloHardwareDegraded: quiet on the array rollups at 3 -----------------
  # THE case. This is shiva exactly as it stood on 2026-08-31 with the battery
  # dead: three array rollups at 3 (degraded), everything else at 2 (ok) —
  # plus logical drive 2, which did not exist then and has read 2 since it
  # appeared on 2026-09-19 (docs/runbooks/fit-the-saruman-ssds.md, step 5).
  # Reading those three at > 2 — the obvious edit — puts THREE critical alerts
  # on the urgent receiver for a fault two warnings already describe. This
  # asserts the box in its known-bad state stays off the pager.
  - interval: 1m
    input_series:
      - series: 'cpqDaCntlrCondition{cpqDaCntlrIndex="0",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "3x15"
      - series: 'cpqDaCntlrBoardCondition{cpqDaCntlrIndex="0",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "3x15"
      - series: 'cpqDaAccelCondition{cpqDaAccelCntlrIndex="0",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "3x15"
      - series: 'cpqHeTemperatureCondition{cpqHeTemperatureChassis="0",cpqHeTemperatureIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "2x15"
      - series: 'cpqHeFltTolPowerSupplyCondition{cpqHeFltTolPowerSupplyBay="1",cpqHeFltTolPowerSupplyChassis="0",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "2x15"
      - series: 'cpqDaLogDrvCondition{cpqDaLogDrvCntlrIndex="0",cpqDaLogDrvIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "2x15"
      - series: 'cpqDaLogDrvCondition{cpqDaLogDrvCntlrIndex="0",cpqDaLogDrvIndex="2",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "2x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: IloHardwareDegraded
        exp_alerts: []

  # --- IloHardwareDegraded: fires when the controller itself fails ----------
  # 4 on cpqDaCntlrCondition is the controller, not its battery, and that is
  # what > 3 exists to catch. Without this case both new branches could be
  # deleted and every other assertion here would still pass.
  - interval: 1m
    input_series:
      - series: 'cpqDaCntlrCondition{cpqDaCntlrIndex="0",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "4x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: IloHardwareDegraded
        exp_alerts:
          - exp_labels:
              alertname: IloHardwareDegraded
              cpqDaCntlrIndex: "0"
              device: shiva
              instance: 10.0.30.10
              job: snmp
              role: hypervisor-bmc
              vlan: "30"
              component: network
              severity: critical
              category: hardware
            exp_annotations:
              summary: "iLO on shiva reports degraded or failed hardware"
              description: >-
                CPQ condition code 4 (3 = degraded, 4 = failed). Check the iLO
                web UI for the specific component. The two Smart Array rollups
                are read at 4 only, not 3 — a flat cache battery degrades both,
                and IloBatteryCondition owns that.

      # for: 5m has not elapsed at 3m.
      - eval_time: 3m
        alertname: IloHardwareDegraded
        exp_alerts: []

  # --- IloHardwareDegraded: the original branches are still > 2 -------------
  # A degraded temperature sensor means a fan has already been lost. If a
  # future edit raised every branch to > 3 for consistency, this is the only
  # case that would notice.
  - interval: 1m
    input_series:
      - series: 'cpqHeTemperatureCondition{cpqHeTemperatureChassis="0",cpqHeTemperatureIndex="1",device="shiva",instance="10.0.30.10",job="snmp",role="hypervisor-bmc",vlan="30"}'
        values: "3x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: IloHardwareDegraded
        exp_alerts:
          - exp_labels:
              alertname: IloHardwareDegraded
              cpqHeTemperatureChassis: "0"
              cpqHeTemperatureIndex: "1"
              device: shiva
              instance: 10.0.30.10
              job: snmp
              role: hypervisor-bmc
              vlan: "30"
              component: network
              severity: critical
              category: hardware
            exp_annotations:
              summary: "iLO on shiva reports degraded or failed hardware"
              description: >-
                CPQ condition code 3 (3 = degraded, 4 = failed). Check the iLO
                web UI for the specific component. The two Smart Array rollups
                are read at 4 only, not 3 — a flat cache battery degrades both,
                and IloBatteryCondition owns that.

  # --- IloDrivePredictiveFailure: fires on replaceDrive(3) ------------------
  # #151's case. The drive is still working and the array still says so — that
  # is exactly when SMART moves, and on a RAID 1 mirror it is the only warning
  # before the second disk goes.
  - interval: 1m
    input_series:
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="0",cpqDaPhyDrvCntlrIndex="0"}'
        values: "3x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: IloDrivePredictiveFailure
        exp_alerts:
          - exp_labels:
              device: shiva
              cpqDaPhyDrvIndex: "0"
              cpqDaPhyDrvCntlrIndex: "0"
              component: network
              severity: warning
              category: hardware
            exp_annotations:
              summary: "SMART predicts failure on a drive behind shiva"
              description: >-
                Physical drive 0 on controller 0 reports SMART status 3 — 3 is a
                predictive failure, 4 is an SSD approaching its write limit. The
                array is probably still reporting healthy, and on a RAID 1 mirror
                it will keep doing so until the other drive goes. Read
                `cpqDaPhyDrvBay` and `cpqDaPhyDrvModel` at the same index for the
                bay to pull and the part to order.

  # --- IloDrivePredictiveFailure: quiet on ok(2), the live value ------------
  # All four drives on shiva read 2 today — the two 7.2K HDDs at 0 and 1, and
  # since 2026-09-18 the two SM863a SSDs at 2 and 3. Without this case the
  # rule would pass its test while firing for a healthy array.
  - interval: 1m
    input_series:
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="0",cpqDaPhyDrvCntlrIndex="0"}'
        values: "2x30"
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="1",cpqDaPhyDrvCntlrIndex="0"}'
        values: "2x30"
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="2",cpqDaPhyDrvCntlrIndex="0"}'
        values: "2x30"
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="3",cpqDaPhyDrvCntlrIndex="0"}'
        values: "2x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: IloDrivePredictiveFailure
        exp_alerts: []

  # --- IloDrivePredictiveFailure: fires on replaceDriveSSDWearOut(4) --------
  # The case the SSDs added. 4 is an SSD that has spent its rated writes, and
  # on two second-hand enterprise drives whose wear columns the iLO leaves
  # blank (#529) it is the one reading the iLO WOULD give. The fit runbook's
  # verdict table refuses to silence this rule for exactly that reason. Three
  # healthy drives sit alongside so the alert must carry the SSD's index and
  # nobody else's.
  - interval: 1m
    input_series:
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="0",cpqDaPhyDrvCntlrIndex="0"}'
        values: "2x30"
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="1",cpqDaPhyDrvCntlrIndex="0"}'
        values: "2x30"
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="2",cpqDaPhyDrvCntlrIndex="0"}'
        values: "2x30"
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="3",cpqDaPhyDrvCntlrIndex="0"}'
        values: "4x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: IloDrivePredictiveFailure
        exp_alerts:
          - exp_labels:
              device: shiva
              cpqDaPhyDrvIndex: "3"
              cpqDaPhyDrvCntlrIndex: "0"
              component: network
              severity: warning
              category: hardware
            exp_annotations:
              summary: "SMART predicts failure on a drive behind shiva"
              description: >-
                Physical drive 3 on controller 0 reports SMART status 4 — 3 is a
                predictive failure, 4 is an SSD approaching its write limit. The
                array is probably still reporting healthy, and on a RAID 1 mirror
                it will keep doing so until the other drive goes. Read
                `cpqDaPhyDrvBay` and `cpqDaPhyDrvModel` at the same index for the
                bay to pull and the part to order.

  # --- IloDrivePredictiveFailure: quiet on other(1) -------------------------
  # 1 is "cannot determine", which is NOT a predictive failure and must not be
  # reported as one. It is IloDriveSmartUnreadable's job, and this case is what
  # stops someone widening the expression to `!= 2`.
  - interval: 1m
    input_series:
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="0",cpqDaPhyDrvCntlrIndex="0"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: IloDrivePredictiveFailure
        exp_alerts: []

  # --- IloDriveSmartUnreadable: fires on other(1), after an hour -----------
  # The complement. A controller reports 1 while it initialises, so the hour is
  # what keeps an iLO reboot from paging; this fixture holds 1 well past it.
  - interval: 1m
    input_series:
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="0",cpqDaPhyDrvCntlrIndex="0"}'
        values: "1x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: IloDriveSmartUnreadable
        exp_alerts:
          - exp_labels:
              device: shiva
              cpqDaPhyDrvIndex: "0"
              cpqDaPhyDrvCntlrIndex: "0"
              component: network
              severity: info
              category: correctness
            exp_annotations:
              summary: "iLO cannot read SMART status for a drive behind shiva"
              description: >-
                Physical drive 0 reports SMART status other(1) — the agent cannot
                determine whether predictive failure monitoring is working.
                IloDrivePredictiveFailure is therefore blind for this drive rather
                than quiet about it.

  # --- IloDriveSmartUnreadable: quiet during a short initialisation --------
  # Thirty minutes of 1 then back to ok, which is what an iLO reboot looks like.
  # Without the hour this pages on every controller restart.
  - interval: 1m
    input_series:
      - series: 'cpqDaPhyDrvSmartStatus{device="shiva",cpqDaPhyDrvIndex="0",cpqDaPhyDrvCntlrIndex="0"}'
        values: "1x30 2x90"
    alert_rule_test:
      - eval_time: 90m
        alertname: IloDriveSmartUnreadable
        exp_alerts: []

  # --- GatewayDown: fires only when the family is genuinely off the air -----
  - interval: 1m
    input_series:
      - series: 'homelab_gateway_status{host="morpheus",gateway="WAN_DHCP",family="inet"}'
        values: "1x20 0x40"
      - series: 'homelab_gateway_forwarding{host="morpheus",family="inet"}'
        values: "1x20 0x40"
    alert_rule_test:
      - eval_time: 45m
        alertname: GatewayDown
        exp_alerts:
          - exp_labels:
              host: morpheus
              gateway: WAN_DHCP
              family: inet
              component: network
              severity: critical
              category: availability
            exp_annotations:
              summary: "morpheus: WAN_DHCP is down and inet does not leave the building"
              description: >-
                dpinger reports this gateway down and an independent probe over
                inet also failed, so this is the uplink rather than the monitor.
                Check the modem and the ISP before the firewall —
                homelab_gateway_loss_ratio has the loss dpinger measured.

  # --- GatewayDown: QUIET for the real WAN_DHCP6 state ----------------------
  # The live values on 2026-09-07: pfSense says down, the family still reaches
  # the internet. This is the case a status-only rule would have fired on
  # forever, and the reason the rule has two halves.
  - interval: 1m
    input_series:
      - series: 'homelab_gateway_status{host="morpheus",gateway="WAN_DHCP6",family="inet6"}'
        values: "0x60"
      - series: 'homelab_gateway_forwarding{host="morpheus",family="inet6"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: GatewayDown
        exp_alerts: []

  # --- GatewayMonitorUnreliable: fires for exactly that state ---------------
  - interval: 1m
    input_series:
      - series: 'homelab_gateway_status{host="morpheus",gateway="WAN_DHCP6",family="inet6"}'
        values: "0x600"
      - series: 'homelab_gateway_forwarding{host="morpheus",family="inet6"}'
        values: "1x600"
    alert_rule_test:
      - eval_time: 8h
        alertname: GatewayMonitorUnreliable
        exp_alerts:
          - exp_labels:
              host: morpheus
              gateway: WAN_DHCP6
              family: inet6
              component: network
              severity: warning
              category: config
            exp_annotations:
              summary: "morpheus: WAN_DHCP6 reports down while inet6 still works"
              description: >-
                The firewall reports this gateway down and traffic of this
                family reaches the internet through it anyway, so the monitor
                address is not answering rather than the link being broken —
                common when dpinger is pointed at an ISP gateway's link-local
                address. Point the gateway's Monitor IP at something that
                answers, or set it to not-monitored. Until then the gateway's
                real state cannot be read from its status.

  # --- GatewayMonitorUnreliable: quiet during a real outage -----------------
  # Both halves down is GatewayDown's case, not this one. Without this the two
  # rules could both fire for one event and the pair would say nothing.
  - interval: 1m
    input_series:
      - series: 'homelab_gateway_status{host="morpheus",gateway="WAN_DHCP",family="inet"}'
        values: "0x600"
      - series: 'homelab_gateway_forwarding{host="morpheus",family="inet"}'
        values: "0x600"
    alert_rule_test:
      - eval_time: 8h
        alertname: GatewayMonitorUnreliable
        exp_alerts: []

  # --- GatewayDown: quiet for a healthy gateway ----------------------------
  - interval: 1m
    input_series:
      - series: 'homelab_gateway_status{host="morpheus",gateway="WAN_DHCP",family="inet"}'
        values: "1x60"
      - series: 'homelab_gateway_forwarding{host="morpheus",family="inet"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: GatewayDown
        exp_alerts: []

  # --- DdnsRecordStale: fires once a mismatch outlasts an update ------------
  # The textfile is rewritten every 15 minutes; a 1m interval stands in for
  # the scrape. Mismatch from 10m, so 45m is too soon and 80m is not.
  - interval: 1m
    input_series:
      - series: 'homelab_ddns_record_checked{host="morpheus"}'
        values: "1x120"
      - series: 'homelab_ddns_record_matches_wan{host="morpheus"}'
        values: "1x10 0x110"
    alert_rule_test:
      - eval_time: 45m
        alertname: DdnsRecordStale
        exp_alerts: []
      - eval_time: 80m
        alertname: DdnsRecordStale
        exp_alerts:
          - exp_labels:
              host: morpheus
              component: network
              severity: warning
              category: availability
            exp_annotations:
              summary: "morpheus: the remote path's DNS name does not resolve to the WAN address"
              description: >-
                A public resolver answers the dynamic DNS name with something
                other than the address the WAN holds, or with nothing. Either
                the record is stale — the updater failed, its token was
                rotated, the provider dropped the entry — or the WAN address
                changed and the update has not landed. The tunnel cannot be
                reached by name until it matches. First move: Services →
                Dynamic DNS on morpheus, Force update. Then
                docs/runbooks/open-the-remote-path.md §0.
      - eval_time: 80m
        alertname: DdnsRecordUnchecked
        exp_alerts: []

  # --- A check that cannot run is Unchecked, and never Stale ----------------
  # The collector omits matches_wan when the comparison did not run, so a
  # resolver outage must not read as a wrong record.
  - interval: 1m
    input_series:
      - series: 'homelab_ddns_record_checked{host="morpheus"}'
        values: "0x480"
    alert_rule_test:
      - eval_time: 5h
        alertname: DdnsRecordUnchecked
        exp_alerts: []
      - eval_time: 7h
        alertname: DdnsRecordUnchecked
        exp_alerts:
          - exp_labels:
              host: morpheus
              component: network
              severity: warning
              category: config
            exp_annotations:
              summary: "morpheus: the dynamic DNS record has not been checked for 6h"
              description: >-
                The collector could not compare the dynamic DNS name with the
                WAN address — the public resolver did not answer, ssh to the
                firewall failed, or no enabled Dynamic DNS entry exists. This
                says nothing about whether the record is right; it says
                nothing is watching it. Run `make gateway-state` and read its
                last line.
      - eval_time: 7h
        alertname: DdnsRecordStale
        exp_alerts: []

  # --- A matching record stays quiet ----------------------------------------
  - interval: 1m
    input_series:
      - series: 'homelab_ddns_record_checked{host="morpheus"}'
        values: "1x480"
      - series: 'homelab_ddns_record_matches_wan{host="morpheus"}'
        values: "1x480"
    alert_rule_test:
      - eval_time: 7h
        alertname: DdnsRecordStale
        exp_alerts: []
      - eval_time: 7h
        alertname: DdnsRecordUnchecked
        exp_alerts: []

  # --- The seven network rules untested until #843 -------------------------

  # SnmpExporterDown: the exporter's own scrape fails for its 5m `for`.
  - interval: 1m
    input_series:
      - series: 'up{job="snmp-exporter",instance="snmp-exporter:9116"}'
        values: "1x2 0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: SnmpExporterDown
        exp_alerts: []
      - eval_time: 8m
        alertname: SnmpExporterDown
        exp_alerts:
          - exp_labels:
              alertname: SnmpExporterDown
              job: snmp-exporter
              instance: snmp-exporter:9116
              component: network
              severity: critical
              category: availability
            exp_annotations:
              summary: "snmp-exporter is down \u2014 every SNMP device will appear unreachable"

  # SnmpTargetUnreachable: neo stops answering and fires after 10m; mjolnir answers
  # and does not. The exporter itself is up, so this is the device's failure.
  - interval: 1m
    input_series:
      - series: 'up{job="snmp",instance="10.0.99.2",device="neo",role="switch",vlan="1"}'
        values: "0x15"
      - series: 'up{job="snmp",instance="10.0.99.10",device="mjolnir",role="ups",vlan="99"}'
        values: "1x15"
    alert_rule_test:
      - eval_time: 8m
        alertname: SnmpTargetUnreachable
        exp_alerts: []
      - eval_time: 12m
        alertname: SnmpTargetUnreachable
        exp_alerts:
          - exp_labels:
              alertname: SnmpTargetUnreachable
              job: snmp
              instance: 10.0.99.2
              device: neo
              role: switch
              vlan: 1
              component: network
              severity: warning
              category: availability
            exp_annotations:
              summary: "SNMP device neo (10.0.99.2) is not responding"
              description: >-
                Role switch on VLAN 1. Check the device is up and that its SNMP
                community still matches the one in secrets/observability.sops.yaml.

  # SnmpScrapeSlow: morpheus at 35s, past 30 and inside the 45s timeout, fires after
  # 15m; neo at 20s does not.
  - interval: 1m
    input_series:
      - series: 'scrape_duration_seconds{job="snmp",instance="10.0.99.1",device="morpheus"}'
        values: "35x20"
      - series: 'scrape_duration_seconds{job="snmp",instance="10.0.99.2",device="neo"}'
        values: "20x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: SnmpScrapeSlow
        exp_alerts: []
      - eval_time: 17m
        alertname: SnmpScrapeSlow
        exp_alerts:
          - exp_labels:
              alertname: SnmpScrapeSlow
              job: snmp
              instance: 10.0.99.1
              device: morpheus
              component: network
              severity: warning
              category: performance
            exp_annotations:
              summary: "SNMP scrape of morpheus takes 35s"
              description: >-
                The scrape timeout is 45s. A walk creeping toward it will start
                producing gaps — narrow the module's OID list in generator.yaml.

  # PfNotRunning: pf disabled (0) for its 2m `for`. Quiet at 1m, firing at 3m.
  - interval: 1m
    input_series:
      - series: 'pfStatusRunning{job="snmp",instance="10.0.99.1",device="morpheus"}'
        values: "0x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: PfNotRunning
        exp_alerts: []
      - eval_time: 3m
        alertname: PfNotRunning
        exp_alerts:
          - exp_labels:
              alertname: PfNotRunning
              job: snmp
              instance: 10.0.99.1
              device: morpheus
              component: network
              severity: critical
              category: security
            exp_annotations:
              summary: "Packet filter is NOT running on morpheus"
              description: >-
                pf is disabled. Inter-VLAN isolation and the default-deny posture
                are not being enforced.

  # PfStateTableNearLimit: 90k states of a 100k limit fires after 10m; the same
  # limit at 70k, a minute later in a second case, does not.
  - interval: 1m
    input_series:
      - series: 'pfStateTableCount{job="snmp",instance="10.0.99.1",device="morpheus"}'
        values: "90000x15"
      - series: 'pfLimitsStates{job="snmp",instance="10.0.99.1",device="morpheus"}'
        values: "100000x15"
    alert_rule_test:
      - eval_time: 8m
        alertname: PfStateTableNearLimit
        exp_alerts: []
      - eval_time: 12m
        alertname: PfStateTableNearLimit
        exp_alerts:
          - exp_labels:
              alertname: PfStateTableNearLimit
              job: snmp
              instance: 10.0.99.1
              device: morpheus
              component: network
              severity: warning
              category: saturation
            exp_annotations:
              summary: "pf state table at 90% of limit"
              description: "New connections are dropped once the state table fills."

  # PfStateTableNearLimit at 70%: no alert.
  - interval: 1m
    input_series:
      - series: 'pfStateTableCount{job="snmp",instance="10.0.99.1",device="morpheus"}'
        values: "70000x15"
      - series: 'pfLimitsStates{job="snmp",instance="10.0.99.1",device="morpheus"}'
        values: "100000x15"
    alert_rule_test:
      - eval_time: 14m
        alertname: PfStateTableNearLimit
        exp_alerts: []

  # PfMemoryDropsIncreasing: a climbing memory-drop counter is positive from its
  # second sample and fires 15m later; a flat one on the switch does not.
  - interval: 1m
    input_series:
      - series: 'pfCounterMemDrop{job="snmp",instance="10.0.99.1",device="morpheus"}'
        values: "0+3x40"
      - series: 'pfCounterMemDrop{job="snmp",instance="10.0.99.2",device="neo"}'
        values: "7+0x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: PfMemoryDropsIncreasing
        exp_alerts: []
      - eval_time: 32m
        alertname: PfMemoryDropsIncreasing
        exp_alerts:
          - exp_labels:
              alertname: PfMemoryDropsIncreasing
              job: snmp
              instance: 10.0.99.1
              device: morpheus
              component: network
              severity: warning
              category: saturation
            exp_annotations:
              summary: "pf is dropping packets for lack of memory on morpheus"

  # SwitchInterfaceDown: port 15 was up and goes down at 30m, and fires 5m later.
  # Port 20 has been down the whole hour, which is a port nothing is plugged into, not
  # a port that went down, and the `max_over_time == 1` join is what keeps it quiet.
  - interval: 1m
    input_series:
      - series: 'ifOperStatus{job="snmp",instance="10.0.99.2",device="neo",ifIndex="15",ifDescr="port 15"}'
        values: "1x30 2x30"
      - series: 'ifOperStatus{job="snmp",instance="10.0.99.2",device="neo",ifIndex="20",ifDescr="port 20"}'
        values: "2x60"
    alert_rule_test:
      - eval_time: 33m
        alertname: SwitchInterfaceDown
        exp_alerts: []
      - eval_time: 37m
        alertname: SwitchInterfaceDown
        exp_alerts:
          - exp_labels:
              alertname: SwitchInterfaceDown
              job: snmp
              instance: 10.0.99.2
              device: neo
              ifIndex: 15
              ifDescr: port 15
              component: network
              severity: warning
              category: availability
            exp_annotations:
              summary: "Interface port 15 on neo went down"
