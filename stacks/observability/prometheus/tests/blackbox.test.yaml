---
# Unit tests for blackbox.rules.yaml.
#
# EndpointNameNotResolving is the rule these exist for. It carries an
# `and on (name)` join between two series that differ in every label but one,
# and a join that matches nothing is invisible to `promtool check rules` — it
# parses, loads, reports healthy, and can never fire. That is #63 exactly, and
# it is why the two cases below assert both that the rule fires when it should
# and that it stays silent during a full outage, when the louder
# EndpointUnreachable owns the page.
#
# The expiry cases at the bottom pin two things a syntax check cannot see:
# that `min by (name, role, host)` collapses Grafana's two probes into ONE
# alert rather than two, and that $value is days — an expression that forgot
# the /86400 would still parse, still load, and fire on every certificate in
# the estate at once.
#
# time() in these tests is seconds since the start of the test, not wall
# clock, so an expiry timestamp is written as (days × 86400) plus the eval
# time at which the day count should come out whole.
rule_files:
  - ../rules/blackbox.rules.yaml

evaluation_interval: 1m

tests:
  # --- Full outage: nothing answers, by name or by address -----------------
  # The real state of the estate when this rule was written. Both probes fail,
  # so EndpointUnreachable fires twice — once per probe — and
  # EndpointNameNotResolving must NOT fire, because the service is not up.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="http://lemmiwinks.matrix.elysium",
                 name="wiki", role="documentation", host="oracle", via="dns"}'
        values: "0+0x15"
      - series: 'probe_success{job="blackbox", instance="http://10.0.99.30",
                 name="wiki", role="documentation", host="oracle", via="address"}'
        values: "0+0x15"
    alert_rule_test:
      - eval_time: 11m
        alertname: EndpointUnreachable
        exp_alerts:
          - exp_labels:
              alertname: EndpointUnreachable
              job: blackbox
              instance: "http://10.0.99.30"
              name: wiki
              role: documentation
              host: oracle
              via: address
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/triage-a-critical-alert.md#endpointunreachable"
              summary: "wiki is not reachable at http://10.0.99.30"
              description: >-
                Probed by address and got no successful response for five
                minutes. Expected on oracle. If the `address` probe for this
                endpoint is also firing, the service is down; if only the `dns`
                one is, the service is up and its name is not resolving. For an
                https target, a certificate that no longer verifies looks exactly
                like this — `make certs ARGS=--list` shows what is being served.
          - exp_labels:
              alertname: EndpointUnreachable
              job: blackbox
              instance: "http://lemmiwinks.matrix.elysium"
              name: wiki
              role: documentation
              host: oracle
              via: dns
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/triage-a-critical-alert.md#endpointunreachable"
              summary: "wiki is not reachable at http://lemmiwinks.matrix.elysium"
              description: >-
                Probed by dns and got no successful response for five
                minutes. Expected on oracle. If the `address` probe for this
                endpoint is also firing, the service is down; if only the `dns`
                one is, the service is up and its name is not resolving. For an
                https target, a certificate that no longer verifies looks exactly
                like this — `make certs ARGS=--list` shows what is being served.

      # Silent, and this is the assertion that matters. A full outage must not
      # also raise the name-resolution warning — that would put two different
      # repairs in front of whoever is woken up.
      - eval_time: 11m
        alertname: EndpointNameNotResolving
        exp_alerts: []

  # --- Name stops resolving, service stays up ------------------------------
  # The join under test. If `and on (name)` ever stops matching, this case goes
  # silent and nothing else in CI notices.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="http://lemmiwinks.matrix.elysium",
                 name="wiki", role="documentation", host="oracle", via="dns"}'
        values: "0+0x15"
      - series: 'probe_success{job="blackbox", instance="http://10.0.99.30",
                 name="wiki", role="documentation", host="oracle", via="address"}'
        values: "1+0x15"
    alert_rule_test:
      - eval_time: 11m
        alertname: EndpointNameNotResolving
        exp_alerts:
          - exp_labels:
              alertname: EndpointNameNotResolving
              job: blackbox
              instance: "http://lemmiwinks.matrix.elysium"
              name: wiki
              role: documentation
              host: oracle
              via: dns
              component: blackbox
              severity: warning
              category: availability
            exp_annotations:
              summary: "wiki answers on its address but not by name"
              description: >-
                The service is up. Its name is not resolving, so the URL written
                in the documentation and on the printed card does not work while
                the service behind it is fine. Check Unbound on morpheus and the
                host override for this name.

  # --- An endpoint with no dns twin goes down ------------------------------
  # Most of the targets added in #91 are probed by address alone, and one
  # (Alertmanager) by its compose name. Each must raise EndpointUnreachable on
  # its own, and the join must have nothing to say: EndpointNameNotResolving
  # requires a `dns` probe of the same name, and there is none.
  #
  # The worked example here used to be switch-ui, which was the clearest case
  # until ADR-0018 gave the switch a name and a `dns` twin. It is a bad example
  # now for the one reason that matters — it would still pass, because these
  # series are synthetic, and a reader checking the premise against
  # targets/blackbox.yaml would find it false. ups-ui replaces it: the APC card
  # is addressed by IP and has no name to be given.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="https://10.0.99.10/",
                 name="ups-ui", role="ups", host="mjolnir", via="address"}'
        values: "0+0x15"
      - series: 'probe_success{job="blackbox", instance="http://alertmanager:9093/-/healthy",
                 name="alertmanager", role="alerting", host="prometheus", via="compose"}'
        values: "0+0x15"
      - series: 'probe_success{job="blackbox", instance="http://10.0.99.20:9090/-/healthy",
                 name="prometheus", role="metrics", host="prometheus", via="address"}'
        values: "1+0x15"
    alert_rule_test:
      - eval_time: 11m
        alertname: EndpointUnreachable
        exp_alerts:
          - exp_labels:
              alertname: EndpointUnreachable
              job: blackbox
              instance: "https://10.0.99.10/"
              name: ups-ui
              role: ups
              host: mjolnir
              via: address
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/triage-a-critical-alert.md#endpointunreachable"
              summary: "ups-ui is not reachable at https://10.0.99.10/"
              description: >-
                Probed by address and got no successful response for five
                minutes. Expected on mjolnir. If the `address` probe for this
                endpoint is also firing, the service is down; if only the `dns`
                one is, the service is up and its name is not resolving. For an
                https target, a certificate that no longer verifies looks exactly
                like this — `make certs ARGS=--list` shows what is being served.
          - exp_labels:
              alertname: EndpointUnreachable
              job: blackbox
              instance: "http://alertmanager:9093/-/healthy"
              name: alertmanager
              role: alerting
              host: prometheus
              via: compose
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/triage-a-critical-alert.md#endpointunreachable"
              summary: "alertmanager is not reachable at http://alertmanager:9093/-/healthy"
              description: >-
                Probed by compose and got no successful response for five
                minutes. Expected on prometheus. If the `address` probe for this
                endpoint is also firing, the service is down; if only the `dns`
                one is, the service is up and its name is not resolving. For an
                https target, a certificate that no longer verifies looks exactly
                like this — `make certs ARGS=--list` shows what is being served.
      - eval_time: 11m
        alertname: EndpointNameNotResolving
        exp_alerts: []

  # --- Everything healthy --------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="http://lemmiwinks.matrix.elysium",
                 name="wiki", role="documentation", host="oracle", via="dns"}'
        values: "1+0x15"
      - series: 'probe_success{job="blackbox", instance="http://10.0.99.30",
                 name="wiki", role="documentation", host="oracle", via="address"}'
        values: "1+0x15"
      - series: 'up{job="blackbox-exporter", instance="blackbox-exporter:9115"}'
        values: "1+0x15"
    alert_rule_test:
      - eval_time: 11m
        alertname: EndpointUnreachable
        exp_alerts: []
      - eval_time: 11m
        alertname: EndpointNameNotResolving
        exp_alerts: []
      - eval_time: 11m
        alertname: BlackboxExporterDown
        exp_alerts: []

  # --- The prober itself dies ----------------------------------------------
  - interval: 1m
    input_series:
      - series: 'up{job="blackbox-exporter", instance="blackbox-exporter:9115"}'
        values: "0+0x15"
    alert_rule_test:
      - eval_time: 11m
        alertname: BlackboxExporterDown
        exp_alerts:
          - exp_labels:
              alertname: BlackboxExporterDown
              job: blackbox-exporter
              instance: "blackbox-exporter:9115"
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/triage-a-critical-alert.md#blackboxexporterdown"
              summary: "blackbox-exporter is down — every probed endpoint will look reachable"
              description: >-
                No probe is running. This is the failure mode that matters most,
                because a dead prober is silent rather than loud: the endpoint
                alerts below stop being evaluated and nothing reports a problem.

  # --- Expiry: 20 days out, served on two URLs ----------------------------
  # Grafana's leaf, probed by name and by address, with the APC card's
  # self-signed certificate alongside at 400 days as the one that must stay
  # quiet. 1735200 = 20 × 86400 + 7200, so at eval_time 2h the division comes
  # out at exactly 20 and the summary is checkable to the character.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox",
                 instance="https://grafana.matrix.elysium:3000/api/health",
                 name="grafana", role="dashboards", host="prometheus", via="dns"}'
        values: "1735200+0x180"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://10.0.99.20:3000/api/health",
                 name="grafana", role="dashboards", host="prometheus", via="address"}'
        values: "1735200+0x180"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://10.0.99.10/",
                 name="ups-ui", role="ups", host="mjolnir", via="address"}'
        values: "34567200+0x180"
    alert_rule_test:
      # Under 30 days from t=0, but `for: 1h` — still pending at half an hour.
      # This is what asserts the `for` is actually there.
      - eval_time: 30m
        alertname: TlsCertificateExpiringSoon
        exp_alerts: []

      # ONE alert, not two. Both of Grafana's probes see the same leaf, and
      # `instance`/`via` are gone from the labels because `min by` dropped
      # them. If the aggregation is ever removed this case fails with two
      # alerts carrying URLs — the exact duplication it is here to prevent.
      - eval_time: 2h
        alertname: TlsCertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              alertname: TlsCertificateExpiringSoon
              name: grafana
              role: dashboards
              host: prometheus
              component: blackbox
              severity: warning
              category: availability
            exp_annotations:
              summary: "grafana's certificate has 20 days left"
              description: >-
                Read from the handshake with the endpoint on prometheus, so
                this is the certificate actually being served. Reissue it before it
                runs out — docs/runbooks/generate-certificates.md for a lab-CA leaf,
                the device's own management UI for a self-signed one — then restart
                whatever serves it. The alert resolves on the next probe of the new
                certificate.

      # 20 days is not 7. The critical tier stays silent.
      - eval_time: 2h
        alertname: TlsCertificateExpiryImminent
        exp_alerts: []

  # --- Expiry: 3 days out, and one already expired -------------------------
  # Both tiers fire at Prometheus for the 3-day one; alertmanager.yaml's
  # inhibit rule is what keeps the warning off the phone. Nothing tests that
  # inhibit: promtool cannot see Alertmanager, and amtool's `config routes
  # test` in scripts/validate.sh checks routing, not inhibition. The expired
  # one has a negative day count, which the summary prints as-is: a
  # self-signed device keeps serving after expiry, so the metric keeps
  # arriving and the number keeps falling. 262800 = 3 × 86400 + 3600; -165600 = 7200 - 2 × 86400.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://10.0.99.1/",
                 name="pfsense-ui", role="firewall", host="morpheus", via="address"}'
        values: "262800+0x180"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://10.0.30.10/",
                 name="ilo-ui", role="hypervisor-bmc", host="shiva", via="address"}'
        values: "-165600+0x180"
    alert_rule_test:
      - eval_time: 2h
        alertname: TlsCertificateExpiryImminent
        exp_alerts:
          - exp_labels:
              alertname: TlsCertificateExpiryImminent
              name: ilo-ui
              role: hypervisor-bmc
              host: shiva
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/generate-certificates.md#renewal"
              summary: "ilo-ui's certificate has -2 days left"
              description: >-
                Under a week, or already expired if the number is negative. A
                lab-CA leaf that expires stops verifying, so Grafana's probe and
                Prometheus's `grafana` scrape both go down with it; a self-signed
                device certificate keeps answering and browsers start refusing it.
                Reissue now — docs/runbooks/generate-certificates.md — and restart
                whatever serves it.
          - exp_labels:
              alertname: TlsCertificateExpiryImminent
              name: pfsense-ui
              role: firewall
              host: morpheus
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/generate-certificates.md#renewal"
              summary: "pfsense-ui's certificate has 3 days left"
              description: >-
                Under a week, or already expired if the number is negative. A
                lab-CA leaf that expires stops verifying, so Grafana's probe and
                Prometheus's `grafana` scrape both go down with it; a self-signed
                device certificate keeps answering and browsers start refusing it.
                Reissue now — docs/runbooks/generate-certificates.md — and restart
                whatever serves it.

      # The warning fires too — inhibited downstream, not absent here. A
      # warning expression that excluded the critical range would instead
      # RESOLVE the moment the critical started, and a resolved notification
      # for a certificate three days from expiry is a lie.
      - eval_time: 2h
        alertname: TlsCertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              alertname: TlsCertificateExpiringSoon
              name: ilo-ui
              role: hypervisor-bmc
              host: shiva
              component: blackbox
              severity: warning
              category: availability
            exp_annotations:
              summary: "ilo-ui's certificate has -2 days left"
              description: >-
                Read from the handshake with the endpoint on shiva, so
                this is the certificate actually being served. Reissue it before it
                runs out — docs/runbooks/generate-certificates.md for a lab-CA leaf,
                the device's own management UI for a self-signed one — then restart
                whatever serves it. The alert resolves on the next probe of the new
                certificate.
          - exp_labels:
              alertname: TlsCertificateExpiringSoon
              name: pfsense-ui
              role: firewall
              host: morpheus
              component: blackbox
              severity: warning
              category: availability
            exp_annotations:
              summary: "pfsense-ui's certificate has 3 days left"
              description: >-
                Read from the handshake with the endpoint on morpheus, so
                this is the certificate actually being served. Reissue it before it
                runs out — docs/runbooks/generate-certificates.md for a lab-CA leaf,
                the device's own management UI for a self-signed one — then restart
                whatever serves it. The alert resolves on the next probe of the new
                certificate.

  # --- Expiry: the estate as it stands -------------------------------------
  # Grafana at 823 days and the APC card at ~3390, the real numbers on
  # 2026-09-03. Both tiers silent; a rule that forgot the /86400 would fire
  # here on every certificate at once, because a timestamp in seconds is
  # never under 30.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://10.0.99.20:3000/api/health",
                 name="grafana", role="dashboards", host="prometheus", via="address"}'
        values: "71114400+0x180"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://10.0.99.10/",
                 name="ups-ui", role="ups", host="mjolnir", via="address"}'
        values: "292903200+0x180"
    alert_rule_test:
      - eval_time: 2h
        alertname: TlsCertificateExpiringSoon
        exp_alerts: []
      - eval_time: 2h
        alertname: TlsCertificateExpiryImminent
        exp_alerts: []

  # --- GatewayLatencyHigh: fires on sustained elevation ---------------------
  # 50ms held for well over the twenty minutes the rule needs. Against a
  # measured baseline of 0.52ms this is the LAN being genuinely wrong.
  - interval: 30s
    input_series:
      - series: 'probe_duration_seconds{job="blackbox-latency",scope="gateway",name="gateway",instance="10.0.99.1:53"}'
        values: "0.050x120"
    alert_rule_test:
      - eval_time: 40m
        alertname: GatewayLatencyHigh
        exp_alerts:
          - exp_labels:
              job: blackbox-latency
              scope: gateway
              name: gateway
              instance: 10.0.99.1:53
              component: blackbox
              severity: warning
              category: capacity
            exp_annotations:
              summary: "Round-trip time to the gateway has been above 10ms for twenty minutes"
              description: >-
                A TCP connect to gateway is averaging 50ms against a measured
                baseline of about 0.5ms. This is inside the house — the switch,
                the segment or the firewall itself — and not the ISP. If
                InternetLatencyHigh is also firing, this is the more likely cause
                of both.

  # --- GatewayLatencyHigh: quiet at the measured baseline -------------------
  # 0.52ms is the median actually observed. Without this case the rule would
  # pass its test while firing continuously for a healthy gateway.
  - interval: 30s
    input_series:
      - series: 'probe_duration_seconds{job="blackbox-latency",scope="gateway",name="gateway"}'
        values: "0.00052x120"
    alert_rule_test:
      - eval_time: 40m
        alertname: GatewayLatencyHigh
        exp_alerts: []

  # --- GatewayLatencyHigh: quiet for a single bad handshake -----------------
  # THE CASE #166 ASKED FOR: "a probe that alarms on one bad RTT will alarm
  # constantly and be muted within a week". One 500ms sample in an otherwise
  # healthy ten minutes lifts the average nowhere near 10ms, and this fixture is
  # what stops the expression being simplified to an instantaneous comparison.
  - interval: 30s
    input_series:
      - series: 'probe_duration_seconds{job="blackbox-latency",scope="gateway",name="gateway"}'
        values: "0.0005x40 0.5 0.0005x79"
    alert_rule_test:
      - eval_time: 40m
        alertname: GatewayLatencyHigh
        exp_alerts: []

  # --- InternetLatencyHigh: fires per anchor -------------------------------
  # One anchor slow and the other fine, which is the case that distinguishes
  # "that resolver is having a bad day" from "the link is bad". Only the slow
  # one may fire.
  - interval: 30s
    input_series:
      - series: 'probe_duration_seconds{job="blackbox-latency",scope="internet",name="cloudflare"}'
        values: "0.250x120"
      - series: 'probe_duration_seconds{job="blackbox-latency",scope="internet",name="google"}'
        values: "0.0137x120"
    alert_rule_test:
      - eval_time: 40m
        alertname: InternetLatencyHigh
        exp_alerts:
          - exp_labels:
              job: blackbox-latency
              scope: internet
              name: cloudflare
              component: blackbox
              severity: warning
              category: capacity
            exp_annotations:
              summary: "Round-trip time to cloudflare has been above 100ms for twenty minutes"
              description: >-
                A TCP connect to cloudflare is averaging 250ms against a measured
                baseline of about 14ms. If GatewayLatencyHigh is quiet, this is
                past the firewall — the ISP or beyond. If both anchors are firing
                it is the link; if only one is, it is that provider. Slow is not
                down: nothing here is unreachable, or EndpointUnreachable would
                be firing instead.

  # --- InternetLatencyHigh: quiet at the measured baseline, outlier included -
  # 13.7ms steady with the 28.72ms sample that was actually observed. That
  # outlier is precisely what a threshold on the instantaneous value would have
  # fired on, and it must not fire here.
  - interval: 30s
    input_series:
      - series: 'probe_duration_seconds{job="blackbox-latency",scope="internet",name="google"}'
        values: "0.0137x60 0.02872 0.0137x59"
    alert_rule_test:
      - eval_time: 40m
        alertname: InternetLatencyHigh
        exp_alerts: []

  # --- ACME leaves: out of the 30/7-day rules, into their own ---------------
  # The page this exists for: a seven-day leaf, freshly issued, read as "7
  # days left" and paged `urgent` the day the ntfy probe was enabled (#136).
  # A healthy one at five days must fire neither estate expiry rule nor
  # either hours rule. At 40 hours, some sixteen hours after Caddy should have
  # renewed it, TlsAcmeRenewalLate fires alone. At 30 hours, a day late, both
  # hours rules fire at Prometheus and neither days rule does. Keeping the
  # warning off the phone is left to alertmanager.yaml's inhibit (#426).
  - interval: 1m
    input_series:
      # Five days out at t=0, healthy.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://ntfy.matrix.elysium/v1/health",
                 name="ntfy", role="alerting", host="trinity", via="dns", renewal="acme"}'
        values: "432000+0x180"
    alert_rule_test:
      - eval_time: 2h
        alertname: TlsCertificateExpiringSoon
        exp_alerts: []
      - eval_time: 2h
        alertname: TlsCertificateExpiryImminent
        exp_alerts: []
      - eval_time: 2h
        alertname: TlsAcmeRenewalLate
        exp_alerts: []
      - eval_time: 2h
        alertname: TlsAcmeRenewalStalled
        exp_alerts: []

  - interval: 1m
    input_series:
      # 40 hours out at t=1h (144000 + 3600): renewal late, not yet stalled.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://ntfy.matrix.elysium/v1/health",
                 name="ntfy", role="alerting", host="trinity", via="dns", renewal="acme"}'
        values: "147600+0x120"
    alert_rule_test:
      # `for: 30m`: pending at 20 minutes.
      - eval_time: 20m
        alertname: TlsAcmeRenewalLate
        exp_alerts: []
      - eval_time: 1h
        alertname: TlsAcmeRenewalLate
        exp_alerts:
          - exp_labels:
              alertname: TlsAcmeRenewalLate
              name: ntfy
              role: alerting
              host: trinity
              component: blackbox
              severity: warning
              category: availability
            exp_annotations:
              summary: "ntfy's ACME certificate has 40h left"
              description: >-
                Caddy on trinity should have renewed this leaf at about
                56 hours left and has not. Nothing has stopped verifying yet;
                TlsAcmeRenewalStalled pages at 36. Read Caddy's log for the renewal
                error (`docker logs sensitive-caddy 2>&1 | grep -i renew`), then
                check step-ca is healthy — docs/runbooks/build-the-tier-ca.md.
      # 40 is not 36. The critical tier stays silent.
      - eval_time: 1h
        alertname: TlsAcmeRenewalStalled
        exp_alerts: []

  - interval: 1m
    input_series:
      # 30 hours out at t=1h (108000 + 3600): a stalled renewal.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://ntfy.matrix.elysium/v1/health",
                 name="ntfy", role="alerting", host="trinity", via="dns", renewal="acme"}'
        values: "111600+0x120"
    alert_rule_test:
      # `for: 30m`: pending at 20 minutes.
      - eval_time: 20m
        alertname: TlsAcmeRenewalStalled
        exp_alerts: []
      - eval_time: 1h
        alertname: TlsAcmeRenewalStalled
        exp_alerts:
          - exp_labels:
              alertname: TlsAcmeRenewalStalled
              name: ntfy
              role: alerting
              host: trinity
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/build-the-tier-ca.md#5-verify--the-certificate-caddy-is-serving-not-the-files-on-disk"
              summary: "ntfy's ACME certificate has 30h left and has not renewed"
              description: >-
                Caddy on trinity should have renewed this leaf about a day
                ago. Read Caddy's log for the renewal error first
                (`docker logs sensitive-caddy 2>&1 | grep -i renew`), then check
                step-ca is healthy — docs/runbooks/build-the-tier-ca.md. When it
                lapses, every name on the tier stops verifying.
      - eval_time: 1h
        alertname: TlsCertificateExpiryImminent
        exp_alerts: []
      # The warning fires beside it at Prometheus; alertmanager.yaml's inhibit
      # is what keeps it off the phone.
      - eval_time: 1h
        alertname: TlsAcmeRenewalLate
        exp_alerts:
          - exp_labels:
              alertname: TlsAcmeRenewalLate
              name: ntfy
              role: alerting
              host: trinity
              component: blackbox
              severity: warning
              category: availability
            exp_annotations:
              summary: "ntfy's ACME certificate has 30h left"
              description: >-
                Caddy on trinity should have renewed this leaf at about
                56 hours left and has not. Nothing has stopped verifying yet;
                TlsAcmeRenewalStalled pages at 36. Read Caddy's log for the renewal
                error (`docker logs sensitive-caddy 2>&1 | grep -i renew`), then
                check step-ca is healthy — docs/runbooks/build-the-tier-ca.md.

  # --- The ingest proxy stopped refusing (#182) -----------------------------
  # Prometheus answered a token-less query with a 200: republished directly,
  # or the Caddyfile lost its allowlist. IngestAuthNotEnforced fires. The same
  # probe failing must NOT also raise EndpointUnreachable, whose sentence
  # ("not reachable") would be wrong about a door that opened.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="http://10.0.99.20:9090/api/v1/query?query=up",
                 name="prometheus", role="metrics", host="prometheus", via="refusal"}'
        values: "0+0x10"
      - series: 'probe_http_status_code{job="blackbox", instance="http://10.0.99.20:9090/api/v1/query?query=up",
                 name="prometheus", role="metrics", host="prometheus", via="refusal"}'
        values: "200+0x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: IngestAuthNotEnforced
        exp_alerts: []
      - eval_time: 6m
        alertname: IngestAuthNotEnforced
        exp_alerts:
          - exp_labels:
              alertname: IngestAuthNotEnforced
              job: blackbox
              instance: "http://10.0.99.20:9090/api/v1/query?query=up"
              name: prometheus
              role: metrics
              host: prometheus
              via: refusal
              component: blackbox
              severity: critical
              category: security
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/respond-to-a-security-alert.md#ingestauthnotenforced"
              summary: >-
                prometheus at http://10.0.99.20:9090/api/v1/query?query=up did
                not refuse a request with no token
              description: >-
                The ingest proxy should answer this with 401 and its
                `realm="homelab-ingest"` challenge. Something else answered.
                Check what holds the port: `docker ps` for a service published on
                it directly, and `docker compose logs caddy` for the proxy.
                Until it is fixed, anything that can route to 10.0.99.20 may read,
                write or delete without a credential.
      - eval_time: 6m
        alertname: EndpointUnreachable
        exp_alerts: []

  # --- The proxy is down, not open ------------------------------------------
  # Connection refused: no HTTP status at all. That is an outage, which the
  # `address` health probe of the same port pages on. It says nothing about
  # authentication, so IngestAuthNotEnforced stays quiet.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="http://10.0.99.20:3100/loki/api/v1/delete",
                 name="loki", role="logs", host="prometheus", via="refusal"}'
        values: "0+0x10"
      - series: 'probe_http_status_code{job="blackbox", instance="http://10.0.99.20:3100/loki/api/v1/delete",
                 name="loki", role="logs", host="prometheus", via="refusal"}'
        values: "0+0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: IngestAuthNotEnforced
        exp_alerts: []
      - eval_time: 10m
        alertname: EndpointUnreachable
        exp_alerts: []

  # --- Refused, as it should be -----------------------------------------------
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="http://10.0.99.20:3100/loki/api/v1/delete",
                 name="loki", role="logs", host="prometheus", via="refusal"}'
        values: "1+0x10"
      - series: 'probe_http_status_code{job="blackbox", instance="http://10.0.99.20:3100/loki/api/v1/delete",
                 name="loki", role="logs", host="prometheus", via="refusal"}'
        values: "401+0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: IngestAuthNotEnforced
        exp_alerts: []

  # --- SiteDown: one household site on trinity stops answering (#855) -----
  # Three things a syntax check cannot see. That `for: 10m` is what decides
  # it — pending at 9 minutes, firing at 11. That the alert carries no
  # `instance` or `via`, which is what lets Alertmanager group every site into
  # one notification. And that EndpointUnreachable stays silent for the same
  # probe: without its `tier!="household"` the site would page twice, at five
  # minutes and again at ten.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="https://vaultwarden.matrix.elysium/alive",
                 name="vaultwarden", role="passwords", host="trinity", via="dns", renewal="acme", tier="household"}'
        values: "0+0x15"
      - series: 'probe_success{job="blackbox", instance="https://ntfy.matrix.elysium/v1/health",
                 name="ntfy", role="alerting", host="trinity", via="dns", renewal="acme"}'
        values: "1+0x15"
    alert_rule_test:
      - eval_time: 9m
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 11m
        alertname: SiteDown
        exp_alerts:
          - exp_labels:
              alertname: SiteDown
              name: vaultwarden
              role: passwords
              host: trinity
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/triage-a-critical-alert.md#sitedown"
              summary: "vaultwarden is not answering on trinity"
              description: >-
                Probed through Caddy by name for ten minutes, with no successful
                response. If it is the only site firing, the service behind it is
                down: `make ps STACK=sensitive` on trinity, then its
                container's log. If every household site is firing, it is Caddy or
                the host itself. A certificate that no longer verifies looks
                exactly like this too.
      - eval_time: 11m
        alertname: EndpointUnreachable
        exp_alerts: []

  # --- SiteDown: Caddy itself is down ---------------------------------------
  # Every site fails at once, ntfy with them. Each household site fires
  # SiteDown under its own name; ntfy, which carries no `tier`, fires
  # EndpointUnreachable at five minutes and is the only thing that does.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="https://immich.matrix.elysium/api/server/ping",
                 name="immich", role="photos", host="trinity", via="dns", renewal="acme", tier="household"}'
        values: "0+0x15"
      - series: 'probe_success{job="blackbox", instance="https://memos.matrix.elysium/healthz",
                 name="memos", role="notes", host="trinity", via="dns", renewal="acme", tier="household"}'
        values: "0+0x15"
      - series: 'probe_success{job="blackbox", instance="https://ntfy.matrix.elysium/v1/health",
                 name="ntfy", role="alerting", host="trinity", via="dns", renewal="acme"}'
        values: "0+0x15"
    alert_rule_test:
      - eval_time: 6m
        alertname: EndpointUnreachable
        exp_alerts:
          - exp_labels:
              alertname: EndpointUnreachable
              job: blackbox
              instance: "https://ntfy.matrix.elysium/v1/health"
              name: ntfy
              role: alerting
              host: trinity
              via: dns
              renewal: acme
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/triage-a-critical-alert.md#endpointunreachable"
              summary: "ntfy is not reachable at https://ntfy.matrix.elysium/v1/health"
              description: >-
                Probed by dns and got no successful response for five
                minutes. Expected on trinity. If the `address` probe for this
                endpoint is also firing, the service is down; if only the `dns`
                one is, the service is up and its name is not resolving. For an
                https target, a certificate that no longer verifies looks exactly
                like this — `make certs ARGS=--list` shows what is being served.
      - eval_time: 6m
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 11m
        alertname: SiteDown
        exp_alerts:
          - exp_labels:
              alertname: SiteDown
              name: immich
              role: photos
              host: trinity
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/triage-a-critical-alert.md#sitedown"
              summary: "immich is not answering on trinity"
              description: >-
                Probed through Caddy by name for ten minutes, with no successful
                response. If it is the only site firing, the service behind it is
                down: `make ps STACK=sensitive` on trinity, then its
                container's log. If every household site is firing, it is Caddy or
                the host itself. A certificate that no longer verifies looks
                exactly like this too.
          - exp_labels:
              alertname: SiteDown
              name: memos
              role: notes
              host: trinity
              component: blackbox
              severity: critical
              category: availability
            exp_annotations:
              runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/triage-a-critical-alert.md#sitedown"
              summary: "memos is not answering on trinity"
              description: >-
                Probed through Caddy by name for ten minutes, with no successful
                response. If it is the only site firing, the service behind it is
                down: `make ps STACK=sensitive` on trinity, then its
                container's log. If every household site is firing, it is Caddy or
                the host itself. A certificate that no longer verifies looks
                exactly like this too.

  # --- SiteDown: a `make up` restart is not an outage -----------------------
  # Down for seven minutes — longer than EndpointUnreachable's five, which is
  # the case the longer `for` exists for — then back. SiteDown must never
  # fire.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", instance="https://immich.matrix.elysium/api/server/ping",
                 name="immich", role="photos", host="trinity", via="dns", renewal="acme", tier="household"}'
        values: "1 0x6 1x12"
    alert_rule_test:
      - eval_time: 7m
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 12m
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 7m
        alertname: EndpointUnreachable
        exp_alerts: []

  # --- A household site's ACME leaf reaches the hours pair, not the days ---
  # `renewal: acme` on every household target is what keeps a healthy
  # seven-day leaf off the 30/7-day rules; this pins it for a site that is
  # not ntfy. At 40 hours: TlsAcmeRenewalLate under its own name, and neither
  # days rule.
  - interval: 1m
    input_series:
      # 40 hours out at t=1h (144000 + 3600).
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://vaultwarden.matrix.elysium/alive",
                 name="vaultwarden", role="passwords", host="trinity", via="dns", renewal="acme", tier="household"}'
        values: "147600+0x120"
    alert_rule_test:
      - eval_time: 1h
        alertname: TlsAcmeRenewalLate
        exp_alerts:
          - exp_labels:
              alertname: TlsAcmeRenewalLate
              name: vaultwarden
              role: passwords
              host: trinity
              component: blackbox
              severity: warning
              category: availability
            exp_annotations:
              summary: "vaultwarden's ACME certificate has 40h left"
              description: >-
                Caddy on trinity should have renewed this leaf at about
                56 hours left and has not. Nothing has stopped verifying yet;
                TlsAcmeRenewalStalled pages at 36. Read Caddy's log for the renewal
                error (`docker logs sensitive-caddy 2>&1 | grep -i renew`), then
                check step-ca is healthy — docs/runbooks/build-the-tier-ca.md.
      - eval_time: 1h
        alertname: TlsCertificateExpiringSoon
        exp_alerts: []
      - eval_time: 1h
        alertname: TlsCertificateExpiryImminent
        exp_alerts: []
