---
# Blackbox probe targets, consumed by the `blackbox` job via file_sd_configs.
# Hot-reloaded every 5 minutes — no Prometheus restart required.
#
# `module` selects a prober from blackbox/blackbox.yaml — by what the endpoint
#          serves, see the table at the top of that file.
# `name`   is what the alert says out loud, so write it for whoever is woken up.
# `host`   is the machine the endpoint is expected on, as network.md names it.
# `renewal` is `acme` for a certificate something renews on its own on a short
#          lifetime — today, the sensitive tier's — and absent otherwise. It
#          selects which expiry rules apply (blackbox.rules.yaml).
# `tier`   is `household` for a service the house uses behind trinity's Caddy,
#          and absent otherwise. It moves the target from EndpointUnreachable
#          (5m) to SiteDown (10m), which rides out a `make up` on trinity.
# `via`    is how the endpoint was addressed: `dns` by the name a person types,
#          `address` by its IP, `compose` by its service name on the compose
#          network. A `dns` probe should have an `address` twin, because both
#          failing means the service is down while only the `dns` one failing
#          means the service is up and the resolver is not — a different repair,
#          and EndpointNameNotResolving joins the two on `name` to tell it.
#
# Every target here was probed from the running exporter before it was added,
# so the module matches what the endpoint actually does — because the first
# deploy of this file did not check, probed the wiki over https, and reported
# it down while it was serving fine over plain http (verified 2026-08-30: only
# port 3000 listens inside the container, TLS off).

# --- The wiki ----------------------------------------------------------------
# Probed twice on purpose: once by the name on the printed card, once by its
# address. See `via` above.
#
# Over https and verified against the lab CA since #847 (ADR-0082): Caddy on
# oracle terminates TLS with a leaf from it, and port 80 only redirects. So
# these also read the leaf's expiry, and the `address` probe is what checks
# it carries its IP SAN, as Grafana's does below. `/healthz` because it is
# Wiki.js's own and answers without a session, so a 200 means Caddy, the
# proxy and Wiki.js all answered.

- targets: ["https://lemmiwinks.matrix.elysium/healthz"]
  labels:
    module: http_2xx_lab_ca
    name: wiki
    role: documentation
    host: oracle
    via: dns

- targets: ["https://10.0.99.30/healthz"]
  labels:
    module: http_2xx_lab_ca
    name: wiki
    role: documentation
    host: oracle
    via: address

# --- The observability stack itself ----------------------------------------
# These are probed at the address an off-host consumer uses, not at the compose
# service name, wherever there is one. `up{job="grafana"}` already proves the
# process answers on the compose network; what it cannot prove is that the port
# is published to the right interface — a BIND_ADDR of 127.0.0.1 leaves every
# `up` green while a browser on Hicks and the agent on `oracle` both get
# nothing. Probing 10.0.99.20 hairpins through Docker's published port and
# fails in exactly that case.
#
# Grafana terminates TLS itself, on a lab-CA leaf, as the wiki's Caddy does:
# the chain is verified against certificates/ca.pem and the name against the
# URL, so the `address` probe is also what checks that the leaf carries its IP
# SAN.
# `/api/health` because it answers without a session — `/` is a redirect to
# the login page, which also works, but says less.

- targets: ["https://grafana.matrix.elysium:3000/api/health"]
  labels:
    module: http_2xx_lab_ca
    name: grafana
    role: dashboards
    host: prometheus
    via: dns

- targets: ["https://10.0.99.20:3000/api/health"]
  labels:
    module: http_2xx_lab_ca
    name: grafana
    role: dashboards
    host: prometheus
    via: address

# Plain http on the management VLAN, and these two answer without a token:
# the ingest proxy that holds 10.0.99.20:9090 and :3100 passes its health
# paths through unauthenticated for exactly this probe (#182). A 200 here says
# the publish, the proxy and the service behind it all work. The paths are the
# readiness endpoints the compose healthchecks use.

- targets: ["http://10.0.99.20:9090/-/healthy"]
  labels:
    module: http_2xx_plain
    name: prometheus
    role: metrics
    host: prometheus
    via: address

- targets: ["http://10.0.99.20:3100/ready"]
  labels:
    module: http_2xx_plain
    name: loki
    role: logs
    host: prometheus
    via: address

# And the opposite question at the same address: is everything else still
# refused? A query with no token, and Loki's delete API with no token, must each
# get the ingest proxy's 401. `via: refusal` keeps these out of
# EndpointUnreachable and the dns/address join, and IngestAuthNotEnforced
# reads them. The delete path is probed rather than a read because it is the
# one whose loss would cost data.

- targets: ["http://10.0.99.20:9090/api/v1/query?query=up"]
  labels:
    module: http_401_ingest_refused
    name: prometheus
    role: metrics
    host: prometheus
    via: refusal

- targets: ["http://10.0.99.20:3100/loki/api/v1/delete"]
  labels:
    module: http_401_ingest_refused
    name: loki
    role: logs
    host: prometheus
    via: refusal

# Alertmanager publishes to 127.0.0.1 only (ADR-0012: nothing off-host uses
# it), so there is no published address to probe and the compose network is
# the only network it is on. `via: compose` says so, and keeps it out of the
# dns/address join.

- targets: ["http://alertmanager:9093/-/healthy"]
  labels:
    module: http_2xx_plain
    name: alertmanager
    role: alerting
    host: prometheus
    via: compose

# --- The in-house ntfy, where alerts are delivered (#136) -------------------
# Alertmanager's default, urgent and security receivers post to this service,
# so its absence must page through something other than itself. The probe
# fires EndpointUnreachable, which is critical and therefore routes to
# `urgent` — the receiver that also has an ntfy.sh copy (validate.sh pins the
# route). Without this target a dead ntfy would surface only as
# AlertmanagerNotificationsFailing, once something else had tried to page.
#
# By name only, with no `address` twin: the leaf comes from step-ca over ACME
# and carries the name and no IP SAN, and Caddy picks the site by SNI, so an
# https probe of 10.0.99.40 fails for a reason that says nothing about ntfy.
# `/v1/health` answers with no credential, deny-all notwithstanding. The
# module verifies the chain against the TIER'S root. It was the first HTTPS
# check of any of trinity's sites, and it stays on EndpointUnreachable rather
# than the household sites' SiteDown below: it is the alert-path probe that
# validate.sh and docs/runbooks/verify-the-alert-path.md pin, and five minutes
# is the right wait for the thing that delivers every other page.
#
# Enabled 2026-09-28 at the cutover (#136), after this was run from the live
# exporter on prometheus and answered probe_success 1, status 200, and a
# probe_ssl_earliest_cert_expiry of 2026-10-05T21:59:04Z: the same seven-day
# leaf Caddy was serving on trinity, so the chain verified against the tier's
# root end to end. Re-run it the same way if this ever goes red:
#
#   docker exec blackbox-exporter wget -qO- \
#     'http://localhost:9115/probe?target=https://ntfy.matrix.elysium/v1/health&module=http_2xx_tier_ca' \
#     | grep -E '^probe_(success|http_status_code|ssl_earliest_cert_expiry)'

- targets: ["https://ntfy.matrix.elysium/v1/health"]
  labels:
    module: http_2xx_tier_ca
    name: ntfy
    role: alerting
    host: trinity
    via: dns
    # A seven-day ACME leaf: the two 30/7-day expiry rules skip it and
    # TlsAcmeRenewalStalled watches it instead (blackbox.rules.yaml).
    renewal: acme

# --- The household sites on trinity (#855) ----------------------------------
# Every other name trinity's Caddy serves for the house, one probe each. Until
# these existed nothing outside trinity measured that a household service
# answered, and nothing watched its certificate: step-ca's leaves are seven
# days long (ADR-0037), so a stuck renewal is an outage within the week.
#
# Each one is the same shape as ntfy above, for the same reasons: by name only,
# because Caddy picks the site by SNI and the ACME leaf has no IP SAN;
# http_2xx_tier_ca, so the chain is verified against the tier's root; and
# `renewal: acme`, so TlsAcmeRenewalLate and TlsAcmeRenewalStalled watch each
# leaf. A stopped backend makes Caddy answer 502, which fails the probe.
#
# `tier: household` sends a failure to SiteDown rather than EndpointUnreachable:
# ten minutes rather than five, so `make up STACK=sensitive` restarting a
# service does not page, and one notification for all of them when Caddy
# itself is down (blackbox.rules.yaml says how).
#
# Every path answers 200 with no redirect and no session. That is the expected
# status for each, and module http_2xx_tier_ca accepts any 2xx. Checked
# 2026-10-07 from trinity through Caddy at 10.0.99.40, the chain verified
# against certificates/tier-ca.pem; re-run from the exporter on prometheus
# with the recipe above, swapping the target.
#
# AdGuard's UI is a Caddy site too, and is deliberately not here: it is a page
# for the operator, not the house, its DNS side is targets/blackbox-dns.yaml's
# job, and ADR-0010 decided a failed filter is not a page.

# `/alive` is Vaultwarden's own liveness path: a timestamp, no session.
- targets: ["https://vaultwarden.matrix.elysium/alive"]
  labels:
    module: http_2xx_tier_ca
    name: vaultwarden
    role: passwords
    host: trinity
    via: dns
    renewal: acme
    tier: household

# `/api/server/ping` answers `{"res":"pong"}` without a session.
- targets: ["https://immich.matrix.elysium/api/server/ping"]
  labels:
    module: http_2xx_tier_ca
    name: immich
    role: photos
    host: trinity
    via: dns
    renewal: acme
    tier: household

# No unauthenticated health path (`/api/` is 401), so the login page itself:
# `/` redirects here, and asking for it directly makes the 200 Django
# rendering a page rather than a redirect followed.
- targets: ["https://paperless.matrix.elysium/accounts/login/"]
  labels:
    module: http_2xx_tier_ca
    name: paperless
    role: documents
    host: trinity
    via: dns
    renewal: acme
    tier: household

# `/manifest.json`, the path compose.yaml's healthcheck uses; served by the
# frontend with no session.
- targets: ["https://homeassistant.matrix.elysium/manifest.json"]
  labels:
    module: http_2xx_tier_ca
    name: home-assistant
    role: home-automation
    host: trinity
    via: dns
    renewal: acme
    tier: household

# `/api/healthcheck` answers `up`, the path compose.yaml's healthcheck uses.
- targets: ["https://home.matrix.elysium/api/healthcheck"]
  labels:
    module: http_2xx_tier_ca
    name: homepage
    role: front-page
    host: trinity
    via: dns
    renewal: acme
    tier: household

# `/health` answers `{"status":"UP"}` without a session.
- targets: ["https://actual.matrix.elysium/health"]
  labels:
    module: http_2xx_tier_ca
    name: actual
    role: budget
    host: trinity
    via: dns
    renewal: acme
    tier: household

# `/api/app/about` answers the version without a session; Mealie has no
# dedicated health path over HTTP.
- targets: ["https://recipes.matrix.elysium/api/app/about"]
  labels:
    module: http_2xx_tier_ca
    name: mealie
    role: recipes
    host: trinity
    via: dns
    renewal: acme
    tier: household

# `/healthcheck` answers `OK`; it also checks Miniflux's database connection.
- targets: ["https://miniflux.matrix.elysium/healthcheck"]
  labels:
    module: http_2xx_tier_ca
    name: miniflux
    role: feeds
    host: trinity
    via: dns
    renewal: acme
    tier: household

# `/healthz` answers `Service ready.`, the path compose.yaml's healthcheck uses.
- targets: ["https://memos.matrix.elysium/healthz"]
  labels:
    module: http_2xx_tier_ca
    name: memos
    role: notes
    host: trinity
    via: dns
    renewal: acme
    tier: household

# `/health` answers `{"status": "healthy"}`, compose.yaml's healthcheck path.
- targets: ["https://links.matrix.elysium/health"]
  labels:
    module: http_2xx_tier_ca
    name: linkding
    role: bookmarks
    host: trinity
    via: dns
    renewal: acme
    tier: household

# `/api/v1/info/status` answers `{"status":"UP"}`, compose.yaml's
# healthcheck path.
- targets: ["https://pdf.matrix.elysium/api/v1/info/status"]
  labels:
    module: http_2xx_tier_ca
    name: stirling-pdf
    role: pdf-tools
    host: trinity
    via: dns
    renewal: acme
    tier: household

# --- Devices that otherwise only have SNMP ---------------------------------
# An SNMP agent answering says nothing about the management UI a person would
# reach for during an incident. These are the four devices in targets/snmp.yaml;
# two of them can be probed from here and two cannot, and the difference is the
# firewall, not the device.

# The switch's web UI WAS probed here, by name and by address, and both probes
# were REMOVED on 2026-09-06. The premise they rested on is gone.
#
# The comment that stood here said they were "reachable because the switch LAN
# (10.7.7.0/24) is the one segment Winterfell's egress rule does not block
# (ADR-0013)". That stopped being true the same day: Lemmiwinks #177 added a
# logged `block opt1 net -> lan net` on the Winterfell interface, closing the
# switch's cleartext management plane to every host on 10.0.99.0/24. The probes
# went red within a minute and paged EndpointUnreachable twice.
#
# They were brought back by a named pass rule, 10.0.99.20 -> 10.7.7.2:80, and
# then deliberately dropped instead, because that rule is the whole question:
# keeping it means the one segment we just fenced off the cleartext plane still
# has a host that reaches it, for a check that `up{job="snmp"}` already makes.
# The SNMP scrape polls this switch every 60s and goes red if it stops
# answering; what this probe added over that was confirmation that a Realtek
# CGI login page renders — on a device that, per ADR-0018, will never hold a
# certificate and has no TLS listener to watch.
#
# NOTE FOR ADR-0013: its title and its "does not hold for the switch LAN"
# section are now out of date for VLAN 99. Default deny does hold there, with
# SNMP as the single remaining exception. Tracked separately rather than edited
# here.
#
# If it is ever wanted back, it needs the firewall rule again first:
#
#   pass tcp from 10.0.99.20 to 10.7.7.2 port 80   (igc0.99, above the block)
#
# and the same verify-before-enabling step the two probes below use.

# The APC card is https only — port 80 is closed — with a certificate it made
# for itself (subject `CN=.`, expires 2035-12-16). `/` is a 303 to /home.htm,
# which is the login page and answers 200.

- targets: ["https://10.0.99.10/"]
  labels:
    module: http_2xx_self_signed
    name: ups-ui
    role: ups
    host: mjolnir
    via: address

# The two below are written out and NOT ENABLED, because from 10.0.99.20 both
# time out today and enabling them would page `urgent` from the moment this
# file is loaded until someone changes the firewall. That is not a probe, it is
# a nag, and it is the shape of check this repository has agreed not to ship.
#
# Each needs one pass rule on the Winterfell interface (igc0.99), above the
# existing blocks, and each is a segmentation decision rather than a monitoring
# one — so it is recorded in ADR-0013's table when made, not just here:
#
#   iLO      pass tcp from 10.0.99.20 to 10.0.30.10 port 443
#            VLAN 99 → 30 passes SNMP and nothing else. #235 decided the
#            iLO stays on that segment (ADR-0033), so the address below is
#            settled and this probe needs the rule.
#   pfSense  pass tcp from 10.0.99.20 to 10.0.99.1 port 443
#            "Block HTTPS to pfSense" on igc0.99 is an explicit rule, not a
#            default: the GUI is reachable from Hicks only. Opening it to the
#            monitoring host gives the machine every agent pushes to a path
#            to the firewall's login page. Worth having — the
#            default GUI certificate is 398 days and nothing else watches it —
#            but not worth having by accident.
#
# Their CERTIFICATES are watched without either pass (#857, ADR-0084):
# scripts/collect-cert-expiry.sh reads pfSense's on the firewall over the ssh
# `make gateway-state` already makes, and the iLO's from Saruman, which shares
# its segment. So the case for these probes is reachability alone now, not
# expiry — weigh the pass on that.
#
# Once the rule exists, verify from the running exporter before uncommenting:
#
#   docker exec blackbox-exporter wget -qO- \
#     'http://localhost:9115/probe?target=https://10.0.30.10/&module=http_2xx_self_signed' \
#     | grep -E '^probe_(success|http_status_code|ssl_earliest_cert_expiry)'
#
# - targets: ["https://10.0.30.10/"]
#   labels:
#     module: http_2xx_self_signed
#     name: ilo-ui
#     role: hypervisor-bmc
#     host: shiva
#     via: address
#
# - targets: ["https://10.0.99.1/"]
#   labels:
#     module: http_2xx_self_signed
#     name: pfsense-ui
#     role: firewall
#     host: morpheus
#     via: address
