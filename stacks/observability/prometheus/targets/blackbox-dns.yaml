---
# DNS probe targets, consumed by the `blackbox-dns` job via file_sd_configs.
# Hot-reloaded every 5 minutes — no Prometheus restart required.
#
# Separate from targets/blackbox.yaml because the job is separate, and the job
# is separate for two reasons prometheus.yaml sets out: `EndpointUnreachable`
# is critical and routes to `urgent`, which a filter that fails open must never
# do, and `EndpointNameNotResolving` joins `via="dns"` to `via="address"` on
# `name`, a join that means nothing when the target IS a resolver.
#
# `module` selects a prober from blackbox/blackbox.yaml — `dns_answers` or
#          `dns_filters`. Unlike the http modules, a dns module carries its own
#          query, so the module name is the question being asked.
# `name`   is the service being asked, and both probes of one service share it:
#          the `and on (name)` join in rules/dns.rules.yaml is what keeps a
#          stopped AdGuard from also raising "AdGuard is not filtering".
# `check`  is which question — `liveness` or `filtering`. The rules select on
#          this, so a target added without it fires nothing.
# `role`   as elsewhere: what the thing is for.
#
# A service's probes go to that service's own address on port 53, so the
# AdGuard probes never ask pfSense. Under ADR-0010 Unbound forwarded to
# AdGuard with the public resolvers listed alongside it, so a query through the
# normal path was answered by the fallback and passed while AdGuard was dead
# (ADR-0010, #126).
#
# Unbound on morpheus is probed too, since #841, and that is not the same
# mistake. It is asked a different question: whether the resolver every device
# in the house actually uses is answering. Its probe carries name="unbound",
# and the AdGuard rules select on name="adguard", so neither can stand in for
# the other.

# --- AdGuard Home ------------------------------------------------------------
#
# Enabled 2026-09-28, when trinity (10.0.99.40) came up with the sensitive
# stack (#404, #135). Before these were uncommented, both were verified from
# the running exporter, including the negative that proves the filtering probe
# can go red:
#
#   docker exec blackbox-exporter wget -qO- \
#     'http://localhost:9115/probe?target=10.0.99.40:53&module=dns_filters' \
#     | grep -E '^probe_(success|dns_answer_rrs)'
#
#   docker exec blackbox-exporter wget -qO- \
#     'http://localhost:9115/probe?target=10.0.99.1:53&module=dns_filters' \
#     | grep -E '^probe_success'
#
# On that day: dns_answers 1 (2 records), dns_filters 1 against AdGuard, and
# 0 against 10.0.99.1, which is Unbound and does not filter. A `1` from both
# would mean the probe is measuring nothing, and so would a `0` from both.
# Run the pair again after any change to the canary or the blocklists.
#
# `host` is the machine, as in targets/blackbox.yaml. The alerts still name
# AdGuard rather than its host.

- targets: ["10.0.99.40:53"]
  labels:
    module: dns_answers
    name: adguard
    check: liveness
    role: dns-filter
    host: trinity

- targets: ["10.0.99.40:53"]
  labels:
    module: dns_filters
    name: adguard
    check: filtering
    role: dns-filter
    host: trinity

# --- Unbound on morpheus (#841) -----------------------------------------------
#
# The house's resolver: DHCP hands out 10.0.99.1 and its siblings, and Unbound
# answers from host overrides or forwards to AdGuard alone (ADR-0055). Before
# this, blackbox-latency.yaml checked 10.0.99.1:53 with tcp_connect only, which
# passes while Unbound returns SERVFAIL for every name. dns_answers asks for
# example.com and validates the answer, the same question AdGuard is asked.
- targets: ["10.0.99.1:53"]
  labels:
    module: dns_answers
    name: unbound
    check: liveness
    role: resolver
    host: morpheus
