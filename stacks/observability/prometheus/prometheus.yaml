---
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    site: matrix.elysium
    monitor: winterfell

rule_files:
  - /etc/prometheus/rules/*.rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ---------------------------------------------------------------------------
  # The stack monitoring itself. Names resolve on the compose network, so moving
  # the monitoring host no longer means editing this file.
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Grafana serves TLS with a certificate from the lab's own CA. Verified
  # properly rather than with insecure_skip_verify: the CA is mounted in, and
  # the leaf carries `grafana` as a SAN alongside its FQDN precisely so this
  # scrape can check the name it actually connects to.
  - job_name: grafana
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      server_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: snmp-exporter
    static_configs:
      - targets: ["snmp-exporter:9116"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # ---------------------------------------------------------------------------
  # SNMP network devices.
  #
  # This replaced four near-identical jobs that differed only in target, module
  # and auth. Targets now live in targets/snmp.yaml and are hot-reloaded by
  # file_sd without restarting Prometheus; adding a device is a three-line
  # append. See docs/runbooks/add-monitored-device.md.
  #
  # The `module` and `auth` labels on each target are promoted to the query
  # parameters snmp_exporter expects, then dropped so they do not become
  # metric labels.
  # ---------------------------------------------------------------------------
  - job_name: snmp
    scrape_interval: 60s
    scrape_timeout: 45s
    metrics_path: /snmp
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/snmp.yaml
        refresh_interval: 5m
    relabel_configs:
      # The file_sd target is the *device* address, which becomes the query arg.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [auth]
        target_label: __param_auth
      - regex: (module|auth)
        action: labeldrop
      # ...and the address Prometheus actually connects to is the exporter.
      - target_label: __address__
        replacement: snmp-exporter:9116

  # ---------------------------------------------------------------------------
  # Synthetic probes.
  #
  # Same file_sd shape as the SNMP job above, and for the same reason: adding an
  # endpoint is an append to targets/blackbox.yaml, hot-reloaded, no restart.
  #
  # The relabel dance is the one blackbox_exporter requires — the target in the
  # file is the URL to probe, which becomes a query parameter, while the address
  # Prometheus actually connects to is the exporter.
  # ---------------------------------------------------------------------------
  - job_name: blackbox
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox.yaml
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - regex: module
        action: labeldrop
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------------------
  # DNS probes, sent straight at the filter.
  #
  # The same exporter and the same relabel dance as `blackbox` above, and a
  # separate job on purpose rather than for tidiness. Two rules key off the job
  # name, and both would misfire if these targets shared it:
  #
  #   EndpointUnreachable is `probe_success{job="blackbox"} == 0` at severity
  #   critical, which alertmanager.yaml routes to `urgent`. ADR-0010 designed
  #   the house to keep resolving without AdGuard, so a filter that stops
  #   answering is explicitly not a 2 a.m. problem. A job boundary says that
  #   structurally; a `role!=` matcher bolted onto the existing rule would
  #   quietly capture the next target somebody adds without the label.
  #
  #   EndpointNameNotResolving joins `via="dns"` to `via="address"` on `name`.
  #   `via` has no meaning for a probe whose target is itself a resolver, and a
  #   target here sharing a `name` with one there would satisfy that join by
  #   accident — the failure mode blackbox.test.yaml exists to prevent.
  #
  # Every target in the file is commented out today, because the box AdGuard
  # runs on has not been built (#102) and Unbound is not forwarding to it yet
  # (#123). The job is here anyway so that enabling them is a file_sd append,
  # hot-reloaded, with no restart and no edit to this file at the moment it
  # matters.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Latency probes — how long, not whether.
  #
  # A third job on the same exporter, and separate for the reason the DNS job
  # above is: EndpointUnreachable is critical and routed to `urgent`, and two of
  # these targets are on the public internet. An ISP blip reaching 1.1.1.1 is
  # not a 2 a.m. page, and it would be one if these shared job="blackbox".
  #
  # scrape_interval is 30s rather than 60s. Latency is the one thing here that
  # is worth asking about twice a minute: the question #166 exists for is "is it
  # bad RIGHT NOW", and the rules average over ten minutes, so a coarser sample
  # would make that average out of four points instead of twenty.
  # ---------------------------------------------------------------------------
  - job_name: blackbox-latency
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-latency.yaml
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - regex: module
        action: labeldrop
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-dns
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-dns.yaml
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - regex: module
        action: labeldrop
      - target_label: __address__
        replacement: blackbox-exporter:9115
