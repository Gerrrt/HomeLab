---
# The observability stack watching itself.
#
# These five rules were in containers.rules.yaml until #81, where they carried
# `component: containers` alongside the cAdvisor rules. That label is what the
# dashboards filter on, so a Prometheus config-reload failure appeared under
# "Container alerts" on the Docker dashboard — a true alert filed under a
# heading that sends you looking at the wrong thing.
#
# They are the same rules with `component: stack`. Nothing else changed:
# expressions, `for:`, severities, categories and annotations are byte-for-byte
# what they were, so the split is a relabel and not a rewrite. `homelab-stack`
# is the dashboard behind them.
#
# WHAT THESE COVER AND WHAT THEY DO NOT. Every rule here reads a metric the
# component publishes about its own working — a reload that was rejected, an
# evaluation that failed, a notification that could not be delivered. None of
# them can see a component that has stopped publishing altogether. `up == 0` in
# host.rules.yaml is what does that for anything Prometheus scrapes directly,
# and RemoteWriteJobStale below is what does it for anything arriving by
# remote_write, which `up == 0` structurally cannot see. Between them every
# collected target is covered; the Observability Stack dashboard draws the same
# split, because which of the two applies decides how you read the Up column.
groups:
  - name: stack
    interval: 60s
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          component: stack
          severity: critical
          category: correctness
        annotations:
          summary: "Prometheus rejected its own config reload on {{ $labels.instance }}"

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 5m
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $value }} rule evaluation failures in the last 15 minutes"

      - alert: PrometheusSizeRetentionActive
        # --storage.tsdb.retention.size is a ceiling that, when it engages,
        # silently shortens retention from the 30 days everything else in this
        # repository claims to whatever fits in 4 GiB. Nothing else would say
        # so: the store keeps working, the dashboards keep drawing, and you find
        # out when a query over last month comes back short. Prometheus counts
        # size-based eviction separately from time-based eviction, which is the
        # only thing that distinguishes "the ceiling bound" from "old data aged
        # out normally" — do not substitute prometheus_tsdb_time_retentions_total
        # here, it increments constantly and by design.
        #
        # Firing means one of two things and both want a human: the series
        # budget grew past what 4 GiB holds for 30 days, or something is pushing
        # volume into the open remote-write receiver. Either way the documented
        # retention is no longer true.
        expr: increase(prometheus_tsdb_size_retentions_total[1h]) > 0
        labels:
          component: stack
          severity: warning
          category: capacity
        annotations:
          summary: "Prometheus is evicting blocks to stay under its size ceiling"
          description: >-
            Retention is now bounded by PROMETHEUS_RETENTION_SIZE rather than
            PROMETHEUS_RETENTION, so history is shorter than 30 days.

      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          component: stack
          severity: critical
          category: correctness
        annotations:
          summary: "Alertmanager cannot deliver notifications via {{ $labels.integration }}"
          description: >-
            Alerts are firing but not reaching anyone — this makes every other
            rule in this repository silently useless.

      - alert: LokiIngestionStalled
        expr: |
          sum(rate(loki_distributor_lines_received_total[30m])) == 0
        for: 30m
        labels:
          component: stack
          severity: warning
          category: availability
        annotations:
          summary: "Loki has received no log lines for 30 minutes"
          description: >-
            Either every Alloy agent is down or the push endpoint is
            unreachable. Logs are being lost, not queued indefinitely.

      - alert: RemoteWriteJobStale
        # THE RULE InstanceDown CANNOT BE.
        #
        # `up == 0` needs a target that is present and failing. An agent that
        # remote-writes is neither: when it dies it simply stops pushing, its
        # series goes stale, and five minutes later there is nothing left to
        # compare against 0. InstanceDown has never been able to see `oracle`'s
        # agent die, and would not have seen this host's either.
        #
        # WHY NOT `time() - timestamp(up)`. That is the obvious form and it
        # cannot fire for any input — the #63 trap, in a new place. An instant
        # selector only returns a sample within the lookback delta, so
        # `timestamp(up)` goes absent at five minutes and the difference is
        # bounded below the threshold you would want to alert on. Measured over
        # 24h of real data the largest value any job reached was 79s, and
        # evaluated at instants before a series existed the expression returns
        # no series at all rather than a large number. The dashboard's staleness
        # panel is honest because it is a graph — a threshold on it would not be.
        #
        # So the question has to be asked the other way round: which series were
        # here and are not here now. `count_over_time` sees through staleness
        # because it reads the range, not the instant.
        #
        # THE WINDOW IS THE BOUND. 24h is how long the rule can still remember a
        # job existed. An agent that comes back inside a day resolves this
        # truthfully. One that stays away longer resolves it *falsely* at 24h,
        # having notified at least twice by then — that is the known cost of not
        # enumerating the expected jobs, and enumerating them is what would have
        # made the rule silently miss `Saruman` when it arrived (#88).
        #
        # The selector matches the job names config.alloy builds —
        # `<hostname>-metrics`, `<hostname>-alloy`, and cAdvisor's
        # `integrations/cadvisor` — so a new agent is covered on the day it is
        # deployed, with nothing to remember to add here. Every directly scraped
        # job is deliberately excluded: those have `up == 0` and InstanceDown.
        #
        # Do not put {{ $value }} in the annotations. `count by` returns the
        # number of samples in the window, which is a number like 1440 and means
        # nothing to whoever is reading the notification.
        #
        # WATCHED WORKING, 2026-08-31. The agent on this host was stopped for six
        # minutes with this rule and InstanceDown silenced, and the timings are
        # worth knowing because they are the reason the rule exists:
        #
        #   t+20s   up{job="alloy"} reaches 0 — the direct scrape notices at once
        #   t+0…262s  all five pushed series still resolve, this rule returns
        #             nothing. FOUR AND A HALF MINUTES OF TOTAL BLINDNESS, which
        #             is the lookback delta and cannot be shortened from here
        #   t+282s  the first series ages out; the rule returns it, alert pending
        #   t+342s  all three of this host's pushed jobs detected
        #
        # `oracle`'s two jobs stayed reporting throughout and were correctly not
        # matched, including `integrations/cadvisor`, which exists on both hosts
        # and is separated only by instance. (Two, not three: oracle's config at
        # the time predated the self-scrape, which #88 found and fixed. Every
        # Docker host pushes three now.) Recovery was clean: the alert
        # cleared on its own once the agent came back.
        #
        # The blind window is the honest limit of this rule. Detection is 5m of
        # lookback plus `for: 15m`, so roughly twenty minutes, and nothing about
        # remote_write allows better without the agent declaring its own absence.
        expr: |
          count by (job, instance) (count_over_time(up{job=~"integrations/.+|.+-metrics|.+-alloy"}[24h]))
          unless
          count by (job, instance) (up{job=~"integrations/.+|.+-metrics|.+-alloy"})
        for: 15m
        labels:
          component: stack
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} has stopped reporting"
          description: >-
            This job arrives by remote_write, so nothing scrapes it and
            InstanceDown cannot see it — it has simply stopped pushing. Either
            the Alloy agent on {{ $labels.instance }} is down or it cannot reach
            this host. Metrics from it are being lost, not queued.

      - alert: LogEntriesDropped
        # Alloy accepted a log line and Loki refused it. The line is gone: there
        # is no retry queue behind a rejection, unlike the network errors
        # loki_write_batch_retries_total counts.
        #
        # This was found by #194, which was filed about a different thing. The
        # journal is delivered in full — 98.8% on the day that issue measured
        # 1.5%, and 100% today — but looking for the gap turned up a real one
        # underneath. Over the seven days to 2026-09-06 Loki discarded roughly
        # 185,000 entries and nothing said so:
        #
        #   greater_than_max_sample_age   146,867
        #   too_far_behind                 26,398
        #   rate_limited                   11,704
        #
        # Every drop the agents recorded in that window carried
        # reason="ingester_error", which is Alloy's name for "Loki said no" and
        # is where all three of the above arrive. Peaks were 121,529 entries
        # from `oracle` on 09-03 and 15,588 from this host on 09-06.
        #
        # `> 0` with no tolerance band, deliberately. A dropped log line is not a
        # degradation to be graded — it is evidence that no longer exists, and
        # the difference between one and a thousand is a matter of how long
        # nobody looked. `for: 15m` is what keeps a single rejected batch during
        # a Loki restart from paging.
        #
        # By reason, because the reasons want different fixes: an ingest limit
        # is a Loki config change, a sample age is an agent replaying a backlog
        # older than reject_old_samples_max_age, and rate_limited is neither.
        # Why Loki is refusing them at all is tracked separately (#341).
        #
        # `too_far_behind` IS EXCLUDED, and the exclusion is the difference
        # between a useful alert and one that fires on every deploy. Measured
        # while testing #186: an Alloy with no position file replays up to
        # `max_age = "24h0m0s"` of journal on start, and Loki rejects almost all
        # of it against a stream that is already current —
        #
        #   entry too far behind, entry timestamp is: 2026-09-06T04:38:22Z,
        #   oldest acceptable timestamp is:           2026-09-06T16:24:52Z
        #
        # — which is +19,490 discards from one agent start. Those entries are
        # duplicates the previous agent already delivered, so nothing is lost;
        # counting them as loss would page after every `make up`, and this
        # repository has enough experience of an alert that cries wolf to know
        # where that ends.
        #
        # What that costs, said plainly: a stream PERSISTENTLY behind rather
        # than briefly replaying is real and this will not see it. That is the
        # other half of #341 and wants a rule shaped around duration, not a
        # counter delta.
        expr: |
          sum by (job, reason) (
            rate(loki_write_dropped_entries_total{reason!="too_far_behind"}[15m])
          ) > 0
        for: 15m
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.job }} is losing log lines to {{ $labels.reason }}"
          description: >-
            Loki rejected these entries and Alloy discarded them — there is no
            retry behind a rejection, so they are gone. Ask Loki which limit it
            applied with `sum by (reason) (loki_discarded_samples_total)`; the
            usual answers are an entry older than reject_old_samples_max_age, a
            stream too far behind, or an ingestion rate limit.

      - alert: JournalSourceStopped
        # The journal reader is alive and reading nothing.
        #
        # THE RULE #194 ASKED FOR, and the reason it needs a measured threshold
        # rather than an obvious one: "a quiet source and a broken one currently
        # look identical" is only true if you do not know how quiet the quiet
        # one is. Measured over 24h to 2026-09-06, the lowest hourly read rate
        # each agent reached was
        #
        #   Saruman     3.1 lines/hour      the quietest host in the estate
        #   prometheus 37.6
        #   alloy      49.2
        #   oracle     70.2
        #
        # so zero is not a quiet hour anywhere. It is a reader that has stopped,
        # and the gap between 3.1 and 0 is what makes `== 0` safe to assert
        # rather than a threshold somebody would have to keep tuning.
        #
        # This can only fire while the agent is still publishing metrics — a
        # dead agent takes the series with it, which is RemoteWriteJobStale's
        # job above. The two partition the failure: this one is the agent that
        # is up, healthy, scraped, and collecting none of the host's journal.
        # That is precisely the shape #62 and #194 are both about, and precisely
        # the one nothing else here can see.
        expr: |
          sum by (job) (rate(loki_source_journal_target_lines_total[1h])) == 0
        for: 2h
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.job }} has read no journal entries for two hours"
          description: >-
            The agent is up and publishing metrics, so this is not an outage —
            its journal reader has stopped. The quietest host in the estate
            still produces about three entries an hour, so zero is a fault
            rather than a quiet night. Check the reader's position file in the
            alloy-data volume and whether /var/log/journal is still mounted.
