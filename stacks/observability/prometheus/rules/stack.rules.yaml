---
# The observability stack watching itself.
#
# These five rules were in containers.rules.yaml until #81, where they carried
# `component: containers` alongside the cAdvisor rules. That label is what the
# dashboards filter on, so a Prometheus config-reload failure appeared under
# "Container alerts" on the Docker dashboard — a true alert filed under a
# heading that sends you looking at the wrong thing.
#
# They are the same rules with `component: stack`. Nothing else changed:
# expressions, `for:`, severities, categories and annotations are byte-for-byte
# what they were, so the split is a relabel and not a rewrite. `homelab-stack`
# is the dashboard behind them.
#
# WHAT THESE COVER AND WHAT THEY DO NOT. Every rule here reads a metric the
# component publishes about its own working — a reload that was rejected, an
# evaluation that failed, a notification that could not be delivered. None of
# them can see a component that has stopped publishing altogether. `up == 0` in
# host.rules.yaml is what does that for anything Prometheus scrapes directly,
# and RemoteWriteJobStale below is what does it for anything arriving by
# remote_write, which `up == 0` structurally cannot see. Between them every
# collected target is covered; the Observability Stack dashboard draws the same
# split, because which of the two applies decides how you read the Up column.
#
# THE TWO EXCEPTIONS, AND WHY. SilenceExpiresSoon and SilenceWithoutIssue at
# the end read nothing Alertmanager publishes about itself. `alertmanager_silences`
# is a count per state, and a count cannot say which alert a silence covers,
# when it ends or who owns it — the three facts a person reading the silence
# list during a triage pass has found by hand three times (#76, #531, #572).
# scripts/collect_silences.py reads /api/v2/silences every fifteen minutes on
# the monitoring host and writes one series per live silence, with the owning
# issue parsed from a comment that begins with #NNN; the convention is in
# docs/observability.md under Silences (#575). The collector's own absence is
# not a rule here: it is the `silence-state` row in install-timers.sh, which
# ScheduledJobStale, ScheduledJobFailed and ScheduledJobNeverRan cover without
# naming it.
groups:
  - name: stack
    interval: 60s
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          component: stack
          severity: critical
          category: correctness
        annotations:
          runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/deploy-stack.md#troubleshooting"
          summary: "Prometheus rejected its own config reload on {{ $labels.instance }}"

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 5m
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $value }} rule evaluation failures in the last 15 minutes"

      - alert: PrometheusSizeRetentionActive
        # --storage.tsdb.retention.size is a ceiling that, when it engages,
        # silently shortens retention from the 30 days everything else in this
        # repository claims to whatever fits in 4 GiB. Nothing else would say
        # so: the store keeps working, the dashboards keep drawing, and you find
        # out when a query over last month comes back short. Prometheus counts
        # size-based eviction separately from time-based eviction, which is the
        # only thing that distinguishes "the ceiling bound" from "old data aged
        # out normally" — do not substitute prometheus_tsdb_time_retentions_total
        # here, it increments constantly and by design.
        #
        # Firing means one of two things and both want a human: the series
        # budget grew past what 4 GiB holds for 30 days, or something is pushing
        # volume into the open remote-write receiver. Either way the documented
        # retention is no longer true.
        expr: increase(prometheus_tsdb_size_retentions_total[1h]) > 0
        labels:
          component: stack
          severity: warning
          category: capacity
        annotations:
          summary: "Prometheus is evicting blocks to stay under its size ceiling"
          description: >-
            Retention is now bounded by PROMETHEUS_RETENTION_SIZE rather than
            PROMETHEUS_RETENTION, so history is shorter than 30 days.

      - alert: AlertmanagerNotificationsFailing
        # The `reason` label is the first thing to read, not the integration.
        # On 2026-09-08 this fired with reason="rateLimited": every receiver
        # was reachable and answering, and ntfy.sh was refusing with 429
        # because the day's free message budget was spent (#407). "The
        # webhook is unreachable" is what a reader assumes, and it was wrong.
        #
        # CRITICAL IS LOAD-BEARING since #136. Three receivers now deliver to
        # the in-house ntfy on trinity; if that is what fails, this alert is
        # the one that says so, and only `urgent` carries an ntfy.sh copy that
        # does not depend on it. validate.sh pins the route.
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          component: stack
          severity: critical
          category: correctness
        annotations:
          runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#reading-the-failure"
          summary: "Alertmanager cannot deliver via {{ $labels.integration }}: {{ $labels.reason }}"
          description: >-
            Alerts are firing but not reaching anyone — this makes every other
            rule in this repository silently useless. Read the reason before
            the URL: rateLimited means the destination answered and refused
            (ntfy.sh's daily quota, #407), clientError or serverError means it
            answered with an error, and contextDeadlineExceeded means it did
            not answer at all. This alert travels the same path it reports on,
            so if it reached you, at least one receiver still works — and being
            critical it goes to `urgent`, whose ntfy.sh copy reaches a phone
            even when the in-house ntfy is the thing failing (#136).

      - alert: LokiIngestionStalled
        expr: |
          sum(rate(loki_distributor_lines_received_total[30m])) == 0
        for: 30m
        labels:
          component: stack
          severity: warning
          category: availability
        annotations:
          summary: "Loki has received no log lines for 30 minutes"
          description: >-
            Either every Alloy agent is down or the push endpoint is
            unreachable. Logs are being lost, not queued indefinitely.

      # --- The Loki ruler (#837) --------------------------------------------
      #
      # Every security alert is evaluated by Loki's ruler, not by Prometheus
      # (loki/rules/security.rules.yaml), and the Watchdog above proves only
      # Prometheus's path. These three watch the ruler from here, so a ruler
      # that stops is reported by the path the heartbeat already proves.
      # The observability dashboard charted the first metric for months; no
      # rule read it.
      - alert: LokiRuleEvaluationFailures
        # One group failing, not the ruler: a LogQL query over a limit, a
        # parse the boot check missed, storage trouble on a range. Warning,
        # because the other groups still run.
        expr: sum by (rule_group) (increase(loki_prometheus_rule_evaluation_failures_total[10m])) > 0
        for: 10m
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          summary: "Loki rule group {{ $labels.rule_group }} is failing to evaluate"
          description: >-
            Every alert in that group is silent while this fires. `docker logs
            loki 2>&1 | grep -i ruler` names the rule and the error. Most of
            loki/rules/ is security alerting, so read it as a security gap, not
            a cosmetic one.

      - alert: LokiRulerNotificationsFailing
        # The ruler evaluates, decides to alert, and cannot hand the alert to
        # Alertmanager: errors are failed sends, drops are a full queue. Either
        # way a security page that fired was never delivered. Critical, so it
        # goes to `urgent`, which carries an ntfy.sh copy.
        expr: |
          sum(increase(loki_prometheus_notifications_errors_total[10m])) > 0
          or sum(increase(loki_prometheus_notifications_dropped_total[10m])) > 0
        for: 10m
        labels:
          component: stack
          severity: critical
          category: correctness
        annotations:
          runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#the-rulers-half"
          summary: "The Loki ruler cannot deliver alerts to Alertmanager"
          description: >-
            Log-based alerts, the security ones among them, are firing and
            being lost between Loki and Alertmanager. Check that
            alertmanager:9093 is up and that loki-config.yaml's
            alertmanager_url still names it.

      - alert: LokiRulerSilent
        # The ruler has sent nothing for fifteen minutes. It cannot be idle:
        # LokiRulerWatchdog (loki/rules/watchdog.rules.yaml) fires forever, and
        # the ruler re-sends a firing alert every minute, so this counter
        # climbs for as long as the ruler is evaluating and has an Alertmanager
        # to send to. Flat means it stopped doing one of those.
        #
        # Whether sent_total counts a FAILED send has differed between versions
        # of the Prometheus notifier Loki vendors: older ones counted every
        # attempt, newer ones count only a 2xx from Alertmanager. Either way is
        # covered. If it counts only successes, failed delivery leaves it flat
        # and this rule fires as well; LokiRulerNotificationsFailing above
        # reports the failures themselves whichever version is running.
        #
        # `or absent(...)` is deliberate. Loki down is InstanceDown's to
        # report, but a renamed metric after a Loki upgrade would otherwise
        # turn this rule into one that can never fire, the failure this whole
        # repository keeps finding. Absent therefore pages too, and the fix is
        # to read the metric name again.
        expr: |
          sum(increase(loki_prometheus_notifications_sent_total[15m])) == 0
          or absent(loki_prometheus_notifications_sent_total)
        for: 5m
        labels:
          component: stack
          severity: critical
          category: correctness
        annotations:
          runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#the-rulers-half"
          summary: "The Loki ruler has sent nothing to Alertmanager for 20 minutes"
          description: >-
            Every log-based alert, the security ones among them, is silent:
            the ruler's own always-firing LokiRulerWatchdog has stopped
            reaching Alertmanager. Look at `docker logs loki 2>&1 | grep -i
            ruler`, then at the ruler's view of its rules:
            `curl -s localhost:3100/prometheus/api/v1/rules` on the monitoring
            host. If loki_prometheus_notifications_sent_total is absent rather
            than flat, check whether a Loki upgrade renamed it.

      - alert: RemoteWriteJobStale
        # THE RULE InstanceDown CANNOT BE.
        #
        # `up == 0` needs a target that is present and failing. An agent that
        # remote-writes is neither: when it dies it simply stops pushing, its
        # series goes stale, and five minutes later there is nothing left to
        # compare against 0. InstanceDown has never been able to see `oracle`'s
        # agent die, and would not have seen this host's either.
        #
        # WHY NOT `time() - timestamp(up)`. That is the obvious form and it
        # cannot fire for any input — the #63 trap, in a new place. An instant
        # selector only returns a sample within the lookback delta, so
        # `timestamp(up)` goes absent at five minutes and the difference is
        # bounded below the threshold you would want to alert on. Measured over
        # 24h of real data the largest value any job reached was 79s, and
        # evaluated at instants before a series existed the expression returns
        # no series at all rather than a large number. The dashboard's staleness
        # panel is honest because it is a graph — a threshold on it would not be.
        #
        # So the question has to be asked the other way round: which series were
        # here and are not here now. `count_over_time` sees through staleness
        # because it reads the range, not the instant.
        #
        # THE WINDOW IS THE BOUND. 24h is how long the rule can still remember a
        # job existed. An agent that comes back inside a day resolves this
        # truthfully. One that stays away longer resolves it *falsely* at 24h,
        # having notified at least twice by then — that is the known cost of not
        # enumerating the expected jobs, and enumerating them is what would have
        # made the rule silently miss `Saruman` when it arrived (#88).
        #
        # The selector matches the job names config.alloy builds —
        # `<hostname>-metrics`, `<hostname>-alloy`, and cAdvisor's
        # `integrations/cadvisor` — so a new agent is covered on the day it is
        # deployed, with nothing to remember to add here. Every directly scraped
        # job is deliberately excluded: those have `up == 0` and InstanceDown.
        #
        # Do not put {{ $value }} in the annotations. `count by` returns the
        # number of samples in the window, which is a number like 1440 and means
        # nothing to whoever is reading the notification.
        #
        # WATCHED WORKING, 2026-08-31. The agent on this host was stopped for six
        # minutes with this rule and InstanceDown silenced, and the timings are
        # worth knowing because they are the reason the rule exists:
        #
        #   t+20s   up{job="alloy"} reaches 0 — the direct scrape notices at once
        #   t+0…262s  all five pushed series still resolve, this rule returns
        #             nothing. FOUR AND A HALF MINUTES OF TOTAL BLINDNESS, which
        #             is the lookback delta and cannot be shortened from here
        #   t+282s  the first series ages out; the rule returns it, alert pending
        #   t+342s  all three of this host's pushed jobs detected
        #
        # `oracle`'s two jobs stayed reporting throughout and were correctly not
        # matched, including `integrations/cadvisor`, which exists on both hosts
        # and is separated only by instance. (Two, not three: oracle's config at
        # the time predated the self-scrape, which #88 found and fixed. Every
        # Docker host pushes three now.) Recovery was clean: the alert
        # cleared on its own once the agent came back.
        #
        # The blind window is the honest limit of this rule. Detection is 5m of
        # lookback plus `for: 15m`, so roughly twenty minutes, and nothing about
        # remote_write allows better without the agent declaring its own absence.
        expr: |
          count by (job, instance) (count_over_time(up{job=~"integrations/.+|.+-metrics|.+-alloy"}[24h]))
          unless
          count by (job, instance) (up{job=~"integrations/.+|.+-metrics|.+-alloy"})
        for: 15m
        labels:
          component: stack
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} has stopped reporting"
          description: >-
            This job arrives by remote_write, so nothing scrapes it and
            InstanceDown cannot see it — it has simply stopped pushing. Either
            the Alloy agent on {{ $labels.instance }} is down or it cannot reach
            this host. Metrics from it are being lost, not queued.

      - alert: AlloyDown
        # ONE ALERT THAT SAYS "THE AGENT IS DOWN", per host, by name.
        #
        # On 2026-10-07 the production alloy on this host was stopped (exit
        # 137, not OOM, and `unless-stopped` did not bring it back) and stayed
        # down for 47 minutes. What fired said nothing of the kind:
        # InstanceDown for `alloy:12345`, three RemoteWriteJobStale, one per
        # pushed job, and FirewallLogsStopped. ContainerGone, which lists
        # `alloy` by name, cannot fire for it at all: cAdvisor runs inside
        # Alloy, so the host's container series stop with it, and that rule's
        # last line reads a host with no container series as a dead host.
        #
        # `<host>-alloy` is Alloy's own self-scrape, pushed like everything
        # else, and every agent host has exactly one (config.alloy builds the
        # name). It goes when Alloy goes, so it stands for the agent where the
        # other two jobs stand for what the agent collects. This is
        # RemoteWriteJobStale's shape, for the same reason: `up == 0` cannot see
        # a pusher stop, and the range sees through staleness.
        #
        # 10m, against RemoteWriteJobStale's 15m, so this is already firing
        # when those would start. Alertmanager's inhibit_rules then hold back
        # the host's per-job RemoteWriteJobStale, so one dead agent is one
        # notification that names the fix. A job that stops while Alloy keeps
        # reporting (a broken cAdvisor, a node exporter collector) is still
        # RemoteWriteJobStale's, and this stays quiet for it.
        #
        # It needs no silences for throwaway containers: it never looks at
        # containers, only at the one job each real agent pushes. What it
        # cannot tell apart is an agent that stopped from a host that is off
        # or cut off. Both stop the push, so the description says to look
        # before starting anything. The 24h window is RemoteWriteJobStale's,
        # with the same known cost: a host that stays away longer resolves
        # this falsely at 24h.
        expr: |
          count by (instance) (count_over_time(up{job=~".+-alloy"}[24h]))
          unless
          count by (instance) (up{job=~".+-alloy"})
        for: 10m
        labels:
          component: stack
          severity: warning
          category: availability
        annotations:
          summary: "Alloy on {{ $labels.instance }} has stopped reporting"
          description: >-
            Everything {{ $labels.instance }} sends is being lost, not queued:
            its metrics, its container and journal logs, and on the
            monitoring host the network syslog too. On {{ $labels.instance }},
            run `docker ps -a --filter name=alloy`. Exited, with no restart, means
            something stopped it. Check `docker inspect alloy` for FinishedAt and
            OOMKilled, then `docker start alloy` and confirm `/-/ready` on
            :12345. If it is running, the host cannot reach the ingest proxy
            on the monitoring host. If the host is off, nothing is wrong with
            Alloy.

      - alert: ScrapeTargetDisappeared
        # THE MIRROR OF RemoteWriteJobStale, for the one host that is pulled.
        #
        # Between them those two rules were supposed to cover every collected
        # target. They did not, and #256 is where the hole became visible:
        # RemoteWriteJobStale catches a pushed job that stops pushing, and
        # InstanceDown catches a scraped target that is PRESENT and failing. A
        # scraped target that stops being a target is neither.
        #
        # An emptied targets/node.yaml, a YAML error that makes file_sd drop the
        # file, a bad merge that deletes the block: `up{job="node"}` ceases to
        # exist, so `up == 0` matches nothing and InstanceDown stays silent.
        # RemoteWriteJobStale's selector cannot help — it excludes directly
        # scraped jobs deliberately, and says so where it is written. So the one
        # host in the estate that Prometheus has to be TOLD about was also the
        # one host that could be forgotten in silence, which is the #62 and #63
        # class exactly: not a rule that misfires, a gap nothing reports.
        #
        # The shape is RemoteWriteJobStale's, for its reason: an instant
        # selector goes absent along with the series, so "which targets were
        # here and are not here now" has to be asked over a range.
        # `count_over_time` reads the range and sees through staleness.
        #
        # THE WINDOW IS THE SAME BOUND AND THE SAME HONEST COST. 24h is how long
        # this can still remember a target existed; a target restored inside a
        # day resolves truthfully, and one gone longer resolves *falsely* at 24h
        # having notified at least twice by then.
        #
        # SCOPED TO job="node" RATHER THAN EVERY SCRAPED JOB, and that is a
        # narrowing worth naming. The same hole exists for targets/snmp.yaml and
        # the three blackbox files. It is smaller there — those jobs have many
        # targets, so one vanishing leaves siblings behind and the dashboards
        # thin out visibly — and covering them means deciding what a partial
        # disappearance should say, which is more than #256 needs. `node` has
        # exactly one target: it disappears completely or not at all.
        #
        # WARNING AND NOT CRITICAL, deliberately, because of what it means. A
        # host that is down produces up == 0, and InstanceDown pages `urgent`
        # for it. This fires when the REPOSITORY lost the target while the host
        # is very likely fine — a configuration fault, found in daylight, fixed
        # by an editor.
        #
        # Do not put {{ $value }} in the annotations: `count by` returns the
        # number of samples in the window, a number like 1440 that means nothing
        # to whoever reads the notification. The same warning RemoteWriteJobStale
        # carries, for the same reason.
        expr: |
          count by (job, instance) (count_over_time(up{job="node"}[24h]))
          unless
          count by (job, instance) (up{job="node"})
        for: 15m
        labels:
          component: stack
          severity: warning
          category: availability
        annotations:
          summary: "scraped target {{ $labels.instance }} has disappeared from service discovery"
          description: >-
            Prometheus was scraping {{ $labels.instance }} within the last day
            and no longer has it as a target at all. This is not a host that is
            down — that is InstanceDown's, and it would need the target to still
            exist. Check that prometheus/targets/node.yaml still lists it and
            still parses: Status → Service Discovery, and
            prometheus_sd_file_read_errors_total.

      - alert: LogEntriesDropped
        # Alloy accepted a log line and Loki refused it. There is no retry
        # behind a rejection, unlike the network errors
        # loki_write_batch_retries_total counts.
        #
        # WHAT #341 ESTABLISHED, and why this rule is shaped by duration rather
        # than by reason. Every discard in the seven days to 2026-09-06 was an
        # Alloy restart replaying history, in three flavours of the same event:
        #
        #   greater_than_max_sample_age   the docker source re-reading a
        #                                 container's log from the start. oracle's
        #                                 `db` container has been up nine months,
        #                                 so the replay carried an entry stamped
        #                                 2026-08-11 against a 168h limit.
        #   too_far_behind                the journal source replaying its
        #                                 max_age = 24h against a stream already
        #                                 current.
        #   rate_limited                  the same replay arriving faster than
        #                                 Loki's default ingestion limit.
        #
        # The timings are exact: oracle's agent started 02:37:07 on 09-04 and
        # Loki logged the rejection at 02:38:21; this host's started 02:54:07 and
        # its rejection landed at 02:54:15. The replayed entries are duplicates
        # already in the store, so nothing was lost — Loki refusing them is the
        # system working.
        #
        # An earlier version of this rule excluded too_far_behind by name. That
        # was the wrong axis: it silenced one flavour of a benign event while
        # leaving the other two to page, and it would have hidden a genuine
        # too_far_behind — a stream persistently trailing — along with them.
        #
        # DURATION IS THE DISCRIMINATOR. A restart burst is one step in the
        # counter, so rate() over 15m is positive for 15 minutes and no longer.
        # `for: 1h` cannot be satisfied by it, and is satisfied by loss that
        # keeps happening. That keeps every reason in scope: an ingest limit
        # being hit steadily, a stream permanently behind, a line too long — all
        # still fire, and none of them is a redeploy.
        #
        # `> 0` with no tolerance band inside that hour, deliberately. A dropped
        # log line is not a degradation to be graded; it is evidence that no
        # longer exists.
        expr: |
          sum by (job, reason) (rate(loki_write_dropped_entries_total[15m])) > 0
        for: 1h
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.job }} has been losing log lines to {{ $labels.reason }} for an hour"
          description: >-
            Loki has been rejecting these entries for an hour, so this is not the
            burst an agent restart produces — that lasts minutes and clears.
            Ask Loki which limit it is applying with
            `sum by (reason) (loki_discarded_samples_total)`. An entry older than
            reject_old_samples_max_age or a stream too far behind means an agent
            is replaying rather than tailing; rate_limited means the estate is
            producing more than the ingester accepts.

      - alert: JournalSourceStopped
        # The journal reader is alive and reading nothing.
        #
        # THE RULE #194 ASKED FOR, and the reason it needs a measured threshold
        # rather than an obvious one: "a quiet source and a broken one currently
        # look identical" is only true if you do not know how quiet the quiet
        # one is. Measured over 24h to 2026-09-06, the lowest hourly read rate
        # each agent reached was
        #
        #   Saruman     3.1 lines/hour      the quietest host in the estate
        #   prometheus 37.6
        #   alloy      49.2
        #   oracle     70.2
        #
        # so zero is not a quiet hour anywhere. It is a reader that has stopped,
        # and the gap between 3.1 and 0 is what makes `== 0` safe to assert
        # rather than a threshold somebody would have to keep tuning.
        #
        # This can only fire while the agent is still publishing metrics — a
        # dead agent takes the series with it, which is RemoteWriteJobStale's
        # job above. The two partition the failure: this one is the agent that
        # is up, healthy, scraped, and collecting none of the host's journal.
        # That is precisely the shape #62 and #194 are both about, and precisely
        # the one nothing else here can see.
        expr: |
          sum by (job) (rate(loki_source_journal_target_lines_total[1h])) == 0
        for: 2h
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.job }} has read no journal entries for two hours"
          description: >-
            The agent is up and publishing metrics, so this is not an outage —
            its journal reader has stopped. The quietest host in the estate
            still produces about three entries an hour, so zero is a fault
            rather than a quiet night. Check the reader's position file in the
            alloy-data volume and whether /var/log/journal is still mounted.

      - alert: SilenceExpiresSoon
        # A silence that lapses returns its alert to a phone as if new, at
        # whatever hour, with nothing to say why it was quiet. A week's notice
        # is what the owning issue needs to extend it or to finish the work.
        #
        # THE SECOND CLAUSE IS THE RULE'S HONESTY. The silence this repository
        # encourages is a short one — fit-the-saruman-ssds.md makes five-hour
        # silences and says a silence should expire embarrassingly soon — and
        # a five-hour silence is "within seven days" from the moment it is
        # created. A warning that fires the instant you do the recommended
        # thing is a warning you learn to ignore. So only a silence that has
        # already stood a week gets the week's notice: a thirty-day silence
        # warns on day 23, a fourteen-day one on day 7, a short one never. A
        # pending silence has a negative age and stays quiet for the same
        # reason. Re-creating a silence with different matchers gives it a
        # new UUID and a fresh start, so its notice moves out a week.
        #
        # `$value` is the left-hand side of the `and`: days remaining, which
        # is what the summary prints. `and on (id)` names the join key rather
        # than relying on both gauges carrying identical labels forever.
        expr: |
          (homelab_silence_expires_timestamp_seconds - time()) / 86400 < 7
          and on (id)
          (time() - homelab_silence_starts_timestamp_seconds) > 7 * 86400
        for: 1h
        labels:
          component: stack
          severity: warning
          category: monitoring
        annotations:
          summary: >-
            silence{{ if $labels.alert }} on {{ $labels.alert }}{{ end }}
            expires in {{ $value | printf "%.0f" }} days
          description: >-
            Silence {{ $labels.id }} has stood for more than a week and lapses
            within one. When it lapses the alert it covers notifies again as if
            new, at whatever hour, with nothing to say why it was quiet. Extend
            it from the issue that owns it, or delete it now because the work
            is done — docs/observability.md, Silences, has the convention.

      - alert: SilenceWithoutIssue
        # A silence nobody owns is the finding. Every silence here is meant to
        # begin its comment with the number of the open issue that owns its
        # expiry; #531's did not, #572's did not exist until the day the
        # silence was found, and #76 before them had neither silence nor owner.
        #
        # `{issue=""}` MATCHES SERIES THAT LACK THE LABEL. Prometheus drops a
        # label whose value is empty on ingest, and the collector omits the
        # label rather than writing issue="" for the same reason — so the
        # selector reads as "no issue", which is what it means. Do not "fix"
        # it to `absent()`: that would need to name every silence in advance.
        expr: homelab_silence_expires_timestamp_seconds{issue=""}
        for: 5m
        labels:
          component: stack
          severity: warning
          category: monitoring
        annotations:
          summary: "silence{{ if $labels.alert }} on {{ $labels.alert }}{{ end }} names no owning issue"
          description: >-
            Silence {{ $labels.id }}'s comment does not begin with the number
            of the open issue that owns its expiry, so nothing records why it
            exists or when it can go. Re-post it with the same id, matchers and
            startsAt and a comment that starts with #NNN — the UUID survives —
            or delete it. docs/observability.md, Silences, has the convention.

      # --- The rest of the stack watching itself (#840) -------------------------
      #
      # Each of these was charted on the observability dashboard, or exported and
      # read by nothing, with no rule behind it. A dashboard someone has to be
      # looking at is not a control.
      - alert: AlertmanagerConfigReloadFailed
        # The twin of PrometheusConfigReloadFailed above. Alertmanager keeps
        # serving the routing tree it last parsed, so a bad edit to
        # alertmanager.yaml leaves every route as it was before the edit,
        # silently, until the next restart fails outright.
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          component: stack
          severity: critical
          category: correctness
        annotations:
          runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/deploy-stack.md#troubleshooting"
          dashboard: "Observability Stack (/d/homelab-stack) › Alertmanager › Silences and config reloads"
          summary: "Alertmanager rejected its config reload on {{ $labels.instance }}"
          description: >-
            It is still routing with the tree it last accepted, so whatever the
            edit changed (a receiver, a route, a silence's target) is not in
            effect. `docker logs alertmanager 2>&1 | grep -i config` names the
            error; `make validate` (amtool check-config) catches it before a
            deploy.

      - alert: PrometheusNotificationsFailing
        # Prometheus deciding an alert fires and failing to hand it to
        # Alertmanager: send errors, or a full queue dropping the alert.
        # AlertmanagerNotificationsFailing covers the hop after this one.
        #
        # If Alertmanager is unreachable outright, this alert cannot reach it
        # either; the Watchdog heartbeat is what pages for that. This rule is
        # for the partial case: some sends failing, or a burst overflowing the
        # queue, while the path still works for the alert that says so.
        expr: |
          sum(increase(prometheus_notifications_errors_total{job="prometheus"}[15m])) > 0
          or sum(increase(prometheus_notifications_dropped_total{job="prometheus"}[15m])) > 0
        for: 5m
        labels:
          component: stack
          severity: critical
          category: correctness
        annotations:
          runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/verify-the-alert-path.md#reading-the-failure"
          dashboard: "Observability Stack (/d/homelab-stack) › Prometheus › Alert hand-off to Alertmanager"
          summary: "Prometheus is failing to hand alerts to Alertmanager"
          description: >-
            Some alerts that fired in the last 15 minutes never reached
            Alertmanager, so nobody was told. Check the dashboard's
            notification panels and `docker logs prometheus 2>&1 | grep -i
            notif`.

      - alert: PrometheusTsdbFailures
        # The TSDB degrading before it fails: compactions that do not complete
        # (so the head grows and disk follows), WAL corruption (samples lost on
        # the next restart), block reloads or head truncations failing. Each
        # counter is tagged with what it measures, so the alert names the one
        # that moved.
        #
        # job="prometheus" on every counter, as the dashboard has: other
        # components embed Prometheus's storage and notifier code and export the
        # same names, and an Alloy WAL failure is not this server's TSDB.
        expr: |
          label_replace(
            sum(increase(prometheus_tsdb_compactions_failed_total{job="prometheus"}[1h])) > 0,
            "failure", "compaction", "", "")
          or label_replace(
            sum(increase(prometheus_tsdb_wal_corruptions_total{job="prometheus"}[1h])) > 0,
            "failure", "wal-corruption", "", "")
          or label_replace(
            sum(increase(prometheus_tsdb_reloads_failures_total{job="prometheus"}[1h])) > 0,
            "failure", "block-reload", "", "")
          or label_replace(
            sum(increase(prometheus_tsdb_head_truncations_failed_total{job="prometheus"}[1h])) > 0,
            "failure", "head-truncation", "", "")
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          dashboard: "Observability Stack (/d/homelab-stack) › Prometheus › TSDB failures"
          summary: "Prometheus TSDB {{ $labels.failure }} failed in the last hour"
          description: >-
            `docker logs prometheus 2>&1 | grep -iE 'compact|wal|reload|truncat'`
            says why. A WAL corruption means some recent samples will not
            survive a restart; repeated compaction failures mean the head, and
            the disk, keep growing. Neither fixes itself.

      - alert: AlloyRemoteWriteFailing
        # An agent whose pushes are being refused, measured from its own
        # self-scrape (config.alloy, `selfmetrics`). job=~".+-alloy" is that
        # copy only: the local agent is also scraped directly as job="alloy",
        # and matching both would alert twice for one agent.
        #
        # Catches the partial and the permanent-but-reported cases: samples
        # rejected as too old or out of order, or a 4xx such as a refused
        # token on some batches. An agent that can push NOTHING cannot push
        # this counter either; RemoteWriteJobStale is that case.
        expr: |
          sum by (instance) (rate(prometheus_remote_storage_samples_failed_total{job=~".+-alloy"}[10m])) > 0
        for: 15m
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          dashboard: "Observability Stack (/d/homelab-stack) › Alloy › Remote-write throughput"
          summary: "Alloy on {{ $labels.instance }} is failing to remote-write some samples"
          description: >-
            Metrics from {{ $labels.instance }} are being lost, not queued. On
            the host, `docker logs alloy 2>&1 | grep -i 'remote_write\|non-recoverable'`
            (or `journalctl -u alloy` for a native agent) gives the status the
            receiver returned: 401 is the ingest token, 400 out-of-order or too
            old is the clock or a replay.

      - alert: AlloyComponentUnhealthy
        # A pipeline component the agent reports as unhealthy while the agent
        # itself is up, which is how a bad config, an unreadable file or a
        # refused Docker API shows. The agent's own healthcheck stays green
        # through all of it. Same single copy per agent as above.
        expr: |
          sum by (instance, health_type) (
            alloy_component_controller_running_components{job=~".+-alloy", health_type!="healthy"}
          ) > 0
        for: 15m
        labels:
          component: stack
          severity: warning
          category: correctness
        annotations:
          dashboard: "Observability Stack (/d/homelab-stack) › Alloy › Component health"
          summary: "Alloy on {{ $labels.instance }} has {{ $value }} {{ $labels.health_type }} component(s)"
          description: >-
            Part of what that agent collects has stopped while the agent stays
            up. Its debug UI on 127.0.0.1:12345 (an SSH tunnel away) lists each
            component with its health and last error.
