---
# Container metrics arrive via the cAdvisor exporter embedded in Alloy.
groups:
  - name: containers
    interval: 60s
    rules:
      - alert: ContainerRestartLoop
        # container_start_time_seconds changes on every (re)start; more than
        # three changes in 15 minutes is a crash loop rather than a deploy.
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 3
        for: 5m
        labels:
          component: containers
          severity: warning
          category: availability
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.host }} is restarting repeatedly"
          description: "{{ $value }} restarts in the last 15 minutes."

      - alert: ContainerOomKilled
        expr: increase(container_oom_events_total{name!=""}[15m]) > 0
        labels:
          component: containers
          severity: warning
          category: capacity
        annotations:
          summary: "Container {{ $labels.name }} was OOM-killed"

      - alert: ContainerHighMemory
        # Measured against the host, not against a limit. The limit-based form
        # this replaces could not fire: it divided by
        # container_spec_memory_limit_bytes and guarded on that being > 0, but
        # no service in compose.yaml sets a memory limit, so cAdvisor reports 0
        # for all six and the guard excluded every one of them. See #63.
        #
        # Do not "simplify" this to `/ machine_memory_bytes`. That form returns
        # no series at all: machine_memory_bytes carries boot_id, machine_id and
        # system_uuid, the container series carry name, id and image, so nothing
        # matches and the rule silently goes unfireable again. The on(instance)
        # join is what makes it work, and group_left is mandatory — six
        # containers to one machine series is many-to-one, and Prometheus
        # rejects that as an error unless the grouping is explicit.
        #
        # 0.40 of 7.6 GiB is ~3 GB in one container, against a whole-stack
        # working set of ~790 MB. HostMemoryPressure in host.rules.yaml already
        # catches the host running out; this one fires earlier and, unlike that
        # rule, names which container is responsible.
        expr: |
          container_memory_working_set_bytes{name!=""}
          / on(instance) group_left machine_memory_bytes > 0.40
        for: 15m
        labels:
          component: containers
          severity: warning
          category: capacity
        annotations:
          summary: "Container {{ $labels.name }} is using {{ $value | humanizePercentage }} of host memory"

      - alert: ContainerCpuThrottled
        expr: |
          rate(container_cpu_cfs_throttled_periods_total{name!=""}[15m])
          / clamp_min(rate(container_cpu_cfs_periods_total{name!=""}[15m]), 1) > 0.25
        for: 30m
        labels:
          component: containers
          severity: info
          category: saturation
        annotations:
          summary: "Container {{ $labels.name }} throttled {{ $value | humanizePercentage }} of CPU periods"

      # --- The observability stack watching itself --------------------------
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          component: containers
          severity: critical
          category: correctness
        annotations:
          summary: "Prometheus rejected its own config reload on {{ $labels.instance }}"

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 5m
        labels:
          component: containers
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $value }} rule evaluation failures in the last 15 minutes"

      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          component: containers
          severity: critical
          category: correctness
        annotations:
          summary: "Alertmanager cannot deliver notifications via {{ $labels.integration }}"
          description: >-
            Alerts are firing but not reaching anyone — this makes every other
            rule in this repository silently useless.

      - alert: LokiIngestionStalled
        expr: |
          sum(rate(loki_distributor_lines_received_total[30m])) == 0
        for: 30m
        labels:
          component: containers
          severity: warning
          category: availability
        annotations:
          summary: "Loki has received no log lines for 30 minutes"
          description: >-
            Either every Alloy agent is down or the push endpoint is
            unreachable. Logs are being lost, not queued indefinitely.
