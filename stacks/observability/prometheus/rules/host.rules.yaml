---
groups:
  - name: host
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 5m
        labels:
          component: host
          severity: critical
          category: availability
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: >-
            Prometheus has failed to scrape {{ $labels.instance }}
            ({{ $labels.job }}) for 5 minutes.

      - alert: HostDiskWillFillIn24h
        # Predictive rather than a static threshold: a disk sitting at 86% and
        # stable is not an emergency, one climbing fast at 60% is.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
          and on (instance, device)
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.30
        for: 1h
        labels:
          component: host
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} fills within 24h"
          description: >-
            {{ $labels.mountpoint }} on {{ $labels.instance }} ({{ $labels.device }})
            is below 30% free and, extrapolating the last 6 hours, reaches zero
            within a day.

      - alert: HostDiskCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 15m
        labels:
          component: host
          severity: critical
          category: capacity
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} below 10% free"

      - alert: HostMemoryPressure
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          component: host
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.instance }} has less than 10% memory available"

      - alert: HostHighLoad
        # Normalised by core count so the same rule works on the 2012 MacBook
        # and the DL360 without tuning.
        expr: |
          node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 30m
        labels:
          component: host
          severity: warning
          category: saturation
        annotations:
          summary: "{{ $labels.instance }} load is {{ $value | humanize }}x core count"

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels:
          component: host
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.instance }} clock is {{ $value | humanizeDuration }} off"
          description: >-
            Clock skew breaks log correlation across hosts and can invalidate
            rate() calculations.

      - alert: HostRebooted
        expr: time() - node_boot_time_seconds < 600
        labels:
          component: host
          severity: info
          category: availability
        annotations:
          summary: "{{ $labels.instance }} rebooted in the last 10 minutes"

      - alert: SecurityUpdatesPending
        # The gap #152 named: images are digest-pinned, CI-enforced and
        # Dependabot-bumped, while the kernel underneath is patched when somebody
        # remembers. docs/security.md accepts a host-OS vulnerability as an
        # undefended threat, which is a reasonable position to hold deliberately
        # and a much weaker one when nobody knows how far behind the host is.
        #
        # SECURITY updates only, not all pending upgrades. A host that is three
        # ordinary packages behind is not a finding and alerting on it is how
        # this becomes noise; a host carrying an unapplied security update for a
        # week is. `homelab_apt_upgrades_pending` is collected alongside and is
        # there to be looked at, not alerted on.
        #
        # `for: 7d` rather than a smaller number, and it is doing real work: the
        # unattended-upgrades timer Ubuntu ships applies security updates on its
        # own, so anything still pending after a week is something that did not
        # apply — held, phased, or needing a reboot — rather than something
        # nobody has got to yet.
        expr: homelab_apt_security_upgrades_pending > 0
        for: 7d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has had {{ $value }} security update(s) pending for a week"
          description: >-
            Unattended-upgrades should have applied these. A week of them sitting
            there means they are held, phased, or waiting on a reboot. Check with
            `apt list --upgradable` and
            `systemctl status unattended-upgrades.service`.

      - alert: RebootRequired
        # A package post-install asked for a reboot and nothing has done it. This
        # is the only reliable "running something older than what is installed"
        # signal available here: node_uname_info reports the RUNNING kernel and
        # node_exporter reports no installed one, so the two cannot be compared.
        #
        # 3 days, not immediately. A reboot is a decision with a window — this
        # host runs the monitoring stack, and rebooting it blinds the estate for
        # the duration — so the alert is a reminder rather than an instruction.
        expr: homelab_reboot_required == 1
        for: 3d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has needed a reboot for three days"
          description: >-
            /var/run/reboot-required.pkgs names which packages asked, and
            homelab_reboot_required_packages counts them. The running kernel is
            older than the installed one until this happens. Pick a window —
            rebooting the monitoring host blinds the estate for its duration.

      - alert: PatchStateStopped
        # A host that WAS reporting patch state and no longer is.
        #
        # THE FAILURE THIS COVERS, and #360 names it exactly: "a host that
        # silently stops collecting looks exactly like a host with nothing to
        # report". Both SecurityUpdatesPending and RebootRequired are written
        # against a metric being > 0, so a collector that dies takes both alerts
        # with it and the host goes quiet in the way that looks healthiest.
        #
        # This is the second half of a lesson already paid for here: #152's
        # collector wrote its samples to the same filename run-scheduled.sh uses
        # for its own outcome metrics, so the wrapper overwrote them on every
        # run. `make patch-state` printed the right numbers, the job exited 0,
        # and the series never existed. Nothing noticed for as long as nothing
        # was looking for absence.
        #
        # STOPPED, NOT MISSING, and the distinction is deliberate. An absent()
        # over the whole metric would fire for every apt host not yet covered —
        # `Saruman` today — which is a known gap tracked in #360 rather than an
        # alert. Comparing a day-long window against the last six hours asks
        # only about hosts that were reporting and are not, so onboarding a host
        # is silent and losing one is not.
        #
        # Six hours, against a daily timer, because the metric is a file on disk:
        # node_exporter re-serves it on every scrape, so the series is present
        # continuously and not once a day. Six hours survives a Prometheus
        # restart and a host rebooting, which is the same window
        # deploy.rules.yaml and backup.rules.yaml settled on.
        expr: >-
          count by (host) (present_over_time(homelab_apt_upgrades_pending[1d] offset 6h))
          unless
          count by (host) (present_over_time(homelab_apt_upgrades_pending[6h]))
        for: 30m
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has stopped reporting patch state"
          description: >-
            It reported within the last day and has not in six hours, so
            SecurityUpdatesPending and RebootRequired are both blind to this host
            until it comes back. Check homelab-patch-state.timer on the host —
            `systemctl status homelab-patch-state.timer` — and that
            /var/lib/node_exporter/textfile_collector/apt-patch-state.prom is
            being written and is world-readable. A 0600 file is invisible to the
            collector and produces exactly this silence.
      # --- SMART, for the disks the iLO cannot see (#351) -------------------
      #
      # #151 already covers Saruman's array: cpqDaPhyDrvSmartStatus arrives over
      # SNMP and IloDrivePredictiveFailure is armed on it. These four cover the
      # rest — oracle's 5400 rpm HDD, the monitoring host's 2012 SSD, and
      # morpheus's NVMe — which had nothing at all.
      #
      # Every one of them reads the DRIVE'S OWN verdict rather than a threshold
      # invented here. That matters more than it sounds: morpheus idles at 62 C
      # against an operational limit of 100 C, so any fixed temperature number
      # would be wrong for some drive in this estate. Temperature is collected
      # and deliberately not alerted on for exactly that reason — the drive
      # reports seconds spent above its own warning and critical limits, and
      # that is the signal worth a rule once there is history to write it
      # against.

      - alert: SmartDriveUnhealthy
        # The drive's overall self-assessment has failed. This is the one SMART
        # signal that means "replace this now": the firmware has concluded the
        # disk is failing, not that a counter looks odd.
        #
        # No `for` beyond a scrape or two. Every other rule here waits because
        # the condition might be transient; this one is a latch the drive sets
        # and does not clear.
        expr: homelab_smart_healthy == 0
        for: 5m
        labels:
          component: host
          severity: critical
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: SMART says {{ $labels.device }} is failing"
          description: >-
            The drive's own overall self-assessment has failed on
            {{ $labels.model }}. This is the firmware's verdict, not a derived
            one. Replace it; `smartctl -a {{ $labels.device }}` on the host has
            the attribute that tripped.

      - alert: SmartDriveSpareLow
        # NVMe keeps spare blocks to remap failures into, and publishes its OWN
        # threshold for when that reserve is too small. Comparing against that
        # rather than a number chosen here is the whole point — the drive knows
        # what its reserve was sized for.
        expr: >-
          homelab_smart_available_spare_percent
          < on(host, device) homelab_smart_available_spare_threshold_percent
        for: 15m
        labels:
          component: host
          severity: critical
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.device }} spare capacity below the drive's own threshold"
          description: >-
            Remaining spare is {{ $value }}%, under the threshold the drive
            itself publishes. The drive is remapping faster than its reserve
            allows and is near the end of its usable life. Plan a replacement.

      - alert: SmartDriveWearHigh
        # Endurance consumed, as the vendor estimates it. 80 rather than 100
        # because the useful action is ordering a disk, and 100 means the rated
        # write life is already gone. Not critical: a drive past its rated
        # endurance usually keeps working, it just stops being trustworthy.
        expr: homelab_smart_percentage_used >= 80
        for: 1h
        labels:
          component: host
          severity: warning
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.device }} has used {{ $value }}% of its rated life"
          description: >-
            The vendor's endurance estimate for {{ $labels.model }}. At 100 the
            rated write life is used; the drive will usually keep going and
            should stop being trusted with anything not backed up. Order a
            replacement rather than reacting.

      - alert: SmartDriveBadSectors
        # Any non-zero value here is data the drive could not read back. Both
        # families are covered: reallocated and pending sectors are the ATA
        # spelling, media errors the NVMe one.
        #
        # `> 0` and not an increase(): a remapped sector never un-remaps, so the
        # count only ever grows and the first one is the finding. A rate would
        # go quiet on a drive that failed once and is sitting there degraded.
        expr: >-
          homelab_smart_reallocated_sectors > 0
          or homelab_smart_pending_sectors > 0
          or homelab_smart_uncorrectable_sectors > 0
          or homelab_smart_media_errors_total > 0
        for: 30m
        labels:
          component: host
          severity: warning
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.device }} has unreadable sectors"
          description: >-
            {{ $value }} sector(s) or media error(s) the drive could not read
            back. The count only grows, so this stays firing until the disk is
            replaced — that is deliberate, because a drive that failed once and
            went quiet is still a drive that failed. Check backups first.

      - alert: SystemUpdateAvailable
        # A pfSense system upgrade has been available for a week (#378).
        #
        # THE HOST WHERE THIS MATTERS MOST, and the last one to get any patch
        # visibility at all. docs/security.md names "a vulnerability in pfSense
        # itself" as an accepted, undefended threat — a position that is
        # reasonable held deliberately and much weaker when nobody knows how far
        # behind the firewall is. `morpheus` terminates every VLAN, runs
        # Suricata, and serves DNS and NTP.
        #
        # SYSTEM, NOT PACKAGES. homelab_pkg_upgrades_pending counts everything
        # behind the repository and is deliberately NOT alerted on: pfSense
        # add-ons drift routinely — `pfSense-repoc` republishes every few weeks —
        # so a rule on that count would fire permanently and be ignored, which is
        # the failure mode this repository keeps writing down. The system
        # meta-packages are the thing an operator actually acts on, and pfSense
        # is upgraded as a unit rather than package by package.
        #
        # 7d, not immediately, for the reason RebootRequired uses 3d: applying
        # this takes the whole estate off the network while the firewall
        # restarts, so it is a window somebody picks. A week means nobody has
        # picked one.
        expr: homelab_pkg_system_update_available == 1
        for: 7d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has had a system update available for a week"
          description: >-
            A pfSense system package is behind the repository. Applying it
            restarts the firewall and takes the estate off the network, so pick a
            window rather than reacting. `pfSense-upgrade -c` on the host
            confirms it independently, and homelab_pkg_upgrades_pending shows how
            many packages in total are behind.

      # --- Hypervisor guests, the half of #257 that can cross ----------------
      #
      # ADR-0028 decides that a guest's RUN STATE is hypervisor state rather
      # than the guest telemetry ADR-0007 keeps in the lab. These two rules are
      # what that buys, and neither of them can see inside a guest.

      - alert: HypervisorGuestStopped
        # A guest the hypervisor knows about is not running.
        #
        # WARNING AND AN HOUR, because the estate genuinely cannot tell a
        # deliberate shutdown from a crash and should not pretend to. #257
        # allows for "a machine that is powered off between sessions", which is
        # exactly this signal with a different cause. An hour is long enough
        # that a reboot or a snapshot restore does not page, and short enough
        # that a lab guest which fell over during an exercise is noticed the
        # same afternoon.
        #
        # The alternative — a table of which guests are expected to be up —
        # was rejected: it is a second copy of a fact that changes whenever a
        # VM is created, and this repository has enough of those.
        expr: homelab_guest_running == 0
        for: 1h
        labels:
          component: host
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.host }}: guest {{ $labels.guest }} has been stopped for an hour"
          description: >-
            The hypervisor reports this guest as not running. If it was powered
            off deliberately this is expected and there is nothing to do — the
            estate cannot tell the difference, and says so rather than implying
            it can. If it was not, the guest is down and anything inside it,
            including the lab stack on `alexander`, is down with it.

      - alert: GuestStateStopped
        # The collector itself stopped reporting. Without this, a hypervisor
        # whose collector died looks exactly like one with no guests — and
        # "no guests" is a legitimate answer, which is what makes the silence
        # dangerous. Same shape and same reasoning as PatchStateStopped.
        #
        # Stopped, not missing: a hypervisor that never had the collector
        # installed must stay quiet, or every host without it alerts forever.
        expr: >-
          count by (host) (present_over_time(homelab_guests_total[1d] offset 6h))
          unless
          count by (host) (present_over_time(homelab_guests_total[6h]))
        for: 30m
        labels:
          component: host
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.host }} has stopped reporting its guests"
          description: >-
            It reported within the last day and has not in six hours, so
            HypervisorGuestStopped is blind to this hypervisor until it comes
            back. Check homelab-guest-state.timer on the host and that
            /var/lib/node_exporter/textfile_collector/guest-state.prom is being
            written and is world-readable.

      - alert: SmartDriveBadSectorsGrowing
        # The signal SmartDriveBadSectors cannot give you, and the one worth
        # acting on.
        #
        # WHY IT IS A SEPARATE RULE RATHER THAN A BETTER THRESHOLD. Its sibling
        # is `> 0`, which is correct — a remapped sector never un-remaps, so the
        # first one is a finding and the count only ever grows. But that makes it
        # fire forever once tripped, so it gets silenced, and an Alertmanager
        # silence matches LABELS, not values: silencing 32 reallocated sectors on
        # oracle silences 90 just as effectively, because no label carries the
        # count. The static fact and the trend need different alertnames or the
        # trend cannot survive the silence. That happened on 2026-09-07 (#351).
        #
        # SUBTRACTION, NOT increase(). These are gauges, and increase() assumes
        # counter semantics — it extrapolates and handles resets, neither of
        # which is right here. The value is served continuously by the textfile
        # collector rather than sampled daily, so comparing a point against the
        # same point a week earlier is exact and needs no estimation.
        #
        # All four spellings, because a drive fails in whichever one its firmware
        # uses: reallocated and pending are the ATA vocabulary, media errors the
        # NVMe one, and uncorrectable is the sector that could not be recovered
        # at all.
        expr: >-
          (homelab_smart_reallocated_sectors - homelab_smart_reallocated_sectors offset 7d) > 0
          or (homelab_smart_pending_sectors - homelab_smart_pending_sectors offset 7d) > 0
          or (homelab_smart_uncorrectable_sectors - homelab_smart_uncorrectable_sectors offset 7d) > 0
          or (homelab_smart_media_errors_total - homelab_smart_media_errors_total offset 7d) > 0
        for: 1h
        labels:
          component: host
          severity: warning
          category: hardware
        annotations:
          summary: >-
            {{ $labels.host }}: {{ $labels.device }} has gained
            {{ $value }} bad sector(s) in seven days
          description: >-
            The count is rising, which is the difference between a drive that
            failed once and a drive that is failing now. A static count is
            expected and is usually silenced; this is not that. Replace the disk
            rather than waiting for the drive's own assessment to fail —
            SmartDriveUnhealthy is the firmware conceding, and it concedes late.
            Check backups first.
