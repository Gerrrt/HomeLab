---
groups:
  - name: host
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 5m
        labels:
          component: host
          severity: critical
          category: availability
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: >-
            Prometheus has failed to scrape {{ $labels.instance }}
            ({{ $labels.job }}) for 5 minutes.

      - alert: HostDiskWillFillIn24h
        # Predictive rather than a static threshold: a disk sitting at 86% and
        # stable is not an emergency, one climbing fast at 60% is.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
          and on (instance, device)
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.30
        for: 1h
        labels:
          component: host
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} fills within 24h"
          description: >-
            {{ $labels.mountpoint }} on {{ $labels.instance }} ({{ $labels.device }})
            is below 30% free and, extrapolating the last 6 hours, reaches zero
            within a day.

      - alert: HostDiskCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 15m
        labels:
          component: host
          severity: critical
          category: capacity
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} below 10% free"

      - alert: HostMemoryPressure
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          component: host
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.instance }} has less than 10% memory available"

      - alert: HostHighLoad
        # Normalised by core count so the same rule works on the 2012 MacBook
        # and the DL360 without tuning.
        expr: |
          node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 30m
        labels:
          component: host
          severity: warning
          category: saturation
        annotations:
          summary: "{{ $labels.instance }} load is {{ $value | humanize }}x core count"

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels:
          component: host
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.instance }} clock is {{ $value | humanizeDuration }} off"
          description: >-
            Clock skew breaks log correlation across hosts and can invalidate
            rate() calculations.

      - alert: HostRebooted
        expr: time() - node_boot_time_seconds < 600
        labels:
          component: host
          severity: info
          category: availability
        annotations:
          summary: "{{ $labels.instance }} rebooted in the last 10 minutes"

      - alert: SecurityUpdatesPending
        # The gap #152 named: images are digest-pinned, CI-enforced and
        # Dependabot-bumped, while the kernel underneath is patched when somebody
        # remembers. docs/security.md accepts a host-OS vulnerability as an
        # undefended threat, which is a reasonable position to hold deliberately
        # and a much weaker one when nobody knows how far behind the host is.
        #
        # SECURITY updates only, not all pending upgrades. A host that is three
        # ordinary packages behind is not a finding and alerting on it is how
        # this becomes noise; a host carrying an unapplied security update for a
        # week is. `homelab_apt_upgrades_pending` is collected alongside and is
        # there to be looked at, not alerted on.
        #
        # `for: 7d` rather than a smaller number, and it is doing real work: the
        # unattended-upgrades timer Ubuntu ships applies security updates on its
        # own, so anything still pending after a week is something that did not
        # apply — held, phased, or needing a reboot — rather than something
        # nobody has got to yet.
        expr: homelab_apt_security_upgrades_pending > 0
        for: 7d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has had {{ $value }} security update(s) pending for a week"
          description: >-
            Unattended-upgrades should have applied these. A week of them sitting
            there means they are held, phased, or waiting on a reboot. Check with
            `apt list --upgradable` and
            `systemctl status unattended-upgrades.service`.

      - alert: RebootRequired
        # A package post-install asked for a reboot and nothing has done it. This
        # is the only reliable "running something older than what is installed"
        # signal available here: node_uname_info reports the RUNNING kernel and
        # node_exporter reports no installed one, so the two cannot be compared.
        #
        # 3 days, not immediately. A reboot is a decision with a window — this
        # host runs the monitoring stack, and rebooting it blinds the estate for
        # the duration — so the alert is a reminder rather than an instruction.
        expr: homelab_reboot_required == 1
        for: 3d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has needed a reboot for three days"
          description: >-
            /var/run/reboot-required.pkgs names which packages asked, and
            homelab_reboot_required_packages counts them. The running kernel is
            older than the installed one until this happens. Pick a window —
            rebooting the monitoring host blinds the estate for its duration.
