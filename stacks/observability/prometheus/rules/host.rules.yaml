---
groups:
  - name: host
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 5m
        labels:
          component: host
          severity: critical
          category: availability
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: >-
            Prometheus has failed to scrape {{ $labels.instance }}
            ({{ $labels.job }}) for 5 minutes.

      - alert: HostDiskWillFillIn24h
        # Predictive rather than a static threshold: a disk sitting at 86% and
        # stable is not an emergency, one climbing fast at 60% is.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
          and on (instance, device)
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.30
        for: 1h
        labels:
          component: host
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} fills within 24h"
          description: >-
            {{ $labels.mountpoint }} on {{ $labels.instance }} ({{ $labels.device }})
            is below 30% free and, extrapolating the last 6 hours, reaches zero
            within a day.

      - alert: HostDiskCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 15m
        labels:
          component: host
          severity: critical
          category: capacity
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} below 10% free"

      - alert: HostMemoryPressure
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          component: host
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.instance }} has less than 10% memory available"

      - alert: HostHighLoad
        # Normalised by core count so the same rule works on the 2012 MacBook
        # and the DL360 without tuning.
        expr: |
          node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 30m
        labels:
          component: host
          severity: warning
          category: saturation
        annotations:
          summary: "{{ $labels.instance }} load is {{ $value | humanize }}x core count"

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels:
          component: host
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.instance }} clock is {{ $value | humanizeDuration }} off"
          description: >-
            Clock skew breaks log correlation across hosts and can invalidate
            rate() calculations.

      - alert: HostClockUnsynchronised
        # THE CLOCK HostClockSkew CANNOT SEE.
        #
        # Replacing prometheus's laptop cell on 2026-09-18 (#454) cleared the
        # RTC. systemd-timesyncd restored the clock from its own clock file,
        # whose timestamp is the second the machine went down, and the stack
        # ran 13.8 minutes writing samples BACKDATED inside the outage before
        # NTP stepped the clock forward about three hours. Nothing alerted
        # (#519). HostClockSkew reads node_timex_offset_seconds, the kernel's
        # current correction estimate; a clock that is wrong but stable has
        # nothing to correct, and the offset read exactly 0 for the whole
        # window. The field that carried the event is one over:
        # node_timex_sync_status was 0 from the first post-swap scrape to the
        # NTP step. This is ADR-0029's pair on Linux — DomainControllerClockDrifting
        # reads the offset, DomainControllerTimeSourceIsLocalClock reads the
        # source — because the obvious metric reads zero for exactly the
        # failure being hunted.
        #
        # NOT node_boot_time_seconds. The issue's other candidate was a
        # backward jump in the boot time, and the series never jumped
        # backward: the 2026-07-28 value the RTC came up with never reached a
        # scrape, the restored 14:53:27 is later than the previous boot, and
        # the NTP step moved it FORWARD to 18:00:52. HostRebooted did fire, at
        # info, into the null receiver.
        #
        # for: 5m IS MEASURED, NOT PICKED. Over the 30 days of retention on
        # 2026-09-19 the estate booted eight times (Saruman three, oracle
        # three, prometheus twice) and, read at 15s resolution around each
        # boot, produced not one sample of 0: timesyncd syncs before the
        # first 60s scrape on an ordinary boot. The only run of 0 in retention
        # was the backdated window, 14:54:27 to 15:08:12 in TSDB time. Five
        # minutes is five scrapes above the measured normal, fires about six
        # minutes into that window, and would have said so roughly eight
        # minutes before NTP repaired it. 15m would have missed the event
        # entirely. The kernel also re-raises STA_UNSYNC on its own about
        # nine hours after the last NTP update (maxerror grows at 500 us/s
        # to the 16 s phase limit), so an NTP path that dies quietly is
        # reported here before it has produced any drift for HostClockSkew.
        #
        # WHAT IT CAN AND CANNOT SEE. For a remote-writing host other than
        # this one (oracle, next in line for the same swap), Prometheus is on
        # a correct clock: the alert fires in real time, the ALERTS record is
        # stamped correctly, and only that host's own samples are backdated.
        # For prometheus itself the rule sees only the part of the window in
        # which Prometheus was running on the wrong clock — 13.8 minutes of a
        # roughly 3h18m outage on 2026-09-18. The notification reaches ntfy
        # in real time; the alert's own startsAt and its ALERTS series carry
        # the same wrong clock. It sees nothing of the hours the stack was
        # down, and says nothing about samples written before the first 0.
        expr: node_timex_sync_status == 0
        for: 5m
        labels:
          component: host
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.instance }} clock has no time source"
          description: >-
            The kernel reports its clock unsynchronised: no NTP source has
            confirmed the time. HostClockSkew stays quiet here because a clock
            that is wrong but stable has nothing to correct. Every sample and
            log line this host stamps while this fires is on an unconfirmed
            clock — after a battery or RTC loss it is backdated into the outage
            it follows. Check `timedatectl timesync-status` and
            `journalctl -b -u systemd-timesyncd`;
            docs/runbooks/replace-the-laptop-cell.md step 6 says how to read
            the TSDB afterwards.

      - alert: HostRebooted
        expr: time() - node_boot_time_seconds < 600
        labels:
          component: host
          severity: info
          category: availability
        annotations:
          summary: "{{ $labels.instance }} rebooted in the last 10 minutes"

      - alert: SecurityUpdatesPending
        # The gap #152 named: images are digest-pinned, CI-enforced and
        # Dependabot-bumped, while the kernel underneath is patched when somebody
        # remembers. docs/security.md accepts a host-OS vulnerability as an
        # undefended threat, which is a reasonable position to hold deliberately
        # and a much weaker one when nobody knows how far behind the host is.
        #
        # SECURITY updates only, not all pending upgrades. A host that is three
        # ordinary packages behind is not a finding and alerting on it is how
        # this becomes noise; a host carrying an unapplied security update for a
        # week is. `homelab_apt_upgrades_pending` is collected alongside and is
        # there to be looked at, not alerted on.
        #
        # `for: 7d` rather than a smaller number, and it is doing real work: the
        # unattended-upgrades timer Ubuntu ships applies security updates on its
        # own, so anything still pending after a week is something that did not
        # apply — held, phased, or needing a reboot — rather than something
        # nobody has got to yet.
        expr: homelab_apt_security_upgrades_pending > 0
        for: 7d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has had {{ $value }} security update(s) pending for a week"
          description: >-
            Unattended-upgrades should have applied these. A week of them sitting
            there means they are held, phased, or waiting on a reboot. Check with
            `apt list --upgradable` and
            `systemctl status unattended-upgrades.service`.

      - alert: RebootRequired
        # A package post-install asked for a reboot and nothing has done it. This
        # is the only reliable "running something older than what is installed"
        # signal available here: node_uname_info reports the RUNNING kernel and
        # node_exporter reports no installed one, so the two cannot be compared.
        #
        # 3 days, not immediately. A reboot is a decision with a window — this
        # host runs the monitoring stack, and rebooting it blinds the estate for
        # the duration — so the alert is a reminder rather than an instruction.
        expr: homelab_reboot_required == 1
        for: 3d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has needed a reboot for three days"
          description: >-
            /var/run/reboot-required.pkgs names which packages asked, and
            homelab_reboot_required_packages counts them. The running kernel is
            older than the installed one until this happens. Pick a window —
            rebooting the monitoring host blinds the estate for its duration.

      - alert: PatchStateStopped
        # A host that WAS reporting patch state and no longer is.
        #
        # THE FAILURE THIS COVERS, and #360 names it exactly: "a host that
        # silently stops collecting looks exactly like a host with nothing to
        # report". Both SecurityUpdatesPending and RebootRequired are written
        # against a metric being > 0, so a collector that dies takes both alerts
        # with it and the host goes quiet in the way that looks healthiest.
        #
        # This is the second half of a lesson already paid for here: #152's
        # collector wrote its samples to the same filename run-scheduled.sh uses
        # for its own outcome metrics, so the wrapper overwrote them on every
        # run. `make patch-state` printed the right numbers, the job exited 0,
        # and the series never existed. Nothing noticed for as long as nothing
        # was looking for absence.
        #
        # STOPPED, NOT MISSING, and the distinction is deliberate. An absent()
        # over the whole metric would fire for every apt host not yet covered —
        # `Saruman` today — which is a known gap tracked in #360 rather than an
        # alert. Comparing a day-long window against the last six hours asks
        # only about hosts that were reporting and are not, so onboarding a host
        # is silent and losing one is not.
        #
        # Six hours, against a daily timer, because the metric is a file on disk:
        # node_exporter re-serves it on every scrape, so the series is present
        # continuously and not once a day. Six hours survives a Prometheus
        # restart and a host rebooting, which is the same window
        # deploy.rules.yaml and backup.rules.yaml settled on.
        expr: >-
          count by (host) (present_over_time(homelab_apt_upgrades_pending[1d] offset 6h))
          unless
          count by (host) (present_over_time(homelab_apt_upgrades_pending[6h]))
        for: 30m
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has stopped reporting patch state"
          description: >-
            It reported within the last day and has not in six hours, so
            SecurityUpdatesPending and RebootRequired are both blind to this host
            until it comes back. Check homelab-patch-state.timer on the host —
            `systemctl status homelab-patch-state.timer` — and that
            /var/lib/node_exporter/textfile_collector/apt-patch-state.prom is
            being written and is world-readable. A 0600 file is invisible to the
            collector and produces exactly this silence.
      - alert: DriftCheckStopped
        # The wiki's drift check on oracle has not run in more than a day.
        #
        # Gerrrt/Lemmiwinks/.claude/tools/drift-check reads the wiki's
        # machine-checkable claims against the machine and files a wiki issue
        # when they disagree. Its whole value is that it keeps running; a check
        # that has quietly stopped is indistinguishable from a wiki with nothing
        # wrong in it — #400's shape, and the reason #470 shipped it as an agent
        # collector with a timestamp (scripts/collect-drift-check.sh).
        #
        # A TIMESTAMP RATHER THAN PRESENCE, unlike PatchStateStopped above, and
        # on purpose: the .prom file persists and node_exporter re-serves it on
        # every scrape, so the series never goes absent when the timer stops —
        # only the timestamp stops moving. Twenty-six hours against a daily
        # timer with fifteen minutes of jitter tolerates a missed run caught up
        # at the next boot (Persistent=true) and not two. If oracle itself is
        # down, InstanceDown says so and this stays quiet on absence.
        expr: time() - homelab_drift_check_last_run_timestamp_seconds > 26 * 3600
        for: 30m
        labels:
          component: host
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.host }} has not run the wiki drift check in over a day"
          description: >-
            The last run was {{ $value | humanizeDuration }} ago, so the wiki's
            machine-checkable claims are unchecked and a stale page would go
            unreported. Check homelab-drift-check.timer on the host —
            `systemctl status homelab-drift-check.timer` — and its last run in
            Loki under unit="homelab-drift-check.service". It runs as the wiki
            maintainer's user, so a missing checkout at
            /home/atropos/code/Gerrrt/Lemmiwinks or an expired gh login is the
            usual cause.
      # --- SMART, for the disks the iLO cannot see (#351) -------------------
      #
      # #151 already covers Saruman's array: cpqDaPhyDrvSmartStatus arrives over
      # SNMP and IloDrivePredictiveFailure is armed on it. These four cover the
      # rest — oracle's 5400 rpm HDD, the monitoring host's 2012 SSD,
      # morpheus's NVMe, and since ADR-0047 smaug's three: the S3520 boot SSD
      # and the Exos mirror, read by a root cron job on the NAS and served
      # over the scrape (#483) — which had nothing at all.
      #
      # Every one of them reads the DRIVE'S OWN verdict rather than a threshold
      # invented here. That matters more than it sounds: morpheus idles at 62 C
      # against an operational limit of 100 C, so any fixed temperature number
      # would be wrong for some drive in this estate. Temperature is collected
      # and deliberately not alerted on for exactly that reason — the drive
      # reports seconds spent above its own warning and critical limits, and
      # that is the signal worth a rule once there is history to write it
      # against.

      - alert: SmartDriveUnhealthy
        # The drive's overall self-assessment has failed. This is the one SMART
        # signal that means "replace this now": the firmware has concluded the
        # disk is failing, not that a counter looks odd.
        #
        # No `for` beyond a scrape or two. Every other rule here waits because
        # the condition might be transient; this one is a latch the drive sets
        # and does not clear.
        expr: homelab_smart_healthy == 0
        for: 5m
        labels:
          component: host
          severity: critical
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: SMART says {{ $labels.device }} is failing"
          description: >-
            The drive's own overall self-assessment has failed on
            {{ $labels.model }}. This is the firmware's verdict, not a derived
            one. Replace it; `smartctl -a {{ $labels.device }}` on the host has
            the attribute that tripped.

      - alert: SmartDriveSpareLow
        # NVMe keeps spare blocks to remap failures into, and publishes its OWN
        # threshold for when that reserve is too small. Comparing against that
        # rather than a number chosen here is the whole point — the drive knows
        # what its reserve was sized for.
        expr: >-
          homelab_smart_available_spare_percent
          < on(host, device) homelab_smart_available_spare_threshold_percent
        for: 15m
        labels:
          component: host
          severity: critical
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.device }} spare capacity below the drive's own threshold"
          description: >-
            Remaining spare is {{ $value }}%, under the threshold the drive
            itself publishes. The drive is remapping faster than its reserve
            allows and is near the end of its usable life. Plan a replacement.

      - alert: SmartDriveWearHigh
        # Endurance consumed, as the vendor estimates it. 80 rather than 100
        # because the useful action is ordering a disk, and 100 means the rated
        # write life is already gone. Not critical: a drive past its rated
        # endurance usually keeps working, it just stops being trustworthy.
        expr: homelab_smart_percentage_used >= 80
        for: 1h
        labels:
          component: host
          severity: warning
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.device }} has used {{ $value }}% of its rated life"
          description: >-
            The vendor's endurance estimate for {{ $labels.model }}. At 100 the
            rated write life is used; the drive will usually keep going and
            should stop being trusted with anything not backed up. Order a
            replacement rather than reacting.

      - alert: SmartDriveBadSectors
        # Any non-zero value here is data the drive could not read back. Both
        # families are covered: reallocated and pending sectors are the ATA
        # spelling, media errors the NVMe one.
        #
        # ABOVE THE RECORDED COUNT, NOT `> 0`, for the reallocated family. A
        # remapped sector never un-remaps, so the count only ever grows and the
        # first one is the finding — that is how oracle's 32 were found (#351).
        # But once a count has been looked at it is a fact about the drive, not
        # an event, and a rule that pages on it for ever says nothing new. Until
        # 2026-09-20 the answer was an Alertmanager silence, and a silence
        # matches labels, not values, expires on a date nobody keeps, and lives
        # outside git (#572). The record is scripts/render-smart-baselines.sh:
        # one row per drive already judged, rendered on the monitoring host as
        # homelab_smart_reallocated_sectors_baseline. This rule means "more
        # than the number we wrote down"; SmartDriveBadSectorsGrowing below
        # means "moving now", and never reads the baseline.
        #
        # THE SECOND CLAUSE IS THE DEFAULT OF ZERO. A drive with no row has no
        # baseline series, and a comparison with nothing to match against
        # returns nothing — without it a new disk would be uncovered. `unless`
        # selects exactly the drives with no row and holds them to `> 0`, which
        # is what this rule always did. The same shape makes a mistake loud: a
        # row naming the wrong host or device matches nothing, so the drive
        # falls back to `> 0` and pages. A baseline cannot hide growth, because
        # it is a ceiling and growth is above it.
        #
        # `group_left()` on the join, or `instance` and `job` are silently
        # dropped from the alert — measured in backup.rules.yaml, not assumed.
        #
        # Reallocated only. Pending sectors are transient by definition, and no
        # drive here has a static uncorrectable or media-error count to record;
        # the day one does, it gets a baseline of its own kind, not a silence.
        expr: >-
          (
            homelab_smart_reallocated_sectors
              > on(host, device) group_left() homelab_smart_reallocated_sectors_baseline
          )
          or (
            homelab_smart_reallocated_sectors
              unless on(host, device) homelab_smart_reallocated_sectors_baseline
          ) > 0
          or homelab_smart_pending_sectors > 0
          or homelab_smart_uncorrectable_sectors > 0
          or homelab_smart_media_errors_total > 0
        for: 30m
        labels:
          component: host
          severity: warning
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: {{ $labels.device }} has unreadable sectors"
          description: >-
            {{ $value }} sector(s) or media error(s) the drive could not read
            back — above the count recorded for this drive in
            scripts/render-smart-baselines.sh, or on a drive with no count
            recorded. Look at it: if the number is static and the drive's own
            assessment passes, record it there and this goes quiet; if it is
            rising, SmartDriveBadSectorsGrowing will say so and the answer is a
            disk. Check backups first.

      # --- ZFS pool state, for the one host whose disks ARE a pool (#558) ---
      #
      # node_exporter's zfs collector reads /proc/spl/kstat/zfs/<pool>/state
      # and exports one 0/1 series per pool per state:
      # node_zfs_zpool_state{zpool="erebor",state="online|degraded|faulted|
      # offline|removed|suspended|unavail"}. smaug exported it from the day the
      # scrape went live (2026-09-19, #522) and nothing read it: the SMART
      # family above is homelab_smart_*, which did not reach smaug until
      # ADR-0047 (#483) put a textfile under the scrape, and every other disk
      # rule in this file is per-filesystem. Pool state and per-device SMART
      # are different questions, and the incident below is the proof: SMART
      # saw 850 pending sectors on a disk the pool still called ONLINE.
      #
      # WHAT THE FIRST INCIDENT LOOKED LIKE, and why this rule did not see it.
      # 2026-09-19 20:55 PDT, TrueNAS: "Pool erebor state is ONLINE: One or
      # more devices are faulted in response to persistent errors ... Disk
      # ST18000NM003D-3DL103 ZVTBSDL3 is FAULTED" — one day after the drive
      # arrived, an hour after its extended self-test completed clean. Nine
      # minutes EARLIER, at 20:46, up{instance="smaug"} went to 0 and stayed
      # there: TCP 9100 still accepted, GET /metrics never returned — a
      # collector blocked behind the faulted device. So InstanceDown, firing
      # from 20:50, was the page, and this series stopped being written before
      # the pool state had anything to say. This rule catches only the case
      # where the exporter SURVIVES the fault, and for a collector that reads
      # kstats through the failing disk that may be the exception rather than
      # the rule. InstanceDown inhibits it on the same instance
      # (alertmanager.yaml), which is the right order: when the exporter is
      # dead, InstanceDown is the signal, and the runbook's first step is at
      # the console either way.
      #
      # AND THE RESOLUTION IT HAS. Read at the console on 2026-09-19 23:19
      # PDT with the exporter restarted: `zpool status` printed the pool
      # ONLINE, mirror-0 ONLINE and one leaf FAULTED (3 read, 99 write
      # errors), and this kstat read online=1 for erebor. The kstat is the
      # POOL state, and a two-disk mirror with one faulted leaf is, to the
      # pool, online. So this rule cannot see the fault that produced it; it
      # sees a pool that is degraded, suspended or unavailable as a whole —
      # a resilver in progress, or the second disk gone. A per-vdev signal
      # is #558's open line, and until it exists a one-disk mirror pages
      # nothing here once the exporter is back.
      #
      # `state!="online"` == 1 rather than `state="online"` == 0, so the label
      # carries WHICH state the pool is in and a state name the collector
      # learns later is caught without editing this line. boot-pool is covered
      # by the same selector. A resilver after a replacement holds the pool at
      # degraded for its whole duration; the alert firing throughout is the
      # intended reading, not noise — the runbook says so where it happens.
      #
      # for: 5m is five scrapes at the node job's 60s. Critical, on the
      # hardware route: a two-disk mirror with a device out has no redundancy
      # left, and erebor/apps is the dataset ADR-0008 calls irreplaceable.
      - alert: ZpoolNotOnline
        expr: node_zfs_zpool_state{state!="online"} == 1
        for: 5m
        labels:
          component: host
          severity: critical
          category: hardware
        annotations:
          summary: "{{ $labels.instance }}: zpool {{ $labels.zpool }} is {{ $labels.state }}"
          description: >-
            The pool's own state, read from its kstat, has not been online for
            five minutes. On a two-disk mirror that is one disk carrying
            everything, the replaceable library and the irreplaceable Jellyfin
            state alike. `zpool status -v {{ $labels.zpool }}` at the console
            names the device; docs/runbooks/replace-the-nas-disk.md is the
            order to do things in, and copying erebor/apps off comes before
            touching a tray.

      - alert: SystemUpdateAvailable
        # A pfSense system upgrade has been available for a week (#378).
        #
        # THE HOST WHERE THIS MATTERS MOST, and the last one to get any patch
        # visibility at all. docs/security.md names "a vulnerability in pfSense
        # itself" as an accepted, undefended threat — a position that is
        # reasonable held deliberately and much weaker when nobody knows how far
        # behind the firewall is. `morpheus` terminates every VLAN, runs
        # Suricata, and serves DNS and NTP.
        #
        # SYSTEM, NOT PACKAGES. homelab_pkg_upgrades_pending counts everything
        # behind the repository and is deliberately NOT alerted on: pfSense
        # add-ons drift routinely — `pfSense-repoc` republishes every few weeks —
        # so a rule on that count would fire permanently and be ignored, which is
        # the failure mode this repository keeps writing down. The system
        # meta-packages are the thing an operator actually acts on, and pfSense
        # is upgraded as a unit rather than package by package.
        #
        # 7d, not immediately, for the reason RebootRequired uses 3d: applying
        # this takes the whole estate off the network while the firewall
        # restarts, so it is a window somebody picks. A week means nobody has
        # picked one.
        expr: homelab_pkg_system_update_available == 1
        for: 7d
        labels:
          component: host
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }} has had a system update available for a week"
          description: >-
            A pfSense system package is behind the repository. Applying it
            restarts the firewall and takes the estate off the network, so pick a
            window rather than reacting. `pfSense-upgrade -c` on the host
            confirms it independently, and homelab_pkg_upgrades_pending shows how
            many packages in total are behind.

      # --- Hypervisor guests, the half of #257 that can cross ----------------
      #
      # ADR-0028 decides that a guest's RUN STATE is hypervisor state rather
      # than the guest telemetry ADR-0007 keeps in the lab. These two rules are
      # what that buys, and neither of them can see inside a guest.

      - alert: HypervisorGuestStopped
        # A guest the hypervisor knows about is not running.
        #
        # WARNING AND AN HOUR, because the estate genuinely cannot tell a
        # deliberate shutdown from a crash and should not pretend to. #257
        # allows for "a machine that is powered off between sessions", which is
        # exactly this signal with a different cause. An hour is long enough
        # that a reboot or a snapshot restore does not page, and short enough
        # that a lab guest which fell over during an exercise is noticed the
        # same afternoon.
        #
        # The alternative — a table of which guests are expected to be up —
        # was rejected: it is a second copy of a fact that changes whenever a
        # VM is created, and this repository has enough of those.
        expr: homelab_guest_running == 0
        for: 1h
        labels:
          component: host
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.host }}: guest {{ $labels.guest }} has been stopped for an hour"
          description: >-
            The hypervisor reports this guest as not running. If it was powered
            off deliberately this is expected and there is nothing to do — the
            estate cannot tell the difference, and says so rather than implying
            it can. If it was not, the guest is down and anything inside it,
            including the lab stack on `alexander`, is down with it.

      - alert: GuestStateStopped
        # The collector itself stopped reporting. Without this, a hypervisor
        # whose collector died looks exactly like one with no guests — and
        # "no guests" is a legitimate answer, which is what makes the silence
        # dangerous. Same shape and same reasoning as PatchStateStopped.
        #
        # Stopped, not missing: a hypervisor that never had the collector
        # installed must stay quiet, or every host without it alerts forever.
        expr: >-
          count by (host) (present_over_time(homelab_guests_total[1d] offset 6h))
          unless
          count by (host) (present_over_time(homelab_guests_total[6h]))
        for: 30m
        labels:
          component: host
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.host }} has stopped reporting its guests"
          description: >-
            It reported within the last day and has not in six hours, so
            HypervisorGuestStopped is blind to this hypervisor until it comes
            back. Check homelab-guest-state.timer on the host and that
            /var/lib/node_exporter/textfile_collector/guest-state.prom is being
            written and is world-readable.

      - alert: SmartDriveBadSectorsGrowing
        # The signal SmartDriveBadSectors cannot give you, and the one worth
        # acting on.
        #
        # WHY IT IS A SEPARATE RULE RATHER THAN A BETTER THRESHOLD. Its sibling
        # holds a drive to the count already recorded for it, or to zero, and
        # goes quiet once a static count is written down (#572). Right for a
        # fact, wrong for a trend: a baseline is a ceiling, and a drive gaining
        # a sector a week sits under it for a long while before it is over.
        # Before the baseline existed the static fact was held down by an
        # Alertmanager silence, and a silence matches LABELS, not values:
        # silencing 32 reallocated sectors on oracle silenced 90 just as
        # effectively, because no label carries the count. The static fact and
        # the trend need different alertnames or the trend cannot survive
        # whatever quiets the fact. That happened on 2026-09-07 (#351).
        #
        # SUBTRACTION, NOT increase(). These are gauges, and increase() assumes
        # counter semantics — it extrapolates and handles resets, neither of
        # which is right here. The value is served continuously by the textfile
        # collector rather than sampled daily, so comparing a point against the
        # same point a week earlier is exact and needs no estimation.
        #
        # All four spellings, because a drive fails in whichever one its firmware
        # uses: reallocated and pending are the ATA vocabulary, media errors the
        # NVMe one, and uncorrectable is the sector that could not be recovered
        # at all.
        expr: >-
          (homelab_smart_reallocated_sectors - homelab_smart_reallocated_sectors offset 7d) > 0
          or (homelab_smart_pending_sectors - homelab_smart_pending_sectors offset 7d) > 0
          or (homelab_smart_uncorrectable_sectors - homelab_smart_uncorrectable_sectors offset 7d) > 0
          or (homelab_smart_media_errors_total - homelab_smart_media_errors_total offset 7d) > 0
        for: 1h
        labels:
          component: host
          severity: warning
          category: hardware
        annotations:
          summary: >-
            {{ $labels.host }}: {{ $labels.device }} has gained
            {{ $value }} bad sector(s) in seven days
          description: >-
            The count is rising, which is the difference between a drive that
            failed once and a drive that is failing now. A static count is a
            fact and is recorded in scripts/render-smart-baselines.sh; this is
            not that. Replace the disk rather than waiting for the drive's own
            assessment to fail —
            SmartDriveUnhealthy is the firmware conceding, and it concedes late.
            Check backups first.

      - alert: SmartStateStale
        # The SMART collector has stopped rewriting its file, on any host.
        #
        # A TIMESTAMP RATHER THAN PRESENCE, for DriftCheckStopped's reason: the
        # .prom persists and node_exporter re-serves it on every scrape, so
        # every homelab_smart_* series stays present and every number in it
        # stays plausible when the collector dies. The file's mtime is the one
        # thing that stops moving, and node_exporter exports it per file as
        # node_textfile_mtime_seconds — Alloy's embedded exporter on the pushed
        # hosts, the container on smaug. The script renders to a temp file and
        # mv's it into place, so the mtime is the render time and not a touch.
        #
        # WHY IT EXISTS NOW (#483, ADR-0047). Every other collector is a systemd
        # timer, with ScheduledJobStale or a failed unit to say so. smaug's is a
        # cron job in TrueNAS's UI: no homelab_job_*, nothing on the monitoring
        # host that knows it should run, and a config restore that drops the
        # job would leave the file serving the day-of-restore numbers forever.
        # Two days against a daily schedule — twice the period, the estate's
        # rule for every other threshold — so one missed run is tolerated and
        # two are not.
        #
        # ONE FILENAME PATTERN, NO HOST LIST. The collector writes
        # smart-state-<host>.prom everywhere, so this covers the monitoring
        # host's two files, oracle's the day it collects, and smaug's, without
        # naming any of them — and says nothing about a host that has never
        # collected, which is a gap tracked elsewhere and not a fault. Keyed on
        # `instance`, not `host`: the mtime series is the exporter's, not the
        # script's, and carries no host label. The leading `.*` is because the
        # label may be a bare name or a full path depending on the exporter.
        expr: >-
          time() - node_textfile_mtime_seconds{file=~".*smart-state-.*\\.prom"} > 2 * 86400
        for: 30m
        labels:
          component: host
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.instance }} has not rewritten {{ $labels.file }} in two days"
          description: >-
            The SMART textfile is {{ $value | humanizeDuration }} old and
            node_exporter re-serves its last contents on every scrape, so every
            homelab_smart_* series from it is present, plausible and stale —
            SmartDriveBadSectors and its siblings are blind to this host until
            it is rewritten. On smaug the writer is a cron job in TrueNAS's UI
            (System → Advanced Settings → Cron Jobs; build-the-nas.md §6.4);
            on an Alloy host it is homelab-smart-state.timer or, for morpheus,
            homelab-smart-state-remote.timer on the monitoring host. Check the
            job still exists and that its last run wrote the file.

      # --- Laptop batteries, the mains-cut path nobody was watching (#454) ---
      #
      # prometheus and oracle are laptops on a shelf. fit-the-ups-battery.md
      # states the design: on a mains cut they stay RUNNING on their own cells
      # and go deaf, and #93/#110 fixed the deaf half by putting their switch on
      # the UPS. The running half rested on two thirteen-year-old cells that
      # nothing measured and no document named as a dependency. A dead cell
      # turns "the monitoring host survives the event it exists to observe"
      # back into "it dies with it", silently — the UPS card fabricating a
      # healthy pack, one shelf over.
      #
      # NO COLLECTOR. #454 proposed a textfile collector for
      # /sys/class/power_supply; it is not needed, because Alloy's
      # prometheus.exporter.unix already exports node_power_supply_* from both
      # hosts, and has all along. Read on 2026-09-12: prometheus BAT0 108
      # cycles, charge_full 6.196 Ah of 6.6 Ah design (94 %); oracle BAT0
      # 2.021 Ah of 2.8 Ah (72 %), cycle count reported as 0 by that firmware.
      # The attribute family is charge_* on both — the issue wrote energy_*,
      # and a collector written to that text would have emitted nothing. The
      # `or` in HostBatteryHealthLow keeps the energy_* spelling for a future
      # machine whose driver reports watt-hours instead.
      #
      # SIX ALERTS AND ONE RECORDING RULE, FIVE QUESTIONS. Is the shelf on
      # mains right now; is the cell still worth relying on; is there a cell at
      # all; is the cell hot; and how long does the host have left on it. Only
      # "is there a cell" needs to know which hosts are laptops, and that list
      # lives in its expression and nowhere else. The sixth alert,
      # HostBatteryTempNotMeasured, asks whether the fourth question can be
      # answered at all — on 2026-09-19 it cannot, on either host; see below.
      #
      # PROMETHEUS'S CELL WAS REPLACED ON 2026-09-18 (#454). The figures above
      # are the pack that came out, and they stay: they are what these rules
      # were written against. The A1437 fitted in its place reads charge_full
      # 6.889 Ah of 6.8 Ah design (101 %) at cyclecount 1.
      #
      # BOTH DESIGN FIGURES MOVED: charge_full_design 6.6 -> 6.8 Ah and
      # voltage_min_design 11.21 -> 11.4 V. An aftermarket pack reports its own
      # design numbers, and on this machine that is the only proof the part
      # changed at all — it exports no serial, and manufacturer and model_name
      # came back identical, SMP and bq20z451. Nothing in these expressions
      # depends on either figure: HostBatteryHealthLow reads the RATIO, so a
      # design figure that moves is absorbed rather than breaking the rule.
      #
      # oracle's cell is unchanged and still firing; its replacement was bought
      # on 2026-09-19 and is in transit (#531).
      # docs/runbooks/replace-the-laptop-cell.md has the fit and the mains pull
      # that closed #454 on 2026-09-19: HostOnBattery pending at the first
      # offline sample, firing 2m32s after the plug, resolved a minute after it
      # went back; 2.72 Ah/h drawn, about 2.5 h from full. One measurement.
      #
      # THE SWAP ALSO CLEARED THE RTC, and the stack came back writing samples
      # three hours in the past. HostClockUnsynchronised above is the rule
      # that reads the field which carried that event (#519).
      #
      # CELL TEMPERATURE, READ ON 2026-09-19 (#532). Neither laptop measures
      # it. oracle's BAT0 has never exported node_power_supply_temp_celsius —
      # the Dell's driver exposes no temp attribute, and its dell_smm hwmon
      # carries CPU, GPU and Ambient only. prometheus's did: the cell that came
      # out ran 32.7–39.2 °C over its last 24 h and never above 40.3 °C in
      # thirty days of retention, changing 99 times in 26 h. The A1437 fitted
      # on 2026-09-18 has reported 25.5 °C on every one of its 1,560 samples
      # since — zero changes — and the Apple SMC's own battery thermistors
      # (hwmon TB0T/TB1T/TB2T) froze at the same moment, because the SMC reads
      # them from the pack. There is no independent sensor to fall back on.
      # HostBatteryHot is written anyway, at 45 °C for five minutes: it costs
      # nothing, and it goes live the day a pack that measures is fitted.
      # HostBatteryTempNotMeasured says, per host, that today is not that day.
      # It is `info` on purpose — true on both hosts for as long as these packs
      # are in, and a warning would be two twelve-hour nags forever on the
      # channel whose ntfy budget the heartbeat already spends (#407). Until
      # it resolves, the trackpad inspection in replace-the-laptop-cell.md §3
      # is the only hot-cell detection there is.
      #
      # RUNTIME ON BATTERY: A RULE, NOT THE ANNUAL FIGURE. #532 allowed either.
      # Step 8 of the runbook measures runtime once, at one load, on one day;
      # homelab_battery_runtime_seconds computes it on every cut from the
      # pack's own instantaneous draw, and HostBatteryRuntimeLow pages when it
      # falls under thirty minutes — the last page before the estate goes
      # blind. node_power_supply_current_ampere rather than deriv() of
      # charge_ampere: the draw is non-zero from the first sample after mains
      # drops (1.35 A on prometheus, 0.44 A on oracle, 2026-09-08), where a
      # ten-minute derivative of a three-decimal gauge is ten minutes late and
      # steppy. The draw is also non-zero while CHARGING (1.68 A and 0.97 A on
      # the same day), which is why the recording rule is gated on the same
      # online=0/type="Mains" join HostOnBattery uses rather than on the sign
      # of anything. "Would notice it halving" is the recorded series read
      # over months, and the capacity half of halving is HostBatteryHealthLow.

      - alert: HostOnBattery
        # The mains adapter reports online=0, joined to the info series so that
        # only a supply of type Mains can fire — the adapter is ADP1 on the
        # MacBook and AC on the Dell, and the name is not worth matching on.
        # Two minutes filters a brick being reseated.
        #
        # On a real cut this fires beside UpsOnBattery, and both are right: the
        # rack and the shelf lost power together. It keeps firing after the UPS
        # is back if a laptop's brick has failed, which is otherwise reported
        # hours later as InstanceDown with no cause attached.
        expr: >-
          node_power_supply_online == 0
          and on (instance, power_supply)
          node_power_supply_info{type="Mains"}
        for: 2m
        labels:
          component: host
          severity: critical
          category: power
        annotations:
          summary: "{{ $labels.instance }} is running on its own battery"
          description: >-
            The mains adapter ({{ $labels.power_supply }}) reports no input.
            Either the shelf has lost power — check UpsOnBattery, and the
            TP-Link the laptops hang off — or this host's brick has failed.
            node_power_supply_capacity says how much runtime is left; the
            monitoring host going dark is the estate going blind.

      - alert: HostBatteryHealthLow
        # ACPI exposes no verdict for a battery the way SMART does for a disk,
        # so this is the firmware's own measured full capacity against its own
        # design figure — the same two numbers Apple's "Service Recommended"
        # reads, and 80 % is where it draws the line. Warning, an hour, the
        # hardware route: the action is ordering a cell, not waking anyone.
        #
        # oracle reads 72 % and fires the day this lands. That is the finding,
        # not a fault in the rule: #454 ranked prometheus first on age alone,
        # and the measurement puts oracle's cell in worse shape. It stays
        # firing until the cell is replaced, and a silence on it is fine.
        expr: >-
          (
            node_power_supply_charge_full / node_power_supply_charge_full_design
            or
            node_power_supply_energy_full / node_power_supply_energy_full_design
          ) < 0.8
        for: 1h
        labels:
          component: host
          severity: warning
          category: hardware
        annotations:
          summary: >-
            {{ $labels.instance }}: {{ $labels.power_supply }} holds
            {{ $value | humanizePercentage }} of its design capacity
          description: >-
            The cell's full charge as its firmware measures it, against the
            capacity it was built with. Below 80 % the runtime on a mains cut
            is a guess, and a cell this far into its life is also the one that
            swells. Order the replacement —
            docs/runbooks/replace-the-laptop-cell.md says what to check before
            and after the swap.

      - alert: HostBatteryNotReported
        # A laptop that should have a battery and reports none: the cell was
        # pulled, the kernel stopped seeing it, or the collector is gone. The
        # `up` on the left is what keeps this quiet for a host that is simply
        # down — that is InstanceDown's job — and the job regex is the one
        # place the fact "these two hosts are laptops" is written. A present=0
        # series fails the `== 1` and fires here too, on purpose.
        expr: >-
          up{job=~"(prometheus|oracle)-metrics"} == 1
          unless on (instance)
          node_power_supply_present{power_supply=~"BAT.*"} == 1
        for: 15m
        labels:
          component: host
          severity: warning
          category: hardware
        annotations:
          summary: "{{ $labels.instance }} reports no battery"
          description: >-
            This host is a laptop and its mains-cut survival depends on a cell
            the kernel no longer reports. HostOnBattery and HostBatteryHealthLow
            are both blind to it until it comes back. Check
            /sys/class/power_supply/ on the host, and whether the cell was
            removed on purpose.

      - alert: HostBatteryHot
        # THE THRESHOLD IS MEASURED, NOT CHOSEN — against the pack that came
        # out, because the one fitted measures nothing (header). Its highest
        # reading in thirty days of retention was 40.3 °C, its 99.9th
        # percentile 39.6, the runbook's 24 h band 32.7–39.2. 45 °C is 4.7 °C
        # above anything that cell ever produced, and it is the charge
        # temperature ceiling lithium-ion datasheets put on a pack: a cell
        # above it on a shelf, idling on mains, is outside its own envelope.
        # Five minutes and not one sample, per the runbook — a single reading
        # proves nothing; five consecutive ones at Alloy's 60 s push do.
        #
        # Critical, the hardware route: a hot cell in an occupied room is the
        # one alert in this section that should wake someone. Not `power` —
        # that route is for the mains being out. No host selector: only a host
        # with a cell has the series, and the list of laptops stays written
        # once, in HostBatteryNotReported.
        expr: node_power_supply_temp_celsius > 45
        for: 5m
        labels:
          component: host
          severity: critical
          category: hardware
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.power_supply }} reads {{ $value }} °C"
          description: >-
            The cell's own gauge has read above 45 °C for five minutes. The
            pack this threshold was measured against never read above 40.3 °C
            idling on a shelf. Treat the machine as a hazard: unplug it, do not
            leave it unattended, and read
            docs/runbooks/replace-the-laptop-cell.md §3 before touching it.

      - alert: HostBatteryTempNotMeasured
        # A cell that is present and whose temperature either does not exist
        # as a series (oracle) or has not changed in 24 hours (the A1437 in
        # prometheus, 25.5 °C on every sample since it was fitted). A real
        # thermistor on an idle laptop still jitters by a tenth of a degree
        # many times a day — the old cell changed 99 times in 26 h — so zero
        # changes in a day is a gauge returning a constant, not a quiet room.
        # It fires for both hosts the day it lands, and that is the finding:
        # HostBatteryHot is blind until this resolves, which it does by itself
        # the first day a pack reports a moving figure. `info`, for the reason
        # in the header: recorded, never notified.
        expr: >-
          node_power_supply_present{power_supply=~"BAT.*"} == 1
          unless on (instance, power_supply)
          changes(node_power_supply_temp_celsius[24h]) > 0
        for: 1h
        labels:
          component: host
          severity: info
          category: hardware
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.power_supply }} reports no moving temperature"
          description: >-
            The cell is present but its temperature is either not exported or
            has not changed in 24 hours, so HostBatteryHot cannot fire for it.
            Nothing to do on the host: the pack's gauge is what it is. Until
            this resolves, the inspection in
            docs/runbooks/replace-the-laptop-cell.md §3 is the only check on a
            hot cell here.

      - record: homelab_battery_runtime_seconds
        # Seconds the host has left on its cell at the draw it is presenting
        # right now, and only while it is on that cell. charge_ampere is what
        # the kernel calls charge_now, in Ah; current_ampere is the pack's
        # instantaneous draw in A. The `> 0` on the divisor drops the sample
        # instead of recording +Inf for the first scrape after the plug is
        # pulled, when the draw still reads 0. The `or` branch keeps the
        # watt-hour spelling for a future driver, as HostBatteryHealthLow does.
        # The gate is HostOnBattery's own join, not the ALERTS series: ALERTS
        # lags by that rule's `for`, and the same expression in the same group
        # is the honest "while on battery".
        expr: >-
          (
            node_power_supply_charge_ampere / (node_power_supply_current_ampere > 0)
            or
            node_power_supply_energy_watthour / (node_power_supply_power_watt > 0)
          ) * 3600
          and on (instance)
          (
            node_power_supply_online == 0
            and on (instance, power_supply)
            node_power_supply_info{type="Mains"}
          )

      - alert: HostBatteryRuntimeLow
        # Thirty minutes: the last page before the estate goes blind, with time
        # to act on it — a clean shutdown, or a generator lead. Both cells
        # project four hours and more from full at the loads measured on
        # 2026-09-08 (6.2 Ah at 1.35 A on prometheus, 1.9 Ah at 0.44 A on
        # oracle), so a healthy pack never gets here and the runbook's bounded
        # 50 % test does not either. Critical on the power route beside
        # HostOnBattery, which is already firing by the time this can.
        expr: homelab_battery_runtime_seconds < 30 * 60
        for: 5m
        labels:
          component: host
          severity: critical
          category: power
        annotations:
          summary: "{{ $labels.instance }} has {{ $value | humanizeDuration }} of battery left"
          description: >-
            The host is on its own cell and, at the draw it is presenting now,
            has under thirty minutes before it dies with the cut it is supposed
            to outlast. If this is prometheus, that is the monitoring host:
            shut it down cleanly rather than letting the cell decide.
            HostOnBattery says why the mains is out.
