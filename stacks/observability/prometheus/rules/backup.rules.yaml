---
# Whether the scheduled maintenance jobs are actually running.
#
# Five commands in this repository used to be things someone had to remember,
# and nothing ran any of them — `backups/` did not even exist on the host, so
# `make backup` had never been run at all (#77). systemd timers now run four of
# them and scripts/run-scheduled.sh records the outcome of every run, scheduled
# or human, as four gauges in a textfile the node exporter scrapes.
#
# THE POINT IS THE ABSENCE, NOT THE FAILURE
#
# A job that fails is loud: it exits non-zero and systemd says so. A job that
# stops being run is silent, and silence is also what a healthy week looks like.
# That is the same inversion watchdog.rules.yaml is built on, and the same one
# security.rules.yaml explains at length when it says absence of alerts is
# indistinguishable from absence of the service. So the rules below are mostly
# not about failure at all — they are about a proof that has gone stale.
#
# WHY THE THRESHOLDS ARE A SERIES AND NOT LITERALS
#
# homelab_job_max_age_seconds is written by scripts/install-timers.sh from the
# JOBS table that also decides the cadence, so a threshold and a schedule cannot
# drift apart. It also means NO RULE HERE NAMES A JOB: adding a timer is a row in
# that table, not an edit to this file. That is deliberate — a rule file listing
# job names is a list that silently stops growing. The four rules at the bottom
# are the one exception, and they name the three jobs that are not timers: the
# human proofs — verify-key-backup, whose deadline is applied per age
# recipient, verify-ca-key-backup, whose deadline is applied to the CA key's
# current fingerprint (#496), and offsite-copy, the newest set of each kind
# carried onto the second recipient's medium on the same visit (ADR-0048).
#
# That claim has since been tested rather than merely asserted. #99 added
# `converge`, an hourly job on a different cadence to everything above, and
# every rule in this file covered it with no edit at all. What #99 DID need was
# a separate file — prometheus/rules/deploy.rules.yaml — because the rules here
# describe whether a job RAN, and deployment also has results worth alerting on:
# which refusal, and how far behind the host is.
#
# WHY THERE IS NO absent()
#
# absent() only synthesises labels from a selector's equality matchers, so
# "declared but never ran" would need one rule per job with the name hardcoded —
# exactly the list this file is avoiding — and it reacts to a single missed
# scrape. `unless on(homelab_job)` against the declaration series says the same
# thing generically. absent_over_time appears once, in ScheduledJobMetricsAbsent,
# for the one question that genuinely has no series to join against. Even the
# per-recipient file being missing (#400) is asked as an `unless` against the
# verify-key-backup declaration row rather than as an absent().
groups:
  - name: backup
    interval: 60s
    rules:
      - alert: ScheduledJobStale
        # A proof that has gone stale. Covers a job that stopped being run, and
        # eventually a job that keeps failing too — run-scheduled.sh carries the
        # last SUCCESS forward across a failure rather than clobbering it, so a
        # job failing every night ages out of its threshold on schedule.
        #
        # Expressed as a comparison against the stored threshold rather than as
        # a long `for:`, for the reason UpsBatteryUnproven states in
        # ups.rules.yaml: a long `for` measures continuous pending time in
        # Prometheus's own memory, so any restart inside the window resets it.
        # That reasoning is sharper here than anywhere else in this repository,
        # because one of the jobs being measured is the one that STOPS
        # Prometheus. An alert with `for: 14d` on a backup that quiesces the
        # stack every Sunday would never once reach 14 days pending.
        #
        # `on(homelab_job) group_left()` rather than a bare `>`. The join is
        # needed because the threshold is a separate series; group_left() is
        # needed because WITHOUT it the result carries only the labels named in
        # on(), and `instance` is silently dropped. Measured, not assumed — the
        # unit test asserted instance and promtool returned an alert without it.
        # A second monitored host would then be indistinguishable from the
        # first, and the two would collide into one alert.
        #
        # verify-key-backup is excluded because SecretsKeyBackupUnproven says
        # something different about it and earns its own description,
        # verify-ca-key-backup for the same reason — CaKeyBackupUnproven —
        # and offsite-copy for OffsiteCopyStale. All three are human runs
        # against a mounted medium: "check the journal" would be wrong advice
        # for any of them.
        expr: |
          (time() - homelab_job_last_success_timestamp_seconds{
              homelab_job!~"verify-key-backup|verify-ca-key-backup|offsite-copy"})
            > on(homelab_job) group_left() homelab_job_max_age_seconds
        for: 30m
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.homelab_job }} has not succeeded in {{ $value | humanizeDuration }}"
          description: >-
            The timer has stopped running this, or every run since has failed.
            Check `systemctl list-timers 'homelab-*'` and
            `journalctl -u homelab-{{ $labels.homelab_job }}.service` on the
            monitoring host — docs/runbooks/schedule-maintenance.md.

      - alert: ScheduledJobFailed
        # Separate from staleness so a failure is visible within the hour rather
        # than after the threshold expires. A backup failing every night for
        # thirteen days should not look healthy for thirteen days.
        #
        # 75 is EX_TEMPFAIL, which run-scheduled.sh uses for "could not acquire
        # the lock in time" — the job never started rather than ran and failed.
        expr: homelab_job_last_exit_code != 0
        for: 10m
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.homelab_job }} exited {{ $value }}"
          description: >-
            The last run failed. `journalctl -u homelab-{{ $labels.homelab_job }}.service -n 100`
            has the output. Exit 75 means it never started because another job
            held its lock — docs/runbooks/schedule-maintenance.md.

      - alert: ScheduledJobNeverRan
        # Declared in the JOBS table, with no success series to go with it: the
        # job has never run, or its .prom file was deleted.
        #
        # This is also the state verify-key-backup starts in and stays in until
        # someone actually verifies the key backup for the first time, which is
        # the honest reading — before that first run, nothing has proven the
        # secrets are recoverable from anywhere but this host.
        expr: |
          homelab_job_max_age_seconds
            unless on(homelab_job) homelab_job_last_success_timestamp_seconds
        for: 1h
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "{{ $labels.homelab_job }} is scheduled but has never recorded a run"
          description: >-
            scripts/install-timers.sh declared this job and nothing has ever
            reported a result for it. Either the timer was never enabled, or its
            .prom file was removed from the textfile directory —
            docs/runbooks/schedule-maintenance.md.

      - alert: ScheduledJobMetricsAbsent
        # The measuring apparatus itself. Every rule above reads the textfile
        # directory, INCLUDING the declaration series ScheduledJobNeverRan joins
        # against — so if that directory is wiped, the collector errors, or
        # Alloy stops scraping, all three go quiet together and the schedule
        # looks perfect. This is the one unconditional statement, and it is here
        # for the same reason watchdog.rules.yaml exists at all.
        #
        # absent_over_time, not absent: a six-hour window survives a Prometheus
        # restart and a single missed scrape, where absent() fires on both.
        # loki/rules/security.rules.yaml already uses absent_over_time for this
        # exact shape in FirewallLogsStopped.
        #
        # It fires with NO labels, which is accepted rather than worked around:
        # there is one such series and the summary names it. Worth checking
        # against the trap watchdog.rules.yaml documents — the second inhibit
        # rule matches severity =~ "warning|critical" with equal: ["instance"],
        # and Alertmanager treats absent == absent as equal, so a label-less
        # warning could in principle be silenced by InstanceDown. It cannot be
        # here: every InstanceDown carries a scrape-target instance
        # (localhost:9090, alloy:12345, a device IP), and present-vs-absent is
        # never equal.
        expr: absent_over_time(homelab_job_max_age_seconds[6h])
        for: 1h
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "No scheduled-job metrics have reached Prometheus for six hours"
          description: >-
            Nothing else in this file can fire while this is true. Check
            node_textfile_scrape_error and node_textfile_mtime_seconds, then
            /var/lib/node_exporter/textfile_collector on the monitoring host.
            node_textfile_scrape_error going to 1 costs only the file that failed
            to parse; this alert means the whole directory stopped arriving.
            docs/runbooks/schedule-maintenance.md.

      - alert: SecretsKeyBackupUnproven
        # The one job with no timer, and the sharpest edge in #77.
        #
        # verify-key-backup.sh refuses the live key by device:inode and refuses
        # a copy sitting inside a git tree, precisely so that what gets tested is
        # a real off-host copy. That means a human has to mount removable media,
        # and no timer can do it. What a timer CAN do is notice that nobody has.
        #
        # ONE SERIES PER RECIPIENT, and this is the only rule in the file that
        # is not keyed on homelab_job. ADR-0024 added a second age recipient, and
        # the moment there were two, homelab_job_last_success_timestamp_seconds
        # {homelab_job="verify-key-backup"} became a wrong answer: it is a single
        # series that run-scheduled.sh writes whichever key was mounted, so
        # proving one copy reset the ninety-day deadline for every copy and the
        # other could rot behind a green alert. scripts/key-recipients.sh emits
        # homelab_key_recipient_last_proof_timestamp_seconds per recipient, read
        # out of the encrypted file's own metadata, and this fires per recipient.
        #
        # The threshold still comes from the same declaration series as
        # everything else, so the ninety days lives in scripts/install-timers.sh
        # and nowhere else. It is joined on(instance) rather than on(homelab_job)
        # because the left side has no homelab_job label to join on — both series
        # are written into the same textfile directory on the same host.
        # group_left() for the reason ScheduledJobStale gives above: without it
        # the result carries only the labels named in on(), and `recipient` — the
        # entire point of this rule — would be silently dropped.
        #
        # A recipient that has never been verified is recorded as 0, not omitted,
        # so it fires here with an absurd duration rather than being invisible.
        #
        # That only holds once key-recipients.sh has written its file. This rule
        # used to claim ScheduledJobNeverRan covered the time before that, and it
        # does not: NeverRan looks for the JOB series, and a host that proved its
        # key before ADR-0024 has one — so the fallback was satisfied, this rule
        # had no left side, and the deadline went unwatched from the day it was
        # deployed (#400). SecretsKeyRecipientsUnrecorded, below, is the rule
        # for that state, and the recipient-state timer is what ends it.
        expr: |
          (time() - homelab_key_recipient_last_proof_timestamp_seconds)
            > on(instance) group_left() homelab_job_max_age_seconds{homelab_job="verify-key-backup"}
        for: 1h
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "No proven backup of age recipient {{ $labels.recipient }} in {{ $value | humanizeDuration }}"
          description: >-
            Nothing else here proves the {{ $labels.stack }} secrets are
            recoverable from anywhere but this host — every other job runs on the
            same machine, with the same key, against the same disk. Proving a
            DIFFERENT recipient does not clear this one. Get that copy out and
            run `make secrets-verify-backup KEY=<path>`:
            docs/runbooks/back-up-the-age-key.md.

      - alert: SecretsKeyRecipientsUnrecorded
        # The deadline is declared and nothing can be held to it. install-timers
        # writes the verify-key-backup threshold row; key-recipients.sh writes
        # the per-recipient series SecretsKeyBackupUnproven compares against it.
        # If the first exists and the second does not, the ninety-day nag has
        # no left side and is silent — which is exactly what #400 found: the
        # host had proved its key under the old single series, ADR-0024 moved
        # the rule onto a file nothing had yet written, and the fallback that
        # rule named was satisfied by the old proof.
        #
        # An `unless` against the declaration row and not absent(), for the
        # reason the header gives: absent() would have to invent the labels,
        # and this way the alert carries homelab_job and instance like every
        # other rule here. It is keyed on one job by name, which the header
        # also explains — verify-key-backup is the one job that is not a timer.
        #
        # Since #400 the recipient-state timer writes the file daily and the
        # installer primes it, so in steady state this cannot fire. It fires
        # for a host installed before that timer existed, for a file removed
        # from the textfile directory, and for a recipient-state job that has
        # never run — the last of which ScheduledJobNeverRan also names.
        expr: |
          homelab_job_max_age_seconds{homelab_job="verify-key-backup"}
            unless on(instance) homelab_key_recipient_last_proof_timestamp_seconds
        for: 1h
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "The age-key deadline is declared but no recipient has a proof series to hold to it"
          description: >-
            scripts/install-timers.sh declared the ninety-day deadline for
            verify-key-backup and nothing has written
            homelab_key_recipient_last_proof_timestamp_seconds, so
            SecretsKeyBackupUnproven has nothing to read and cannot fire however
            stale the proof is. `systemctl start homelab-recipient-state.service`
            writes it; if that unit does not exist, the timers predate #400 and
            `make install-timers` adds it. docs/runbooks/back-up-the-age-key.md.

      - alert: CaKeyBackupUnproven
        # The estate CA's private key, held to the same ninety days as the age
        # key (#496, ADR-0043 decision 4). verify-ca-key-backup.sh refuses the
        # live key by device:inode and a copy inside a git tree, so what gets
        # proved is a real offline copy, a human has to mount it, and no timer
        # can. What a timer CAN do is notice that nobody has.
        #
        # ONE SERIES PER KEY FINGERPRINT, for ADR-0024's reason one key over:
        # `make certs ARGS='--ca --force'` mints a new root, and a proof of the
        # old key must not vouch for the new one. scripts/ca-key-state.sh
        # writes homelab_ca_key_backup_last_proof_timestamp_seconds against the
        # SHA-256 of the current ca.pem's public key, drops the old
        # fingerprint's row on a re-mint, and records never-proved as 0 — so
        # a re-minted CA fires here the next morning with an absurd duration
        # rather than inheriting ninety days of green.
        #
        # Same join as SecretsKeyBackupUnproven, and for the same reasons:
        # on(instance) because the left side has no homelab_job label, and
        # group_left() so that `ca` and `spki_sha256` survive the join. The
        # threshold is the verify-ca-key-backup row in install-timers.sh.
        #
        # No `…Unrecorded` sibling. The age key needed one because its series
        # was invented after its proof (#400); the ca-key-state timer is born
        # with this series, gen-certs.sh writes it at the mint, and a host where
        # it has never been written is ScheduledJobNeverRan{homelab_job=
        # "ca-key-state"}. A deleted file heals on the next daily run.
        expr: |
          (time() - homelab_ca_key_backup_last_proof_timestamp_seconds)
            > on(instance) group_left() homelab_job_max_age_seconds{homelab_job="verify-ca-key-backup"}
        for: 1h
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "No proven backup of the {{ $labels.ca }} CA key in {{ $value | humanizeDuration }}"
          description: >-
            Nothing else here proves certificates/ca-key.pem exists anywhere but
            this host. Losing it is a re-mint and a re-trust on every device in
            generate-certificates.md's trust list, due the next time a leaf is
            needed. A re-minted CA starts here at never, on purpose. Get the
            offline copy out and run `make certs-verify-backup KEY=<path>`:
            docs/runbooks/back-up-the-ca-key.md.

      - alert: OffsiteCopyStale
        # The estate's three backup sets — the firewall export, the volume sets
        # and the NAS set — are off-host on oracle and offsite on the medium
        # that holds the second age recipient (ADR-0048). That medium visits
        # this host every ninety days to prove its key, and backup-offsite.sh
        # runs against it on the same visit: it re-verifies what the medium
        # already holds, copies the newest set of each kind, and hashes the
        # copy. It refuses a destination on this host's own filesystem, so a
        # recorded success means a real medium was mounted. No timer can do
        # that. What a timer CAN do is notice that nobody has.
        #
        # ONE SERIES, keyed on homelab_job, unlike the two key proofs. There is
        # one copy of record — ADR-0024's "nothing records a copy" applies to
        # sets as it does to keys, and a second medium would share this
        # timestamp — so the wrapper's own job series is the honest count.
        # Excluded from ScheduledJobStale above so the advice is "mount the
        # medium" rather than "check the journal". The threshold is the
        # offsite-copy row in install-timers.sh, the same ninety days as the
        # key proofs, so one visit clears three alerts.
        #
        # ScheduledJobNeverRan covers the cold start: the row is declared at
        # install and no success series exists until the first visit, which
        # is the honest state and is expected until then.
        expr: |
          (time() - homelab_job_last_success_timestamp_seconds{homelab_job="offsite-copy"})
            > on(homelab_job) group_left() homelab_job_max_age_seconds
        for: 1h
        labels:
          component: backup
          severity: warning
          category: correctness
        annotations:
          summary: "The offsite copy of the backup sets is {{ $value | humanizeDuration }} old"
          description: >-
            Nothing else here proves the firewall export, the volume sets and
            the NAS set exist anywhere a fire in the rack would not reach —
            oracle is on the same shelf. Mount the second recipient's medium
            and run `make backup-offsite DEST=<path>`; it re-verifies what is
            there, copies the newest of each kind and proves the copy:
            docs/runbooks/copy-the-backups-offsite.md.
