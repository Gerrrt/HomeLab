---
groups:
  - name: network
    interval: 60s
    rules:
      - alert: SnmpExporterDown
        expr: up{job="snmp-exporter"} == 0
        for: 5m
        labels:
          component: network
          severity: critical
          category: availability
        annotations:
          summary: "snmp-exporter is down — every SNMP device will appear unreachable"

      - alert: SnmpTargetUnreachable
        expr: up{job="snmp"} == 0
        for: 10m
        labels:
          component: network
          severity: warning
          category: availability
        annotations:
          summary: "SNMP device {{ $labels.device }} ({{ $labels.instance }}) is not responding"
          description: >-
            Role {{ $labels.role }} on VLAN {{ $labels.vlan }}. Check the device
            is up and that its SNMP community still matches the one in
            secrets/observability.sops.yaml.

      - alert: SnmpScrapeSlow
        expr: scrape_duration_seconds{job="snmp"} > 30
        for: 15m
        labels:
          component: network
          severity: warning
          category: performance
        annotations:
          summary: "SNMP scrape of {{ $labels.device }} takes {{ $value | humanizeDuration }}"
          description: >-
            The scrape timeout is 45s. A walk creeping toward it will start
            producing gaps — narrow the module's OID list in generator.yaml.

      # --- Firewall (pfSense / BEGEMOT-PF-MIB) ------------------------------
      - alert: PfNotRunning
        expr: pfStatusRunning == 0
        for: 2m
        labels:
          component: network
          severity: critical
          category: security
        annotations:
          summary: "Packet filter is NOT running on {{ $labels.device }}"
          description: >-
            pf is disabled. Inter-VLAN isolation and the default-deny posture
            are not being enforced.

      - alert: PfStateTableNearLimit
        expr: pfStateTableCount / pfLimitsStates > 0.80
        for: 10m
        labels:
          component: network
          severity: warning
          category: saturation
        annotations:
          summary: "pf state table at {{ $value | humanizePercentage }} of limit"
          description: >-
            New connections are dropped once the state table fills.

      - alert: PfMemoryDropsIncreasing
        expr: rate(pfCounterMemDrop[15m]) > 0
        for: 15m
        labels:
          component: network
          severity: warning
          category: saturation
        annotations:
          summary: "pf is dropping packets for lack of memory on {{ $labels.device }}"

      # --- Switch (MokerLink / IF-MIB) --------------------------------------
      - alert: SwitchInterfaceDown
        # ifOperStatus: 1=up 2=down 3=testing. Only alerts on ports that were
        # up at some point in the last hour, so unused ports stay quiet.
        expr: |
          ifOperStatus == 2
          and on (instance, ifIndex) (max_over_time(ifOperStatus[1h]) == 1)
        for: 5m
        labels:
          component: network
          severity: warning
          category: availability
        annotations:
          summary: "Interface {{ $labels.ifDescr }} on {{ $labels.device }} went down"

      # No counter-wrap rule. One stood here reading rate(ifInOctets[5m]) < 0,
      # and it could never fire: rate() treats a decrease as a counter reset,
      # never as a wrap, so it is never negative (#63 again — loaded, healthy,
      # unfireable). The mokerlink module now reads the 64-bit ifXTable
      # counters, which do not wrap at any rate this switch can carry (#87).

      # --- Hypervisor BMC (HPE iLO / CPQ MIBs) ------------------------------
      # CPQ condition values: 1=other 2=ok 3=degraded 4=failed
      #
      # ONE FAULT, TWO SUBTREES. On a Gen9 the Smart Storage Battery is both a
      # chassis part (cpqHeSysBattery*, 232.6.2.17) and the backup power for
      # the Smart Array's flash-backed write cache (cpqDaAccel*, 232.3.2.2.2).
      # When it dies the chassis table says WHICH pack and WHY and carries the
      # spare part number; the array table says what it COST. #76 is the worked
      # example: the alert that fired read neither, because it read
      # cpqHeSysBackupBatteryCondition — one identity-free scalar for the whole
      # battery sub-system, which can only ever say "something is wrong". It
      # fired correctly for twelve days and still could not be acted on.
      #
      # WHAT IS DELIBERATELY NOT ALERTED. cpqDaCntlrCondition,
      # cpqDaCntlrBoardCondition and cpqDaAccelCondition at 3 (degraded) are
      # rollups that a flat cache battery degrades. Measured on shiva
      # 2026-08-31, exactly those three read 3 and nothing else on the box did,
      # so reading them at 3 would turn one battery into three critical pages.
      # IloHardwareDegraded reads the first two at 4 instead, where they mean
      # the controller itself. cpqDaAccelBadData = 3 (dirty cache lost) is also
      # unalerted — it is named in IloWriteCacheDisabled's description, because
      # a real occurrence would also degrade the logical drives that
      # IloHardwareDegraded already watches.
      #
      # A RESIDUAL WORTH NAMING. IloBatteryCondition joins two columns of the
      # same SNMP table, so a partial walk that dropped cpqHeSysBatterySparePartNum
      # while leaving the device up would silence it. SnmpTargetUnreachable and
      # SnmpScrapeSlow cover the whole-device case; this partial one is not
      # covered. A fallback branch onto the old scalar was considered and
      # rejected: the two branches carry different $value meanings (status code
      # vs condition code), and an alert whose value means two things is less
      # legible than one that occasionally goes missing.
      #
      # THE SILENCE, NOW LIFTED. IloBatteryCondition and IloWriteCacheDisabled
      # were silenced for device=shiva from 2026-08-31
      # (bfdfff66-d9c3-4df4-9495-f1f38ebf93c1) while the pack was on order, so
      # a known condition did not notify every 12 hours. The matcher was
      # deliberately narrow — alertname and device — so a genuinely new fault
      # on the box was not suppressed with it. The pack was fitted 2026-09-02
      # and the silence deleted the same evening rather than left to run to
      # its 2026-10-01 expiry: a silence standing over a freshly fitted part
      # suppresses exactly the thing you most want to hear about. Both rules
      # are live again over the new part, and no rule expression changed for
      # that — they were written to become correct when the hardware did.
      # History and the two readings that did not move are in
      # docs/runbooks/replace-the-smart-storage-battery.md.
      - alert: IloHardwareDegraded
        # Temperature, supplies and drives are read at > 2 because degraded
        # there means a redundancy has already been spent. The two Smart Array
        # rollups are read at > 3: on this hardware 3 is what a dead cache
        # battery looks like, IloBatteryCondition already names that part, and
        # a critical page for it would be a severity lie. 4 is the controller.
        expr: |
          cpqHeTemperatureCondition > 2
          or cpqHeFltTolPowerSupplyCondition > 2
          or cpqDaLogDrvCondition > 2
          or cpqDaPhyDrvCondition > 2
          or cpqDaCntlrCondition > 3
          or cpqDaCntlrBoardCondition > 3
        for: 5m
        labels:
          component: network
          severity: critical
          category: hardware
        annotations:
          summary: "iLO on {{ $labels.device }} reports degraded or failed hardware"
          description: >-
            CPQ condition code {{ $value }} (3 = degraded, 4 = failed). Check
            the iLO web UI for the specific component. The two Smart Array
            rollups are read at 4 only, not 3 — a flat cache battery degrades
            both, and IloBatteryCondition owns that.

      - alert: IloDrivePredictiveFailure
        # The rule #151 is about, and the distinction it turns on.
        #
        # IloHardwareDegraded above already reads cpqDaPhyDrvCondition > 2 —
        # that is the drive's CURRENT condition, and by the time it moves the
        # redundancy is spent. cpqDaPhyDrvSmartStatus is SMART's PREDICTION, and
        # it moves while the array is still reporting everything ok. On a RAID 1
        # mirror that gap is the whole point: the mirror keeps serving reads
        # through a dying disk without complaint, and the failure only becomes
        # visible when the second one goes — which is the scenario the mirror
        # exists to prevent and cannot, if nobody was told about the first.
        #
        # Read out of cpqida.mib rather than assumed, and HPE's own wording:
        #
        #   other(1)                  the agent cannot determine the status
        #   ok(2)                     functioning properly
        #   replaceDrive(3)           "has a S.M.A.R.T predictive failure error
        #                              and should be replaced"
        #   replaceDriveSSDWearOut(4) approaching the write limit, "should be
        #                              replaced as soon as possible"
        #
        # > 2 covers both replace cases and leaves 1 to the rule below, because
        # "replace this drive" and "I can no longer tell" need different actions.
        #
        # WARNING, NOT CRITICAL, and deliberately. IloHardwareDegraded is
        # critical because a redundancy has already been spent; this fires
        # BEFORE that, while the mirror is still whole. Paging at the same level
        # for both would make the critical one mean less, and this one is
        # "order a disk", not "get up".
        #
        # No join for the bay. Multiplying by cpqDaPhyDrvBay to carry it as a
        # label would corrupt $value, and $value here is the thing worth
        # printing — 3 and 4 are different findings. The description says where
        # to read the bay instead.
        expr: cpqDaPhyDrvSmartStatus > 2
        for: 15m
        labels:
          component: network
          severity: warning
          category: hardware
        annotations:
          summary: "SMART predicts failure on a drive behind {{ $labels.device }}"
          description: >-
            Physical drive {{ $labels.cpqDaPhyDrvIndex }} on controller
            {{ $labels.cpqDaPhyDrvCntlrIndex }} reports SMART status
            {{ $value }} — 3 is a predictive failure, 4 is an SSD approaching
            its write limit. The array is probably still reporting healthy, and
            on a RAID 1 mirror it will keep doing so until the other drive goes.
            Read `cpqDaPhyDrvBay` and `cpqDaPhyDrvModel` at the same index for
            the bay to pull and the part to order.

      - alert: IloDriveSmartUnreadable
        # The complement, and the reason the rule above stops at > 2. other(1)
        # means the agent cannot determine SMART status at all — so the
        # predictive check is not passing, it is blind, and without this the
        # estate could not tell those apart. That is the shape ups.rules.yaml
        # and #63 keep recording: a control that has quietly stopped being able
        # to act looks exactly like one with nothing to report.
        #
        # `for: 1h` because a controller reports 1 transiently while it
        # initialises, and an iLO reboot should not page.
        #
        # info, not warning: nothing is wrong with the hardware, and the action
        # is to find out why the agent has gone quiet rather than to order a
        # part.
        expr: cpqDaPhyDrvSmartStatus == 1
        for: 1h
        labels:
          component: network
          severity: info
          category: correctness
        annotations:
          summary: "iLO cannot read SMART status for a drive behind {{ $labels.device }}"
          description: >-
            Physical drive {{ $labels.cpqDaPhyDrvIndex }} reports SMART status
            other(1) — the agent cannot determine whether predictive failure
            monitoring is working. IloDrivePredictiveFailure is therefore blind
            for this drive rather than quiet about it.

      - alert: IloBatteryCondition
        # cpqHeSysBackupBatteryCondition, which this replaced, is a single
        # scalar with no index labels — it cannot say which pack, why, or what
        # to order. The per-battery table one OID down can. cpqHeSysBatteryStatus
        # is the value carried rather than the condition, because 13
        # (shutdownPermanentFailure) and 4 (shutdownLowVoltage) call for
        # different actions and the condition code cannot tell them apart.
        #
        # group_left copies the spare part number in as a LABEL: snmp_exporter
        # renders a DisplayString as a gauge of 1 whose text lives in a label of
        # the same name, so a join is the only way an annotation can print it.
        # group_left is also what preserves device, role and vlan — a bare
        # `* on(...)` strips every label not named in on().
        #
        # No gate on cpqHeSysBatteryPresent. ups.rules.yaml is the precedent: a
        # rule a device can switch off by reporting "absent" is the fabrication
        # failure again.
        expr: |
          (
            cpqHeSysBatteryStatus
            and on (instance, cpqHeSysBatteryChassis, cpqHeSysBatteryIndex)
                (cpqHeSysBatteryCondition > 2)
          )
          * on (instance, cpqHeSysBatteryChassis, cpqHeSysBatteryIndex)
            group_left (cpqHeSysBatterySparePartNum) cpqHeSysBatterySparePartNum
        for: 30m
        labels:
          component: network
          severity: warning
          category: hardware
        annotations:
          summary: "Backup battery {{ $labels.cpqHeSysBatteryIndex }} on {{ $labels.device }} is degraded or failed"
          description: >-
            cpqHeSysBatteryStatus = {{ $value }}, spare part
            {{ $labels.cpqHeSysBatterySparePartNum }}. 13 is
            shutdownPermanentFailure — the pack is dead and reseating it will
            not clear the code; 15 is predictiveFailure; 1 is noError. On a Gen9
            this pack also backs the Smart Array write cache, so expect
            IloWriteCacheDisabled alongside it. Runbook:
            docs/runbooks/replace-the-smart-storage-battery.md

      - alert: IloWriteCacheDisabled
        # The whole cpqDaAccel* family was scraped and read by nothing. This is
        # the one series in it that states an operational consequence rather
        # than a condition code: 5 (permDisabled) means the Smart Array has
        # switched the flash-backed write cache off and the array is running
        # write-through.
        #
        # > 3 rather than != 3, because 1 (other) and 2 (invalid) are what a
        # controller with no cache module reports and are not a fault. 4
        # (tmpDisabled) upward are.
        expr: cpqDaAccelStatus > 3
        # An hour, not 30m: a pack recharging after a power cut parks the
        # controller in write-through legitimately, and nothing is lost by
        # hearing about a slower array an hour late.
        for: 1h
        labels:
          component: network
          severity: warning
          category: hardware
        annotations:
          summary: "Smart Array cache on {{ $labels.device }} is not caching writes"
          description: >-
            cpqDaAccelStatus = {{ $value }} — 4 is tmpDisabled, 5 permDisabled,
            6 to 9 are cache-module faults. The controller is running
            write-through: slower, and not less durable. cpqDaAccelErrCode names
            the cause (25 = noCapacitorAttached is a dead backup battery), and
            cpqDaAccelBadData = 3 is the one that matters for the array — it
            means dirty cache was lost.
