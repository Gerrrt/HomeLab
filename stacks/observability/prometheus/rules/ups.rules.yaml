---
# APC Smart-UPS (mjolnir, 10.0.99.10) via UPS-MIB.
#
# These rules now read real hardware. An APCRBC115 pack was fitted on 2026-08-28
# and passed its self-test the same day: upsTestResultsSummary went 4 (aborted)
# to 1 (donePass) at 22:45 UTC, and upsBatteryVoltage left its fabricated 480
# for a float reading that moves across 540-549. Runtime is the weaker half of
# that comparison and should not be leaned on: measured over the six days after
# the fit it sat on exactly 63 — the fabricated value — for 744 of 764 samples,
# leaving it only for excursions to 45, 60 and 137 under changing load. Every
# rule here is deliberately loud and routed to the `urgent` receiver by
# category=power in alertmanager.yaml.
#
# WHY THE PRE-FIT BASELINE IS STILL RECORDED HERE.
#
# Until 2026-08-28 this UPS had no pack, and the management card never reported
# that. It fabricated a healthy one:
#
#   upsBatteryStatus              2     (batteryNormal)
#   upsEstimatedChargeRemaining   100   (percent)
#   upsEstimatedMinutesRemaining  63    (minutes of runtime it did not have)
#   upsBatteryVoltage             480   (48.0 V)
#   upsAlarmsPresent              0     (no alarm raised)
#
# Those numbers stay for two reasons. Stored metrics older than 2026-08-28 *are*
# these values rather than measurements, so any query or dashboard whose range
# crosses that date is reading fiction on one side of it. And a card that cannot
# see a pack which *is* fitted — badly seated, or dead on arrival — emits this
# same set again, so it is the comparison to make the next time a pack changes.
#
# upsEstimatedChargeRemaining still reads exactly 100. On its own that is the
# fabrication signature; here it is consistent with a pack at float voltage,
# because voltage moved and the self-test passed. Charge alone was never the
# evidence, and neither, on this UPS, is runtime.
#
# THE ONE METRIC THAT DOES NOT LIE.
#
# upsTestResultsSummary reports the result of the last diagnostics test, and the
# UPS will not fake one — without a usable pack it cannot complete a test, so it
# reports the failure honestly while charge, runtime, voltage and alarm count
# all read healthy.
#
#   1 donePass   2 doneWarning   3 doneError
#   4 aborted    5 inProgress    6 noTestsInitiated
#
# UpsSelfTestFailed and UpsBatteryUnproven below are keyed on it, and they are
# the only two rules in this file that can tell a UPS which works from one that
# merely looks like it does. The silence that held UpsSelfTestFailed until
# 2026-09-20 (54f1715c-e57b-4322-8a6d-5435bc8e1bd8) was deleted on 2026-08-28,
# so both rules are live.
#
# WHAT THIS FILE COULD NOT SEE UNTIL #249.
#
# Scheduled self-tests are enabled on the NMC. Read off the card on 2026-09-06,
# matching what #249 recorded three days earlier:
#
#   upsAdvTestDiagnosticSchedule   8    (biweeklySinceLastTest)
#   upsAdvTestDiagnosticsResults   1    (ok)
#   upsAdvTestLastDiagnosticsDate  "08/28/2026"
#
# All three are PowerNet (1.3.6.1.4.1.318.1.1.1.7.2.x), and until #249 the
# apc_ups module walked 1.3.6.1.2.1.33.1 — the standard UPS-MIB — and nothing
# else. None of it reached Prometheus, so no rule here could be written against
# it, and that left a hole worth naming precisely.
#
# upsTestResultsSummary is the LAST result, not a fresh one. If the card stops
# testing it simply stops changing, and every rule below stays correctly quiet.
# UpsBatteryUnproven cannot catch it — that matches 6 (noTestsInitiated) and a
# card that has stopped testing still reads 1. upsTestStartTime is
# sysUpTime-relative and does not survive an agent restart, so it is not a
# usable staleness signal either. A card that quietly reverts to never(5) — a
# config reset, a firmware update, a restored configuration file — was
# indistinguishable, from inside this file, from one testing every fortnight.
#
# UpsSelfTestScheduleOff and UpsSelfTestStale below close that, and they are a
# pair on purpose: the first is the fast signal, true the moment the card reads
# never(5); the second is the backstop for a card that says it is scheduled and
# is not. Either alone would leave half the failure.
#
# The thing that proves the schedule RUNS rather than merely being set is
# upsAdvTestLastDiagnosticsDate advancing with nobody at the card — due around
# 2026-09-11 for a biweekly schedule last tested on 2026-08-28. As of 2026-09-06
# it has not moved yet, which is expected and not yet evidence either way.
# UpsSelfTestStale is what will say so if it does not.
#
# Do not run self-tests by hand to keep the metric warm. A test transfers the
# load to battery, and on a pack that is weak that is the outage the alert
# exists to warn about. The pre-fit refusals were safe only because no transfer
# ever occurred.
groups:
  - name: ups
    interval: 60s
    rules:
      - alert: UpsOnBattery
        expr: upsSecondsOnBattery > 0
        for: 30s
        labels:
          component: power
          severity: critical
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} is running on battery"
          description: >-
            On battery for {{ $value | humanizeDuration }}. Estimated runtime
            remaining is reported by upsEstimatedMinutesRemaining.

      - alert: UpsBatteryLow
        # UPS-MIB upsBatteryStatus: 1=unknown 2=normal 3=low 4=depleted
        expr: upsBatteryStatus > 2
        for: 1m
        labels:
          component: power
          severity: critical
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} battery status is {{ $value }} (>2 = low/depleted)"

      - alert: UpsRuntimeCritical
        expr: upsEstimatedMinutesRemaining < 5
        for: 1m
        labels:
          component: power
          severity: critical
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} has {{ $value }} minutes of runtime left"

      - alert: UpsChargeLow
        expr: upsEstimatedChargeRemaining < 50
        for: 10m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} charge at {{ $value }}%"

      - alert: UpsOverloaded
        expr: upsOutputPercentLoad > 80
        for: 15m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} output load at {{ $value }}%"
          description: >-
            Sustained load above 80% shortens battery runtime non-linearly.

      - alert: UpsAlarmPresent
        expr: upsAlarmsPresent > 0
        for: 5m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} reports {{ $value }} active alarm(s)"

      - alert: UpsBatteryTemperatureHigh
        expr: upsBatteryTemperature > 40
        for: 15m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} battery at {{ $value }}°C"

      # The two rules that can actually detect a UPS which cannot carry load.
      # Everything above this point reads a value the management card is willing
      # to fabricate; these read the one it is not.

      - alert: UpsSelfTestFailed
        # 2=doneWarning 3=doneError 4=aborted. Bounded below 5 so that
        # 5 (inProgress) does not trip the rule mid-test, and above 1 so that
        # 1 (donePass) does not. 6 is handled by UpsBatteryUnproven.
        expr: upsTestResultsSummary > 1 and upsTestResultsSummary < 5
        for: 5m
        labels:
          component: power
          severity: critical
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} failed its self-test (result {{ $value }})"
          description: >-
            2=doneWarning 3=doneError 4=aborted. A UPS that cannot complete a
            self-test cannot be assumed to carry the load, whatever its charge
            and runtime metrics claim. Check the management card's diagnostics
            page — "Refused / internal fault" means the pack is not seen, and
            now that one is fitted that is a finding about the pack or its
            seating rather than about an empty bay.

      - alert: UpsBatteryUnproven
        # 6 = noTestsInitiated. Not a safe resting state: it is the state in
        # which a UPS has never demonstrated it can do its job, and it is
        # indistinguishable from a healthy one on every other metric.
        #
        # The 7d window is shorter than this card's 14d test interval, so a
        # card reset to 6 can trip this while its schedule is working. That is
        # deliberate — the alert says "unproven for a week", which is worth
        # knowing whatever the cause — but it is why the description sends you
        # to the schedule rather than asserting it has failed. Widening the
        # window to clear the interval would trade a week of blindness for a
        # quieter alert, and this rule exists because quiet was the problem.
        #
        # Expressed over a range rather than as `for: 7d`, deliberately. A long
        # `for` measures continuous pending time in Prometheus's own memory, so
        # any restart inside the window resets it — on a stack that gets
        # redeployed, an alert with `for: 7d` may simply never fire. Reading the
        # stored series instead survives restarts. min and max both equal to 6
        # means the value never left 6 across the window.
        expr: |
          min_over_time(upsTestResultsSummary[7d]) == 6
          and
          max_over_time(upsTestResultsSummary[7d]) == 6
        for: 30m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} has not completed a self-test in 7 days"
          description: >-
            upsTestResultsSummary has read 6 (noTestsInitiated) for seven days,
            so the UPS has not proven it can carry the load inside that window.
            That is what this rule detects and all it detects. It is not proof
            the schedule has failed: this card is set to biweeklySinceLastTest,
            a fourteen-day interval, so a card whose counters have just been
            reset can sit at 6 for a fortnight while the schedule is working.
            Read the schedule and the last-test date before concluding either
            way — scripts/snmp-walk.sh --device mjolnir
            1.3.6.1.4.1.318.1.1.1.7.2 — and if the schedule is off, turn it on
            rather than running tests by hand.

      - alert: UpsSelfTestScheduleOff
        # The control #93 set, watched. Nothing above can see the schedule; this
        # is the only rule that does, and it is the fast half of the pair.
        #
        # 1 unknown, 4 atTurnOn, 5 never — the three values that mean no
        # recurring test. The full PowerNet enumeration is unknown(1),
        # biweekly(2), weekly(3), atTurnOn(4), never(5), fourWeeks(6),
        # twelveWeeks(7), biweeklySinceLastTest(8), weeklySinceLastTest(9),
        # eightWeeks(10), twentysixWeeks(11), fiftytwoWeeks(12), read out of the
        # MIB rather than assumed. An older enumeration stopping at 7 is in
        # circulation and would read this card's 8 as out of range — a rule
        # built on that would be wrong about the one value the card holds.
        #
        # 10, 11 and 12 are deliberately NOT here. They are real schedules, just
        # long ones, and a card set to fifty-two weeks is caught by
        # UpsSelfTestStale below rather than by this — which is the right
        # division, because "not recurring at all" and "recurring too slowly to
        # be a control" are different findings with different fixes.
        # Written as three comparisons rather than a regex: `=~` is a LABEL
        # matcher in PromQL and does not apply to a sample's value, so
        # `metric =~ 1|4|5` is a parse error rather than the shorthand it looks
        # like.
        expr: |
          upsAdvTestDiagnosticSchedule == 1
          or upsAdvTestDiagnosticSchedule == 4
          or upsAdvTestDiagnosticSchedule == 5
        for: 15m
        labels:
          component: ups
          severity: warning
          category: power
        annotations:
          summary: "{{ $labels.device }} is no longer scheduled to self-test"
          description: >-
            The card's automatic battery test schedule reads {{ $value }} —
            unknown, at-turn-on or never — so no recurring test is coming.
            upsTestResultsSummary will hold its last result indefinitely and
            every other rule in this file will stay quiet. Set it back to
            biweekly in the NMC; see docs/runbooks/fit-the-ups-battery.md.

      - alert: UpsSelfTestStale
        # The backstop: a card that says it is scheduled and is not.
        #
        # NO DATE PARSING, and none is needed. upsAdvTestLastDiagnosticsDate is a
        # DisplayString, which snmp_exporter renders as a value-1 gauge carrying
        # the string as a label — verified against the live card, which returns
        #
        #   upsAdvTestLastDiagnosticsDate{upsAdvTestLastDiagnosticsDate="08/28/2026"} 1
        #
        # so each distinct date is a distinct series and counting series over a
        # range counts TESTS. One distinct date in 21 days means the date has not
        # changed in 21 days.
        #
        # 21 = the fortnightly schedule plus a week of grace, so a test that
        # slips does not page.
        #
        # Expressed against the stored series rather than as a long `for:`, for
        # the reason UpsBatteryUnproven states: a `for: 21d` restarts its clock
        # whenever Prometheus does, so it would never fire on a box that is
        # redeployed more often than three weeks. This reads history instead.
        #
        # GATED ON THE SCRAPE BEING UP, which is the trap in a rule shaped like
        # this: a dead exporter produces no new series either, and would
        # otherwise read as a card that stopped testing. `up` for the snmp job is
        # the discriminator, and it makes the rule silent about a fault
        # SnmpTargetDown already owns.
        # AND GATED ON HAVING 21 DAYS OF HISTORY, which the first version of this
        # rule was not, and it fired the moment #249 deployed. A brand-new metric
        # has exactly one distinct value by construction — there was one sample
        # in the window, twenty minutes old — so "one date in 21 days" was true
        # for a reason that had nothing to do with the card. It would have stayed
        # true until the next real self-test.
        #
        # present_over_time(...[1d] offset 20d) asserts the series already
        # existed twenty days ago, so the count means what it claims. A day-wide
        # probe rather than an instant one, because a brief exporter outage
        # exactly 20 days back should not silence the rule for three weeks.
        #
        # The cost is honest and bounded: this rule says nothing for the first
        # twenty days after the metric is introduced or after a Prometheus wipe.
        # That is correct — before then there is genuinely no evidence — and it
        # is far better than a rule that pages on the day it ships.
        expr: |
          count by (device) (last_over_time(upsAdvTestLastDiagnosticsDate[21d])) == 1
          and on(device) (up{job="snmp"} == 1)
          and on(device) present_over_time(upsAdvTestLastDiagnosticsDate[1d] offset 20d)
        labels:
          component: ups
          severity: warning
          category: power
        annotations:
          summary: "{{ $labels.device }} has not completed a self-test in 21 days"
          description: >-
            upsAdvTestLastDiagnosticsDate has reported one distinct date for
            three weeks against a fortnightly schedule, so the card is not
            testing even if it says it is. That makes upsTestResultsSummary a
            stale pass rather than a fresh one. Read the card with
            `scripts/snmp-walk.sh --device mjolnir 1.3.6.1.4.1.318.1.1.1.7.2`.
            Do NOT run a test by hand to clear this — a test transfers the load
            to battery, which on a weak pack is the outage the alert exists to
            warn about.
