---
# APC Smart-UPS (mjolnir, 10.0.99.10) via UPS-MIB.
#
# READ THIS BEFORE TRUSTING ANY ALERT BELOW.
#
# An APCRBC115 pack was fitted on 2026-08-28. Until then the UPS had none and a
# mains loss was an immediate hard shutdown of the whole rack. Every rule here
# is deliberately loud and routed to the `urgent` receiver by category=power in
# alertmanager.yaml.
#
# A fitted pack is not yet a proven one, and here that distinction is not
# pedantry. The management card never reported the missing pack; it fabricated
# a healthy one. Observed on this UPS with no battery physically present:
#
#   upsBatteryStatus              2     (batteryNormal)
#   upsEstimatedChargeRemaining   100   (percent)
#   upsEstimatedMinutesRemaining  63    (minutes of runtime it did not have)
#   upsBatteryVoltage             480   (48.0 V)
#   upsAlarmsPresent              0     (no alarm raised)
#
# A card that cannot see a pack which *is* fitted — one badly seated, or dead on
# arrival — reports those same five values. So the numbers looking healthy is
# not evidence; only their having moved off that pre-fit baseline is. Step 5 of
# docs/runbooks/fit-the-ups-battery.md is that comparison, and it has not been
# made yet.
#
# Until it has, UpsBatteryLow, UpsChargeLow, UpsRuntimeCritical and
# UpsAlarmPresent sit comfortably inside their thresholds and still tell you
# nothing. They are kept because they become correct the moment the card is
# reading real hardware — not because they are protecting anything yet. A quiet
# `ups` group is not evidence of runtime.
#
# UpsOnBattery, UpsOverloaded and UpsBatteryTemperatureHigh read mains-side or
# load-side values and were unaffected throughout. UpsOnBattery in particular
# would still fire on a transfer — it would just be reporting an outage already
# in progress rather than warning of one.
#
# THE ONE METRIC THAT DOES NOT LIE.
#
# upsTestResultsSummary is the exception to everything above. It reports the
# result of the last diagnostics test, and the UPS will not fake one — without a
# usable pack it cannot complete a test, so it reports the failure honestly
# while charge, runtime, voltage and alarm count all read healthy.
#
#   1 donePass   2 doneWarning   3 doneError
#   4 aborted    5 inProgress    6 noTestsInitiated
#
# Observed before the fit: 4 (aborted), which the management card's own
# diagnostics page rendered as "Refused — internal fault". No self-test has been
# run since the pack went in, so that remains the last stored result and this
# metric has not yet had anything new to say.
#
# UpsSelfTestFailed and UpsBatteryUnproven below are keyed on it, and they are
# the only two rules in this file that can tell a UPS which works from one that
# merely looks like it does.
#
# WHAT IS STILL OUTSTANDING, AND WHY THIS HEADER IS NOT SHORTER YET.
#
# UpsSelfTestFailed is silenced in Alertmanager until 2026-09-20
# (54f1715c-e57b-4322-8a6d-5435bc8e1bd8). That silence was correct while nothing
# could be done about a missing pack — it fired every 30 minutes about a known
# condition, which is how an urgent receiver stops being read. It stopped being
# correct the moment a pack was fitted, because it now suppresses the single
# rule that could report that pack being faulty or badly seated. Delete it
# before running the self-test, not after: run them in the other order and the
# one result most worth seeing is the one that is hidden.
#
# Still do not run self-tests by hand to keep the metric warm. A test transfers
# the load to battery, and on a pack that is weak that is the outage the alert
# exists to warn about. The pre-fit refusals were safe only because no transfer
# ever occurred. Enable the NMC's *scheduled* self-test instead, so this metric
# stays live evidence rather than a stale last-known result.
#
# Known limit: a value of 1 (donePass) is the last result, not a fresh one. If
# the NMC stops testing entirely the value simply stops changing, and nothing
# here detects that. upsTestStartTime is sysUpTime-relative and does not survive
# an agent restart, so it is not a usable staleness signal. Scheduled tests on
# the device are the control; this file cannot substitute for them.
groups:
  - name: ups
    interval: 60s
    rules:
      - alert: UpsOnBattery
        expr: upsSecondsOnBattery > 0
        for: 30s
        labels:
          component: power
          severity: critical
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} is running on battery"
          description: >-
            On battery for {{ $value | humanizeDuration }}. Estimated runtime
            remaining is reported by upsEstimatedMinutesRemaining.

      - alert: UpsBatteryLow
        # UPS-MIB upsBatteryStatus: 1=unknown 2=normal 3=low 4=depleted
        expr: upsBatteryStatus > 2
        for: 1m
        labels:
          component: power
          severity: critical
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} battery status is {{ $value }} (>2 = low/depleted)"

      - alert: UpsRuntimeCritical
        expr: upsEstimatedMinutesRemaining < 5
        for: 1m
        labels:
          component: power
          severity: critical
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} has {{ $value }} minutes of runtime left"

      - alert: UpsChargeLow
        expr: upsEstimatedChargeRemaining < 50
        for: 10m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} charge at {{ $value }}%"

      - alert: UpsOverloaded
        expr: upsOutputPercentLoad > 80
        for: 15m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} output load at {{ $value }}%"
          description: >-
            Sustained load above 80% shortens battery runtime non-linearly.

      - alert: UpsAlarmPresent
        expr: upsAlarmsPresent > 0
        for: 5m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} reports {{ $value }} active alarm(s)"

      - alert: UpsBatteryTemperatureHigh
        expr: upsBatteryTemperature > 40
        for: 15m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} battery at {{ $value }}°C"

      # The two rules that can actually detect a UPS which cannot carry load.
      # Everything above this point reads a value the management card is willing
      # to fabricate; these read the one it is not.

      - alert: UpsSelfTestFailed
        # 2=doneWarning 3=doneError 4=aborted. Bounded below 5 so that
        # 5 (inProgress) does not trip the rule mid-test, and above 1 so that
        # 1 (donePass) does not. 6 is handled by UpsBatteryUnproven.
        expr: upsTestResultsSummary > 1 and upsTestResultsSummary < 5
        for: 5m
        labels:
          component: power
          severity: critical
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} failed its self-test (result {{ $value }})"
          description: >-
            2=doneWarning 3=doneError 4=aborted. A UPS that cannot complete a
            self-test cannot be assumed to carry the load, whatever its charge
            and runtime metrics claim. Check the management card's diagnostics
            page — "Refused / internal fault" means the pack is not seen, and
            now that one is fitted that is a finding about the pack or its
            seating rather than about an empty bay.

      - alert: UpsBatteryUnproven
        # 6 = noTestsInitiated. Not a safe resting state: it is the state in
        # which a UPS has never demonstrated it can do its job, and it is
        # indistinguishable from a healthy one on every other metric.
        #
        # Expressed over a range rather than as `for: 7d`, deliberately. A long
        # `for` measures continuous pending time in Prometheus's own memory, so
        # any restart inside the window resets it — on a stack that gets
        # redeployed, an alert with `for: 7d` may simply never fire. Reading the
        # stored series instead survives restarts. min and max both equal to 6
        # means the value never left 6 across the window.
        expr: |
          min_over_time(upsTestResultsSummary[7d]) == 6
          and
          max_over_time(upsTestResultsSummary[7d]) == 6
        for: 30m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          summary: "UPS {{ $labels.device }} has not completed a self-test in 7 days"
          description: >-
            The UPS has never proven it can carry the load. Enable scheduled
            self-tests on the management card so this becomes live evidence
            rather than an absence of it.
