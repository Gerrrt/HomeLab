---
# Whether the house is still filtering DNS.
#
# ADR-0010 puts the resolver on the gateway and the filter one hop behind it:
# Unbound on `morpheus` forwards to AdGuard Home with the public upstreams
# listed alongside it, so an unresponsive AdGuard drops out of forwarder
# selection and every client carries on resolving. The household never notices,
# which is the point — and is exactly why these two rules exist. **The decision
# converts a loud failure into a silent one, and an alert is the only thing that
# distinguishes "AdGuard is fine and this site was never on a list" from
# "AdGuard has been dead for three weeks" (#126, filed again as #123).**
#
# SUPERSEDED FOR LIVENESS on 2026-09-28 by ADR-0055. With the public upstreams
# listed alongside AdGuard, Unbound spread queries across all three by RTT, and
# 38 of 60 blocked names leaked. So AdGuard is now the ONLY forwarder. An
# unresponsive AdGuard no longer drops out quietly: the house stops resolving
# outside names (internal ones still come from morpheus's host overrides). The
# failure is loud now, and AdGuardNotAnswering below is critical and fast
# because of it. AdGuardNotFiltering keeps the reasoning above. A filter that
# fails open is still silent, and still a convenience lost rather than an
# outage.
#
# Nothing already in this directory would catch it, and the near-misses are
# worth naming so nobody writes one of them again:
#
#   containers.rules.yaml   ContainerRestartLoop and ContainerOomKilled need a
#                           metrics agent on the mini PC. That is the #88
#                           pattern and the box does not exist (ADR-0008, #102).
#   host.rules.yaml         InstanceDown covers a host, not a container, and
#                           only once the host is a scrape target at all.
#   network.rules.yaml      touches pf, SNMP and the switch. Nothing about DNS.
#   blackbox.rules.yaml     would be the obvious place, and its probes go
#                           through URLs rather than at a resolver.
#
# And the one that would have been written first and been worse than nothing:
# **a probe through the normal resolver path always passes.** Query pfSense, get
# an answer, mark AdGuard healthy — because the fallback is doing its job. Both
# rules below read `job="blackbox-dns"`, whose targets are aimed at AdGuard's
# own address on port 53. See targets/blackbox-dns.yaml, live since 2026-09-28
# against trinity, and blackbox/blackbox.yaml for the two questions the probes
# ask.
#
# AdGuardNotAnswering is `critical` since ADR-0055: it is the house's DNS.
# AdGuardNotFiltering stays `warning`: what it loses is ad filtering, which
# ADR-0010 calls a convenience rather than a control, and alertmanager.yaml
# routes warning to `default`.
#
# BlackboxExporterDown in blackbox.rules.yaml covers the prober for both jobs —
# a dead exporter makes these two silent rather than red, which is the failure
# mode that matters most and is alerted on there.
groups:
  - name: dns
    interval: 60s
    rules:
      # Liveness. The check that closes #126: does AdGuard answer queries at
      # all, asked directly rather than through the path that hides the answer.
      #
      # `for: 5m`, the endpoint rules' window, and critical. This was 15m and
      # warning while Unbound fell back to public resolvers. Since ADR-0055
      # there is nothing to fall back to, so every minute here is a minute the
      # house cannot resolve outside names. A container restart for an update
      # takes seconds, and backup-volumes.sh no longer stops AdGuard, so five
      # minutes does not page on routine maintenance.
      - alert: AdGuardNotAnswering
        # name="adguard" since #841, when Unbound's liveness probe joined the
        # same job. Without it this rule would page "AdGuard is not answering"
        # for an Unbound fault, and send the reader to the wrong host.
        expr: probe_success{job="blackbox-dns", name="adguard", check="liveness"} == 0
        for: 5m
        labels:
          component: dns
          severity: critical
          category: availability
        annotations:
          runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/forward-dns-to-adguard.md#reversing-it"
          summary: "{{ $labels.name }} is not answering DNS — the house cannot resolve outside names"
          description: >-
            Asked directly at {{ $labels.instance }} for five minutes and got no
            valid answer. AdGuard is the only forwarder behind Unbound on
            morpheus (ADR-0055), so outside names are failing for every device
            in the house. Internal matrix.elysium names still resolve from the
            host overrides. Check the container on trinity (make ps
            STACK=sensitive), then re-probe from the exporter. To restore DNS
            before fixing AdGuard, add 1.1.1.1 back under System > General Setup
            > DNS Servers on morpheus, and remove it again afterwards.

      # Function, and a quieter failure than the one above: a blocklist update
      # that silently stopped working leaves a perfectly healthy AdGuard
      # filtering nothing, and the liveness probe stays green right through it.
      #
      # The `and on (name)` join is what separates the two. A stopped AdGuard
      # fails both probes, and without the join it would raise this alert as
      # well — two different repairs in front of whoever reads the phone, for
      # one fault. This is the EndpointNameNotResolving pattern, and it carries
      # the same hazard: a join that stops matching is invisible to `promtool
      # check rules`, which is what tests/dns.test.yaml is for (#63).
      #
      # `for: 30m` clears a blocklist refresh, which is the one routine event
      # during which a healthy AdGuard might briefly not block.
      - alert: AdGuardNotFiltering
        expr: >-
          probe_success{job="blackbox-dns", check="filtering"} == 0
          and on (name) probe_success{job="blackbox-dns", check="liveness"} == 1
        for: 30m
        labels:
          component: dns
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.name }} is answering DNS but no longer blocking anything"
          description: >-
            The service is up — it resolved a real name on the same probe cycle
            — and the canary domain in blackbox/blackbox.yaml came back with a
            real address instead of 0.0.0.0. So the blocklists are not loaded,
            or the blocking mode is no longer Null IP. Check Filters → DNS
            blocklists for a list that has stopped updating. If the canary has
            simply fallen off the list it is on, replace the canary in
            blackbox/blackbox.yaml — do not disable the probe, which is the one
            thing standing between this and three weeks of quiet.

      # Unbound on morpheus, the resolver the house actually asks (#841).
      #
      # `unless on () ... adguard ... == 0` keeps this to faults of Unbound's
      # own. Unbound forwards to AdGuard alone (ADR-0055), so a dead AdGuard
      # fails this probe too; AdGuardNotAnswering already pages for that, and a
      # second page naming the firewall would send the reader to the wrong box.
      #
      # `unless ... == 0` and not `and ... == 1`: the suppression needs AdGuard
      # to be explicitly failing. If AdGuard's probe series is absent, nothing
      # else would page for the resolver the house uses, so this fires (#873
      # review).
      - alert: UnboundNotAnswering
        expr: >-
          probe_success{job="blackbox-dns", name="unbound", check="liveness"} == 0
          unless on ()
          probe_success{job="blackbox-dns", name="adguard", check="liveness"} == 0
        for: 5m
        labels:
          component: dns
          severity: critical
          category: availability
        annotations:
          summary: "Unbound on morpheus is not answering DNS"
          description: >-
            Asked at {{ $labels.instance }} for example.com for five minutes and
            got no valid answer, and AdGuard is not failing its own probe. So
            the fault is the firewall's resolver: Unbound stopped,
            its forwarding to 10.0.99.40 broken, or a rule now blocking it.
            Every device in the house resolves through it. Status > Services
            on morpheus shows unbound; Diagnostics > DNS Lookup asks it
            directly.
