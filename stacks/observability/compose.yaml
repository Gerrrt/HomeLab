---
# Observability stack for the matrix.elysium homelab.
#
# Deployed on: prometheus (10.0.99.20, VLAN 99 / Winterfell)
# Deploy with:  make up      (from the repository root)
#
# Image tags are pinned deliberately — `:latest` makes a rollback impossible to
# describe and lets a breaking upstream release land silently. Dependabot opens
# a PR for each bump, and CI validates the configs against the new tag.
#
# A `${VAR:?message}` interpolation below is a required variable: compose
# refuses to touch the stack while VAR is unset and prints the message, instead
# of starting it on a default nobody chose. Those guards are also the stack's
# declaration of what it needs — scripts/render-config.sh reads them to decide
# which secrets to ask SOPS for, and scripts/seed-validation-env.sh has to
# satisfy every one of them before this file can be validated. Both read the
# parsed YAML, via scripts/compose-guards.sh, which is what lets this paragraph
# describe the syntax without being read as a guard on a variable named VAR
# (#107).

name: observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [observability]
  # A real init as PID 1, so orphaned children are reaped. Not hygiene: on
  # 2026-08-31 grafana was holding 2437 defunct `ssl_client` processes and
  # gaining two more every 30 seconds. Busybox wget forks a TLS helper for the
  # https healthcheck further down, the helper is reparented to PID 1 when wget
  # exits, and PID 1 in that container is `grafana server` — which never calls
  # wait(). The default pids.max is 9056, so it ran out of tasks about three
  # days after each start, and was only ever saved by being redeployed sooner
  # than that. Every other healthcheck here is plain HTTP and forks nothing,
  # which is why grafana was the only one that showed it (#71).
  init: true
  # Bounds a task leak of the kind the paragraph above describes. Steady state
  # is 9-17 tasks per service and the highest go_threads seen over nine days is
  # 21, so 512 is ~25x normal and still well under the Go runtime's own
  # 10,000-thread abort. The number is loose on purpose: what makes a PID limit
  # safe to set is that the gap between "certainly enough" and "certainly
  # protective" spans two orders of magnitude here. Memory has no such gap,
  # which is why `mem_limit` is set per service from measurement rather than
  # shared here as one round number — see the block above `services:`. A
  # container that hits this dies on EAGAIN, restart: unless-stopped recovers
  # it, and ContainerRestartLoop fires. The quieter case is the one that
  # actually happened: the app was fine and the *healthcheck* could not fork,
  # which shows as `unhealthy` and is not something Docker restarts — the same
  # gap this file notes on loki. There is no rule watching PID counts directly
  # because cAdvisor is not exporting container_processes; Alloy's exporter
  # disables the "process" metric kind, and turning it on means restating the
  # whole disabled list, since enabled_metrics overrides it rather than adding
  # to it. Getting that wrong drops every other container metric, which is the
  # #62 shape exactly. Worth its own issue, not a line here.
  #
  # `ulimits` is absent, and deliberately. nofile would throttle the mmap'd
  # chunk files prometheus and loki depend on, to defend against an exhaustion
  # never observed here. nproc is worse than useless: RLIMIT_NPROC is enforced
  # per real UID across the whole kernel, not per container, and alertmanager
  # and snmp-exporter both run as ${RENDER_UID} — the operator's own uid, set
  # from `id -u` by scripts/render-config.sh. An nproc there would count the
  # operator's host processes against the container, and could refuse the
  # operator a login shell. pids_limit is a cgroup control and is scoped
  # correctly; ulimits: nproc is a uid control in a container costume.
  pids_limit: 512

# ---------------------------------------------------------------------------
# On the mem_limit / memswap_limit pairs below (#114)
# ---------------------------------------------------------------------------
# Every running service carries both. The per-service lines say what each
# number is; this says how all of them were derived, because the derivation is
# the part that does not survive being restated seven times.
#
# SIZED FROM RSS, NOT WORKING SET. `mem_limit` becomes cgroup v2 `memory.max`,
# which bounds `memory.current` — anonymous pages *plus* page cache. Under
# pressure the kernel reclaims the cache first and only OOM-kills when it
# cannot free enough, so what a limit must actually clear is the anonymous
# high-water mark (container_memory_rss), not the working set. The difference
# is not cosmetic: alloy's 512 MiB working-set peak is 221 MiB of RSS and the
# rest reclaimable cache from walking /rootfs. Sizing from working set inflates
# every number by whatever the container happened to have cached.
#
# That is also what retires the method #114 proposed. "3x every peak" read off
# working set is 7600 MiB against 7816 MiB of RAM — the limits would sum to the
# whole machine and bound nothing in aggregate. Read off RSS, with the
# multiplier chosen per service instead of flat, the seven sum to 5120 MiB
# (66% of RAM).
#
# That sum is a ceiling and not a reservation, and it is worth saying what it
# is not: it is not a claim that 5120 MiB is free. The figure that would have
# to fit is the simultaneous one, and across these fourteen days the whole
# stack's combined RSS peaked at 1448 MiB, averaging 566. The non-stack
# containers on this host (the wiki and its database) add 237 MiB today. Sizing
# each service so the ceilings also summed to something that fits would mean
# sizing all seven for a coincidence that has not happened, when the threat
# #114 names is one container leaking. HostMemoryPressure in host.rules.yaml
# covers the coincidence.
#
# MEASURED OVER 2026-08-21 -> 09-04, the full extent of container_memory_* in
# the TSDB (14.2 days; cAdvisor has only reported per-container series since
# #62). MiB, `host="prometheus"`:
#
#   service              median RSS   peak RSS   peak WS   limit   limit/peak RSS
#   prometheus                  116        198       244   1024M         5.2x
#   loki                         93       1015      1039   1536M         1.5x
#   grafana                     139        540       630   1280M         2.4x
#   alloy                       163        221       512    768M         3.5x
#   alertmanager                 19         25        52    256M        10.3x
#   snmp-exporter                14         20        31    128M         6.3x
#   blackbox-exporter            13         18        26    128M         7.2x
#
# THE 2026-08-29 06:16-06:30 FLOOD, which is the thing that had to be explained
# before any of these could be chosen rather than guessed. loki peaked at 1015
# MiB RSS — 10x its mean — and alloy hit its own 221 MiB RSS high-water mark
# inside the same fifteen minutes. A peak two services share is either one real
# load or an artefact, and this one is a load, arriving from outside both.
#
# Per minute, loki's RSS tracks the ingest rate and nothing else:
#
#   05:50-06:15     ~100 MiB     0.0 MiB/s        3 lines/s
#   06:16            461 MiB     2.6 MiB/s    5,501 lines/s
#   06:18            555 MiB     2.7 MiB/s    5,693 lines/s
#   06:29          1,015 MiB     0.6 MiB/s    1,198 lines/s
#   06:30            960 MiB     0.0 MiB/s        2 lines/s
#   06:39            107 MiB     0.0 MiB/s        2 lines/s
#
# 5,500 lines a second against a baseline of three. The source is #286:
# backup-volumes.sh archives each volume with `docker run ... tar -czf -`, the
# gzip stream IS that container's stdout, and Alloy's loki.source.docker
# discovers every container on the socket rather than this stack's seven — so
# `make backup` ships its own archives back through the log pipeline. Read the
# stream out of Loki and it returns binary.
#
# It is worth separating cause from symptom here, because the logs read the
# other way round. Through those minutes loki's compactor cycled start/stop,
# logged "instance not found in the ring" and returned 400s while alloy dropped
# batches with "final error sending batch, no retries left" — which looks like
# in-process component churn until it is lined up against the ingest rate. It
# is a Loki being flooded and shedding load. Neither container restarted, and
# both were back at baseline by 06:40 because the flood stopped, not because
# anything healed.
#
# And it recurs, on the backup timers. Daily peak RSS against daily peak ingest:
#
#   quiet days (9 of 14)     107-128 MiB        1-8 KiB/s
#   08-28                        128 MiB          304 KiB/s
#   09-01                        179 MiB          247 KiB/s
#   09-04                        577 MiB          447 KiB/s
#   08-29                      1,015 MiB        2,769 KiB/s
#
# That is what sets loki's number, and it is the one number here set by
# something that ought to stop happening. Sizing a ceiling around a bug is the
# wrong shape, but the bug is on a timer and will fire again before it is
# fixed, so the ceiling has to clear it: 1536M is 1.5x the worst observed and
# still 12x the quiet-day maximum. #114 listed loki among the low-risk services
# to start with, on a 152 MiB peak from a six-hour window. Fourteen days
# inverts that — it is the riskiest of the seven to bound.
#
# #286 landed on 2026-09-04: the archiver runs with `--log-driver none`, so
# Docker discards the stream at source, and Alloy drops any container labelled
# `homelab.logs=off` before opening its log stream. The number here has
# deliberately NOT been moved yet — every measurement above still includes the
# flood, and a fortnight without it does not exist until 2026-09-18. Re-derive
# then, from `max_over_time(container_memory_rss{name="loki"}[14d])`; on the
# nine quiet days in this window that peaked at 107-128 MiB, so expect roughly
# 512M. Move the number and this paragraph together.
#
# NO SWAP, DELIBERATELY. `memswap_limit` equals `mem_limit` on every service,
# which sets `memory.swap.max` to 0. Left unset it defaults to 2x mem_limit,
# i.e. a constrained container spills to swap instead of dying. /swap.img is
# 4 GiB and unencrypted on a host with no LUKS anywhere (docs/security.md,
# SECURITY.md), and this repository already carries that as a data-at-rest
# exposure — so the default would push grafana's admin password, alertmanager's
# receiver URLs and snmp-exporter's community string toward the one part of the
# disk that argument is about. It also blunts the control: a container that
# swaps instead of being killed breaches its limit silently, where an OOM kill
# raises ContainerOomKilled. Measured cost of switching it off: peak
# container_memory_swap over the window is 70 MiB (prometheus), 17 (alloy),
# 12 (loki) and under 5 for the rest.
#
# These are enforcement. Detection stays separate and stays host-relative —
# ContainerHighMemory still divides by machine_memory_bytes, because coupling
# the two is what left it unfireable for months (#63). ContainerNearMemoryLimit
# in containers.rules.yaml is the limit-relative complement these numbers make
# possible, and it has its own promtool test for the same reason.
#
# Not set on renderer, archiver, gitleaks, actionlint or editorconfig-checker:
# all five sit behind profiles, none runs in a normal deploy, and there is
# nothing running to measure. An unmeasured ceiling on a headless Chromium is
# the guess this block exists to avoid.

services:
  # ---------------------------------------------------------------------------
  # Metrics store. Also acts as the remote-write sink for Alloy agents running
  # on other hosts, hence --web.enable-remote-write-receiver.
  # ---------------------------------------------------------------------------
  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus
    user: "65534:65534"
    # 5.2x the 198 MiB peak, the most generous multiplier of the seven, because
    # this is both the service whose steady state is still moving and the worst
    # one on the host to kill — it is what would otherwise record the kill.
    # RSS tracks head series, and both are still climbing: daily peak RSS went
    # 142 -> 198 MiB across the window, 165 -> 198 over the last four days
    # alone, while prometheus_tsdb_head_series went 21,891 -> 36,986 over those
    # same four days as blackbox and stacks/lab landed. #88 adds Saruman next.
    # 198 MiB is what 37k series costs, not what this will cost, and 1024M
    # carries roughly a doubling of it. The TSDB itself is no longer an
    # unknown the way #114 assumed: prometheus_tsdb_time_retentions_total is 1,
    # so the store has reached 30-day steady state and is evicting, and this is
    # no longer six hours of a mostly-empty database.
    mem_limit: 1024m
    memswap_limit: 1024m
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      # A ceiling on the TSDB, not a tidy-up. It bounds *sustained* growth —
      # the series count creeping up as hosts and exporters are added — so that
      # the disk cannot be consumed a few MiB at a time by a change nobody
      # thought of as a storage decision.
      #
      # Do not size it from the store's current size. On 2026-08-31 that was
      # 1021 MiB, and prometheus_tsdb_time_retentions_total was 0 — nothing had
      # ever been evicted, so the store was still filling and that number was
      # not a steady state. Per-block rates over the retained window: 16.1
      # MiB/day up to 08-17, then 72.9 MiB/day after, because #62 fixed cAdvisor
      # and the series count went 3,514 -> 24,005. Steady state at the current
      # rate is 30 x 72.9 + ~150 MiB of WAL and head chunks = 2.28 GiB, and
      # ~2.73 GiB once Saruman gets an agent (#88). So 12GB — powers-of-2, i.e.
      # 12 GiB — is 5.3x today and 4.4x with #88, and 12% of the 98 GiB volume.
      # 4 GiB looked generous against 1021 MiB and would have been 1.5x against
      # the estate that is already planned.
      #
      # That headroom is the point: this repository promises 30 days in four
      # places, and a ceiling reached in normal operation is a second retention
      # policy wearing a ceiling's clothes. If it ever does evict,
      # PrometheusSizeRetentionActive in containers.rules.yaml says so.
      #
      # What it does NOT do is win a race against a flood through the
      # remote-write receiver enabled below, which anything that can route here
      # may push to (ADR-0012, #182). The budget counts the WAL and the m-mapped
      # head chunks but only ever evicts persistent blocks, and a flood lands in
      # the WAL: at a few MB/s the head alone passes 12 GiB long before any
      # block does, at which point every block is deleted and the WAL keeps
      # growing regardless. Bounding that is authentication's job, not this
      # flag's.
      #
      # Both retention flags are marked [DEPRECATED] by this version in favour
      # of a storage.tsdb.retention block in prometheus.yaml. They still work,
      # and they stay here because prometheus.yaml is mounted rather than
      # rendered — moving retention into it would drop these two tunables out of
      # .env.example, which is where this repository deliberately keeps them.
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-12GB}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # Only the CA certificate, never a key. Prometheus needs it to verify
      # Grafana's TLS now that the grafana job scrapes over https.
      - ../../certificates/ca.pem:/etc/prometheus/tls/ca.pem:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      # Published, and unauthenticated with it: anything that can reach this
      # port can read every metric and inject more through the remote-write
      # receiver. It stays published because `oracle` remote-writes here — that
      # is a real client, not a hypothetical one (#70). Recorded as an accepted
      # residual in SECURITY.md rather than left implicit.
      - "${BIND_ADDR:-0.0.0.0}:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Alert routing. Receiver URLs come from SOPS-encrypted secrets, never the
  # compose file — see secrets/README.md.
  # ---------------------------------------------------------------------------
  alertmanager:
    <<: *service-defaults
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    container_name: alertmanager
    # Mounts ./alertmanager/.rendered, written 0600 by render-config.sh, so it
    # must run as the UID that rendered it. Required rather than defaulted: a
    # stale .env predating RENDER_UID would otherwise silently fall back to
    # 65534 and reintroduce the permission-denied crash loop this guards against.
    user: "${RENDER_UID:?run make render}:${RENDER_GID:?run make render}"
    # 10.3x the 25 MiB peak, and the widest ratio here because it costs almost
    # nothing to be generous with a service this small — RSS ran 12-25 MiB over
    # the fourteen days with 95% of samples at or below 21, and no excursion at
    # all. 256M is 5x even the working-set peak of 52 MiB.
    mem_limit: 256m
    memswap_limit: 256m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
      # Seeds the externalURL field in webhook payloads and nothing else — no
      # receiver here renders it. Since #70 that link opens only on the
      # monitoring host. Left pointing at the real address rather than
      # 127.0.0.1, because that is still the host you would tunnel to.
      - --web.external-url=http://${MONITORING_HOST:-10.0.99.20}:${ALERTMANAGER_PORT:-9093}
    volumes:
      - ./alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      # One file per notification channel, written by scripts/render-config.sh.
      # Alertmanager does not expand environment variables, so each receiver
      # URL is read from a file via `url_file`.
      - ./alertmanager/.rendered:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      # Loopback only, and the only one of the four that can be (#70). Anyone
      # who can reach an unauthenticated Alertmanager can create a silence,
      # which switches off an alert using the same system that would otherwise
      # have recorded the act. Unlike Prometheus and Loki above, nothing
      # off-host talks to it: silences are reached through Grafana, which
      # proxies this service over the compose network behind a login.
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Log store. Single-binary mode with filesystem storage: this lab pushes well
  # under 1 GB/day, so the operational cost of a microservices deployment buys
  # nothing. See docs/adr/0003-observability-stack-selection.md.
  # ---------------------------------------------------------------------------
  loki:
    <<: *service-defaults
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    container_name: loki
    user: "10001:10001"
    # 1.5x the 1015 MiB peak — the tightest ratio and the largest number, which
    # is the same fact twice: loki has by far the widest dynamic range here,
    # 93 MiB median against a peak eleven times that. That peak is the 2026-08-29
    # ingest flood explained above, it belongs to #286 rather than to Loki, and
    # it recurred until #286 was fixed on 2026-09-04 — 577 MiB as recently as
    # that morning. Sized to clear it rather than to clip it, because a log
    # store OOM-killed mid-flood takes the record of the flood with it. The
    # cause is gone; the number stays until a fortnight of data without it
    # exists to re-derive from. See the block above `services:`.
    mem_limit: 1536m
    memswap_limit: 1536m
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      # Loki's local ruler reads <directory>/<tenant>/. auth_enabled is false,
      # so the tenant is "fake".
      - ./loki/rules:/etc/loki/rules/fake:ro
      - loki-data:/loki
    ports:
      # Published for the same reason as Prometheus above, and with the same
      # residual: auth_enabled is false, so the push and delete APIs are open to
      # whatever can reach the port. `oracle`'s Alloy pushes here (#70).
      - "${BIND_ADDR:-0.0.0.0}:${LOKI_PORT:-3100}:3100"

  # No healthcheck on loki, deliberately.
  #
  # grafana/loki is built FROM gcr.io/distroless/static:nonroot. The image
  # contains /usr/bin/loki and nothing else — no shell, no wget, no curl. A
  # Docker healthcheck can only exec something inside the container, so there is
  # nothing available to probe with, and any `test:` here fails forever.
  #
  # That is not cosmetic: an unhealthy service blocks anything waiting on it via
  # `depends_on: condition: service_healthy`, so Grafana and Alloy never start
  # and the stack appears to hang with Loki "starting" indefinitely.
  #
  # Readiness is instead observed from outside the container:
  #   curl -s localhost:3100/ready
  # and continuously by Prometheus, which scrapes loki:3100 as the `loki` job —
  # `InstanceDown{job="loki"}` and `LokiIngestionStalled` both cover it.
  #
  # That "no shell, no wget" claim is asserted rather than assumed: it is an
  # entry in ABSENT_BINARIES in scripts/check_compose_health.py, which execs
  # both inside this pinned image on every CI run. If either ever turns up, the
  # paragraph above is out of date and loki can have a healthcheck (#79).

  # ---------------------------------------------------------------------------
  # SNMP polling proxy for pfSense, the MokerLink switch, the APC UPS and iLO.
  # snmp.yaml is rendered from the committed template by scripts/render-config.sh
  # so the community string is never written to disk in the repo.
  # ---------------------------------------------------------------------------
  snmp-exporter:
    <<: *service-defaults
    image: prom/snmp-exporter:v0.30.1@sha256:e5fd5e8b43ace6c088fe9bf0b37b7fff0e04380bee352be7ec41b853a4dd5859
    container_name: snmp-exporter
    # Mounts ./snmp-exporter/.rendered/snmp.yaml, written 0600 by
    # render-config.sh, so it must run as the UID that rendered it. Required,
    # not defaulted — see the note on alertmanager above.
    user: "${RENDER_UID:?run make render}:${RENDER_GID:?run make render}"
    # 6.3x the 20 MiB peak. Four SNMP devices at a 60-second interval is a
    # fixed, tiny workload and it measures like one: RSS ran 10-20 MiB over the
    # fourteen days, median 14, with no trend.
    mem_limit: 128m
    memswap_limit: 128m
    command:
      - --config.file=/etc/snmp_exporter/snmp.yaml
    volumes:
      - ./snmp-exporter/.rendered/snmp.yaml:/etc/snmp_exporter/snmp.yaml:ro
    expose:
      - "9116"
    healthcheck:
      # /-/healthy, not /health. snmp_exporter v0.30.1 serves no /health — it
      # returns 404 — so this probe failed on every run and the container sat
      # permanently unhealthy while working perfectly. It was invisible because
      # nothing depends_on snmp-exporter and Docker does not restart on
      # unhealthy, so the only symptom was a status in `make ps` that had always
      # been there. A healthcheck that cannot pass is worse than none: it
      # reports a permanent fault the operator learns to scroll past, and it
      # deadlocks the first service that ever waits on service_healthy.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9116/-/healthy"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Synthetic probes. Every other collector here measures a service from the
  # inside; this one asks the question a person asks — can I reach it. See
  # blackbox/blackbox.yaml for why its TLS verification is deliberately loose.
  # ---------------------------------------------------------------------------
  blackbox-exporter:
    <<: *service-defaults
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: blackbox-exporter
    # 7.2x the 18 MiB peak. The shortest history of the seven — this service
    # only exists since 2026-08-30, so it has six days rather than fourteen.
    # It is also the flattest thing on the host (median 13 MiB, never above
    # 18), and at 128M the limit is far enough above the measurement that the
    # shorter window does not change the number.
    mem_limit: 128m
    memswap_limit: 128m
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yaml:/etc/blackbox_exporter/config.yml:ro
      # Only the CA certificate, never a key — the same mount Prometheus has,
      # for the same reason: the http_2xx_lab_ca module verifies Grafana's
      # chain against it (#91). Changing this recreates the container, which
      # `make up` does; a config-only edit is a `make reload`.
      - ../../certificates/ca.pem:/etc/blackbox_exporter/tls/ca.pem:ro
    # Never published to a host interface. Nothing outside the compose network
    # has any reason to ask this container to make a request on its behalf —
    # an open blackbox exporter is a server-side request forgery primitive.
    expose:
      - "9115"
    healthcheck:
      # /-/healthy, as with snmp-exporter. prom/blackbox-exporter is busybox
      # based, so wget exists — and that is checked rather than assumed:
      # `scripts/check_compose_health.py --probe` execs this binary inside this
      # pinned image on every CI run, so a base change under a Dependabot bump
      # cannot make this healthcheck unrunnable without failing first (#79).
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9115/-/healthy"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Visualisation. Datasources and dashboards are provisioned from files, so a
  # wiped volume costs nothing but annotations — the dashboards are in git.
  # ---------------------------------------------------------------------------
  grafana:
    <<: *service-defaults
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: grafana
    # 2.4x the 540 MiB peak. Grafana is the second-spikiest service here — 139
    # MiB median, and three excursions past 350 MiB RSS in fourteen days (540,
    # 456, 373) — and unlike loki's, its spikes are query- and render-driven,
    # so they are reachable by anyone opening a dashboard rather than by one
    # identifiable event. That is why the multiple is applied to the peak and
    # not to the median: there is no excursion here to discount.
    #
    # 1280M rather than 1024M leaves room for a path this window did not
    # exercise. `make screenshots` asks Grafana to serve a 4582px render, and
    # the `capture` profile was never up for long enough to measure it — the
    # renderer's own working set peaked at 24 MiB over the fourteen days, which
    # is a container that started and stopped, not one that rendered. The
    # headroom is for that unmeasured path, and it is named here rather than
    # folded into the multiplier so the next person knows it is an assumption.
    mem_limit: 1280m
    memswap_limit: 1280m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in secrets/observability.sops.yaml}
      # Now true: the cookie is only ever sent over TLS. It was false because
      # Grafana spoke plain HTTP, and a secure cookie over HTTP is simply never
      # sent — you get a login page that accepts your password and loops.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/tls/cert.pem
      GF_SERVER_CERT_KEY: /etc/grafana/tls/key.pem
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # No plugins are installed here, deliberately. This was
      # GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel and both
      # were dead weight — no dashboard under grafana/dashboards/ uses either
      # panel type, and grafana-piechart-panel is an Angular plugin, which this
      # Grafana refuses to initialise: it was downloaded and then rejected on
      # every single start.
      #
      # It was also an availability bug, which is the reason it is gone rather
      # than merely tidied. The background installer contacts grafana.com on
      # every start, and a failure there is FATAL to the process — Grafana
      # crash-looped on a host with no uplink, even though both plugins were
      # already present in grafana-data. That turns an ordinary outage into a
      # failed disaster recovery, and it was found by doing one: see the last
      # section of docs/runbooks/restore-the-stack.md.
      #
      # Grafana still preinstalls its own bundled apps (pyroscope, exploretraces,
      # metricsdrilldown, lokiexplore, elasticsearch). Those ship inside the
      # image and need no network, which is what makes an offline start work.
      #
      # If a plugin is ever genuinely needed, add GF_PLUGINS_PREINSTALL —
      # GF_INSTALL_PLUGINS is deprecated — and re-test the offline start before
      # committing it.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      # Where to send a render request, and the URL the renderer is told to
      # fetch back. With the `capture` profile off — which is every normal
      # deploy — Grafana probes the absent renderer three times at startup and
      # logs three errors before giving up. It then serves normally and picks
      # the renderer up on the next render request without a restart. Three
      # lines of startup noise is the whole cost; it is written down here so
      # that finding them in the log is not a fault diagnosis.
      # See the renderer service at the foot of this file.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: https://grafana:3000/
      # Required, not defaulted, and not optional: Grafana refuses to *start*
      # with the built-in renderer token once a rendering server is configured,
      # so a missing value here is a crash loop on the dashboard host, not a
      # failed screenshot. The `${GRAFANA_RENDERER_TOKEN:?...}` guard on the
      # next line turns that into a named error at `make up` instead, before
      # anything is recreated.
      # Shared with the renderer's AUTH_TOKEN below.
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN:?set in secrets/observability.sops.yaml}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      # Generated by scripts/gen-certs.sh into a gitignored certificates/ at the
      # repository root, which is why this reaches outside the stack directory.
      - ../../certificates/grafana.matrix.elysium.pem:/etc/grafana/tls/cert.pem:ro
      - ../../certificates/grafana.matrix.elysium-key.pem:/etc/grafana/tls/key.pem:ro
    # Grafana runs as 472:0 and the key is owned by the operator at 0640, so the
    # container is given the operator's gid as a supplementary group. The
    # alternative — a world-readable private key — is worse, and running Grafana
    # as the operator's uid would strand it from its own 472-owned data volume.
    group_add:
      - "${RENDER_GID:?run make render}"
    ports:
      # The only published port a human is meant to open, and the only one that
      # authenticates: anonymous access and sign-up are both off, and the admin
      # password comes from SOPS.
      - "${BIND_ADDR:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      # service_started, not service_healthy: Loki is distroless and cannot
      # report health (see the loki service above). Grafana's Loki datasource is
      # resolved lazily per query, so starting before Loki is fully ready costs
      # nothing beyond an empty panel for a few seconds.
      loki:
        condition: service_started
    healthcheck:
      # --no-check-certificate: the probe runs inside the container and talks to
      # itself. It is testing that Grafana is serving, not that a self-signed
      # certificate chains — and busybox wget has no way to be handed a CA.
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Collection agent for this host: cAdvisor + node metrics, Docker/journal/
  # syslog/auth logs. The config is the ./alloy DIRECTORY, not one file, and
  # Alloy merges every *.alloy in it: config.alloy goes to every monitored host,
  # docker.alloy to the ones with a Docker socket, syslog.alloy stays here
  # because it is the listener morpheus sends to. scripts/deploy-agent.sh ships
  # the right subset to a remote host with LOKI_URL / PROMETHEUS_REMOTE_WRITE_URL
  # pointed back here; the header of alloy/config.alloy has the reasoning.
  # ---------------------------------------------------------------------------
  alloy:
    <<: *service-defaults
    # No `hostname:` here, deliberately. Setting it is the only way to give
    # constants.hostname a real name, and it also registers that name in Docker's
    # embedded DNS — on a host called `prometheus` that produced a second A
    # record for `prometheus` aimed at this container, and remote_write started
    # dialling Alloy instead of Prometheus. config.alloy reads ALLOY_HOSTNAME
    # from the environment instead; the header of that file has the whole story.
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    container_name: alloy
    # 1024 rather than the shared 512: this is the one service that walks
    # cgroups, tails the journal and talks to the Docker socket, so it has more
    # reason than the others to fan out. Observed peak is 20 threads either way.
    pids_limit: 1024
    # 3.5x the 221 MiB peak. Alloy is the clearest case for sizing from RSS
    # rather than working set: its working set reached 512 MiB, but 278 MiB of
    # that is reclaimable page cache from the read-only /rootfs mount below,
    # and cache above a limit is reclaimed rather than fatal. Sized from the
    # working-set peak this would be 1536M for a process whose anonymous memory
    # sits between 155 and 181 MiB across the whole fourteen days, and reached
    # 221 only in the minutes of the 08-29 flood above.
    mem_limit: 768m
    memswap_limit: 768m
    # `privileged: true` used to be here, and it was never what made cAdvisor
    # work — cgroup: host below is. What it did do was hand every capability to
    # the one container holding the Docker socket and a read-only mount of the
    # whole host filesystem. Measured on 2026-08-31: uid 0, CapEff
    # 000001ffffffffff, and /rootfs/home/robo/.config/sops/age/keys.txt
    # readable — the key every secret in this repository decrypts with, which
    # SECURITY.md says file permissions alone protect. Dropping the capability
    # set closes that read, because root without DAC_OVERRIDE is subject to the
    # 0600 like anyone else (#188).
    #
    # Cost, measured rather than assumed: six series. node_rapl_*_joules_total
    # (3) and node_cpu_{core,package}_throttles_total (3) read sysfs files that
    # are root-only, and node_exporter drops them silently — no collector
    # failure, no log line. Nothing in this repository references any of the
    # six. Everything else is identical: 895 cAdvisor series, seven container
    # names, the same node_filesystem mountpoints.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Root without DAC_OVERRIDE also cannot read /var/log/auth.log or
    # /var/log/syslog — they are syslog:adm 0640 and root owns neither — which
    # would take out the two file sources in config.alloy and, with them, most
    # of security.rules.yaml. Joining the group that owns them restores exactly
    # that and nothing else.
    #
    # The tempting alternative is cap_add: [DAC_READ_SEARCH]. Do not: it grants
    # read of *every* file on the mounted rootfs, which puts the age key back
    # within reach and undoes the whole point. Both were tested; the group
    # leaves the key denied and the capability does not.
    #
    # Rendered rather than hardcoded to 4 because config.alloy and this file are
    # deployed identically to every monitored host, and the group that owns the
    # syslog files is a property of the host, not of this repository.
    group_add:
      - "${LOG_READ_GID:?run make render}"
      # 473 is the image's own `alloy` group, and alloy-data is 0770 473:473 —
      # so without this the agent cannot write its own WAL and positions files
      # and dies on `mkdir /var/lib/alloy/data: permission denied` before it
      # reads a line of config. Under `privileged: true` DAC_OVERRIDE hid that,
      # which is a fair summary of what that setting was doing here generally.
      #
      # A property of the pinned image rather than of the host, hence the
      # literal. Re-derive after an image bump with:
      #   docker run --rm --entrypoint sh <image> -c 'stat -c %g /var/lib/alloy'
      # Getting it wrong is at least loud: the container crash-loops from the
      # first second and ContainerRestartLoop fires, rather than coming up and
      # collecting nothing.
      - "473"
    # Without this the cAdvisor exporter reports exactly one series, id="/",
    # and every per-container metric is missing — which is what the Docker
    # Containers dashboard and four of the nine rules in containers.rules.yaml
    # are built on. On cgroup v2 Docker's default namespace mode is `private`,
    # so the container's own cgroup IS the root it can see, and cAdvisor
    # faithfully reports the one cgroup it finds. Nothing errors. The exporter
    # stays healthy and the dashboard stays empty.
    #
    # This is the setting that matters, and it is not a privilege: the
    # `privileged: true` that sat above was neither necessary nor sufficient for
    # it. Sufficiency is what #62 found — privileged alone still gave one
    # series. Necessity is what #188 measured — dropping every capability
    # changed no container metric at all.
    cgroup: host
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      PROMETHEUS_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
      # The name this agent labels its metrics and logs with. Written into .env
      # by scripts/render-config.sh; see the comment there. The fallback is
      # deliberately obvious rather than plausible — a host="alloy" label means
      # render was skipped, which is easier to spot than a name that looks right.
      ALLOY_HOSTNAME: ${ALLOY_HOSTNAME:-alloy}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # The directory, so all three files load. Mounting one file here is how a
      # host would silently lose its Docker or syslog collection.
      - /etc/alloy
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      # The API, not the log files: cAdvisor takes container names and labels
      # from it, and discovery.docker + loki.source.docker stream stdout through
      # it. `:ro` is close to decorative — it applies to the socket file, not to
      # the API behind it, and that API can create a container with / mounted
      # read-write. It is the one path left from a compromised Alloy to root on
      # this host, and it is why the capability drop above is defence in depth
      # rather than a closed door. Tracked separately; see docs/security.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # /var/lib/docker/containers is NOT mounted, though it was until #188.
      # Nothing read it: loki.source.docker streams over the socket above rather
      # than tailing the json-file driver's output, the node exporter names the
      # path only to *exclude* it from the filesystem collector, and cAdvisor was
      # measured producing identical series without it. It is root-only and
      # holds every container's logs, so an unread mount of it is pure reach.
      - /var/log:/var/log:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
      # Network syslog for devices that cannot run an agent — morpheus today.
      # Unlike the debug UI above this must be reachable off-host, so it binds
      # to BIND_ADDR. pfSense sends UDP by default.
      #
      # The container side is 1514, and the reason is NOT that it cannot bind a
      # privileged port — it can. Measured here 2026-09-05 (Docker 29.8.0, the
      # pinned alloy digest): uid 0 with CapEff 0000000000000000, and Docker
      # sets net.ipv4.ip_unprivileged_port_start=0 in the container's network
      # namespace, so the privileged range inside it is empty and
      # CAP_NET_BIND_SERVICE is never consulted for any port. The cap_drop above
      # is doing what #188 intended; it just has no bearing on which ports Alloy
      # can bind. Two earlier versions of this comment gave a wrong reason —
      # first "does not run as root" (#188), then the capability (#290).
      #
      # 1514 stays anyway, on a reason that does hold: that sysctl is a daemon
      # *default*. It is settable per container and has not always been what it
      # is now, so a container-side :514 would rest on something a future
      # daemon default or a hardening pass could take away — silently, as a bind
      # failure at start. Nothing needs the container side to be 514.
      #
      # The host side is free to be 514, because dockerd binds it as root before
      # Alloy is involved. SYSLOG_PORT sets only the host side, so a device that
      # can only send to the standard port is accommodated by SYSLOG_PORT=514 in
      # .env and nothing else — no change to this mapping. Verified end to end
      # on this host 2026-09-05: 127.0.0.1:514 published to a --cap-drop ALL
      # container, packet delivered. The consumer is Gerrrt/Lemmiwinks#161.
      - "${BIND_ADDR:-0.0.0.0}:${SYSLOG_PORT:-1514}:1514/udp"
    depends_on:
      # service_started for loki, for the same reason as grafana above: the
      # distroless image cannot report health. Alloy retries a failed push with
      # backoff and buffers in the meantime, so racing Loki's startup is safe.
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Headless renderer for dashboard screenshots. NOT part of the running stack:
  # it sits behind the `capture` profile, so `make up` neither starts it nor
  # pulls it, and `docker compose ps` shows six services as before.
  #
  # It exists because the monitoring host has no browser and Grafana has no
  # built-in PNG export — screenshots for the README were the one artefact this
  # repository could not produce from its own tooling. Started and stopped by
  # scripts/capture-screenshots.sh; see docs/images/README.md.
  # ---------------------------------------------------------------------------
  renderer:
    <<: *service-defaults
    profiles: ["capture"]
    image: grafana/grafana-image-renderer:v5.12.2@sha256:cafd7afe8cc1995f26434e0194fadd823656b322cb7c8c2784e1477c72ff9e46
    container_name: renderer
    environment:
      # The renderer loads the dashboard in a headless Chromium, and Chromium
      # is what rejects the lab CA — not the Go process wrapping it. It reads
      # trust from an NSS database, not from a PEM on disk or SSL_CERT_FILE, so
      # there is no way to hand it certificates/ca.pem without building a custom
      # image around certutil. Tried and abandoned: NODE_EXTRA_CA_CERTS does
      # nothing here (this renderer stopped being a Node process at v5) and the
      # failure it leaves is ERR_CERT_AUTHORITY_INVALID from inside the browser.
      #
      # So this accepts any certificate — knowingly, and narrowly. The container
      # exists only for the seconds a `make screenshots` run takes, it is not
      # published, and the only host it contacts is Grafana on this bridge. It
      # is the same trade-off Grafana's own healthcheck makes with
      # --no-check-certificate, over a shorter life and a smaller surface.
      #
      # BROWSER_FLAGS, not RENDERING_IGNORE_HTTPS_ERRORS: that name belongs to
      # the Node implementation this image stopped being at v5, and v5 ignores
      # it silently — the render still fails with ERR_CERT_AUTHORITY_INVALID and
      # nothing says why. `grafana-image-renderer server --help` is the list of
      # what this version actually reads.
      BROWSER_FLAGS: --ignore-certificate-errors
      # The other half of GF_RENDERING_RENDERER_TOKEN. The renderer rejects any
      # render request that does not carry it, which is what stops anything else
      # on this network asking it to fetch an authenticated Grafana URL.
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN:?set in secrets/observability.sops.yaml}
      # A render taller than this is silently clamped to it, and the dashboard
      # is cropped rather than refused — the same truncation the height
      # derivation in capture-screenshots.sh exists to avoid, reintroduced one
      # layer down. The default is 3000 and `homelab-stack` is 4582px, so the
      # whole Alloy row fell off the bottom of a capture that reported success.
      # Keep this and MAX_HEIGHT in capture-screenshots.sh in step.
      BROWSER_MAX_HEIGHT: 5000
      LOG_LEVEL: info
    # Deliberately not published. The only client is Grafana, on this network.
    expose:
      - "8081"
    # Chromium in a container with the default 64MB /dev/shm crashes part-way
    # through a large dashboard, which presents as a truncated PNG rather than
    # an error.
    shm_size: "1gb"
    # Overrides the shared 512, which is a number measured from Go services and
    # means nothing here — a headless Chromium is a process tree, not one
    # binary. This value is not measured either: the `capture` profile is off on
    # every normal deploy, so there was nothing running to count. It is set
    # rather than inherited so that the shared default cannot quietly break a
    # `make screenshots` run, and it is high enough that it should not bind.
    pids_limit: 4096

  # ---------------------------------------------------------------------------
  # tar and gzip for scripts/backup-volumes.sh. NOT part of the running stack:
  # it sits behind the `backup` profile, so `make up` neither starts it nor
  # pulls it, and `docker compose ps` shows six services as before.
  #
  # This service is never actually started. It exists so that the image the
  # backup script runs is pinned in the one place this repository pins images.
  # `make backup` used to run a bare `alpine` — no tag at all, so it resolved to
  # :latest and slipped past both the floating-tag check (which looks for a
  # literal :latest) and the digest check (which reads image: lines out of this
  # file). Writing `alpine:3.22` into the script instead would only move the
  # problem: Dependabot watches this file, `make pin-digests` reads this file,
  # and a pin anywhere else is one nothing bumps and nothing digests — which is
  # the whole argument in the header of scripts/image-for.sh. So the image lives
  # here and the script asks for it with `image-for.sh archiver`.
  #
  # Debian rather than Alpine, and this is not incidental. Alpine's tar is
  # BusyBox tar, which does not notice a file that changed while it was being
  # read; GNU tar reports it and exits 1, and that exit status is the only
  # mechanical evidence a `--hot` run has that it just wrote a torn archive.
  # BusyBox exits 0 on the identical archive and it verifies clean. BusyBox tar
  # also has no --numeric-owner, which the restore path needs to put back uids
  # 65534, 10001 and 472 on volumes whose names it does not have.
  #
  # Run with `docker run`, not `docker compose run`: the tar stream IS the
  # container's stdout and compose writes its own progress lines into it.
  #
  # It mounts nothing, deliberately. backup-volumes.sh derives the
  # volume -> service map by finding the one service that mounts each named
  # volume, and a second claimant would make that ambiguous.
  # ---------------------------------------------------------------------------
  archiver:
    profiles: ["backup"]
    image: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
    command: ["true"]

  # ---------------------------------------------------------------------------
  # gitleaks for the secret-scan CI job. NOT part of the running stack: it sits
  # behind the `scan` profile, so `make up` neither starts it nor pulls it, and
  # `docker compose ps` shows six services as before.
  #
  # Here for the same reason `archiver` above is. This one was a version pinned
  # in ci.yml's env: block — directly underneath the comment saying image
  # versions are not duplicated there — carrying a tag and no digest. Dependabot
  # watches this file, so it never saw it; `make pin-digests` reads this file,
  # so it could not re-resolve it. And it survived all three of CI's image
  # guards: it is not `:latest`, it was not a prom/ or grafana/ prefix, and it
  # was not an `image:` line here. That is the second half of #65.
  #
  # `command: ["version"]` rather than ["true"]: this image's entrypoint IS
  # gitleaks, so `true` would be read as a gitleaks subcommand. `version` is the
  # harmless no-op if it is ever started by accident.
  # ---------------------------------------------------------------------------
  gitleaks:
    profiles: ["scan"]
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    command: ["version"]

  # ---------------------------------------------------------------------------
  # actionlint and editorconfig-checker for scripts/lint.sh. NOT part of the
  # running stack: both sit behind the `lint` profile, so `make up` neither
  # starts nor pulls them, and `docker compose ps` shows six services as before.
  #
  # Here for the same reason `archiver` and `gitleaks` above are. These two were
  # GitHub Actions — raven-actions/actionlint and
  # editorconfig-checker/action-editorconfig-checker — so they ran only inside
  # CI: unrunnable by `make validate`, and pinned by nothing in this repository
  # at all. Two linters whose first and only feedback was a red build. That is
  # half of #68.
  #
  # Docker Hub rather than ghcr.io on purpose: scripts/pin-digests.sh resolves
  # through auth.docker.io and registry-1.docker.io only, so a ghcr.io reference
  # could not be digest-pinned here and would then fail CI's digest assertion.
  #
  # The two `command:` lines differ because the images do. actionlint's
  # entrypoint IS actionlint, so `-version` is the harmless no-op if it is ever
  # started by accident. editorconfig-checker sets no entrypoint, only a Cmd, so
  # a bare `--version` would be executed as a binary and the name has to be
  # repeated — which is also why scripts/lint.sh names it after the image.
  # ---------------------------------------------------------------------------
  actionlint:
    profiles: ["lint"]
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    command: ["-version"]

  editorconfig-checker:
    profiles: ["lint"]
    image: mstruebing/editorconfig-checker:4.0.1@sha256:c843ca21130986fb1c8c5e09bb38075bd51432ad40cc6db118a6f8cde897db0e
    command: ["editorconfig-checker", "--version"]

networks:
  observability:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
  alloy-data:
