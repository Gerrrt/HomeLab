---
# Source of truth for snmp.yaml.
#
# The committed snmp.yaml is 14k lines of expanded OID definitions produced from
# this file by the snmp_exporter generator. Before this file existed, snmp.yaml
# carried a "manual changes will be lost" warning with no way to regenerate it —
# editing it was a trap.
#
# Regenerate with:  make snmp-generate
#
# Credentials are ${PLACEHOLDERS} resolved at deploy time by
# scripts/render-config.sh. Each device has its own: a single shared community
# is a read credential for every device at once, and SNMPv2c sends it in
# cleartext. See docs/runbooks/rotate-snmp-community.md.
#
# The auth block is also where a device's SNMP version is declared, and every
# tool reads it from here (scripts/snmp-auth.sh): the sops key names, the
# snmp.conf that snmp-verify.sh and snmp-walk.sh hand to net-snmp, and the -e
# flags `make snmp-generate` passes through. A v2c device is one community
# placeholder. A device moved to SNMPv3 authPriv (ADR-0036) looks like this —
# the user name a literal, because USM sends it in the clear header of every
# message, and the two passphrases placeholders. The empty community is
# load-bearing: the generator fills every unset field from its defaults, and
# its default community is the stock `public` string, so a v3 block without
# that line comes out of `make snmp-generate` with a community line holding
# that string beside the user — which .gitleaks.toml's community rule exists
# to catch (it matches this file's comments too, hence the wording here), and
# `make validate` goes red on the generated file. An explicit empty string is
# dropped (omitempty), and snmp-targets.sh --check holds the block to it:
#
#   auth_ilo:
#     community: ""
#     username: prometheus
#     password: ${SNMP_AUTHPASS_ILO}
#     priv_password: ${SNMP_PRIVPASS_ILO}
#     security_level: authPriv
#     auth_protocol: SHA
#     priv_protocol: AES
#     version: 3
#
# authPriv only — snmp-targets.sh --check refuses the other two levels — and
# the device is changed BEFORE this file is, per the runbook's order. Which
# devices are v3 today is the version: line below, nothing else — the iLO
# since 2026-09-20, the UPS card since 2026-09-21 and the switch since
# 2026-11-05, when the CRS326 replaced the MokerLink (#444); the firewall stays
# on v2c for the reasons the ADR gives.

auths:
  # The card's profile was created on 2026-09-20 and this poll switched on
  # 2026-09-21 (#85), on the same procedure as the iLO
  # below: the profile exists on the NMC with an access-control entry for
  # 10.0.99.20 and nothing else. The empty community is explained in the
  # header; it is not a leftover.
  auth_apc:
    community: ""
    username: prometheus
    password: ${SNMP_AUTHPASS_APC}
    priv_password: ${SNMP_PRIVPASS_APC}
    security_level: authPriv
    auth_protocol: SHA
    priv_protocol: AES
    version: 3

  # shiva moved on 2026-09-20 (#85): the user below exists on the iLO for
  # 10.0.99.20 and nothing else, per ADR-0036. The empty community is
  # explained in the header; it is not a leftover.
  auth_ilo:
    community: ""
    username: prometheus
    password: ${SNMP_AUTHPASS_ILO}
    priv_password: ${SNMP_PRIVPASS_ILO}
    security_level: authPriv
    auth_protocol: SHA
    priv_protocol: AES
    version: 3

  # neo moved on 2026-11-05 (#444): the CRS326 replaced the MokerLink, and its
  # v3 user was created at the bench on 2026-10-05 with the agent limited to
  # 10.0.99.20 and no v2c community at all (ADR-0041 decision 4).
  auth_neo:
    community: ""
    username: prometheus
    password: ${SNMP_AUTHPASS_NEO}
    priv_password: ${SNMP_PRIVPASS_NEO}
    security_level: authPriv
    auth_protocol: SHA
    priv_protocol: AES
    version: 3

  auth_pfsense:
    community: ${SNMP_COMMUNITY_PFSENSE}
    security_level: noAuthNoPriv
    auth_protocol: MD5
    priv_protocol: DES
    version: 2

modules:
  # APC Smart-UPS (mjolnir, 10.0.99.10) — standard UPS-MIB.
  # Battery charge, runtime remaining, input/output voltage and load, alarms.
  apc_ups:
    walk:
      - 1.3.6.1.2.1.33.1  # UPS-MIB::upsObjects
      # APC's own tree, for the one thing UPS-MIB has no concept of: the self-test
      # SCHEDULE. UPS-MIB carries upsTestResultsSummary — the LAST result — and
      # nothing that says another test is ever coming. #93 set this card to test
      # itself every fortnight and #249 found that the control keeping that
      # result meaningful was itself unmonitored: if the card drops back to
      # never(5) after a config reset or a firmware update, upsTestResultsSummary
      # holds donePass forever and every rule in ups.rules.yaml stays correctly
      # quiet. UpsBatteryUnproven cannot catch it either — it matches
      # noTestsInitiated(6), and a card that has stopped testing still reads 1.
      #
      # ONE SUBTREE, NOT THE ENTERPRISE ROOT. 1.3.6.1.4.1.318 is enormous and
      # walking it is the pfTablesAddrTable mistake one vendor along; the pfsense
      # module above descends into .1.9 rather than taking it whole for exactly
      # this reason. .7.2 is the diagnostics group: 7 rows, 2 GETBULKs, 0.07s
      # measured against the live card on 2026-09-06.
      #
      # Read that day, and matching what #249 recorded three days earlier:
      #
      #   .7.2.1.0  upsAdvTestDiagnosticSchedule    8   biweeklySinceLastTest
      #   .7.2.3.0  upsAdvTestDiagnosticsResults    1   ok
      #   .7.2.4.0  upsAdvTestLastDiagnosticsDate   "08/28/2026"
      #
      # The enumeration matters and is the one thing easy to get wrong here.
      # PowerNet's own definition runs unknown(1), biweekly(2), weekly(3),
      # atTurnOn(4), never(5), fourWeeks(6), twelveWeeks(7),
      # biweeklySinceLastTest(8), weeklySinceLastTest(9), eightWeeks(10),
      # twentysixWeeks(11), fiftytwoWeeks(12) — read out of the MIB rather than
      # assumed. An older enumeration stopping at 7 would read this card's 8 as
      # out of range, and a rule built on that would be wrong about the one
      # value the card actually holds.
      - 1.3.6.1.4.1.318.1.1.1.7.2  # PowerNet-MIB::upsAdvTest (diagnostics)

  # pfSense (morpheus, 10.0.99.1) — BEGEMOT-PF-MIB, plus one HOST-RESOURCES
  # table. Packet filter counters, state table usage, per-interface pf
  # statistics, and the rows of the process table that belong to Suricata.
  pfsense:
    walk:
      # begemotPf is 12325.1.200, not 12325.1 — the old value swept in all of
      # begemot, including begemotSnmpd's internal tables, and pfTableAddresses
      # below. The subtrees are listed individually rather than walking
      # 12325.1.200 wholesale, because the whole point is to exclude one child.
      - 1.3.6.1.4.1.12325.1.200.1.1   # pfStatus
      - 1.3.6.1.4.1.12325.1.200.1.2   # pfCounter
      - 1.3.6.1.4.1.12325.1.200.1.3   # pfStateTable
      - 1.3.6.1.4.1.12325.1.200.1.4   # pfSrcNodes
      - 1.3.6.1.4.1.12325.1.200.1.5   # pfLimits
      - 1.3.6.1.4.1.12325.1.200.1.6   # pfTimeouts
      - 1.3.6.1.4.1.12325.1.200.1.7   # pfInterfaces
      - 1.3.6.1.4.1.12325.1.200.1.8   # pfInterfaces (detail)
      # .1.9 is pfTables, and it holds two tables of very different cost, so it
      # is descended into rather than taken whole:
      - 1.3.6.1.4.1.12325.1.200.1.9.1 # pfTablesTblNumber   1 row
      - 1.3.6.1.4.1.12325.1.200.1.9.2 # pfTablesTblTable  323 rows, 0.4s
      # .1.9.3 pfTablesAddrTable is DELIBERATELY EXCLUDED — one row per address
      # in every pf table, i.e. every entry of every blocklist. Measured on
      # morpheus at 50,917+ rows still climbing after 20s, against ~1,800 rows
      # for all of begemotPf combined. It pushed the scrape past the 45s
      # scrape_timeout, so pfSense reported down with "context deadline
      # exceeded" while its community was perfectly fine. It grows with every
      # blocklist added, and nothing queries the pfTablesAddr* metrics.
      - 1.3.6.1.4.1.12325.1.200.1.10  # pfLabels
      - 1.3.6.1.4.1.12325.1.200.1.11  # pfLabels (detail)
      # HOST-RESOURCES-MIB hrSWRunTable, three columns, for SuricataStopped
      # (#90). bsnmpd on morpheus loads snmp_hostres.so, so the table is served:
      # 94 rows, 0.04s for a full walk of every column, measured 2026-09-03 from
      # the firewall itself. Suricata is one process per watched interface and
      # the process name cannot tell them apart; hrSWRunParameters can, because
      # pfSense starts each one as `-i <interface> ...`.
      #
      # bsnmpd indexes this table by pid+1, and pfSense restarts every Suricata
      # process on each rule update — roughly daily — so the index is new every
      # day. The dynamic filter below turns these three walks into GETs for the
      # rows whose hrSWRunName is "suricata", so the pid-keyed table does not
      # become 94 churning series for the sake of two.
      #
      # hrSWRunName and hrSWRunParameters are InternationalDisplayString: OCTET
      # STRING with no DISPLAY-HINT, which the generator types as OctetString and
      # the exporter would render as hex. The type override below makes them
      # text, and it reaches the lookup labels because the generator retypes the
      # MIB node before it resolves lookups. Neither is emitted as a metric of
      # its own — `ignore` drops the metric and leaves the lookup working — so
      # what comes out is one hrSWRunStatus series per Suricata process, labelled
      # with its name, its arguments and its index.
      - 1.3.6.1.2.1.25.4.2.1.2   # hrSWRunName        filter + lookup label; not a metric
      - 1.3.6.1.2.1.25.4.2.1.5   # hrSWRunParameters  lookup label ("-i igc0.20 ..."); not a metric
      - 1.3.6.1.2.1.25.4.2.1.7   # hrSWRunStatus      1 running 2 runnable 3 notRunnable 4 invalid
      # HOST-RESOURCES-MIB hrStorageTable, for morpheus's filesystems (#841).
      # morpheus runs no node_exporter, so a full /var (logs, RRD, the
      # blocklists, Suricata's data) was invisible until the box stopped
      # writing. The same snmp_hostres.so serves it as serves hrSWRunTable
      # above. Bytes are Used x AllocationUnits; hrStorageDescr is the mount
      # point (or a memory pool's name) and rides as a label only.
      #
      # Measured 2026-10-03 with scripts/snmp-walk.sh --max-repetitions 25
      # (this module's request size): 751 rows, not the few dozen guessed here
      # first. 16 are real: Real Memory Metrics, Shared Real Memory Metrics,
      # the swap device, and 13 mounts. The other 735 are FreeBSD's kernel
      # allocator zones, "UMA: mbuf", "MALLOC: pf_rule" and so on, each served
      # as a storage row. Walked whole, the four columns are ~3,000 varbinds,
      # ~120 GETBULKs (about 4s at the 33ms each the walk measured) and ~2,250
      # series nothing reads. The walk itself reached the probe's 200-request
      # ceiling in 6.6s while it was still in the seventh column.
      #
      # So the dynamic filter below walks hrStorageDescr alone (751 rows, ~31
      # requests) and GETs the other three columns only for rows whose descr
      # starts with "/", the 13 mounts. Every consumer already selects
      # hrStorageDescr=~"/.*", so nothing it reads is lost.
      #
      # bsnmpd's descr is not the bare mount point: it is
      # "/var, type: zfs, dev: pfSense/var". The rule and the dashboard cut
      # the mount point out with label_replace.
      - 1.3.6.1.2.1.25.2.3.1.3   # hrStorageDescr           lookup label; not a metric
      - 1.3.6.1.2.1.25.2.3.1.4   # hrStorageAllocationUnits bytes per unit
      - 1.3.6.1.2.1.25.2.3.1.5   # hrStorageSize            in units
      - 1.3.6.1.2.1.25.2.3.1.6   # hrStorageUsed            in units
      # IF-MIB receive and transmit errors, per interface, for #914. pf's own
      # interface table above counts bytes and packets but not errors, so a
      # WAN link corrupting frames was invisible here: on 2026-10-05 em0 had
      # 570,172 ifInErrors (CRC, `sysctl dev.em.0.mac_stats.crc_errs`) and was
      # still taking 0.6% of received packets as errors during a download,
      # which caps a single TCP stream at ~20 Mbit/s on a 2 Gbit/s plan.
      # Every other interface read 0. WanReceiveErrors reads the em0 row.
      #
      # Probed first with scripts/snmp-walk.sh, because the MokerLink switch that
      # was then at 10.7.7.2 made probing first the rule:
      #   ifDescr      12 rows, 3 requests, 0.55s
      #   ifInErrors   12 rows, 3 requests, 0.08s
      # ifOutErrors is the same column shape. Counter32, but at the rates
      # errors arrive it wraps in years, not between scrapes.
      - 1.3.6.1.2.1.2.2.1.2      # ifDescr     lookup label ("em0"); not a metric
      - 1.3.6.1.2.1.2.2.1.14     # ifInErrors
      - 1.3.6.1.2.1.2.2.1.20     # ifOutErrors
      # SNMPv2-MIB sysDescr, for #292. pfSense sets this string explicitly
      # rather than taking bsnmpd's default, and it carries both versions this
      # repository records about the box:
      #
      #   pfSense morpheus.matrix.elysium 2.9.0-RELEASE FreeBSD 16.0-CURRENT amd64
      #
      # It is here because `morpheus` runs no node_exporter — it is the FreeBSD
      # appliance that cannot run Alloy — so its OS version had no live
      # counterpart, and the docs drifted a full release without anything able
      # to notice. scripts/check-versions.sh reads it.
      #
      # Probed 2026-09-04 with scripts/snmp-walk.sh before being added here, per
      # the rule the MokerLink switch then at 10.7.7.2 set: 1 row, 1 request,
      # 0.47s, and the four overshoot varbinds (sysObjectID, sysUpTime,
      # sysContact, sysName) all decode — sysObjectID answers
      # .1.3.6.1.4.1.12325.1.1.2.1.1, not the zero-length OBJECT IDENTIFIER
      # that made that switch's ifSpecific poison a whole GETBULK response.
      #
      # That probe is the worst case rather than what runs: sysDescr is a scalar
      # with one instance, so the generator resolves this walk into a GET of
      # 1.3.6.1.2.1.1.1.0 and no GETBULK is issued at scrape time at all.
      - 1.3.6.1.2.1.1.1          # sysDescr
    lookups:
      - source_indexes: [hrSWRunIndex]
        lookup: hrSWRunName
      - source_indexes: [hrSWRunIndex]
        lookup: hrSWRunParameters
      - source_indexes: [hrStorageIndex]
        lookup: hrStorageDescr
      - source_indexes: [ifIndex]
        lookup: ifDescr
    # No drop_source_indexes: during a restart the old and the new pid can both
    # be in the table for one scrape, and hrSWRunIndex is what keeps them
    # distinct series rather than one series with two values.
    overrides:
      hrSWRunName:
        ignore: true
        type: DisplayString
      hrSWRunParameters:
        ignore: true
        type: DisplayString
      hrStorageDescr:
        ignore: true
      ifDescr:
        ignore: true
        type: DisplayString
    filters:
      dynamic:
        # Numeric OIDs, not names: the generator copies this block into
        # snmp.yaml verbatim, and the exporter matches `targets` against the
        # walk list by string equality. A name here would never match, and the
        # whole table would be walked and emitted with no error to say so.
        # `values` are unanchored regexes, hence the anchors.
        - oid: 1.3.6.1.2.1.25.4.2.1.2
          targets:
            - 1.3.6.1.2.1.25.4.2.1.2
            - 1.3.6.1.2.1.25.4.2.1.5
            - 1.3.6.1.2.1.25.4.2.1.7
          values: ["^suricata$"]
        # hrStorageTable: the 13 mounts out of 751 rows (see the walk above).
        - oid: 1.3.6.1.2.1.25.2.3.1.3
          targets:
            - 1.3.6.1.2.1.25.2.3.1.3
            - 1.3.6.1.2.1.25.2.3.1.4
            - 1.3.6.1.2.1.25.2.3.1.5
            - 1.3.6.1.2.1.25.2.3.1.6
          values: ["^/"]

  # MikroTik CRS326-24G-2S+RM on RouterOS 7 (neo, 10.7.7.2), in service since
  # 2026-11-05 (#444, ADR-0041) — IF-MIB, five columns plus sysDescr, and two
  # bridge columns for each port's VLAN (#1387, below).
  #
  # It replaced a MokerLink whose management CPU wedged under exporter polling,
  # bricked once under a full walk, and returned a zero-length ifSpecific that
  # made the exporter discard whole GETBULK responses. This module used to
  # carry a long page of tuning against all of that — max_repetitions 5,
  # retries 2, timeout 7s, a ceiling on walked columns — and none of it applies
  # to this device, so none of it was carried across. The changelog entry for
  # the swap and git history keep the MokerLink's reasoning.
  #
  # Measured 2026-11-07 with scripts/snmp-walk.sh over v3 authPriv, before this
  # module was written:
  #
  #   ifName / ifDescr   29 rows: lo, ether1–ether24, sfp-sfpplus1–2, bridge,
  #                      switch-lan. ifIndex is the port number plus one.
  #   ifHCInOctets       at the exporter's default max_repetitions 25:
  #                      2 requests, 0.23s, 21 overshoot varbinds into
  #                      ifHCInUcastPkts, all decoding
  #   sysDescr           "RouterOS CRS326-24G-2S+ 7.24.6 (long-term)"
  #
  # So the exporter's defaults stand, and the old per-module pins are gone.
  #
  # The octet counters are ifXTable's 64-bit pair, not ifTable's 32-bit one,
  # which wraps in ~34s at gigabit line rate and which rate() cannot detect
  # (#87). The ifDescr lookup stamps a port name on every ifIndex-indexed
  # series, which is what SwitchInterfaceDown's summary and the dashboard's
  # legends read. On RouterOS ifDescr and ifName are the same string.
  #
  # sysDescr now carries the model and the RouterOS release, where the
  # MokerLink's said only "Switch". scripts/check_versions.py selects the
  # pfSense claim by device name, so it is unaffected.
  #
  # dot1qPvid is each port's untagged VLAN, the port map's claim in one series
  # (#1387). It replaces the MokerLink's vlan.cgi page, which the drift check
  # scraped over HTTP until the swap (Lemmiwinks#316); #482 asked for this and
  # was closed because the MokerLink had no Q-BRIDGE-MIB. SwitchPortVlanChanged
  # reads it. Measured 2026-11-11 with scripts/snmp-walk.sh over v3:
  #
  #   dot1qPvid             24 rows, indexed by bridge port 1–24 (ether1–24;
  #                         the SFP+ cages are not bridge ports). Under bridge
  #                         VLAN filtering it is the bridge port's pvid: port 1
  #                         reads 7, ether17 (smaug) 40, ether20 30, as
  #                         network.md has them. 1 request, 0.55s, one
  #                         overshoot into dot1qPortAcceptableFrameTypes.
  #   dot1dBasePortIfIndex  bridge port N is ifIndex N+1 on every row, the same
  #                         port-plus-one as IF-MIB. One overshoot, an OID.
  #   dot1qVlanStaticName   not implemented: 0 rows. So there are no VLAN names.
  #
  # The bridge port is not an ifIndex, so the two lookups chain: bridge port to
  # ifIndex, then ifIndex to ifDescr, and dot1qPvid carries the same port name
  # as every IF-MIB series. scripts/snmp-mibs.sh says why it takes seven MIBs.
  crs326:
    walk:
      - 1.3.6.1.2.1.2.2.1.1        # ifIndex
      - 1.3.6.1.2.1.2.2.1.2        # ifDescr       (metric, and the lookups below)
      - 1.3.6.1.2.1.2.2.1.8        # ifOperStatus  (SwitchInterfaceDown)
      - 1.3.6.1.2.1.31.1.1.1.6     # ifHCInOctets  (64-bit)
      - 1.3.6.1.2.1.31.1.1.1.10    # ifHCOutOctets (64-bit)
      - 1.3.6.1.2.1.1.1            # sysDescr      (model and RouterOS release)
      - 1.3.6.1.2.1.17.7.1.4.5.1.1 # dot1qPvid     (SwitchPortVlanChanged)
      - 1.3.6.1.2.1.17.1.4.1.2     # dot1dBasePortIfIndex (the lookup below)
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifDescr
      - source_indexes: [dot1dBasePort]
        lookup: dot1dBasePortIfIndex
      - source_indexes: [dot1dBasePortIfIndex]
        lookup: ifDescr

  # HPE ProLiant DL360 Gen9 iLO (shiva, 10.0.30.10) — SNMPv2-MIB system group
  # plus the Compaq/HP Insight enterprise tree for hardware health.
  # The CPQ subtrees are listed individually rather than as the enterprise root
  # 1.3.6.1.4.1.232. Several of HPE's MIBs each define that root under a
  # different name (compaq, Compaq), so net-snmp's tree ends up with sibling
  # nodes for the same OID and the generator descends only the first of them.
  # Walking the bare root yields 12 metrics instead of ~1600 — and it does so
  # silently, with no error, which is exactly how it would slip through.
  ilo:
    walk:
      - 1.3.6.1.2.1.1        # SNMPv2-MIB::system
      - 1.3.6.1.4.1.232.1    # cpqSystemInfo
      - 1.3.6.1.4.1.232.2    # cpqDriveArray
      - 1.3.6.1.4.1.232.3    # cpqSm2 / iLO
      - 1.3.6.1.4.1.232.6    # cpqHealth
      - 1.3.6.1.4.1.232.8    # cpqNic
      - 1.3.6.1.4.1.232.9    # cpqIde
      - 1.3.6.1.4.1.232.11   # cpqHost
