---
# Source of truth for snmp.yaml.
#
# The committed snmp.yaml is 14k lines of expanded OID definitions produced from
# this file by the snmp_exporter generator. Before this file existed, snmp.yaml
# carried a "manual changes will be lost" warning with no way to regenerate it —
# editing it was a trap.
#
# Regenerate with:  make snmp-generate
#
# Community strings are ${PLACEHOLDERS} resolved at deploy time by
# scripts/render-config.sh. Each device has its own credential: a single shared
# community is a read credential for every device at once, and SNMPv2c sends it
# in cleartext. See docs/runbooks/rotate-snmp-community.md.

auths:
  auth_apc:
    community: ${SNMP_COMMUNITY_APC}
    security_level: noAuthNoPriv
    auth_protocol: MD5
    priv_protocol: DES
    version: 2

  auth_ilo:
    community: ${SNMP_COMMUNITY_ILO}
    security_level: noAuthNoPriv
    auth_protocol: MD5
    priv_protocol: DES
    version: 2

  auth_mokerlink:
    community: ${SNMP_COMMUNITY_MOKERLINK}
    security_level: noAuthNoPriv
    auth_protocol: MD5
    priv_protocol: DES
    version: 2

  auth_pfsense:
    community: ${SNMP_COMMUNITY_PFSENSE}
    security_level: noAuthNoPriv
    auth_protocol: MD5
    priv_protocol: DES
    version: 2

modules:
  # APC Smart-UPS (mjolnir, 10.0.99.10) — standard UPS-MIB.
  # Battery charge, runtime remaining, input/output voltage and load, alarms.
  apc_ups:
    walk:
      - 1.3.6.1.2.1.33.1  # UPS-MIB::upsObjects

  # pfSense (morpheus, 10.0.99.1) — BEGEMOT-PF-MIB, plus one HOST-RESOURCES
  # table. Packet filter counters, state table usage, per-interface pf
  # statistics, and the rows of the process table that belong to Suricata.
  pfsense:
    walk:
      # begemotPf is 12325.1.200, not 12325.1 — the old value swept in all of
      # begemot, including begemotSnmpd's internal tables, and pfTableAddresses
      # below. The subtrees are listed individually rather than walking
      # 12325.1.200 wholesale, because the whole point is to exclude one child.
      - 1.3.6.1.4.1.12325.1.200.1.1   # pfStatus
      - 1.3.6.1.4.1.12325.1.200.1.2   # pfCounter
      - 1.3.6.1.4.1.12325.1.200.1.3   # pfStateTable
      - 1.3.6.1.4.1.12325.1.200.1.4   # pfSrcNodes
      - 1.3.6.1.4.1.12325.1.200.1.5   # pfLimits
      - 1.3.6.1.4.1.12325.1.200.1.6   # pfTimeouts
      - 1.3.6.1.4.1.12325.1.200.1.7   # pfInterfaces
      - 1.3.6.1.4.1.12325.1.200.1.8   # pfInterfaces (detail)
      # .1.9 is pfTables, and it holds two tables of very different cost, so it
      # is descended into rather than taken whole:
      - 1.3.6.1.4.1.12325.1.200.1.9.1 # pfTablesTblNumber   1 row
      - 1.3.6.1.4.1.12325.1.200.1.9.2 # pfTablesTblTable  323 rows, 0.4s
      # .1.9.3 pfTablesAddrTable is DELIBERATELY EXCLUDED — one row per address
      # in every pf table, i.e. every entry of every blocklist. Measured on
      # morpheus at 50,917+ rows still climbing after 20s, against ~1,800 rows
      # for all of begemotPf combined. It pushed the scrape past the 45s
      # scrape_timeout, so pfSense reported down with "context deadline
      # exceeded" while its community was perfectly fine. It grows with every
      # blocklist added, and nothing queries the pfTablesAddr* metrics.
      - 1.3.6.1.4.1.12325.1.200.1.10  # pfLabels
      - 1.3.6.1.4.1.12325.1.200.1.11  # pfLabels (detail)
      # HOST-RESOURCES-MIB hrSWRunTable, three columns, for SuricataStopped
      # (#90). bsnmpd on morpheus loads snmp_hostres.so, so the table is served:
      # 94 rows, 0.04s for a full walk of every column, measured 2026-09-03 from
      # the firewall itself. Suricata is one process per watched interface and
      # the process name cannot tell them apart; hrSWRunParameters can, because
      # pfSense starts each one as `-i <interface> ...`.
      #
      # bsnmpd indexes this table by pid+1, and pfSense restarts every Suricata
      # process on each rule update — roughly daily — so the index is new every
      # day. The dynamic filter below turns these three walks into GETs for the
      # rows whose hrSWRunName is "suricata", so the pid-keyed table does not
      # become 94 churning series for the sake of two.
      #
      # hrSWRunName and hrSWRunParameters are InternationalDisplayString: OCTET
      # STRING with no DISPLAY-HINT, which the generator types as OctetString and
      # the exporter would render as hex. The type override below makes them
      # text, and it reaches the lookup labels because the generator retypes the
      # MIB node before it resolves lookups. Neither is emitted as a metric of
      # its own — `ignore` drops the metric and leaves the lookup working — so
      # what comes out is one hrSWRunStatus series per Suricata process, labelled
      # with its name, its arguments and its index.
      - 1.3.6.1.2.1.25.4.2.1.2   # hrSWRunName        filter + lookup label; not a metric
      - 1.3.6.1.2.1.25.4.2.1.5   # hrSWRunParameters  lookup label ("-i igc0.20 ..."); not a metric
      - 1.3.6.1.2.1.25.4.2.1.7   # hrSWRunStatus      1 running 2 runnable 3 notRunnable 4 invalid
      # SNMPv2-MIB sysDescr, for #292. pfSense sets this string explicitly
      # rather than taking bsnmpd's default, and it carries both versions this
      # repository records about the box:
      #
      #   pfSense morpheus.matrix.elysium 2.9.0-RELEASE FreeBSD 16.0-CURRENT amd64
      #
      # It is here because `morpheus` runs no node_exporter — it is the FreeBSD
      # appliance that cannot run Alloy — so its OS version had no live
      # counterpart, and the docs drifted a full release without anything able
      # to notice. scripts/check-versions.sh reads it.
      #
      # Probed 2026-09-04 with scripts/snmp-walk.sh before being added here, per
      # the note in the mokerlink module below: 1 row, 1 request, 0.47s, and the
      # four overshoot varbinds (sysObjectID, sysUpTime, sysContact, sysName)
      # all decode — sysObjectID answers .1.3.6.1.4.1.12325.1.1.2.1.1, not the
      # zero-length OBJECT IDENTIFIER that makes the switch's ifSpecific poison
      # a whole GETBULK response.
      #
      # That probe is the worst case rather than what runs: sysDescr is a scalar
      # with one instance, so the generator resolves this walk into a GET of
      # 1.3.6.1.2.1.1.1.0 and no GETBULK is issued at scrape time at all.
      - 1.3.6.1.2.1.1.1          # sysDescr
    lookups:
      - source_indexes: [hrSWRunIndex]
        lookup: hrSWRunName
      - source_indexes: [hrSWRunIndex]
        lookup: hrSWRunParameters
    # No drop_source_indexes: during a restart the old and the new pid can both
    # be in the table for one scrape, and hrSWRunIndex is what keeps them
    # distinct series rather than one series with two values.
    overrides:
      hrSWRunName:
        ignore: true
        type: DisplayString
      hrSWRunParameters:
        ignore: true
        type: DisplayString
    filters:
      dynamic:
        # Numeric OIDs, not names: the generator copies this block into
        # snmp.yaml verbatim, and the exporter matches `targets` against the
        # walk list by string equality. A name here would never match, and the
        # whole table would be walked and emitted with no error to say so.
        # `values` are unanchored regexes, hence the anchors.
        - oid: 1.3.6.1.2.1.25.4.2.1.2
          targets:
            - 1.3.6.1.2.1.25.4.2.1.2
            - 1.3.6.1.2.1.25.4.2.1.5
            - 1.3.6.1.2.1.25.4.2.1.7
          values: ["^suricata$"]

  # MokerLink 26-port managed switch (neo, 10.7.7.2) — IF-MIB, five columns.
  #
  # The tuning below is not cargo cult. This switch's management CPU has locked
  # up under exporter polling before, taking its SNMP agent down while layer 2
  # kept forwarding and the web UI kept answering — which presents as UDP/161
  # timing out while ICMP and TCP/80 succeed. Recovery was a power cycle. What
  # ran afterwards without wedging it used small GETBULK batches and a longer
  # per-request timeout, so those values are pinned here rather than left to
  # the exporter's defaults (max_repetitions 25, retries 3, timeout 5s).
  #
  # Worst case here is retries * timeout = 21s, comfortably inside the job's 45s
  # scrape_timeout.
  #
  # Only the five columns anything actually consumes are walked. This switch was
  # bricked once by a full walk and has wedged since, so scrape volume is a
  # safety property here, not an efficiency one. Five columns x 26 ports is ~130
  # varbinds, about a quarter of what walking the whole ifTable costs. Measured
  # cost is 30 packets, 130 PDUs and ~1.4s per scrape.
  #
  # The octet counters come from ifXTable (1.3.6.1.2.1.31.1.1.1), not ifTable.
  # ifTable's ifInOctets/ifOutOctets are 32-bit and wrap at 4.29 GB — ~34s at
  # gigabit line rate — so at a 60s scrape any port above ~570 Mbit/s sustained
  # silently under-reports, and nothing can detect it afterwards: rate() treats
  # a decrease as a counter reset, never as a wrap. ifHCInOctets/ifHCOutOctets
  # are Counter64 and do not wrap in practice. They replaced the 32-bit pair
  # rather than joining it, so the walk stayed at five columns (#87). Probed
  # 2026-09-01 with scripts/snmp-walk.sh at this module's request shape: 26 rows
  # per column in 6 requests and ~0.5s, the low 32 bits matching ifInOctets on
  # every busy port, and incrementing between walks.
  #
  # ifDescr is walked twice over: once as its own metric and once as the lookup
  # below, which stamps an ifDescr label onto every metric indexed by ifIndex so
  # dashboards and alert summaries can name a port. The lookup is resolved from
  # the varbinds already fetched — it adds nothing to the walk.
  #
  # Column 22 of ifTable (ifSpecific) must never be fetched. This switch returns
  # it with a zero-length value, seen on the wire as
  #
  #   .1.3.6.1.2.1.2.2.1.22.26=
  #
  # An OBJECT IDENTIFIER cannot be zero-length, so snmp-exporter rejects the
  # entire GETBULK response with
  #
  #   error in unmarshalResponse: error parsing OID Value: invalid OID length
  #
  # and the scrape yields nothing — one malformed varbind loses every metric.
  #
  # Note this is why column 21 is absent too, and why listing columns 1-21 did
  # NOT fix it: GETBULK returns the next N varbinds and does not stop at a
  # subtree boundary, so walking .21 overshoots into .22 and the bad varbind
  # comes back anyway. The last column walked must be far enough from .22 that
  # max_repetitions cannot reach it. `overrides: ifSpecific: ignore` does not
  # help either — that only drops the metric, the reply must still be decoded.
  #
  # With 26 rows at max_repetitions 5 each column's final request overshoots by
  # four varbinds into the next column: ifTable .1 -> .2, .2 -> .3, .8 -> .9;
  # ifXTable .6 -> .7, .10 -> .11. All of those decode. ifXTable has no
  # OBJECT IDENTIFIER column at all (its last is .19, a TimeStamp), so the
  # ifSpecific failure cannot recur inside it. The highest ifTable column
  # walked is now .8, further from .22 than before.
  #
  # Adding a column is cheap; adding ifTable .21 or .22 is not. Any new ifTable
  # column past .8 needs to be checked against the overshoot first — and any
  # new column anywhere gets walked with scripts/snmp-walk.sh before it is
  # added here, because the exporter's first contact with a bad varbind is a
  # scrape that returns nothing.
  mokerlink:
    walk:
      - 1.3.6.1.2.1.2.2.1.1     # ifIndex
      - 1.3.6.1.2.1.2.2.1.2     # ifDescr       (metric, and the lookup below)
      - 1.3.6.1.2.1.2.2.1.8     # ifOperStatus  (SwitchInterfaceDown)
      - 1.3.6.1.2.1.31.1.1.1.6  # ifHCInOctets  (64-bit)
      - 1.3.6.1.2.1.31.1.1.1.10 # ifHCOutOctets (64-bit)
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifDescr
    max_repetitions: 5
    retries: 2
    timeout: 7s

  # HPE ProLiant DL360 Gen9 iLO (shiva, 10.0.30.10) — SNMPv2-MIB system group
  # plus the Compaq/HP Insight enterprise tree for hardware health.
  # The CPQ subtrees are listed individually rather than as the enterprise root
  # 1.3.6.1.4.1.232. Several of HPE's MIBs each define that root under a
  # different name (compaq, Compaq), so net-snmp's tree ends up with sibling
  # nodes for the same OID and the generator descends only the first of them.
  # Walking the bare root yields 12 metrics instead of ~1600 — and it does so
  # silently, with no error, which is exactly how it would slip through.
  ilo:
    walk:
      - 1.3.6.1.2.1.1        # SNMPv2-MIB::system
      - 1.3.6.1.4.1.232.1    # cpqSystemInfo
      - 1.3.6.1.4.1.232.2    # cpqDriveArray
      - 1.3.6.1.4.1.232.3    # cpqSm2 / iLO
      - 1.3.6.1.4.1.232.6    # cpqHealth
      - 1.3.6.1.4.1.232.8    # cpqNic
      - 1.3.6.1.4.1.232.9    # cpqIde
      - 1.3.6.1.4.1.232.11   # cpqHost
