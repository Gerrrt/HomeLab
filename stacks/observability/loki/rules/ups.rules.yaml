---
# NUT on morpheus losing its UPS data, read from upsd's log.
#
# morpheus runs the NUT server for the UPS card (`mjolnir`): its driver polls
# the card over SNMPv3, and the secondaries (Saruman, smaug, trinity) learn
# about a power cut only from it. When upsd marks the data stale, every
# secondary is blind for that long. The Prometheus side (ups.rules.yaml) polls
# the card directly, so it keeps reporting the UPS while morpheus has lost it;
# only upsd's log shows the gap.
#
# Measured over the fortnight to 2026-11-23, from Loki: 1,363 stale periods,
# none longer than 5.2 seconds, and never more than 9 in an hour. That is the
# baseline the 2026-11-13 audit of morpheus found and could not yet explain.
# These two rules alert when it gets worse, not on the baseline itself.
#
# A gap that lasts days is not theirs: syslogd folds a repeated line into "last
# message repeated", and their windows move past the first line within
# minutes. NutUpsUnreadable in prometheus/rules/ups.rules.yaml asks upsc on the
# firewall every 15 minutes for that case (scripts/collect-nut-state.sh).
groups:
  - name: ups-nut
    interval: 1m
    rules:
      - alert: NutUpsDataStaleSustained
        # A stale period that has not ended. upsd logs "Data for UPS [...] is
        # stale" when it starts and "data is no longer stale" when it ends, so
        # more starts than ends in the window means one is still open. The
        # `unless` arm covers the case with no end line in the window at all,
        # where the subtraction alone returns nothing. Two minutes is more than
        # twenty times the longest period measured; a real outage that long
        # during a power cut means the secondaries never hear the low-battery
        # signal.
        expr: |
          (
            sum by (host) (count_over_time({app="upsd"} |= "is stale" [15m]))
            -
            sum by (host) (count_over_time({app="upsd"} |= "no longer stale" [15m]))
          ) > 0
          or
          (
            sum by (host) (count_over_time({app="upsd"} |= "is stale" [15m]))
            unless
            sum by (host) (count_over_time({app="upsd"} |= "no longer stale" [15m]))
          )
        for: 2m
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/shut-down-on-the-ups.md"
          summary: "NUT on {{ $labels.host }} has had stale UPS data for over 2 minutes"
          description: >-
            upsd on {{ $labels.host }} marked the UPS's data stale and has not
            recovered. Until it does, a power cut reaches none of the NUT
            secondaries. Check the card answers SNMP (the Prometheus UPS
            panels read it directly), then `upsc mjolnir` and the driver
            (`snmp-ups`) on morpheus; restarting the NUT service from
            Status -> Services is the usual fix.

      - alert: NutUpsDataStaleFrequent
        # The trend, not the event. Short stale periods are the baseline, at up
        # to 9 an hour; twenty in an hour is more than twice the worst hour
        # measured, so the poll is degrading even if each gap still closes.
        expr: |
          sum by (host) (count_over_time({app="upsd"} |= "is stale" [1h])) > 20
        for: 0s
        labels:
          component: power
          severity: warning
          category: power
        annotations:
          runbook_url: "https://github.com/Gerrrt/HomeLab/blob/main/docs/runbooks/shut-down-on-the-ups.md"
          summary: "NUT on {{ $labels.host }} lost the UPS data {{ $value }} times in an hour"
          description: >-
            upsd's data for the UPS went stale more than twice as often as the
            worst hour on record. Each gap is a window in which a power cut
            reaches no secondary. Look at what else polls the card (Prometheus's
            SNMP job, the driver's pollfreq on morpheus) and the card's own
            event log before the gaps start lasting.
