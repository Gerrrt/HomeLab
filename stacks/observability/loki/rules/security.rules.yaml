---
# Log-based alerts, evaluated by Loki's ruler and sent to the same Alertmanager
# as the Prometheus rules.
#
# These exist because some conditions are only visible in logs. A metric can
# tell you sshd is running; only the log tells you it rejected forty passwords
# in five minutes.
#
# Loki rule files use the Prometheus alerting schema with LogQL expressions, so
# `severity` and `category` route through exactly the same Alertmanager tree.
groups:
  - name: authentication
    interval: 1m
    rules:
      # Every rule in this group reads a three-branch union rather than
      # {log_type="authlog"} alone. Until #261 they all began with that single
      # selector, and only two hosts ever produce that label — so the two hosts
      # where root can be reached with a password were structurally invisible:
      #
      #   saruman   Proxmox on Debian 13, journald-only. There is no
      #             /var/log/auth.log for local.file_match "authlogs" to match,
      #             so its sshd lines arrive via loki.source.journal as
      #             log_type="journal", unit="ssh.service".
      #   morpheus  pfSense, not an Alloy host at all. It arrives through
      #             loki.source.syslog "network", which stamps log_type="syslog"
      #             on everything, app="sshd" or "sshd-session".
      #
      # Nothing was missing from the store. The rules just could not see it: a
      # password-guessing run against root@morpheus produced no SshBruteForce at
      # any volume. Same shape as #223 — a rule that reads correctly and cannot
      # fire.
      #
      # Measured 2026-09-05 over 7 days: 54 accepted logins on those two hosts,
      # every one of them invisible to all five rules below.
      #
      # Why `or` and not a wider selector. Three things, in order of how much
      # they hurt:
      #
      #  1. `or` deduplicates. oracle and prometheus ship the same sshd events
      #     twice — once via auth.log, once via the journal — so summing a
      #     combined selector would double-count them and halve every threshold
      #     on the two hosts that currently work. `or` is left-preferring, so
      #     each host is counted once, from its most specific source. Verified:
      #     oracle 129 accepted logins over 7d, not 256.
      #
      #     The branch order matters, because `or` is left-preferring and will
      #     use auth.log's count even if the journal's is higher. That is the
      #     right way round here, measured over the 7 days to 2026-09-05:
      #     auth.log is the *more* complete source on both hosts that have it
      #     (oracle 129 vs 127, prometheus 269 vs 234), and #194 has the journal
      #     delivering a fraction of what it should. Putting `journal` first
      #     would prefer the lossy source. If #194 is ever fixed and the journal
      #     starts reporting more than auth.log, revisit this: the safe form is
      #     a `label_replace` per branch plus `max by (host)`, which is a true
      #     maximum rather than a preference, at the cost of being much harder
      #     to read.
      #  2. `{log_type=~"authlog|journal|syslog"}` costs ~3700 lines per 5m
      #     against ~6 today, and most of that is this stack's own container
      #     logs, which carry neither `unit` nor `app`. The syslog branch is
      #     constrained by `app` for the same reason: morpheus's syslog is
      #     mostly filterlog.
      #  3. Do NOT add log_type="docker" to any of these. Loki's ruler logs its
      #     own query text at info, so a rule matching container logs matches
      #     the string of its own line filter — 23644 hits over 7d for
      #     SudoFailure's pattern alone, every one of them the ruler quoting the
      #     rule back at itself.
      #
      # Fixing the labels at the shipper was the other option #261 raised, and
      # it is worse here: stamping log_type="authlog" on journal sshd lines
      # would put oracle's and prometheus's events under that label twice, which
      # is problem 1 again with no way for a rule to see it. Avoiding that needs
      # host-conditional shipper config.
      #
      # The line format is identical on all four hosts — "Accepted publickey for
      # root from 10.0.99.20 port 48288 ssh2" — so the filters below did not
      # need rewriting, only pointing somewhere they can match.
      - alert: SshBruteForce
        expr: |
          (
            sum by (host) (
              count_over_time({log_type="authlog"} |~ "(?i)failed (password|publickey)" [5m])
            )
            or
            sum by (host) (
              count_over_time({log_type="journal"} |~ "(?i)failed (password|publickey)" [5m])
            )
            or
            sum by (host) (
              count_over_time({log_type="syslog", app=~"sshd.*|sudo|su"} |~ "(?i)failed (password|publickey)" [5m])
            )
          ) > 20
        for: 2m
        labels:
          component: logs
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} failed SSH auths in 5 minutes"
          description: >-
            Sustained authentication failure. On a management-VLAN host this
            should be close to zero — nothing on VLAN 99 is internet-facing.

      - alert: SshBruteForceSevere
        expr: |
          (
            sum by (host) (
              count_over_time({log_type="authlog"} |~ "(?i)failed (password|publickey)" [5m])
            )
            or
            sum by (host) (
              count_over_time({log_type="journal"} |~ "(?i)failed (password|publickey)" [5m])
            )
            or
            sum by (host) (
              count_over_time({log_type="syslog", app=~"sshd.*|sudo|su"} |~ "(?i)failed (password|publickey)" [5m])
            )
          ) > 100
        for: 1m
        labels:
          component: logs
          severity: critical
          category: security
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} failed SSH auths in 5 minutes"

      - alert: SshLoginFromUnexpectedSubnet
        # Accepted logins should only ever originate from Hicks (10.0.50.0/24)
        # or from within management itself. Anything else means a firewall rule
        # is not doing what the documentation claims.
        # The exclusions were re-checked against pfSense's and Proxmox's line
        # formats when #261 widened this, because a substring `!=` is only as
        # good as the format it runs against. Both write the source address the
        # same way OpenSSH always has, and pfSense's trailing key fingerprint is
        # base64 — no dots — so it cannot accidentally satisfy either exclusion.
        # Evaluated over the 7 days to 2026-09-05: no series, so widening added
        # visibility without adding a false positive.
        expr: |
          (
            sum by (host) (
              count_over_time(
                {log_type="authlog"}
                |~ "Accepted (password|publickey)"
                != "10.0.50."
                != "10.0.99."
                [10m]
              )
            )
            or
            sum by (host) (
              count_over_time(
                {log_type="journal"}
                |~ "Accepted (password|publickey)"
                != "10.0.50."
                != "10.0.99."
                [10m]
              )
            )
            or
            sum by (host) (
              count_over_time(
                {log_type="syslog", app=~"sshd.*|sudo|su"}
                |~ "Accepted (password|publickey)"
                != "10.0.50."
                != "10.0.99."
                [10m]
              )
            )
          ) > 0
        for: 1m
        labels:
          component: logs
          severity: critical
          category: security
        annotations:
          summary: "{{ $labels.host }}: SSH login accepted from outside VLAN 50/99"
          description: >-
            Either segmentation is broken or the source ranges in this rule are
            stale. Both are worth knowing about immediately.

      - alert: SudoFailure
        # The journal branch matters more here than for the ssh rules: on a
        # systemd host sudo logs under the session scope (session-34.scope), not
        # under ssh.service, so a unit-constrained selector would miss it. That
        # is why the journal branch below is unconstrained.
        expr: |
          (
            sum by (host) (
              count_over_time({log_type="authlog"} |~ "sudo:.*authentication failure" [10m])
            )
            or
            sum by (host) (
              count_over_time({log_type="journal"} |~ "sudo:.*authentication failure" [10m])
            )
            or
            sum by (host) (
              count_over_time({log_type="syslog", app=~"sshd.*|sudo|su"} |~ "sudo:.*authentication failure" [10m])
            )
          ) > 5
        for: 5m
        labels:
          component: logs
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }}: repeated sudo authentication failures"

      - alert: NewUserOrGroupCreated
        # morpheus is FreeBSD and has no useradd, so the syslog branch will
        # never match there. It is kept for uniformity rather than removed: the
        # five rules in this group reading the same union is worth more than
        # saving one branch that costs nothing when it matches nothing.
        expr: |
          (
            sum by (host) (
              count_over_time(
                {log_type="authlog"}
                |~ "(useradd|groupadd|usermod).*new (user|group)"
                [10m]
              )
            )
            or
            sum by (host) (
              count_over_time(
                {log_type="journal"}
                |~ "(useradd|groupadd|usermod).*new (user|group)"
                [10m]
              )
            )
            or
            sum by (host) (
              count_over_time(
                {log_type="syslog", app=~"sshd.*|sudo|su"}
                |~ "(useradd|groupadd|usermod).*new (user|group)"
                [10m]
              )
            )
          ) > 0
        labels:
          component: logs
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.host }}: a user or group was created"
          description: >-
            Expected during provisioning, worth a second look otherwise.

  - name: system
    interval: 1m
    rules:
      - alert: KernelOomKill
        # The kernel's own record. Complements ContainerOomKilled in
        # containers.rules.yaml, which only sees cgroup events.
        expr: |
          sum by (host) (
            count_over_time({log_type=~"syslog|varlog"} |~ "Out of memory: Kill(ed)? process" [15m])
          ) > 0
        labels:
          component: logs
          severity: warning
          category: capacity
        annotations:
          summary: "{{ $labels.host }}: kernel OOM killer fired"

      - alert: FilesystemRemountedReadOnly
        expr: |
          sum by (host) (
            count_over_time({log_type=~"syslog|varlog"} |~ "Remounting filesystem read-only" [15m])
          ) > 0
        labels:
          component: logs
          severity: critical
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: filesystem remounted read-only"
          description: >-
            Almost always failing storage. The monitoring host runs on a
            thirteen-year-old laptop SSD, so this is not hypothetical.

      - alert: DiskIoErrors
        expr: |
          sum by (host) (
            count_over_time({log_type=~"syslog|varlog"} |~ "(I/O error|ata[0-9]+.*failed|SMART.*FAILED)" [15m])
          ) > 0
        labels:
          component: logs
          severity: critical
          category: hardware
        annotations:
          summary: "{{ $labels.host }}: disk I/O errors in the kernel log"

  # ---------------------------------------------------------------------------
  # Firewall. morpheus pushes syslog to Alloy's network listener; config.alloy
  # labels filterlog lines with app, action, direction and interface.
  #
  # Source and destination addresses are deliberately NOT labels — ADR-0003
  # records label cardinality as this stack's live constraint. They are matched
  # in the line instead, which costs a regex at query time and nothing at
  # ingest.
  #
  # The CSV field order puts src immediately before dst, so `,<src>,<dst>,`
  # anchors both at once rather than matching two addresses anywhere in a line.
  #
  # Regexes below are in BACKTICKS, not double quotes. LogQL string literals use
  # Go escaping rules, where `\.` is not a valid escape sequence inside a
  # double-quoted string — Loki rejects the whole file with "invalid char
  # escape" and the ruler then loads none of these rules. Backticks are LogQL's
  # raw-string form and pass the regex through untouched. This is caught by
  # scripts/check_loki_rules.sh, which boots a real Loki against the file; it is
  # not caught by anything that only parses YAML.
  # ---------------------------------------------------------------------------
  - name: firewall
    interval: 1m
    rules:
      - alert: TerminalSegmentReachedInternalNetwork
        # VLANs 10, 20 and 40 are terminal by design — egress only, no path to
        # anything internal. A PASS from one of them to the lab, trusted or
        # management segment means the rule set is not what this repository
        # says it is. There is no benign version of this.
        expr: |
          sum by (interface) (
            count_over_time(
              {app="filterlog", action="pass"}
              |~ `,10\.0\.(10|20|40)\.[0-9]+,10\.0\.(30|50|99)\.[0-9]+,` [5m]
            )
          ) > 0
        for: 0s
        labels:
          component: logs
          severity: critical
          category: security
        annotations:
          summary: "Segmentation breach: terminal VLAN passed to an internal segment on {{ $labels.interface }}"
          description: >-
            A packet from VLAN 10, 20 or 40 was PASSED toward VLAN 30, 50 or 99.
            ADR-0002 says that path does not exist. Either a rule was changed or
            an interface was reassigned. Treat as a live segmentation failure.

      - alert: IoTAttemptedLateralMovement
        # The mirror image: correctly BLOCKED attempts out of the IoT segment.
        # The control worked. The point is that a camera or a $20 Tuya device
        # repeatedly probing other segments is behaving like something that has
        # been compromised, and nothing else in this stack would show it.
        expr: |
          sum by (interface) (
            count_over_time(
              {app="filterlog", action="block"}
              |~ `,10\.0\.20\.[0-9]+,10\.0\.(30|50|99)\.[0-9]+,` [10m]
            )
          ) > 20
        for: 5m
        labels:
          component: logs
          severity: warning
          category: security
        annotations:
          summary: "{{ $value }} blocked IoT→internal attempts in 10 minutes on {{ $labels.interface }}"
          description: >-
            Segmentation held. Something on VLAN 20 is repeatedly trying to
            leave it — identify the source address from the log line and decide
            whether it is misconfigured or compromised.

      - alert: FirewallLogsStopped
        # The pipeline breaking is indistinguishable from a quiet network, and
        # a quiet firewall log looks exactly like a healthy one. morpheus passes
        # traffic for the whole house; it is never silent for half an hour.
        #
        # This is the rule that notices the syslog listener died, pfSense's
        # remote-logging setting was reset by an update, or Alloy stopped
        # accepting UDP — none of which any other alert here would catch.
        expr: |
          absent_over_time({app="filterlog"}[30m])
        for: 0s
        labels:
          component: logs
          severity: warning
          category: monitoring
        annotations:
          summary: "No firewall logs received for 30 minutes"
          description: >-
            morpheus has stopped shipping filterlog to Loki, or Alloy has
            stopped receiving it. Check Status → System Logs → Settings on
            pfSense, and that UDP 1514 is still published by the alloy
            container.

  # ---------------------------------------------------------------------------
  # DHCP. Kea on morpheus logs a line for every lease it offers, allocates,
  # reuses or releases, and pfSense forwards them to the same listener as
  # filterlog once "DHCP Events" is ticked in Remote Syslog Contents. The app
  # label is `kea-dhcp4`, straight from the syslog program name.
  #
  # These three rules are ADR-0019: device joins become events by reading the
  # DHCP server the estate already runs, rather than by asking eero's cloud
  # what happened on the estate's own wire (#98).
  #
  # A LEASE IS NOT A JOIN. Kea's valid-lifetime here is 7200 seconds, so every
  # device renews about hourly and DHCP4_LEASE_ALLOC is overwhelmingly a
  # renewal: 4732 of them in four days, from 57 distinct MACs. The event worth
  # alerting on is the FIRST line from a MAC on a segment, and that is what the
  # `unless` below expresses — everything seen in the last 10 minutes, minus
  # everything seen in the 7 days before that.
  #
  # `offset` must equal the trigger window, or the two ranges either overlap
  # (and nothing ever fires) or leave a gap (and a device that renews across it
  # fires again).
  #
  # WHY `mac` IS EXTRACTED AT QUERY TIME. It is a parser label, not an ingest
  # label — the same decision, for the same reason, as src and dst in the
  # filterlog rules above: ADR-0003 records label cardinality as this stack's
  # live constraint, and one stream per MAC is the textbook way to detonate it.
  # The regex is in BACKTICKS for the escaping reason at the top of the
  # firewall block.
  #
  # AND WHY THE ADDRESS IS NOT IN `sum by`. It is in the line and it is useful,
  # but grouping by it would defeat the suppression: a known device that renews
  # onto a different address would have no matching series on the right-hand
  # side and would fire as though it were a stranger. The MAC identifies the
  # device; the segment is fixed by the vlan filter; the address is looked up
  # afterwards with the query in the annotation.
  #
  # MEASURED against 13 days of morpheus's own dhcpd.log before any of this was
  # written: 5 first-seen events on VLAN 50 and 0 on VLAN 99. Of the five, one
  # was a device that arrived and stayed, one was a phone rotating its private
  # Wi-Fi address, two were an OUI the inventory places on Skids taking a lease
  # on Hicks for a few minutes, and one was a new machine on a familiar OUI.
  # That rate — roughly one every three days, every one of them worth a glance —
  # is the whole argument for warning rather than critical on 50.
  #
  # PRIVATE MAC ADDRESSES ARE THE NOISE FLOOR AND ARE NOT EXCLUDED. Five of the
  # twenty MACs seen on VLAN 50 are locally administered, which is iOS and
  # Android rotating their per-network addresses; each rotation reads here as a
  # new device. Filtering them out would silence exactly the class of device an
  # intruder would present, so the rate is accepted instead.
  #
  # COLD START: for the first 7 days after DHCP shipping is enabled the
  # right-hand side is empty, so every device announces itself once. That is a
  # bounded, one-time inventory of the segment — about twenty alerts on VLAN 50
  # and three on VLAN 99 — and docs/runbooks/ship-firewall-logs.md says to
  # expect it.
  # ---------------------------------------------------------------------------
  - name: dhcp
    # 5m rather than the 1m used elsewhere in this file. Each evaluation reads
    # a 7-day range, and a device appearing on a segment is not a 60-second
    # response. The 10-minute trigger window is deliberately twice the interval,
    # so no join can fall between two evaluations.
    interval: 5m
    rules:
      - alert: UnknownDeviceOnTrustedSegment
        expr: |
          sum by (mac) (
            count_over_time(
              {app="kea-dhcp4"}
              | regexp `hwtype=1 (?P<mac>[0-9a-f:]{17}).*10\.0\.(?P<vlan>[0-9]{1,3})\.`
              | vlan = "50"
              [10m]
            )
          )
          unless
          sum by (mac) (
            count_over_time(
              {app="kea-dhcp4"}
              | regexp `hwtype=1 (?P<mac>[0-9a-f:]{17}).*10\.0\.(?P<vlan>[0-9]{1,3})\.`
              | vlan = "50"
              [7d] offset 10m
            )
          )
        for: 0s
        labels:
          component: logs
          severity: warning
          category: security
        annotations:
          summary: "{{ $labels.mac }} took a lease on Hicks (VLAN 50) for the first time in 7 days"
          description: >-
            Hicks is the only segment with a path into management, and its
            Wi-Fi is a pre-shared key that people are given. A device here is
            either one of yours, one that rotated its private MAC, or one that
            has the PSK and should not. Find the address with
            {app="kea-dhcp4"} |= "{{ $labels.mac }}" and identify it against
            docs/network.md before deciding which.

      - alert: UnknownDeviceOnManagementSegment
        # The same rule on Winterfell, where it means something else entirely.
        # Nothing joins 99 by accident: it holds the firewall, the UPS and the
        # two monitoring hosts, all on reservations, and its only Wi-Fi path is
        # a device someone has moved onto the management VLAN by hand. Zero
        # first-seen events in 13 days of logs, so this is a tripwire rather
        # than a signal with a rate.
        expr: |
          sum by (mac) (
            count_over_time(
              {app="kea-dhcp4"}
              | regexp `hwtype=1 (?P<mac>[0-9a-f:]{17}).*10\.0\.(?P<vlan>[0-9]{1,3})\.`
              | vlan = "99"
              [10m]
            )
          )
          unless
          sum by (mac) (
            count_over_time(
              {app="kea-dhcp4"}
              | regexp `hwtype=1 (?P<mac>[0-9a-f:]{17}).*10\.0\.(?P<vlan>[0-9]{1,3})\.`
              | vlan = "99"
              [7d] offset 10m
            )
          )
        for: 0s
        labels:
          component: logs
          severity: critical
          category: security
        annotations:
          summary: "{{ $labels.mac }} took a lease on Winterfell (VLAN 99) for the first time in 7 days"
          description: >-
            Something took a DHCP lease on the management segment. Everything
            that belongs there has a reservation and has held it for months.
            Treat as an unauthorised device on the segment where ADR-0002
            says compromise is total, unless you know you just plugged it in.

      - alert: DhcpLeaseLogsStopped
        # Same shape and same reasoning as FirewallLogsStopped above: the two
        # rules before this one fail silently, and a stream that has stopped
        # arriving looks exactly like a segment nobody joined.
        #
        # This is a threshold the data supports. With a 7200-second lease every
        # device renews about hourly, and across the 13 days of dhcpd.log after
        # the firewall settled, the largest gap between two lines was 975
        # seconds. Two hours is seven times that.
        #
        # It catches the fault FirewallLogsStopped cannot: the DHCP content
        # class alone being unticked on morpheus, which leaves filterlog
        # arriving and this stream gone.
        expr: |
          absent_over_time({app="kea-dhcp4"}[2h])
        for: 0s
        labels:
          component: logs
          severity: warning
          category: monitoring
        annotations:
          summary: "No DHCP lease logs received for 2 hours"
          description: >-
            Kea on morpheus has stopped shipping, or Alloy has stopped
            receiving. Check that DHCP Events is still ticked under Status →
            System Logs → Settings. Until it is back, both unknown-device
            rules above are silent rather than clear.

  # ---------------------------------------------------------------------------
  # Intrusion detection. Suricata runs on morpheus in IDS mode — alert only, no
  # blocking — one process per interface, with `interface` on every alert
  # (derived from the syslog facility in alloy/syslog.alloy). Which interfaces
  # are watched is declared in prometheus/rules/ids.rules.yaml, which is also
  # where SuricataStopped lives; docs/runbooks/enable-suricata.md is the
  # procedure. ADR-0006 is why the sensor lives on the firewall rather than the
  # hypervisor.
  #
  # Both rules below aggregate BY INTERFACE. The interfaces were added one at a
  # time precisely so that noise is attributable, and an alert that summed them
  # would throw that away at the moment it matters.
  #
  # NO LOG-BASED "SuricataStopped" RULE, DELIBERATELY.
  #
  # The firewall group above has FirewallLogsStopped because morpheus passes
  # traffic for the whole house and is never silent for thirty minutes — so
  # silence there means the pipeline broke. Suricata is the opposite: a quiet
  # IDS is the expected state on a healthy network, and absence of alerts is
  # indistinguishable from absence of the service. No threshold over this
  # stream can tell them apart, and inventing one would produce exactly the
  # sort of alert that cannot fire while looking like one that can.
  #
  # The SuricataStopped that exists is a process metric, not a log rule (#90):
  # bsnmpd on morpheus serves HOST-RESOURCES-MIB hrSWRunTable, the pfsense SNMP
  # module fetches the rows named "suricata", and ids.rules.yaml fires when a
  # declared interface has no running process behind it. That is the shape
  # prometheus/rules/watchdog.rules.yaml uses for the notification path (#67):
  # something that reports in when healthy, and an observer that acts on the
  # silence. What it cannot see is a process that is running and inspecting
  # nothing; the plaintext test alert in the runbook is still the only proof
  # of detection.
  # ---------------------------------------------------------------------------
  - name: ids
    interval: 1m
    rules:
      - alert: SuricataHighPriorityAlert
        # Priority 1 is Suricata's most severe class — successful exploitation,
        # trojan activity, known-bad command and control. On the IoT segment
        # this warrants looking at the same evening, not the same quarter.
        expr: |
          sum by (interface, classification) (
            count_over_time({app="suricata", priority="1"} [10m])
          ) > 0
        for: 0s
        labels:
          component: logs
          severity: critical
          category: security
        annotations:
          # `interface` is derived from the syslog facility in syslog.alloy, and an
          # unmapped facility leaves it unset on purpose. An empty summary would
          # hide exactly that fault, so say so instead.
          summary: >-
            Suricata priority-1 on
            {{ if $labels.interface }}{{ $labels.interface }}{{ else }}an unlabelled interface{{ end }}:
            {{ $labels.classification }} ({{ $value }} in 10m)
          description: >-
            Highest-severity signature class. Identify the source address from
            the log line. On igc0.20 (Skids) treat the device as compromised
            until shown otherwise rather than as a false positive — that
            segment exists on the assumption that its devices already are. On
            igc0.10 (Degens) it is a guest's device: the segment has no route
            inward (ADR-0013), so the response is to drop it from the guest
            SSID, not to hunt for what it reached.

      - alert: SuricataAlertStorm
        # Deliberately a volume rule rather than a severity one. A sudden flood
        # is either a scan in progress or a ruleset that has started matching
        # normal traffic after an update. Both need a human; neither shows up in
        # a per-signature rule.
        #
        # Per interface, same threshold. Skids ran at roughly two alerts per ten
        # minutes for its first fortnight, so 200 was never derived from the
        # baseline and splitting it does not move it. What the split gives up: a
        # ruleset update that starts matching ordinary traffic on both segments
        # at, say, 101 each fires nothing where a global sum would have. What it
        # buys: the summary names the segment, which is the whole reason the
        # interfaces were enabled one at a time.
        expr: |
          sum by (interface) (count_over_time({app="suricata"} [10m])) > 200
        for: 5m
        labels:
          component: logs
          severity: warning
          category: security
        annotations:
          # Same placeholder as above: unset means an unmapped facility.
          summary: >-
            {{ $value }} Suricata alerts on
            {{ if $labels.interface }}{{ $labels.interface }}{{ else }}an unlabelled interface{{ end }}
            in 10 minutes
          description: >-
            Either something is scanning, or a rule update started matching
            ordinary traffic. Check which signature dominates before tuning —
            silencing a noisy rule that is actually correct is how an IDS
            becomes decorative.
