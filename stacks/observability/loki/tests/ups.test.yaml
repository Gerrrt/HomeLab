---
# Behaviour tests for loki/rules/ups.rules.yaml, run by
# scripts/test_loki_rules.py. The lines are upsd's own wording on morpheus, as
# Loki holds them; Alloy labels them app=upsd, host=morpheus.
tests:
  - alert: NutUpsDataStaleSustained
    name: a stale period with no end fires
    window: 15m
    streams:
      - labels: {app: upsd, host: morpheus}
        entries:
          - before: 5m
            line: "Data for UPS [mjolnir] is stale - check driver"
    expect:
      - {host: morpheus}

  - alert: NutUpsDataStaleSustained
    name: an open period after closed ones fires
    window: 15m
    streams:
      - labels: {app: upsd, host: morpheus}
        entries:
          - before: 10m
            line: "Data for UPS [mjolnir] is stale - check driver"
          - before: 9m
            line: "UPS [mjolnir] data is no longer stale"
          - before: 4m
            line: "Data for UPS [mjolnir] is stale - check driver"
    expect:
      - {host: morpheus}

  - alert: NutUpsDataStaleSustained
    name: short periods that all close stay quiet
    window: 15m
    streams:
      - labels: {app: upsd, host: morpheus}
        entries:
          - before: 10m
            line: "Data for UPS [mjolnir] is stale - check driver"
          - before: 9m58s
            line: "UPS [mjolnir] data is no longer stale"
          - before: 3m
            line: "Data for UPS [mjolnir] is stale - check driver"
          - before: 2m59s
            line: "UPS [mjolnir] data is no longer stale"
    expect: []

  - alert: NutUpsDataStaleFrequent
    name: twenty-one stale periods in an hour fire
    window: 1h
    streams:
      - labels: {app: upsd, host: morpheus}
        entries:
          - before: 50m
            count: 21
            every: 2m
            line: "Data for UPS [mjolnir] is stale - check driver"
    expect:
      - {host: morpheus}

  - alert: NutUpsDataStaleFrequent
    name: the measured worst hour stays quiet
    window: 1h
    streams:
      - labels: {app: upsd, host: morpheus}
        entries:
          - before: 50m
            count: 9
            every: 5m
            line: "Data for UPS [mjolnir] is stale - check driver"
    expect: []
