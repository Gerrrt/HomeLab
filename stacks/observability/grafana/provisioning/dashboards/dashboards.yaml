---
apiVersion: 1

providers:
  - name: homelab
    orgId: 1
    folder: HomeLab
    type: file
    # Dashboards are version-controlled in this repository, so edits made in the
    # Grafana UI are intentionally discarded on restart. Export the JSON and
    # commit it instead — see docs/observability.md.
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
