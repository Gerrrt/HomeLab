# docker-socket-proxy's HAProxy config, for every proxy in front of an Alloy:
# the six compose stacks, which mount this directory, and the agent hosts,
# where scripts/deploy-agent.sh copies it into a volume.
#
# This is tecnativa/docker-socket-proxy v0.5.0's haproxy.cfg.template, byte for
# byte, with two differences:
#
#   1. The bind line is resolved. The image's entrypoint seds ${BIND_CONFIG}
#      into ITS template only, and this file is passed to haproxy as-is, so it
#      carries the value the entrypoint computes when DISABLE_IPV6 is unset.
#
#   2. CONTAINERS=1 allows three paths, not the whole /containers prefix. That
#      is the block marked "homelab" below, and the reason this file exists.
#
# Why 2. Upstream's rule is a prefix match, so CONTAINERS=1 also allowed
# GET /containers/{id}/archive, /export, /top and /changes. POST=0 does not stop
# them, because they are GETs (Tecnativa/docker-socket-proxy#182; the fix,
# Tecnativa/docker-socket-proxy#183, is unmerged). Each one is served by the
# Docker daemon as full root. The result is that a client allowed only to list containers could
# read any file visible inside any container on the host. That includes
# Alloy's own /rootfs, the host's whole filesystem, which #188's dropped
# capabilities otherwise keep 0600 files out of. Measured on prometheus on
# 2026-10-10: all four answered 200 through the proxy.
#
# The three paths are what every client of these proxies sends, read from
# HAProxy's own request log on prometheus over three days: discovery.docker
# and cAdvisor list containers and inspect them, and loki.source.docker reads
# their logs. Anything else under /containers is now refused by the final
# `http-request deny`, the same 403 any other path gets.
#
# The path is url-decoded before matching, and the id class has no `/`, `%` or
# `?`. So an encoded slash, a double encoding or a `..` segment cannot dress up
# another endpoint as one of these three. The `$` anchors are what stop
# /containers/{id}/json/../archive. HAProxy's `path` does not include the query
# string, so ?stdout=1&follow=1 on logs still matches.
#
# scripts/check_socket_proxy.sh boots the pinned image on this file and checks
# both halves: the three paths answer, and archive, export, top, changes,
# stats and the traversal and encoding variants get the proxy's own 403. It
# also rebuilds upstream's template from this file and requires it to equal the
# one in the pinned image. A Dependabot bump that changes upstream's rules
# therefore fails CI, instead of being silently overridden by this copy.
#
# HAProxy reads this only at start. scripts/reload-config.sh signals the
# master to reload it on every `make up`. A config-only change still lands
# without a compose edit.

global
    log stdout format raw daemon "${LOG_LEVEL}"

    pidfile /run/haproxy.pid
    maxconn 4000

    # Turn on stats unix socket
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

    # Allow seamless reloads
    load-server-state-from-file global

    # Use provided example error pages
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket $SOCKET_PATH

backend docker-events
    server dockersocket $SOCKET_PATH
    timeout server 0

frontend dockerfrontend
    bind [::]:2375 v4v6
    http-request deny unless METH_GET || { env(POST) -m bool }

    # Allowed endpoints
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/((stop)|(restart)|(kill)) } { env(ALLOW_RESTARTS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/start } { env(ALLOW_START) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/stop } { env(ALLOW_STOP) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/pause } { env(ALLOW_PAUSE) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/unpause } { env(ALLOW_UNPAUSE) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/auth } { env(AUTH) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/build } { env(BUILD) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/commit } { env(COMMIT) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/configs } { env(CONFIGS) -m bool }
    # BEGIN homelab: CONTAINERS=1 allows these three paths, not the /containers prefix (Tecnativa/docker-socket-proxy#182)
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/json$ } { env(CONTAINERS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/json$ } { env(CONTAINERS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/logs$ } { env(CONTAINERS) -m bool }
    # END homelab
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/distribution } { env(DISTRIBUTION) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/events } { env(EVENTS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/exec } { env(EXEC) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/grpc } { env(GRPC) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/images } { env(IMAGES) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/info } { env(INFO) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/networks } { env(NETWORKS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/nodes } { env(NODES) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/_ping } { env(PING) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/plugins } { env(PLUGINS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/secrets } { env(SECRETS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/services } { env(SERVICES) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/session } { env(SESSION) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/swarm } { env(SWARM) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/system } { env(SYSTEM) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/tasks } { env(TASKS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/version } { env(VERSION) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/volumes } { env(VOLUMES) -m bool }
    http-request deny
    default_backend dockerbackend

    use_backend docker-events if { path,url_dec -m reg -i ^(/v[\d\.]+)?/events }
