---
# Alert routing.
#
# Receiver URLs are secrets (a webhook URL is a bearer credential — anyone
# holding it can post to it), so they are not in this file.
#
# Alertmanager does NOT expand environment variables in its config. The
# supported mechanism is `url_file`, which reads the URL from disk at notify
# time. scripts/render-config.sh decrypts secrets/observability.sops.yaml and
# writes one file per channel into .rendered/, which compose mounts read-only
# at /etc/alertmanager/secrets/. Both the rendered directory and its contents
# are gitignored.
#
# Since #136 the three real channels go to the sensitive tier's own ntfy, and
# urgent and security go to ntfy.sh as well; the receivers section says why.
#
# There are four channels and four destinations. They used to be three names
# for one URL, which meant `urgent` and `default` differed only in how often
# they repeated — a UPS on battery and a slow scrape landed in the same place
# (#66). Point them at three separate topics on whatever receiver you use, so
# the phone can treat them differently: the routing tree below decides which
# alert is urgent, but only a distinct destination can make that audible.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "device", "instance"]
  group_wait: 30s
  group_interval: 5m
  # Don't re-nag every hour for something already known to be broken.
  repeat_interval: 12h

  # FIRST MATCH WINS, and none of these set `continue`, so ORDER IS THE DESIGN.
  # Every category-specific route has to sit above the bare `severity` routes
  # at the bottom; move one below them and it silently stops matching while the
  # config still loads and still validates. scripts/validate.sh asserts the
  # whole table with `amtool config routes test` for exactly that reason.
  routes:
    # --- The dead man's switch, and it has to be first ---------------------
    #
    # Watchdog fires unconditionally and forever (prometheus/rules/watchdog.rules.yaml).
    # Its firing means nothing; its ABSENCE is the signal, so both of these
    # routes exist to make the absence observable in two different ways.
    #
    # `continue: true` on the first is what lets ONE rule produce TWO
    # notifications on two cadences, rather than duplicating the expression in
    # the rule file. It is the only `continue` in this tree — everything below
    # is first-match-wins.
    #
    # 5m to the heartbeat URL, which is a cron-monitor ping watched from off
    # this host. Keep this at or under the external check's period; the runbook
    # states the relationship, so retuning one without the other is visible.
    # group_interval MUST stay below repeat_interval, and 1m is not a tuning
    # preference. A group is only reconsidered on a group_interval tick, and at
    # that tick it notifies only if repeat_interval has already elapsed. Set the
    # two equal and the tick at +5m arrives fractionally BEFORE the deadline it
    # is testing, skips, and sends at +10m instead — a heartbeat at exactly half
    # the advertised rate, with every notification still a success and no metric
    # to say otherwise. Measured on the live stack at 600s between pings against
    # the 300s this file claimed (#120). At 1m the tick granularity is finer
    # than the deadline, so the ping lands at 5m and never later than 6m.
    - receiver: heartbeat
      matchers:
        - alertname = "Watchdog"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
      continue: true

    # 24h to the REAL alert channel. This is the half that catches #67's actual
    # failure: a webhook that is well-formed, reachable, returns 200 and is
    # pointed at nothing. It travels the identical URL real warnings travel, so
    # a deleted topic shows up as a missing daily heartbeat instead of as
    # nothing at all. The heartbeat route above cannot see that, because it
    # proves delivery to a different URL.
    #
    # Since #136 that URL is the in-house ntfy, so this proves the in-house
    # path daily and says nothing about the two ntfy.sh copies urgent and
    # security also send. Those are proved by the cutover drill in
    # docs/runbooks/verify-the-alert-path.md and by every real page after it;
    # a daily Watchdog on the loud channels would teach the phone to ignore
    # them, which is worse than the gap.
    - receiver: default
      matchers:
        - alertname = "Watchdog"
      group_wait: 0s
      repeat_interval: 24h

    # The Loki ruler's Watchdog (#837, loki/rules/watchdog.rules.yaml). Its job
    # is done once the ruler has SENT it: LokiRulerSilent reads the ruler's sent
    # counter. Delivering it anywhere would add nothing, so it goes nowhere, and
    # it is matched by name here, above the severity routes, so nothing below
    # can claim it.
    - receiver: "null"
      matchers:
        - alertname = "LokiRulerWatchdog"

    # Power events page immediately and repeat aggressively — a UPS on battery
    # with no spare battery installed is a short fuse.
    - receiver: urgent
      matchers:
        - severity = "critical"
        - category = "power"
      group_wait: 0s
      repeat_interval: 30m

    # Security gets its own destination at both severities. There are eleven
    # rules labelled category=security across security.rules.yaml,
    # network.rules.yaml and ids.rules.yaml — SSH brute force, a terminal
    # segment reaching the internal network, IoT lateral movement, priority-1
    # Suricata, Suricata not running. Routed on
    # severity alone, the warning-severity half of that list arrived in the
    # default channel on a 12-hour repeat, indistinguishable from a disk
    # filling up. `category = "power"` above is the precedent.
    - receiver: security
      matchers:
        - severity = "critical"
        - category = "security"
      group_wait: 0s
      repeat_interval: 1h

    # Still 4h rather than the default 12h: a brute-force attempt that is still
    # running four hours later is a different situation from one that stopped.
    - receiver: security
      matchers:
        - severity = "warning"
        - category = "security"
      group_wait: 30s
      repeat_interval: 4h

    - receiver: urgent
      matchers:
        - severity = "critical"
      group_wait: 10s
      repeat_interval: 4h

    - receiver: default
      matchers:
        - severity = "warning"

    # Informational alerts are recorded but never notified.
    - receiver: "null"
      matchers:
        - severity = "info"

inhibit_rules:
  # If a host is down, don't also complain about its disks and its scrape.
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname", "instance"]

  - source_matchers: [alertname = "InstanceDown"]
    target_matchers: [severity =~ "warning|critical"]
    equal: ["instance"]

  # A dead agent's three RemoteWriteJobStale fold into AlloyDown, which
  # fires at 10m, before any of them at 15m, and names the fix. They come back
  # on their own if a single job stops while Alloy keeps reporting. On an agent
  # host that makes one notification. On the monitoring host InstanceDown
  # (alloy:12345) still pages first, on purpose. The comment on AlloyDown in
  # stack.rules.yaml says why.
  - source_matchers: [alertname = "AlloyDown"]
    target_matchers: [alertname = "RemoteWriteJobStale"]
    equal: ["instance"]

  # A dead SNMP exporter makes every device look dead.
  - source_matchers: [alertname = "SnmpExporterDown"]
    target_matchers: [alertname = "SnmpTargetUnreachable"]

  # A certificate inside seven days is still inside thirty. The first rule
  # above does not cover this pair — it needs matching alertnames — and the
  # warning is kept firing at Prometheus rather than written to exclude the
  # critical range, so that it never sends a "resolved" for a certificate that
  # is three days from expiry. `name`, not `instance`: the expiry rules
  # aggregate Grafana's two probes into one alert per certificate and drop the
  # URL (#91).
  - source_matchers: [alertname = "TlsCertificateExpiryImminent"]
    target_matchers: [alertname = "TlsCertificateExpiringSoon"]
    equal: ["name"]

  # The same shape for the sensitive tier's seven-day ACME leaves, in hours:
  # a leaf inside 36 is still inside 48, and one stalled renewal pages once
  # (#426).
  - source_matchers: [alertname = "TlsAcmeRenewalStalled"]
    target_matchers: [alertname = "TlsAcmeRenewalLate"]
    equal: ["name"]

  # And for the management consoles nothing can probe, whose expiry comes from
  # a collector rather than the handshake blackbox makes (#857). `endpoint` is
  # that collector's name for the console, unique across the estate.
  - source_matchers: [alertname = "ManagementCertificateExpiryImminent"]
    target_matchers: [alertname = "ManagementCertificateExpiringSoon"]
    equal: ["endpoint"]

receivers:
  - name: "null"

  # Since #136 the three real channels land on the sensitive tier's own ntfy,
  # https://ntfy.matrix.elysium, over Caddy's 443 on this VLAN. Three settings
  # come with that, identical in each in-house entry below, and the anchor
  # keeps them identical:
  #
  #   - The token rides in an Authorization header from a rendered file. Not
  #     ntfy's `?auth=` parameter, which would put it in the URL and Caddy's
  #     access log records the URL.
  #   - The certificate is verified against the TIER'S root, mounted from
  #     certificates/tier-ca.pem. Per receiver, not process-wide: nothing else
  #     Alertmanager talks to is asked to trust it (ADR-0037, docs/security.md).
  #   - Each URL ends `?template=homelab`, the repository's rendering of this
  #     payload in stacks/sensitive/ntfy/templates/homelab.yml, so a phone
  #     shows a title and one line instead of JSON. The ntfy.sh copies get
  #     the same template inline, as URL parameters that render-config.sh
  #     builds from that file, because ntfy.sh cannot load a template file.
  #
  # urgent and security carry a SECOND webhook each, to their ntfy.sh topic,
  # for the phone that is not on the home network and so cannot reach the
  # first. Two entries in one receiver are independent deliveries: either can
  # fail without stopping the other, and each is counted separately in
  # alertmanager_notifications_failed_total. `default` has no external twin
  # on purpose — a slow scrape can wait until the phone is home.
  - name: default
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        http_config: &in-house-ntfy
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/ntfy_token
          tls_config:
            ca_file: /etc/alertmanager/tls/tier-ca.pem

  - name: urgent
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/urgent_url
        send_resolved: true
        http_config: *in-house-ntfy
      - url_file: /etc/alertmanager/secrets/urgent_external_url
        send_resolved: true

  - name: security
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/security_url
        send_resolved: true
        http_config: *in-house-ntfy
      - url_file: /etc/alertmanager/secrets/security_external_url
        send_resolved: true

  # send_resolved: false, deliberately. If Prometheus stops sending Watchdog,
  # Alertmanager expires it after resolve_timeout and the pings simply stop —
  # which is precisely the signal the external check is waiting for. A resolved
  # notification here would be one last successful ping on the way out the door.
  - name: heartbeat
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/heartbeat_url
        send_resolved: false
