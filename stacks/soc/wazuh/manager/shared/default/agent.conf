<!--
  The `default` group's shared agent configuration (#1035). Every agent
  enrolled without a group is in `default`, so this reaches all six of the lab
  domain's agents. The manager serves it in the group's merged.mg; an agent
  that sees the checksum change pulls it and restarts itself to apply it.

  Mounted read-only through /wazuh-config-mount, the way ossec.conf is: the
  image copies that tree over /var/ossec on every start, and copying onto the
  existing placeholder keeps its wazuh:wazuh 0660.

  Why it is here and not in ansible/roles/soc_agents: the agents' own
  ossec.conf is the MSI's, and editing it on each guest would be a second copy
  of agent configuration to keep in step. Here a rebuilt guest gets it on
  enrolment, with nothing on the guest to drift.
-->
<agent_config os="Windows">

  <!--
    Sysmon (ADR-0080): process creation with its command line, image loads,
    network connections by process, and named pipes, from sysmon-modular's
    balanced profile. The MSI's default ossec.conf reads Application, Security
    and System only. The manager's ruleset already decodes this channel
    (0595-win-sysmon_rules.xml, and 0800-0950 by event ID); without this block
    none of it ever reaches the manager.
  -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
