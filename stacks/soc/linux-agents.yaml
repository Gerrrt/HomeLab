---
# The Wazuh agent garuda installs from odin's :8448 (ADR-0092), pinned by
# version and sha256. scripts/stage-agent-msis.sh reads these, fetches the
# package from Wazuh's apt pool and refuses one that does not match.
#
# The version is the manager's (wazuh/wazuh-manager in compose.yaml): an agent
# may not be newer than its manager, and garuda is kept level with it. It was
# built at 4.14.8 and left there when the manager went to 4.14.10. This pin
# was brought level on 2026-11-13, and garuda takes it by
# build-the-analyst-workstation.md §12's upgrade. The six Windows agents keep
# their own pin in ansible/roles/soc_agents/defaults/main.yml.
#
# The hash was taken on 2026-11-13 from the package, and agreed with the
# SHA256 that Wazuh's apt index lists for wazuh-agent 4.14.10-1. That index is
# covered by dists/stable/InRelease, which carries a good signature from the
# Wazuh Signing Key, 0DCF CA55 47B1 9D2A 6099 5060 96B3 EE5F 2911 1145. A bump
# takes the new hash the same way, never from the download alone.
#
# The Velociraptor client .deb has no pin here: it is built on odin, by the
# server, with its config inside, and staging records its hash.
wazuh_agent_deb_version: "4.14.10"
wazuh_agent_deb_sha256: "873cfec3720a7d7a344afc2c646cf5895a04caa3e4dd7b5124987264f711db94"
