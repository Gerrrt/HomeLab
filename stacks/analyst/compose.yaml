---
# The analyst stack: the collector on garuda, Defense's analyst workstation
# (#921), and nothing else.
#
# Deployed on: garuda (10.0.30.62, VLAN 30 / ImaginationLAN), a guest on
#              `Saruman`, VMID 162, cloned by tofu/ from template 910.
# Decided by:  docs/adr/0091-put-a-kali-purple-analyst-workstation-on-saruman.md
#              — why a Kali Purple guest on the defended host, why its SIEM
#              and sensors stay off, and why it is not a domain member.
# Built by:    docs/runbooks/build-the-analyst-workstation.md
# Deploy with: make up STACK=analyst
#
# WHAT IS NOT HERE. Kali Purple bundles a SOC, and none of it runs: Wazuh on
# odin is the SIEM, Zeek on fenrir and Suricata on morpheus are the sensors
# (ADR-0030, ADR-0068). A second SIEM would split the telemetry and the RAM
# between two half-fed systems. What garuda adds (CyberChef, Wireshark, the
# dotfiles-Defense layer) are host tools, not services. dotfiles-Defense's own
# Dockerized detection lab (`siemup`) is the one exception, and only on demand:
# up for an exercise and down after it, and never part of this file.
#
# ---------------------------------------------------------------------------
# On the comments in this file
# ---------------------------------------------------------------------------
# Both services are stacks/sensor's, less Zeek: config.alloy and docker.alloy
# from stacks/observability/alloy/ unchanged, behind the estate's socket
# proxy. The reasoning is in those files and not repeated here.

name: analyst

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Docker socket proxy (#836). The estate's docker-socket-proxy (#193); its
  # comment in stacks/observability/compose.yaml is the reasoning. `:ro` on
  # the socket does not stop POST /containers/create, so a collector holding the
  # socket holds root on the host.
  # Alloy now reaches the API here, GET-only, and the socket stops at this
  # container. Not published.
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    restart: unless-stopped
    logging: *default-logging
    init: true
    networks: [analyst]
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: analyst-docker-socket-proxy
    # stacks/observability's HAProxy config, not the image's template, which
    # with CONTAINERS=1 also allows /containers/{id}/archive and /export
    # (Tecnativa/docker-socket-proxy#182). The estate's proxy has the reasoning.
    command: ["haproxy", "-f", "/usr/local/etc/socket-proxy/haproxy.cfg"]
    environment:
      # The estate's allowlist exactly: what docker.alloy's three components
      # were measured to need (#193). NETWORKS is the one that is not obvious;
      # without it discovery.docker fails and container logs stop while the
      # agent stays healthy.
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      NETWORKS: 1
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../observability/docker-socket-proxy:/usr/local/etc/socket-proxy:ro
    expose:
      - "2375"
    mem_limit: 64m
    memswap_limit: 64m
    # Not read_only, for the estate's measured reason: the entrypoint writes
    # haproxy.cfg from the environment at every start.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The estate's probe (#845); stacks/observability/compose.yaml's
      # docker-socket-proxy has the reasoning.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  # ---------------------------------------------------------------------------
  # Alloy — this guest's collector: host metrics, the journal and container
  # logs, pushed to alexander (ADR-0007, ADR-0028). Nothing here points at the
  # estate.
  #
  # LOG_READ_GID is 4, `adm`, which owns /var/log/*.log on Kali as on Debian
  # and Ubuntu. ALLOY_HOSTNAME defaults to garuda, this stack's one host;
  # render-config.sh writes both anyway.
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: analyst-alloy
    restart: unless-stopped
    logging: *default-logging
    init: true
    pids_limit: 1024
    # A bound, not a measurement: fenrir's, whose Alloy runs these two
    # configs plus a third and peaked at 293 MiB (stacks/sensor). Re-derive
    # from process_resident_memory_bytes{job="garuda-alloy"} in the lab's
    # Prometheus after a fortnight.
    mem_limit: 1024m
    memswap_limit: 1024m
    networks: [analyst]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${LOG_READ_GID:-4}"
      - "473"
    cgroup: host
    environment:
      # alexander, the lab's own stores. Nothing here points at 10.0.99.20,
      # and nothing may (ADR-0007).
      LOKI_URL: http://${LAB_HOST:-10.0.30.40}:${LAB_LOKI_PORT:-3100}/loki/api/v1/push
      PROMETHEUS_REMOTE_WRITE_URL: http://${LAB_HOST:-10.0.30.40}:${LAB_PROMETHEUS_PORT:-9090}/api/v1/write
      ALLOY_HOSTNAME: ${ALLOY_HOSTNAME:-garuda}
      # Read by docker.alloy's three components; the socket is not mounted (#836).
      DOCKER_API: tcp://docker-socket-proxy:2375
      # garuda's token for the lab's ingest proxy (#834), and this stack's one
      # secret. Its other copy is INGEST_TOKEN_GARUDA in secrets/lab.sops.yaml,
      # which the build adds (build-the-analyst-workstation.md §6).
      INGEST_TOKEN: ${INGEST_TOKEN:?set in secrets/analyst.sops.yaml}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../observability/alloy/docker.alloy:/etc/alloy/docker.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      - /:/rootfs:ro
    # /rootfs/run masked: stacks/lab/compose.yaml's alloy has the reason.
    tmpfs:
      - /rootfs/run:size=64k,mode=0755
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    healthcheck:
      # The estate's probe (#845); stacks/observability/compose.yaml's alloy
      # has the reasoning.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345
          && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3
          && head -n1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  analyst:
    driver: bridge

volumes:
  alloy-data:
