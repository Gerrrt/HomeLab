# sshd drop-in for garuda, installed as /etc/ssh/sshd_config.d/10-garuda.conf
# by build-the-analyst-workstation.md §4.
#
# WHY. garuda sits on VLAN 30 beside the lab domain's six, which exist to be
# compromised, and traffic inside the segment crosses no firewall. Kali's stock
# sshd takes passwords on every address, so a domain host that fell could guess
# its way in. This box holds the case notes ADR-0091 keeps off the domain for
# exactly that reason.
#
# sshd takes the first value it reads, and sshd_config includes this directory
# before its own settings, so these win. 10- sorts ahead of Kali's
# 20-systemd-userdb.conf.

# Keys only. analyst's console password (§4) is for the desktop's login screen
# and for sudo, not for SSH.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# Hicks (10.0.50.0/24, the trusted workstations) and phoenix (10.0.30.70, the
# deployment host: install-agent-collectors.sh). Nothing else on the segment
# needs a shell here.
AllowUsers analyst@10.0.50.0/24 analyst@10.0.30.70

# A seat for reading alerts, not a jump host. gsad's UI (127.0.0.1:9392) is
# used from garuda's own desktop (ADR-0093), so nothing needs a tunnel.
# DisableForwarding covers TCP, Unix-socket, agent and X11 forwarding at once;
# AllowTcpForwarding alone leaves AllowStreamLocalForwarding at its default yes.
DisableForwarding yes
