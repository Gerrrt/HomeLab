# Drop-in for ospd-openvas.service on garuda (ADR-0093), installed as
# /etc/systemd/system/ospd-openvas.service.d/netns.conf.
#
# Runs ospd-openvas, and the openvas it spawns, inside the gvmscan namespace,
# whose only path to the segment is scan0 behind the netdev egress fence. The
# namespace must exist first and be torn down last, so ospd Requires= and is
# ordered After= gvm-scan-netns.service.
#
# NetworkNamespacePath joins the persistent namespace /run/netns/gvmscan
# (systemd >= 242; garuda is 262). The unix sockets ospd uses to reach gvmd and
# redis are filesystem paths, unchanged by the namespace; only MQTT crosses it,
# over the veth, to the broker at 10.99.0.1 (openvas.conf's mqtt_server_uri,
# set by the runbook).
[Unit]
Requires=gvm-scan-netns.service
After=gvm-scan-netns.service mosquitto.service

[Service]
NetworkNamespacePath=/run/netns/gvmscan
