# Drop-in for ospd-openvas.service on garuda (ADR-0093), installed as
# /etc/systemd/system/ospd-openvas.service.d/scope.conf.
#
# Loads gvm-scope.nft before the scanner starts, from inside the service's own
# cgroup, which the rule matches and which exists only from this point. A
# failed load fails the start, so the scanner never runs unscoped.
[Service]
ExecStartPre=/usr/sbin/nft -f /etc/nftables.d/gvm-scope.nft
