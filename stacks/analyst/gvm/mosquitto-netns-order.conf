# Drop-in for mosquitto.service on garuda (ADR-0093), installed as
# /etc/systemd/system/mosquitto.service.d/netns.conf.
#
# mosquitto's gvm.conf listener binds 10.99.0.1, the veth address
# gvm-scan-netns.service creates, so the broker must start after it. Wants, not
# Requires: mosquitto is also notus-scanner's broker on loopback, and should
# still come up for that even if the namespace unit is masked; the 10.99.0.1
# listener simply fails to bind then, which only affects the namespaced
# scanner.
[Unit]
Wants=gvm-scan-netns.service
After=gvm-scan-netns.service
