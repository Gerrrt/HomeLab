# MQTT listeners for GVM on garuda (ADR-0093), installed as
# /etc/mosquitto/conf.d/gvm.conf and read through mosquitto.conf's include_dir.
#
# Two listeners, because the broker's two clients are now in two network
# namespaces. notus-scanner runs on the host and reaches it on loopback, as it
# always did. The openvas scanner runs in the gvmscan namespace and reaches it
# over the veth, at the host end, 10.99.0.1. Defining any listener drops
# mosquitto's implicit localhost one, so both are named here.
#
# anonymous, as the stock single-host setup is: the broker carries scan
# progress between two of garuda's own daemons, on loopback and a
# host-to-namespace veth that reaches nothing else. The veth listener binds
# 10.99.0.1, which gvm-scan-netns.service creates, so mosquitto is ordered
# after it (mosquitto-netns-order.conf); started on its own with the namespace
# down, the bind fails, which is the safe direction.
listener 1883 127.0.0.1
listener 1883 10.99.0.1
allow_anonymous true
