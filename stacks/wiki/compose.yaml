---
# The Lemmiwinks wiki: the middle of ADR-0011's three documentation tiers, the
# one the household reads, on the host ADR-0015 ratified for it.
#
# Deployed on: oracle (10.0.99.30, VLAN 99). Wiki.js and its Postgres have run
#              there since 2025-11-12, created by hand with `docker run` and
#              described by nothing until this file (#251). The containers this
#              file replaced are recorded in README.md, with the cutover.
# Deploy with:  NOT `make up STACK=wiki`. oracle has no age identity and must
#              not get one — ADR-0015 put the estate's ciphertext there on the
#              condition that no key which opens it sits beside it — so there
#              is no secrets file to render. A change reaches oracle from a
#              checkout of this repository at /opt/wiki/HomeLab: fetch, verify
#              the commit's signature against the same pinned fingerprint
#              scripts/converge.sh uses, fast-forward, `docker compose up -d`,
#              by hand (ADR-0082, #847). Nothing on oracle pulls from main on
#              its own. README.md has the procedure.
#
# ---------------------------------------------------------------------------
# What is state here, and what is not
# ---------------------------------------------------------------------------
# All of it is in Postgres. Since the move to Wiki.js 3.x (#1339) the tables
# sit in schema `wiki`, not `public`. The 2.x database, read on 2026-11-09 for
# the rehearsal, held 108 pages, 806 history rows, 4 users, 3 groups and the
# navigation. 3.x's importer carries pages, history, users (password hashes
# and TOTP secrets included), groups and navigation. It does not carry module
# settings, so the git storage target and its deploy key are re-entered by
# hand at cutover; stacks/wiki/README.md has the steps.
#
# Everything under /wiki/data is derived from the database or from GitHub:
# repo/ is the git target's clone of Gerrrt/Lemmiwinks, and the rest is cache
# and staging. 3.x declares two VOLUMEs, /wiki/data/content and
# /wiki/data/repo. content/ is unused, since the only storage target enabled
# is git, so it is a tmpfs below: Docker gets a mount at the declared path and
# creates no anonymous volume for it. Enabling "Local File System" storage at
# that path would need a volume there first.
#
# So the backup is a pg_dump and nothing else — scripts/backup-wiki.sh, run on
# prometheus, pulling (ADR-0065). wiki3-data and wiki3-repo are named volumes
# so that a recreate does not re-clone the repository, not because they hold
# anything. They are new for 3.x: the 2.x volumes, pgdata and wiki-data, are
# kept untouched as the rollback (see `volumes:` at the end).
#
# ---------------------------------------------------------------------------
# On the comments in this file
# ---------------------------------------------------------------------------
# The settings shared with stacks/observability and stacks/sensitive — why
# `init: true`, why `pids_limit`, the healthcheck shape — are argued in those
# files and not repeated. What IS written out is what was measured on the
# pinned images, on this host.

name: wiki

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [wiki]
  init: true
  pids_limit: 512

services:
  # ---------------------------------------------------------------------------
  # Wiki.js
  # ---------------------------------------------------------------------------
  # Pinned by tag and digest; the image line is the only place the version is
  # written, because Dependabot rewrites that line and nothing else. The first
  # pin, on 2026-09-30, was the digest the hand-run container had been created
  # from — the `2` tag it was pulled by had already moved on, which is the
  # whole argument for pinning. An upgrade is a Dependabot bump reviewed here,
  # then README.md's fetch on the host; never a pull there.
  #
  # UPGRADE_COMPANION is NOT set. The old container had it, and beside it ran
  # requarks' update companion with the Docker socket mounted — a container
  # whose job is to pull a newer image and recreate this one outside any
  # compose file. It is removed, not carried over: it would undo every pin
  # below on the day it worked.
  #
  # MEASURED 2026-11-09 on 3.3.0, in #1339's rehearsal on oracle, under the
  # settings below. Re-check the ones a bump could move — the uid, the paths it
  # writes, the health path, wget — when one lands:
  #   1. It runs as `node`, uid 1000 — the same number as the operator's
  #      account on oracle, which is why the secret below can be 0400 and
  #      owned by that account rather than world-readable.
  #   2. It writes /wiki/data, its two declared VOLUMEs /wiki/data/content and
  #      /wiki/data/repo, /home/node and /tmp, and nothing else; it boots
  #      read-only with those mounted.
  #   3. It listens on 3000 only. 3443 is declared in the image, and nothing
  #      listens on it.
  #   4. 3.x has no health route: /healthz is a 404, and every other unknown
  #      path returns the app shell with 200, which would prove nothing.
  #      /_site/current/favicon is answered by the server out of the database,
  #      so it fails when the app or Postgres does. GNU wget is present.
  #   5. Peak 246 MiB after the import and 108 renders. The image bundles
  #      headless Chrome, but it runs only for server-side renders (approving
  #      a suggested edit), not on the markdown edit path, so 512 MiB stays.
  app:
    <<: *service-defaults
    image: ghcr.io/requarks/wiki:3.3.0@sha256:9cd23ece11ac49d2cbdb1d75a96224c8959a35d15b5dd969fa7fa9c325dbc357
    container_name: wiki-app
    user: "1000:1000"
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000
      # The git module's known_hosts and whatever headless Chrome keeps. Not
      # sized by measurement: 64m is a ceiling, not a reading.
      - /home/node:size=64m,uid=1000,gid=1000,mode=0700
      - /wiki/data/content:size=1m,uid=1000,gid=1000
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: wiki
      DB_NAME: wiki
      # Wiki.js reads the password from this file itself. A file and not a
      # ${VAR:?} guard because this stack has no secrets file to render one
      # from (see the header); .env.example says where it lives on the host,
      # who owns it and why its mode is 0400.
      DB_PASS_FILE: /etc/wiki/.db-secret
    volumes:
      - ${WIKI_DB_SECRET:?set in .env — see .env.example}:/etc/wiki/.db-secret:ro
      - wiki3-data:/wiki/data
      - wiki3-repo:/wiki/data/repo
    # Not published. Caddy below is the only way in, and it speaks TLS; a
    # login that reached 3000 from the segment would cross it in clear, which
    # is what #847 closed. Until then this was "80:3000" on every interface.
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/_site/current/favicon"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Caddy: TLS in front of Wiki.js (ADR-0082, #847)
  # ---------------------------------------------------------------------------
  # Serves 443 with a leaf from the estate's CA — `make certs` on prometheus,
  # carried to oracle by hand, README.md § TLS — and answers 80 with nothing
  # but a redirect to it, so the name on the printed card (ADR-0023) still
  # works and no form is ever posted to Wiki.js in clear. No ACME, no issuer,
  # no renewal daemon: the leaf lasts 825 days and blackbox's expiry alerts
  # are the reminder, as for Grafana's.
  #
  # The image is the sensitive tier's, digest for digest, so one Dependabot
  # bump reviews both.
  #
  # MEASURED 2026-10-07 on the pinned image:
  #   1. /usr/bin/caddy carries cap_net_bind_service=ep as a file capability.
  #      Run as a non-root uid with no-new-privileges, the exec is refused
  #      outright ("operation not permitted") — the kernel will not grant the
  #      file capability and will not run the binary without it. So this runs
  #      as root with every capability dropped but NET_BIND_SERVICE, the
  #      sensitive tier's shape, and listens on 80 and 443 itself.
  #   2. Root here holds no CAP_DAC_OVERRIDE, so it reads the key through the
  #      group bits like any other uid: the key is 0640 and owned 1000:1000,
  #      and gid 1000 is added below. .env.example says the same.
  #   3. busybox wget is present, for the healthcheck, and has no
  #      --max-redirect, so it checks 443 rather than the redirect on 80.
  caddy:
    <<: *service-defaults
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    container_name: wiki-caddy
    # Its own name, on the stack's network, for the healthcheck below: the
    # handshake is chosen by SNI, and busybox wget sends the URL's host as it.
    networks:
      wiki:
        aliases:
          - lemmiwinks.matrix.elysium
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    group_add:
      - "1000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
      # Caddy's storage and autosave. Nothing is issued, so nothing here is
      # worth keeping across a recreate.
      - /data:size=16m
      - /config:size=1m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # cert.pem and key.pem, and nothing else: never the CA's key.
      - ${WIKI_TLS_DIR:?set in .env — see .env.example}:/etc/caddy/tls:ro
    ports:
      # The household reaches it as https://lemmiwinks.matrix.elysium; blackbox
      # probes that name and the bare address over https and verifies the
      # chain (prometheus/targets/blackbox.yaml). 80 only redirects.
      - "80:80"
      - "443:443"
    healthcheck:
      # Through the TLS listener and the proxy to the path the app's own
      # healthcheck uses (3.x has no /healthz; see the app's note 4), so a
      # missing key, a refused handshake or a dead upstream all fail it. By
      # name, through the alias above: dialled as 127.0.0.1 the SNI matches no
      # policy and the handshake is refused. The chain is not checked here —
      # the container trusts no estate CA — and blackbox is what checks it.
      test:
        - CMD
        - wget
        - -qO
        - /dev/null
        - --no-check-certificate
        - https://lemmiwinks.matrix.elysium/_site/current/favicon
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------------
  # Pinned by tag and digest, the version on the image line alone, as above;
  # the first pin was the digest the hand-run container was created from.
  # Dependabot is told to ignore majors here: a major upgrade is a dump and a
  # restore, not a bump, and README.md § Upgrading has it.
  #
  # The cluster is Wiki.js 3.x's, in `wiki3-pgdata` — external, so it is
  # created by hand at cutover and never by this file, and `down -v` cannot
  # remove it. 3.x is not an in-place upgrade of 2.x's database: it starts on
  # an empty one and imports a `.wkbackup` (#1339). The 2.x cluster stays in
  # `pgdata`, unmounted, as the rollback. PGDATA is the image's default for 17
  # and must stay that way, or Postgres would start an empty cluster beside
  # the real one. 3.x needs the `ltree` and `pg_trgm` extensions, which this
  # image ships (read 2026-11-09).
  #
  # No password is given to this container in normal running. The entrypoint
  # only reads one to INITIALISE an empty cluster, so the secret is mounted
  # into the app alone. Initialising a fresh cluster — the cutover, or a
  # restore onto an empty volume — is the one time it is needed, and
  # WIKI_DB_BOOTSTRAP_PASSWORD carries it for that one `up`; README.md has
  # both procedures.
  #
  # MEASURED 2026-09-30, on the image pinned that day: uid 999; 50 MiB
  # resident; pg_hba trusts the local socket and wants scram over the network,
  # which is how the app connects and what backup-wiki.sh's `docker exec …
  # pg_dump` relies on.
  db:
    <<: *service-defaults
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    container_name: wiki-db
    user: "999:999"
    mem_limit: 256m
    memswap_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0755
      - /tmp:size=64m
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${WIKI_DB_BOOTSTRAP_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - wiki3-pgdata:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wiki", "-d", "wiki"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  wiki:

volumes:
  # The Postgres cluster: every account, page, revision and setting. Created by
  # hand at the 3.x cutover (`docker volume create wiki3-pgdata`) —
  # `external` means `docker compose down -v` cannot remove it. Backed up by
  # scripts/backup-wiki.sh as a pg_dump, never as this directory.
  wiki3-pgdata:
    external: true
    name: wiki3-pgdata
  # Wiki.js's working directory and the git target's clone. Derived, both; kept
  # only so a recreate does not re-clone. Not backed up, by decision (ADR-0065).
  wiki3-data:
  wiki3-repo:
  # THE ROLLBACK. The 2.x cluster, created by the hand-run container on
  # 2025-11-12 and untouched since the cutover, and 2.x's working directory.
  # Mounted by nothing. Going back to 2.x is this file at the commit before
  # the move, which mounts them again. Removed by a later change, once 3.x has
  # run long enough that nobody would go back.
  pgdata:
    external: true
    name: pgdata
  wiki-data:
