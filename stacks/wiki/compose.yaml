---
# The Lemmiwinks wiki: the middle of ADR-0011's three documentation tiers, the
# one the household reads, on the host ADR-0015 ratified for it.
#
# Deployed on: oracle (10.0.99.30, VLAN 99). Wiki.js and its Postgres have run
#              there since 2025-11-12, created by hand with `docker run` and
#              described by nothing until this file (#251). The containers this
#              file replaced are recorded in README.md, with the cutover.
# Deploy with:  NOT `make up STACK=wiki`. oracle has no age identity and must
#              not get one — ADR-0015 put the estate's ciphertext there on the
#              condition that no key which opens it sits beside it — so there
#              is no secrets file to render. A change reaches oracle from a
#              checkout of this repository at /opt/wiki/HomeLab: fetch, verify
#              the commit's signature against the same pinned fingerprint
#              scripts/converge.sh uses, fast-forward, `docker compose up -d`,
#              by hand (ADR-0082, #847). Nothing on oracle pulls from main on
#              its own. README.md has the procedure.
#
# ---------------------------------------------------------------------------
# What is state here, and what is not
# ---------------------------------------------------------------------------
# All of it is in Postgres. Wiki.js 3.x keeps it in the schema `wiki` of the
# database `wiki` (DB_SCHEMA's default), on the volume `pgdata-wiki3`: every
# page and its history, the accounts, the navigation, every setting, the
# uploaded file (in the `db` storage target, which 3.x cannot turn off), and
# the git storage target's configuration, deploy key included. Rehearsed on
# 2026-11-09 from the set of that morning (#1339): 108 pages, 762 history rows
# carried, 4 accounts. Everything under /wiki/data is derived from it or from
# GitHub: repo/ is the git target's working copy, secure/ the deploy key 3.x
# writes out of the database, cache/ the icon and file caches.
#
# /wiki/data/content and /wiki/data/repo are the image's two declared VOLUMEs.
# content/ is the `disk` target's default root, and no disk target is
# enabled. repo/ is the git target's working copy, which 3.x calls "a cache it
# rebuilds from the remote whenever it needs to": 2.8 MB for the whole wiki in
# the rehearsal. Both are tmpfs below, so that Docker has a mount at each
# declared path and creates no anonymous volume; a recreate re-clones.
#
# So the backup is a pg_dump and nothing else — scripts/backup-wiki.sh, run on
# prometheus, pulling (ADR-0065). wiki-data is a named volume for the caches,
# not because it holds anything.
#
# The 2.x cluster, on the volume `pgdata`, is declared below and mounted by
# nothing. It is the rollback until the move to 3.x is proved, and it is
# retired by the follow-up to #1339, not by this file.
#
# ---------------------------------------------------------------------------
# On the comments in this file
# ---------------------------------------------------------------------------
# The settings shared with stacks/observability and stacks/sensitive — why
# `init: true`, why `pids_limit`, the healthcheck shape — are argued in those
# files and not repeated. What IS written out is what was measured on the
# pinned images, on this host.

name: wiki

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [wiki]
  init: true
  pids_limit: 512

services:
  # ---------------------------------------------------------------------------
  # Wiki.js
  # ---------------------------------------------------------------------------
  # Pinned by tag and digest; the image line is the only place the version is
  # written, because Dependabot rewrites that line and nothing else. An upgrade
  # is a Dependabot bump reviewed here, then README.md's fetch on the host;
  # never a pull there. 3.3.0 is the floor: every 3.x before it has a published
  # advisory, and twelve were published between 2026-11-02 and 2026-11-09
  # (ADR-0108). scripts/wiki_watch.py reads them against this line weekly.
  #
  # Wiki.js 3.x cannot upgrade a 2.x database in place. The move was a 2.x
  # export into a fresh 3.x on an empty database (ADR-0108, README.md § The
  # move to 3.x), which is why the database is on a new volume.
  #
  # UPGRADE_COMPANION is NOT set, and requarks' update companion is not run:
  # it held the Docker socket and recreated Wiki.js outside any compose file,
  # which would undo every pin here the day it worked.
  #
  # MEASURED 2026-11-09, on 3.3.0, in a scratch project on oracle with this
  # service's hardening (#1339). Re-check them when a bump lands:
  #   1. It runs as `node`, uid 1000 — the same number as the operator's
  #      account on oracle, which is why the secret below can be 0400 and
  #      owned by that account rather than world-readable.
  #   2. It writes /wiki/data, its two declared VOLUMEs under it, /home/node
  #      and /tmp, and nothing else; it boots read-only with those.
  #   3. It listens on 3000 only. The image declares 3443 too, and nothing
  #      listens on it.
  #   4. There is no health route. /healthz is a 404, and every other path
  #      that is not a page answers 200 with the app shell. The server's own
  #      route /_site/<hostname>/favicon resolves the site and serves its
  #      icon, so it is the check: it proves the app is serving, as 2.x's
  #      /healthz did, and like that one it does not query the database (the
  #      site config is cached). The hostname is named, not `current`:
  #      `current` resolves the request's Host, which is 127.0.0.1 here and
  #      matches no site once the site has a hostname of its own. A named one
  #      falls back to the `*` site as well (#1345 review). GNU wget is
  #      present. Caddy keeps /healthz as the wiki's public health URL and
  #      maps it there (Caddyfile).
  #   5. Peak 246 MiB after importing the whole wiki and rendering its 108
  #      pages; 14 threads. The image carries headless Chrome, which 3.x
  #      launches only to render a page on the server (approving a suggested
  #      edit), never on the markdown editor's path, so 512 MiB stands.
  #   6. DB_PASS_FILE still works. The cluster needs `ltree` and `pg_trgm`,
  #      which the postgres image below ships.
  app:
    <<: *service-defaults
    image: ghcr.io/requarks/wiki:3.3.0@sha256:9cd23ece11ac49d2cbdb1d75a96224c8959a35d15b5dd969fa7fa9c325dbc357
    container_name: wiki-app
    user: "1000:1000"
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000
      - /home/node:size=8m,uid=1000,gid=1000,mode=0700
      - /wiki/data/content:size=1m,uid=1000,gid=1000
      - /wiki/data/repo:size=64m,uid=1000,gid=1000
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: wiki
      DB_NAME: wiki
      # Wiki.js reads the password from this file itself. A file and not a
      # ${VAR:?} guard because this stack has no secrets file to render one
      # from (see the header); .env.example says where it lives on the host,
      # who owns it and why its mode is 0400.
      DB_PASS_FILE: /etc/wiki/.db-secret
      # Read on the FIRST start against an empty database only, to create the
      # account that runs the import, and logged as ignored on every start
      # after. Set for that one `up` and never written down, like
      # WIKI_DB_BOOTSTRAP_PASSWORD below; README.md § The move to 3.x. Left
      # empty on an empty database, 3.x falls back to admin@example.com and
      # 12345678, so never start it on an empty volume without them.
      ADMIN_EMAIL: ${WIKI_ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_PASS: ${WIKI_ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - ${WIKI_DB_SECRET:?set in .env — see .env.example}:/etc/wiki/.db-secret:ro
      - wiki-data:/wiki/data
    # Not published. Caddy below is the only way in, and it speaks TLS; a
    # login that reached 3000 from the segment would cross it in clear, which
    # is what #847 closed. Until then this was "80:3000" on every interface.
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/_site/lemmiwinks.matrix.elysium/favicon"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Caddy: TLS in front of Wiki.js (ADR-0082, #847)
  # ---------------------------------------------------------------------------
  # Serves 443 with a leaf from the estate's CA — `make certs` on prometheus,
  # carried to oracle by hand, README.md § TLS — and answers 80 with nothing
  # but a redirect to it, so the name on the printed card (ADR-0023) still
  # works and no form is ever posted to Wiki.js in clear. No ACME, no issuer,
  # no renewal daemon: the leaf lasts 825 days and blackbox's expiry alerts
  # are the reminder, as for Grafana's.
  #
  # The image is the sensitive tier's, digest for digest, so one Dependabot
  # bump reviews both.
  #
  # MEASURED 2026-10-07 on the pinned image:
  #   1. /usr/bin/caddy carries cap_net_bind_service=ep as a file capability.
  #      Run as a non-root uid with no-new-privileges, the exec is refused
  #      outright ("operation not permitted") — the kernel will not grant the
  #      file capability and will not run the binary without it. So this runs
  #      as root with every capability dropped but NET_BIND_SERVICE, the
  #      sensitive tier's shape, and listens on 80 and 443 itself.
  #   2. Root here holds no CAP_DAC_OVERRIDE, so it reads the key through the
  #      group bits like any other uid: the key is 0640 and owned 1000:1000,
  #      and gid 1000 is added below. .env.example says the same.
  #   3. busybox wget is present, for the healthcheck, and has no
  #      --max-redirect, so it checks 443 rather than the redirect on 80.
  caddy:
    <<: *service-defaults
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    container_name: wiki-caddy
    # Its own name, on the stack's network, for the healthcheck below: the
    # handshake is chosen by SNI, and busybox wget sends the URL's host as it.
    networks:
      wiki:
        aliases:
          - lemmiwinks.matrix.elysium
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    group_add:
      - "1000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
      # Caddy's storage and autosave. Nothing is issued, so nothing here is
      # worth keeping across a recreate.
      - /data:size=16m
      - /config:size=1m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # cert.pem and key.pem, and nothing else: never the CA's key.
      - ${WIKI_TLS_DIR:?set in .env — see .env.example}:/etc/caddy/tls:ro
    ports:
      # The household reaches it as https://lemmiwinks.matrix.elysium; blackbox
      # probes that name and the bare address over https and verifies the
      # chain (prometheus/targets/blackbox.yaml). 80 only redirects.
      - "80:80"
      - "443:443"
    healthcheck:
      # Through the TLS listener and the proxy to Wiki.js's own /healthz, so a
      # missing key, a refused handshake or a dead upstream all fail it. By
      # name, through the alias above: dialled as 127.0.0.1 the SNI matches no
      # policy and the handshake is refused. The chain is not checked here —
      # the container trusts no estate CA — and blackbox is what checks it.
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://lemmiwinks.matrix.elysium/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------------
  # Pinned by tag and digest, the version on the image line alone, as above;
  # the first pin was the digest the hand-run container was created from.
  # Dependabot is told to ignore majors here: a major upgrade is a dump and a
  # restore, not a bump, and README.md § Upgrading has it.
  #
  # The cluster is Wiki.js 3.x's, in the external volume `pgdata-wiki3`,
  # created by hand for the move (README.md § The move to 3.x) and never by
  # this file. PGDATA is the image's default for 17 and must stay that way, or
  # Postgres would start an empty cluster beside the real one. The 2.x cluster
  # in `pgdata` is not mounted; see the volumes below.
  #
  # No password is given to this container in normal running. The entrypoint
  # only reads one to INITIALISE an empty cluster, and this one is initialised
  # once, at the move, so the secret is mounted into the app alone.
  # Initialising a fresh cluster — a restore onto an empty volume — is the one
  # time it is needed, and WIKI_DB_BOOTSTRAP_PASSWORD carries it for that one
  # `up`; README.md § Restore has the procedure.
  #
  # MEASURED 2026-09-30, on the image pinned that day: uid 999; 50 MiB
  # resident; pg_hba trusts the local socket and wants scram over the network,
  # which is how the app connects and what backup-wiki.sh's `docker exec …
  # pg_dump` relies on.
  db:
    <<: *service-defaults
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    container_name: wiki-db
    user: "999:999"
    mem_limit: 256m
    memswap_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0755
      - /tmp:size=64m
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${WIKI_DB_BOOTSTRAP_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata-wiki3:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wiki", "-d", "wiki"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  wiki:

volumes:
  # The Postgres cluster of Wiki.js 3.x: every account, page, revision and
  # setting. Created by hand at the move (`docker volume create pgdata-wiki3`),
  # and `external` so that `docker compose down -v` cannot remove it. Backed up
  # by scripts/backup-wiki.sh as a pg_dump, never as this directory.
  pgdata-wiki3:
    external: true
    name: pgdata-wiki3
  # The 2.x cluster, created by the hand-run container on 2025-11-12. Mounted by
  # nothing: it is the rollback until the move is proved (ADR-0108), declared
  # here so that the file says it exists. Pointing `db` back at it, with the
  # 2.5.317 pin, is the whole rollback. The follow-up to #1339 retires it.
  pgdata:
    external: true
    name: pgdata
  # Wiki.js's working directory: the icon and file caches, and the deploy key
  # it writes out of the database. Derived, all of it. Not backed up, by
  # decision (ADR-0065).
  wiki-data:
