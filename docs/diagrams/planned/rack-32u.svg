<title id="title">The planned 32U rack</title>
<desc id="desc">Front elevation of the planned 32U four-post rack, drawn from the Planned: a 32U rack table in docs/hardware.md: the console at the top, the network group in the middle, the hosts below with single-unit gaps, and smaug, the UPS and the DL360 at the bottom.</desc>
