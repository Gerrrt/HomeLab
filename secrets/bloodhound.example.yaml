---
# Template for secrets/bloodhound.sops.yaml.
#
# FOUR KEYS: the database's password, BloodHound's first admin, the key that
# signs its sessions, and eden's token for the lab's ingest proxy (#834). One
# database, because the graph lives in Postgres too (ADR-0081).
#
# ---------------------------------------------------------------------------
# Create this ON EDEN, not on the monitoring host or alexander
# ---------------------------------------------------------------------------
#
#   make secrets-init STACK=bloodhound    # first time only — creates the age keypair
#   make secrets-edit STACK=bloodhound    # opens the encrypted file in $EDITOR
#
# secrets-init writes eden's public key into the `bloodhound` rule in
# .sops.yaml, its own rule above the catch-all, so the host holding the map of
# the lab's weaknesses opens its own secrets and nothing else: not odin's, not
# the lab's, not the estate's (ADR-0007, and ADR-0020 for the shape). It
# refuses if the key it would write is already a recipient of another rule.
#
# NOTHING HERE IS BACKED UP, and nothing needs to be (ADR-0081). Lose this file
# and the guest's key, and the fix is new values, a fresh data disk and one
# collection run.

# Postgres, which holds BloodHound's state and its graph. From `make gen-secret`. It is
# written into a libpq connection string in compose.yaml, unquoted, so it must
# have no spaces: gen-secret's alphabet has none.
BLOODHOUND_DB_PASSWORD: change-me-make-gen-secret

# The first admin, `admin`, created on the first start only; changing it here
# afterwards changes nothing. BloodHound refuses a password under 12
# characters, or one without an upper, a lower, a digit and one of !@#$%^&*,
# so take `make gen-secret` and append a `!` — gen-secret alone has no symbol.
BLOODHOUND_ADMIN_PASSWORD: change-me-make-gen-secret-then-append-a-bang

# Signs session tokens. Base64, from `openssl rand -base64 32`. Set rather than
# generated at start so that a restart does not sign every session out.
BLOODHOUND_JWT_SIGNING_KEY: change-me-openssl-rand-base64-32

# Not generated here: copy INGEST_TOKEN_EDEN out of secrets/lab.sops.yaml on
# alexander, after build-the-bloodhound-guest.md §5 has put it there. This
# stack's Alloy sends it on every push to 10.0.30.40.
INGEST_TOKEN: copy-INGEST_TOKEN_EDEN-from-secrets-lab-sops-yaml
