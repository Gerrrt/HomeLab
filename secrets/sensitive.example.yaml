---
# Template for secrets/sensitive.sops.yaml.
#
# EIGHTEEN KEYS. Read the list as a description of the stack: Caddy needs no
# credential — its certificate and key are files under certificates/, never
# tracked, handled the way the estate's Grafana leaf is — step-ca needs
# exactly one, the password that unlocks its intermediate key, AdGuard Home
# needs one, the hash of its admin password (#135), Immich needs one, the
# password its server presents to its own Postgres (#132), Vaultwarden needs
# one, the hash of its admin token (#131), Paperless-ngx needs three (#133),
# Homepage needs two, one read-only token per live widget (#137), ntfy
# needs six (#136), Miniflux needs two (#147), and linkding one (at the end of
# this file, #144). Home Assistant needs NONE from here, which is not the same
# as needing none. Its device credentials — the Hue application key, the Ring
# token, everything a config flow produces — are written by Home Assistant into
# its own store in the
# home-assistant-config volume, and no environment variable or rendered file
# could carry them in; compose.yaml and ADR-0035 say what protects them
# instead. This file grows with the tier and the compose file's `${VAR:?}`
# guards say what is required, so `make render STACK=sensitive` asks for what
# this stack needs and nothing else.
#
# ---------------------------------------------------------------------------
# Create this ON TRINITY, not on the monitoring host
# ---------------------------------------------------------------------------
#
#   make secrets-init STACK=sensitive    # first time only — creates the age keypair
#   make secrets-edit STACK=sensitive    # opens the encrypted file in $EDITOR
#
# secrets-init writes trinity's public key into the `sensitive` rule in
# .sops.yaml — its own rule, so that the tier's host can open the tier's
# secrets and nothing else: not the SNMP communities, not the Grafana admin
# password. It refuses if the key it would write is already a recipient of
# another rule. The technical second's recipient (ADR-0024, #294) is added to
# the same rule with `make secrets-add-recipient PUBKEY=... STACK=sensitive`
# on the day the tier holds real data, which is what ADR-0023 asks for the
# household's secrets.
#
# The password below is the one `make tier-ca ARGS=--mint` is given on the
# monitoring host when the tier's root and intermediate are minted; step
# encrypts both keys with it, and the two copies must match or step-ca cannot
# open its own key. Generate it with `make gen-secret`, put it here first, then
# pass it to --mint from a file (never argv) — docs/runbooks/build-the-tier-ca.md.
# It also unlocks the root key that stays on the monitoring host, whose age key
# cannot open THIS file — so using that root is a two-host operation on
# purpose (ADR-0037). Long and random; it is typed nowhere after that.
STEPCA_PASSWORD: change-me-to-something-long

# A bcrypt HASH, not the password (#135). AdGuard Home stores its admin
# password hashed and compares against the hash, so the hash is the only form
# this repository ever needs; the password itself lives in the password
# manager and is typed into the UI at adguard.matrix.elysium. Make it with
#
#   make hash-password
#
# which prompts for the password and prints the hash — the password is never
# an argument, so it is never in shell history or `ps`. The hash starts `$2a$`
# and carries more `$`; paste it as-is. render-config.sh escapes it for
# compose's .env, and compose.yaml's entrypoint substitutes it into the
# tracked AdGuardHome.yaml at start, so the file in git never holds it.
ADGUARD_ADMIN_PASSWORD_HASH: change-me-to-the-output-of-make-hash-password

# The password Immich's server presents to its own Postgres (#132), and the
# one Postgres creates its role with on first start — one value, two readers,
# so the pair cannot drift. Generated (`make gen-secret`), never typed. It
# was named in compose.yaml's guards and this file's header but had no entry
# here until the #131 merge, so `make render STACK=sensitive` would have asked
# for a key the template never mentioned.
IMMICH_DB_PASSWORD: change-me-to-something-long-and-random

# Vaultwarden's /admin token, as an Argon2id PHC string — never the token
# itself (#131). Generate it on any machine with docker, from the pinned image:
#
#   docker run --rm -it "$(COMPOSE_FILE=stacks/sensitive/compose.yaml \
#     ./scripts/image-for.sh vaultwarden)" /vaultwarden hash --preset owasp
#
# It asks for the token twice and prints `ADMIN_TOKEN='$argon2id$v=19$...'`.
# The value below is the part between the quotes, dollar signs and all;
# render-config.sh escapes it for compose's .env the way it does the hash
# above. The token you typed is what opens /admin and is held nowhere in this
# estate — keep it with the operator's other credentials, since it is
# precisely the thing this vault cannot hold for you.
VAULTWARDEN_ADMIN_TOKEN: change-me-to-an-argon2id-phc-string

# Paperless-ngx (#133). All three generated (`make gen-secret`), none typed:
#
#   PAPERLESS_SECRET_KEY      signs sessions and tokens. Rotating it logs every
#                             browser out and invalidates API tokens — nothing
#                             stored is encrypted with it.
#   PAPERLESS_DBPASS          the Postgres role's password. One value read by
#                             two containers (PAPERLESS_DBPASS in the app,
#                             POSTGRES_PASSWORD in the database), so the pair
#                             cannot drift. Postgres reads it once, at first
#                             start, to create the role: rotating it here after
#                             that changes what the app sends and not what the
#                             database expects, so a rotation is `ALTER ROLE`
#                             first and this file second.
#   PAPERLESS_ADMIN_PASSWORD  the superuser created on first start, and only
#                             then — the same variable does not change an
#                             existing account's password, so a rotation is
#                             done in the UI and recorded here afterwards.
#                             TOTP is enrolled on this account at first login
#                             (ADR-0022); stacks/sensitive/README.md has the
#                             step.
PAPERLESS_SECRET_KEY: change-me-to-something-long-and-random
PAPERLESS_DBPASS: change-me-to-something-long-and-random
PAPERLESS_ADMIN_PASSWORD: change-me-to-something-long-and-random

# Homepage (#137): one credential per live widget, each minted in the UI of the
# service it reads, AFTER that service is up, and each scoped so it can read
# the numbers on the tile and do nothing else. The other tiles are links
# because their services cannot issue a token like that (homepage/services.yaml
# says which, and why). Both guards are `:?`, so `make up STACK=sensitive`
# refuses until both exist: mint them, `make secrets-edit STACK=sensitive`,
# then `make up`.
#
#   HOMEPAGE_IMMICH_API_KEY   Immich › Account Settings › API Keys › New, as
#                             the admin (server statistics are an admin
#                             endpoint), with ONE permission ticked:
#                             `server.statistics`. Not "all": an unscoped key
#                             is the admin account.
#   HOMEPAGE_PAPERLESS_TOKEN  A Paperless user named `homepage`, not staff and
#                             not superuser, with View and nothing else on
#                             Document, Tag, Correspondent and Document Type;
#                             then its token, from Profile › API Auth Token
#                             while logged in as it (or from /admin › Auth
#                             tokens). Paperless counts only what the user can
#                             see, and a document is owned by whoever uploaded
#                             it — so add `homepage` to the view permissions
#                             of the consumption workflow, or the tile shows a
#                             smaller number than is true, which is the green
#                             dot this page refuses in another form.
HOMEPAGE_IMMICH_API_KEY: change-me-to-an-immich-api-key-scoped-to-server-statistics
HOMEPAGE_PAPERLESS_TOKEN: change-me-to-the-homepage-users-token

# ntfy (#136). compose.yaml builds its users, access list and token from these
# on every start (DIFFERENCE 12), so changing one here and `make up` IS the
# rotation — there is no ntfy CLI step.
#
#   NTFY_ALERTMANAGER_TOKEN          the bearer token Alertmanager publishes
#                                    with. The SAME value as
#                                    ALERTMANAGER_NTFY_TOKEN in
#                                    secrets/observability.sops.yaml; rotate
#                                    both, trinity first. Made with the
#                                    pinned image's `ntfy token generate` —
#                                    the command is beside that key.
#   NTFY_ALERTMANAGER_PASSWORD_HASH  a bcrypt hash of a password nobody keeps.
#                                    ntfy wants one per user, and this user
#                                    authenticates by token alone:
#                                    `make gen-secret`, then `make
#                                    hash-password` on it, then forget it.
#   NTFY_PHONE_PASSWORD_HASH         the bcrypt hash of the password the ntfy
#                                    app on each phone logs in with, as user
#                                    `phone` (`make hash-password`). The
#                                    password goes in the password manager.
#   NTFY_TOPIC_ALERTS / _URGENT / _SECURITY
#                                    three topic names, each `make gen-secret`
#                                    output. The same three names end the URLs
#                                    in secrets/observability.sops.yaml. With
#                                    deny-all a name grants nothing by itself,
#                                    but #136 asked that they be kept like a
#                                    credential, and they are.
#
# Both hashes carry `$`; paste them as they are — render-config.sh escapes them
# for compose's .env, as it does AdGuard's.
NTFY_ALERTMANAGER_TOKEN: tk_changemechangemechangeme00
NTFY_ALERTMANAGER_PASSWORD_HASH: change-me-to-the-output-of-make-hash-password
NTFY_PHONE_PASSWORD_HASH: change-me-to-the-output-of-make-hash-password
NTFY_TOPIC_ALERTS: change-me-to-something-long-and-random
NTFY_TOPIC_URGENT: change-me-to-something-long-and-random
NTFY_TOPIC_SECURITY: change-me-to-something-long-and-random

# Miniflux (#147, ADR-0057). Both generated (`make gen-secret`), none typed:
#
#   MINIFLUX_DBPASS          the Postgres role's password, read by both
#                            containers — miniflux-db as POSTGRES_PASSWORD, and
#                            miniflux spliced into DATABASE_URL — so the pair
#                            cannot drift. Because it sits inside a connection
#                            string it must be gen-secret's alphanumeric
#                            output: a space or a quote changes what the string
#                            says. Rotation is
#                            PAPERLESS_DBPASS's: `ALTER ROLE` first, this file
#                            second.
#   MINIFLUX_ADMIN_PASSWORD  the admin created on first start, and only then —
#                            every later start logs "Skipping admin user
#                            creation" and leaves the account alone. A rotation
#                            is done in the UI, or with `miniflux
#                            -reset-password` (stacks/sensitive/README.md), and
#                            recorded here afterwards. There is no second factor
#                            to enrol: Miniflux has no TOTP, and ADR-0057 says
#                            why its passkeys are not one.
MINIFLUX_DBPASS: change-me-to-something-long-and-random
MINIFLUX_ADMIN_PASSWORD: change-me-to-something-long-and-random

# linkding (#144, ADR-0061). The superuser created on first start, and only
# then, as PAPERLESS_ADMIN_PASSWORD is: a later change here does not reach the
# account, so a rotation is done in linkding's settings and recorded here
# afterwards. Generated (`make gen-secret`), and kept in Vaultwarden. This
# password is the whole of the login: linkding has no second factor, and
# ADR-0061 says why that is accepted. Its user name is LINKDING_SUPERUSER_NAME
# in stacks/sensitive/.env.example.
LINKDING_SUPERUSER_PASSWORD: change-me-to-something-long-and-random
