---
# Template for secrets/sensitive.sops.yaml.
#
# TWO KEYS. Read the list as a description of the stack: Caddy needs no
# credential — its certificate and key are files under certificates/, never
# tracked, handled the way the estate's Grafana leaf is — step-ca needs
# exactly one, the password that unlocks its intermediate key, Vaultwarden
# needs one, the hash of its admin token (#131), and Home Assistant needs
# NONE from here, which is not the same as needing none. Its device
# credentials — the Hue application key, the Ring token, everything a config
# flow produces — are written by Home Assistant into its own store in the
# home-assistant-config volume, and no environment variable or rendered file
# could carry them in; compose.yaml and ADR-0035 say what protects them
# instead. Immich's database credentials arrive here with its service (#132);
# this file grows with the tier and the compose file's `${VAR:?}` guards say
# what is required, so `make render STACK=sensitive` asks for what this stack
# needs and nothing else.
#
# ---------------------------------------------------------------------------
# Create this ON TRINITY, not on the monitoring host
# ---------------------------------------------------------------------------
#
#   make secrets-init STACK=sensitive    # first time only — creates the age keypair
#   make secrets-edit STACK=sensitive    # opens the encrypted file in $EDITOR
#
# secrets-init writes trinity's public key into the `sensitive` rule in
# .sops.yaml — its own rule, so that the tier's host can open the tier's
# secrets and nothing else: not the SNMP communities, not the Grafana admin
# password. It refuses if the key it would write is already a recipient of
# another rule. The technical second's recipient (ADR-0024, #294) is added to
# the same rule with `make secrets-add-recipient PUBKEY=... STACK=sensitive`
# on the day the tier holds real data, which is what ADR-0023 asks for the
# household's secrets.
#
# The password below is the one given to `step ca init` when the intermediate
# is minted on the monitoring host; the two must match or step-ca cannot open
# its own key. Long and random; it is typed nowhere after that.
STEPCA_PASSWORD: change-me-to-something-long

# Vaultwarden's /admin token, as an Argon2id PHC string — never the token
# itself. Generate it on any machine with docker, from the pinned image:
#
#   docker run --rm -it "$(COMPOSE_FILE=stacks/sensitive/compose.yaml \
#     ./scripts/image-for.sh vaultwarden)" /vaultwarden hash --preset owasp
#
# It asks for the token twice and prints `ADMIN_TOKEN='$argon2id$v=19$...'`.
# The value below is the part between the quotes, dollar signs and all;
# render-config.sh doubles each `$` on its way into .env, where compose would
# otherwise read them as variables. The token you typed is what opens /admin
# and is held nowhere in this estate — keep it with the operator's other
# credentials, since it is precisely the thing this vault cannot hold for you.
VAULTWARDEN_ADMIN_TOKEN: change-me-to-an-argon2id-phc-string
