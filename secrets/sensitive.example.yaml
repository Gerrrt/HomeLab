---
# Template for secrets/sensitive.sops.yaml.
#
# ONE KEY, for now. Read the list as a description of the stack: Caddy needs
# no credential — its certificate and key are files under certificates/, never
# tracked, handled the way the estate's Grafana leaf is — and step-ca needs
# exactly one, the password that unlocks its intermediate key. Vaultwarden's
# admin token, Immich's database credentials and Home Assistant's device
# credentials arrive here with their services (#131, #132, #134); this file
# grows with the tier and the compose file's `${VAR:?}` guards say what is
# required, so `make render STACK=sensitive` asks for what this stack needs
# and nothing else.
#
# ---------------------------------------------------------------------------
# Create this ON TRINITY, not on the monitoring host
# ---------------------------------------------------------------------------
#
#   make secrets-init STACK=sensitive    # first time only — creates the age keypair
#   make secrets-edit STACK=sensitive    # opens the encrypted file in $EDITOR
#
# secrets-init writes trinity's public key into the `sensitive` rule in
# .sops.yaml — its own rule, so that the tier's host can open the tier's
# secrets and nothing else: not the SNMP communities, not the Grafana admin
# password. It refuses if the key it would write is already a recipient of
# another rule. The technical second's recipient (ADR-0024, #294) is added to
# the same rule with `make secrets-add-recipient PUBKEY=... STACK=sensitive`
# on the day the tier holds real data, which is what ADR-0023 asks for the
# household's secrets.
#
# The password below is the one given to `step ca init` when the intermediate
# is minted on the monitoring host; the two must match or step-ca cannot open
# its own key. Long and random; it is typed nowhere after that.
STEPCA_PASSWORD: change-me-to-something-long
