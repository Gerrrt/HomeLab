---
# Template for secrets/analyst.sops.yaml.
#
# ONE KEY: garuda's token for the lab's ingest proxy on alexander (#834).
# Nothing else on garuda takes a credential from this repository: its tools
# are host tools, and Alloy pushes what it collects to alexander.
#
# ---------------------------------------------------------------------------
# Create this ON GARUDA, not on the monitoring host or alexander
# ---------------------------------------------------------------------------
#
#   make secrets-init STACK=analyst   # first time only — creates the age keypair
#   make secrets-edit STACK=analyst   # opens the encrypted file in $EDITOR
#
# secrets-init writes garuda's public key into an `analyst` rule in .sops.yaml,
# its own rule above the catch-all, so the analyst's host opens the analyst's
# secret and nothing else (ADR-0007, and ADR-0020 for the shape). It refuses if
# the key it would write is already a recipient of another rule.

# Not generated here: copy INGEST_TOKEN_GARUDA out of secrets/lab.sops.yaml on
# alexander. This stack's Alloy sends it on every push to 10.0.30.40.
INGEST_TOKEN: copy-INGEST_TOKEN_GARUDA-from-secrets-lab-sops-yaml
