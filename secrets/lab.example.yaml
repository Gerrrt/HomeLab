---
# Template for secrets/lab.sops.yaml.
#
# ONE KEY. That is not an oversight — it is what the lab stack actually needs,
# and the short list is worth reading as a description of the stack: no SNMP
# communities, because it polls no devices; no Alertmanager receiver URLs,
# because it has no Alertmanager (ADR-0020); no renderer token, because it
# ships no dashboards to screenshot.
#
# scripts/render-config.sh derives the required set per stack rather than
# demanding all ten the estate needs, so `make render STACK=lab` asks for this
# and nothing else.
#
# ---------------------------------------------------------------------------
# Create this ON THE LAB GUEST, not on the monitoring host
# ---------------------------------------------------------------------------
#
#   make secrets-init STACK=lab    # first time only — creates the age keypair
#   make secrets-edit STACK=lab    # opens the encrypted file in $EDITOR
#
# `.sops.yaml` gives secrets/lab.*.sops.yaml its own creation_rule and its own
# age recipient, above the catch-all that covers everything else under
# secrets/. That separation is the point: the single rule it sits above matches
# ALL of secrets/, so a key added there could decrypt the estate's SNMP
# communities and Grafana admin password too — a lab host holding the
# credentials of the estate it is meant to be isolated from.
#
# `make secrets-init STACK=lab` run on the monitoring host would do exactly
# that, which is why bootstrap.sh now refuses when the key it would write is
# already a recipient of another rule. Run it where the stack runs.

# Grafana initial admin login. Grafana only reads this when it creates the
# admin user, so changing it later has no effect — change it in the UI, or wipe
# the grafana-data volume.
#
# NOT the same password as the estate's Grafana. Two Grafanas that share a
# password are one credential, and the whole reason there are two of them is
# that the lab is assumed to be the one that gets compromised. Generate one
# with `make gen-secret`.
GRAFANA_ADMIN_PASSWORD: change-me-to-something-long

# GRAFANA_ADMIN_USER is optional and defaults to `admin` in compose.yaml. Add
# it here if you want a different one.
