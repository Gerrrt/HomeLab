---
# Template for secrets/tofu.sops.yaml: the ESCROW copy of tofu/'s state
# passphrase (ADR-0076). It is not a stack's secrets file. Nothing renders it,
# and `make secrets-init` is not how it is made.
#
# The working copy is TF_VAR_state_passphrase in ~/.config/proxmox/phoenix.env.
# This file is encrypted on phoenix from the public keys in .sops.yaml (the
# catch-all rule: the estate key and ADR-0024's second recipient), so phoenix
# can write it and never read it. prometheus and the offline medium can.
# docs/runbooks/provision-lab-guests.md §3 makes it and proves it.
#
# Losing this AND phoenix.env means tofu/state/lab.tfstate can never be read
# again. The guests survive. The state would have to be rebuilt with imports.

TOFU_STATE_PASSPHRASE: change-me-openssl-rand-base64-32
