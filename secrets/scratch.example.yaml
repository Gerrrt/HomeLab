---
# Template for secrets/scratch.sops.yaml — which, unlike every other stack's
# encrypted file, is NEVER COMMITTED (ADR-0071). .gitignore keeps it out.
#
# The same seven keys as secrets/soc.example.yaml, because the stack is soc's
# shape: three Wazuh passwords and two of their hashes, the agent enrolment
# password, and Velociraptor's first admin password. Fresh values for every
# investigation; never odin's.
#
# ---------------------------------------------------------------------------
# Create this ON DIABOLOS, once per incarnation
# ---------------------------------------------------------------------------
#
#   make secrets-init STACK=scratch    # creates this guest's age keypair
#   make secrets-edit STACK=scratch    # opens the encrypted file in $EDITOR
#
# secrets-init writes the guest's public key over the permanent
# REPLACE_WITH_SCRATCH_AGE_PUBLIC_KEY placeholder in .sops.yaml — in this
# guest's checkout only. Do not commit that change and do not back the key up:
# the guest, its key and this file are destroyed together at teardown, and
# that is the point (docs/runbooks/run-a-scratch-investigation.md).
#
# Generate each password with `make gen-secret`. The Wazuh API refuses a
# password without an upper-case letter, a lower-case letter, a digit and a
# symbol, and the image's init pastes API_PASSWORD into a JSON document
# unquoted — so no double quote, no backslash and no `$` in it, whatever
# gen-secret hands you.

# The indexer's `admin` account. The manager's filebeat and the dashboard sign
# in as it. Its bcrypt hash goes in
# INDEXER_ADMIN_HASH below.
INDEXER_PASSWORD: change-me-to-something-long

# bcrypt of INDEXER_PASSWORD, made with the indexer image's own tool — the
# command is in stacks/scratch/wazuh/indexer/internal_users.yml. Rendered into
# .rendered/internal_users.yml; never in a tracked file.
INDEXER_ADMIN_HASH: "$2y$12$replace-with-the-output-of-hash.sh"

# The dashboard's service account on the indexer (`kibanaserver`), and its
# bcrypt hash, made the same way.
DASHBOARD_PASSWORD: change-me-to-something-long
DASHBOARD_PASSWORD_HASH: "$2y$12$replace-with-the-output-of-hash.sh"

# The Wazuh API account (`wazuh-wui`) the dashboard signs in with. Written into
# the API's user store by the manager on its FIRST start and not read again;
# change it in the dashboard afterwards.
API_PASSWORD: change-me-Upper-lower-1-and-a-symbol

# What an agent presents to enrol (ossec.conf: <use_password>yes). Rendered
# into stacks/scratch/wazuh/manager/.rendered/authd.pass, and given to each
# agent enrolled for this investigation — never one of odin's.
WAZUH_REGISTRATION_PASSWORD: change-me-to-something-long

# Velociraptor's `admin` GUI account, read ONCE when the server generates its
# config on first start. Change it in the GUI afterwards; this value is then
# inert.
VELOCIRAPTOR_INITIAL_ADMIN_PASSWORD: change-me-to-something-long
