---
config:
  default: true
  # Tables in docs/network.md and the README badge row exceed any sane limit.
  MD013: false
  # Duplicate headings are meaningful in per-VLAN sections (each has "Notes").
  MD024:
    siblings_only: true
  # Inline HTML is used for centred badges and <details> blocks.
  MD033: false
  # The README's first heading is preceded by a centred badge block.
  MD041: false
  # Bare URLs appear inside code fences only.
  MD034: true

globs:
  - "**/*.md"

ignores:
  - node_modules/**
  - .venv/**
  # Installed Ansible collections, for the reason given in .yamllint.yaml.
  - ansible/.collections/**
  - ansible/.ansible/**
  # The provider cache that scripts/lint.sh's tofu `init` writes (gitignored).
  # Lint runs markdownlint first, so a fresh checkout — CI — never has it, and
  # the SECOND local `make validate` linted the providers' own CHANGELOG.md and
  # README.md: 463 findings in 4 files, none of them this repository's.
  - tofu/.terraform/**
  # Other Claude Code sessions' git worktrees, for the reason spelled out in
  # .yamllint.yaml. `**/*.md` matches dot directories here, so a second
  # checkout doubles the file count — measured at 114 files against 57 tracked.
  # It has passed so far only because a worktree holds a copy of this
  # repository's own markdown; a branch under review with one lint error in it
  # would fail `make validate` on main, pointing at a file main does not have.
  - .claude/worktrees/**
