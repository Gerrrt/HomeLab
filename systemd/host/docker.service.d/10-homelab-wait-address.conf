# docker.service waits for homelab-wait-address.service (ADR-0105).
#
# After= is the ordering, and Wants= pulls the waiter in even when docker is
# started on its own (socket activation, `systemctl start docker`). Wants, not
# Requires: the waiter never fails, it only waits, and a Requires would let
# `systemctl stop homelab-wait-address` take docker down with it.
#
# docker.service already has After=network-online.target. That is not enough:
# network-online.target is reached when systemd-networkd-wait-online exits,
# and it exits after two minutes whether or not the link came up.
[Unit]
Wants=homelab-wait-address.service
After=homelab-wait-address.service
