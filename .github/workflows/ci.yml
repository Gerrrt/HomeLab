---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STACK: stacks/observability
  # Image versions are NOT duplicated here. They are resolved from compose.yaml
  # at run time by scripts/image-for.sh, because Dependabot only updates
  # compose.yaml — hardcoded copies went stale silently and CI ended up
  # validating v3.1.0 configs against a stack running v3.13.2.
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.24.0

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: yamllint
        run: pipx run yamllint --strict .

      - name: markdownlint
        run: npx --yes markdownlint-cli2

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        uses: raven-actions/actionlint@v2

      - name: EditorConfig
        uses: editorconfig-checker/action-editorconfig-checker@v2

  # ---------------------------------------------------------------------------
  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The ${VAR:?} guards in compose.yaml exist so a missing secret fails
      # loudly at deploy time. CI supplies throwaway values so validation never
      # needs a decryption key. The list of variables lives in the script, which
      # scripts/validate.sh also calls — inlining it here is what let CI and the
      # local run drift apart. The .env written here stays gitignored.
      - name: Seed a validation-only .env
        run: ./scripts/seed-validation-env.sh "$STACK/.env"

      # Single source of truth: whatever compose.yaml pins is what gets tested.
      - name: Resolve pinned images from compose.yaml
        run: |
          {
            echo "PROM_IMAGE=$(./scripts/image-for.sh prometheus)"
            echo "AM_IMAGE=$(./scripts/image-for.sh alertmanager)"
            echo "ALLOY_IMAGE=$(./scripts/image-for.sh alloy)"
          } >> "$GITHUB_ENV"
          ./scripts/image-for.sh prometheus
          ./scripts/image-for.sh alertmanager
          ./scripts/image-for.sh alloy

      - name: docker compose config
        run: docker compose -f "$STACK/compose.yaml" config -q

      # Guard against the duplication coming back. Any image: pin outside
      # compose.yaml is drift waiting to happen, since Dependabot cannot see it.
      - name: Verify image versions are not duplicated outside compose.yaml
        run: |
          if grep -rnE '(prom|grafana)/[a-z-]+:v?[0-9]+\.[0-9]+' \
               --include='*.sh' --include='*.yml' --include='Makefile' \
               scripts .github Makefile 2>/dev/null \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' ; then
            echo "::error::pinned image version outside compose.yaml — use scripts/image-for.sh"
            exit 1
          fi
          echo "no duplicated image pins"

      # Covers every place an image is referenced, not just compose.yaml — the
      # first version of this check only looked at the stack and let :latest
      # through in the workflow itself and in the Makefile.
      - name: Verify no image uses a floating tag
        run: |
          if grep -rnE '(^|[[:space:]])[a-z0-9._/-]+:latest([[:space:]]|$)' \
               --include='*.yaml' --include='*.yml' --include='Makefile' \
               --include='*.sh' . \
             | grep -v '^\./\.git/' \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' ; then
            echo "::error::floating :latest tag found — pin an explicit version"
            exit 1
          fi
          echo "all image references pinned"

      # A tag is a mutable pointer; a digest is the content hash. Every service
      # image must carry both, so a moved tag cannot change what gets deployed.
      - name: Verify every image is pinned by digest
        run: |
          missing=0
          while read -r ref; do
            case "$ref" in
              *@sha256:*) ;;
              *) echo "::error::$ref is not pinned by digest — run make pin-digests"; missing=1 ;;
            esac
          done < <(awk '$1 == "image:" { print $2 }' "$STACK/compose.yaml")
          exit "$missing"

      - name: promtool check config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD:/repo" -w /repo "$PROM_IMAGE" \
            check config "$STACK/prometheus/prometheus.yaml"

      - name: promtool check rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD:/repo" -w /repo "$PROM_IMAGE" \
            check rules "$STACK"/prometheus/rules/*.rules.yaml

      # No secret needed: the receiver URL comes from url_file, which
      # Alertmanager reads at notify time rather than at config load time.
      - name: amtool check-config
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD:/repo" -w /repo "$AM_IMAGE" \
            check-config "$STACK/alertmanager/alertmanager.yaml"

      # `fmt --test` exits non-zero if the file is not canonically formatted, and
      # fails outright on a syntax error. It does not validate that components
      # are configured correctly — Alloy has no `validate` subcommand, so that is
      # only caught at load time on the host.
      - name: alloy fmt --test
        run: |
          docker run --rm --entrypoint alloy \
            -v "$PWD:/repo" -w /repo "$ALLOY_IMAGE" \
            fmt --test "$STACK/alloy/config.alloy"

      # `docker compose config` happily accepts a service_healthy dependency on
      # a service that can never report healthy — the stack then hangs at deploy
      # time with no error at all. Loki's distroless image has no wget to probe
      # with, which is exactly how that happened here.
      - name: Verify health dependencies are satisfiable
        run: python3 scripts/check_compose_health.py

      # promtool cannot check these — it parses PromQL and rejects every LogQL
      # stream selector. Loki itself is the only thing that understands them, so
      # the checker boots the pinned image with the rules mounted.
      - name: Validate Loki rules
        run: ./scripts/check_loki_rules.sh

      - name: Validate Grafana dashboards
        run: python3 scripts/check_dashboards.py

      # Dashboard queries are as easy to typo as alert rules, and a broken one
      # shows up as an empty panel rather than an error. Parse them all.
      - name: Parse every dashboard PromQL expression
        run: |
          python3 scripts/check_dashboards.py --emit-promql > /tmp/dashboard-exprs.yaml
          docker run --rm --entrypoint promtool \
            -v /tmp:/tmp "$PROM_IMAGE" check rules /tmp/dashboard-exprs.yaml

  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Two scans, because they answer different questions.
      #
      # The working-tree scan asks "is there a secret in the code as it stands"
      # and must always be clean. The history scan asks "has one ever been
      # committed" — it honours .gitleaksignore, which enumerates the nine known
      # historical findings with the reason each is there. Once the history
      # purge in docs/runbooks/purge-git-history.md has run, that file goes away
      # and this job keeps passing on its own merits.
      - name: gitleaks — working tree
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            "$GITLEAKS_IMAGE" \
            detect --no-git --no-banner --redact -c .gitleaks.toml -v

      - name: gitleaks — full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            "$GITLEAKS_IMAGE" \
            detect --no-banner --redact -c .gitleaks.toml --log-opts="--all" -v

      # gitleaks cannot be the control here. .purge-secrets.txt is gitignored so
      # the filesystem scan skips it, and its contents are bare literals with no
      # keyword context for a rule to match. The control is simply that it must
      # never be a tracked file.
      - name: Assert no decrypted artefact is tracked
        run: |
          fail=0
          for pattern in '.env' '.rendered/' '.purge-secrets.txt'; do
            if git ls-files | grep -E "(^|/)${pattern//./\\.}" | grep -v '\.env\.example'; then
              echo "::error::tracked file matching '${pattern}' — it must be gitignored"
              fail=1
            fi
          done
          exit "$fail"

      - name: Assert SOPS files are actually encrypted
        run: |
          shopt -s nullglob
          fail=0
          for f in secrets/*.sops.yaml; do
            if ! grep -q '^sops:' "$f"; then
              echo "::error file=$f::not SOPS-encrypted"
              fail=1
            fi
          done
          exit "$fail"
