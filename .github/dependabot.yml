---
version: 2

updates:
  # Pinned container images in compose.yaml. This is what makes pinning
  # sustainable — without it, pinned tags simply rot.
  #
  # One entry for every stack that shares config with another, because
  # check_image_pins.py fails a pull request that moves one copy of a shared
  # image without the others (#848), and Dependabot opens one PR per entry
  # per directory. The links, read off the mounts:
  #   - analyst, bloodhound, lab, sensor and soc run observability's
  #     alloy/*.alloy and docker-socket-proxy/ config, so their Alloy and
  #     socket proxy must be observability's, digest for digest;
  #   - sensitive's Caddy mounts observability's alloy/ingest-ca.pem;
  #   - scratch (#438, ADR-0071), the disposable copy of soc on diabolos,
  #     mounts soc's wazuh/ and velociraptor/ config.
  # Those links reach every stack below, so they are one entry. Before this,
  # each stack had its own and every Alloy, Caddy or socket-proxy release
  # arrived as up to six red PRs that had to be folded into one by hand
  # (the week of 2026-11-22 left fourteen). media and wiki mount nothing of
  # another stack's and keep their own entries.
  #
  # How a bump arrives:
  #   - shared-config: one PR per image, covering every directory that pins
  #     it (`group-by: dependency-name`). Listed first, since a dependency
  #     goes to the first group it matches and grafana/alloy is also grafana/*.
  #   - wazuh: the indexer, manager and dashboard must match to the patch
  #     version, so one PR carries a release to soc and scratch together.
  #     The Wazuh cert tool vendored in stacks/soc/wazuh/certs-tool/
  #     (ADR-0094) is not something Dependabot can bump; it tracks the wazuh/*
  #     major.minor, and the compose file says so where it is used.
  #   - velociraptor: soc and scratch together, for the same reason.
  #   - immich: the server and machine-learning images are one release and run
  #     as a matched pair; ungrouped, #1461 moved the server alone and trinity
  #     ran it beside the previous machine-learning release. The group names
  #     both and not immich-app/postgres, whose majors are held below.
  #   - grafana-stack, prometheus-stack: observability's and lab's now arrive
  #     in one PR rather than one each. Lab's Prometheus and Grafana mount
  #     nothing of observability's and could move alone, but nothing gained
  #     from that was worth a second entry and the hand-folding above. Merging
  #     is not deploying: lab's host still takes the bump only when the
  #     operator, sitting in front of it, pulls the stack.
  #   - everything else: ungrouped, one PR per image per directory.
  #
  # A merge here can be a deploy: trinity's homelab-converge-sensitive applies
  # sensitive's pins within the hour (#533), so review a PR that touches
  # /stacks/sensitive as one.
  #
  # Ignored:
  #   - Postgres majors, everywhere: sensitive's three Postgres volumes
  #     (Immich's, Paperless's, Miniflux's) and bloodhound's are quiesced data
  #     directory tars in `make backup`, restorable only into the same major,
  #     and a major is a dump and a restore (ADR-0065), never a digest bump.
  #     immich-app/postgres is named separately because it is its own image:
  #     its vectorchord tag moves with both the Postgres major and the
  #     extension's, and either is a migration Immich documents. Written
  #     without the registry: Dependabot names a ghcr.io image by its path,
  #     so a ghcr.io/ prefix matched nothing (#1433).
  #   - tecnativa/docker-socket-proxy majors. Upstream added tags named for
  #     the HAProxy base (3.2, 3.4, lts) beside its own vX.Y.Z releases, and
  #     Dependabot read 3.4 as a major release after the one pinned here and
  #     opened six PRs for it. It is a different tag series, not the next
  #     release. Adopting it is a deliberate edit to all six stacks in one
  #     PR, after reading what upstream's series means; drop this rule then.
  #
  # The PR limit stays above the number of images these stacks pin (74 on
  # 2026-11-22), the rule since #1433: below it, bumps are dropped silently.
  # The 2026-11-08 run opened five and stopped, and a Mealie release that
  # fixed 9 critical CVEs (#981) never got its PR.
  - package-ecosystem: docker-compose
    directories:
      - /stacks/observability
      - /stacks/lab
      - /stacks/sensitive
      - /stacks/soc
      - /stacks/scratch
      - /stacks/sensor
      - /stacks/bloodhound
      - /stacks/analyst
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 90
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: immich-app/postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: tecnativa/docker-socket-proxy
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      shared-config:
        group-by: dependency-name
        patterns: ["grafana/alloy", "caddy", "tecnativa/docker-socket-proxy"]
      wazuh:
        patterns: ["wazuh/*"]
      velociraptor:
        patterns: ["velocidex/*"]
      immich:
        patterns: ["immich-app/immich-server", "immich-app/immich-machine-learning"]
      grafana-stack:
        patterns: ["grafana/*"]
      prometheus-stack:
        patterns: ["prom/*"]

  # The media stack on smaug. Present before the pool is, for the reason the
  # entries above give — but this one was absent while three documents said it
  # was here: ADR-0040 keeps stacks/media in this repository rather than making
  # it a TrueNAS catalogue app precisely so "Dependabot, the digest pins and
  # make validate keep reaching it", and build-the-nas.md §6 and the stack's own
  # README repeat the claim. The pins and make validate did reach it. This is
  # the third.
  #
  # Four images now: #256 added a node_exporter beside Jellyfin, because this
  # host is scraped rather than running an agent, #140 added Audiobookshelf,
  # from ghcr.io, and #141 Navidrome. They share nothing, so no groups — each bump is its own PR.
  - package-ecosystem: docker-compose
    directory: /stacks/media
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 10  # above the image count (#1433)
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "media"]

  # stacks/wiki (#251): Wiki.js and its Postgres on oracle, deployed by hand
  # from main the way stacks/media is, so a bump merged here reaches the host
  # only when README.md's fetch is run there. Postgres is held to 17 by
  # ignoring majors: a major is a dump and a restore (ADR-0065), never a
  # digest bump.
  - package-ecosystem: docker-compose
    directory: /stacks/wiki
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "wiki"]

  # ansible/ (ADR-0077): ansible-core in requirements.txt, ansible-lint in
  # requirements-lint.txt, both exact. The collections in requirements.yml are
  # not an ecosystem Dependabot reads, and stay a deliberate edit like Packer's
  # plugin pin; the weekly scripts/check_tool_versions.py job in digests.yml is
  # what says a newer one exists (#848). Monthly: phoenix applies these by
  # hand, so a weekly PR would outrun anyone running them.
  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "lab"]

  # scripts/: three pins, all monthly — neither is a deploy, and a new linter
  # release can bring new findings, so one PR a month to fix them is enough.
  #   - PyYAML, with its hashes, in requirements.txt, which scripts/_deps.py
  #     installs on a CI runner and nowhere else; a host takes it from apt (#848).
  #   - yamllint in requirements-lint.txt, for scripts/lint.sh (#848).
  #   - ruff in requirements-lint.txt, for scripts/lint.sh (#853).
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "ci"]

  # tofu/ (ADR-0076, #848): the bpg/proxmox provider in versions.tf and its
  # hashes in .terraform.lock.hcl. Dependabot's opentofu ecosystem resolves it
  # against registry.opentofu.org, the registry the lock file names. Its lock
  # edit is incomplete: the first one (#961) left constraints on the old
  # version and one zh: hash out, and scripts/lint.sh fails that. Expect each
  # bump to be red until `tofu -chdir=tofu init -upgrade -backend=false` is
  # committed onto it. Monthly: phoenix applies it by hand, like ansible/ above.
  - package-ecosystem: opentofu
    directory: /tofu
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "lab"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Weekly since #839. The actions are pinned to commit SHAs now, so a
      # security fix in one reaches CI only through this PR; a month is too
      # long to wait for that.
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
