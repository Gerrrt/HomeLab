---
# windows_exporter on all six, and the one firewall rule that lets alexander
# scrape it (runbook §7). Scraped, never published: ADR-0029.

- name: Make the textfile directory
  ansible.windows.win_file:
    path: "{{ windows_exporter_textfile_dir }}"
    state: directory

# Whether the pinned release is installed is read from its MSI product code,
# not inferred from a folder or a file. That lets a run where it is already
# installed skip the download entirely, and lets check mode answer without the
# MSI on disk (check mode downloads nothing, and C:\ProgramData\lab may not
# exist yet either). A version bump changes the product code, so
# windows_exporter_product_id moves with windows_exporter_version.
- name: Read whether the pinned windows_exporter is installed
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{{ windows_exporter_product_id }}
  register: exporter_installed
  check_mode: false

- name: Report the download and install as pending, in check mode
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} would download and install windows_exporter {{ windows_exporter_version }}"
  changed_when: true
  when: ansible_check_mode and not exporter_installed.exists

- name: Fetch the pinned MSI
  ansible.windows.win_get_url:
    url: "{{ exporter_release }}/v{{ windows_exporter_version }}/{{ exporter_msi }}"
    dest: "C:\\ProgramData\\lab\\{{ exporter_msi }}"
    checksum: "{{ windows_exporter_sha256 }}"
    checksum_algorithm: sha256
    force: false
  when:
    - not exporter_installed.exists
    - not ansible_check_mode

# REMOVE=FirewallException: the MSI's own rule admits any remote address. The
# rule below admits one, and two rules on one port is a /24 sweep finding the
# wider of them.
- name: Install windows_exporter
  ansible.windows.win_package:
    path: "C:\\ProgramData\\lab\\{{ exporter_msi }}"
    product_id: "{{ windows_exporter_product_id }}"
    arguments: >-
      ENABLED_COLLECTORS={{ windows_exporter_collectors }}
      LISTEN_PORT={{ windows_exporter_port }}
      TEXTFILE_DIRS="{{ windows_exporter_textfile_dir }}"
      REMOVE=FirewallException
    state: present
  when:
    - not exporter_installed.exists
    - not ansible_check_mode

# In check mode with nothing installed there is no service to start; the
# pending install above already says so.
- name: Keep the service running
  ansible.windows.win_service:
    name: windows_exporter
    start_mode: auto
    state: started
  when: exporter_installed.exists or not ansible_check_mode

# "That is the difference between an endpoint found by a /24 sweep and one you
# have to go looking for" (§7). Domain profile only, which is why this role
# runs after the join. The name is the one the hand-built six were given, so
# the module adopts their rule rather than adding a second.
- name: Admit alexander, and only alexander, to {{ windows_exporter_port }}
  community.windows.win_firewall_rule:
    name: windows_exporter from alexander
    direction: in
    protocol: tcp
    localport: "{{ windows_exporter_port }}"
    remoteip: "{{ windows_exporter_scraper }}"
    action: allow
    profiles: [domain]
    state: present
    enabled: true
