---
# windows_exporter on all six, and the one firewall rule that lets alexander
# scrape it (runbook §7). Scraped, never published: ADR-0029.

- name: Make the textfile directory
  ansible.windows.win_file:
    path: "{{ windows_exporter_textfile_dir }}"
    state: directory

# The collector serves whatever .prom files are here as the guest's own metrics,
# so whoever can write here can forge a gauge, the licence clock included.
# ProgramData's inherited ACL gave BUILTIN\Users Write (the bahamut audit,
# 2026-11-25). Only SYSTEM (the exporter, licence-clock's task) and
# Administrators (Ansible, licence-clock's handler) write or read it now, with
# inheritance cut so a file dropped in takes the same two. Compared by SID.
- name: Only SYSTEM and Administrators may use the textfile directory
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$Dir)
      $Ansible.Changed = $false
      $sids = @('S-1-5-18', 'S-1-5-32-544')
      $acl = Get-Acl -LiteralPath $Dir
      $have = @($acl.Access | ForEach-Object {
        '{0}|{1}|{2}' -f $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value,
          $_.FileSystemRights, $_.InheritanceFlags
      } | Sort-Object) -join ';'
      $want = @($sids | ForEach-Object { "$_|FullControl|ContainerInherit, ObjectInherit" } | Sort-Object) -join ';'
      if (-not $acl.AreAccessRulesProtected -or $have -ne $want) {
        $Ansible.Changed = $true
        if (-not $Ansible.CheckMode) {
          $new = New-Object System.Security.AccessControl.DirectorySecurity
          $new.SetAccessRuleProtection($true, $false)
          foreach ($sid in $sids) {
            $new.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule(
              (New-Object System.Security.Principal.SecurityIdentifier($sid)), 'FullControl',
              'ContainerInherit, ObjectInherit', 'None', 'Allow')))
          }
          Set-Acl -LiteralPath $Dir -AclObject $new
        }
      }
    parameters:
      Dir: "{{ windows_exporter_textfile_dir }}"

# Whether the pinned release is installed is read from its MSI product code,
# not inferred from a folder or a file. That lets a run where it is already
# installed skip the download entirely, and lets check mode answer without the
# MSI on disk (check mode downloads nothing, and C:\ProgramData\lab may not
# exist yet either). A version bump changes the product code, so
# windows_exporter_product_id moves with windows_exporter_version.
- name: Read whether the pinned windows_exporter is installed
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{{ windows_exporter_product_id }}
  register: exporter_installed
  check_mode: false

- name: Report the download and install as pending, in check mode
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} would download and install windows_exporter {{ windows_exporter_version }}"
  changed_when: true
  when: ansible_check_mode and not exporter_installed.exists

- name: Fetch the pinned MSI
  ansible.windows.win_get_url:
    url: "{{ exporter_release }}/v{{ windows_exporter_version }}/{{ exporter_msi }}"
    dest: "C:\\ProgramData\\lab\\{{ exporter_msi }}"
    checksum: "{{ windows_exporter_sha256 }}"
    checksum_algorithm: sha256
    force: false
  when:
    - not exporter_installed.exists
    - not ansible_check_mode

# REMOVE=FirewallException: the MSI's own rule admits any remote address. The
# rule below admits one, and two rules on one port is a /24 sweep finding the
# wider of them.
#
# ADDLOCAL=DefaultFeature, because REMOVE alone on a machine with nothing
# installed asks for no feature at all: msiexec turns REMOVE into ALL, installs
# no files, and CreateConfigFile then fails 1603 writing config.yaml into a
# folder that was never made. The #448 rebuild hit exactly that on titan. The
# hand-built six never took this path; their exporter was installed by hand
# and this role adopted it.
- name: Install windows_exporter
  ansible.windows.win_package:
    path: "C:\\ProgramData\\lab\\{{ exporter_msi }}"
    product_id: "{{ windows_exporter_product_id }}"
    arguments: >-
      ENABLED_COLLECTORS={{ windows_exporter_collectors }}
      LISTEN_PORT={{ windows_exporter_port }}
      TEXTFILE_DIRS="{{ windows_exporter_textfile_dir }}"
      ADDLOCAL=DefaultFeature
      REMOVE=FirewallException
    state: present
  when:
    - not exporter_installed.exists
    - not ansible_check_mode

# In check mode with nothing installed there is no service to start; the
# pending install above already says so.
- name: Keep the service running
  ansible.windows.win_service:
    name: windows_exporter
    start_mode: auto
    state: started
  when: exporter_installed.exists or not ansible_check_mode

# "That is the difference between an endpoint found by a /24 sweep and one you
# have to go looking for" (§7). Domain profile only, which is why this role
# runs after the join. The name is the one the hand-built six were given, so
# the module adopts their rule rather than adding a second.
- name: Admit alexander, and only alexander, to {{ windows_exporter_port }}
  community.windows.win_firewall_rule:
    name: windows_exporter from alexander
    direction: in
    protocol: tcp
    localport: "{{ windows_exporter_port }}"
    remoteip: "{{ windows_exporter_scraper }}"
    action: allow
    profiles: [domain]
    state: present
    enabled: true

# Installed is decided by product code above, never by the MSI being here, so
# it goes once the service runs: staged in C:\ProgramData\lab, BUILTIN\Users
# could read it (the bahamut audit, 2026-11-25). A version bump fetches the new
# one again.
- name: Remove the staged MSI
  ansible.windows.win_file:
    path: "C:\\ProgramData\\lab\\{{ exporter_msi }}"
    state: absent
