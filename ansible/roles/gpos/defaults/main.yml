  # #1077: the DCs' advanced audit policy. Nothing set one before, so the DCs ran
  # the Default Domain Controllers Policy's basic categories, which mapped to the
  # 17 subcategories below (auditpol on bahamut and leviathan, 2026-10-08). An
  # advanced policy replaces the basic one outright, so this carries all 17 and
  # adds Directory Service Changes (5136): without it a write to an object's
  # attributes or ACL - an SPN, an RBCD trust, a replication grant - leaves no
  # event. The audit SACL that says which writes to record is roles/ds_audit's.
  - name: Lab - Audit Domain Controllers
    rel_path: \Machine\Microsoft\Windows NT\Audit\audit.csv
    encoding: utf8
    cse: "[{35378EAC-683F-11D2-A89A-00C04FBBCFA2}{0F3F3735-573D-9804-99E4-AB2A69BA5FD4}][{F3CCC681-B74C-4060-9F26-CD84525DCA2A}{0F3F3735-573D-9804-99E4-AB2A69BA5FD4}]"
