---
# The Sysmon/Operational channel's size. Sysmon's install leaves it at 64 MiB.
# bahamut wrote 8.6 MiB an hour in its first quarter-hour on sysmon-modular's
# balanced profile (2026-10-06, install burst included): about seven hours in
# 64 MiB, about a day in 256. Until #266's Wazuh ships the events off the guest,
# the channel is the only copy. It wraps when full. 256 MiB is nothing beside
# the ~40 GiB each guest's C: had free.
sysmon_log_max_bytes: 268435456
