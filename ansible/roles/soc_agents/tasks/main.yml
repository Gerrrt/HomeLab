---
# Wazuh and Velociraptor on all six. Decided by product code, like roles/exporter:
# already installed means the download and install are skipped, so a second run
# changes nothing and check mode needs no MSI on disk.

- name: Read whether the agents are installed
  ansible.windows.win_reg_stat:
    path: "HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{{ item.id }}"
  loop:
    - {name: wazuh, id: "{{ soc_agents_wazuh_product_id }}"}
    - {name: velociraptor, id: "{{ soc_agents_velociraptor_product_id }}"}
  loop_control:
    label: "{{ item.name }}"
  register: soc_agents_installed
  check_mode: false

- name: Note which are still to install
  ansible.builtin.set_fact:
    soc_agents_wazuh_present: "{{ soc_agents_installed.results[0].exists }}"
    soc_agents_velociraptor_present: "{{ soc_agents_installed.results[1].exists }}"

- name: Report the agents as pending, in check mode
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} would install {{ item.name }} {{ item.ver }}"
  changed_when: true
  when: ansible_check_mode and not item.present
  loop:
    - name: Wazuh
      ver: "{{ soc_agents_wazuh_version }}"
      present: "{{ soc_agents_wazuh_present }}"
    - name: Velociraptor
      ver: "{{ soc_agents_velociraptor_version }}"
      present: "{{ soc_agents_velociraptor_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: The MSI source is set for whatever still needs installing
  ansible.builtin.assert:
    that: "lookup('ansible.builtin.vars', item.var, default='') | length > 0"
    fail_msg: >-
      {{ item.name }} is not installed and {{ item.var }} is unset. Point it at
      the MSI built on odin (build-the-soc-guest.md section 11); there is no
      default, because there is no standing URL for it.
  when:
    - not item.present
    - not ansible_check_mode
  loop:
    - name: Wazuh
      var: soc_agents_wazuh_msi_url
      present: "{{ soc_agents_wazuh_present }}"
    - name: Velociraptor
      var: soc_agents_velociraptor_msi_url
      present: "{{ soc_agents_velociraptor_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Fetch the Wazuh MSI
  ansible.windows.win_get_url:
    url: "{{ soc_agents_wazuh_msi_url }}"
    dest: C:\ProgramData\lab\wazuh-agent.msi
    checksum: "{{ soc_agents_wazuh_msi_sha256 }}"
    checksum_algorithm: sha256
    force: false
  when:
    - not soc_agents_wazuh_present
    - not ansible_check_mode

# The enrolment password is a build-time secret, from phoenix.env, and is masked.
# It registers the agent against the manager; it is not stored after install.
- name: Install the Wazuh agent
  ansible.windows.win_package:
    path: C:\ProgramData\lab\wazuh-agent.msi
    product_id: "{{ soc_agents_wazuh_product_id }}"
    arguments: >-
      /qn WAZUH_MANAGER="{{ soc_agents_wazuh_manager }}"
      WAZUH_REGISTRATION_SERVER="{{ soc_agents_wazuh_manager }}"
      WAZUH_REGISTRATION_PASSWORD="{{ lab_wazuh_registration_password }}"
      WAZUH_AGENT_GROUP="default"
    state: present
  when:
    - not soc_agents_wazuh_present
    - not ansible_check_mode
  no_log: true

- name: The Wazuh service runs
  ansible.windows.win_service:
    name: WazuhSvc
    start_mode: auto
    state: started
  when: soc_agents_wazuh_present or not ansible_check_mode

- name: Fetch the Velociraptor MSI
  ansible.windows.win_get_url:
    url: "{{ soc_agents_velociraptor_msi_url }}"
    dest: C:\ProgramData\lab\velociraptor-client.msi
    checksum: "{{ soc_agents_velociraptor_msi_sha256 }}"
    checksum_algorithm: sha256
    force: false
  when:
    - not soc_agents_velociraptor_present
    - not ansible_check_mode

# The repacked MSI carries its own client.config.yaml (server URL, CA, nonce),
# so it needs no arguments (build-the-soc-guest.md section 11).
- name: Install the Velociraptor client
  ansible.windows.win_package:
    path: C:\ProgramData\lab\velociraptor-client.msi
    product_id: "{{ soc_agents_velociraptor_product_id }}"
    state: present
  when:
    - not soc_agents_velociraptor_present
    - not ansible_check_mode

- name: The Velociraptor service runs
  ansible.windows.win_service:
    name: Velociraptor
    start_mode: auto
    state: started
  when: soc_agents_velociraptor_present or not ansible_check_mode
