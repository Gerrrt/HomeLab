---
# The SOC agents, replacing the two GPOs that deployed them (ADR-0030,
# build-the-soc-guest.md section 11). Ansible installs them directly: the Wazuh
# enrolment password comes from phoenix.env, never SYSVOL, which retires the
# readable-password residual that section 11 accepted.
#
# The MSIs are binaries, built on odin and not in the repo (*.msi is gitignored):
# the Velociraptor one is repacked by Server.Utils.CreateMSI with the client
# config inside it, the Wazuh one by the generator (build-the-soc-guest.md §11).
# There is no standing URL for either, so soc_agents_*_msi_url has no default: it
# is set in group_vars or on the command line to wherever the built MSIs are
# served from, and the role fails with a clear message if it needs one unset.
# The product codes, read from the six on 2026-10-03, decide "already installed"
# so a reinstall is not attempted every run; a version bump moves code and url.
soc_agents_wazuh_manager: 10.0.30.60
soc_agents_wazuh_version: "4.14.7"
soc_agents_wazuh_product_id: "{D9770AF7-8335-4FEB-927C-C575B11A1F7B}"
soc_agents_wazuh_msi_sha256: "e967f36b75589d6210244fd58239c7021fa53a77c38d92315c3b3bd115002ede"
soc_agents_velociraptor_version: "0.77.2"
