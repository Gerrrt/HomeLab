---
# Print the population's starter credentials (#449: "record the starter
# credentials it prints"). Run on phoenix, by hand, when you need them:
#
#   ansible-playbook population-credentials.yml
#   ansible-playbook population-credentials.yml -e population_only=acooper
#
# It touches no guest. Each password is derived from LAB_POPULATION_SEED and the
# sAMAccountName (inventory/group_vars/all.yaml), so this prints exactly what
# roles/population set, and nothing is stored anywhere. The output is a list of
# working domain passwords: do not paste it into an issue, a PR or a chat.

- name: The population's starter credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [population/population.yaml]
  vars:
    population_only: ""
  tasks:
    - name: Refuse to run without the population seed
      ansible.builtin.assert:
        that: lab_population_seed | length >= 16
        fail_msg: LAB_POPULATION_SEED is missing from phoenix.env, or shorter than 16 characters.
        quiet: true

    - name: Print them
      ansible.builtin.debug:
        msg: "{{ lab_netbios }}\\{{ item.sam }}  {{ lab_population_password }}"
      vars:
        population_account: "{{ item.sam }}"
      loop: "{{ population_users | selectattr('sam', 'search', '^' ~ (population_only or '.*') ~ '$') | list }}"
      loop_control:
        label: "{{ item.sam }}"
