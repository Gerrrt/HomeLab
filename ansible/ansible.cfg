# Read from ansible/, so every command below is run from this directory
# (ansible/README.md). Ansible ignores an ansible.cfg in a world-writable
# directory, which a checkout on phoenix is not.
[defaults]
inventory = inventory/hosts.yaml
# Installed by `ansible-galaxy collection install -r requirements.yml -p
# .collections`, gitignored, so the versions are the ones requirements.yml pins
# and not whatever an earlier run left in ~/.ansible.
collections_path = .collections
roles_path = roles
retry_files_enabled = false
# The lab is meant to be broken and reverted. A host key that changed because a
# guest was rebuilt is the expected case, not an attack on a segment whose
# whole purpose is to hold attackers; the known_hosts entry is per-host and
# ssh's own warning would be noise here. See ADR-0076 decision 2.
host_key_checking = false
stdout_callback = ansible.builtin.default
callback_result_format = yaml

[ssh_connection]
pipelining = true
