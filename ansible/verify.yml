---
# Read-only. Runbook §9's checks, and §0's "Do not harden this domain" list as
# assertions: the shipped weaknesses are the exercises, so a guest on which one
# of them has been tidied away FAILS here, by name. A hardening role added by
# reflex would turn this red rather than pass quietly (ADR-0077 decision 4).
#
#   ansible-playbook verify.yml
#
# Each host answers with a map of check -> true/false, and the assert names
# every false one. Nothing is changed, so it is safe to run at any time and is
# the second half of the rebuild proof #448 closes on.

- name: Verify the lab domain, and that nothing has been hardened
  hosts: lab_domain
  gather_facts: false
  vars_files: [population/population.yaml]
  tasks:
    - name: Ask each guest
      ansible.windows.win_powershell:
        parameters:
          Domain: "{{ lab_domain }}"
          Name: "{{ inventory_hostname }}"
          IsDc: "{{ inventory_hostname in groups['dcs'] }}"
          IsPrimary: "{{ inventory_hostname in groups['dc_primary'] }}"
          IsTitan: "{{ inventory_hostname == 'titan' }}"
          LabRole: "{{ lab_role }}"
          PrimaryDc: "{{ groups['dc_primary'][0] }}"
          Gateway: "{{ lab_gateway }}"
          Scraper: "{{ windows_exporter_scraper }}"
          PeopleOu: "OU={{ population_ou }},{{ lab_domain_dn }}"
          Sams: "{{ population_users | map(attribute='sam') | list }}"
          Groups: "{{ population_groups | map(attribute='name') | list }}"
        script: |
          param([string]$Domain, [string]$Name, [string]$IsDc, [string]$IsPrimary,
                [string]$IsTitan, [string]$Gateway, [string]$Scraper, [string]$LabRole,
                [string]$PrimaryDc, [string]$PeopleOu, [string[]]$Sams, [string[]]$Groups)
          $Ansible.Changed = $false
          # Not $isDc: PowerShell names are case-insensitive, so that is the [string]
          # parameter above, and assigning the bool to it turns it back into "False",
          # which is truthy. That ran every DC check on every member (#448's first run).
          $onDc = [bool]::Parse($IsDc)
          $r = [ordered]@{}
          $cs = Get-CimInstance Win32_ComputerSystem
          $if = Get-NetIPConfiguration | Where-Object IPv4DefaultGateway | Select-Object -First 1

          # --- what was built -------------------------------------------------
          $r['named as ADR-0029 names it'] = ($env:COMPUTERNAME -eq $Name.ToUpper())
          $r["a member of $Domain"] = ($cs.Domain -eq $Domain)
          # ADR-0029's machine tiers: DomainRole 4/5 is a DC, 3 a member server,
          # 1 a member workstation. The inventory's lab_role, which is also the
          # Prometheus `role` label, must describe what the guest actually is.
          $want = @{ dc = @(4, 5); member = @(3); endpoint = @(1) }[$LabRole]
          $r["is the $LabRole its inventory says"] = ($want -contains [int]$cs.DomainRole)
          if (-not $onDc) {
            $r['secure channel to a DC'] = [bool](Test-ComputerSecureChannel -ErrorAction SilentlyContinue)
          }
          $svc = Get-Service windows_exporter -ErrorAction SilentlyContinue
          $r['windows_exporter running'] = ($svc.Status -eq 'Running')
          $r['9182 listening'] = [bool](Get-NetTCPConnection -LocalPort 9182 -State Listen `
            -ErrorAction SilentlyContinue)
          $open = Get-NetFirewallPortFilter -Protocol TCP |
            Where-Object LocalPort -eq '9182' | Get-NetFirewallRule |
            Where-Object { $_.Enabled -eq 'True' -and $_.Direction -eq 'Inbound' -and $_.Action -eq 'Allow' } |
            Get-NetFirewallAddressFilter
          # A rule made through the COM API reads back as 10.0.30.40/255.255.255.255.
          $sources = @($open | ForEach-Object { $_.RemoteAddress }) -replace '/(255\.255\.255\.255|32)$', ''
          $r["9182 admits $Scraper and nothing else"] = ($sources.Count -gt 0 -and -not ($sources -ne $Scraper))

          # --- §0: the shipped weaknesses are still shipped -------------------
          $llmnr = (Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient' `
            -ErrorAction SilentlyContinue).EnableMulticast
          $r['LLMNR not turned off'] = ($llmnr -ne 0)
          $nbt = Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces' |
            ForEach-Object { (Get-ItemProperty $_.PSPath).NetbiosOptions }
          $r['NetBIOS over TCP/IP not disabled'] = -not ($nbt -contains 2)
          $v6 = Get-NetAdapterBinding -InterfaceAlias $if.InterfaceAlias -ComponentID ms_tcpip6
          $dc6 = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters' `
            -ErrorAction SilentlyContinue).DisabledComponents
          $r['IPv6 bound and not disabled'] = ($v6.Enabled -and (-not $dc6 -or $dc6 -eq 0))
          # WPAD: the service, and the machine-wide policy that would switch
          # auto-detect off for every user. A per-user unticking of "Automatically
          # detect settings" lives in that user's hive and is not read here.
          $r['WPAD auto-detect service not disabled'] = ((Get-Service WinHttpAutoProxySvc).StartType -ne 'Disabled')
          $autoDetect = (Get-ItemProperty `
            'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\Internet Settings' `
            -ErrorAction SilentlyContinue).AutoDetect
          $r['WPAD auto-detect not turned off by policy'] = ($autoDetect -ne 0)

          if ($onDc) {
            $bl = Get-DnsServerGlobalQueryBlockList
            $r['GlobalQueryBlockList on, and still blocks wpad'] = ($bl.Enable -and ($bl.List -contains 'wpad'))
            $r['no wpad record'] = -not (Get-DnsServerResourceRecord -ZoneName $Domain -Name wpad `
              -ErrorAction SilentlyContinue)
            # --- §3/§4: inward-only DNS, and the clock ----------------------
            $f = Get-DnsServerForwarder
            $r["forwards to $Gateway only"] = ((@($f.IPAddress.IPAddressToString) -join ',') -eq $Gateway)
            $r['no root hints'] = -not (Get-DnsServerRootHint)
            $src = (w32tm /query /source | Out-String).Trim()
            if ([bool]::Parse($IsPrimary)) {
              $r["clock from $Gateway"] = ($src -like "$Gateway*")
            } else {
              # Not merely "not the local clock": a manual peer list here, even a
              # good one, is the second source §4 says must not exist.
              $type = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters').Type
              $r['clock type NT5DS'] = ($type -eq 'NT5DS')
              $r["clock from $PrimaryDc"] = ($src -like "$PrimaryDc*")
            }
            # Not dcdiag: it binds to the partner DC, and an SSH key logon carries
            # no network credentials, so it fails with "DsBindWithSpnEx() ...
            # Access is denied" however healthy replication is. The partner
            # metadata is read from this DC alone.
            $partners = @(Get-ADReplicationPartnerMetadata -Target $env:COMPUTERNAME `
              -ErrorAction SilentlyContinue)
            $r['replication clean'] = ($partners.Count -gt 0 -and
              -not ($partners | Where-Object {
                $_.LastReplicationResult -ne 0 -or $_.ConsecutiveReplicationFailures -ne 0 }))
          }

          if ([bool]::Parse($IsTitan)) {
            # Still a relay target (§5); a servicing update moving this default
            # is exactly the change this is here to catch.
            $r['titan does not require SMB signing'] = -not (Get-SmbServerConfiguration).RequireSecuritySignature
          }

          # --- #449: the population, and the generator that runs as it ----------
          if ([bool]::Parse($IsPrimary)) {
            # Exactly the file's accounts: one missing is a run that did not
            # finish, and one extra is a removal nobody has decided on.
            $people = @(Get-ADUser -Filter * -SearchBase $PeopleOu -ErrorAction SilentlyContinue |
              ForEach-Object { $_.SamAccountName })
            $r['OU=People holds population.yaml, and nothing else'] =
              ((($people | Sort-Object) -join ',') -eq (($Sams | Sort-Object) -join ','))
            $r['every population group exists'] =
              -not ($Groups | Where-Object { -not (Get-ADGroup -Filter "Name -eq '$_'") })
          }
          if ($LabRole -eq 'endpoint') {
            $t = Get-ScheduledTask -TaskName Lab-AuthGenerator -ErrorAction SilentlyContinue
            $r['the authentication generator runs as authgen'] =
              [bool]($t -and $t.Principal.UserId -match 'authgen$')
            $r['its last run succeeded'] =
              [bool]($t -and (Get-ScheduledTaskInfo -TaskName Lab-AuthGenerator).LastTaskResult -eq 0)
          }
          $r
      register: verify_answer
      check_mode: false

    - name: Every check holds
      ansible.builtin.assert:
        that: verify_failed | length == 0
        fail_msg: "{{ inventory_hostname }} fails: {{ verify_failed | join('; ') }}"
        success_msg: "{{ inventory_hostname }}: {{ verify_checks | length }} checks hold"
      vars:
        verify_checks: "{{ verify_answer.output[0] }}"
        verify_failed: "{{ verify_checks | dict2items | rejectattr('value') | map(attribute='key') | list }}"
