---
# --- How phoenix reaches a guest (ADR-0077 decision 2) ----------------------
# OpenSSH, key only, as the built-in Administrator. The template installs
# phoenix's public key into administrators_authorized_keys and SetupComplete.cmd
# starts sshd on every clone (packer/windows/scripts/). After promotion the
# same name logs in as AD\Administrator, which is a member of Administrators, so
# the same key file still applies.
ansible_connection: ssh
ansible_shell_type: powershell
ansible_user: Administrator
ansible_ssh_private_key_file: ~/.ssh/id_ed25519
# Host keys are checked against ansible/.known_hosts and nothing else, not
# ~/.ssh/known_hosts and not whatever the network presents first.
# scripts/lab-known-hosts.sh writes that file from each guest's own key, read
# through the Proxmox guest agent; run it after any of the six is rebuilt
# (ADR-0085, which amends ADR-0077 decision 2). inventory_dir is
# ansible/inventory, so this holds for ad-hoc `ansible` as well as for every
# playbook.
ansible_ssh_common_args: >-
  -o UserKnownHostsFile={{ inventory_dir }}/../.known_hosts
  -o GlobalKnownHostsFile=/dev/null
  -o StrictHostKeyChecking=yes

# --- ADR-0029, encoded, not re-decided --------------------------------------
lab_domain: ad.matrix.elysium
lab_netbios: AD
lab_gateway: 10.0.30.1
lab_prefix_length: 24
# The DCs sync from the gateway, 0x8 = client mode. Set on the PDC emulator
# before anything joins; everything else stays on NT5DS (§3, §4).
lab_ntp_peers: "10.0.30.1,0x8"
lab_dns_forwarder: 10.0.30.1
lab_dc_addresses: [10.0.30.50, 10.0.30.51]
lab_functional_level: WinThreshold

# --- Secrets: from phoenix.env, never from this tree (ADR-0077 decision 3) --
# The local Administrator before promotion and AD\Administrator after it are
# the same password: Install-ADDSForest makes bahamut's local Administrator the
# domain's, so one variable is the truth for both.
lab_admin_password: "{{ lookup('ansible.builtin.env', 'LAB_ADMIN_PASSWORD') }}"
lab_dsrm_password: "{{ lookup('ansible.builtin.env', 'LAB_DSRM_PASSWORD') }}"
# labadmin's, on the two endpoints (roles/endpoint_admin). Set only when the
# account is made, so on the hand-built pair it changes nothing.
lab_endpoint_admin_password: "{{ lookup('ansible.builtin.env', 'LAB_ENDPOINT_ADMIN_PASSWORD') }}"

# --- The population (#449) ----------------------------------------------------
# ansible/population/population.yaml is committed and holds no passwords. Each
# one is derived here, from this seed and the sAMAccountName, so a rerun sets
# the same password it set last time, and population-credentials.yml can print
# them again on phoenix. The task supplies `population_account`. The hex digest
# is lower case, so the suffix adds the upper case, digit and symbol that the
# domain's complexity rule asks for. Change the seed and every password moves.
lab_population_seed: "{{ lookup('ansible.builtin.env', 'LAB_POPULATION_SEED') }}"
lab_population_password: >-
  {{ ((lab_population_seed ~ ':' ~ population_account) | hash('sha256'))[:20] ~ 'Aa1!' }}
lab_domain_dn: "DC={{ lab_domain.split('.') | join(',DC=') }}"

# --- windows_exporter (§7) ---------------------------------------------------
# The version is pinned here, with the MSI's sha256 beside it, because the
# collector list below is only known-good against this release: in 0.31.x `cs`
# no longer exists and `--collectors.time.enabled` is not a flag, and either one
# stops the service binding 9182. Re-read the collector names when this moves.
windows_exporter_version: "0.31.8"
windows_exporter_sha256: 0aadce6afb20182b678bfca9e8f2e8464ef48c469b28b4cf02e99d82158f5d40
# The MSI's ProductCode for this release, read from Win32_Product on all six
# hand-built guests (2026-10-02). roles/exporter decides "installed" by it, so
# it moves with the version: a bump that leaves it stale reinstalls nothing.
windows_exporter_product_id: "{130B5CF0-5B4F-4E85-AE10-3B9CB3FAB69B}"
windows_exporter_collectors: cpu,logical_disk,memory,net,os,service,system,time,textfile
windows_exporter_textfile_dir: C:\ProgramData\windows_exporter\textfile
# The port the exporter listens on, and the one its firewall rule opens.
windows_exporter_port: 9182
# alexander, the lab Prometheus. The only source that rule admits.
windows_exporter_scraper: 10.0.30.40

# --- The skeleton #414 built by hand (runbook §5), reproduced so the #448 ------
# rebuild loses nothing. The population and the switchable weaknesses on top of
# it are #449's (roles/population); these are the tiers, shares and SOC agents.
lab_tier_ous: [Tier0, Tier1, Tier2, Servers, Workstations]
# A distinct password for the three tier admin accounts, set only when they are
# made on a fresh rebuild (roles/tiers use on_create), never the domain admin's.
lab_tier_admin_password: "{{ lookup('ansible.builtin.env', 'LAB_TIER_ADMIN_PASSWORD') }}"
# The Wazuh enrolment password, from phoenix.env rather than readable in SYSVOL
# as the deploy GPO left it (build-the-soc-guest.md §11, now roles/soc_agents).
lab_wazuh_registration_password: "{{ lookup('ansible.builtin.env', 'LAB_WAZUH_REGISTRATION_PASSWORD') }}"

# --- #449's deliberate weaknesses (ADR-0083) --------------------------------
# Each weakness is one tag on lab-domain.yml, with its own
# weakness_<name>_state (default absent, in the role). These are the fixed
# identifiers the roles set and verify.yml proves — one source of truth for
# both, so the proof cannot drift from the thing it proves.
#
# The weak password is deliberately crackable: that is the exercise, not an
# accident, for the two roasting weaknesses, and the login that drives the
# dcsync and delegation exercises. Like every secret it comes from phoenix.env,
# never this tree, and the dedicated accounts share it. A role refuses to
# enable a weakness while it is unset. Nothing is enabled by default: a plain
# run leaves all six absent, which is #449's negative test.
lab_weak_password: "{{ lookup('ansible.builtin.env', 'LAB_WEAK_PASSWORD') }}"
# The dedicated accounts model Tier 1 service identities, so they live in the
# Tier 1 OU the skeleton already owns; absent deletes them and the OU stays.
lab_weakness_ou: "OU=Tier1,{{ lab_domain_dn }}"

# kerberoast: an SPN on an account with a crackable password (ADR-0029 names
# ramuh as the host). asreproast: pre-auth disabled on an account.
lab_weakness_kerberoast_account: svc-sql
lab_weakness_kerberoast_spn: "MSSQLSvc/ramuh.{{ lab_domain }}:1433"
lab_weakness_asreproast_account: svc-backup

# dcsync: the two replication extended rights on the domain head, granted to a
# non-DA account.
lab_weakness_dcsync_account: svc-sync

# ucd: unconstrained delegation on a member server (DCs are trusted for it by
# default, so only a member server teaches anything). The computer object is
# never created or deleted — the flag is set and cleared.
lab_weakness_ucd_computer: RAMUH

# cd: Kerberos-only constrained delegation. svc-web (its own SPN, so it is
# usable for S4U) may delegate to titan's CIFS.
lab_weakness_cd_account: svc-web
lab_weakness_cd_spn: "HTTP/web.{{ lab_domain }}"
lab_weakness_cd_target_spn: "CIFS/titan.{{ lab_domain }}"

# rbcd: titan (the resource) trusts a principal we control to act on its
# behalf. svc-rbcd is a user with an SPN rather than a computer account, so it
# takes the shared weak password cleanly and is still usable for S4U.
lab_weakness_rbcd_account: svc-rbcd
lab_weakness_rbcd_spn: "HOST/svc-rbcd.{{ lab_domain }}"
lab_weakness_rbcd_resource: TITAN
# --- Sysmon (#450, ADR-0080) -------------------------------------------------
# Microsoft publishes Sysmon at one unversioned URL, so this pin goes stale the
# day a new release ships. roles/sysmon then fails at the checksum, before
# anything is installed; the fix is to read the new zip's version and sha256 and
# move both here. A domain that already runs the pinned version never downloads,
# so a stale pin only stops a rebuild or a new guest.
sysmon_version: "15.22"
sysmon_zip_sha256: 00ecf1b46aec99299d3ae0bca79dc621458bd014b20b509d7c5c8e8c8611aa54
# The vendored config's sha256, read from VENDORED rather than written twice.
# Sysmon records the hash of the file it was configured from as ConfigHash, so
# roles/sysmon reapplies on a mismatch and verify.yml fails on one.
sysmon_config_sha256: >-
  {{ lookup('ansible.builtin.file', playbook_dir ~ '/roles/sysmon/files/VENDORED')
     | regex_search('sha256: ([0-9a-f]{64})', '\1') | first }}
