---
# ADR-0029's six, and nothing else. This inventory is the lab domain's, not the
# estate's: no host outside ad.matrix.elysium belongs here, and phoenix pushing
# to one would be the push plane ADR-0043 refuses (ADR-0077 decision 1).
#
# Addresses are the final ones. The DCs set theirs statically (roles/base); the
# four others hold DHCP reservations on morpheus. A rebuilt guest reaches its
# address before Ansible first connects because tofu/ pins each MAC once the
# six are declared there, and the reservations are keyed by MAC (ADR-0077
# decision 6).
#
# `lab_role` is the `role` label stacks/lab/prometheus/prometheus.yaml's
# `windows` job puts on each target, so `role="dc"` means the same thing in a
# PromQL query and in a --limit.
all:
  children:
    lab_domain:
      children:
        dcs:
          children:
            dc_primary:
              hosts:
                bahamut: {ansible_host: 10.0.30.50, lab_role: dc}
            dc_replica:
              hosts:
                leviathan: {ansible_host: 10.0.30.51, lab_role: dc}
        members:
          hosts:
            titan: {ansible_host: 10.0.30.52, lab_role: member}
            ramuh: {ansible_host: 10.0.30.53, lab_role: member}
        endpoints:
          hosts:
            carbuncle: {ansible_host: 10.0.30.54, lab_role: endpoint}
            siren: {ansible_host: 10.0.30.55, lab_role: endpoint}
    # The evaluation-licensed four: the licence clock runs here and only here
    # (build-the-lab-domain.md §7 — activated Windows 11 reads a misleading 0).
    servers:
      children:
        dcs:
        members:
