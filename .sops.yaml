---
# SOPS encryption policy.
#
# Everything under secrets/ matching *.sops.yaml is encrypted with the age
# recipient below, and so is every firewall backup under backups/firewall/.
#
# Those two live in one rule rather than two so the recipient is written once.
# A second rule would be a second copy of the key, and rotating one and not the
# other is the kind of drift this repository keeps finding.
#
# backups/ is gitignored, so nothing matching that half is ever committed — the
# rule is here because sops matches creation_rules to decide whether it may
# encrypt at all, not because the output is tracked.
#
# SOPS encrypts values and leaves keys in plaintext by default, which is exactly
# what we want: `git log -p secrets/observability.sops.yaml` shows *which*
# credential rotated and when, without revealing what it rotated to.
#
# The public key here is safe to commit; it can only encrypt. The matching
# private key lives at ~/.config/sops/age/keys.txt on the deployment host and is
# never in this repository.
#
# Run `make secrets-init` on a fresh machine to generate a keypair and write its
# public half into this file.
#
# ADDING A RECIPIENT
#
# `make secrets-add-recipient PUBKEY=age1...`, not a hand-edit. Editing this
# file without running `sops updatekeys` produces a recipient the repository
# advertises as a recovery path which cannot decrypt anything, and that is the
# DEFAULT outcome of doing it by hand — see
# docs/adr/0024-hold-a-second-age-recipient-and-prove-each-one-separately.md.
#
# Recipients are comma-separated, written one per line in the folded scalar.
# sops reads the value as a single string, splits it on commas and trims each
# part, so the line break is cosmetic and the trailing comma is not. Measured on
# sops 3.9.4; a wrong guess here parses as YAML and decrypts nothing.

creation_rules:
  # The lab stack, FIRST — SOPS takes the first rule whose path_regex matches,
  # so this has to sit above the catch-all below or it would never apply.
  #
  # It exists because the rule below matches all of secrets/, which means any
  # recipient added to it can decrypt every file there. The lab guest needs to
  # decrypt secrets/lab.sops.yaml on `make render STACK=lab`; adding its key to
  # the general rule to achieve that would also hand it the estate's SNMP
  # communities and Grafana admin password — a lab host holding the credentials
  # of the estate it is supposed to be isolated from, which inverts the trust
  # direction ADR-0007 exists to protect. So it gets a rule, and a key, of its
  # own. See docs/adr/0020-run-the-lab-stack-in-a-guest-with-its-own-prometheus.md.
  #
  # This is NOT the "a second rule would be a second copy of the key" case the
  # note above warns about: that argument is against two rules sharing one
  # recipient. These two hold different recipients on purpose, which is the
  # whole point.
  #
  # Placeholder until the lab guest exists. `make secrets-init STACK=lab`, run
  # ON that guest, fills it in — and refuses if the key it would write is
  # already a recipient below, because that would collapse the two rules back
  # into one.
  - path_regex: secrets/lab\..*\.sops\.ya?ml$
    age: >-
      REPLACE_WITH_LAB_AGE_PUBLIC_KEY

  - path_regex: (secrets/.*|backups/firewall/.*)\.sops\.ya?ml$
    age: >-
      age1yrdu996u5mhdh0qf93l7s8zz8stneqnqxpncrcarrmgxvsy264rqmkcs6x
