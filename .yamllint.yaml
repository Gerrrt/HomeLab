---
extends: default

ignore: |
  stacks/observability/snmp-exporter/snmp.yaml
  # SOPS output: machine-generated ciphertext, not hand-written YAML. It does
  # not follow comment/indent conventions and never will.
  secrets/*.sops.yaml
  # The same thing, written by scripts/backup-firewall.sh. This entry is here
  # because that script had never successfully produced a file: the first
  # firewall backup it wrote turned `make validate` red on three indentation
  # errors in ciphertext. backups/ is gitignored, so nothing here is reviewed
  # and nothing here is hand-written.
  backups/
  stacks/observability/snmp-exporter/.rendered/
  node_modules/
  .venv/

rules:
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  comments:
    min-spaces-from-content: 1
  truthy:
    # GitHub Actions' `on:` key is not a boolean.
    allowed-values: ["true", "false"]
    check-keys: false
  document-start:
    present: true
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
